<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Loading Dock / Sunset feel -->
    <radialGradient id="sun-glow" cx="75%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Truck Cab Gradient -->
    <linearGradient id="truck-cab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Truck Cargo Container Gradient -->
    <linearGradient id="truck-box" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  <rect width="240" height="240" rx="24" fill="url(#sun-glow)"/>

  <!-- Background Environment (Warehouse / Loading Bay & Sunset Sky) -->
  <!-- Distant skyline/warehouse silhouette -->
  <path d="M 0 140 L 40 125 L 90 125 L 120 140 L 240 140 L 240 240 L 0 240 Z" fill="#1e293b" opacity="0.6"/>
  <!-- Warehouse Roof Overhang -->
  <path d="M 0 50 L 240 50 L 240 70 L 0 70 Z" fill="#334155"/>
  <rect x="15" y="70" width="25" height="15" rx="3" fill="#fbbf24" opacity="0.8" filter="url(#shadow)"/>
  <rect x="50" y="70" width="25" height="15" rx="3" fill="#fbbf24" opacity="0.8" filter="url(#shadow)"/>

  <!-- Ground / Loading Platform -->
  <rect x="0" y="165" width="240" height="75" fill="#090d16"/>
  <!-- Platform Edge Stripe -->
  <path d="M 0 165 L 240 165 L 240 170 L 0 170 Z" fill="#f59e0b"/>

  <!-- TRUCK & CARGO (卡车正在运货) -->
  <g filter="url(#shadow)">
    <!-- Truck Wheels -->
    <!-- Rear Wheels -->
    <circle cx="70" cy="175" r="14" fill="#0f172a"/>
    <circle cx="70" cy="175" r="7" fill="#64748b"/>
    <circle cx="95" cy="175" r="14" fill="#0f172a"/>
    <circle cx="95" cy="175" r="7" fill="#64748b"/>
    <!-- Front Wheel -->
    <circle cx="185" cy="175" r="14" fill="#0f172a"/>
    <circle cx="185" cy="175" r="7" fill="#64748b"/>

    <!-- Truck Chassis -->
    <rect x="55" y="152" width="145" height="12" rx="4" fill="#334155"/>

    <!-- Truck Cargo Box (Container loaded with goods) -->
    <rect x="45" y="95" width="95" height="65" rx="4" fill="url(#truck-box)"/>
    <!-- Cargo Box Panel Lines -->
    <line x1="75" y1="95" x2="75" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="110" y1="95" x2="110" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Cargo Symbols / Details (Representing goods being transported) -->
    <rect x="55" y="115" width="16" height="16" rx="2" fill="#fb923c"/>
    <rect x="85" y="125" width="18" height="14" rx="2" fill="#10b981"/>

    <!-- Truck Cab -->
    <path d="M 140 110 L 175 110 C 190 110, 200 120, 205 135 L 205 160 L 140 160 Z" fill="url(#truck-cab)"/>
    
    <!-- Windshield & Window -->
    <path d="M 170 115 L 195 115 C 200 115, 202 120, 202 128 L 170 128 Z" fill="#93c5fd"/>
    <!-- Headlight -->
    <rect x="202" y="140" width="5" height="8" rx="2" fill="#fef08a"/>
    <!-- Side Mirror -->
    <path d="M 168 125 L 164 120 L 166 118 L 170 122 Z" fill="#0f172a"/>
  </g>

  <!-- LOADING WORKER & GOODS (Human element actively performing the action) -->
  <g filter="url(#shadow)">
    <!-- Worker Body/Torso (Friendly Stylized Character) -->
    <path d="M 14 135 C 14 125, 26 120, 32 135 L 36 170 L 12 170 Z" fill="#ec4899"/>
    <!-- Worker Head -->
    <circle cx="24" cy="112" r="9" fill="#fbcfe8"/>
    <!-- Worker Cap -->
    <path d="M 14 110 C 14 105, 34 105, 34 110 Z" fill="#0284c7"/>
    <rect x="28" y="108" width="10" height="3" rx="1.5" fill="#0284c7"/>
    <!-- Worker Arm pushing/holding box -->
    <path d="M 28 135 L 42 142 L 38 148 Z" fill="#fbcfe8"/>

    <!-- Package being loaded onto the truck -->
    <rect x="36" y="132" width="22" height="22" rx="3" fill="#fbbf24"/>
    <path d="M 36 140 L 58 140" stroke="#d97706" stroke-width="2"/>
    <path d="M 47 132 L 47 154" stroke="#d97706" stroke-width="2"/>
  </g>

  <!-- Ground Motion / Speed lines indicating active transport (运货) -->
  <line x1="15" y1="185" x2="45" y2="185" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="110" y1="185" x2="135" y2="185" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Additional atmospheric props: Forklift or stacked crates in background -->
  <rect x="210" y="140" width="18" height="25" rx="2" fill="#64748b" opacity="0.5"/>
  <rect x="195" y="148" width="18" height="17" rx="2" fill="#475569" opacity="0.5"/>
</svg>