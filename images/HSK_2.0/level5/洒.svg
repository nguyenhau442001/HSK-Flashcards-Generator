  <circle cx="140" cy="120" r="4" fill="#38bdf8"/>
  <circle cx="160" cy="125" r="3" fill="#38bdf8"/>
  <circle cx="130" cy="135" r="4" fill="#38bdf8"/>
  <circle cx="155" cy="140" r="3" fill="#38bdf8"/>
  
  <!-- Motion lines -->
