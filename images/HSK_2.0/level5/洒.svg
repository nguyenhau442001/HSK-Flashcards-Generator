  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Pot -->
  <path d="M70 180 L170 180 L160 220 L80 220 Z" fill="#fb923c"/>
  <path d="M70 180 L170 180 L175 195 L65 195 Z" fill="#f59e0b"/>
  
