<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>
  
  <!-- Environment: Distant Park Elements -->
  <path d="M0 180 Q60 170 120 185 T240 175 V240 H0 Z" fill="#064e3b" opacity="0.4"/>
  <path d="M0 200 Q80 190 160 205 T240 195 V240 H0 Z" fill="#065f46"/>
  
  <!-- Distant Tree -->
  <rect x="35" y="145" width="6" height="40" fill="#451a03"/>
  <circle cx="38" cy="135" r="18" fill="#065f46"/>
  <circle cx="50" cy="140" r="12" fill="#065f46"/>
  
  <!-- Park Bench -->
  <rect x="170" y="175" width="45" height="4" rx="2" fill="#78350f"/>
  <rect x="170" y="182" width="45" height="4" rx="2" fill="#78350f"/>
  <rect x="175" y="175" width="3" height="15" fill="#451a03"/>
  <rect x="207" y="175" width="3" height="15" fill="#451a03"/>
  
  <!-- Character: The Volunteer -->
  <!-- Legs -->
  <path d="M115 190 L110 225" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <path d="M130 190 L135 225" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Body & Vest -->
  <path d="M105 140 Q122 135 140 140 L145 190 L100 190 Z" fill="#38bdf8"/>
  <path d="M105 140 Q122 135 140 140 L142 185 L103 185 Z" fill="#fbbf24"/> <!-- Volunteer Vest -->
  <rect x="120" y="140" width="4" height="45" fill="#f59e0b" opacity="0.5"/> <!-- Vest Detail -->
  
  <!-- Head -->
  <circle cx="122" cy="120" r="15" fill="#fde68a"/>
  <path d="M112 110 Q122 100 135 112" fill="#451a03"/> <!-- Hair -->
  <circle cx="117" cy="120" r="1.5" fill="#1e293b"/> <!-- Eye -->
  <circle cx="127" cy="120" r="1.5" fill="#1e293b"/> <!-- Eye -->
  <path d="M118 128 Q122 132 126 128" stroke="#1e293b" stroke-width="1" fill="none" stroke-linecap="round"/> <!-- Smile -->
  
  <!-- Arms & Hands -->
  <path d="M105 145 L85 170" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/> <!-- Left Arm -->
  <path d="M140 145 L160 170" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/> <!-- Right Arm -->
  
  <!-- Props: Trash Bag -->
  <path d="M70 175 Q60 175 55 195 Q55 220 75 225 Q95 220 95 195 Q90 175 80 175 Z" fill="#94a3b8"/>
  <path d="M70 175 Q75 185 80 175" fill="none" stroke="#64748b" stroke-width="2"/>
  
  <!-- Props: Trash Picker -->
  <path d="M160 170 L185 210" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <path d="M185 210 L180 215 M185 210 L192 212" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Context: Litter being picked up -->
  <circle cx="188" cy="218" r="3" fill="#ec4899" opacity="0.8"/>
  <rect x="140" y="220" width="6" height="4" rx="1" fill="#fb923c" transform="rotate(15 140 220)"/>
  
  <!-- Lighting Accents -->
  <circle cx="122" cy="110" r="40" fill="#fbbf24" opacity="0.1"/>
  <path d="M200 40 Q210 30 220 40" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M210 50 Q220 40 230 50" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3"/>
