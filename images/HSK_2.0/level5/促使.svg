<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Deep Slate Navy Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Glow Gradients -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow representing catalyst/action -->
  <circle cx="120" cy="120" r="90" fill="url(#cyanGlow)" />
  <circle cx="150" cy="90" r="60" fill="url(#amberGlow)" />

  <!-- ENVIRONMENT: Wooden Desk Surface with Perspective Lines -->
  <g id="desk-environment">
    <path d="M 10 180 L 230 180 L 220 220 L 20 220 Z" fill="#334155" opacity="0.4" />
    <path d="M 0 178 L 240 178" stroke="#475569" stroke-width="2" opacity="0.6" />
    <line x1="60" y1="178" x2="30" y2="220" stroke="#475569" stroke-width="1.5" opacity="0.3" />
    <line x1="180" y1="178" x2="210" y2="220" stroke="#475569" stroke-width="1.5" opacity="0.3" />
  </g>

  <!-- BACKGROUND PROPS: Coffee Cup, Notebook, Plant -->
  <g id="ambient-props">
    <!-- Notebook -->
    <g transform="translate(35, 135) rotate(-10)">
      <rect width="35" height="45" rx="3" fill="#cbd5e1" />
      <rect x="5" y="5" width="25" height="35" rx="2" fill="#f8fafc" />
      <line x1="8" y1="12" x2="25" y2="12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="20" x2="22" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="28" x2="20" y2="28" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Coffee Mug -->
    <g transform="translate(180, 130)">
      <ellipse cx="14" cy="8" rx="10" ry="4" fill="#38bdf8" opacity="0.5" />
      <path d="M 4 8 L 8 32 C 8 35, 10 36, 14 36 C 18 36, 20 35, 20 32 L 24 8 Z" fill="#f1f5f9" />
      <path d="M 21 12 C 26 12, 27 18, 22 22" stroke="#f1f5f9" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Steam -->
      <path d="M 10 0 Q 12 -6 9 -12" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round" />
      <path d="M 18 -2 Q 16 -8 19 -14" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round" />
    </g>
  </g>

  <!-- MAIN SUBJECT: The Domino Effect / Catalyst Machine representing "Pushing/Causing to happen" -->
  <!-- We use a dynamic mechanical activator hitting a series of dominoes/gears culminating in a glowing decision coin/bulb -->
  <g id="main-action-mechanism" filter="url(#dropShadow)">
    
    <!-- Motion Lines / Energy Trail -->
    <path d="M 60 115 Q 90 95 120 115" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8" />
    
    <!-- FIRST DOMINO / PUSHING BLOCK (The Catalyst) -->
    <g transform="translate(60, 110)">
      <!-- Base Shadow -->
      <ellipse cx="10" cy="35" rx="12" ry="5" fill="#000" opacity="0.4" />
      <!-- Block body -->
      <rect x="0" y="0" width="18" height="35" rx="3" fill="#f59e0b" />
      <rect x="3" y="4" width="12" height="27" rx="2" fill="#fbbf24" />
      <!-- Action indicator star/glow icon inside block -->
      <circle cx="9" cy="17.5" r="3" fill="#fff" opacity="0.8" />
    </g>

    <!-- DYNAMIC PUSHING FINGER / ROD (The Action of 'Thúc đẩy') -->
    <g transform="translate(30, 95)">
      <path d="M 0 10 C 15 10, 25 15, 38 18 L 38 26 C 25 24, 15 20, 0 20 Z" fill="#fb923c" />
      <!-- Kinetic impact lines -->
      <line x1="39" y1="14" x2="48" y2="12" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
      <line x1="41" y1="22" x2="50" y2="24" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- FALLING MIDDLE DOMINO -->
    <g transform="translate(100, 95) rotate(28)">
      <rect x="0" y="0" width="16" height="32" rx="3" fill="#ec4899" />
      <rect x="3" y="3" width="10" height="26" rx="2" fill="#f472b6" />
    </g>

    <!-- SPARK / CATALYST BURST -->
    <g transform="translate(125, 85)">
      <circle cx="0" cy="0" r="10" fill="#f59e0b" opacity="0.4" />
      <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z" fill="#fbbf24" />
    </g>

    <!-- FINAL RESULT: The Decision / Action Trigger (Glowing Rocket/Lightbulb/Target icon) -->
    <!-- Represents the ultimate decision or outcome that was 'triggered' -->
    <g transform="translate(150, 75)">
      <!-- Platform -->
      <ellipse cx="20" cy="65" rx="25" ry="8" fill="#334155" />
      <ellipse cx="20" cy="63" rx="20" ry="5" fill="#475569" />

      <!-- Glowing Action Orb / Decision Star -->
      <g transform="translate(20, 30)">
        <!-- Outer aura -->
        <circle cx="0" cy="0" r="22" fill="#10b981" opacity="0.25" />
        <circle cx="0" cy="0" r="16" fill="#10b981" opacity="0.4" />
        
        <!-- Core Object: Rocket launching up (Decision made!) -->
        <circle cx="0" cy="0" r="12" fill="#34d399" />
        
        <!-- Simple stylized rocket shape -->
        <path d="M 0 -8 C 4 -8, 6 -2, 6 4 C 6 6, 4 8, 4 8 L -4 8 C -4 8, -6 6, -6 4 C -6 -2, -4 -8, 0 -8 Z" fill="#f8fafc" />
        <!-- Rocket window -->
        <circle cx="0" cy="-1" r="2.5" fill="#0f172a" />
        <!-- Rocket fins -->
        <path d="M -6 5 L -9 9 L -5 7 Z" fill="#10b981" />
        <path d="M 6 5 L 9 9 L 5 7 Z" fill="#10b981" />
        <!-- Flame -->
        <path d="M -3 8 L 0 14 L 3 8 Z" fill="#f59e0b" />
      </g>
    </g>
  </g>

  <!-- FOREGROUND ACCENTS & PARTICLES -->
  <g id="sparkles-and-motion">
    <!-- Floating energetic particles -->
    <circle cx="80" cy="60" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="185" cy="50" r="2" fill="#fbbf24" opacity="0.9" />
    <circle cx="130" cy="150" r="2.5" fill="#34d399" opacity="0.7" />
    <circle cx="50" cy="100" r="1.5" fill="#f472b6" opacity="0.8" />
    
    <!-- Action Swoosh Line curving across the scene -->
    <path d="M 45 130 Q 110 160 195 110" stroke="#10b981" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6 6" />
  </g>
</svg>