<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Glow for Pressure / Resilience -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Heavy Block Gradient (Dark Steel) -->
    <linearGradient id="heavy-block" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="char-shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting & Environment Details -->
  <circle cx="120" cy="130" r="90" fill="url(#amber-glow)"/>
  
  <!-- Subtle Wall Grids / Background Lines for Spatial Depth -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="190" x2="170" y2="190" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Falling Dust / Sparks (Action & Weight) -->
  <circle cx="95" cy="70" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="150" cy="65" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="105" cy="140" r="1" fill="#38bdf8" opacity="0.7"/>
  <circle cx="140" cy="145" r="1.5" fill="#38bdf8" opacity="0.5"/>

  <!-- SCENE: Character Supporting Heavy Weight (Visualizing 'Chịu đựng / Gánh chịu') -->
  
  <!-- Floor Shadow -->
  <ellipse cx="120" cy="182" rx="35" ry="6" fill="#020617" opacity="0.6"/>

  <!-- Character Legs (Firmly planted, bending under pressure) -->
  <g fill="none" stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Leg -->
    <path d="M107 150 L95 180 L108 181" stroke="#0284c7" stroke-width="8"/>
    <!-- Right Leg -->
    <path d="M133 150 L145 180 L132 181" stroke="#0284c7" stroke-width="8"/>
  </g>

  <!-- Character Torso & Head (Determined expression, crouching stance) -->
  <g>
    <!-- Body / Back bent under heavy load -->
    <path d="M103 120 C100 135 105 155 120 155 C135 155 140 135 137 120 Z" fill="url(#char-shirt)"/>
    
    <!-- Head (Tilted forward, focused) -->
    <circle cx="120" cy="105" r="12" fill="#fde047"/>
    <!-- Determined Face Details (Eyebrows angled down in effort) -->
    <path d="M115 103 L119 105" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M125 103 L121 105" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="118" y1="110" x2="122" y2="110" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms braced upwards -->
    <!-- Left Arm -->
    <path d="M108 122 L92 105" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <!-- Right Arm -->
    <path d="M132 122 L148 105" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Hands pushing up -->
    <circle cx="91" cy="103" r="4" fill="#fde047"/>
    <circle cx="149" cy="103" r="4" fill="#fde047"/>
  </g>

  <!-- The Heavy Load (Massive block representing 'Áp lực' / Pressure & Burden) -->
  <g>
    <!-- Block Main Body -->
    <rect x="75" y="60" width="90" height="45" rx="6" fill="url(#heavy-block)" stroke="#64748b" stroke-width="2"/>
    
    <!-- Block Highlight / Industrial Details -->
    <path d="M85 68 L155 68" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <path d="M85 76 L130 76" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Warning/Energy Accents on the Heavy Block -->
    <circle cx="92" cy="88" r="3" fill="#f59e0b"/>
    <circle cx="148" cy="88" r="3" fill="#f59e0b"/>
    <path d="M102 88 L138 88" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Energy / Pressure Waves radiating from the core (Visualizing endurance & stress) -->
  <path d="M60 80 C50 100 50 120 60 140" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M180 80 C190 100 190 120 180 140" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="75" cy="130" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="165" cy="125" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="85" cy="165" r="1" fill="#fbbf24" opacity="0.9"/>
  <circle cx="155" cy="160" r="1.5" fill="#fbbf24" opacity="0.7"/>
</svg>