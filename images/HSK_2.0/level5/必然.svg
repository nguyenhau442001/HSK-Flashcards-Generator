<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Amber Gradient (representing inevitable success/domino energy) -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Cyan Energy Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Green Success Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#38bdf8" stroke-dasharray="4 8" stroke-width="2"/>
    <circle cx="120" cy="120" r="70" fill="none" stroke="#fbbf24" stroke-dasharray="2 6" stroke-width="1.5"/>
  </g>

  <!-- SCENE: Rube Goldberg / Domino Physics setup representing "Inevitability" (必然) -->
  <!-- Falling domino path leading to a glowing success trophy / crystal star -->
  
  <g filter="url(#dropShadow)">
    <!-- Base Platform Curve -->
    <path d="M 25 185 Q 120 205 215 185" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M 35 193 Q 120 213 205 193" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

    <!-- Domino 1 (Failing backwards, starting the chain) -->
    <g transform="translate(42, 160) rotate(-25)">
      <rect x="-8" y="-25" width="16" height="50" rx="3" fill="#64748b"/>
      <rect x="-6" y="-23" width="12" height="46" rx="2" fill="#94a3b8"/>
      <circle cx="0" cy="0" r="3" fill="#cbd5e1"/>
    </g>

    <!-- Domino 2 (Tipping) -->
    <g transform="translate(68, 155) rotate(-45)">
      <rect x="-8" y="-25" width="16" height="50" rx="3" fill="#475569"/>
      <rect x="-6" y="-23" width="12" height="46" rx="2" fill="#64748b"/>
      <circle cx="0" cy="0" r="3" fill="#94a3b8"/>
    </g>

    <!-- Domino 3 (Mid-fall cascade) -->
    <g transform="translate(95, 150) rotate(-70)">
      <rect x="-8" y="-25" width="16" height="50" rx="3" fill="#cbd5e1"/>
      <rect x="-6" y="-23" width="12" height="46" rx="2" fill="#f8fafc"/>
      <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
    </g>

    <!-- Action Motion Arcs -->
    <path d="M 105 130 Q 125 105 145 125" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Little bouncing energy sphere triggering the final state -->
    <circle cx="140" cy="122" r="8" fill="url(#cyanGrad)" filter="url(#glow)"/>

    <!-- Domino 4 (About to strike the grand activator) -->
    <g transform="translate(145, 165) rotate(-15)">
      <rect x="-8" y="-25" width="16" height="50" rx="3" fill="#fb923c"/>
      <rect x="-6" y="-23" width="12" height="46" rx="2" fill="#fed7aa"/>
      <circle cx="0" cy="0" r="3" fill="#ea580c"/>
    </g>

    <!-- THE INEVITABLE DESTINATION: Glowing Golden Trophy / Star Structure -->
    <g transform="translate(185, 140)">
      <!-- Trophy Base -->
      <path d="M -12 30 L 12 30 L 8 42 L -8 42 Z" fill="#475569"/>
      <rect x="-4" y="15" width="8" height="15" fill="#64748b"/>
      
      <!-- Trophy Cup -->
      <path d="M -15 0 C -15 15 15 15 15 0 L 12 -12 C 12 -12 8 -8 0 -8 C -8 -8 -12 -12 -12 -12 Z" fill="url(#amberGlow)" filter="url(#glow)"/>
      <path d="M -15 0 C -15 15 15 15 15 0 L 12 -12 C 12 -12 8 -8 0 -8 C -8 -8 -12 -12 -12 -12 Z" fill="url(#amberGlow)"/>
      
      <!-- Handles -->
      <path d="M -12 -8 C -22 -8 -22 2 -12 2" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <path d="M 12 -8 C 22 -8 22 2 12 2" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

      <!-- Floating Star above Trophy (The Inevitable Success) -->
      <g transform="translate(0, -32)" filter="url(#glow)">
        <polygon points="0,-14 4,-4 14,-4 6,2 9,12 0,6 -9,12 -6,2 -14,-4 -4,-4" fill="url(#amberGlow)"/>
      </g>
      <polygon points="0,-32 3,-24 11,-24 5,-20 7,-12 0,-16 -7,-12 -5,-20 -11,-24 -3,-24" fill="#fef08a"/>
    </g>
  </g>

  <!-- Sparkles & Action Details (Showing absolute certainty & momentum) -->
  <g>
    <!-- Sparkle top right -->
    <path d="M 195 75 Q 195 85 205 85 Q 195 85 195 95 Q 195 85 185 85 Q 195 85 195 75 Z" fill="#38bdf8" opacity="0.9"/>
    <!-- Sparkle mid left -->
    <path d="M 55 95 Q 55 102 62 102 Q 55 102 55 109 Q 55 102 48 102 Q 55 102 55 95 Z" fill="#fbbf24" opacity="0.8"/>
    <!-- Small glowing dots -->
    <circle cx="120" cy="85" r="3" fill="#34d399" opacity="0.7" filter="url(#glow)"/>
    <circle cx="160" cy="100" r="2" fill="#fbbf24" opacity="0.9"/>
    <circle cx="80" cy="120" r="2.5" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- Foreground dynamic energy line sweeping through -->
  <path d="M 25 150 Q 80 80 185 100" fill="none" stroke="url(#greenGrad)" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Character / Mascot Element (Confident, cute builder/explorer pointing forward to the inevitable result) -->
  <g transform="translate(75, 115)" filter="url(#dropShadow)">
    <!-- Mascot Body / Hoodie (Friendly teal/slate) -->
    <path d="M -15 35 C -15 15 15 15 15 35 L 20 60 C 20 65 15 70 10 70 L -10 70 C -15 70 -20 65 -20 60 Z" fill="#0ea5e9"/>
    <path d="M -10 30 L 10 30 L 15 65 L -15 65 Z" fill="#0284c7"/>

    <!-- Head / Face (Warm cream/orange tone) -->
    <circle cx="0" cy="5" r="18" fill="#fcd34d"/>
    <circle cx="0" cy="5" r="18" fill="url(#amberGlow)" opacity="0.3"/>

    <!-- Visor / Glasses (Cool tech gear) -->
    <rect x="-10" y="0" width="20" height="8" rx="4" fill="#0f172a"/>
    <circle cx="-4" cy="4" r="2" fill="#38bdf8"/>
    <circle cx="4" cy="4" r="2" fill="#38bdf8"/>

    <!-- Cheeks (Cute blush) -->
    <circle cx="-10" cy="10" r="3" fill="#f43f5e" opacity="0.6"/>
    <circle cx="10" cy="10" r="3" fill="#f43f5e" opacity="0.6"/>

    <!-- Pointing Arm (Confident gesture showing the domino effect) -->
    <path d="M 12 30 Q 30 20 35 30" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="35" cy="30" r="4" fill="#fcd34d"/>
  </g>

  <!-- Additional ambient lighting rim -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>