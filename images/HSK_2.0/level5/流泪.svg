<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Soft Tear Drop Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Dark Mode Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Props -->
  <!-- Cozy Room Interior Elements -->
  <!-- Bookshelf / Wall Texture Lines -->
  <path d="M20 50 L220 50" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  
  <!-- Window with Night City/Moonlight context -->
  <rect x="160" y="70" width="50" height="70" rx="4" fill="#0b0f19" stroke="#334155" stroke-width="2" />
  <!-- Window Pane Cross -->
  <line x1="185" y1="70" x2="185" y2="140" stroke="#334155" stroke-width="2" />
  <line x1="160" y1="105" x2="210" y2="105" stroke="#334155" stroke-width="2" />
  
  <!-- Soft Moonlight beam crossing room -->
  <polygon points="160,70 110,220 220,220" fill="url(#windowLight)" />

  <!-- Houseplant on a small shelf -->
  <path d="M25 115 L45 115 L40 135 L30 135 Z" fill="#475569" />
  <!-- Plant Leaves -->
  <path d="M35 115 Q25 95 15 105 Q25 115 35 115" fill="#10b981" />
  <path d="M35 115 Q40 90 50 95 Q45 110 35 115" fill="#059669" />
  <path d="M35 115 Q35 90 35 85 Q35 100 35 115" fill="#34d399" />

  <!-- Warm Desk Lamp / Glow Source -->
  <path d="M190 190 L210 190 L200 160 Z" fill="#64748b" />
  <path d="M185 160 C185 150 215 150 215 160 Z" fill="#fbbf24" opacity="0.8" />
  <!-- Lamp Light Pool on Desk -->
  <ellipse cx="200" cy="195" rx="30" ry="10" fill="#fbbf24" opacity="0.15" />

  <!-- Wooden Desk Surface -->
  <rect x="70" y="190" width="150" height="12" rx="3" fill="#334155" />
  <rect x="60" y="202" width="170" height="8" rx="2" fill="#1e293b" />

  <!-- Open Notebook / Journal on Desk -->
  <path d="M95 195 L145 190 L145 200 L95 205 Z" fill="#f8fafc" />
  <path d="M145 190 L195 195 L195 205 L145 200 Z" fill="#e2e8f0" />
  <!-- Notebook lines -->
  <line x1="105" y1="198" x2="135" y2="195" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="105" y1="201" x2="135" y2="198" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="155" y1="197" x2="185" y2="200" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Coffee Mug with Steam -->
  <rect x="75" y="172" width="16" height="18" rx="3" fill="#cbd5e1" />
  <path d="M91 176 C96 176 96 184 91 184" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <!-- Steam lines -->
  <path d="M80 166 Q83 160 80 154" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M86 168 Q89 162 86 156" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />


  <!-- MAIN CHARACTER: Sad Young Woman (Expression of "Liúlèi" / Rơi lệ) -->
  <g transform="translate(0, 5)">
    
    <!-- Chair Back -->
    <path d="M80 100 L120 100 L115 190 L85 190 Z" fill="#334155" opacity="0.8" rx="6" />

    <!-- Character Body / Blue Sweater -->
    <path d="M75 160 C70 140 85 125 100 125 C115 125 130 140 125 160 L135 195 C135 198 132 200 128 200 L72 200 C68 200 65 198 65 195 Z" fill="url(#sweaterGrad)" />

    <!-- Cozy Collar Details -->
    <path d="M88 125 C88 133 112 133 112 125 C112 122 108 120 100 120 C92 120 88 122 88 125 Z" fill="#0284c7" />

    <!-- Character Neck -->
    <rect x="92" y="112" width="16" height="16" fill="#fcd34d" rx="4" />

    <!-- Character Head / Face -->
    <path d="M82 85 C82 68 118 68 118 85 C118 102 118 105 100 108 C82 105 82 102 82 85 Z" fill="#fde68a" />

    <!-- Hair Back / Base -->
    <path d="M78 80 C78 55 122 55 122 80 C122 105 120 120 115 130 L85 130 C80 120 78 105 78 80 Z" fill="url(#hairGrad)" />
    <!-- Hair Bangs & Styling -->
    <path d="M80 75 Q100 60 120 75 Q115 95 100 90 Q85 95 80 75 Z" fill="url(#hairGrad)" />
    <path d="M76 80 Q74 100 82 120 Q80 100 76 80 Z" fill="#0f172a" />
    <path d="M124 80 Q126 100 118 120 Q120 100 124 80 Z" fill="#0f172a" />

    <!-- Sad Drooping Eyebrows -->
    <path d="M88 84 Q93 81 97 84" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <path d="M103 84 Q107 81 112 84" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

    <!-- Closed / Sad Eyes with Eyelashes -->
    <path d="M89 89 Q93 92 97 89" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round" />
    <path d="M103 89 Q107 92 111 89" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round" />

    <!-- Gentle Blush on Cheeks -->
    <ellipse cx="89" cy="95" rx="4" ry="2" fill="#f43f5e" opacity="0.3" />
    <ellipse cx="111" cy="95" rx="4" ry="2" fill="#f43f5e" opacity="0.3" />

    <!-- Sad Downturned Small Mouth -->
    <path d="M97 101 Q100 98 103 101" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

    <!-- TEARS / LIÚLÈI (The Core Visual Action: Rơi lệ) -->
    <!-- Left Tear rolling down -->
    <g filter="url(#glow)">
      <path d="M93 92 C93 92 91 97 91 99 C91 101 93 102 95 102 C97 102 99 101 99 99 C99 97 93 92 93 92 Z" fill="#38bdf8" opacity="0.9" />
      <circle cx="95" cy="107" r="2.5" fill="#38bdf8" opacity="0.95" />
      <path d="M95 113 C95 113 94 116 94 117 C94 118 95 119 96 119 C97 119 98 118 98 117 C98 116 95 113 95 113 Z" fill="#38bdf8" opacity="0.8" />
    </g>

    <!-- Right Tear rolling down -->
    <g filter="url(#glow)">
      <path d="M107 92 C107 92 105 97 105 99 C105 101 107 102 109 102 C111 102 113 101 113 99 C113 97 107 92 107 92 Z" fill="#38bdf8" opacity="0.9" />
      <circle cx="109" cy="105" r="2" fill="#38bdf8" opacity="0.95" />
    </g>

    <!-- Arms & Hands supporting the head (Classic sorrowful posture) -->
    <!-- Left arm/hand near chin -->
    <path d="M75 155 Q85 140 92 115" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <!-- Hand gently touching cheek -->
    <circle cx="92" cy="112" r="6" fill="#fcd34d" />

    <!-- Right arm bent -->
    <path d="M125 155 Q115 140 108 115" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
  </g>

</svg>