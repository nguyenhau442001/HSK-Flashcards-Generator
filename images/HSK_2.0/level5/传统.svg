<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Lantern Red Glow Gradient -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Scroll Paper Gradient -->
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="10% " stop-color="#fffbeb"/>
      <stop offset="90%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Tea Ceramic Gradient -->
    <linearGradient id="teaPot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Window Frame & Scenery) -->
  <g opacity="0.15">
    <circle cx="190" cy="60" r="40" fill="#f59e0b"/>
    <path d="M20 130 H220 M20 160 H220" stroke="#94a3b8" stroke-width="2"/>
    <path d="M70 20 V160 M170 20 V160" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Ambient Lantern Light -->
  <circle cx="120" cy="70" r="80" fill="url(#lanternGlow)"/>

  <!-- Hanging Red Lantern (Traditional Symbol) -->
  <g filter="url(#softShadow)">
    <!-- String -->
    <line x1="120" y1="0" x2="120" y2="30" stroke="#64748b" stroke-width="2"/>
    <!-- Top Cap -->
    <path d="M110 30 H130 L135 36 H105 Z" fill="#b91c1c"/>
    <!-- Lantern Body -->
    <path d="M105 36 C80 36 80 84 105 84 L135 84 C160 84 160 36 135 36 Z" fill="#ef4444"/>
    <!-- Lantern Ribs (Golden Accents) -->
    <path d="M120 36 V84" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    <path d="M105 36 C115 45 115 75 105 84" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    <path d="M135 36 C125 45 125 75 135 84" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    <!-- Bottom Cap -->
    <path d="M110 84 H130 L125 90 H115 Z" fill="#b91c1c"/>
    <!-- Tassel -->
    <line x1="120" y1="90" x2="120" y2="108" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="120,116 116,106 124,106" fill="#f59e0b"/>
  </g>

  <!-- Wooden Table Surface -->
  <path d="M10 180 L230 180 L220 220 L20 220 Z" fill="url(#tableGrad)" filter="url(#softShadow)"/>
  <rect x="0" y="176" width="240" height="6" fill="#475569" rx="3"/>

  <!-- Traditional Hand Scroll (Unrolled) -->
  <g filter="url(#softShadow)" transform="translate(0, 5)">
    <!-- Scroll Paper Body -->
    <path d="M40 145 L200 145 L200 185 L40 185 Z" fill="url(#scrollGrad)"/>
    
    <!-- Abstract Chinese Landscape Painting on Scroll -->
    <path d="M60 175 Q75 155 90 175 T120 170 T150 175 T180 165" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- Sun/Moon on Scroll -->
    <circle cx="165" cy="157" r="6" fill="#ef4444" opacity="0.8"/>
    <!-- Little Pine Tree / Brush strokes -->
    <path d="M100 175 L103 160 L106 175 Z" fill="#1e293b" opacity="0.7"/>
    <path d="M135 173 L138 158 L141 173 Z" fill="#1e293b" opacity="0.7"/>

    <!-- Left Scroll Roller -->
    <rect x="34" y="140" width="8" height="50" rx="3" fill="#b45309"/>
    <circle cx="38" cy="140" r="4" fill="#d97706"/>
    <circle cx="38" cy="190" r="4" fill="#d97706"/>

    <!-- Right Scroll Roller -->
    <rect x="198" y="140" width="8" height="50" rx="3" fill="#b45309"/>
    <circle cx="202" cy="140" r="4" fill="#d97706"/>
    <circle cx="202" cy="190" r="4" fill="#d97706"/>
  </g>

  <!-- Traditional Tea Set (Teapot & Cup) -->
  <g filter="url(#softShadow)" transform="translate(-15, 10)">
    <!-- Tea Pot Body -->
    <path d="M75 155 C70 140 90 130 95 145 C105 130 125 140 120 155 C125 170 70 170 75 155 Z" fill="url(#teaPot)"/>
    <!-- Teapot Lid -->
    <ellipse cx="97" cy="142" rx="10" ry="3" fill="#0284c7"/>
    <circle cx="97" cy="138" r="2.5" fill="#f59e0b"/>
    <!-- Teapot Spout -->
    <path d="M120 148 C135 145 140 135 142 130" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Teapot Handle -->
    <path d="M75 146 C60 146 60 162 76 162" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Teacup -->
    <path d="M45 158 L53 172 C53 172 67 172 67 172 L75 158 Z" fill="#38bdf8"/>
    <ellipse cx="60" cy="158" rx="15" ry="4" fill="#7dd3fc"/>
    <!-- Tea liquid inside cup -->
    <ellipse cx="60" cy="159" rx="12" ry="3" fill="#d97706" opacity="0.8"/>
  </g>

  <!-- Cultural Accents (Floating Chinese Seal / Stamp Impression Graphic) -->
  <g filter="url(#softShadow)" transform="translate(170, 115)">
    <rect width="22" height="22" rx="4" fill="#dc2626"/>
    <!-- Stylized traditional seal lines inside -->
    <path d="M6 6 H16 M6 11 H16 M6 16 H16 M11 6 V16" stroke="#fef2f2" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkles / Cultural Atmosphere Particles -->
  <g fill="#f59e0b">
    <circle cx="50" cy="90" r="2" opacity="0.8"/>
    <circle cx="160" cy="80" r="3" opacity="0.6"/>
    <circle cx="190" cy="120" r="1.5" opacity="0.9"/>
    <circle cx="95" cy="115" r="2" opacity="0.5"/>
    <!-- Star sparkles -->
    <path d="M 160 50 L 162 55 L 167 57 L 162 59 L 160 64 L 158 59 L 153 57 L 158 55 Z" fill="#fde047" opacity="0.7"/>
    <path d="M 70 80 L 71 83 L 74 84 L 71 85 L 70 88 L 69 85 L 66 84 L 69 83 Z" fill="#fde047" opacity="0.5"/>
  </g>
</svg>