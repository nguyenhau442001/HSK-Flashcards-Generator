<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- High diving board platform -->
  <path d="M20 120 L120 120 L120 130 L20 130 Z" fill="#475569"/>
  <path d="M120 120 L120 240 L135 240 L135 120 Z" fill="#334155"/>
  
  <!-- Character: A small, determined figure standing at the edge -->
  <circle cx="110" cy="105" r="12" fill="#fbbf24"/>
  <path d="M105 115 L105 140 M115 115 L115 140 M105 140 L95 170 M115 140 L125 170" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  
  <!-- The "Courage" element: A glowing, stylized leap into the void -->
  <path d="M130 125 C 160 120, 190 150, 200 200" stroke="#38bdf8" stroke-width="8" stroke-dasharray="10 10" fill="none"/>
  
  <!-- Atmospheric details: Distant clouds/depth -->
  <circle cx="180" cy="60" r="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="40" cy="50" r="15" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Energetic accent: A spark of light at the edge of the board -->
  <circle cx="120" cy="120" r="6" fill="#f59e0b"/>
  <path d="M120 110 L120 100 M130 120 L140 120" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
</svg>