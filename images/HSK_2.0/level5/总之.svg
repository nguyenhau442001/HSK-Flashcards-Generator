<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Stack of Papers/Documents representing "In summary" -->
  <g transform="translate(60, 80)">
    <rect x="0" y="20" width="120" height="100" rx="4" fill="#cbd5e1"/>
    <rect x="5" y="25" width="110" height="8" fill="#94a3b8"/>
    <rect x="5" y="40" width="110" height="8" fill="#94a3b8"/>
    <rect x="5" y="55" width="80" height="8" fill="#94a3b8"/>
    
    <rect x="-5" y="10" width="120" height="100" rx="4" fill="#e2e8f0"/>
    <rect x="0" y="15" width="110" height="8" fill="#94a3b8"/>
    <rect x="0" y="30" width="110" height="8" fill="#94a3b8"/>
    <rect x="0" y="45" width="80" height="8" fill="#94a3b8"/>
    
    <!-- Top Sheet with Checkmark/Summary feel -->
    <rect x="-10" y="0" width="120" height="100" rx="4" fill="#f8fafc"/>
    <rect x="-5" y="10" width="110" height="8" fill="#cbd5e1"/>
    <rect x="-5" y="25" width="110" height="8" fill="#cbd5e1"/>
    <rect x="-5" y="40" width="60" height="8" fill="#cbd5e1"/>
    
    <!-- Highlight Accent -->
    <circle cx="100" cy="80" r="15" fill="#f59e0b"/>
    <path d="M95 80 L98 83 L105 76" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Coffee Mug -->
  <rect x="180" y="130" width="40" height="50" rx="4" fill="#38bdf8"/>
  <path d="M220 140 Q235 140 235 155 Q235 170 220 170" stroke="#38bdf8" stroke-width="6" fill="none"/>
  
  <!-- Pen -->
  <rect x="30" y="160" width="60" height="6" rx="3" fill="#ec4899" transform="rotate(-20 60 163)"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.5"/>
</svg>