<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow Gradient -->
    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon/Sky Light -->
    <radialGradient id="moonGlow" cx="0.2" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Pagoda Roof Gradient -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Temple Pillar/Wall Gradient -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Water Reflection Gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Lighting -->
  <circle cx="50" cy="50" r="120" fill="url(#moonGlow)"/>

  <!-- Distant Mountains/Hills (Landscape Heritage Context) -->
  <path d="M0 160 Q 40 130, 90 150 T 180 140 Q 210 130, 240 150 L 240 200 L 0 200 Z" fill="#1e293b" opacity="0.7"/>
  <path d="M0 170 Q 60 145, 120 165 T 240 155 L 240 200 L 0 200 Z" fill="#334155" opacity="0.5"/>

  <!-- Starry Details -->
  <circle cx="40" cy="35" r="1" fill="#38bdf8" opacity="0.8"/>
  <circle cx="85" cy="20" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="190" cy="45" r="1" fill="#38bdf8" opacity="0.9"/>
  <circle cx="215" cy="25" r="1.2" fill="#fff" opacity="0.6"/>

  <!-- Water Surface & Reflection Base -->
  <path d="M0 185 C 60 180, 180 190, 240 185 L 240 240 L 0 240 Z" fill="url(#waterGrad)"/>
  <ellipse cx="120" cy="187" rx="90" ry="4" fill="#38bdf8" opacity="0.1"/>

  <!-- SCENE OBJECT: Historic Chinese Pagoda & Bridge (名胜古迹) -->
  <!-- Stone Arch Bridge Base -->
  <path d="M 60 185 Q 120 155, 180 185" stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 75 186 Q 120 165, 165 186" fill="url(#skyGrad)"/> <!-- Bridge Arch Hole -->
  <!-- Bridge Railings -->
  <line x1="70" y1="180" x2="170" y2="180" stroke="#94a3b8" stroke-width="3"/>
  <line x1="90" y1="177" x2="90" y2="183" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="175" x2="120" y2="183" stroke="#94a3b8" stroke-width="2"/>
  <line x1="150" y1="177" x2="150" y2="183" stroke="#94a3b8" stroke-width="2"/>

  <!-- Pagoda Structure -->
  <!-- Base Tier -->
  <rect x="95" y="145" width="50" height="40" fill="url(#wallGrad)" rx="2"/>
  <rect x="105" y="160" width="10" height="25" fill="#fde047" opacity="0.8"/> <!-- Lit Window -->
  <rect x="125" y="160" width="10" height="25" fill="#fde047" opacity="0.8"/>

  <!-- Tier 1 Roof -->
  <path d="M 85 147 Q 120 135, 155 147 L 160 155 Q 120 143, 80 155 Z" fill="url(#roofGrad)" stroke="#7c2d12" stroke-width="1" stroke-linejoin="round"/>
  <!-- Tier 1 Roof Curved Eaves -->
  <path d="M 80 155 C 75 153, 75 148, 77 146" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 160 155 C 165 153, 165 148, 163 146" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tier 2 -->
  <rect x="102" y="115" width="36" height="30" fill="url(#wallGrad)" rx="2"/>
  <rect x="113" y="125" width="14" height="15" fill="#fde047" opacity="0.8"/>

  <!-- Tier 2 Roof -->
  <path d="M 94 117 Q 120 107, 146 117 L 151 124 Q 120 114, 89 124 Z" fill="url(#roofGrad)" stroke="#7c2d12" stroke-width="1" stroke-linejoin="round"/>
  <!-- Tier 2 Roof Curved Eaves -->
  <path d="M 89 124 C 85 122, 85 117, 87 115" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
  <path d="M 151 124 C 155 122, 155 117, 153 115" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>

  <!-- Tier 3 (Top) -->
  <rect x="108" y="90" width="24" height="25" fill="url(#wallGrad)" rx="2"/>
  <rect x="116" y="98" width="8" height="10" fill="#fde047" opacity="0.8"/>

  <!-- Top Roof & Spire -->
  <path d="M 100 92 Q 120 84, 140 92 L 144 98 Q 120 90, 96 98 Z" fill="url(#roofGrad)" stroke="#7c2d12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 120 65 L 120 90" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/> <!-- Spire -->
  <circle cx="120" cy="63" r="3" fill="#fbbf24"/> <!-- Finial -->

  <!-- Hanging Red Lanterns (Atmospheric Details) -->
  <g transform="translate(0, 0)">
    <!-- Left Lantern -->
    <line x1="88" y1="148" x2="88" y2="158" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="88" cy="162" rx="4" ry="6" fill="#ef4444"/>
    <path d="M 88 156 L 88 168" stroke="#fbbf24" stroke-width="1"/>
    <!-- Right Lantern Glow Spot -->
    <circle cx="152" cy="162" r="10" fill="url(#lanternGlow)"/>
    <!-- Right Lantern -->
    <line x1="152" y1="148" x2="152" y2="158" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="152" cy="162" rx="4" ry="6" fill="#ef4444"/>
    <path d="M 152 156 L 152 168" stroke="#fbbf24" stroke-width="1"/>
  </g>

  <!-- Foreground Elements: Ancient Pine Tree (Framing the Scene) -->
  <!-- Trunk and Branches -->
  <path d="M 15 240 C 20 210, 25 190, 20 170 C 18 160, 10 150, 5 140" fill="none" stroke="#33271d" stroke-width="14" stroke-linecap="round"/>
  <path d="M 22 195 C 35 185, 45 180, 55 170" fill="none" stroke="#33271d" stroke-width="8" stroke-linecap="round"/>
  <path d="M 18 175 C 5 165, -5 155, -10 145" fill="none" stroke="#33271d" stroke-width="6" stroke-linecap="round"/>

  <!-- Pine Needle Clusters (Stylized layered clouds) -->
  <path d="M 45 165 C 55 165, 65 175, 55 185 C 45 195, 25 185, 30 175 Z" fill="#065f46"/>
  <path d="M 30 175 C 40 160, 60 160, 50 175 Z" fill="#047857"/>

  <path d="M -5 140 C -15 135, -20 150, -10 155 C 0 160, 15 145, 5 140 Z" fill="#065f46"/>
  <path d="M 10 130 C -5 125, -15 145, 0 145 Z" fill="#047857"/>

  <path d="M 15 145 C 25 135, 40 145, 30 155 C 20 165, 5 155, 15 145 Z" fill="#065f46"/>

  <!-- Floating Glowing Fireflies / Magic Dust (Enhancing wonder & action-packed vector feel) -->
  <circle cx="70" cy="130" r="2.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="65" cy="132" r="5" fill="url(#lanternGlow)"/>

  <circle cx="175" cy="120" r="2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="175" cy="120" r="4" fill="#38bdf8" opacity="0.3"/>

  <circle cx="100" cy="205" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="130" cy="215" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="85" cy="220" r="1" fill="#38bdf8" opacity="0.8"/>

  <!-- Vignette / Framing Border (Dark-mode sleek UI wrapper) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>