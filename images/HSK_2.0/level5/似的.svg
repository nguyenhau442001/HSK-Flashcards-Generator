<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm bedside lamp glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft feverish/mood lighting -->
    <linearGradient id="blanket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="pillow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT / BACKGROUND DETAILS -->
  <!-- Bedroom Wall & Wallpaper subtle pattern -->
  <path d="M0 0 H240 V160 H0 Z" fill="#1e293b"/>
  <!-- Window showing night city / cool tones -->
  <rect x="150" y="25" width="60" height="85" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M180 25 V110" stroke="#334155" stroke-width="1.5"/>
  <path d="M150 67.5 H210" stroke="#334155" stroke-width="1.5"/>
  <!-- Moon/Stars outside -->
  <circle cx="195" cy="45" r="8" fill="#fde047" opacity="0.8"/>
  <circle cx="165" cy="40" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="168" cy="85" r="1" fill="#ffffff" opacity="0.4"/>

  <!-- Bedside Table -->
  <rect x="15" y="105" width="45" height="55" rx="4" fill="#334155"/>
  <rect x="20" y="112" width="35" height="15" rx="2" fill="#1e293b"/>
  <circle cx="37" cy="120" r="2" fill="#94a3b8"/>

  <!-- Desk Lamp -->
  <path d="M30 105 L30 85" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 75 Q30 65 40 75 Z" fill="#fbbf24"/>
  <!-- Lamp Glow Effect -->
  <circle cx="37" cy="85" r="50" fill="url(#lamp-glow)"/>

  <!-- Glass of water with medicine pill on nightstand -->
  <rect x="22" y="92" width="10" height="13" rx="1" fill="#94a3b8" opacity="0.4"/>
  <rect x="23" y="95" width="8" height="9" rx="1" fill="#38bdf8" opacity="0.6"/>
  <circle cx="45" cy="98" r="3" fill="#f43f5e"/>

  <!-- MAIN BED & CHARACTER SCENARIO -->
  <!-- Bed Frame / Headboard -->
  <rect x="55" y="95" width="170" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Pillow -->
  <rect x="68" y="102" width="48" height="28" rx="10" fill="url(#pillow-grad)"/>

  <!-- Blanket / Duvet covering character -->
  <path d="M60 165 C60 135, 80 130, 130 130 C180 130, 185 145, 185 165 Z" fill="url(#blanket-grad)"/>
  <!-- Blanket folds & texture -->
  <path d="M80 145 C100 142, 120 150, 140 142" stroke="#0284c7" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M90 155 C110 152, 130 160, 150 152" stroke="#0284c7" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- CHARACTER: Sick Person in Bed -->
  <!-- Head -->
  <circle cx="92" cy="116" r="18" fill="#fed7aa"/>
  
  <!-- Slept-in / Messy hair -->
  <path d="M74 115 C72 105, 82 100, 90 101 C98 98, 108 103, 107 112 C110 110, 112 118, 108 122" fill="#475569"/>

  <!-- Sick expression (Closed tired eyes, flushed cheeks, sweat drop) -->
  <!-- Closed eyes (drooping curved lines) -->
  <path d="M83 116 Q87 113 91 116" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M93 116 Q97 113 101 116" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Red rosy flushed cheeks (showing feverish condition) -->
  <circle cx="85" cy="122" r="4" fill="#f43f5e" opacity="0.4"/>
  <circle cx="99" cy="122" r="4" fill="#f43f5e" opacity="0.4"/>

  <!-- Simple worried/sick mouth -->
  <path d="M90 126 Q92 124 94 126" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Sweat drop (classic visual cue for feeling unwell/feverish) -->
  <path d="M104 108 C104 108, 107 112, 107 114 C107 115.6, 105.6 117, 104 117 C102.4 117, 101 115.6, 101 114 C101 112, 104 108, 104 108 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Thermometer in mouth / resting on cheek -->
  <rect x="94" y="122" width="16" height="3" rx="1.5" transform="rotate(-25 94 122)" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.5"/>
  <circle cx="94" cy="126" r="1.5" fill="#f43f5e"/>

  <!-- FOREGROUND FLOOR & DETAILS -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <!-- Floorboard line -->
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- Slippers neatly placed on floor -->
  <ellipse cx="180" cy="185" rx="10" ry="5" fill="#fb923c"/>
  <ellipse cx="202" cy="188" rx="10" ry="5" fill="#fb923c"/>

  <!-- Hot water bottle / compress on blanket -->
  <circle cx="130" cy="142" r="10" fill="#f43f5e" opacity="0.8"/>
  <rect x="127" y="128" width="6" height="5" rx="1" fill="#cbd5e1"/>

  <!-- Ambient decorative floating warmth/cool particles (subtle app vector polish) -->
  <circle cx="70" cy="75" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="120" cy="60" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="210" cy="130" r="1" fill="#38bdf8" opacity="0.6"/>
</svg>