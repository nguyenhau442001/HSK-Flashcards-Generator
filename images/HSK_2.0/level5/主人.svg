<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed container background with gradient -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#backgroundGradient)"/>

  <!-- Room Interior - Wall -->
  <rect x="0" y="0" width="240" height="160" fill="#475569"/>

  <!-- Floor -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  <!-- Rug on floor -->
  <ellipse cx="120" cy="190" rx="70" ry="25" fill="#64748b" opacity="0.7"/>

  <!-- Window -->
  <rect x="150" y="30" width="60" height="70" rx="8" fill="#94a3b8"/> <!-- Window frame -->
  <rect x="155" y="35" width="50" height="60" rx="6" fill="#38bdf8"/> <!-- Sky outside -->
  <path d="M170 95 Q180 80 190 95 L180 85 Z" fill="#10b981"/> <!-- Hint of a tree/bush -->

  <!-- Shelf on wall with decorative item -->
  <rect x="30" y="60" width="60" height="8" rx="4" fill="#94a3b8"/>
  <circle cx="60" cy="50" r="10" fill="#fbbf24"/> <!-- Decorative item / light source -->

  <!-- Character: Man -->
  <!-- Head -->
  <circle cx="120" cy="90" r="25" fill="#fcd34d"/> <!-- Skin tone -->
  <path d="M100 70 C100 55, 120 50, 140 70 C140 80, 120 85, 100 80 Z" fill="#475569"/> <!-- Hair -->
  <circle cx="110" cy="90" r="4" fill="#1e293b"/> <!-- Left eye -->
  <circle cx="130" cy="90" r="4" fill="#1e293b"/> <!-- Right eye -->
  <path d="M115 105 Q120 110, 125 105" stroke="#1e293b" stroke-width="2" fill="none"/> <!-- Smile -->

  <!-- Body - Shirt -->
  <rect x="100" y="110" width="40" height="60" rx="10" fill="#94a3b8"/>
  <!-- Body - Pants -->
  <rect x="100" y="160" width="40" height="50" rx="10" fill="#64748b"/>

  <!-- Arms and Hands -->
  <!-- Left arm (welcoming gesture) -->
  <rect x="85" y="115" width="15" height="40" rx="7" fill="#fcd34d"/>
  <circle cx="92" cy="150" r="8" fill="#fcd34d"/> <!-- Left hand -->

  <!-- Right arm (holding keys) -->
  <rect x="140" y="115" width="15" height="40" rx="7" fill="#fcd34d"/>
  <circle cx="147" cy="150" r="8" fill="#fcd34d"/> <!-- Right hand -->

  <!-- Keys in right hand -->
  <circle cx="147" cy="155" r="8" fill="#fbbf24"/> <!-- Keyring -->
  <rect x="142" y="160" width="8" height="15" rx="2" fill="#fbbf24"/> <!-- Key 1 -->
  <rect x="149" y="165" width="8" height="10" rx="2" fill="#fbbf24"/> <!-- Key 2 -->

  <!-- Shadow under character -->
  <ellipse cx="120" cy="210" rx="30" ry="8" fill="#1e293b" opacity="0.6"/>
</svg>