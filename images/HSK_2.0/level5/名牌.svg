<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Luxury Bag Leather Gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Bag Flap Gradient -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Spotlight -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Display Pedestal / Counter -->
  <g>
    <!-- Shelf Top Surface -->
    <polygon points="30,175 210,175 225,195 15,195" fill="#334155" filter="url(#shadow)"/>
    <!-- Shelf Front Face -->
    <polygon points="15,195 225,195 225,205 15,205" fill="#1e293b"/>
    <!-- Ambient floor fade -->
    <rect x="0" y="150" width="240" height="90" fill="url(#floorGrad)"/>
  </g>

  <!-- Decorative Sparkles / Luxury Atmosphere -->
  <g fill="#fbbf24" opacity="0.8">
    <!-- Star 1 -->
    <path d="M 50 60 Q 50 70 40 70 Q 50 70 50 80 Q 50 70 60 70 Q 50 70 50 60 Z" transform="scale(0.6) translate(30, 20)" filter="url(#glow)"/>
    <!-- Star 2 -->
    <path d="M 50 60 Q 50 70 40 70 Q 50 70 50 80 Q 50 70 60 70 Q 50 70 50 60 Z" transform="scale(0.8) translate(200, 40)" fill="#38bdf8" opacity="0.6"/>
    <!-- Star 3 -->
    <circle cx="195" cy="95" r="2" fill="#fef08a"/>
    <circle cx="45" cy="115" r="1.5" fill="#fef08a"/>
  </g>

  <!-- Gift Box / Shopping Bag props in background -->
  <g transform="translate(165, 110)">
    <!-- Shopping Bag -->
    <path d="M15 20 L45 20 L50 65 L10 65 Z" fill="#ec4899" filter="url(#shadow)"/>
    <!-- Bag handles -->
    <path d="M22 20 C22 10 38 10 38 20" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Ribbon on bag -->
    <rect x="27" y="20" width="6" height="45" fill="url(#goldGrad)" opacity="0.9"/>
    <rect x="15" y="38" width="33" height="6" fill="url(#goldGrad)" opacity="0.9"/>
  </g>

  <!-- MAIN SUBJECT: Designer Handbag (名牌包) -->
  <g transform="translate(48, 65)" filter="url(#shadow)">
    <!-- Handbag Handle Back Arch -->
    <path d="M 38 32 C 38 -5, 106 -5, 106 32" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 42 32 C 42 2, 102 2, 102 32" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Handle Connectors (Hardware) -->
    <rect x="34" y="30" width="8" height="12" rx="3" fill="url(#goldGrad)"/>
    <rect x="102" y="30" width="8" height="12" rx="3" fill="url(#goldGrad)"/>

    <!-- Bag Main Body (Trapezoid/Boxy luxury silhouette) -->
    <path d="M 14 42 L 130 42 L 122 105 C 120 112, 114 116, 106 116 L 38 116 C 30 116, 24 112, 22 105 Z" fill="url(#bagGrad)"/>

    <!-- Subtle quilted texture / V-stitch pattern on luxury leather -->
    <g opacity="0.25" stroke="#ffffff" stroke-width="1.5" fill="none">
      <path d="M 30 42 L 72 95 L 114 42"/>
      <path d="M 45 42 L 72 80 L 99 42"/>
      <path d="M 22 70 L 72 110 L 122 70"/>
    </g>

    <!-- Bag Flap (Overlapping top section) -->
    <path d="M 14 42 L 130 42 L 124 78 C 123 83, 119 86, 114 86 L 30 86 C 25 86, 21 83, 20 78 Z" fill="url(#flapGrad)"/>
    <!-- Flap Edge Highlight -->
    <path d="M 14 42 L 130 42" stroke="#fecdd3" stroke-width="1.5" opacity="0.5"/>
    <path d="M 20 78 C 21 83, 25 86, 30 86 L 114 86 C 119 86, 123 83, 124 78" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

    <!-- Luxury Brand Plaque / Lock (The iconic '名牌' hardware centerpiece) -->
    <g transform="translate(62, 64)">
      <!-- Base Plate -->
      <rect x="0" y="0" width="20" height="26" rx="4" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1"/>
      <!-- Inner geometric engraved detail -->
      <rect x="3" y="3" width="14" height="20" rx="2" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.7"/>
      <!-- Center emblem/turn-lock -->
      <circle cx="10" cy="13" r="4" fill="#78350f"/>
      <circle cx="10" cy="13" r="2" fill="url(#goldGrad)"/>
      <rect x="8.5" y="10" width="3" height="6" fill="#78350f"/>
    </g>

    <!-- Leather Charm / Tag dangling from handle -->
    <g transform="translate(26, 45)">
      <path d="M 0 0 L 12 5 L 8 22 L -4 17 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
      <rect x="1" y="6" width="6" height="10" rx="1" fill="#881337" opacity="0.6"/>
      <!-- Strap attaching tag -->
      <path d="M -4 -3 C 0 -10, 4 -5, 0 0" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    </g>

    <!-- Metallic Feet at bottom of bag -->
    <ellipse cx="38" cy="117" rx="3" ry="1.5" fill="url(#goldGrad)"/>
    <ellipse cx="106" cy="117" rx="3" ry="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Foreground luxury retail elements (Tissue paper / Ribbon spilling out, small perfume bottle) -->
  <g transform="translate(25, 125)">
    <!-- Small Perfume Bottle -->
    <rect x="5" y="15" width="16" height="22" rx="4" fill="#38bdf8" opacity="0.8" filter="url(#shadow)"/>
    <path d="M 11 15 L 11 10 L 15 10 L 15 15 Z" fill="url(#goldGrad)"/>
    <rect x="9" y="8" width="8" height="3" rx="1" fill="url(#goldGrad)"/>
    <!-- Perfume label accent -->
    <rect x="7" y="20" width="12" height="10" rx="1" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Floating Sparkles and Glamour Effects -->
  <g fill="url(#goldGrad)">
    <!-- Sparkle 1 (Top Left) -->
    <path d="M 35 35 Q 35 43 27 43 Q 35 43 35 51 Q 35 43 43 43 Q 35 43 35 35 Z" filter="url(#glow)"/>
    <!-- Sparkle 2 (Right near bag) -->
    <path d="M 185 85 Q 185 93 177 93 Q 185 93 185 101 Q 185 93 193 93 Q 185 93 185 85 Z" transform="scale(0.7) translate(70, 10)" filter="url(#glow)"/>
  </g>

  <!-- Little price tag or authenticity card accent resting on counter -->
  <g transform="translate(150, 160) rotate(-12)" filter="url(#shadow)">
    <rect x="0" y="0" width="22" height="14" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="4" cy="7" r="1.5" fill="#94a3b8"/>
    <line x1="8" y1="5" x2="18" y2="5" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="9" x2="14" y2="9" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>