<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Morning Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.05" />
    </linearGradient>

    <!-- Character Pajama Gradient -->
    <linearGradient id="pajamaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Alarm Clock Gradient -->
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Room Interior Background Elements -->
  <!-- Wallpaper / Wall -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Window showing morning sky -->
  <g transform="translate(140, 35)">
    <rect x="0" y="0" width="60" height="75" rx="6" fill="#0284c7" />
    <!-- Morning Sun -->
    <circle cx="30" cy="45" r="14" fill="#fbbf24" />
    <!-- Window Frame -->
    <rect x="0" y="0" width="60" height="75" rx="6" fill="none" stroke="#475569" stroke-width="4"/>
    <line x1="30" y1="0" x2="30" y2="75" stroke="#475569" stroke-width="3"/>
    <line x1="0" y1="37.5" x2="60" y2="37.5" stroke="#475569" stroke-width="3"/>
  </g>

  <!-- Sunbeam hitting the room -->
  <polygon points="140,35 200,35 200,170 50,170" fill="url(#windowLight)" />

  <!-- Wall Shelf with Houseplant -->
  <g transform="translate(35, 45)">
    <rect x="0" y="0" width="50" height="6" rx="3" fill="#64748b" />
    <!-- Pot -->
    <path d="M15,6 L35,6 L32,22 L18,22 Z" fill="#f8fafc" />
    <!-- Plant Leaves -->
    <path d="M25,6 Q10,-5 5,0 Q10,10 25,6 Z" fill="#10b981" />
    <path d="M25,6 Q40,-8 45,-2 Q35,8 25,6 Z" fill="#34d399" />
    <path d="M25,6 Q25,-12 28,-15 Q30,-5 25,6 Z" fill="#059669" />
  </g>

  <!-- Wooden Floor -->
  <path d="M20,170 L220,170 L225,215 L15,215 Z" fill="#334155" />
  <line x1="20" y1="185" x2="220" y2="185" stroke="#1e293b" stroke-width="2"/>
  <line x1="20" y1="200" x2="222" y2="200" stroke="#1e293b" stroke-width="2"/>

  <!-- Bed / Nightstand Setup -->
  <!-- Nightstand -->
  <g transform="translate(25, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="55" height="55" rx="6" fill="#475569" />
    <rect x="6" y="10" width="43" height="15" rx="3" fill="#334155" />
    <circle cx="27" cy="17" r="3" fill="#94a3b8" />
    <rect x="6" y="32" width="43" height="15" rx="3" fill="#334155" />
    <circle cx="27" cy="39" r="3" fill="#94a3b8" />
  </g>

  <!-- Alarm Clock on Nightstand (Showing 7:00 context) -->
  <g transform="translate(38, 95)" filter="url(#shadow)">
    <!-- Bells -->
    <circle cx="10" cy="5" r="5" fill="#cbd5e1" />
    <circle cx="20" cy="5" r="5" fill="#cbd5e1" />
    <rect x="13" y="6" width="4" height="4" fill="#94a3b8" />
    <!-- Clock Body -->
    <circle cx="15" cy="18" r="13" fill="url(#clockGrad)" />
    <circle cx="15" cy="18" r="10" fill="#f8fafc" />
    <!-- Clock Hands (pointing to 7) -->
    <line x1="15" y1="18" x2="11" y2="12" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="18" x2="20" y2="13" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Feet -->
    <path d="M8,29 L5,32" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <path d="M22,29 L25,32" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Sound Waves (Showing it's ringing) -->
    <path d="M-1,10 Q-4,14 -1,18" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M31,10 Q34,14 31,18" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Main Character Waking Up / Stretching (Routine/Habit vibe) -->
  <g transform="translate(100, 105)" filter="url(#shadow)">
    <!-- Character Body / Torso in Pajamas -->
    <path d="M20,35 Q15,65 18,85 L42,85 Q45,65 40,35 Z" fill="url(#pajamaGrad)" />
    <!-- Pajama Collar -->
    <path d="M25,35 L30,45 L35,35 Z" fill="#e0f2fe" />

    <!-- Head & Face -->
    <circle cx="30" cy="20" r="15" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M15,18 Q16,8 30,8 Q44,8 45,18 Q40,12 30,12 Q20,12 15,18 Z" fill="#334155" />
    
    <!-- Sleepy/Happy Eyes (Closed arcs for morning stretch) -->
    <path d="M22,18 Q25,21 28,18" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M32,18 Q35,21 38,18" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Cheeks (Morning Glow) -->
    <circle cx="21" cy="22" r="3" fill="#fca5a5" opacity="0.6"/>
    <circle cx="39" cy="22" r="3" fill="#fca5a5" opacity="0.6"/>
    <!-- Smile -->
    <path d="M27,24 Q30,27 33,24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Arms Stretching Up -->
    <!-- Left Arm -->
    <path d="M18,40 Q5,25 0,15" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <circle cx="0" cy="15" r="4" fill="#fed7aa" />
    <!-- Right Arm -->
    <path d="M42,40 Q55,25 60,15" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <circle cx="60" cy="15" r="4" fill="#fed7aa" />

    <!-- Legs -->
    <rect x="22" y="85" width="6" height="22" rx="3" fill="#0284c7" />
    <rect x="32" y="85" width="6" height="22" rx="3" fill="#0284c7" />
    <!-- Slippers -->
    <ellipse cx="25" cy="109" rx="6" ry="3" fill="#f43f5e" />
    <ellipse cx="35" cy="109" rx="6" ry="3" fill="#f43f5e" />
  </g>

  <!-- Coffee Mug / Morning Routine Prop on Floor/Rug -->
  <g transform="translate(170, 165)" filter="url(#shadow)">
    <!-- Small Rug -->
    <ellipse cx="15" cy="20" rx="22" ry="10" fill="#475569" />
    <ellipse cx="15" cy="20" rx="18" ry="7" fill="#64748b" />
    
    <!-- Mug -->
    <rect x="10" y="8" width="12" height="15" rx="3" fill="#f8fafc" />
    <path d="M22,11 Q27,11 27,15 Q27,19 22,19" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M13,5 Q11,1 15,-2" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M18,4 Q20,0 17,-3" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Action/Routine Sparkles (Emphasizing the everyday consistent habit) -->
  <g transform="translate(0, 0)">
    <path d="M90,70 L93,76 L99,79 L93,82 L90,88 L87,82 L81,79 L87,76 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M150,110 L152,114 L156,116 L152,118 L150,122 L148,118 L144,116 L148,114 Z" fill="#38bdf8" opacity="0.8" />
    <circle cx="115" cy="65" r="3" fill="#f43f5e" opacity="0.7" />
    <circle cx="75" cy="135" r="2.5" fill="#10b981" opacity="0.8" />
  </g>
</svg>