<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Indoor Light Gradient -->
    <radialGradient id="lamp-glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="window-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Light / Warm Glow -->
  <circle cx="120" cy="80" r="120" fill="url(#lamp-glow)"/>

  <!-- ================= BACKGROUND & ENVIRONMENT ================= -->
  <!-- Wall & Floor Divider -->
  <rect x="0" y="160" width="240" height="80" fill="#0b1329"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2"/>

  <!-- Window with Cityscape Silhouette -->
  <g transform="translate(145, 20)">
    <rect x="0" y="0" width="75" height="110" rx="8" fill="url(#window-night)" stroke="#334155" stroke-width="3"/>
    <!-- Window Frame Cross -->
    <line x1="37.5" y1="0" x2="37.5" y2="110" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="55" x2="75" y2="55" stroke="#334155" stroke-width="2"/>
    <!-- City Skyline outside -->
    <path d="M5 110 L5 85 L15 85 L15 110 L25 110 L25 70 L35 70 L35 110 L45 110 L45 78 L55 78 L55 110 L65 110 L65 95 L70 95 L70 110 Z" fill="#1e293b"/>
    <!-- Tiny warm window lights in city -->
    <rect x="18" y="75" width="4" height="6" fill="#fbbf24" opacity="0.6"/>
    <rect x="27" y="80" width="4" height="6" fill="#fbbf24" opacity="0.4"/>
    <rect x="48" y="85" width="4" height="6" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- Wall Shelf & Plant -->
  <g transform="translate(20, 35)">
    <rect x="0" y="0" width="60" height="4" rx="2" fill="#475569"/>
    <!-- Pot -->
    <path d="M15 0 L20 -12 L32 -12 L37 0 Z" fill="#cbd5e1"/>
    <!-- Plant Leaves (Trailing) -->
    <path d="M23 -12 C 15 -5, 10 5, 5 15" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <path d="M26 -12 C 30 0, 35 10, 42 18" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 -12 C 15 2, 18 18, 24 25" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Notice Board on Wall -->
  <rect x="95" y="25" width="35" height="45" rx="3" fill="#334155"/>
  <rect x="100" y="30" width="12" height="15" fill="#f1f5f9"/>
  <rect x="114" y="30" width="12" height="18" fill="#fb923c"/>
  <circle cx="112.5" cy="27" r="2" fill="#ef4444"/>

  <!-- ================= FURNITURE ================= -->
  <!-- Coffee Table / Desk -->
  <g transform="translate(75, 135)">
    <!-- Table Top -->
    <path d="M-10 0 L100 0 L90 25 L0 25 Z" fill="#334155"/>
    <rect x="-10" y="25" width="110" height="6" rx="2" fill="#475569"/>
    <!-- Legs -->
    <rect x="5" y="31" width="6" height="50" fill="#1e293b"/>
    <rect x="79" y="31" width="6" height="50" fill="#1e293b"/>
    
    <!-- Props on Table -->
    <!-- Open Book / Laptop outline -->
    <path d="M30 -5 L60 -5 L55 -18 L35 -18 Z" fill="#e2e8f0"/>
    <path d="M32 -7 L58 -7" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M32 -11 L50 -11" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Mug with steam -->
    <rect x="15" y="-12" width="10" height="12" rx="2" fill="#38bdf8"/>
    <path d="M25 -9 C 28 -9, 28 -4, 25 -4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M18 -16 C 19 -18, 17 -20, 19 -22" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M22 -15 C 23 -17, 21 -19, 23 -21" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- ================= CHARACTERS ================= -->
  
  <!-- CHARACTER 1: Sitting on the left (Relaxing, leaning back, stretching) -->
  <g transform="translate(45, 115)" filter="url(#shadow)">
    <!-- Chair Back & Seat -->
    <path d="M-15 40 L-15 -10 C -15 -20, 5 -20, 5 -10 L5 40 Z" fill="#334155"/>
    <rect x="-22" y="35" width="35" height="10" rx="3" fill="#475569"/>
    <!-- Chair Legs -->
    <line x1="-15" y1="45" x2="-22" y2="85" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="45" x2="8" y2="85" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

    <!-- Body (Leaning back comfortably) -->
    <!-- Torso -->
    <path d="M-10 10 L-5 -25 C 5 -25, 15 -15, 10 20 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="-2" cy="-38" r="14" fill="#fbcfe8"/>
    <!-- Hair (Stylish short dark hair) -->
    <path d="M-16 -40 C -16 -52, 10 -52, 11 -38 C 11 -35, 6 -32, 2 -34 C -3 -36, -10 -35, -16 -40 Z" fill="#0f172a"/>
    <!-- Relaxed Face (Eyes closed in relief / smiling) -->
    <path d="M-6 -36 C -4 -34, -2 -34, 0 -36" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M-4 -30 C -2 -28, 2 -28, 4 -30" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms (Stretching upward/backward) -->
    <!-- Back Arm -->
    <path d="M-8 -15 C -20 -15, -28 -5, -22 5" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-22" cy="5" r="3.5" fill="#fbcfe8"/>
    <!-- Front Arm (Stretching up dynamically) -->
    <path d="M5 -15 C 15 -25, 25 -30, 32 -22" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <circle cx="32" cy="-22" r="3.5" fill="#fbcfe8"/>

    <!-- Legs (Relaxed, crossed or stretched) -->
    <path d="M5 20 C 15 25, 25 35, 30 55" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 55 L42 58" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/> <!-- Shoes -->
  </g>


  <!-- CHARACTER 2: Sitting on the right (Leaning forward, drinking / resting arms on table) -->
  <g transform="translate(155, 120)" filter="url(#shadow)">
    <!-- Chair -->
    <path d="M10 35 L10 -15 C 10 -25, -10 -25, -10 -15 L-10 35 Z" fill="#334155"/>
    <rect x="-12" y="30" width="30" height="10" rx="3" fill="#475569"/>
    <line x1="-5" y1="40" x2="-12" y2="80" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="10" y1="40" x2="18" y2="80" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

    <!-- Body (Leaning forward slightly, relaxed pose) -->
    <!-- Torso -->
    <path d="M-5 10 L5 -20 C 10 -20, 15 -10, 8 20 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="5" cy="-32" r="14" fill="#fed7aa"/>
    <!-- Hair (Messy/Casual brown hair) -->
    <path d="M-8 -42 C 0 -50, 18 -42, 16 -30 C 12 -30, 8 -34, 3 -34 C -2 -34, -5 -38, -8 -42 Z" fill="#78350f"/>
    <!-- Face (Smiling, eyes relaxed) -->
    <path d="M5 -30 C 7 -28, 9 -28, 11 -30" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="2" cy="-34" r="1.5" fill="#1e293b"/>

    <!-- Arms (Resting on table / holding cup) -->
    <!-- Arm reaching forward -->
    <path d="M-2 -10 C -12 -5, -25 0, -35 -5" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-35" cy="-5" r="3.5" fill="#fed7aa"/>

    <!-- Legs -->
    <path d="M2 20 C -5 30, -15 50, -22 75" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Additional cozy props: Floor Lamp on the left -->
  <g transform="translate(25, 80)">
    <!-- Lamp Base -->
    <path d="M0 110 L25 110 C 20 100, 10 100, 5 110 Z" fill="#475569"/>
    <!-- Pole -->
    <line x1="12.5" y1="110" x2="12.5" y2="10" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <!-- Shade -->
    <path d="M2.5 10 L22.5 10 L28.5 -5 L-3.5 -5 Z" fill="#fbbf24"/>
    <!-- Light Beam Polygon extending down -->
    <polygon points="3,10 22,10 50,110 -25,110" fill="#fbbf24" opacity="0.08"/>
  </g>

</svg>