<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Light Gradient -->
    <radialGradient id="deskLight" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Moonlight Gradient -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Cozy Room Interior -->
  <!-- Wallpaper / Back wall -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b" opacity="0.6"/>

  <!-- Window showing night sky & progression of time (representing "gradual" formation) -->
  <path d="M 160 35 L 205 35 L 205 95 L 160 95 Z" fill="#090d16" stroke="#334155" stroke-width="2" rx="4"/>
  <!-- Window panes -->
  <line x1="182" y1="35" x2="182" y2="95" stroke="#334155" stroke-width="1.5"/>
  <line x1="160" y1="65" x2="205" y2="65" stroke="#334155" stroke-width="1.5"/>
  <!-- Moon outside -->
  <circle cx="190" cy="48" r="6" fill="#fef08a" opacity="0.9"/>
  <!-- Moonlight beam into room -->
  <polygon points="160,35 205,35 230,130 130,130" fill="url(#moonlight)"/>

  <!-- Bookshelf background props (showing habit of reading/learning) -->
  <rect x="35" y="40" width="45" height="6" rx="2" fill="#475569"/>
  <rect x="42" y="46" width="8" height="25" rx="1" fill="#f59e0b"/>
  <rect x="52" y="48" width="6" height="23" rx="1" fill="#10b981"/>
  <rect x="60" y="44" width="10" height="27" rx="1" fill="#ec4899"/>

  <!-- Wall Calendar (showing days passing / gradual habit formation) -->
  <g transform="translate(95, 38)">
    <rect x="0" y="0" width="26" height="30" rx="3" fill="#cbd5e1"/>
    <rect x="0" y="0" width="26" height="8" rx="3" fill="#ef4444"/>
    <circle cx="8" cy="4" r="1.5" fill="#1e293b"/>
    <circle cx="18" cy="4" r="1.5" fill="#1e293b"/>
    <!-- Grid dots representing days -->
    <circle cx="6" cy="14" r="1.5" fill="#64748b"/>
    <circle cx="13" cy="14" r="1.5" fill="#64748b"/>
    <circle cx="20" cy="14" r="1.5" fill="#ef4444"/>
    <circle cx="6" cy="21" r="1.5" fill="#64748b"/>
    <circle cx="13" cy="21" r="1.5" fill="#64748b"/>
    <circle cx="20" cy="21" r="1.5" fill="#64748b"/>
  </g>

  <!-- Ambient Desk Light Glow -->
  <circle cx="120" cy="140" r="90" fill="url(#deskLight)"/>

  <!-- Desk Surface -->
  <path d="M 15 165 L 225 165 L 210 195 L 30 195 Z" fill="#334155"/>
  <rect x="15" y="160" width="210" height="8" rx="2" fill="#475569"/>

  <!-- DESK PROPS -->
  <!-- Warm Desk Lamp -->
  <path d="M 195 165 L 190 110 L 205 110 L 200 165 Z" fill="#64748b"/>
  <path d="M 180 100 C 180 90, 215 90, 215 100 Z" fill="#f59e0b"/>
  <!-- Light cone from lamp -->
  <polygon points="190,105 150,165 220,165" fill="#fef08a" opacity="0.08"/>

  <!-- Mug of warm drink -->
  <rect x="155" y="145" width="14" height="18" rx="3" fill="url(#mugGrad)"/>
  <path d="M 169 149 C 174 149, 174 159, 169 159" stroke="#f43f5e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Steam wisps -->
  <path d="M 160 138 C 158 133, 164 130, 162 125" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Open Journal / Book on desk (where the habit/routine is practiced) -->
  <g transform="translate(85, 145)">
    <path d="M 0 10 C 20 5, 40 5, 60 10 L 60 25 C 40 20, 20 20, 0 25 Z" fill="#f8fafc"/>
    <path d="M 60 10 C 80 5, 100 5, 120 10 L 120 25 C 100 20, 80 20, 60 25 Z" fill="#f1f5f9"/>
    <!-- Page lines -->
    <line x1="10" y1="13" x2="25" y2="12" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="30" y1="13" x2="50" y2="12" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="10" y1="17" x2="40" y2="16" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="70" y1="13" x2="95" y2="12" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="70" y1="17" x2="110" y2="16" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <!-- Pen -->
    <line x1="45" y1="8" x2="75" y2="22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- MAIN CHARACTER: Focused person building a habit -->
  <g transform="translate(0, 5)">
    <!-- Chair backrest -->
    <rect x="75" y="85" width="22" height="60" rx="6" fill="#475569"/>

    <!-- Body / Sweater -->
    <path d="M 75 140 C 70 120, 85 105, 100 105 L 125 105 C 140 105, 155 120, 150 140 L 155 170 L 70 170 Z" fill="url(#sweaterGrad)"/>

    <!-- Collar -->
    <path d="M 95 105 C 100 112, 120 112, 125 105 C 120 115, 100 115, 95 105 Z" fill="#0284c7"/>

    <!-- Head & Face -->
    <circle cx="110" cy="85" r="18" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 92 85 C 92 70, 100 65, 115 65 C 128 65, 130 75, 130 90 L 128 85 C 120 73, 105 73, 94 88 Z" fill="#334155"/>

    <!-- Facial expression: calm, focused, determined (habit formation in progress) -->
    <!-- Eyes closed happily/focused or open calmly -->
    <path d="M 103 86 Q 107 90 111 86" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 115 86 Q 119 90 123 86" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Gentle smile -->
    <path d="M 111 94 Q 115 97 119 94" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="101" cy="91" r="3" fill="#fda4af" opacity="0.6"/>
    <circle cx="125" cy="91" r="3" fill="#fda4af" opacity="0.6"/>

    <!-- Arms writing / engaging with the desk -->
    <!-- Left arm -->
    <path d="M 80 120 C 70 130, 85 145, 95 140" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Right arm reaching forward -->
    <path d="M 140 120 C 150 135, 135 145, 120 148" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="118" cy="148" r="4" fill="#fbcfe8"/>
  </g>

  <!-- VISUAL METAPHOR FOR "GRADUAL FORMATION" (Layered glowing rings/steps floating upward near the character) -->
  <g transform="translate(145, 95)" opacity="0.85">
    <!-- Step 1 (Base/Past) -->
    <ellipse cx="0" cy="30" rx="12" ry="5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- Step 2 (Developing) -->
    <ellipse cx="5" cy="18" rx="14" ry="6" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <!-- Step 3 (Solidifying / Formed Habit) -->
    <ellipse cx="12" cy="4" rx="16" ry="7" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="12" cy="-4" r="3" fill="#fbbf24"/>
    
    <!-- Rising upward subtle particle path indicating time/process -->
    <circle cx="0" cy="22" r="1.5" fill="#38bdf8" opacity="0.6"/>
    <circle cx="6" cy="11" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="14" cy="-1" r="2.5" fill="#fbbf24"/>
  </g>

  <!-- Plant in pot on left side (adds life and organic touch to the room) -->
  <g transform="translate(25, 135)">
    <path d="M 5 25 L 15 25 L 18 35 L 2 35 Z" fill="#cbd5e1"/>
    <!-- Stem & Leaves -->
    <path d="M 10 25 C 10 15, 2 10, 0 5" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 10 20 C 10 10, 18 5, 22 2" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 10 25 L 10 8" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaf blobs -->
    <circle cx="0" cy="5" r="5" fill="#34d399"/>
    <circle cx="22" cy="2" r="4" fill="#10b981"/>
    <circle cx="10" cy="5" r="6" fill="#059669"/>
  </g>
</svg>