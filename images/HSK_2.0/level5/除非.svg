<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for 'Unless' Condition -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Doorway Internal Gradient -->
    <linearGradient id="doorwayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Behind Scene -->
  <circle cx="120" cy="130" r="90" fill="url(#amberGlow)"/>

  <!-- Interior Wall & Floor -->
  <!-- Floor Surface -->
  <path d="M 20 190 L 220 190 L 230 220 L 10 220 Z" fill="#141c2e"/>
  <path d="M 20 190 L 120 190 L 110 220 L 10 220 Z" fill="#182236"/>
  
  <!-- Wall Baseboard -->
  <rect x="20" y="184" width="200" height="6" fill="#293548"/>

  <!-- Dramatic Closed Wooden Door Frame -->
  <g filter="url(#shadow)">
    <!-- Outer Frame -->
    <rect x="75" y="30" width="90" height="160" rx="4" fill="#334155"/>
    <!-- Inner Doorway Depth -->
    <rect x="81" y="36" width="78" height="154" fill="url(#doorwayGrad)"/>
    
    <!-- The Solid Wood Door (Slightly ajar/blocked, creating tension) -->
    <g transform="translate(85, 40)">
      <rect x="0" y="0" width="70" height="148" fill="#854d0e" rx="2"/>
      <!-- Wood Panels -->
      <rect x="8" y="12" width="23" height="56" rx="2" fill="#713f12" opacity="0.6"/>
      <rect x="39" y="12" width="23" height="56" rx="2" fill="#713f12" opacity="0.6"/>
      <rect x="8" y="80" width="23" height="56" rx="2" fill="#713f12" opacity="0.6"/>
      <rect x="39" y="80" width="23" height="56" rx="2" fill="#713f12" opacity="0.6"/>
      
      <!-- Golden Antique Door Knob -->
      <circle cx="58" cy="78" r="5" fill="#fbbf24"/>
      <circle cx="58" cy="78" r="2" fill="#d97706"/>
    </g>
  </g>

  <!-- Obstacle / Condition Mechanism: Heavy Security Barrier & Keycard Pad -->
  <!-- Wall Keycard Scanner Box (The 'Condition' trigger) -->
  <g transform="translate(42, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="22" height="32" rx="4" fill="#475569"/>
    <rect x="3" y="4" width="16" height="24" rx="2" fill="#0f172a"/>
    <!-- Glowing Status Screen (Red/Amber for 'Locked / Unless') -->
    <rect x="5" y="7" width="12" height="10" rx="1" fill="#ef4444"/>
    <circle cx="11" cy="22" r="2" fill="#38bdf8"/>
  </g>

  <!-- The Key / Pass (Action Element being presented to fulfill the condition) -->
  <g transform="translate(68, 105) rotate(-25)" filter="url(#shadow)">
    <rect x="0" y="0" width="30" height="14" rx="7" fill="#38bdf8"/>
    <circle cx="23" cy="7" r="4" fill="#0f172a"/>
    <!-- Card Chip Graphic -->
    <rect x="6" y="4" width="6" height="6" rx="1" fill="#bae6fd"/>
  </g>

  <!-- Foreground Character Hand (Presenting the condition) -->
  <!-- Stylized friendly arm reaching in from bottom-right -->
  <g transform="translate(130, 160)" filter="url(#shadow)">
    <!-- Sleeve -->
    <path d="M 60 60 L 90 90 L 110 70 L 80 40 Z" fill="#6366f1"/>
    <!-- Hand / Wrist -->
    <path d="M 30 35 Q 45 40 60 60 L 80 40 Q 65 20 40 20 Z" fill="#fcd34d"/>
    <!-- Fingers gripping -->
    <circle cx="33" cy="31" r="5" fill="#fcd34d"/>
    <circle cx="40" cy="24" r="5" fill="#fcd34d"/>
  </g>

  <!-- Environmental Narrative Details -->
  <!-- Floor Plant on Left -->
  <g transform="translate(25, 155)" filter="url(#shadow)">
    <!-- Pot -->
    <path d="M 5 15 L 15 35 L 25 35 L 35 15 Z" fill="#cbd5e1"/>
    <!-- Leaves -->
    <path d="M 20 15 Q 10 -5 0 5 Q 10 15 20 15 Z" fill="#10b981"/>
    <path d="M 20 15 Q 30 -10 40 0 Q 30 15 20 15 Z" fill="#059669"/>
    <path d="M 20 15 Q 20 -15 20 -25 Q 20 -15 20 15 Z" fill="#34d399"/>
  </g>

  <!-- Sparkle / Action FX indicating the exact crucial requirement moment -->
  <g transform="translate(65, 85)">
    <path d="M 0 6 L 12 6 M 6 0 L 6 12" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="6" cy="6" r="8" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Subtle Top Atmospheric Lighting -->
  <path d="M 0 0 L 240 0 L 240 10 L 0 10 Z" fill="#ffffff" opacity="0.05"/>
</svg>