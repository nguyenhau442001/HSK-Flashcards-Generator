<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Workbench Surface -->
  <path d="M20 180 L220 180 L230 210 L10 210 Z" fill="#334155"/>
  
  <!-- Chef's Hand and Knife Action -->
  <g transform="translate(60, 60)">
    <!-- Cutting Board -->
    <rect x="20" y="100" width="120" height="15" rx="2" fill="#94a3b8"/>
    
    <!-- Vegetable slices -->
    <ellipse cx="60" cy="100" rx="8" ry="3" fill="#fb923c"/>
    <ellipse cx="80" cy="100" rx="8" ry="3" fill="#fb923c"/>
    
    <!-- Knife -->
    <path d="M100 40 L160 60 L150 75 L90 55 Z" fill="#e2e8f0"/>
    <path d="M90 55 L100 40 L110 45 L100 60 Z" fill="#475569"/>
    
    <!-- Hand -->
    <path d="M60 60 C60 40, 90 40, 90 60 L85 80 L65 80 Z" fill="#fcd34d"/>
    <path d="M70 70 L70 95" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
    <path d="M80 70 L80 95" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Motion Blur Lines -->
  <path d="M140 100 L170 100" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M145 115 L175 115" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Ambient Accents -->
  <circle cx="190" cy="50" r="4" fill="#10b981"/>
  <circle cx="40" cy="40" r="3" fill="#ec4899"/>
  <path d="M180 150 Q200 130 220 150" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>