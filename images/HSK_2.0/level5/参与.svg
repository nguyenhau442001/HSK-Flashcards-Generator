<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="140" width="200" height="10" rx="2" fill="#334155"/>
  <rect x="40" y="150" width="10" height="80" fill="#475569"/>
  <rect x="190" y="150" width="10" height="80" fill="#475569"/>
  
  <!-- Project Props -->
  <rect x="60" y="100" width="120" height="80" rx="4" fill="#cbd5e1"/>
  <path d="M70 115h100M70 135h100M70 155h60" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="150" cy="155" r="8" fill="#f59e0b"/>
  
  <!-- Character -->
  <g transform="translate(120, 120)">
    <!-- Arms reaching into project -->
    <path d="M-40 0 L-10 20 M40 0 L10 20" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="30" ry="40" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="-30" r="25" fill="#fde68a"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-35" r="3" fill="#0f172a"/>
    <circle cx="8" cy="-35" r="3" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M-8 -25 Q0 -20 8 -25" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Accents -->
  <circle cx="180" cy="60" r="5" fill="#10b981"/>
  <circle cx="40" cy="50" r="8" fill="#ec4899"/>
  <path d="M200 40 L215 55" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
</svg>