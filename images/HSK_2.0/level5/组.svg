<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  <path d="M0 180 Q120 175 240 180 V240 H0 Z" fill="#1e293b"/>
  
  <!-- Environment Props -->
  <rect x="105" y="60" width="30" height="45" rx="2" fill="#334155" opacity="0.5"/> <!-- Background Poster/Board -->
  <circle cx="30" cy="190" r="12" fill="#10b981" opacity="0.2"/> <!-- Plant shadow -->
  <path d="M25 190 Q30 160 35 190" stroke="#059669" stroke-width="2" fill="none"/> <!-- Simple Plant -->
  <path d="M22 185 Q30 170 38 185" stroke="#059669" stroke-width="2" fill="none"/>

  <!-- The Leader (Teacher/Facilitator) -->
  <g transform="translate(110, 100)">
    <!-- Body -->
    <path d="M10 50 Q10 35 20 35 Q30 35 30 50 L32 75 H8 Z" fill="#f59e0b"/>
    <!-- Head -->
    <circle cx="20" cy="25" r="8" fill="#ffdbac"/>
    <!-- Arms gesturing to both sides -->
    <path d="M10 40 L-15 30" stroke="#ffdbac" stroke-width="4" stroke-linecap="round"/> <!-- Pointing Left -->
    <path d="M30 40 L55 30" stroke="#ffdbac" stroke-width="4" stroke-linecap="round"/> <!-- Pointing Right -->
    <!-- Hair -->
    <path d="M12 22 Q20 12 28 22" stroke="#451a03" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Group 1 (Left Side) -->
  <g transform="translate(35, 130)">
    <!-- Person 1 -->
    <path d="M10 45 Q10 30 18 30 Q26 30 26 45 L28 65 H8 Z" fill="#38bdf8"/>
    <circle cx="18" cy="22" r="7" fill="#d2b48c"/>
    <path d="M13 18 Q18 12 23 18" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Person 2 -->
    <path d="M35 48 Q35 33 43 33 Q51 33 51 48 L53 68 H33 Z" fill="#0ea5e9"/>
    <circle cx="43" cy="25" r="7" fill="#ffdbac"/>
    <path d="M38 21 Q43 15 48 21" stroke="#451a03" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Interaction -->
    <path d="M26 45 L35 45" stroke="#ffdbac" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Group 2 (Right Side) -->
  <g transform="translate(155, 130)">
    <!-- Person 1 -->
    <path d="M10 48 Q10 33 18 33 Q26 33 26 48 L28 68 H8 Z" fill="#ec4899"/>
    <circle cx="18" cy="25" r="7" fill="#e0ac69"/>
    <path d="M13 21 Q18 15 23 21" stroke="#2d1a12" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Person 2 -->
    <path d="M35 45 Q35 30 43 30 Q51 30 51 45 L53 65 H33 Z" fill="#db2777"/>
    <circle cx="43" cy="22" r="7" fill="#ffdbac"/>
    <path d="M38 18 Q43 12 48 18" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Interaction -->
    <path d="M26 45 L35 45" stroke="#ffdbac" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Visual Cues for "Dividing" -->
  <path d="M120 185 L120 220" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  
  <!-- Lighting Effects -->
  <circle cx="120" cy="40" r="80" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>