<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Counter Light / Glow -->
    <radialGradient id="counterGlow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Fresh Produce Gradients -->
    <linearGradient id="appleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="carrotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="crateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Character / Clothing Gradients -->
    <linearGradient id="apronGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  <rect width="240" height="240" rx="24" fill="url(#counterGlow)"/>

  <!-- Store Environment / Background Details -->
  <g id="environment">
    <!-- Wooden Shelf Structure -->
    <rect x="25" y="40" width="190" height="8" rx="3" fill="#451a03"/>
    <rect x="35" y="48" width="10" height="50" fill="#291102"/>
    <rect x="195" y="48" width="10" height="50" fill="#291102"/>

    <!-- Background Jars / Containers on Shelf -->
    <rect x="50" y="20" width="16" height="20" rx="4" fill="#334155" opacity="0.6"/>
    <rect x="70" y="16" width="20" height="24" rx="4" fill="#475569" opacity="0.6"/>
    <rect x="160" y="18" width="18" height="22" rx="4" fill="#334155" opacity="0.6"/>

    <!-- Hanging Warm Light Bulb -->
    <path d="M120 0 L120 25" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="28" r="6" fill="#fbbf24"/>
    <circle cx="120" cy="28" r="14" fill="#fbbf24" opacity="0.15"/>
  </g>

  <!-- Foreground Counter & Display -->
  <g id="counter">
    <rect x="10" y="160" width="220" height="70" rx="6" fill="#334155"/>
    <rect x="10" y="160" width="220" height="12" fill="#475569"/>
    <!-- Counter Surface Highlight -->
    <rect x="10" y="160" width="220" height="3" fill="#64748b" opacity="0.5"/>
  </g>

  <!-- Fresh Food Crates & Display (The core "Shíwù" element) -->
  <g id="food-display">
    <!-- Crate 1 (Left): Apples -->
    <path d="M 25 185 L 35 155 L 75 155 L 85 185 Z" fill="url(#crateGrad)"/>
    <ellipse cx="55" cy="162" rx="14" ry="7" fill="#451a03"/>
    <!-- Apples inside crate -->
    <circle cx="45" cy="162" r="8" fill="url(#appleGrad)"/>
    <circle cx="62" cy="160" r="9" fill="url(#appleGrad)"/>
    <circle cx="55" cy="168" r="8.5" fill="url(#appleGrad)"/>
    <path d="M45 154 Q46 151 48 153" stroke="#059669" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M62 152 Q63 149 65 151" stroke="#059669" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Crate 2 (Right): Carrots & Leafy Greens (Freshness emphasized) -->
    <path d="M 155 185 L 165 155 L 205 155 L 215 185 Z" fill="url(#crateGrad)"/>
    <ellipse cx="185" cy="162" rx="14" ry="7" fill="#451a03"/>
    <!-- Carrots sticking out -->
    <path d="M175 165 L168 145" stroke="url(#carrotGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M183 165 L180 142" stroke="url(#carrotGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M190 165 L195 144" stroke="url(#carrotGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Carrot Greens -->
    <path d="M168 145 Q165 138 162 142" stroke="url(#leafGrad)" stroke-width="2" fill="none"/>
    <path d="M180 142 Q180 135 185 138" stroke="url(#leafGrad)" stroke-width="2" fill="none"/>
    <path d="M195 144 Q198 137 202 140" stroke="url(#leafGrad)" stroke-width="2" fill="none"/>
  </g>

  <!-- Central Character: Market Vendor / Provider presenting fresh food -->
  <g id="vendor-character">
    <!-- Body / Torso -->
    <path d="M 95 170 C 95 145, 145 145, 145 170 L 155 220 L 85 220 Z" fill="url(#shirtGrad)"/>
    <!-- Apron -->
    <path d="M 102 160 L 138 160 L 142 220 L 98 220 Z" fill="url(#apronGrad)"/>
    <path d="M 112 160 L 112 210 L 128 210 L 128 160 Z" fill="#0284c7" opacity="0.3"/> <!-- Apron Pocket/Detail -->

    <!-- Neck -->
    <rect x="112" y="125" width="16" height="20" fill="url(#skinGrad)"/>

    <!-- Head -->
    <circle cx="120" cy="105" r="22" fill="url(#skinGrad)"/>

    <!-- Hair -->
    <path d="M 98 105 C 98 90, 110 80, 120 80 C 130 80, 142 90, 142 105 C 142 105, 138 95, 120 93 C 102 95, 98 105, 98 105 Z" fill="#334155"/>

    <!-- Facial Expression (Friendly, welcoming smile) -->
    <circle cx="112" cy="102" r="2" fill="#1e293b"/>
    <circle cx="128" cy="102" r="2" fill="#1e293b"/>
    <!-- Rosy cheeks -->
    <circle cx="109" cy="108" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="131" cy="108" r="3" fill="#f43f5e" opacity="0.3"/>
    <!-- Smile -->
    <path d="M 115 110 Q 120 115 125 110" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Arms & Hands Gesturing to Fresh Produce -->
    <!-- Left Arm (Reaching towards apples) -->
    <path d="M 98 160 C 80 160, 65 170, 55 175" stroke="url(#shirtGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="53" cy="176" r="6" fill="url(#skinGrad)"/>

    <!-- Right Arm (Presenting / pointing to carrots) -->
    <path d="M 142 160 C 160 160, 175 170, 185 175" stroke="url(#shirtGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="187" cy="176" r="6" fill="url(#skinGrad)"/>
  </g>

  <!-- Sparkles / Freshness Indicators (Visual metaphor for "fresh" / 新鲜) -->
  <g id="freshness-sparkles">
    <path d="M 55 135 L 57 142 L 64 144 L 57 146 L 55 153 L 53 146 L 46 144 L 53 142 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M 185 130 L 186.5 135 L 191.5 136.5 L 186.5 138 L 185 143 L 183.5 138 L 178.5 136.5 L 183.5 135 Z" fill="#34d399" opacity="0.9"/>
    <circle cx="145" cy="85" r="3" fill="#fbbf24" opacity="0.7"/>
    <circle cx="90" cy="75" r="2" fill="#38bdf8" opacity="0.7"/>
  </g>
</svg>