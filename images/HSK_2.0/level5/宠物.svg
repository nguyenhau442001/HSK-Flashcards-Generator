<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="120" cy="50" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Cushion Gradient -->
    <linearGradient id="cushionGrad" x1="60" y1="160" x2="180" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>

    <!-- Dog Fur Gradient -->
    <linearGradient id="dogFur" x1="90" y1="80" x2="150" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lighting -->
  <circle cx="120" cy="50" r="110" fill="url(#lampGlow)"/>

  <!-- Room Interior / Environment Props -->
  <!-- Wooden Floor Line -->
  <line x1="0" y1="195" x2="240" y2="195" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Background Wall Shelf & Plant Prop -->
  <rect x="25" y="70" num="" width="70" height="6" rx="3" fill="#334155"/>
  <!-- Mini potted plant on shelf -->
  <path d="M50 70 L55 52 L65 52 L70 70 Z" fill="#38bdf8"/>
  <circle cx="60" cy="46" r="12" fill="#10b981"/>
  <circle cx="52" cy="42" r="8" fill="#059669"/>
  <circle cx="68" cy="44" r="9" fill="#34d399"/>

  <!-- Playful Toy (Ball) behind -->
  <circle cx="185" cy="175" r="14" fill="#38bdf8" filter="url(#shadow)"/>
  <path d="M175 167 C185 160, 190 170, 195 183" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Cozy Pet Cushion / Bed -->
  <ellipse cx="120" cy="185" rx="75" ry="25" fill="#831843" filter="url(#shadow)"/>
  <ellipse cx="120" cy="182" rx="68" ry="21" fill="url(#cushionGrad)"/>
  <!-- Cushion pattern details -->
  <ellipse cx="120" cy="182" rx="55" ry="15" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- MAIN SUBJECT: Happy Dog (宠物 - Pet) -->
  <g filter="url(#shadow)">
    <!-- Wagging Tail -->
    <path d="M165 145 C185 130, 190 150, 180 165" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="181" cy="164" r="5" fill="#f59e0b"/>

    <!-- Dog Body -->
    <ellipse cx="120" cy="155" rx="42" ry="32" fill="url(#dogFur)"/>
    
    <!-- Chest Patch (Fluffy white detail) -->
    <path d="M100 140 C110 160, 130 160, 140 140 C145 165, 95 165, 100 140 Z" fill="#fffbeb"/>

    <!-- Paws (Front) -->
    <ellipse cx="102" cy="178" rx="9" ry="12" fill="#f59e0b"/>
    <ellipse cx="138" cy="178" rx="9" ry="12" fill="#f59e0b"/>
    <circle cx="99" cy="184" r="3" fill="#d97706"/>
    <circle cx="105" cy="184" r="3" fill="#d97706"/>
    <circle cx="135" cy="184" r="3" fill="#d97706"/>
    <circle cx="141" cy="184" r="3" fill="#d97706"/>

    <!-- Dog Head Group -->
    <g transform="translate(120, 110)">
      <!-- Left Ear (Floppy) -->
      <path d="M-22 -10 C-38 -5, -42 20, -25 25 C-18 20, -18 5, -18 -5 Z" fill="#d97706"/>
      <!-- Right Ear (Floppy, slightly tilted up for alertness) -->
      <path d="M22 -10 C38 -5, 42 20, 25 25 C18 20, 18 5, 18 -5 Z" fill="#d97706"/>

      <!-- Head Base -->
      <circle cx="0" cy="0" r="30" fill="url(#dogFur)"/>

      <!-- Brow / Forehead Fur Patch -->
      <path d="M-15 -15 C0 -25, 15 -15, 0 -8 Z" fill="#fffbeb"/>

      <!-- Happy Closed Eyes (^ ^) -->
      <path d="M-13 -3 C-10 -8, -6 -8, -3 -3" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M3 -3 C6 -8, 10 -8, 13 -3" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

      <!-- Rosy Cheeks -->
      <circle cx="-16" cy="4" r="5" fill="#fb7185" opacity="0.6"/>
      <circle cx="16" cy="4" r="5" fill="#fb7185" opacity="0.6"/>

      <!-- Snout / Muzzle -->
      <ellipse cx="0" cy="8" rx="14" ry="10" fill="#fffbeb"/>
      
      <!-- Cute Nose -->
      <path d="M-5 4 C-5 2, 5 2, 5 4 C5 8, -5 8, -5 4 Z" fill="#1e293b"/>
      
      <!-- Smiling Mouth & Tongue -->
      <path d="M-6 9 C-6 15, 6 15, 6 9" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Happy Red Tongue -->
      <path d="M-2 13 C-2 18, 2 18, 2 13 Z" fill="#ef4444"/>
    </g>
  </g>

  <!-- Interactive Action / Cute Sparkles & Hearts (Showing affection/vitality) -->
  <path d="M60 110 Q65 100 70 110 T80 110" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Floating Hearts representing pet love -->
  <path d="M45 95 C45 90, 52 85, 55 92 C58 85, 65 90, 65 95 C65 102, 55 108, 55 108 C55 108, 45 102, 45 95 Z" fill="#f43f5e" transform="scale(0.8) translate(10, 10)" opacity="0.9"/>
  <path d="M180 85 C180 81, 186 77, 189 83 C192 77, 198 81, 198 85 C198 91, 189 96, 189 96 C189 96, 180 91, 180 85 Z" fill="#fb7185" transform="scale(0.6) translate(110, 10)" opacity="0.8"/>

  <!-- Golden Sparkles -->
  <path d="M160 55 L163 65 L173 68 L163 71 L160 81 L157 71 L147 68 L157 65 Z" fill="#fbbf24"/>
  <path d="M75 140 L77 146 L83 148 L77 150 L75 156 L73 150 L67 148 L73 146 Z" fill="#fbbf24" opacity="0.7"/>

</svg>