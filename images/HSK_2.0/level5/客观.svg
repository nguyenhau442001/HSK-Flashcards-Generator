<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Lens Gradient (Cyan-Blue) -->
    <linearGradient id="lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Lens Glass Reflection -->
    <linearGradient id="glass-ref" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Holographic Projection Gradient -->
    <linearGradient id="holo-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Soft Shadow -->
    <radialGradient id="shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment Details (Studio / Laboratory for "Objective Analysis") -->
  <g opacity="0.3">
    <!-- Subtle grid lines -->
    <line x1="30" y1="40" x2="210" y2="40" stroke="#475569" stroke-width="0.75" stroke-dasharray="4 4"/>
    <line x1="30" y1="80" x2="210" y2="80" stroke="#475569" stroke-width="0.75" stroke-dasharray="4 4"/>
    <line x1="30" y1="120" x2="210" y2="120" stroke="#475569" stroke-width="0.75" stroke-dasharray="4 4"/>
    
    <!-- Ambient glowing nodes (representing data points) -->
    <circle cx="60" cy="50" r="2" fill="#38bdf8"/>
    <circle cx="180" cy="65" r="1.5" fill="#10b981"/>
    <circle cx="200" cy="110" r="2" fill="#fbbf24"/>
    <circle cx="45" cy="100" r="1.5" fill="#ec4899"/>
  </g>

  <!-- Floor Surface -->
  <ellipse cx="120" cy="195" rx="90" ry="25" fill="url(#shadow-grad)"/>
  <path d="M 20 185 L 220 185 L 230 215 L 10 215 Z" fill="url(#floor-grad)" opacity="0.4"/>
  <line x1="20" y1="185" x2="220" y2="185" stroke="#475569" stroke-width="1.5" opacity="0.6"/>

  <!-- Contextual Props: Data/Evidence Board & Cubes (Left & Right) -->
  <g transform="translate(0, 5)">
    <!-- Small analytical chart block (Left) -->
    <rect x="35" y="130" width="30" height="40" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <!-- Mini bar graphs inside -->
    <rect x="41" y="150" width="4" height="14" rx="1" fill="#38bdf8"/>
    <rect x="49" y="142" width="4" height="22" rx="1" fill="#10b981"/>
    <rect x="57" y="136" width="4" height="28" rx="1" fill="#fbbf24"/>

    <!-- Analytic Cube / Weight Block (Right) -->
    <path d="M 180 145 L 195 137 L 210 145 L 195 153 Z" fill="#475569" stroke="#64748b" stroke-width="1"/>
    <path d="M 180 145 L 180 162 L 195 170 L 195 153 Z" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <path d="M 210 145 L 210 162 L 195 170 L 195 153 Z" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <!-- Glowing face on cube -->
    <circle cx="195" cy="145" r="2" fill="#38bdf8"/>
  </g>

  <!-- Holographic Target / Data Scan Beam -->
  <path d="M 85 85 L 120 40 L 155 85 Z" fill="url(#holo-grad)"/>
  <ellipse cx="120" cy="85" rx="35" ry="10" fill="#34d399" opacity="0.15"/>

  <!-- MAIN SUBJECT: The Great Magnifying Glass & Scale/Objective Instrument (Representing '客观' - Objective View) -->
  <g transform="translate(0, 0)">
    
    <!-- Balance Scale Base (Symbolizing Impartiality / Objectivity) -->
    <path d="M 100 180 L 140 180 L 145 188 L 95 188 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="116" y="130" width="8" height="50" fill="url(#gold-grad)"/>
    
    <!-- Scale Beam -->
    <path d="M 85 130 L 155 130 L 155 136 L 85 136 Z" fill="url(#gold-grad)" rx="2"/>
    <circle cx="120" cy="133" r="5" fill="#f59e0b"/>

    <!-- Left Pan -->
    <path d="M 85 136 L 70 165 L 100 165 Z" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="85" cy="165" rx="16" ry="5" fill="#334155" stroke="#64748b" stroke-width="1.5"/>

    <!-- Right Pan -->
    <path d="M 155 136 L 140 165 L 170 165 Z" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="155" cy="165" rx="16" ry="5" fill="#334155" stroke="#64748b" stroke-width="1.5"/>

    <!-- Floating Object in Pan (Evidence/Truth) -->
    <circle cx="155" cy="158" r="5" fill="#38bdf8"/>

    <!-- THE MAGNIFYING GLASS (Hero Element for Close Observation) -->
    <!-- Handle -->
    <g transform="rotate(-35 120 105)">
      <!-- Angled handle extending down-right -->
      <rect x="114" y="105" width="12" height="60" rx="6" fill="url(#gold-grad)" stroke="#b45309" stroke-width="1.5"/>
      <rect x="117" y="112" width="6" height="46" rx="3" fill="#fbbf24" opacity="0.4"/>
      <!-- Grip ridges -->
      <line x1="114" y1="125" x2="126" y2="125" stroke="#b45309" stroke-width="1.5"/>
      <line x1="114" y1="135" x2="126" y2="135" stroke="#b45309" stroke-width="1.5"/>
      <line x1="114" y1="145" x2="126" y2="145" stroke="#b45309" stroke-width="1.5"/>
    </g>

    <!-- Glass Rim (Outer Ring) -->
    <circle cx="120" cy="95" r="46" fill="#0f172a" stroke="url(#gold-grad)" stroke-width="6"/>
    <!-- Inner Lens Fill -->
    <circle cx="120" cy="95" r="40" fill="url(#lens-grad)"/>
    <circle cx="120" cy="95" r="40" fill="url(#glass-ref)"/>

    <!-- Magnified Content Inside Lens (Vivid Scene: Clear Data & Target) -->
    <g clip-path="url(#lens-clip)">
      <clipPath id="lens-clip">
        <circle cx="120" cy="95" r="40"/>
      </clipPath>
      
      <!-- Inner grid / data pattern -->
      <path d="M 90 95 L 150 95" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
      <path d="M 120 65 L 120 125" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
      
      <!-- Target concentric circles -->
      <circle cx="120" cy="95" r="25" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
      <circle cx="120" cy="95" r="12" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8"/>
      <circle cx="120" cy="95" r="3" fill="#10b981"/>

      <!-- Magnified 3D Checkmark (Signifying "Accurate / Objective truth") -->
      <path d="M 110 95 L 117 102 L 132 86" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Glass glossy highlight overlay -->
      <path d="M 95 70 C 105 60, 135 60, 145 75 C 135 70, 105 70, 95 70 Z" fill="#ffffff" opacity="0.5"/>
    </g>
    
    <!-- Outer Rim Highlight -->
    <path d="M 85 75 C 95 62, 145 62, 155 75" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Floating Sparkles & Detail Elements (Adding high app-quality polish) -->
  <g>
    <!-- Top-Left Sparkle -->
    <path d="M 50 45 Q 50 55 40 55 Q 50 55 50 65 Q 50 55 60 55 Q 50 55 50 45 Z" fill="#38bdf8"/>
    
    <!-- Top-Right Sparkle (Gold) -->
    <path d="M 190 55 Q 190 63 182 63 Q 190 63 190 71 Q 190 63 198 63 Q 190 63 190 55 Z" fill="#fbbf24"/>

    <!-- Bottom-Right Green Accent Star -->
    <path d="M 185 130 Q 185 136 179 136 Q 185 136 185 142 Q 185 136 191 136 Q 185 136 185 130 Z" fill="#34d399"/>
    
    <!-- Floating Data Particle dots -->
    <circle cx="75" cy="70" r="2.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="165" cy="115" r="2" fill="#fbbf24" opacity="0.8"/>
    <circle cx="95" cy="130" r="1.5" fill="#34d399" opacity="0.9"/>
  </g>

  <!-- Dynamic Lens Glint Ray -->
  <polygon points="120,45 124,55 128,45 124,35" fill="#ffffff" opacity="0.7"/>

</svg>