<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Props -->
  <!-- Bookshelf in background -->
  <rect x="25" y="40" width="45" height="75" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="30" y="55" width="35" height="6" rx="2" fill="#475569"/>
  <rect x="30" y="75" width="35" height="6" rx="2" fill="#475569"/>
  <rect x="30" y="95" width="35" height="6" rx="2" fill="#475569"/>
  <!-- Colored books on shelf -->
  <path d="M33 55l4-15h4l-4 15z" fill="#ec4899"/>
  <path d="M40 55l2-15h4l-2 15z" fill="#38bdf8"/>
  <path d="M50 75l3-12h4l-3 12z" fill="#10b981"/>

  <!-- Window with Night City Silhouette / Moonlight -->
  <path d="M175 35h35v65h-35z" fill="url(#windowLight)" stroke="#475569" stroke-width="2"/>
  <path d="M192.5 35v65" stroke="#475569" stroke-width="1.5"/>
  <path d="M175 67.5h35" stroke="#475569" stroke-width="1.5"/>

  <!-- Desk & Lamp Ambient Glow -->
  <ellipse cx="120" cy="180" rx="100" ry="40" fill="url(#lampGlow)"/>

  <!-- Wooden Desk Surface -->
  <path d="M20 165h200v45H20z" fill="#334155" rx="4"/>
  <path d="M20 160h200v7H20z" fill="#475569" rx="2"/>

  <!-- The Outline / Daan Yi (提纲) Document Focus -->
  <g transform="translate(100, 130) rotate(-4)">
    <!-- Paper Sheet -->
    <rect x="0" y="0" width="55" height="70" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Heading icon / Main topic block -->
    <rect x="8" y="8" width="22" height="6" rx="2" fill="#fb923c"/>
    <!-- Bullet points outlining structure -->
    <circle cx="11" cy="23" r="2.5" fill="#38bdf8"/>
    <rect x="17" y="21.5" width="26" height="3" rx="1.5" fill="#94a3b8"/>
    
    <circle cx="11" cy="33" r="2.5" fill="#38bdf8"/>
    <rect x="17" y="31.5" width="20" height="3" rx="1.5" fill="#94a3b8"/>
    <rect x="17" y="37" width="24" height="3" rx="1.5" fill="#94a3b8"/>

    <circle cx="11" cy="49" r="2.5" fill="#38bdf8"/>
    <rect x="17" y="47.5" width="18" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Secondary Prop: Coffee Mug -->
  <rect x="170" y="145" width="16" height="20" rx="3" fill="#e2e8f0"/>
  <path d="M186 150c4 0 4 8 0 8" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Steam from coffee -->
  <path d="M175 137c2-3 0-5 2-8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Character: Upper Body, Focused & Thoughtful -->
  <g transform="translate(40, 75)">
    <!-- Torso & Clothing -->
    <path d="M25 95c0-18 10-25 35-25s35 7 35 25v15H25z" fill="#0284c7"/>
    <!-- Collar -->
    <path d="M50 70l10 12h-20z" fill="#f8fafc"/>
    <path d="M53 82l7 6 7-6" fill="none" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Neck -->
    <rect x="46" y="58" width="10" height="15" fill="#fcd34d" rx="4"/>

    <!-- Head & Hair -->
    <circle cx="51" cy="45" r="18" fill="#fcd34d"/>
    <!-- Friendly Styled Hair -->
    <path d="M33 45c0-12 8-20 20-20 10 0 17 6 18 16-3-2-7-3-11-3-8 0-14 4-17 10-3 1-6 0-10-3z" fill="#334155"/>

    <!-- Facial Expression (Thoughtful / Planning) -->
    <!-- Eyebrows slightly arched in focus -->
    <path d="M40 39q4-3 8 0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M55 39q4-3 8 0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes (focused looking down towards the outline) -->
    <circle cx="44" cy="44" r="2.5" fill="#1e293b"/>
    <circle cx="60" cy="44" r="2.5" fill="#1e293b"/>
    <!-- Gentle determined smile -->
    <path d="M49 52q3 2 6 0" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Character's Hand actively holding pen / pointing at the outline -->
  <g transform="translate(100, 140)">
    <!-- Arm -->
    <path d="M-15 35c10-5 25-10 35-15" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <!-- Hand / Fingers -->
    <circle cx="20" cy="18" r="6" fill="#fcd34d"/>
    <!-- Pen -->
    <path d="M22 15l15-20" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M34-2l4-5 1 1-5 4z" fill="#334155"/>
  </g>

  <!-- Desk Lamp Fixture (Top Right / Overhead) -->
  <path d="M190 10l-20 30" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M162 33l26 12-8 15-26-12z" fill="#f59e0b"/>
  <!-- Light beam cone overlay (subtle) -->
  <path d="M165 60L100 160h60z" fill="#fbbf24" opacity="0.08"/>

</svg>