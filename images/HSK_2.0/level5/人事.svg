<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Office Glow Gradient -->
    <radialGradient id="desk-glow" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Light Beam -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Character 1 Gradients (HR Manager) -->
    <linearGradient id="hr-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 Gradients (Candidate / Colleague) -->
    <linearGradient id="cand-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    
    <!-- Folder Gradient -->
    <linearGradient id="folder-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- BACKGROUND & ENVIRONMENT (HR Office Context) -->
  <!-- Wall Art / Certificate Frame -->
  <rect x="25" y="35" width="35" height="26" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <rect x="29" y="39" width="27" height="18" fill="#f8fafc" opacity="0.9" />
  <line x1="33" y1="45" x2="52" y2="45" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="33" y1="51" x2="45" y2="51" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <circle cx="50" cy="51" r="2" fill="#ef4444" />

  <!-- Window with city silhouette and light beam -->
  <rect x="175" y="30" width="36" height="50" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <polygon points="175,80 175,30 211,30 211,80" fill="url(#window-light)" />
  <!-- City buildings outside window -->
  <rect x="180" y="55" width="8" height="25" fill="#1e293b" />
  <rect x="190" y="48" width="10" height="32" fill="#1e293b" />
  <rect x="201" y="60" width="7" height="20" fill="#1e293b" />
  <!-- Window frames -->
  <line x1="193" y1="30" x2="193" y2="80" stroke="#334155" stroke-width="1.5" />
  <line x1="175" y1="55" x2="211" y2="55" stroke="#334155" stroke-width="1.5" />

  <!-- Bookshelf in background -->
  <g transform="translate(130, 25)">
    <rect x="0" y="0" width="30" height="60" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="2" />
    <line x1="0" y1="20" x2="30" y2="20" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="40" x2="30" y2="40" stroke="#334155" stroke-width="1.5" />
    <!-- Books -->
    <rect x="4" y="8" width="5" height="12" fill="#38bdf8" rx="1" />
    <rect x="10" y="6" width="6" height="14" fill="#fbbf24" rx="1" />
    <rect x="17" y="10" width="4" height="10" fill="#10b981" rx="1" />
    <rect x="5" y="27" width="8" height="13" fill="#ec4899" rx="1" />
    <rect x="15" y="25" width="10" height="15" fill="#6366f1" rx="1" />
  </g>

  <!-- Ambient Desk Glow -->
  <circle cx="120" cy="160" r="90" fill="url(#desk-glow)" />

  <!-- Office Plant -->
  <g transform="translate(15, 125)">
    <path d="M10,35 Q10,25 15,20 L25,20 Q30,25 30,35 Z" fill="#64748b" />
    <path d="M20,20 Q5,0 0,-10 Q10,-10 20,5 Z" fill="#10b981" />
    <path d="M20,20 Q30,-5 38,-12 Q33,2 20,15 Z" fill="#059669" />
    <path d="M20,20 Q20,-5 20,-18 Q25,0 20,20 Z" fill="#34d399" />
  </g>

  <!-- Desk Surface -->
  <path d="M40,165 L200,165 L215,195 L25,195 Z" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <rect x="35" y="160" width="170" height="7" rx="2" fill="#475569" />

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M85,150 L115,150 L122,163 L78,163 Z" fill="#94a3b8" />
  <rect x="88" y="132" width="24" height="19" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
  <rect x="91" y="135" width="18" height="13" fill="#0f172a" />

  <!-- Coffee Mug -->
  <rect x="135" y="148" width="12" height="15" rx="2" fill="#f8fafc" />
  <path d="M147,151 C151,151 151,159 147,159" stroke="#f8fafc" stroke-width="2" fill="none" />
  <!-- Steam -->
  <path d="M139,142 Q141,137 139,132" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- HR Portfolio / Resume Folder (Central Focus for "HR Work") -->
  <g transform="translate(100, 142) rotate(-8)">
    <rect x="0" y="0" width="30" height="22" rx="2" fill="url(#folder-grad)" />
    <path d="M0,4 L10,4 L13,8 L30,8" stroke="#b45309" stroke-width="1" fill="none" />
    <!-- Paper sticking out representing resumes/hiring docs -->
    <rect x="3" y="-4" width="24" height="15" fill="#f8fafc" rx="1" />
    <line x1="6" y1="1" x2="20" y2="1" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="5" x2="16" y2="5" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="9" x2="22" y2="9" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <!-- Miniature ID Photo box on resume -->
    <rect x="18" y="-2" width="6" height="7" fill="#38bdf8" rx="0.5" />
  </g>

  <!-- CHARACTERS -->

  <!-- CHARACTER 1: HR Manager (Left, gesturing professionally to the folder/work) -->
  <g transform="translate(45, 80)">
    <!-- Body / Torso -->
    <path d="M30,55 L55,55 L65,95 L20,95 Z" fill="url(#hr-shirt)" />
    <!-- Collar & Tie -->
    <path d="M38,55 L42,65 L46,55 Z" fill="#f8fafc" />
    <polygon points="40,62 44,62 43,80 41,80" fill="#f59e0b" />
    
    <!-- Head & Neck -->
    <rect x="37" y="44" width="8" height="14" fill="#fed7aa" />
    <circle cx="41" cy="36" r="16" fill="#fed7aa" />
    
    <!-- Hair (Professional neat haircut) -->
    <path d="M26,34 Q28,20 41,20 Q54,20 56,34 Q53,26 41,25 Q29,26 26,34 Z" fill="#334155" />
    <path d="M25,32 Q25,40 28,42" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Face Expression (Smiling, confident, welcoming) -->
    <circle cx="36" cy="34" r="1.5" fill="#1e293b" />
    <circle cx="46" cy="34" r="1.5" fill="#1e293b" />
    <!-- Glasses -->
    <rect x="33" y="31" width="6" height="5" rx="1" fill="none" stroke="#334155" stroke-width="1.5" />
    <rect x="43" y="31" width="6" height="5" rx="1" fill="none" stroke="#334155" stroke-width="1.5" />
    <line x1="39" y1="33" x2="43" y2="33" stroke="#334155" stroke-width="1.5" />
    <!-- Smile -->
    <path d="M38,41 Q41,44 44,41" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Rosy cheeks -->
    <circle cx="34" cy="38" r="2" fill="#fb7185" opacity="0.4" />
    <circle cx="48" cy="38" r="2" fill="#fb7185" opacity="0.4" />

    <!-- Arms & Hands (Pointing/Explaining gesture toward folder) -->
    <!-- Back arm -->
    <path d="M25,60 L15,75 L22,80" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front arm gesturing forward -->
    <path d="M52,60 L68,75 L78,70" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand -->
    <circle cx="80" cy="69" r="4" fill="#fed7aa" />
  </g>

  <!-- CHARACTER 2: Candidate / Employee (Right, listening / reviewing HR documents) -->
  <g transform="translate(135, 75)">
    <!-- Body / Torso -->
    <path d="M30,60 L60,60 L70,100 L20,100 Z" fill="url(#cand-shirt)" />
    <!-- Collar -->
    <path d="M40,60 L45,68 L50,60 Z" fill="#f8fafc" />

    <!-- Head & Neck -->
    <rect x="41" y="48" width="8" height="14" fill="#fcd34d" /> <!-- Slightly different skin tone for diversity -->
    <circle cx="45" cy="38" r="16" fill="#fcd34d" />

    <!-- Hair (Trendy modern style) -->
    <path d="M30,36 Q32,20 46,22 Q60,24 59,38 Q55,27 45,26 Q35,27 30,36 Z" fill="#78350f" />
    <path d="M56,33 Q60,35 58,40" fill="#78350f" />

    <!-- Face Expression (Attentive, engaged) -->
    <circle cx="40" cy="36" r="1.5" fill="#1e293b" />
    <circle cx="50" cy="36" r="1.5" fill="#1e293b" />
    <!-- Gentle inquiring eyebrows -->
    <path d="M38,32 Q40,30 42,32" stroke="#78350f" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M48,32 Q50,30 52,32" stroke="#78350f" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Mouth (thoughtful small smile) -->
    <path d="M43,43 Q46,45 49,43" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Arms & Hands (One hand holding chin thoughtfully, one resting) -->
    <!-- Back arm resting -->
    <path d="M60,65 L70,85 L65,95" fill="none" stroke="#be185d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front arm holding chin -->
    <path d="M35,65 L25,75 L32,60" fill="none" stroke="#be185d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Hand on chin -->
    <circle cx="32" cy="57" r="4" fill="#fcd34d" />
  </g>

  <!-- Floating accent elements representing "HR processes" (recruitment, organization, files) -->
  <!-- Floating Checkmark Badge (Clean, flat vector icon style) -->
  <g transform="translate(112, 50)">
    <circle cx="0" cy="0" r="12" fill="#10b981" />
    <path d="M-4,-1 L-1,3 L5,-4" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Floating ID Badge / Lanyard Accent -->
  <g transform="translate(185, 115) rotate(12)">
    <rect x="0" y="0" width="16" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="3" y="3" width="10" height="7" fill="#38bdf8" rx="1" />
    <circle cx="8" cy="6" r="2" fill="#0f172a" />
    <line x1="3" y1="13" x2="13" y2="13" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="3" y1="16" x2="10" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <!-- Lanyard strap -->
    <path d="M8,0 L8,-8" stroke="#ef4444" stroke-width="2" />
  </g>

  <!-- Foreground subtle vignette overlay for depth -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>