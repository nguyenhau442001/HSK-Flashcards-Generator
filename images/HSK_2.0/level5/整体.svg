<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" fill="url(#bgGrad)"/>

  <!-- Studio / Architecture Office Environment -->
  <!-- Ambient background elements -->
  <path d="M20 180 L220 180" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Large Design Board / Architecture Blueprint Screen -->
  <rect x="40" y="35" width="160" height="110" rx="6" fill="#090d16" stroke="#475569" stroke-width="2"/>
  <rect x="48" y="43" width="144" height="94" rx="4" fill="url(#screenGrad)"/>

  <!-- Blueprint Mockup (The "Overall" City/Master Plan) -->
  <g transform="translate(48, 43)">
    <!-- Grid lines representing holistic view -->
    <path d="M0 20 H144 M0 40 H144 M0 60 H144 M0 80 H144" stroke="#334155" stroke-width="0.5" stroke-dasharray="3 3"/>
    <path d="M30 0 V94 M60 0 V94 M90 0 V94 M120 0 V94" stroke="#334155" stroke-width="0.5" stroke-dasharray="3 3"/>

    <!-- Master Plan Graphic Shapes (representing holistic design) -->
    <rect x="15" y="25" width="25" height="20" rx="2" fill="#38bdf8" opacity="0.6"/>
    <rect x="45" y="15" width="30" height="40" rx="2" fill="#10b981" opacity="0.6"/>
    <circle cx="105" cy="45" r="16" fill="#fb923c" opacity="0.6"/>
    <path d="M15 70 Q 50 50, 90 75 T 130 60" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Connection lines showing integration/whole concept -->
    <line x1="27" y1="35" x2="60" y2="35" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="2 2" filter="url(#glow)"/>
    <line x1="75" y1="35" x2="105" y2="35" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="2 2" filter="url(#glow)"/>
  </g>

  <!-- Spotlight / Holistic Field of View Cone -->
  <polygon points="120,0 20,200 220,200" fill="url(#beamGrad)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Desk Surface -->
  <path d="M10 200 L230 200 L240 216 L0 216 Z" fill="#334155"/>
  <path d="M0 200 L240 200" stroke="#475569" stroke-width="2"/>

  <!-- Desk Props -->
  <!-- Architectural Model (Miniature Building) -->
  <g transform="translate(165, 180)">
    <polygon points="0,20 15,10 30,20 30,35 0,35" fill="#cbd5e1"/>
    <polygon points="15,10 30,20 45,10 30,0" fill="#94a3b8"/>
    <rect x="8" y="22" width="6" height="13" fill="#64748b"/>
    <rect x="20" y="22" width="6" height="13" fill="#64748b"/>
  </g>

  <!-- Coffee Mug -->
  <rect x="25" y="188" width="12" height="14" rx="2" fill="#f8fafc"/>
  <path d="M37 191 C 41 191, 41 198, 37 199" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

  <!-- Main Character (Lead Architect / Art Director gesturing to the "Overall" view) -->
  <g transform="translate(65, 115)">
    <!-- Character Body / Torso (leaning forward) -->
    <path d="M 30 50 Q 25 30, 40 20 L 60 30 Q 65 50, 60 85 L 30 85 Z" fill="#0284c7"/> <!-- Blue shirt -->
    <path d="M 35 25 L 45 15 L 55 25 Z" fill="#38bdf8"/> <!-- Collar -->

    <!-- Head -->
    <circle cx="45" cy="10" r="12" fill="#fbcfe8"/> <!-- Skin tone -->
    <!-- Hair -->
    <path d="M 33 8 Q 45 -2, 57 10 Q 57 4, 45 2 Q 33 2, 33 8 Z" fill="#334155"/>
    
    <!-- Glasses -->
    <rect x="40" y="6" width="6" height="4" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="48" y="6" width="6" height="4" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="46" y1="8" x2="48" y2="8" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Left Arm & Hand pointing to the big picture/screen -->
    <path d="M 30 40 Q 10 30, -5 20" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <!-- Pointing Finger -->
    <circle cx="-5" cy="20" r="3.5" fill="#fbcfe8"/>
    <path d="M -5 20 L -12 18" stroke="#fbcfe8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Arm (resting on hip or desk) -->
    <path d="M 55 40 Q 65 55, 55 75" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <circle cx="55" cy="75" r="3.5" fill="#fbcfe8"/>
  </g>

  <!-- Secondary Character (Colleague observing the overall picture) -->
  <g transform="translate(130, 125)">
    <!-- Torso -->
    <path d="M 20 40 Q 25 20, 35 15 L 50 25 Q 45 45, 40 75 L 15 75 Z" fill="#10b981"/> <!-- Green sweater -->

    <!-- Head -->
    <circle cx="33" cy="8" r="11" fill="#fcd34d"/>
    <!-- Hair (Bun) -->
    <circle cx="33" cy="-4" r="5" fill="#451a03"/>
    <path d="M 23 8 Q 33 -2, 43 8 Z" fill="#451a03"/>

    <!-- Arms crossed / attentive posture -->
    <path d="M 20 40 L 40 45 L 35 60 L 25 55" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing Accent elements emphasizing focus on "Overall" / "Big Picture" -->
  <circle cx="120" cy="90" r="65" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" filter="url(#glow)"/>

</svg>