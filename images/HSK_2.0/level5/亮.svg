<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Light Glow Gradient -->
    <radialGradient id="roomGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Lamp Beam Gradient -->
    <linearGradient id="lampBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Clip Path for Room Interior -->
    <clipPath id="roomClip">
      <rect x="20" y="20" width="200" height="200" rx="20" />
    </clipPath>
  </defs>

  <!-- Full-bleed container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Group -->
  <g clip-path="url(#roomClip)">
    <!-- Back Wall -->
    <rect x="20" y="20" width="200" height="155" fill="#334155" />

    <!-- Floor -->
    <polygon points="20,175 220,175 230,220 10,220" fill="#1e293b" />
    <!-- Floor Planks / Lines -->
    <line x1="60" y1="175" x2="30" y2="220" stroke="#334155" stroke-width="1.5" opacity="0.6" />
    <line x1="120" y1="175" x2="110" y2="220" stroke="#334155" stroke-width="1.5" opacity="0.6" />
    <line x1="180" y1="175" x2="190" y2="220" stroke="#334155" stroke-width="1.5" opacity="0.6" />

    <!-- Ambient Room Brightness (The "Liàng" effect) -->
    <rect x="20" y="20" width="200" height="200" fill="url(#roomGlow)" />

    <!-- Window on Back Wall -->
    <rect x="135" y="45" width="55" height="75" rx="4" fill="#0f172a" />
    <rect x="140" y="50" width="45" height="65" rx="2" fill="url(#windowLight)" />
    <!-- Window Frame Cross -->
    <line x1="162" y1="50" x2="162" y2="115" stroke="#334155" stroke-width="3" />
    <line x1="140" y1="82.5" x2="185" y2="82.5" stroke="#334155" stroke-width="3" />

    <!-- Bookshelf / Prop on Back Wall -->
    <rect x="35" y="55" width="40" height="60" rx="2" fill="#475569" />
    <line x1="35" y1="75" x2="75" y2="75" stroke="#334155" stroke-width="2" />
    <line x1="35" y1="95" x2="75" y2="95" stroke="#334155" stroke-width="2" />
    <!-- Colorful books -->
    <rect x="40" y="60" width="6" height="15" fill="#f43f5e" rx="1" />
    <rect x="48" y="62" width="5" height="13" fill="#0ea5e9" rx="1" />
    <rect x="55" y="58" width="8" height="17" fill="#10b981" rx="1" />
    <rect x="42" y="80" width="7" height="15" fill="#fbbf24" rx="1" />
    <rect x="51" y="82" width="6" height="13" fill="#a855f7" rx="1" />

    <!-- Desk / Table -->
    <path d="M50,145 L150,145 L160,175 L40,175 Z" fill="#64748b" />
    <rect x="45" y="140" width="110" height="8" rx="2" fill="#94a3b8" />
    <!-- Desk legs -->
    <rect x="55" y="175" width="8" height="30" fill="#475569" />
    <rect x="137" y="175" width="8" height="30" fill="#475569" />

    <!-- Ceiling Lamp Fixture & Beam -->
    <path d="M100,20 L100,45" stroke="#475569" stroke-width="3" />
    <path d="M85,45 L115,45 L120,55 L80,55 Z" fill="#cbd5e1" />
    <!-- Light Cone -->
    <polygon points="100,55 35,175 165,175" fill="url(#lampBeam)" />
    <!-- Glowing Bulb Center -->
    <circle cx="100" cy="52" r="5" fill="#fef08a" />
    <circle cx="100" cy="52" r="12" fill="#f59e0b" opacity="0.4" />

    <!-- Plant on Desk -->
    <path d="M60,140 Q65,130 70,140 Z" fill="#34d399" />
    <path d="M63,140 Q55,133 58,125 Q63,133 63,140 Z" fill="#10b981" />
    <path d="M67,140 Q75,133 72,125 Q67,133 67,140 Z" fill="#059669" />
    <ellipse cx="65" cy="140" rx="7" ry="5" fill="#f43f5e" />

    <!-- Open Book on Desk -->
    <path d="M90,142 Q100,138 110,142 L110,152 Q100,148 90,152 Z" fill="#f8fafc" />
    <path d="M110,142 Q120,138 130,142 L130,152 Q120,148 110,152 Z" fill="#f1f5f9" />
    <line x1="110" y1="142" x2="110" y2="152" stroke="#cbd5e1" stroke-width="1" />

    <!-- Character: Happy Person reading/enjoying the bright room -->
    <!-- Chair -->
    <rect x="85" y="150" width="30" height="25" rx="4" fill="#334155" />
    <path d="M90,130 L110,130 L112,155 L88,155 Z" fill="#475569" />

    <!-- Body / Hoodie -->
    <path d="M82,145 C82,130 90,125 100,125 C110,125 118,130 118,145 L122,175 L78,175 Z" fill="#ec4899" />
    <!-- Hoodie Strings -->
    <line x1="95" y1="133" x2="95" y2="145" stroke="#fce7f3" stroke-width="1.5" />
    <line x1="105" y1="133" x2="105" y2="145" stroke="#fce7f3" stroke-width="1.5" />

    <!-- Arms -->
    <path d="M84,138 C75,142 78,152 88,155" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" />
    <path d="M116,138 C125,142 122,152 112,155" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" />
    <!-- Hands -->
    <circle cx="87" cy="155" r="4" fill="#fbcfe8" />
    <circle cx="113" cy="155" r="4" fill="#fbcfe8" />

    <!-- Neck -->
    <rect x="96" y="117" width="8" height="12" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="100" cy="108" r="14" fill="#fbcfe8" />

    <!-- Hair -->
    <path d="M86,108 C86,96 114,96 114,108 C114,112 112,110 110,105 C108,98 92,98 90,105 C88,110 86,112 86,108 Z" fill="#1e293b" />
    <path d="M92,98 C95,94 105,94 108,98 Q100,92 92,98 Z" fill="#1e293b" />

    <!-- Expressive Happy Face -->
    <!-- Eyes (happy arches) -->
    <path d="M93,106 Q96,103 98,106" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M102,106 Q104,103 107,106" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Cheeks (blush) -->
    <circle cx="92" cy="110" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="108" cy="110" r="3" fill="#f43f5e" opacity="0.4" />
    <!-- Smile -->
    <path d="M97,112 Q100,116 103,112" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Sparkles indicating "Bright" (Liàng) -->
    <g fill="#fef08a">
      <!-- Sparkle 1 (Top left) -->
      <path d="M45,75 Q45,85 35,85 Q45,85 45,95 Q45,85 55,85 Q45,85 45,75 Z" transform="scale(0.8) translate(10, 10)" />
      <!-- Sparkle 2 (Top right near window) -->
      <path d="M195,55 Q195,63 187,63 Q195,63 195,71 Q195,63 203,63 Q195,63 195,55 Z" />
      <!-- Sparkle 3 (Floating near lamp) -->
      <path d="M75,95 Q75,101 69,101 Q75,101 75,107 Q75,101 81,101 Q75,101 75,95 Z" />
    </g>
  </g>

  <!-- Clean Border / Frame Stroke -->
  <rect x="20" y="20" width="200" height="200" rx="20" fill="none" stroke="#475569" stroke-width="2" opacity="0.5" />
</svg>