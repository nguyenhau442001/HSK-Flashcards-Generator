<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing effect for construction crane and neon trails -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Building Gradients -->
    <linearGradient id="skyline-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skyline-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Neon Light Streaks for "Continuous Motion" -->
    <linearGradient id="streak-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    
    <linearGradient id="streak-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Glow in Sky (City expanding upwards) -->
  <circle cx="120" cy="140" r="80" fill="#38bdf8" opacity="0.05" filter="url(#soft-glow)" />
  <circle cx="170" cy="100" r="50" fill="#f59e0b" opacity="0.06" filter="url(#soft-glow)" />

  <!-- Background Layer: Distant Skyscrapers -->
  <g id="distant-city" opacity="0.4">
    <rect x="20" y="110" width="25" height="100" fill="url(#skyline-grad-1)" />
    <rect x="50" y="90" width="30" height="120" fill="url(#skyline-grad-2)" />
    <rect x="160" y="80" width="35" height="130" fill="url(#skyline-grad-1)" />
    <rect x="200" y="100" width="25" height="110" fill="url(#skyline-grad-2)" />
  </g>

  <!-- Midground Layer: Active Growing Cityscape -->
  <g id="active-city">
    <!-- Left Building (Modern Glass) -->
    <path d="M 45 210 L 45 130 L 75 120 L 75 210 Z" fill="#1e293b" />
    <!-- Building Windows Grid -->
    <rect x="52" y="135" width="6" height="8" rx="1" fill="#38bdf8" opacity="0.6" />
    <rect x="63" y="135" width="6" height="8" rx="1" fill="#38bdf8" opacity="0.3" />
    <rect x="52" y="150" width="6" height="8" rx="1" fill="#38bdf8" opacity="0.8" />
    <rect x="63" y="150" width="6" height="8" rx="1" fill="#38bdf8" opacity="0.6" />
    <rect x="52" y="165" width="6" height="8" rx="1" fill="#f59e0b" opacity="0.7" />
    <rect x="63" y="165" width="6" height="8" rx="1" fill="#38bdf8" opacity="0.4" />

    <!-- Center-Right Rising Skyscraper (Under Construction / Expanding) -->
    <path d="M 95 210 L 95 70 L 145 55 L 145 210 Z" fill="#334155" />
    <!-- Construction structural lines -->
    <line x1="95" y1="90" x2="145" y2="75" stroke="#475569" stroke-width="2" />
    <line x1="95" y1="110" x2="145" y2="95" stroke="#475569" stroke-width="2" />
    <line x1="95" y1="130" x2="145" y2="115" stroke="#475569" stroke-width="2" />
    <line x1="95" y1="150" x2="145" y2="135" stroke="#475569" stroke-width="2" />
    <line x1="95" y1="170" x2="145" y2="155" stroke="#475569" stroke-width="2" />
    <line x1="95" y1="190" x2="145" y2="175" stroke="#475569" stroke-width="2" />

    <!-- Right Building -->
    <path d="M 155 210 L 155 100 L 195 110 L 195 210 Z" fill="#1e293b" />
    <rect x="165" y="120" width="8" height="10" rx="1" fill="#10b981" opacity="0.5" />
    <rect x="178" y="120" width="8" height="10" rx="1" fill="#38bdf8" opacity="0.8" />
    <rect x="165" y="140" width="8" height="10" rx="1" fill="#38bdf8" opacity="0.5" />
    <rect x="178" y="140" width="8" height="10" rx="1" fill="#f59e0b" opacity="0.8" />
  </g>

  <!-- Giant Tower Crane (Symbolizing Continuous Building/Progress) -->
  <g id="tower-crane" filter="url(#glow)">
    <!-- Crane Mast -->
    <path d="M 120 70 L 123 210 L 127 210 L 124 70 Z" fill="#f59e0b" />
    <!-- Crane Arm (Jib) extending left -->
    <path d="M 60 45 L 125 70 L 120 75 L 60 52 Z" fill="#fbbf24" />
    <!-- Crane Counter-jib -->
    <path d="M 125 70 L 145 78 L 143 82 L 123 74 Z" fill="#fbbf24" />
    <!-- Counterweight -->
    <rect x="143" y="75" width="8" height="14" fill="#64748b" rx="1" />
    <!-- Crane Cab -->
    <rect x="115" y="65" width="10" height="10" fill="#38bdf8" rx="2" />
    <!-- Hanging Cable & Hook -->
    <line x1="75" y1="50" x2="75" y2="90" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 2" />
    <path d="M 72 90 L 78 90 L 75 96 Z" fill="#f59e0b" />
    <!-- Glowing beam load -->
    <rect x="68" y="96" width="14" height="6" rx="1" fill="#10b981" />
  </g>

  <!-- Foreground Layer: Dynamic Motion Trails & Infrastructure (Representing '不断' / Continuous Flow) -->
  <!-- Highway / Curved Traffic Flow with Light Streaks -->
  <path d="M -10 215 Q 60 195 120 205 T 250 195" fill="none" stroke="#0f172a" stroke-width="16" />
  
  <!-- Continuous Traffic Light Streaks (Orange / White) -->
  <path d="M 10 205 Q 60 190 120 200 T 230 190" fill="none" stroke="url(#streak-amber)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 30 210 Q 80 195 140 205 T 240 195" fill="none" stroke="url(#streak-cyan)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Futuristic Infinity / Continuous Loop Ribbon weaving through the city (Visual Metaphor for "Constant/Continuous") -->
  <g id="continuous-flow-ribbon" filter="url(#glow)">
    <!-- Back loop -->
    <path d="M 40 170 C 20 130 80 110 100 130 C 120 150 150 180 180 140 C 200 110 220 130 210 160" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="8 4" opacity="0.4" />
    
    <!-- Main dynamic glowing path representing unbroken continuity -->
    <path d="M 15 190 Q 50 130 90 140 T 150 120 T 225 105" fill="none" stroke="url(#streak-cyan)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Glowing pulse dots along the continuous line -->
    <circle cx="52" cy="142" r="3" fill="#ffffff" filter="url(#glow)" />
    <circle cx="118" cy="130" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="178" cy="115" r="3.5" fill="#f59e0b" filter="url(#glow)" />
  </g>

  <!-- Action Sparkles / Growth Nodes -->
  <!-- Top Right Sparkle -->
  <path d="M 195 50 Q 195 65 210 65 Q 195 65 195 80 Q 195 65 180 65 Q 195 65 195 50" fill="#f59e0b" filter="url(#glow)" />
  <!-- Mid Left Sparkle -->
  <path d="M 35 90 Q 35 98 43 98 Q 35 98 35 106 Q 35 98 27 98 Q 35 98 35 90" fill="#38bdf8" filter="url(#glow)" />
  <!-- Lower Right Accent Node -->
  <circle cx="210" cy="180" r="3" fill="#10b981" filter="url(#glow)" />
  <circle cx="25" cy="185" r="2" fill="#ec4899" filter="url(#glow)" />

  <!-- Upward Rising Arrows integrated into architecture / floating (Progress & Continuity) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <!-- Arrow 1 (Small) -->
    <path d="M 105 105 L 112 98 L 119 105" filter="url(#glow)" />
    <!-- Arrow 2 (Medium) -->
    <path d="M 135 85 L 145 75 L 155 85" stroke="#f59e0b" filter="url(#glow)" />
  </g>

  <!-- Vignette overlay for cinematic App Illustration look -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>