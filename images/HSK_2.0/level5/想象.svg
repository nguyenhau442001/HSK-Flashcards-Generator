<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Window Glow / Imagined World Gradient -->
    <linearGradient id="dreamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4" />
    </linearGradient>

    <!-- Warm Desk Light -->
    <linearGradient id="lampGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Question Mark / Abstract Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.6" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT: Room Interior & Window -->
  <g id="environment">
    <!-- Window Frame in Background -->
    <rect x="130" y="30" width="80" height="110" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <!-- Window Pane Inner Glow (The "Unimaginable" Chaotic/Complex Scene Outside) -->
    <rect x="136" y="36" width="68" height="98" fill="url(#dreamGrad)"/>
    
    <!-- Abstract complex/chaotic scene elements inside window (representing the scenario hard to imagine) -->
    <path d="M 145 100 Q 160 70 175 90 T 200 80" stroke="#f43f5e" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <circle cx="160" cy="65" r="8" fill="#fbbf24" opacity="0.8"/>
    <polygon points="180,110 190,95 200,110" fill="#38bdf8" opacity="0.6"/>
    <path d="M 140 120 L 160 105 L 185 115" stroke="#10b981" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Window divider bars -->
    <line x1="170" y1="36" x2="170" y2="134" stroke="#475569" stroke-width="2"/>
    <line x1="136" y1="85" x2="204" y2="85" stroke="#475569" stroke-width="2"/>

    <!-- Bookshelf / Wall Props -->
    <rect x="25" y="45" width="40" height="6" rx="2" fill="#475569"/>
    <rect x="30" y="30" width="10" height="15" rx="1" fill="#ec4899"/>
    <rect x="42" y="27" width="8" height="18" rx="1" fill="#38bdf8"/>
    <rect x="52" y="33" width="10" height="12" rx="1" fill="#fbbf24"/>

    <!-- Room Desk -->
    <rect x="10" y="170" width="140" height="10" rx="3" fill="#334155" filter="url(#softShadow)"/>
    <rect x="20" y="180" width="10" height="40" rx="2" fill="#1e293b"/>
    <rect x="130" y="180" width="10" height="40" rx="2" fill="#1e293b"/>

    <!-- Desk Props: Open Book & Coffee Mug -->
    <path d="M 80 160 Q 95 150 110 160 L 110 170 Q 95 160 80 170 Z" fill="#f8fafc"/>
    <path d="M 50 155 L 65 155 L 65 170 L 50 170 Z" fill="#cbd5e1" rx="2"/>
    <path d="M 65 158 C 70 158 70 166 65 166" stroke="#cbd5e1" stroke-width="2" fill="none"/>
    <!-- Steam from mug -->
    <path d="M 54 148 Q 57 143 54 138" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Desk Lamp -->
    <path d="M 115 170 L 120 130 L 125 130" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 112 125 L 132 125 L 127 115 L 117 115 Z" fill="#f59e0b"/>
    <path d="M 110 130 Q 122 165 135 170" fill="url(#lampGlow)" opacity="0.4"/>
  </g>

  <!-- SUBJECT: Expressive Character showing "Can't Imagine" Gesture -->
  <g id="main-character" filter="url(#softShadow)">
    <!-- Character Chair Back -->
    <path d="M 35 120 L 45 120 L 50 175 L 35 175 Z" fill="#475569" rx="3"/>

    <!-- Character Body / Sweater -->
    <path d="M 40 135 Q 55 125 70 135 L 85 170 L 30 170 Z" fill="url(#sweaterGrad)"/>

    <!-- Character Neck & Head -->
    <path d="M 50 120 L 60 120 L 60 130 L 50 130 Z" fill="#fbcfe8"/>
    <circle cx="55" cy="100" r="18" fill="#fbcfe8"/>

    <!-- Hair -->
    <path d="M 38 95 C 38 80 72 80 72 95 C 72 105 68 105 65 100 C 60 90 50 90 45 100 C 42 105 38 105 38 95 Z" fill="#334155"/>

    <!-- Facial Expression: Skeptical / Puzzled (Can't imagine) -->
    <!-- Eyebrows (tilted up in confusion/doubt) -->
    <line x1="47" y1="93" x2="53" y2="95" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="57" y1="95" x2="63" y2="93" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes (wide, looking sideways at the scene) -->
    <circle cx="50" cy="99" r="2" fill="#1e293b"/>
    <circle cx="60" cy="99" r="2" fill="#1e293b"/>
    <!-- Mouth (slight wavy frown / hesitation) -->
    <path d="M 52 107 Q 55 104 58 107" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Blush -->
    <circle cx="45" cy="103" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="65" cy="103" r="3" fill="#f43f5e" opacity="0.3"/>

    <!-- Arms & Hands performing "Puzzled / Stop / Reject" Gesture -->
    <!-- Back Arm (resting or scratching head) -->
    <path d="M 42 130 Q 30 120 40 105" stroke="#0284c7" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="41" cy="103" r="4" fill="#fbcfe8"/>

    <!-- Front Arm (Palm out, pushing away / expressing impossibility) -->
    <path d="M 68 135 Q 85 130 90 115" stroke="#0284c7" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Open Palm Hand facing viewer/scene -->
    <circle cx="92" cy="112" r="5" fill="#fbcfe8"/>
  </g>

  <!-- FOREGROUND CONCEPTUAL ACCENTS: "Difficulty imagining" Floating Symbols -->
  <g id="thought-bubbles">
    <!-- Floating Question / Abstract Cloud Particles near head -->
    <path d="M 75 75 Q 82 65 92 72 Q 102 65 105 78 Q 112 85 102 92 L 78 92 Q 70 82 75 75 Z" fill="url(#cloudGrad)" opacity="0.8" filter="url(#softShadow)"/>
    
    <!-- Floating question mark icon inside cloud -->
    <path d="M 87 75 C 87 70 95 70 95 76 C 95 81 89 81 89 85" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="89" cy="90" r="1.5" fill="#ffffff"/>

    <!-- Small floating dots / perplexity bubbles -->
    <circle cx="68" cy="75" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="62" cy="65" r="2" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>