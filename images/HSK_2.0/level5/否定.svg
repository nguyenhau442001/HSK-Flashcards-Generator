<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- The Character (Hand gesturing denial) -->
  <g transform="translate(120, 120)">
    <!-- Arm -->
    <path d="M-20 40 L-10 0 L10 0 L20 40 Z" fill="#fb923c"/>
    <!-- Hand Palm -->
    <circle cx="0" cy="-20" r="35" fill="#fbbf24"/>
    <!-- Fingers -->
    <rect x="-25" y="-60" width="10" height="25" rx="5" fill="#fbbf24"/>
    <rect x="-10" y="-65" width="10" height="30" rx="5" fill="#fbbf24"/>
    <rect x="5" y="-65" width="10" height="30" rx="5" fill="#fbbf24"/>
    <rect x="20" y="-55" width="10" height="20" rx="5" fill="#fbbf24"/>
  </g>
  
  <!-- Context Props: Documents being pushed away -->
  <g transform="rotate(-15 180 180)">
    <rect x="140" y="130" width="60" height="40" rx="4" fill="#e2e8f0"/>
    <rect x="145" y="135" width="50" height="5" rx="2" fill="#94a3b8"/>
    <rect x="145" y="145" width="40" height="5" rx="2" fill="#94a3b8"/>
  </g>
  
  <!-- Motion Lines -->
  <path d="M80 100 Q60 80 40 80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M70 120 Q50 100 30 100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Accent Glow -->
  <circle cx="120" cy="100" r="50" fill="#fb923c" fill-opacity="0.1"/>
</svg>