<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Interior -->
  <g id="room-interior">
    <!-- Window with night sky and moon -->
    <rect x="150" y="25" width="65" height="85" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
    <path d="M150 25 L215 25 L215 110 L150 110 Z" fill="url(#nightGrad)" />
    <!-- Moon & Stars -->
    <circle cx="195" cy="45" r="8" fill="#fde047" opacity="0.9" />
    <circle cx="165" cy="60" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="180" cy="85" r="1" fill="#ffffff" opacity="0.6" />
    <path d="M182.5 67 Q 192 65 198 72" stroke="#475569" stroke-width="1.5" fill="none" opacity="0.6" /> <!-- subtle cloud -->

    <!-- Window Frame Cross -->
    <line x1="182.5" y1="25" x2="182.5" y2="110" stroke="#334155" stroke-width="2" />
    <line x1="150" y1="67.5" x2="215" y2="67.5" stroke="#334155" stroke-width="2" />
    <!-- Bookshelf / Wall Deco -->
    <rect x="25" y="30" width="70" height="6" rx="2" fill="#334155" />
    <rect x="35" y="15" width="12" height="15" rx="1.5" fill="#f43f5e" />
    <rect x="49" y="18" width="10" height="12" rx="1.5" fill="#3b82f6" />
    <rect x="61" y="14" width="14" height="16" rx="1.5" fill="#10b981" />

    <!-- Wall Calendar (showing passage of time / waiting concept) -->
    <rect x="110" y="35" width="24" height="30" rx="2" fill="#cbd5e1" />
    <rect x="110" y="35" width="24" height="8" fill="#e11d48" />
    <line x1="116" y1="32" x2="116" y2="38" stroke="#0f172a" stroke-width="1.5" />
    <line x1="128" y1="32" x2="128" y2="38" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="116" cy="50" r="2" fill="#64748b" />
    <circle cx="122" cy="50" r="2" fill="#64748b" />
    <circle cx="128" cy="50" r="2" fill="#64748b" />
    <circle cx="116" cy="57" r="2" fill="#e11d48" /> <!-- highlighted day of waiting -->
  </g>

  <!-- Desk Surface -->
  <rect x="15" y="165" width="210" height="60" rx="4" fill="#334155" />
  <rect x="15" y="160" width="210" height="8" rx="2" fill="#475569" />

  <!-- Desk Props -->
  <!-- Coffee Mug -->
  <rect x="35" y="135" width="16" height="25" rx="3" fill="#e2e8f0" />
  <path d="M51 140 C 56 140, 56 150, 51 153" stroke="#e2e8f0" stroke-width="2.5" fill="none" />
  <path d="M39 130 Q 43 123 47 130" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.7" /> <!-- steam -->

  <!-- Open Notebook / Unanswered Letter -->
  <path d="M165 145 L205 138 L205 160 L165 167 Z" fill="#f8fafc" />
  <line x1="172" y1="148" x2="198" y2="144" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="172" y1="153" x2="195" y2="149" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="172" y1="158" x2="190" y2="155" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Laptop with awaiting message screen -->
  <g id="laptop">
    <!-- Laptop Base -->
    <path d="M85 162 L145 162 L155 168 L75 168 Z" fill="#94a3b8" />
    <rect x="105" y="164" width="25" height="2" rx="1" fill="#64748b" />
    <!-- Laptop Screen (Angled) -->
    <path d="M85 115 L145 115 L145 162 L85 162 Z" fill="#475569" />
    <path d="M88 118 L142 118 L142 159 L88 159 Z" fill="url(#screenGlow)" />
    <!-- Envelope Icon on screen (waiting for reply) -->
    <rect x="105" y="130" width="20" height="14" rx="2" fill="#f8fafc" />
    <path d="M105 130 L115 138 L125 130" stroke="#3b82f6" stroke-width="1.5" fill="none" />
    <circle cx="132" cy="128" r="4" fill="#ef4444" /> <!-- Notification dot -->
  </g>

  <!-- Lamp & Lighting Effect -->
  <circle cx="75" cy="85" r="45" fill="url(#lampGlow)" />
  <path d="M60 65 L90 65 L80 110 L70 110 Z" fill="#f59e0b" /> <!-- Lamp shade -->
  <path d="M73 110 L77 110 L77 160 L73 160 Z" fill="#64748b" /> <!-- Lamp stand -->
  <circle cx="75" cy="62" r="4" fill="#d97706" />

  <!-- Character: Thoughtful/Waiting Person -->
  <g id="character">
    <!-- Body / Torso (Polo or sweater) -->
    <path d="M100 170 C 100 145, 130 145, 130 170 L140 200 L90 200 Z" fill="#0284c7" />
    <!-- Collar -->
    <path d="M110 145 L115 153 L120 145 Z" fill="#e0f2fe" />

    <!-- Head & Neck -->
    <path d="M110 135 L110 148 L120 148 L120 135 Z" fill="#fbcfe8" /> <!-- Neck -->
    <circle cx="115" cy="115" r="18" fill="#fbcfe8" /> <!-- Face -->

    <!-- Hair (Stylized neat modern cut) -->
    <path d="M97 112 C 96 100, 105 97, 115 97 C 126 97, 133 102, 133 115 C 133 118, 131 115, 130 110 C 127 100, 120 100, 115 100 C 107 100, 100 103, 98 115 Z" fill="#334155" />

    <!-- Facial Expression: Pensive, looking at screen/waiting -->
    <!-- Eyebrows (slightly furrowed/concerned) -->
    <path d="M104 110 Q 109 108 113 111" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M118 111 Q 122 108 127 110" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Eyes (calm, looking forward at the laptop screen) -->
    <circle cx="108" cy="116" r="1.5" fill="#1e293b" />
    <circle cx="123" cy="116" r="1.5" fill="#1e293b" />
    <!-- Nose & Mouth (slight thoughtful frown/straight line) -->
    <path d="M115 119 L115 122" stroke="#e11d48" stroke-width="1" stroke-linecap="round" opacity="0.6" />
    <path d="M111 127 Q 115 125 119 127" stroke="#9f1239" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Hand resting on cheek (classic waiting pose) -->
    <path d="M100 138 C 94 135, 93 125, 98 122 C 101 120, 104 125, 102 130" fill="#fbcfe8" stroke="#db2777" stroke-width="0.7" />
    <!-- Arm supporting the head -->
    <path d="M100 138 L95 165 L105 168 L108 142 Z" fill="#0284c7" />

    <!-- Other Arm resting on desk -->
    <path d="M125 150 L138 165 L128 168 L118 155 Z" fill="#0284c7" />
  </g>

  <!-- Ambient Light Overlay for Depth (Atmospheric vignette) -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#020617" stop-opacity="0.5" />
  </radialGradient>
  <rect width="240" height="240" rx="24" fill="url(#vignette)" pointer-events="none" />
</svg>