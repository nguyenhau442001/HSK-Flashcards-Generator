<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Environmental Context (Yoga / Studio Room) -->
  <!-- Window with modern frame -->
  <g opacity="0.4">
    <rect x="25" y="30" width="50" height="70" rx="4" fill="none" stroke="#64748b" stroke-width="2" />
    <line x1="50" y1="30" x2="50" y2="100" stroke="#64748b" stroke-width="1.5" />
    <line x1="25" y1="65" x2="75" y2="65" stroke="#64748b" stroke-width="1.5" />
    <!-- Plant in background -->
    <path d="M210 110 Q215 90 205 75 Q225 85 220 110 Z" fill="#10b981" opacity="0.6" />
    <path d="M215 110 Q230 95 235 80 Q240 100 215 110 Z" fill="#059669" opacity="0.5" />
    <rect x="205" y="110" width="16" height="20" rx="3" fill="#cbd5e1" opacity="0.6" />
  </g>

  <!-- Floor and mat -->
  <path d="M0 165 L240 165 L240 240 L0 240 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="165" x2="240" y2="165" stroke="#475569" stroke-width="1" />
  
  <!-- Yoga Mat -->
  <g transform="translate(60, 168)">
    <path d="M 0 0 L 120 0 Q 130 12 120 20 L 0 20 Q -10 12 0 0 Z" fill="#ec4899" opacity="0.8" />
    <ellipse cx="60" cy="10" rx="55" ry="6" fill="#f43f5e" />
  </g>

  <!-- Balance Beam (Wooden aesthetic) -->
  <g transform="translate(45, 172)">
    <!-- Beam shadow -->
    <ellipse cx="75" cy="12" rx="72" ry="5" fill="#0f172a" opacity="0.5" />
    <!-- Main beam body -->
    <rect x="3" y="2" width="144" height="8" rx="3" fill="#b45309" />
    <rect x="0" y="0" width="150" height="5" rx="2.5" fill="url(#beamGrad)" />
    <!-- Beam supports -->
    <rect x="35" y="10" width="8" height="15" fill="#78350f" />
    <rect x="107" y="10" width="8" height="15" fill="#78350f" />
  </g>

  <!-- Motion lines / Focus indicators for balance -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M 85 100 Q 95 105 105 115" />
    <path d="M 155 100 Q 145 105 135 115" />
    <circle cx="120" cy="107" r="28" stroke-dasharray="4 6" />
  </g>

  <!-- MAIN CHARACTER: Balancing in Tree Pose (Vrksasana) -->
  <g id="character">
    <!-- Character Shadow -->
    <ellipse cx="120" cy="177" rx="16" ry="4" fill="#020617" opacity="0.6" filter="url(#glow)" />

    <!-- Left Leg (Standing, straight) -->
    <path d="M 116 135 L 115 174" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" />
    <path d="M 112 173 L 122 173" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round" /> <!-- Foot -->

    <!-- Right Leg (Bent, foot pressed against left thigh) -->
    <g>
      <!-- Thigh bent out -->
      <path d="M 124 135 Q 138 138 141 125" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" fill="none" />
      <!-- Lower leg folded inward -->
      <path d="M 141 125 Q 134 112 126 116" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" fill="none" />
      <!-- Foot against knee/thigh -->
      <circle cx="125" cy="116" r="3" fill="#fed7aa" />
    </g>

    <!-- Torso -->
    <path d="M 110 85 L 130 85 L 126 138 L 114 138 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Outfit Details / Belt / Shirt hem -->
    <path d="M 112 110 L 128 110" stroke="#0284c7" stroke-width="1.5" />

    <!-- Left Arm (Raised gracefully to the side) -->
    <path d="M 112 90 Q 90 85 82 72" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Left Hand -->
    <circle cx="80" cy="70" r="3.5" fill="#fed7aa" />

    <!-- Right Arm (Raised gracefully to the side) -->
    <path d="M 128 90 Q 150 85 158 72" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Right Hand -->
    <circle cx="160" cy="70" r="3.5" fill="#fed7aa" />

    <!-- Neck -->
    <rect x="117" y="74" width="6" height="13" rx="2" fill="#fed7aa" />

    <!-- Head -->
    <circle cx="120" cy="62" r="14" fill="#fed7aa" />

    <!-- Hair (Stylish top bun/knot for yoga theme) -->
    <path d="M 106 60 Q 105 45 120 44 Q 135 45 134 60 Q 135 72 120 73 Q 105 72 106 60 Z" fill="#334155" />
    <circle cx="120" cy="42" r="6" fill="#334155" /> <!-- Hair bun -->

    <!-- Calm, concentrated facial expression (Simplified side-ish profile hint or closed peaceful eyes) -->
    <path d="M 125 59 Q 128 61 131 59" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none" /> <!-- Peaceful smile -->
    <path d="M 114 57 Q 117 58 120 57" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none" /> <!-- Closed calm eyes -->
  </g>

  <!-- Ambient glowing balance particles / sparkles -->
  <g fill="#fbbf24">
    <circle cx="75" cy="50" r="2" opacity="0.8" />
    <circle cx="165" cy="95" r="1.5" opacity="0.6" />
    <circle cx="145" cy="45" r="2.5" opacity="0.9" filter="url(#glow)" />
    <circle cx="95" cy="130" r="1.5" opacity="0.7" />
    <circle cx="55" cy="115" r="2" opacity="0.5" />
  </g>
</svg>