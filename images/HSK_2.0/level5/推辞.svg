<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#334155"/>
  <rect x="20" y="150" width="200" height="15" rx="5" fill="#475569"/>
  
  <!-- The Invitation/Gift Box -->
  <rect x="130" y="120" width="60" height="50" rx="4" fill="#fb923c"/>
  <rect x="130" y="120" width="60" height="15" fill="#f59e0b"/>
  <rect x="155" y="120" width="10" height="50" fill="#f59e0b"/>
  
  <!-- The Character (Rejecting) -->
  <g transform="translate(40, 80)">
    <!-- Body -->
    <path d="M20 160 C20 120, 80 120, 80 160 L80 160" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="50" cy="90" r="30" fill="#fde68a"/>
    <!-- Hand pushing away -->
    <path d="M80 110 L120 100" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <path d="M120 100 L135 85" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <!-- Face -->
    <circle cx="40" cy="85" r="3" fill="#1e293b"/>
    <circle cx="60" cy="85" r="3" fill="#1e293b"/>
    <path d="M42 105 Q50 100 58 105" stroke="#1e293b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Motion lines for rejection -->
  <path d="M125 90 L145 70" stroke="#ec4899" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M120 115 L140 95" stroke="#ec4899" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="40" r="15" fill="#10b981" opacity="0.2"/>
  <circle cx="30" cy="50" r="8" fill="#fbbf24" opacity="0.3"/>
</svg>