<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Box Glow -->
    <radialGradient id="boxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Gift Box Velvet -->
    <linearGradient id="velvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  
  <!-- Atmospheric Lighting -->
  <circle cx="120" cy="110" r="110" fill="url(#spotlight)" />

  <!-- Restaurant/Romantic Interior Details (Background) -->
  <g opacity="0.4">
    <!-- Window with city night bokeh -->
    <rect x="30" y="25" width="60" height="70" rx="8" fill="#334155" />
    <circle cx="50" cy="50" r="4" fill="#fbbf24" />
    <circle cx="70" cy="40" r="3" fill="#38bdf8" />
    <circle cx="60" cy="70" r="5" fill="#f43f5e" />
    <circle cx="40" cy="75" r="3" fill="#fbbf24" />

    <!-- Hanging Pendant Light -->
    <path d="M120 0 L120 40" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <path d="M105 40 L135 40 L140 50 L100 50 Z" fill="#475569" />
    <path d="M100 50 Q120 70 140 50 Z" fill="#fbbf24" opacity="0.3" />
    
    <!-- Plant silhouette -->
    <path d="M205 130 Q215 100 195 90 Q210 115 205 130 Z" fill="#334155" />
    <path d="M205 130 Q225 110 220 95 Q220 120 205 130 Z" fill="#475569" />
    <path d="M190 150 L220 150 L215 190 L195 190 Z" fill="#1e293b" />
  </g>

  <!-- Table surface -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="#0f172a" />
  <path d="M 0 160 L 240 160" stroke="#334155" stroke-width="3" />
  <ellipse cx="120" cy="160" rx="100" ry="12" fill="#1e293b" />

  <!-- Tableware -->
  <!-- Wine glasses -->
  <path d="M70 135 L76 135 L73 155 L70 155 Z" fill="#94a3b8" opacity="0.5" />
  <ellipse cx="73" cy="135" rx="6" ry="3" fill="#cbd5e1" opacity="0.6" />
  <path d="M170 135 L176 135 L173 155 L170 155 Z" fill="#94a3b8" opacity="0.5" />
  <ellipse cx="173" cy="135" rx="6" ry="3" fill="#cbd5e1" opacity="0.6" />

  <!-- ================= CHARACTERS ================= -->

  <!-- Character 1: He (Giving the ring, on the left) -->
  <g id="male-character">
    <!-- Torso & Suit -->
    <path d="M 75 200 C 75 175 90 160 100 160 L 105 200 Z" fill="#3b82f6" />
    <path d="M 55 200 C 55 175 75 165 85 160 L 95 200 Z" fill="#1e40af" />
    <!-- Shirt & Tie -->
    <path d="M 72 165 L 80 165 L 82 185 L 75 185 Z" fill="#f8fafc" />
    <polygon points="76,168 80,168 78,180" fill="#e11d48" />

    <!-- Head & Hair -->
    <circle cx="70" cy="132" r="18" fill="url(#skinGrad)" />
    <!-- Hair Dark -->
    <path d="M 53 130 C 53 115 65 112 75 114 C 85 112 90 120 90 132 C 85 125 75 123 65 126 Z" fill="#0f172a" />
    <!-- Facial expression: smiling, looking lovingly -->
    <path d="M 77 132 Q 81 135 84 132" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 66 132 Q 69 135 72 132" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 73 141 Q 76 145 79 141" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Right Arm holding out the gift box -->
    <path d="M 85 170 Q 105 165 118 162" stroke="#1e40af" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Hand -->
    <circle cx="120" cy="161" r="5" fill="url(#skinGrad)" />
  </g>

  <!-- Character 2: She (Receiving, on the right, pleasantly surprised) -->
  <g id="female-character">
    <!-- Torso & Dress -->
    <path d="M 140 200 C 140 170 155 160 165 160 L 180 200 Z" fill="#f43f5e" />
    <path d="M 150 162 L 170 162 L 175 175 L 145 175 Z" fill="#fda4af" /> <!-- collar -->

    <!-- Head & Hair -->
    <circle cx="170" cy="130" r="17" fill="url(#skinGrad)" />
    <!-- Hair Brown/Stylish -->
    <path d="M 153 125 C 153 110 170 108 185 118 C 195 125 192 145 188 155 C 185 145 180 130 170 130 C 158 130 153 130 153 125 Z" fill="#78350f" />
    <!-- Surprised/Happy Face -->
    <circle cx="165" cy="129" r="1.5" fill="#334155" />
    <circle cx="177" cy="129" r="1.5" fill="#334155" />
    <!-- Open happy mouth -->
    <path d="M 170 137 Q 173 143 176 137 Z" fill="#9f1239" />
    <!-- Blush -->
    <ellipse cx="162" cy="133" rx="3" ry="1.5" fill="#fda4af" opacity="0.6" />
    <ellipse cx="180" cy="133" rx="3" ry="1.5" fill="#fda4af" opacity="0.6" />

    <!-- Hands near face in amazement -->
    <path d="M 160 165 Q 150 150 157 142" stroke="#fda4af" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="157" cy="141" r="4" fill="url(#skinGrad)" />
    <path d="M 175 165 Q 185 150 178 142" stroke="#fda4af" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="178" cy="141" r="4" fill="url(#skinGrad)" />
  </g>

  <!-- ================= THE RING & GIFT BOX (CENTRAL FOCUS) ================= -->
  <g id="ring-box-scene">
    <!-- Glow aura behind the ring -->
    <circle cx="120" cy="155" r="25" fill="url(#boxGlow)" />

    <!-- Open Gift Box -->
    <!-- Box bottom/base -->
    <path d="M 108 157 L 132 157 L 136 172 L 104 172 Z" fill="url(#velvet)" />
    <path d="M 104 172 L 136 172 L 132 177 L 108 177 Z" fill="#881337" />
    <!-- Inner velvet slot -->
    <ellipse cx="120" cy="157" rx="12" ry="3" fill="#4c0519" />
    <path d="M 118 157 L 118 168" stroke="#f43f5e" stroke-width="2" opacity="0.5" />

    <!-- Box lid (flipped open backwards) -->
    <path d="M 108 157 L 132 157 L 138 142 L 102 142 Z" fill="#be123c" />
    <path d="M 102 142 L 138 142 L 136 140 L 104 140 Z" fill="#e11d48" />

    <!-- GOLDEN RING (戒指 - jièzhi) -->
    <g id="the-ring">
      <!-- Ring Band -->
      <ellipse cx="120" cy="153" rx="6" ry="3" fill="none" stroke="#fbbf24" stroke-width="2.5" />
      <!-- Diamond / Gemstone -->
      <polygon points="120,143 123,147 120,150 117,147" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8" />
      <!-- Diamond Sparkle Highlights -->
      <polygon points="120,140 121.5,144 120,143 118.5,144" fill="#ffffff" />
      <circle cx="124" cy="145" r="1" fill="#ffffff" />
      <circle cx="116" cy="151" r="0.8" fill="#ffffff" />
    </g>

    <!-- Magic Sparkles around the ring -->
    <path d="M 105 138 L 107 143 L 112 145 L 107 147 L 105 152 L 103 147 L 98 145 L 103 143 Z" fill="#fef08a" opacity="0.9" />
    <path d="M 135 145 L 136 148 L 139 149 L 136 150 L 135 153 L 134 150 L 131 149 L 134 148 Z" fill="#fef08a" opacity="0.8" />
    <circle cx="120" cy="133" r="1.5" fill="#ffffff" />
    <circle cx="100" cy="130" r="1" fill="#fbbf24" />
    <circle cx="140" cy="138" r="1.2" fill="#ffffff" />
    <path d="M 120 128 L 120 138 M 115 133 L 125 133" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Foreground Atmospheric Particles -->
  <circle cx="45" cy="90" r="1" fill="#ffffff" opacity="0.3" />
  <circle cx="195" cy="80" r="1.5" fill="#ffffff" opacity="0.4" />
  <circle cx="15" cy="130" r="1" fill="#ffffff" opacity="0.2" />
  <circle cx="225" cy="115" r="1" fill="#ffffff" opacity="0.3" />

  <!-- Outer vignette/border styling -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>