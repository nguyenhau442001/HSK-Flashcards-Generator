<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Golden Hour Glow -->
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Texture Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Metal Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Soil Gradient -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Plant Green Gradient -->
    <linearGradient id="plantGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Sun Glow -->
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)"/>

  <!-- SCENE ELEMENTS -->
  <!-- Distant Hill / Terrain Contour -->
  <path d="M 0 160 Q 90 120 240 150 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Foreground Soil / Garden Bed -->
  <path d="M 15 170 Q 120 145 225 165 L 235 225 C 235 233 228 240 220 240 L 20 240 C 12 240 5 233 5 225 Z" fill="url(#soilGrad)"/>
  <ellipse cx="120" cy="180" rx="100" ry="25" fill="#5c2c16" opacity="0.5"/>

  <!-- Sprouting Life / Prosperity (Của cải / Wealth from Labor) -->
  <!-- Little Sprouts -->
  <path d="M 75 165 Q 70 140 60 135 C 70 145 75 155 75 165 Z" fill="url(#plantGrad)"/>
  <path d="M 75 165 Q 85 140 95 135 C 85 145 80 155 75 165 Z" fill="#10b981"/>
  
  <path d="M 165 170 Q 160 145 150 140 C 160 150 165 160 165 170 Z" fill="#34d399"/>
  <path d="M 165 170 Q 175 145 185 140 C 175 150 170 160 165 170 Z" fill="url(#plantGrad)"/>

  <!-- Golden Coins / Gems half buried (Visualizing "tạo ra của cải" - creating wealth) -->
  <circle cx="105" cy="190" r="8" fill="#fbbf24"/>
  <circle cx="105" cy="190" r="5" fill="#f59e0b"/>
  <circle cx="138" cy="195" r="7" fill="#fbbf24"/>
  <circle cx="138" cy="195" r="4" fill="#f59e0b"/>
  <circle cx="122" cy="208" r="9" fill="#fbbf24"/>
  <circle cx="122" cy="208" r="6" fill="#f59e0b"/>

  <!-- MAIN SUBJECT: Tools of Labor (Shovel and Watering Can crossed in action) -->
  
  <!-- Wooden Handle (Shovel) -->
  <g transform="rotate(-25 120 120)">
    <!-- Handle shaft -->
    <rect x="114" y="40" width="12" height="130" rx="6" fill="url(#woodGrad)"/>
    <!-- Wood grain highlight -->
    <line x1="117" y1="50" x2="117" y2="150" stroke="#f59e0b" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    
    <!-- D-Grip Handle at top -->
    <path d="M 108 45 C 108 38 114 34 120 34 C 126 34 132 38 132 45 L 132 50 L 108 50 Z" fill="#78350f"/>
    <path d="M 112 44 C 112 40 116 38 120 38 C 124 38 128 40 128 44 L 128 47 L 112 47 Z" fill="url(#bgGrad)"/>

    <!-- Shovel Metal Blade -->
    <path d="M 111 160 L 129 160 L 136 195 C 137 202 127 208 120 208 C 113 208 103 202 104 195 Z" fill="url(#metalGrad)"/>
    <!-- Metal Blade Edge Highlight -->
    <path d="M 105 197 C 112 205 128 205 135 197 L 132 185 L 108 185 Z" fill="#cbd5e1" opacity="0.3"/>
    <!-- Socket connection -->
    <rect x="112" y="150" width="16" height="15" rx="3" fill="#334155"/>
  </g>

  <!-- Secondary Tool: Watering Can (Representing nurturing labor) -->
  <g transform="translate(10, 15) rotate(15 80 110)">
    <!-- Can Body -->
    <path d="M 65 95 L 95 95 C 100 95 103 98 103 103 L 103 125 C 103 130 100 133 95 133 L 65 133 C 60 133 57 130 57 125 L 57 103 C 57 98 60 95 65 95 Z" fill="#38bdf8"/>
    
    <!-- Body Shade -->
    <path d="M 80 95 L 95 95 C 100 95 103 98 103 103 L 103 125 C 103 130 100 133 95 133 L 80 133 Z" fill="#0284c7" opacity="0.4"/>

    <!-- Handle -->
    <path d="M 101 103 C 115 103 120 110 120 114 C 120 118 115 125 101 125" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>

    <!-- Spout -->
    <path d="M 59 105 L 30 80 L 25 83 L 51 120 Z" fill="#0284c7"/>
    <!-- Rose (Spout head) -->
    <ellipse cx="27" cy="81" rx="4" ry="6" fill="#38bdf8" transform="rotate(-40 27 81)"/>
    <line x1="24" y1="78" x2="30" y2="84" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="24" y1="84" x2="30" y2="78" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Water drops coming out of spout -->
    <circle cx="18" cy="85" r="2.5" fill="#38bdf8" opacity="0.9"/>
    <circle cx="12" cy="92" r="2" fill="#38bdf8" opacity="0.7"/>
    <circle cx="7" cy="100" r="1.5" fill="#38bdf8" opacity="0.5"/>
  </g>

  <!-- Sparkling / Action Effect Elements (Energy of Labor) -->
  <g transform="translate(140, 60)">
    <path d="M 0 10 L 12 10 L 6 0 Z" fill="#fbbf24" transform="rotate(15)"/>
    <circle cx="-10" cy="25" r="3" fill="#f59e0b"/>
    <circle cx="20" cy="-5" r="2" fill="#38bdf8"/>
    <!-- Sparkle star -->
    <path d="M 15 25 Q 15 20 20 20 Q 15 20 15 15 Q 15 20 10 20 Q 15 20 15 25 Z" fill="#fbbf24"/>
  </g>

  <g transform="translate(45, 130)">
    <path d="M 10 0 Q 10 5 15 5 Q 10 5 10 10 Q 10 5 5 5 Q 10 5 10 0 Z" fill="#38bdf8"/>
  </g>

  <g transform="translate(190, 110)">
    <path d="M 10 0 Q 10 6 16 6 Q 10 6 10 12 Q 10 6 4 6 Q 10 6 10 0 Z" fill="#fbbf24"/>
  </g>

</svg>