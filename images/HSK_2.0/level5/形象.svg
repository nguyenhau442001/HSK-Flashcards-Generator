<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric lighting -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>
  
  <!-- Subtle architectural background details (Presentation Stage) -->
  <g opacity="0.3">
    <!-- Back wall panels -->
    <line x1="60" y1="40" x2="60" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="180" y1="40" x2="180" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- Large presentation screen curve graphic -->
    <path d="M 50 50 Q 120 30 190 50 L 190 120 Q 120 100 50 120 Z" fill="#334155" opacity="0.4"/>
    <!-- Star/Sparkle icons representing professional excellence / "good image" -->
    <path d="M 70 70 L 73 78 L 81 81 L 73 84 L 70 92 L 67 84 L 59 81 L 67 78 Z" fill="#fbbf24" opacity="0.6"/>
    <path d="M 175 60 L 177 65 L 182 67 L 177 69 L 175 74 L 173 69 L 168 67 L 173 65 Z" fill="#fbbf24" opacity="0.4"/>
  </g>

  <!-- Stage Floor & Podium -->
  <g>
    <!-- Floor reflection shadow -->
    <ellipse cx="120" cy="205" rx="70" ry="12" fill="#020617" opacity="0.6"/>
    
    <!-- Podium base -->
    <path d="M 90 185 L 150 185 L 160 210 L 80 210 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M 85 185 L 155 185 L 155 190 L 85 190 Z" fill="url(#podiumGrad)"/>
    
    <!-- Microphone on podium -->
    <rect x="118" y="165" width="4" height="25" fill="#94a3b8"/>
    <circle cx="120" cy="163" r="5" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Main Professional Character ("He" - representing "形象很好" / professional image) -->
  <g id="professional-character">
    <!-- Body Shadow -->
    <ellipse cx="120" cy="188" rx="35" ry="8" fill="#020617" opacity="0.4"/>

    <!-- Legs & Shoes -->
    <rect x="105" y="150" width="10" height="40" fill="#1e293b"/>
    <rect x="125" y="150" width="10" height="40" fill="#1e293b"/>
    <path d="M 100 190 L 113 190 A 3 3 0 0 1 116 193 L 100 193 Z" fill="#0f172a"/>
    <path d="M 124 190 L 137 190 A 3 3 0 0 1 140 193 L 124 193 Z" fill="#0f172a"/>

    <!-- Suit Torso -->
    <path d="M 90 110 L 150 110 L 155 155 L 85 155 Z" fill="url(#suitGrad)"/>
    
    <!-- Shirt & Tie -->
    <polygon points="120,110 110,135 130,135" fill="#f8fafc"/>
    <polygon points="118,133 122,133 124,155 116,155" fill="#ef4444"/> <!-- Red professional tie -->
    
    <!-- Suit Lapels -->
    <path d="M 105 110 L 120 135 L 105 155" fill="#0f172a" opacity="0.3"/>
    <path d="M 135 110 L 120 135 L 135 155" fill="#0f172a" opacity="0.3"/>

    <!-- Left Arm (Gesturing confidently) -->
    <path d="M 92 112 Q 70 130 80 145" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="80" cy="147" r="6" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Right Arm (Resting on podium / confident pose) -->
    <path d="M 148 112 Q 165 135 150 155" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="150" cy="157" r="6" fill="#fbcfe8"/> <!-- Hand -->

    <!-- Neck -->
    <rect x="113" y="100" width="14" height="15" fill="#fbcfe8"/>

    <!-- Head & Hair -->
    <circle cx="120" cy="85" r="22" fill="#fbcfe8"/>
    
    <!-- Stylish Hair -->
    <path d="M 98 85 C 98 68 110 63 122 63 C 138 63 143 75 143 85 C 143 85 138 72 122 71 C 108 71 101 78 98 85 Z" fill="#0f172a"/>

    <!-- Facial Expression (Confident, smiling, reliable look) -->
    <!-- Eyes -->
    <path d="M 110 82 Q 114 78 118 82" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 122 82 Q 126 78 130 82" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Friendly Smile -->
    <path d="M 113 93 Q 120 99 127 93" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Rosy Cheeks -->
    <circle cx="108" cy="89" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="132" cy="89" r="3" fill="#f43f5e" opacity="0.3"/>
  </g>

  <!-- Approval / High Quality Badges floating (Visualizing "形象很好" - Excellent Image/Reputation) -->
  <g transform="translate(0, -5)">
    <!-- Golden Star Trophy / Badge icon top right -->
    <circle cx="185" cy="95" r="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <path d="M 185 83 L 188 90 L 195 91 L 190 96 L 191 103 L 185 99 L 179 103 L 180 96 L 175 91 L 182 90 Z" fill="url(#goldGrad)" transform="scale(0.8) translate(50, 18)"/>

    <!-- Checkmark Badge top left -->
    <circle cx="55" cy="105" r="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <polyline points="47,105 52,110 63,99" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Ambient Sparkles & Glows for a polished, positive atmosphere -->
  <g fill="#38bdf8">
    <circle cx="75" cy="55" r="2" opacity="0.8"/>
    <circle cx="165" cy="135" r="1.5" opacity="0.8"/>
    <circle cx="45" cy="165" r="2" opacity="0.5"/>
    <circle cx="195" cy="175" r="2.5" opacity="0.6"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="140" cy="45" r="2.5" opacity="0.9"/>
    <circle cx="95" cy="135" r="1.5" opacity="0.7"/>
  </g>
</svg>