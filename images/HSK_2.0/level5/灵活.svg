<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Golden Glow for Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Robot Body Gradient -->
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Accent Orange Gradient -->
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Environment / Props (Workspace context) -->
  <g opacity="0.4">
    <!-- Back wall grid / details -->
    <line x1="30" y1="140" x2="210" y2="140" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
    <!-- Shelf -->
    <rect x="35" y="60" width="70" height="4" rx="2" fill="#64748b"/>
    <rect x="135" y="80" width="70" height="4" rx="2" fill="#64748b"/>
    <!-- Small props on shelf -->
    <path d="M50 60 L55 45 L65 45 L70 60 Z" fill="#38bdf8"/>
    <circle cx="160" cy="80" r="10" fill="#fb923c"/>
    <rect x="180" y="65" width="12" height="15" rx="2" fill="#10b981"/>
  </g>

  <!-- Floor Plane -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <ellipse cx="120" cy="185" rx="70" ry="12" fill="#020617" opacity="0.6"/>

  <!-- MOTION TRAILS & SPEED LINES (Representing agility/flexibility) -->
  <g opacity="0.7">
    <path d="M70 120 C90 100 120 100 150 120" stroke="#38bdf8" stroke-width="3" fill="none" stroke-dasharray="6 6" filter="url(#glow)"/>
    <path d="M50 140 C80 110 130 110 170 140" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.8"/>
  </g>

  <!-- MAIN CHARACTER: A nimble, multi-jointed expressive robot demonstrating 'flexible' movement -->
  <g transform="translate(120, 155)">
    
    <!-- Shadow beneath robot -->
    <ellipse cx="0" cy="30" rx="25" ry="6" fill="#000" opacity="0.4"/>

    <!-- LEGS (Dynamic, bending pose) -->
    <!-- Left Leg (bent high) -->
    <path d="M-10 10 L-25 -5 L-15 -25" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-10 10 L-25 -5 L-15 -25" stroke="url(#accentOrange)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="-15" cy="-25" r="4" fill="#fbbf24"/>

    <!-- Right Leg (planted / pivoting) -->
    <path d="M10 10 L20 25 L10 32" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M10 10 L20 25 L10 32" stroke="url(#accentOrange)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="10" cy="32" r="4" fill="#fbbf24"/>

    <!-- TORSO (Twisting, flexible segment structure) -->
    <g transform="rotate(15)">
      <!-- Lower Body / Hip -->
      <rect x="-12" y="-2" width="24" height="16" rx="6" fill="#475569"/>
      
      <!-- Flexible Spine / Midsection (Spring-like rings) -->
      <ellipse cx="0" cy="-6" rx="9" ry="3" fill="#fbbf24"/>
      <ellipse cx="0" cy="-11" rx="9" ry="3" fill="#fbbf24"/>
      
      <!-- Upper Chest/Core -->
      <rect x="-16" y="-28" width="32" height="18" rx="8" fill="url(#robotBody)"/>
      <circle cx="0" cy="-19" r="4" fill="#10b981" filter="url(#glow)"/>

      <!-- ARMS (Dynamic, reaching out in multi-directions) -->
      <!-- Left Arm (reaching up) -->
      <path d="M-14 -24 C-25 -25 -35 -40 -30 -50" stroke="#0f172a" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M-14 -24 C-25 -25 -35 -40 -30 -50" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="-30" cy="-50" r="5" fill="#ec4899"/>

      <!-- Right Arm (reaching back/down) -->
      <path d="M14 -24 C25 -20 35 -5 40 5" stroke="#0f172a" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M14 -24 C25 -20 35 -5 40 5" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="40" cy="5" r="5" fill="#ec4899"/>

      <!-- HEAD (Expressive, tilting) -->
      <g transform="translate(0, -38) rotate(-10)">
        <!-- Neck joint -->
        <rect x="-3" y="0" width="6" height="4" fill="#64748b"/>
        
        <!-- Helmet/Head capsule -->
        <rect x="-14" y="-16" width="28" height="18" rx="9" fill="url(#robotBody)"/>
        
        <!-- Visor Face -->
        <rect x="-11" y="-12" width="22" height="10" rx="5" fill="#0f172a"/>
        
        <!-- Expressive Digital Eyes -->
        <circle cx="-4" cy="-7" r="2.5" fill="#38bdf8" filter="url(#glow)"/>
        <circle cx="4" cy="-7" r="2.5" fill="#38bdf8" filter="url(#glow)"/>
        
        <!-- Antenna -->
        <line x1="0" y1="-16" x2="0" y2="-23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="-24" r="3.5" fill="#fbbf24" filter="url(#glow)"/>
      </g>
    </g>
  </g>

  <!-- FOREGROUND PROPS (Contextualizing the agility/work setting) -->
  <!-- Floating energy/dynamic spheres (representing options, adaptability) -->
  <g>
    <!-- Sphere 1 (Green - success/action) -->
    <circle cx="55" cy="110" r="10" fill="#10b981" opacity="0.9"/>
    <circle cx="52" cy="107" r="3" fill="#a7f3d0" opacity="0.8"/>
    
    <!-- Sphere 2 (Orange - active pivot) -->
    <circle cx="185" cy="130" r="12" fill="url(#accentOrange)" opacity="0.9"/>
    <circle cx="181" cy="126" r="3" fill="#fed7aa" opacity="0.8"/>

    <!-- Small floating particles/stars -->
    <path d="M80 80 L83 86 L89 89 L83 92 L80 98 L77 92 L71 89 L77 86 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M165 55 L167 59 L171 61 L167 63 L165 67 L163 63 L159 61 L163 59 Z" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- Vignette / Frame enhancement -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>