<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Snowflakes/Atmosphere -->
  <circle cx="40" cy="50" r="2" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="180" cy="30" r="3" fill="#e2e8f0" opacity="0.4"/>
  <circle cx="210" cy="120" r="2" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="60" cy="180" r="3" fill="#e2e8f0" opacity="0.7"/>

  <!-- Character (The Subject) -->
  <g transform="translate(60, 80)">
    <!-- Scarf -->
    <path d="M20 60 Q 40 70 60 60 L 65 80 L 15 80 Z" fill="#ec4899"/>
    <!-- Coat -->
    <path d="M10 80 L 70 80 L 80 140 L 0 140 Z" fill="#38bdf8"/>
    <!-- Face -->
    <circle cx="40" cy="40" r="30" fill="#fde68a"/>
    <!-- Eyes -->
    <ellipse cx="25" cy="35" rx="3" ry="5" fill="#0f172a"/>
    <ellipse cx="55" cy="35" rx="3" ry="5" fill="#0f172a"/>
    <!-- Breath Cloud (Visualizing 'Extra Cold') -->
    <path d="M70 40 Q 90 30 110 40 Q 120 50 110 60 Q 90 70 70 60 Z" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Thermometer showing 'Extra' low temperature -->
  <g transform="translate(180, 60)">
    <rect x="0" y="0" width="20" height="100" rx="10" fill="#334155"/>
    <rect x="5" y="70" width="10" height="25" rx="5" fill="#fb923c"/>
    <line x1="10" y1="10" x2="10" y2="70" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Ground/Environment -->
  <path d="M0 200 Q 120 180 240 200 L 240 240 L 0 240 Z" fill="#334155"/>
  <path d="M0 210 Q 120 190 240 210 L 240 240 L 0 240 Z" fill="#f1f5f9"/>
</svg>