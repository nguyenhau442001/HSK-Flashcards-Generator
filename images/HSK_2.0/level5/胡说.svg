<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Desk & Lamp Gradients -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <linearGradient id="lampCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Nonsense Speech Bubble / Visual Chaos Gradient -->
    <linearGradient id="chaosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Window Night Sky -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Drop Shadows / Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="windowClip">
      <path d="M 165 40 L 210 40 L 210 100 L 165 100 Z" />
    </clipPath>
  </defs>

  <!-- Full-Bleed Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ROOM ENVIRONMENT & PROPS -->
  <!-- Wallpaper lines/pattern -->
  <path d="M 0 130 L 240 130" stroke="#334155" stroke-width="2" />
  <path d="M 60 0 L 60 130" stroke="#162032" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M 120 0 L 120 130" stroke="#162032" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M 180 0 L 180 130" stroke="#162032" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Background Window -->
  <rect x="165" y="40" width="45" height="65" rx="4" fill="url(#nightSky)" stroke="#334155" stroke-width="2" />
  <!-- Window Panes & City silhouette -->
  <g clip-path="url(#windowClip)">
    <circle cx="185" cy="55" r="3" fill="#fbbf24" opacity="0.8" />
    <path d="M 170 105 L 170 85 L 178 85 L 178 105 Z" fill="#0f172a" />
    <path d="M 182 105 L 182 75 L 195 75 L 195 105 Z" fill="#0f172a" />
    <path d="M 198 105 L 198 90 L 206 90 L 206 105 Z" fill="#0f172a" />
  </g>
  <path d="M 187.5 40 L 187.5 105" stroke="#334155" stroke-width="1.5" />
  <path d="M 165 72.5 L 210 72.5" stroke="#334155" stroke-width="1.5" />

  <!-- Bookshelf Background Prop -->
  <rect x="25" y="45" width="35" height="55" fill="#1e293b" stroke="#334155" stroke-width="2" rx="2" />
  <line x1="25" y1="65" x2="60" y2="65" stroke="#334155" stroke-width="2" />
  <line x1="25" y1="85" x2="60" y2="85" stroke="#334155" stroke-width="2" />
  <!-- Books -->
  <rect x="29" y="50" width="6" height="15" fill="#ef4444" rx="1" />
  <rect x="37" y="48" width="8" height="17" fill="#3b82f6" rx="1" />
  <rect x="48" y="52" width="5" height="13" fill="#10b981" rx="1" />
  <rect x="30" y="70" width="12" height="15" fill="#f59e0b" rx="1" />
  <rect x="44" y="72" width="10" height="13" fill="#8b5cf6" rx="1" />

  <!-- Desk Surface -->
  <path d="M 20 185 L 220 185 L 210 135 L 30 135 Z" fill="url(#deskGrad)" stroke="#64748b" stroke-width="1.5" />
  <!-- Desk Edge Highlight -->
  <path d="M 20 185 L 220 185" stroke="#94a3b8" stroke-width="2" />

  <!-- Props on Desk: Laptop & Lamp -->
  <!-- Laptop base -->
  <path d="M 155 160 L 205 160 L 215 178 L 145 178 Z" fill="#64748b" rx="2" />
  <path d="M 160 142 L 200 142 L 205 160 L 155 160 Z" fill="#94a3b8" />
  <ellipse cx="180" cy="151" rx="12" ry="4" fill="#0f172a" opacity="0.3" />

  <!-- Desk Lamp -->
  <path d="M 55 160 L 65 160 L 60 135 Z" fill="#cbd5e1" />
  <path d="M 60 148 L 50 115" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M 50 115 L 70 100" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M 65 92 L 80 108 L 55 110 Z" fill="url(#lampCone)" />
  <!-- Lamp Light Cone Projection -->
  <polygon points="68,105 100,185 40,185" fill="#fbbf24" opacity="0.12" />

  <!-- CHAOS / NONSENSE GRAPHIC ELEMENTS (Visualizing "Saying wild/untrue things") -->
  <path d="M 100 65 Q 120 30 145 55 T 160 80" fill="none" stroke="url(#chaosGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Floating abstract wild symbols / absurd icons replacing text -->
  <g transform="translate(115, 45) rotate(15)" opacity="0.85">
    <path d="M 0 10 Q 10 -10 20 10 T 40 10" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" />
    <circle cx="20" cy="-5" r="4" fill="#ec4899" />
  </g>
  <g transform="translate(135, 75) rotate(-20)" opacity="0.85">
    <!-- Crazy exclamation / question swirl -->
    <path d="M 0 0 C 10 -15 25 5 15 15 C 5 20 -5 10 0 0" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="15" cy="22" r="2.5" fill="#38bdf8" />
  </g>
  <polygon points="90,40 96,52 108,54 99,63 101,75 90,69 79,75 81,63 72,54 84,52" fill="#fbbf24" opacity="0.8" transform="scale(0.6) translate(80, 20)" />

  <!-- MAIN CHARACTER: Expressive body language for 'nói nhăng, nói bừa' (Wild gesturing, exaggerated expression) -->
  
  <!-- Torso & Jacket -->
  <path d="M 85 185 L 80 135 L 115 125 L 130 185 Z" fill="url(#jacketGrad)" />
  <path d="M 95 130 L 105 160 L 115 130" fill="#f8fafc" /> <!-- Shirt inner -->
  <path d="M 95 130 L 100 120 L 105 130 Z" fill="#ef4444" /> <!-- Red Tie -->

  <!-- Back Arm (Holding head in disbelief/frustration or wildly waving) -->
  <path d="M 85 135 C 70 125 55 140 60 160" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" />
  <!-- Back Hand -->
  <circle cx="60" cy="165" r="8" fill="#ffcca1" />

  <!-- Head & Neck -->
  <rect x="94" y="112" width="16" height="18" fill="#ffcca1" />
  <!-- Head shape tilted backwards/sideways for exaggerated talking -->
  <circle cx="102" cy="98" r="24" fill="#ffcca1" />

  <!-- Hair (Messy, styled cartoon hair) -->
  <path d="M 78 95 C 78 75 95 72 105 72 C 120 72 126 88 126 98 C 126 90 120 78 105 78 C 92 78 82 85 78 95 Z" fill="#1e293b" />
  <path d="M 80 92 C 75 85 82 76 90 75" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <path d="M 115 78 C 125 75 130 85 125 95" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />

  <!-- Facial Expressions (Exaggerated, comical, shouting/talking nonsense) -->
  <!-- Eyebrows (Dynamic, angled up) -->
  <path d="M 88 88 L 100 92" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <path d="M 106 91 L 116 86" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

  <!-- Eyes (Squinted, energetic) -->
  <path d="M 90 96 Q 95 101 100 96" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <path d="M 107 95 Q 112 100 117 94" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

  <!-- Open Mouth / Talking wildly -->
  <path d="M 94 105 Q 102 122 112 106 Z" fill="#991b1b" />
  <path d="M 97 106 Q 102 114 109 107" fill="#fca5a5" /> <!-- Tongue -->
  <!-- Teeth -->
  <path d="M 95 106 L 111 106" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Sweat drop (Comedic touch indicating frantic/nonsense talk) -->
  <path d="M 124 95 Q 128 102 124 106 Q 120 102 124 95 Z" fill="#38bdf8" opacity="0.8" />

  <!-- Front Arm (Wildly gesturing / pointing forward forcefully) -->
  <!-- Shoulder & Upper arm -->
  <path d="M 120 135 C 135 135 150 145 160 135" fill="none" stroke="#1d4ed8" stroke-width="15" stroke-linecap="round" />
  <!-- Forearm & Pointing Index Finger -->
  <path d="M 160 135 C 175 120 185 100 195 95" fill="none" stroke="#ffcca1" stroke-width="12" stroke-linecap="round" />
  <!-- Hand / Pointing Finger gesture -->
  <circle cx="196" cy="94" r="7" fill="#ffcca1" />
  <path d="M 198 90 L 212 85" stroke="#ffcca1" stroke-width="5" stroke-linecap="round" /> <!-- Pointing finger -->

  <!-- Foreground Coffee Mug on Desk for Scene Depth -->
  <path d="M 130 165 L 148 165 L 145 182 L 133 182 Z" fill="#f8fafc" />
  <path d="M 146 170 C 152 170 152 178 146 178" fill="none" stroke="#f8fafc" stroke-width="2.5" />
  <!-- Steam from coffee -->
  <path d="M 135 158 Q 138 152 135 146" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 142 160 Q 145 154 142 148" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />

</svg>