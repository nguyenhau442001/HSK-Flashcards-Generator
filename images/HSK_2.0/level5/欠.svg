<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Coin Gradient -->
    <linearGradient id="goldCoin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient Light from Desk Lamp -->
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Background Environment: Cozy Living Room / Office -->
  <!-- Bookshelf & Books -->
  <g opacity="0.4">
    <rect x="25" y="40" width="45" height="90" rx="4" fill="#334155"/>
    <rect x="30" y="60" width="35" height="8" fill="#64748b"/>
    <rect x="30" y="90" width="35" height="8" fill="#475569"/>
    <rect x="35" y="70" width="6" height="18" fill="#38bdf8"/>
    <rect x="43" y="68" width="8" height="20" fill="#ec4899"/>
    <rect x="53" y="72" width="5" height="16" fill="#10b981"/>
  </g>

  <!-- Window with Night City View -->
  <g opacity="0.6">
    <rect x="160" y="30" width="55" height="75" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <line x1="187" y1="30" x2="187" y2="105" stroke="#475569" stroke-width="2"/>
    <line x1="160" y1="67" x2="215" y2="67" stroke="#475569" stroke-width="2"/>
    <!-- City lights -->
    <rect x="168" y="40" width="5" height="8" fill="#fbbf24" opacity="0.8"/>
    <rect x="178" y="50" width="4" height="12" fill="#38bdf8" opacity="0.6"/>
    <rect x="195" y="38" width="6" height="10" fill="#f43f5e" opacity="0.7"/>
    <rect x="202" y="55" width="5" height="8" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- Wooden Desk Surface -->
  <path d="M15 170 L225 170 L235 220 L5 220 Z" fill="#334155" filter="url(#shadow)"/>
  <path d="M15 165 L225 165 L225 170 L15 170 Z" fill="#475569"/>

  <!-- Desk Lamp -->
  <path d="M195 165 L200 110 L210 110 L215 165 Z" fill="#64748b"/>
  <path d="M185 105 C185 90 225 90 225 105 Z" fill="#38bdf8"/>

  <!-- Character 1 (Me / Lenders): Sitting, looking concerned/waiting, holding out hand -->
  <g transform="translate(15, 30)">
    <!-- Body / Torso -->
    <path d="M45 110 C45 95 65 95 65 110 L75 140 C75 145 70 150 65 150 L45 150 C40 150 35 145 35 140 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="55" cy="75" r="18" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M38 72 C38 55 72 55 72 72 C72 75 70 78 68 76 C60 70 50 70 42 76 C40 78 38 75 38 72 Z" fill="#334155"/>
    <!-- Face Expressions (Serious / Expectant) -->
    <circle cx="49" cy="74" r="1.5" fill="#1e293b"/>
    <circle cx="61" cy="74" r="1.5" fill="#1e293b"/>
    <path d="M53 83 Q55 85 57 83" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Raised Hand asking/waiting -->
    <path d="M65 115 C75 115 82 120 80 128 C78 132 72 132 68 128" fill="#fed7aa" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Character 2 (The Debtor / "He"): Sitting opposite, slightly apologetic, scratching head, empty pockets -->
  <g transform="translate(130, 25)">
    <!-- Body / Torso -->
    <path d="M45 115 C45 100 65 100 65 115 L75 145 C75 150 70 155 65 155 L45 155 C40 155 35 150 35 145 Z" fill="#f43f5e"/>
    <!-- Head -->
    <circle cx="55" cy="80" r="18" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M37 78 C37 60 73 60 73 78 C70 75 68 72 65 74 C58 68 52 68 45 74 C42 72 40 75 37 78 Z" fill="#1e293b"/>
    <!-- Face (Apologetic/Awkward Smile) -->
    <circle cx="49" cy="79" r="1.5" fill="#1e293b"/>
    <circle cx="61" cy="79" r="1.5" fill="#1e293b"/>
    <path d="M53 87 Q55 85 57 87" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hand scratching head (showing embarrassment/debt) -->
    <path d="M42 70 C38 60 45 50 52 58" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
    <!-- Other hand pointing out empty pockets / low funds -->
    <path d="M65 125 C75 125 80 135 75 142" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Table Props: Notebook/IOU Ledger, Calculator, and VERY FEW Coins (representing "a little money" / "thiếu một ít tiền") -->
  <g transform="translate(0, 10)">
    <!-- Open Ledger / Notebook (Debt Record) -->
    <g transform="translate(95, 150) rotate(-5)" filter="url(#shadow)">
      <polygon points="0,15 25,5 50,15 50,45 25,55 0,45" fill="#f8fafc"/>
      <polygon points="25,5 50,15 50,45 25,55" fill="#e2e8f0"/>
      <!-- Mock lines / entries in ledger -->
      <line x1="8" y1="20" x2="20" y2="18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="26" x2="18" y2="24" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="32" x2="15" y2="30" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/> <!-- Highlighted deficit line -->
      <line x1="32" y1="22" x2="42" y2="25" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="29" x2="40" y2="32" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Calculator -->
    <g transform="translate(65, 160)" filter="url(#shadow)">
      <rect width="22" height="28" rx="3" fill="#475569"/>
      <rect x="3" y="4" width="16" height="6" rx="1" fill="#cbd5e1"/>
      <circle cx="6" cy="15" r="1.5" fill="#94a3b8"/>
      <circle cx="11" cy="15" r="1.5" fill="#94a3b8"/>
      <circle cx="16" cy="15" r="1.5" fill="#94a3b8"/>
      <circle cx="6" cy="20" r="1.5" fill="#94a3b8"/>
      <circle cx="11" cy="20" r="1.5" fill="#94a3b8"/>
      <circle cx="16" cy="20" r="1.5" fill="#f59e0b"/>
    </g>

    <!-- Only TWO/THREE coins (Visualizing "a little money" / scarce funds left) -->
    <g filter="url(#shadow)">
      <circle cx="115" cy="180" r="8" fill="url(#goldCoin)" stroke="#b45309" stroke-width="1.5"/>
      <circle cx="115" cy="180" r="4" fill="none" stroke="#b45309" stroke-width="1"/>

      <circle cx="127" cy="185" r="7" fill="url(#goldCoin)" stroke="#b45309" stroke-width="1.5"/>
      <circle cx="127" cy="185" r="3.5" fill="none" stroke="#b45309" stroke-width="1"/>

      <circle cx="121" cy="173" r="6" fill="url(#goldCoin)" stroke="#b45309" stroke-width="1.5"/>
    </g>

    <!-- Coffee Mug (Cozy setting prop) -->
    <g transform="translate(35, 155)" filter="url(#shadow)">
      <rect width="14" height="16" rx="2" fill="#f1f5f9"/>
      <path d="M14 4 C18 4 18 12 14 12" fill="none" stroke="#f1f5f9" stroke-width="2"/>
      <ellipse cx="7" cy="4" rx="7" ry="2" fill="#cbd5e1"/>
      <!-- Steam -->
      <path d="M4 -2 C2 -5 6 -7 4 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M10 -3 C12 -6 8 -8 10 -11" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
</svg>