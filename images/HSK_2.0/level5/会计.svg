<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Window Background Context -->
  <g id="environment">
    <!-- Window Frame & View -->
    <rect x="150" y="30" width="60" height="75" rx="4" fill="#334155" opacity="0.6"/>
    <rect x="153" y="33" width="54" height="69" rx="2" fill="url(#windowLight)"/>
    <!-- City silhouette outside window -->
    <path d="M158 95 L158 75 L165 75 L165 95 L175 95 L175 60 L185 60 L185 95 L195 95 L195 68 L202 68 L202 95 Z" fill="#475569" opacity="0.5"/>
    <!-- Window crossbars -->
    <line x1="180" y1="33" x2="180" y2="102" stroke="#1e293b" stroke-width="2"/>
    <line x1="153" y1="67" x2="207" y2="67" stroke="#1e293b" stroke-width="2"/>

    <!-- Office Plant Shelf / Decor -->
    <rect x="25" y="35" width="45" height="6" rx="3" fill="#475569"/>
    <!-- Plant Pot -->
    <path d="M42 35 L40 25 L50 25 L48 35 Z" fill="#cbd5e1"/>
    <!-- Plant Leaves -->
    <path d="M45 25 C45 18 35 15 37 10 C42 12 45 20 45 25 Z" fill="#10b981"/>
    <path d="M45 25 C45 15 55 12 53 8 C48 10 45 18 45 25 Z" fill="#34d399"/>
  </g>

  <!-- Office Desk and Equipment -->
  <g id="desk-and-props">
    <!-- Desk Surface -->
    <path d="M15 150 L225 150 L215 195 L25 195 Z" fill="#334155"/>
    <!-- Desk Front Edge -->
    <rect x="15" y="150" width="210" height="6" rx="2" fill="#475569"/>

    <!-- Dual Monitors Setup (Accounting Workstation) -->
    <!-- Left Monitor (Spreadsheet) -->
    <rect x="30" y="85" width="50" height="40" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="33" y="88" width="44" height="34" rx="2" fill="url(#screenGlow)"/>
    <!-- Spreadsheet Grid Lines -->
    <line x1="38" y1="96" x2="72" y2="96" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <line x1="38" y1="104" x2="72" y2="104" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <line x1="38" y1="112" x2="65" y2="112" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <line x1="50" y1="88" x2="50" y2="122" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <!-- Monitor Stand -->
    <rect x="50" y="125" width="10" height="15" fill="#475569"/>
    <ellipse cx="55" cy="140" rx="14" ry="3" fill="#1e293b"/>

    <!-- Right Monitor (Charts/Graphs) -->
    <rect x="85" y="75" width="55" height="50" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="88" y="78" width="49" height="44" rx="2" fill="url(#screenGlow)"/>
    <!-- Analytics Bars -->
    <rect x="95" y="105" width="7" height="12" rx="1" fill="#10b981"/>
    <rect x="106" y="95" width="7" height="22" rx="1" fill="#38bdf8"/>
    <rect x="117" y="88" width="7" height="29" rx="1" fill="#fbbf24"/>
    <line x1="92" y1="118" x2="132" y2="118" stroke="#64748b" stroke-width="1.5"/>
    <!-- Monitor Stand -->
    <rect x="107" y="125" width="10" height="15" fill="#475569"/>
    <ellipse cx="112" cy="140" rx="14" ry="3" fill="#1e293b"/>

    <!-- Financial Calculator (Classic Accounting Tool) -->
    <rect x="145" y="125" width="22" height="28" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="148" y="128" width="16" height="6" rx="1" fill="#0f172a"/>
    <!-- Calculator buttons -->
    <circle cx="150" cy="138" r="1.5" fill="#64748b"/>
    <circle cx="155" cy="138" r="1.5" fill="#64748b"/>
    <circle cx="160" cy="138" r="1.5" fill="#f59e0b"/>
    <circle cx="150" cy="143" r="1.5" fill="#64748b"/>
    <circle cx="155" cy="143" r="1.5" fill="#64748b"/>
    <circle cx="160" cy="143" r="1.5" fill="#10b981"/>
    <circle cx="150" cy="148" r="1.5" fill="#64748b"/>
    <circle cx="155" cy="148" r="1.5" fill="#64748b"/>

    <!-- Stack of Financial Documents / Ledger -->
    <g transform="translate(175, 125)">
      <rect x="0" y="10" width="35" height="6" rx="1.5" fill="#cbd5e1"/>
      <rect x="2" y="6" width="31" height="6" rx="1.5" fill="#f1f5f9"/>
      <rect x="1" y="2" width="33" height="6" rx="1.5" fill="#e2e8f0"/>
      <!-- Lines on paper -->
      <line x1="6" y1="5" x2="25" y2="5" stroke="#94a3b8" stroke-width="1"/>
      <!-- Red stamp -->
      <circle cx="25" cy="13" r="4" fill="none" stroke="#ef4444" stroke-width="1"/>
      <line x1="22" y1="13" x2="28" y2="13" stroke="#ef4444" stroke-width="1"/>
    </g>

    <!-- Sleek Desk Lamp -->
    <path d="M195 150 L200 110 L210 110" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M205 102 C202 102 200 106 199 110 L215 110 C214 106 212 102 209 102 Z" fill="#38bdf8"/>
    <!-- Light Cone / Glow from Lamp -->
    <ellipse cx="170" cy="145" rx="25" ry="8" fill="url(#lampGlow)"/>

    <!-- Coffee Mug -->
    <rect x="25" y="130" width="12" height="15" rx="2" fill="#ec4899"/>
    <path d="M37 134 C40 134 40 141 37 141" fill="none" stroke="#ec4899" stroke-width="2"/>
  </g>

  <!-- Character: Professional Accountant (Female) -->
  <g id="accountant-character">
    <!-- Office Chair Backrest -->
    <path d="M95 110 L125 110 L120 170 L100 170 Z" fill="#334155" opacity="0.9"/>
    <ellipse cx="110" cy="110" rx="15" ry="5" fill="#475569"/>

    <!-- Character Body / Torso (Blazer) -->
    <!-- Shoulders & Blouse -->
    <path d="M85 160 C85 140 100 135 110 135 C120 135 135 140 135 160 L140 185 L80 185 Z" fill="#38bdf8"/>
    <!-- Blazer Lapels -->
    <path d="M95 142 L110 160 L125 142" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
    <!-- Inner White Shirt -->
    <polygon points="104,142 116,142 110,155" fill="#f8fafc"/>

    <!-- Arms & Hands -->
    <!-- Left Arm (Typing/Using Calculator) -->
    <path d="M87 148 L125 145" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="128" cy="145" r="4.5" fill="#fcd34d"/> <!-- Hand -->

    <!-- Right Arm (Holding Pen / Working) -->
    <path d="M133 148 L155 138" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="157" cy="136" r="4.5" fill="#fcd34d"/> <!-- Hand -->
    <!-- Pen -->
    <line x1="157" y1="136" x2="167" y2="132" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="105" y="128" width="10" height="12" fill="#fcd34d"/>

    <!-- Head -->
    <circle cx="110" cy="115" r="16" fill="#fcd34d"/>

    <!-- Hair Style (Professional bun / stylish bob with bangs) -->
    <!-- Back Hair / Bun -->
    <circle cx="110" cy="103" r="8" fill="#1e293b"/>
    <!-- Main Hair Base -->
    <path d="M94 115 C94 100 126 100 126 115 C126 120 124 125 120 125 L100 125 C96 125 94 120 94 115 Z" fill="#1e293b"/>
    <!-- Bangs Framing Face -->
    <path d="M95 110 C98 105 108 103 115 106 C122 103 124 110 125 115 C120 112 105 112 95 110 Z" fill="#1e293b"/>

    <!-- Friendly Facial Expression -->
    <!-- Glasses (Smart Professional Look) -->
    <rect x="99" y="110" width="10" height="7" rx="1.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="111" y="110" width="10" height="7" rx="1.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="109" y1="113" x2="111" y2="113" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Gentle Confident Smile -->
    <path d="M106 123 C108 125 112 125 114 123" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Rosy Cheeks -->
    <circle cx="101" cy="120" r="2" fill="#f43f5e" opacity="0.4"/>
    <circle cx="119" cy="120" r="2" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- Foreground Atmospheric Details -->
  <!-- Floating Accounting / Finance Elements (Abstract stylistic, minimal, non-textual) -->
  <g opacity="0.7">
    <!-- Glowing green checkmark / success indicator near screen -->
    <circle cx="85" cy="55" r="8" fill="#10b981" opacity="0.2"/>
    <path d="M81 55 L84 58 L89 52" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floating financial curve graph symbol -->
    <path d="M20 70 Q 30 60, 40 65 T 60 50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <circle cx="60" cy="50" r="3" fill="#38bdf8" opacity="0.6"/>

    <!-- Golden coin accent -->
    <circle cx="210" cy="165" r="7" fill="#fbbf24"/>
    <circle cx="210" cy="165" r="5" fill="#f59e0b"/>
  </g>
</svg>