<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Counter Surface Gradient -->
    <linearGradient id="counter-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="counter-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <!-- Receipt Paper Gradient -->
    <linearGradient id="receipt-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background glow behind POS terminal -->
  <circle cx="120" cy="110" r="50" fill="#38bdf8" opacity="0.1" filter="url(#glow)" />

  <!-- Background Cafe/Shop Shelving & Ambiance -->
  <g opacity="0.3">
    <rect x="30" y="30" width="70" height="6" rx="3" fill="#64748b" />
    <circle cx="45" cy="22" r="8" fill="#f43f5e" />
    <path d="M65 30 L75 18 L85 30 Z" fill="#10b981" />
    
    <rect x="140" y="45" width="70" height="6" rx="3" fill="#64748b" />
    <rect x="155" y="25" width="12" height="20" rx="3" fill="#fb923c" />
    <rect x="175" y="20" width="16" height="25" rx="3" fill="#a855f7" />
  </g>

  <!-- Checkout Counter -->
  <g filter="url(#shadow)">
    <!-- Counter Front -->
    <path d="M 20 160 L 220 160 L 220 215 C 220 220 216 224 210 224 L 30 224 C 24 224 20 220 20 215 Z" fill="url(#counter-front)" />
    <!-- Counter Top Surface -->
    <path d="M 20 150 L 220 150 L 220 160 L 20 160 Z" fill="url(#counter-top)" />
    <!-- Wood/Accent Trim -->
    <rect x="20" y="150" width="200" height="3" fill="#64748b" opacity="0.5" />
  </g>

  <!-- POS Terminal & Card Reader Machine -->
  <g transform="translate(100, 75)" filter="url(#shadow)">
    <!-- Terminal Base / Stand -->
    <path d="M 15 75 L 25 75 L 30 55 L 10 55 Z" fill="#334155" />
    <ellipse cx="20" cy="75" rx="12" ry="4" fill="#1e293b" />

    <!-- Main Terminal Body -->
    <rect x="-8" y="10" width="56" height="50" rx="8" fill="#334155" />
    <rect x="-4" y="14" width="48" height="42" rx="5" fill="#1e293b" />

    <!-- POS Screen (Glowing) -->
    <rect x="0" y="18" width="40" height="24" rx="3" fill="url(#screen-glow)" />
    <!-- Graphical UI Elements on Screen (Abstract checkout UI) -->
    <rect x="5" y="22" width="18" height="3" rx="1.5" fill="#ffffff" opacity="0.9" />
    <rect x="5" y="28" width="12" height="2" rx="1" fill="#bae6fd" />
    <rect x="25" y="22" width="10" height="8" rx="2" fill="#10b981" />
    <rect x="5" y="36" width="30" height="2" rx="1" fill="#38bdf8" opacity="0.6" />

    <!-- Keypad Area -->
    <circle cx="8" cy="48" r="2" fill="#64748b" />
    <circle cx="20" cy="48" r="2" fill="#64748b" />
    <circle cx="32" cy="48" r="2" fill="#64748b" />
    <circle cx="8" cy="54" r="2" fill="#64748b" />
    <circle cx="20" cy="54" r="2" fill="#64748b" />
    <circle cx="32" cy="54" r="2" fill="#64748b" />

    <!-- Built-in Receipt Printer Slot at Top -->
    <rect x="2" y="6" width="36" height="4" rx="2" fill="#1e293b" />
  </g>

  <!-- Receipt Paper Spilling Out -->
  <g filter="url(#shadow)">
    <path d="M 103 70 
             C 103 55, 125 50, 120 40 
             C 115 30, 135 20, 125 10" 
          fill="none" stroke="url(#receipt-grad)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Realistic Receipt overlay with jagged bottom/creases -->
    <path d="M 112 35 L 138 35 L 135 68 L 131 66 L 127 68 L 123 66 L 119 68 L 115 66 L 112 68 Z" fill="url(#receipt-grad)" />
    
    <!-- Receipt Content Lines (Abstract) -->
    <line x1="117" y1="42" x2="131" y2="42" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="117" y1="48" x2="133" y2="48" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="117" y1="54" x2="125" y2="54" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="117" y1="60" x2="130" y2="60" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Action Element: Contactless Payment / Credit Card tapping -->
  <g transform="translate(60, 95) rotate(-15)" filter="url(#shadow)">
    <!-- The Card -->
    <rect width="52" height="34" rx="5" fill="url(#card-grad)" />
    <!-- Card Chip -->
    <rect x="8" y="10" width="10" height="8" rx="2" fill="#fde047" />
    <rect x="10" y="12" width="6" height="4" rx="1" fill="#ca8a04" opacity="0.4" />
    <!-- Card Stripe / Details -->
    <rect x="0" y="4" width="52" height="6" fill="#1e293b" opacity="0.3" />
    <circle cx="40" cy="24" r="4" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Contactless Payment Signal Waves (Action lines emphasizing 'tapping' to pay) -->
  <g transform="translate(108, 95)">
    <path d="M 5 -10 C 12 -5, 12 15, 5 20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M 11 -15 C 20 -8, 20 18, 11 25" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <path d="M 17 -20 C 28 -10, 28 20, 17 30" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.2" />
  </g>

  <!-- Foreground Props: Shopping basket / Coffee cup to anchor the real-world scene -->
  <g transform="translate(30, 125)" filter="url(#shadow)">
    <!-- Takeaway Coffee Cup representing the purchased goods -->
    <path d="M 10 15 L 18 55 C 18 58, 21 60, 24 60 L 46 60 C 49 60, 52 58, 52 55 L 60 15 Z" fill="#f8fafc" />
    <!-- Cup Sleeve -->
    <path d="M 13 28 L 57 28 L 55 46 L 15 46 Z" fill="#fb923c" />
    <!-- Lid -->
    <ellipse cx="35" cy="15" rx="26" ry="5" fill="#cbd5e1" />
    <path d="M 28 10 C 28 7, 42 7, 42 10 Z" fill="#94a3b8" />
  </g>

  <!-- Sparkles / Success Indicators -->
  <g transform="translate(165, 80)">
    <path d="M 0 10 L 4 4 L 10 0 L 4 -4 L 0 -10 L -4 -4 L -10 0 L -4 4 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(50, 60)">
    <path d="M 0 6 L 2.5 2.5 L 6 0 L 2.5 -2.5 L 0 -6 L -2.5 -2.5 L -6 0 L -2.5 2.5 Z" fill="#38bdf8" />
  </g>
  <g transform="translate(190, 130)">
    <path d="M 0 8 L 3 3 L 8 0 L 3 -3 L 0 -8 L -3 -3 L -8 0 L -3 3 Z" fill="#10b981" />
  </g>

</svg>