<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Accent Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Accent Glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gradient for Barbell -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Weight Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <!-- Apparel Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effects -->
  <circle cx="120" cy="110" r="90" fill="url(#amberGlow)" />
  <circle cx="50" cy="180" r="70" fill="url(#cyanGlow)" />

  <!-- Gym Interior Wall Details / Diagonal Accents -->
  <path d="M 0,0 L 240,0 L 240,240 L 0,240 Z" fill="none" />
  <line x1="30" y1="0" x2="30" y2="240" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
  <line x1="210" y1="0" x2="210" y2="240" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
  <path d="M 0,190 Q 120,210 240,190 L 240,240 L 0,240 Z" fill="#0f172a" fill-opacity="0.8" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.5" />

  <!-- Background Gym Equipment (Dumbbell Rack / Mirror outline) -->
  <rect x="180" y="70" width="35" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="186" y="80" width="23" height="12" rx="2" fill="#475569" />
  <rect x="186" y="105" width="23" height="12" rx="2" fill="#475569" />
  <rect x="186" y="130" width="23" height="12" rx="2" fill="#475569" />

  <!-- Atmospheric Floor Reflection / Shadow for Lifter -->
  <ellipse cx="120" cy="185" rx="55" ry="12" fill="#000000" opacity="0.5" />

  <!-- MAIN SUBJECT: Fitness / Weightlifting Character -->
  <g filter="url(#shadow)">
    <!-- Legs in Squat / Wide Stance -->
    <path d="M 95,145 Q 85,165 75,182 L 92,185 Q 100,170 106,148 Z" fill="#1e293b" />
    <path d="M 145,145 Q 155,165 165,182 L 148,185 Q 140,170 134,148 Z" fill="#1e293b" />
    <!-- Shoes -->
    <path d="M 65,182 Q 75,180 92,185 L 90,192 Q 70,192 65,182 Z" fill="#fb923c" />
    <path d="M 175,182 Q 165,180 148,185 L 150,192 Q 170,192 175,182 Z" fill="#fb923c" />

    <!-- Torso (Dynamic Posture) -->
    <path d="M 95,110 L 145,110 L 152,150 L 88,150 Z" fill="url(#shirtGrad)" />
    <!-- Dynamic Sweat / Muscle Detail Lines -->
    <path d="M 115,115 L 115,135" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
    <path d="M 125,115 L 125,135" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />

    <!-- Head & Face -->
    <circle cx="120" cy="85" r="18" fill="url(#skinGrad)" />
    <!-- Hair -->
    <path d="M 102,85 C 102,70 110,66 120,66 C 130,66 138,70 138,85 L 135,77 C 130,72 125,72 120,72 C 115,72 110,72 105,77 Z" fill="#0f172a" />
    <!-- Determined Face Expression (Eyebrow & Closed Happy/Straining Eyes) -->
    <path d="M 111,83 L 117,86" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 123,86 L 129,83" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 116,94 Q 120,98 124,94" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Arms Holding Barbell overhead -->
    <!-- Left Arm -->
    <path d="M 95,115 L 78,85 L 90,75 L 100,105 Z" fill="url(#skinGrad)" />
    <!-- Right Arm -->
    <path d="M 145,115 L 162,85 L 150,75 L 140,105 Z" fill="url(#skinGrad)" />

    <!-- Heavy Barbell & Weight Plates -->
    <!-- Center Bar -->
    <rect x="40" y="70" width="160" height="8" rx="4" fill="url(#metalGrad)" />
    
    <!-- Left Weight Plates -->
    <rect x="45" y="45" width="10" height="58" rx="3" fill="url(#plateGrad)" stroke="#64748b" stroke-width="1.5" />
    <rect x="58" y="52" width="8" height="44" rx="2" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
    <rect x="69" y="58" width="6" height="32" rx="2" fill="url(#plateGrad)" stroke="#64748b" stroke-width="1" />

    <!-- Right Weight Plates -->
    <rect x="185" y="45" width="10" height="58" rx="3" fill="url(#plateGrad)" stroke="#64748b" stroke-width="1.5" />
    <rect x="174" y="52" width="8" height="44" rx="2" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
    <rect x="165" y="58" width="6" height="32" rx="2" fill="url(#plateGrad)" stroke="#64748b" stroke-width="1" />

    <!-- Collars / Locks on Bar -->
    <rect x="78" y="67" width="5" height="14" rx="1" fill="#fbbf24" />
    <rect x="157" y="67" width="5" height="14" rx="1" fill="#fbbf24" />
  </g>

  <!-- Foreground Atmospheric Elements / Energy Sparks -->
  <circle cx="75" cy="40" r="3" fill="#fbbf24" />
  <circle cx="170" cy="35" r="2" fill="#38bdf8" />
  <circle cx="140" cy="30" r="4" fill="#fbbf24" opacity="0.8" />
  <path d="M 100,35 L 105,42 L 98,40 Z" fill="#38bdf8" />
  
  <!-- Sweat Droplets for Action Effect -->
  <path d="M 132,78 Q 135,83 132,86 Q 129,83 132,78 Z" fill="#38bdf8" />
  <path d="M 108,76 Q 110,80 108,82 Q 106,80 108,76 Z" fill="#38bdf8" />

  <!-- Dumbbell Accessory on the Floor (Contextual prop) -->
  <g transform="translate(35, 175) rotate(-15)">
    <rect x="0" y="4" width="24" height="4" rx="2" fill="url(#metalGrad)" />
    <rect x="-4" y="0" width="6" height="12" rx="2" fill="#10b981" />
    <rect x="22" y="0" width="6" height="12" rx="2" fill="#10b981" />
  </g>

  <!-- Water Bottle Accessory on Floor -->
  <g transform="translate(185, 170)">
    <rect x="0" y="5" width="12" height="20" rx="4" fill="#38bdf8" />
    <rect x="3" y="1" width="6" height="5" rx="1" fill="#0f172a" />
    <path d="M 3,12 L 9,12" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Subtle Inner Border / Frame Stroke for Polish -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.5" />
</svg>