  <!-- Golden Laurel Wreath (Symbolizing Qualification/Achievement) -->
  <path d="M80 140 C60 140 50 120 50 100 C50 80 70 70 90 80" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M160 140 C180 140 190 120 190 100 C190 80 170 70 150 80" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Floating Stars/Accents -->
