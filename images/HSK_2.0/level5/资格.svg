  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Podium/Stage -->
  <path d="M40 180 L200 180 L190 200 L50 200 Z" fill="#334155"/>
  <path d="M50 200 L190 200 L180 215 L60 215 Z" fill="#1e293b"/>
  
