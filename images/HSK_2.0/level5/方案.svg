<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Blueprint Paper Gradient -->
    <linearGradient id="blueprint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Warm Light Glow -->
    <radialGradient id="desk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Surface Gradient -->
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="110" r="90" fill="url(#desk-glow)" />

  <!-- Wooden Desk Surface Base -->
  <path d="M 20 180 Q 120 170 220 180 L 230 220 Q 120 230 10 220 Z" fill="url(#wood-grad)" />
  <path d="M 20 180 Q 120 170 220 180 L 225 190 Q 120 180 15 190 Z" fill="#475569" opacity="0.4" />

  <!-- SCENE: Strategy & Planning Workshop Props -->
  
  <!-- Coffee Mug (Warm Accent) -->
  <g transform="translate(180, 130)" filter="url(#soft-shadow)">
    <!-- Mug Body -->
    <rect x="0" y="0" width="22" height="26" rx="4" fill="#f43f5e" />
    <path d="M 22 6 C 28 6 28 18 22 18" fill="none" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 7 -4 Q 10 -10 7 -16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 15 -6 Q 12 -12 15 -18" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Architectural Compass & Drafting Tools -->
  <g transform="translate(35, 125) rotate(-15)" filter="url(#soft-shadow)">
    <!-- Ruler -->
    <rect x="0" y="0" width="65" height="12" rx="2" fill="#fbbf24" opacity="0.9" />
    <line x1="10" y1="0" x2="10" y2="4" stroke="#78350f" stroke-width="1.5" />
    <line x1="20" y1="0" x2="20" y2="4" stroke="#78350f" stroke-width="1.5" />
    <line x1="30" y1="0" x2="30" y2="4" stroke="#78350f" stroke-width="1.5" />
    <line x1="40" y1="0" x2="40" y2="4" stroke="#78350f" stroke-width="1.5" />
    <line x1="50" y1="0" x2="50" y2="4" stroke="#78350f" stroke-width="1.5" />
  </g>

  <!-- MAIN SUBJECT: The "Plan / Proposal" (方案) - Detailed Blueprint Document Portfolio -->
  <g filter="url(#soft-shadow)">
    <!-- Secondary Stacked Paper (Underneath) -->
    <path d="M 55 85 L 175 75 L 190 185 L 70 195 Z" fill="#e2e8f0" opacity="0.7" />

    <!-- Main Blueprint Document (Angled & Dynamic) -->
    <g transform="translate(45, 60) rotate(-4)">
      <!-- Document Base Sheet -->
      <rect x="0" y="0" width="130" height="120" rx="6" fill="url(#blueprint-grad)" />
      
      <!-- Grid Lines on Blueprint -->
      <path d="M 0 30 H 130 M 0 60 H 130 M 0 90 H 130 M 30 0 V 120 M 65 0 V 120 M 95 0 V 120" stroke="#bae6fd" stroke-width="1" opacity="0.25" />

      <!-- Document Header Red Accent Tag / Folder Clip -->
      <rect x="15" y="-6" width="35" height="12" rx="3" fill="#fb923c" />

      <!-- Visual Content: Flowchart / Strategy Map representing "Plan/方案" -->
      <!-- Node 1 -->
      <circle cx="30" cy="35" r="10" fill="#10b981" />
      <path d="M 26 35 L 29 38 L 35 31" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Connector Line 1 -->
      <path d="M 40 35 H 70 V 75 H 85" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 2" />

      <!-- Node 2 -->
      <circle cx="95" cy="75" r="10" fill="#fbbf24" />
      <circle cx="95" cy="75" r="4" fill="#ffffff" />

      <!-- Bar Chart Graphic (Projecting growth/phases of the plan) -->
      <rect x="20" y="75" width="8" height="30" rx="2" fill="#38bdf8" />
      <rect x="33" y="60" width="8" height="45" rx="2" fill="#38bdf8" />
      <rect x="46" y="50" width="8" height="55" rx="2" fill="#10b981" />
      
      <!-- Trend Arrow Over Chart -->
      <path d="M 18 80 Q 35 45 55 35" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
      <path d="M 50 33 L 57 33 L 53 40" fill="#ec4899" />

      <!-- Text Lines Mockup (Abstract shapes simulating structured proposal text) -->
      <rect x="68" y="25" width="45" height="6" rx="3" fill="#ffffff" opacity="0.8" />
      <rect x="68" y="37" width="30" height="5" rx="2.5" fill="#ffffff" opacity="0.5" />
      
      <rect x="68" y="95" width="45" height="6" rx="3" fill="#ffffff" opacity="0.8" />
      <rect x="68" y="107" width="35" height="5" rx="2.5" fill="#ffffff" opacity="0.5" />
    </g>
  </g>

  <!-- Interactive Element: Golden Smart Pen / Stylus pointing at the plan -->
  <g transform="translate(130, 140) rotate(-45)" filter="url(#soft-shadow)">
    <!-- Pen Body -->
    <rect x="0" y="0" width="8" height="65" rx="4" fill="#f59e0b" />
    <!-- Pen Grip -->
    <rect x="0" y="45" width="8" height="15" fill="#d97706" />
    <!-- Pen Tip -->
    <path d="M 0 65 L 4 75 L 8 65 Z" fill="#cbd5e1" />
    <!-- Pen Cap Detail -->
    <rect x="2" y="-4" width="4" height="6" rx="2" fill="#1e293b" />
  </g>

  <!-- Floating Sparkles / Creative Energy (Indicating active problem solving & great new plan) -->
  <g fill="#fbbf24">
    <path d="M 30 50 Q 35 50 35 45 Q 35 50 40 50 Q 35 50 35 55 Q 35 50 30 50 Z" />
    <path d="M 195 70 Q 198 70 198 67 Q 198 70 201 70 Q 198 70 198 73 Q 198 70 195 70 Z" />
    <path d="M 160 30 Q 164 30 164 26 Q 164 30 168 30 Q 164 30 164 34 Q 164 30 160 30 Z" fill="#38bdf8" />
  </g>

</svg>