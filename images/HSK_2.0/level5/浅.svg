<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Riverbed ground -->
  <path d="M0 160 Q120 140 240 160 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 170 Q120 150 240 170 L240 240 L0 240 Z" fill="#475569"/>
  
  <!-- Stones in shallow water -->
  <circle cx="40" cy="190" r="12" fill="#64748b"/>
  <circle cx="80" cy="210" r="18" fill="#64748b"/>
  <circle cx="150" cy="195" r="10" fill="#64748b"/>
  <circle cx="200" cy="220" r="15" fill="#64748b"/>
  
  <!-- Shallow Water Layer -->
  <path d="M0 150 Q120 130 240 150 L240 240 L0 240 Z" fill="#38bdf8" opacity="0.3"/>
  
  <!-- Character: A person standing in the water, water only reaching ankles -->
  <g transform="translate(100, 140)">
    <!-- Legs -->
    <rect x="-15" y="30" width="8" height="40" fill="#fb923c"/>
    <rect x="7" y="30" width="8" height="40" fill="#fb923c"/>
    <!-- Torso -->
    <rect x="-20" y="-20" width="40" height="50" rx="5" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="0" cy="-40" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-20 -45 A20 20 0 0 1 20 -45 L0 -60 Z" fill="#1e293b"/>
  </g>
  
  <!-- Ripples -->
  <ellipse cx="100" cy="180" rx="20" ry="5" stroke="#bae6fd" stroke-width="2" fill="none" opacity="0.6"/>
  <ellipse cx="120" cy="185" rx="15" ry="4" stroke="#bae6fd" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Atmosphere -->
  <circle cx="200" cy="50" r="30" fill="#f59e0b" opacity="0.1"/>
  <path d="M0 150 Q120 130 240 150" stroke="#bae6fd" stroke-width="2" opacity="0.4" fill="none"/>
</svg>