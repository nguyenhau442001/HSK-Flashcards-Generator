<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- UI Window Glow & Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="pencilGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Gradients for Elements -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="tabletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="pencilWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="accentPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <linearGradient id="glowYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Ambient background shapes (light/shadow play) -->
  <circle cx="190" cy="50" r="40" fill="#38bdf8" opacity="0.03"/>
  <circle cx="50" cy="180" r="60" fill="#f59e0b" opacity="0.03"/>

  <!-- Isometric/Angled Wooden Desk Surface -->
  <path d="M15 190 L225 190 L210 215 L30 215 Z" fill="#0f172a" opacity="0.6"/>
  <path d="M20 185 L220 185 L225 195 L15 195 Z" fill="#334155" opacity="0.4"/>

  <!-- Main Scene Context: A Stylized Study/Creation Desk -->
  <!-- Opened Creative Notebook / Tablet Base -->
  <g filter="url(#softShadow)" transform="translate(0, 5)">
    <!-- Tablet/Workspace Base -->
    <rect x="45" y="45" width="150" height="120" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="53" y="53" width="134" height="104" rx="8" fill="#1e293b"/>

    <!-- Screen UI Elements (Abstract phonetic guidelines & creative blocks) -->
    <!-- Sound wave / tone accent bars -->
    <rect x="68" y="70" width="36" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="108" y="70" width="24" height="8" rx="4" fill="#38bdf8" opacity="0.4"/>
    
    <!-- Tone contour curved path (representing high-low pitch mapping) -->
    <path d="M 68 105 Q 85 90, 102 105 T 136 105" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Phonetic structural block highlights (representing initial/final breakdowns) -->
    <rect x="68" y="125" width="30" height="20" rx="6" fill="#10b981" opacity="0.2"/>
    <rect x="68" y="125" width="30" height="20" rx="6" fill="none" stroke="#10b981" stroke-width="1.5"/>

    <rect x="106" y="125" width="30" height="20" rx="6" fill="#ec4899" opacity="0.2"/>
    <rect x="106" y="125" width="30" height="20" rx="6" fill="none" stroke="#ec4899" stroke-width="1.5"/>

    <rect x="144" y="125" width="36" height="20" rx="6" fill="#fbbf24" opacity="0.2"/>
    <rect x="144" y="125" width="36" height="20" rx="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Sparkles / Magic Learning Elements -->
    <path d="M175 75 L177 82 L184 84 L177 86 L175 93 L173 86 L166 84 L173 82 Z" fill="#fbbf24"/>
    <path d="M60 95 L61 99 L65 100 L61 101 L60 105 L59 101 L55 100 L59 99 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Decorative Realistic Props (Coffee Mug on the side) -->
  <g transform="translate(15, 110)" filter="url(#softShadow)">
    <rect x="0" y="10" width="22" height="28" rx="4" fill="#cbd5e1"/>
    <!-- Mug handle -->
    <path d="M 22 15 C 30 15, 30 30, 22 33" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Coffee surface -->
    <ellipse cx="11" cy="10" rx="11" ry="3" fill="#b45309"/>
    <!-- Steam wisps -->
    <path d="M 8 3 Q 5 -2, 10 -7 T 8 -14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Action-Packed Magical Writing Instrument (Floating Magic Pencil & Sound/Phonetic Sparks) -->
  <g filter="url(#pencilGlow)" transform="rotate(-25 150 110)">
    <!-- Pencil Body -->
    <path d="M 120 100 L 190 100 L 190 116 L 120 116 Z" fill="url(#accentPink)"/>
    <!-- Pencil Stripe -->
    <rect x="120" y="105" width="70" height="2" fill="#fbcfe8" opacity="0.6"/>

    <!-- Eraser & Ferrule -->
    <rect x="190" y="98" width="10" height="20" rx="2" fill="#f43f5e"/>
    <rect x="187" y="98" width="4" height="20" fill="#94a3b8"/>

    <!-- Wooden Tip -->
    <path d="M 120 100 L 110 108 L 120 116 Z" fill="url(#pencilWood)"/>
    
    <!-- Graphite Lead Tip -->
    <path d="M 110 108 L 105 108 L 110 108 Z" stroke="#0f172a" stroke-width="3"/>
    
    <!-- Sparkling magical trace line emitting from the tip -->
    <path d="M 105 108 Q 80 110, 60 130" fill="none" stroke="url(#glowYellow)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Phonetic Accent Sparkles / Dynamic Sound Elements -->
  <g transform="translate(20, -5)">
    <!-- Tone Accent Floating Marks (Macron, Acute, Caron, Grave symbols styled as abstract vector art) -->
    <!-- Macron (1st tone vibe) -->
    <rect x="75" y="38" width="12" height="3" rx="1.5" fill="#38bdf8" filter="url(#softShadow)"/>
    <!-- Acute (2nd tone vibe) -->
    <path d="M 102 44 L 112 36" stroke="#10b981" stroke-width="3" stroke-linecap="round" filter="url(#softShadow)"/>
    <!-- Caron (3rd tone vibe) -->
    <path d="M 128 37 L 134 43 L 140 37" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)"/>
    <!-- Grave (4th tone vibe) -->
    <path d="M 158 36 L 168 44" stroke="#ec4899" stroke-width="3" stroke-linecap="round" filter="url(#softShadow)"/>
  </g>

  <!-- Dynamic Energy Burst / Sparkles near pencil tip -->
  <circle cx="95" cy="115" r="3" fill="#ffffff"/>
  <circle cx="85" cy="128" r="2" fill="#38bdf8"/>
  <circle cx="105" cy="135" r="2.5" fill="#fbbf24"/>

  <!-- Additional cozy desktop props: A tiny folded sticky note with geometric shapes -->
  <g transform="translate(170, 140) rotate(12)" filter="url(#softShadow)">
    <polygon points="0,0 25,-5 28,22 3,25" fill="#fef08a"/>
    <!-- Mini abstract lines on sticky note -->
    <line x1="6" y1="6" x2="18" y2="5" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="12" x2="22" y2="11" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="14" y2="17" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>