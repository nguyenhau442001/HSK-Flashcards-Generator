<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Golden Glow Gradient for Dream/Achievement -->
    <radialGradient id="dreamGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Star/Sparkle Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. Full-bleed Container & Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Dream Glow from Top Center -->
  <circle cx="120" cy="80" r="110" fill="url(#dreamGlow)"/>

  <!-- 2. Rich Environmental Context (Art Studio / Architect / Inventor Workshop) -->
  <!-- Wallpaper / Back wall details -->
  <rect x="20" y="25" width="200" height="150" rx="6" fill="#1b263b" opacity="0.6"/>
  
  <!-- Large Arch Window showing starry night / sky of possibilities -->
  <path d="M 155 35 L 205 35 L 205 115 C 205 135 180 135 180 115 L 180 75 L 155 75 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <path d="M 157 37 L 203 37 L 203 113 C 203 131 178 131 178 113 L 178 75 L 157 75 Z" fill="url(#lightBeam)"/>
  
  <!-- Stars in Window -->
  <circle cx="170" cy="50" r="1.5" fill="#fef08a"/>
  <circle cx="190" cy="65" r="1" fill="#fff"/>
  <circle cx="165" cy="85" r="1.2" fill="#fef08a"/>

  <!-- Shelves with props (Books, Globes, Models) -->
  <rect x="30" y="55" width="55" height="4" rx="2" fill="#475569"/>
  <rect x="40" y="38" width="12" height="17" rx="2" fill="#ec4899"/>
  <rect x="54" y="42" width="10" height="13" rx="2" fill="#38bdf8"/>
  <circle cx="70" cy="46" r="6" fill="#10b981"/>

  <!-- Corkboard with sketches / plans (representing the journey of the dream) -->
  <rect x="92" y="35" width="45" height="32" rx="3" fill="#9a3412" opacity="0.4"/>
  <rect x="96" y="39" width="16" height="11" fill="#fef08a" transform="rotate(-5 96 39)"/>
  <rect x="116" y="41" width="17" height="12" fill="#e2e8f0" transform="rotate(4 116 41)"/>
  <rect x="98" y="53" width="28" height="10" fill="#f8fafc" transform="rotate(-2 98 53)"/>

  <!-- 3. Foreground Studio Furniture (Large Drafting / Work Table) -->
  <path d="M 25 145 L 215 145 L 205 185 L 35 185 Z" fill="#334155" filter="url(#softShadow)"/>
  <rect x="20" y="140" width="200" height="8" rx="3" fill="#475569"/>
  <rect x="35" y="148" width="14" height="40" fill="#1e293b"/>
  <rect x="191" y="148" width="14" height="40" fill="#1e293b"/>

  <!-- Working Props on Table -->
  <!-- Architectural Model / Masterpiece (The achieved dream realized) -->
  <g transform="translate(135, 115)">
    <!-- Base platform -->
    <polygon points="0,25 35,15 70,25 35,35" fill="#64748b"/>
    <!-- Miniature modern building / structure -->
    <polygon points="20,15 20,-10 35,-20 50,-10 50,15" fill="#38bdf8" opacity="0.8"/>
    <polygon points="35,-20 35,-35 50,-25 50,-10" fill="#0284c7" opacity="0.9"/>
    <!-- Glowing windows on model -->
    <rect x="25" y="-5" width="4" height="6" fill="#fef08a"/>
    <rect x="33" y="-5" width="4" height="6" fill="#fef08a"/>
    <rect x="41" y="-5" width="4" height="6" fill="#fef08a"/>
  </g>

  <!-- Blueprints / Rolled papers & Drafting tools -->
  <path d="M 45 155 L 75 142 L 80 148 L 50 161 Z" fill="#e2e8f0"/>
  <circle cx="85" cy="155" r="7" fill="#fb923c"/>
  <rect x="95" y="150" width="30" height="4" rx="2" fill="#cbd5e1" transform="rotate(-15 95 150)"/>
  <polygon points="175,165 195,145 198,148 178,168" fill="#f43f5e"/>

  <!-- 4. Main Character (Accomplished, joyful, expressive posture) -->
  <g transform="translate(75, 80)">
    <!-- Body / Torso (leaning slightly back in triumphant relief/joy) -->
    <path d="M 25 50 C 20 40 30 25 45 25 C 60 25 70 40 65 50 L 75 95 C 75 98 70 102 65 102 L 25 102 C 20 102 15 98 15 95 Z" fill="#4f46e5" filter="url(#softShadow)"/>
    <!-- Collar & Tie/Scarf accent -->
    <polygon points="45,28 38,40 52,40" fill="#f8fafc"/>
    <polygon points="45,40 42,58 48,58" fill="#f43f5e"/>

    <!-- Arms raised in celebration ("I did it!" / Dream achieved) -->
    <!-- Left Arm (Raised Up) -->
    <path d="M 23 35 C 10 25 0 10 -5 5 C -8 2 -5 -2 -2 -4 C 1 -6 5 -3 8 2 C 15 15 25 30 30 38 Z" fill="#312e81"/>
    <!-- Left Hand -->
    <circle cx="-6" cy="-2" r="5" fill="#fdba74"/>

    <!-- Right Arm (Raised Up high) -->
    <path d="M 67 35 C 80 25 92 12 97 7 C 100 4 97 0 94 -2 C 91 -4 87 -1 84 4 C 77 15 67 30 62 38 Z" fill="#312e81"/>
    <!-- Right Hand -->
    <circle cx="95" cy="0" r="5" fill="#fdba74"/>

    <!-- Head and Face (Expressive, smiling with eyes closed in pure joy/satisfaction) -->
    <circle cx="45" cy="12" r="16" fill="#fdba74" filter="url(#softShadow)"/>
    <!-- Hair (Stylish modern haircut) -->
    <path d="M 29 12 C 29 2 35 -4 45 -5 C 55 -5 61 2 61 12 C 61 15 59 10 57 6 C 53 -1 37 -1 33 6 C 31 10 29 12 29 12 Z" fill="#1e1b4b"/>
    
    <!-- Facial Expressions - Happy glowing face -->
    <!-- Closed Happy Eyes (Arcs) -->
    <path d="M 38 10 C 40 7 42 7 44 10" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 46 10 C 48 7 50 7 52 10" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Big joyful smile -->
    <path d="M 40 16 C 42 20 48 20 50 16" stroke="#9a3412" stroke-width="2" stroke-linecap="round" fill="#fff"/>
    <!-- Rosy Cheeks -->
    <circle cx="37" cy="15" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="53" cy="15" r="3" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- 5. Magical Floating Sparkles & Achievement Elements (Symbolizing '梦想' coming true) -->
  <!-- Sparkle 1 (Top Left) -->
  <path d="M 45 45 Q 45 60 30 60 Q 45 60 45 75 Q 45 60 60 60 Q 45 60 45 45 Z" fill="url(#starGrad)" filter="url(#softShadow)"/>
  
  <!-- Sparkle 2 (Top Right near model) -->
  <path d="M 130 50 Q 130 60 120 60 Q 130 60 130 70 Q 130 60 140 60 Q 130 60 130 50 Z" fill="url(#starGrad)" filter="url(#softShadow)"/>
  
  <!-- Sparkle 3 (Small floating golden stars) -->
  <circle cx="105" cy="85" r="3" fill="#fef08a"/>
  <circle cx="155" cy="105" r="2" fill="#f59e0b"/>
  <circle cx="75" cy="45" r="2.5" fill="#fef08a"/>

  <!-- Floating Golden Ribbon / Swirl (Dynamic visual representing success/realization) -->
  <path d="M 20 120 C 35 100 50 130 70 110 C 90 90 115 130 135 110" stroke="url(#starGrad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#softShadow)"/>

  <!-- Additional ambient light particles -->
  <circle cx="35" cy="95" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="195" cy="125" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="115" cy="165" r="1.5" fill="#fef08a" opacity="0.6"/>
</svg>