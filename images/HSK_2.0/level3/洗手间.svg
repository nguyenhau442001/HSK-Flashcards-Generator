<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wall Gradient -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mirror Glow Gradient -->
    <linearGradient id="mirrorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Sink Front Gradient -->
    <linearGradient id="sinkFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Water Splash Animation Effect -->
    <radialGradient id="bubble" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Tiles background structure -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="url(#wallGrad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Subtle Wall Tiles Grid Lines -->
  <path d="M20 60 H220 M20 100 H220 M20 140 H220 M70 20 V170 M120 20 V170 M170 20 V170" stroke="#475569" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Warm ambient light from upper right -->
  <circle cx="200" cy="30" r="40" fill="#fbbf24" opacity="0.15" filter="blur(10px)"/>

  <!-- Hanging Wall Mirror -->
  <rect x="80" y="35" width="80" height="70" rx="35" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <!-- Mirror Glass reflection -->
  <rect x="85" y="40" width="70" height="60" rx="30" fill="url(#mirrorGlow)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Mirror shine diagonal streak -->
  <path d="M100 40 L130 100" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" opacity="0.15"/>

  <!-- Vanity Counter Top -->
  <rect x="50" y="130" width="140" height="10" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>

  <!-- Washbasin Body (Recessed Ceramic Sink) -->
  <path d="M85 140 C85 160 155 160 155 140 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="120" cy="140" rx="32" ry="8" fill="url(#sinkFront)" stroke="#94a3b8" stroke-width="2"/>

  <!-- Shiny Modern Faucet -->
  <!-- Base -->
  <rect x="116" y="115" width="8" height="18" rx="2" fill="#94a3b8"/>
  <!-- Spout curved neck -->
  <path d="M120 115 C120 105 135 105 135 115 L135 122" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
  <!-- Faucet Handle -->
  <rect x="106" y="118" width="8" height="4" rx="2" fill="#38bdf8"/>

  <!-- Action-Packed Elements: Running Water & Bubbles -->
  <!-- Stream of Water -->
  <path d="M133 124 C133 133 131 133 131 142" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M133 124 C133 133 131 133 131 142" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Splashing Water Droplets and Bubbles inside sink -->
  <circle cx="123" cy="143" r="3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="138" cy="141" r="2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="114" cy="145" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="131" cy="146" r="5" fill="#38bdf8" opacity="0.5"/>
  <path d="M110 142 C115 138 120 144 125 140" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Side Props: Soap Dispenser -->
  <rect x="65" y="108" width="14" height="22" rx="4" fill="#ec4899" stroke="#db2777" stroke-width="1.5"/>
  <!-- Soap Pump mechanism -->
  <rect x="70" y="104" width="4" height="5" fill="#f8fafc"/>
  <path d="M72 104 C66 102 65 98 65 98" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
  <!-- Soap label accent -->
  <rect x="67" y="115" width="10" height="8" rx="1" fill="#f472b6" opacity="0.6"/>

  <!-- Side Props: Rolled Hand Towel on rack / Small plant -->
  <circle cx="175" cy="115" r="9" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <path d="M175 106 C178 110 178 120 175 124" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <!-- Plant Pot -->
  <path d="M168 124 L182 124 L179 130 L171 130 Z" fill="#fb923c" stroke="#ea580c" stroke-width="1.5"/>

  <!-- Bathroom Floor Baseboard & Floor -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <line x1="20" y1="170" x2="220" y2="170" stroke="#334155" stroke-width="4"/>

  <!-- Floor Accent: Clean Soft Bath Mat -->
  <ellipse cx="120" cy="195" rx="55" ry="16" fill="#38bdf8" opacity="0.15"/>
  <ellipse cx="120" cy="198" rx="45" ry="12" fill="#38bdf8" opacity="0.25" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Playful Atmospheric Sparkles/Bubbles -->
  <circle cx="50" cy="50" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="190" cy="75" r="2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="40" cy="110" r="2.5" fill="#34d399" opacity="0.7"/>

  <!-- Outer Framing Accent for HSK Scene Card -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#475569" stroke-width="2" opacity="0.5"/>
</svg>