<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="10" rx="2" fill="#334155"/>
  
  <!-- Left Shirt (Smaller/Simpler) -->
  <g transform="translate(50, 80)">
    <path d="M10 20 L50 20 L45 80 L15 80 Z" fill="#38bdf8"/>
    <path d="M20 20 L20 10 L40 10 L40 20" fill="none" stroke="#0f172a" stroke-width="3"/>
    <circle cx="30" cy="40" r="3" fill="#1e293b"/>
    <circle cx="30" cy="60" r="3" fill="#1e293b"/>
  </g>
  
  <!-- Right Shirt (Larger/More Detailed/Premium) -->
  <g transform="translate(130, 60)">
    <path d="M5 20 L65 20 L60 100 L10 100 Z" fill="#fbbf24"/>
    <path d="M15 20 L15 5 L55 5 L55 20" fill="none" stroke="#0f172a" stroke-width="4"/>
    <circle cx="35" cy="35" r="4" fill="#1e293b"/>
    <circle cx="35" cy="60" r="4" fill="#1e293b"/>
    <circle cx="35" cy="85" r="4" fill="#1e293b"/>
    <path d="M25 35 L45 35" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Price Tags (Visual Comparison) -->
  <rect x="55" y="175" width="30" height="15" rx="4" fill="#ec4899"/>
  <rect x="145" y="175" width="40" height="15" rx="4" fill="#10b981"/>
  
  <!-- Scale/Balance Indicator -->
  <path d="M120 170 L120 190" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M110 190 L130 190" stroke="#94a3b8" stroke-width="2"/>
</svg>