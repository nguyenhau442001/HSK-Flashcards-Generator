<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Table & Light Gradient -->
    <linearGradient id="table-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Bowl Gradient -->
    <linearGradient id="bowl-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Steam & Magic Glow Filters/Gradients -->
    <radialGradient id="glow-grad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Restaurant Ambiance (Warm Lights & Windows) -->
  <g opacity="0.15">
    <circle cx="40" cy="50" r="15" fill="#fbbf24"/>
    <circle cx="200" cy="40" r="20" fill="#fbbf24"/>
    <rect x="20" y="20" width="200" height="120" rx="10" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <line x1="120" y1="20" x2="120" y2="140" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Ambient Golden Glow behind the dish (Representing "极" - Extremely good) -->
  <circle cx="120" cy="130" r="70" fill="url(#glow-grad)"/>

  <!-- Wooden/Modern Dining Table Surface -->
  <path d="M 0 160 Q 120 150 240 160 L 240 240 L 0 240 Z" fill="url(#table-grad)"/>
  <ellipse cx="120" cy="160" rx="110" ry="12" fill="#475569" opacity="0.6"/>

  <!-- Restaurant Chair / Backrest Context -->
  <rect x="75" y="80" width="90" height="50" rx="12" fill="#0f172a" opacity="0.4"/>

  <!-- CHARACTER: Happy Food Lover (Upper body, leaning in) -->
  <g id="character">
    <!-- Body/Shirt -->
    <path d="M 70 240 Q 80 180 120 180 Q 160 180 170 240 Z" fill="#38bdf8"/>
    <!-- Collar -->
    <path d="M 105 180 L 120 195 L 135 180 Z" fill="#bae6fd"/>

    <!-- Neck -->
    <rect x="110" y="155" width="20" height="30" rx="8" fill="#fcd34d"/>

    <!-- Head -->
    <circle cx="120" cy="135" r="28" fill="#fcd34d"/>

    <!-- Hair -->
    <path d="M 92 135 C 92 110, 148 110, 148 135 C 148 125, 140 112, 120 112 C 100 112, 92 125, 92 135 Z" fill="#334155"/>

    <!-- Closed Happy/Ecstatic Eyes (Crescent shapes showing extreme delight) -->
    <path d="M 106 133 Q 112 127 118 133" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 122 133 Q 128 127 134 133" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Blush / Cute Cheeks -->
    <circle cx="104" cy="140" r="4" fill="#fb7185" opacity="0.6"/>
    <circle cx="136" cy="140" r="4" fill="#fb7185" opacity="0.6"/>

    <!-- Big Happy Open Smile -->
    <path d="M 112 143 Q 120 153 128 143" fill="#1e293b"/>
    <path d="M 115 146 Q 120 150 125 146" fill="#f43f5e"/>

    <!-- Hands holding chopsticks / near face in joy -->
    <circle cx="95" cy="175" r="9" fill="#fcd34d"/>
    <circle cx="145" cy="175" r="9" fill="#fcd34d"/>
  </g>

  <!-- THE DELICIOUS DISH (Main Prop: Món ăn cực ngon) -->
  <g id="delicious-dish">
    <!-- Plate / Bowl Rim -->
    <ellipse cx="120" cy="165" rx="55" ry="18" fill="url(#bowl-grad)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Bowl Inner Depth -->
    <ellipse cx="120" cy="167" rx="48" ry="13" fill="#1e293b"/>

    <!-- Colorful Appetizing Food Inside (Steaming stir-fry / gourmet dish) -->
    <!-- Rice/Base -->
    <ellipse cx="120" cy="168" rx="42" ry="10" fill="#fef08a"/>
    <!-- Food chunks (Vibrant red tomatoes, green veggies, golden protein) -->
    <circle cx="105" cy="166" r="7" fill="#ef4444"/>
    <circle cx="130" cy="169" r="8" fill="#10b981"/>
    <circle cx="118" cy="164" r="6" fill="#f97316"/>
    <circle cx="135" cy="164" r="5" fill="#ef4444"/>
    <path d="M 98 168 Q 110 162 125 168 Z" fill="#22c55e"/>

    <!-- Decorative Chopsticks resting across -->
    <line x1="80" y1="180" x2="170" y2="150" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="82" y1="183" x2="168" y2="153" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Steam / Aroma Swirls (Signifying freshness and incredible appeal) -->
  <g stroke="#f8fafc" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M 105 150 Q 95 135 110 120 Q 125 105 115 90"/>
    <path d="M 120 152 Q 130 137 115 122 Q 100 107 110 92" opacity="0.6"/>
    <path d="M 135 150 Q 145 135 135 120 Q 125 105 140 88"/>
  </g>

  <!-- Sparkles / Stars (Emphasizing "极" - Supreme quality/deliciousness) -->
  <g fill="#fbbf24">
    <!-- Star 1 (Top Left) -->
    <path d="M 60 90 L 63 97 L 70 100 L 63 103 L 60 110 L 57 103 L 50 100 L 57 97 Z"/>
    <!-- Star 2 (Top Right) -->
    <path d="M 180 80 L 182 85 L 187 87 L 182 89 L 180 94 L 178 89 L 173 87 L 178 85 Z"/>
    <!-- Star 3 (Center Sparkle) -->
    <path d="M 120 60 L 122.5 67 L 129 69.5 L 122.5 72 L 120 78.5 L 117.5 72 L 111 69.5 L 117.5 67 Z" transform="scale(1.2) translate(-24, -12)"/>
  </g>

  <!-- Little heart icon floating to show love for the food -->
  <path d="M 155 115 C 155 108, 165 105, 170 112 C 175 105, 185 108, 185 115 C 185 124, 170 132, 170 132 C 170 132, 155 124, 155 115 Z" fill="#f43f5e" opacity="0.9"/>
</svg>