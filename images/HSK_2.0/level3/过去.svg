<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Window View of Beijing (Forbidden City style roofs / skyline silhouette in past) -->
  <g id="window-scene" opacity="0.4">
    <!-- Warm amber sky of the past memory -->
    <rect x="50" y="45" width="140" height="85" rx="4" fill="#1e293b"/>
    <path d="M50 95 Q120 70 190 95 L190 130 L50 130 Z" fill="#334155"/>
    <!-- Traditional roof silhouette -->
    <path d="M70 90 L85 75 L155 75 L170 90 Z" fill="#64748b"/>
    <path d="M65 92 L175 92 L170 97 L70 97 Z" fill="#475569"/>
    <!-- Pagoda / Roof curve -->
    <path d="M100 75 Q120 60 140 75 Z" fill="#64748b"/>
  </g>

  <!-- Wall & Room Interior -->
  <rect x="20" y="30" width="200" height="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Window Frame -->
  <rect x="50" y="45" width="140" height="85" rx="2" fill="none" stroke="#475569" stroke-width="4"/>
  <!-- Window Pane Divider -->
  <line x1="120" y1="45" x2="120" y2="130" stroke="#475569" stroke-width="3"/>
  <line x1="50" y1="87" x2="190" y2="87" stroke="#475569" stroke-width="3"/>

  <!-- Warm Retro Wall Lamp -->
  <path d="M35 60 L45 60 L45 75 L35 75 Z" fill="#fbbf24"/>
  <path d="M30 75 L50 75 L45 90 L35 90 Z" fill="#f59e0b"/>
  <!-- Light glow from lamp -->
  <circle cx="40" cy="85" r="30" fill="#fbbf24" opacity="0.15"/>

  <!-- Hanging Scroll (Traditional touch for Beijing setting) -->
  <rect x="195" y="55" width="25" height="50" rx="2" fill="#334155"/>
  <line x1="207" y1="52" x2="207" y2="55" stroke="#94a3b8" stroke-width="2"/>
  <line x1="202" y1="65" x2="215" y2="65" stroke="#64748b" stroke-width="2"/>
  <line x1="202" y1="75" x2="215" y2="75" stroke="#64748b" stroke-width="2"/>

  <!-- Foreground Desk / Table -->
  <rect x="15" y="180" width="210" height="15" rx="3" fill="#334155"/>
  <rect x="30" y="195" width="15" height="30" fill="#1e293b"/>
  <rect x="195" y="195" width="15" height="30" fill="#1e293b"/>

  <!-- Props on Desk: Vintage Photo Frame (representing 'Past' / 过去) -->
  <g transform="translate(145, 135)">
    <rect x="0" y="0" width="35" height="45" rx="3" fill="#b45309" stroke="#d97706" stroke-width="2"/>
    <rect x="4" y="4" width="27" height="33" rx="1" fill="#fef3c7"/>
    <!-- Miniature landscape inside frame -->
    <circle cx="17.5" cy="18" r="8" fill="#fbbf24"/>
    <path d="M4 30 Q17.5 22 31 30 Z" fill="#059669"/>
    <rect x="14" y="38" width="7" height="7" fill="#78350f"/>
  </g>

  <!-- Tea Cup prop -->
  <path d="M45 162 C45 157 55 157 55 162 L53 177 C53 179 47 179 47 177 Z" fill="#e2e8f0"/>
  <path d="M54 165 C58 165 58 172 54 172" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Steam lines -->
  <path d="M48 150 Q50 145 48 140" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M52 148 Q54 143 52 138" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Main Character (Living in Beijing - cheerful expression, holding travel/memories or warm clothing) -->
  <g id="character">
    <!-- Body / Torso with Winter/Autumn coat (Beijing climate context) -->
    <path d="M95 145 Q120 135 145 145 L155 185 L85 185 Z" fill="#0284c7"/>
    <!-- Scarf -->
    <path d="M100 138 Q120 148 140 138 L135 155 Q120 160 105 155 Z" fill="#ef4444"/>
    <path d="M125 153 L130 185 L142 185 L137 153 Z" fill="#dc2626"/>

    <!-- Neck -->
    <rect x="112" y="128" width="16" height="15" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="120" cy="110" r="22" fill="#fbcfe8"/>
    
    <!-- Hair -->
    <path d="M98 110 C98 90 142 90 142 110 C142 118 138 120 135 115 C130 100 110 100 105 115 C102 120 98 118 98 110 Z" fill="#334155"/>

    <!-- Facial Expression: Smiling, Nostalgic/Happy -->
    <!-- Eyes (Friendly curves) -->
    <path d="M110 108 Q113 104 116 108" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M124 108 Q127 104 130 108" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M115 118 Q120 123 125 118" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="109" cy="114" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="131" cy="114" r="3" fill="#f43f5e" opacity="0.4"/>

    <!-- Arms & Hands gesturing warmly -->
    <path d="M98 145 Q80 155 90 170" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <path d="M142 145 Q160 155 150 170" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Hands -->
    <circle cx="90" cy="172" r="5" fill="#fbcfe8"/>
    <circle cx="150" cy="172" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Floating Memory Elements (Visual metaphor for '过去' / Past Time) -->
  <g id="memory-bubbles" opacity="0.8">
    <circle cx="185" cy="95" r="14" fill="#38bdf8" opacity="0.2"/>
    <circle cx="195" cy="70" r="8" fill="#38bdf8" opacity="0.3"/>
    <circle cx="210" cy="85" r="5" fill="#38bdf8" opacity="0.4"/>
  </g>

</svg>