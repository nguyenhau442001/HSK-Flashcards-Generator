<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Mug Gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting: Raindrops on Window / Outside Night -->
  <g opacity="0.4">
    <!-- Window Frame in Background -->
    <rect x="30" y="30" width="80" height="110" rx="4" fill="#090d16" stroke="#334155" stroke-width="3" />
    <!-- Rain Streaks Outside -->
    <line x1="45" y1="45" x2="40" y2="70" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="75" y1="50" x2="70" y2="85" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="95" y1="40" x2="90" y2="65" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="55" y1="85" x2="50" y2="115" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="85" y1="95" x2="80" y2="120" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Volumetric Light Beam from Window -->
  <polygon points="30,30 110,30 180,220 10,220" fill="url(#lightBeam)" />

  <!-- Room Interior Details: Bookshelf / Lamp in background -->
  <path d="M180,140 L220,130 L220,220 L180,220 Z" fill="#0f172a" opacity="0.8" />
  <!-- Warm Ambient Lamp Glow -->
  <circle cx="200" cy="90" r="25" fill="#fbbf24" opacity="0.1" filter="url(#glow)" />
  <path d="M195,75 L205,75 L208,95 L192,95 Z" fill="#475569" />
  <path d="M190,95 L210,95 L200,70 Z" fill="#f59e0b" />

  <!-- Furniture: Large Cozy Armchair -->
  <!-- Chair Back and Sides -->
  <path d="M60,90 Q60,60 100,60 Q140,60 140,90 L150,190 Q150,210 130,210 L70,210 Q50,210 50,190 Z" fill="#334155" />
  <!-- Chair Cushion -->
  <ellipse cx="100" cy="175" rx="45" ry="18" fill="#475569" />

  <!-- CHARACTER: Sitting, slumped, looking sad/downcast -->
  <g id="sad-character">
    <!-- Legs (bent, sitting) -->
    <path d="M75,185 Q75,200 90,200 L115,200" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Slumped Torso (Oversized Sweater) -->
    <path d="M75,130 Q100,120 125,130 L135,180 Q100,190 65,180 Z" fill="url(#sweaterGrad)" />

    <!-- Head & Hair (Drooping forward) -->
    <path d="M82,95 Q80,75 102,75 Q125,75 122,98 Q125,115 100,118 Q78,115 82,95 Z" fill="#334155" /> <!-- Hair Back -->
    <circle cx="102" cy="102" r="18" fill="#fcd34d" /> <!-- Face Skin -->
    <path d="M85,95 Q102,80 118,92 Q102,96 85,95 Z" fill="#334155" /> <!-- Hair Bangs drooping -->

    <!-- Sad Facial Expression -->
    <!-- Closed/Downcast Eyes (Arcs) -->
    <path d="M93,103 Q96,106 99,103" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M106,103 Q109,106 112,103" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Sad Eyebrows (Slanted inwards/upwards) -->
    <path d="M91,99 L98,101" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />
    <path d="M114,99 L107,101" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />
    <!-- Downturned Sad Mouth -->
    <path d="M100,113 Q102,110 105,113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Subtle Sad Blush -->
    <circle cx="91" cy="108" r="3" fill="#f43f5e" opacity="0.3" />
    <circle cx="113" cy="108" r="3" fill="#f43f5e" opacity="0.3" />

    <!-- Drooping Arms hugging knees / holding mug -->
    <!-- Left Arm -->
    <path d="M80,135 Q70,155 85,170" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M120,135 Q135,150 115,165" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" />

    <!-- Warm Mug held in hands (symbolizing comfort in sadness) -->
    <rect x="105" y="155" width="16" height="20" rx="3" fill="url(#mugGrad)" />
    <path d="M121,160 C125,160 125,170 121,170" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Steam rising from mug -->
    <path d="M110,147 Q113,142 110,137 Q107,132 110,127" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M116,145 Q119,140 116,135 Q113,130 116,125" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Foreground Cozy Elements -->
  <!-- Small Floor Rug -->
  <ellipse cx="100" cy="220" rx="60" ry="12" fill="#334155" opacity="0.5" />

  <!-- Dynamic Atmospheric Particles (Dust motes / falling tear-like soft light flecks in room) -->
  <circle cx="60" cy="100" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="80" cy="60" r="2" fill="#38bdf8" opacity="0.4" />
  <circle cx="130" cy="80" r="1" fill="#38bdf8" opacity="0.5" />
  <circle cx="150" cy="130" r="2.5" fill="#38bdf8" opacity="0.3" />

</svg>