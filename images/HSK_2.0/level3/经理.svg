<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window City View Gradient -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Suit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Office Interior Background -->
  <!-- Accent Wall Panel -->
  <path d="M40 20 H200 V160 H40 Z" fill="#1e293b" />
  
  <!-- Large Office Window showing City Skyline -->
  <g rx="8">
    <rect x="135" y="30" width="85" height="110" rx="4" fill="url(#windowGrad)" />
    <!-- City Buildings Silhouette in Window -->
    <rect x="142" y="70" width="12" height="70" fill="#2e1065" opacity="0.8"/>
    <rect x="157" y="55" width="16" height="85" fill="#3b0764" opacity="0.8"/>
    <rect x="176" y="80" width="14" height="60" fill="#2e1065" opacity="0.8"/>
    <rect x="193" y="65" width="18" height="75" fill="#3b0764" opacity="0.8"/>
    <!-- Window Frame -->
    <rect x="135" y="30" width="85" height="110" fill="none" stroke="#64748b" stroke-width="3" />
    <line x1="177" y1="30" x2="177" y2="140" stroke="#64748b" stroke-width="2" />
    <line x1="135" y1="85" x2="220" y2="85" stroke="#64748b" stroke-width="2" />
  </g>

  <!-- Indoor Ambient Details (Bookshelf / Plant) -->
  <!-- Bookshelf -->
  <rect x="20" y="35" width="30" height="105" fill="#0f172a" />
  <rect x="23" y="55" width="24" height="4" fill="#334155" />
  <rect x="23" y="85" width="24" height="4" fill="#334155" />
  <rect x="23" y="115" width="24" height="4" fill="#334155" />
  <!-- Colorful Book Spines -->
  <rect x="25" y="42" width="6" height="13" fill="#f59e0b" rx="1" />
  <rect x="33" y="40" width="8" height="15" fill="#10b981" rx="1" />
  <rect x="26" y="65" width="7" height="20" fill="#ec4899" rx="1" />
  <rect x="35" y="68" width="5" height="17" fill="#38bdf8" rx="1" />

  <!-- Potted Plant on Floor -->
  <path d="M205 130 C205 125 215 125 215 130 L220 160 H200 Z" fill="#64748b" />
  <path d="M210 125 Q195 100 185 95 Q205 110 210 125 Z" fill="#10b981" />
  <path d="M210 125 Q225 100 235 90 Q215 110 210 125 Z" fill="#059669" />
  <path d="M210 125 Q210 95 210 85 Q210 105 210 125 Z" fill="#34d399" />

  <!-- Light Beam from Window -->
  <polygon points="135,30 220,30 220,180 90,180" fill="url(#lightBeam)" />

  <!-- Manager Character (Confident, Professional, Standing / Leaning at Executive Desk) -->
  <g filter="url(#shadow)">
    <!-- Executive Office Chair -->
    <path d="M85 110 L105 110 L115 170 L75 170 Z" fill="#334155" rx="4" />
    <ellipse cx="95" cy="110" rx="12" ry="5" fill="#475569" />

    <!-- Character Body (Manager in Suit) -->
    <!-- Legs -->
    <rect x="85" y="150" width="8" height="35" fill="#1e293b" />
    <rect x="97" y="150" width="8" height="35" fill="#1e293b" />
    <ellipse cx="89" cy="185" rx="5" ry="3" fill="#0f172a" />
    <ellipse cx="101" cy="185" rx="5" ry="3" fill="#0f172a" />

    <!-- Torso (Suit Jacket) -->
    <path d="M75 105 L115 105 L120 155 L70 155 Z" fill="url(#suitGrad)" rx="6" />
    <!-- Shirt & Tie -->
    <polygon points="95,105 90,125 100,125" fill="#f8fafc" />
    <polygon points="95,115 93,140 97,140" fill="#ef4444" /> <!-- Red Executive Tie -->
    
    <!-- Lapels -->
    <path d="M95,105 L85,130 L90,135 Z" fill="#1e40af" />
    <path d="M95,105 L105,130 L100,135 Z" fill="#1e40af" />

    <!-- Head and Face -->
    <circle cx="95" cy="80" r="16" fill="#fcd34d" /> <!-- Warm skin tone -->
    <!-- Stylish Hair -->
    <path d="M79 80 C79 65 111 65 111 80 C108 72 82 72 79 80 Z" fill="#0f172a" />
    <!-- Friendly, Confident Expression -->
    <path d="M89 82 Q95 87 101 82" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="89" cy="76" r="2" fill="#1e293b" />
    <circle cx="101" cy="76" r="2" fill="#1e293b" />
    <!-- Glasses for professional manager look -->
    <rect x="86" y="73" width="7" height="6" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <rect x="97" y="73" width="7" height="6" rx="1" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <line x1="93" y1="76" x2="97" y2="76" stroke="#0f172a" stroke-width="1.5" />

    <!-- Arms & Hands Gesturing Confidently -->
    <!-- Left Arm (Holding Tablet / Folder) -->
    <path d="M73 115 L55 135 L65 145 L80 125 Z" fill="#1d4ed8" />
    <!-- Right Arm (Gesturing upward/open) -->
    <path d="M117 115 L135 100 L140 110 L122 130 Z" fill="#1d4ed8" />
    <!-- Hands -->
    <circle cx="137" cy="105" r="4" fill="#fcd34d" />
    <!-- Executive Folder / Portfolio in Left Hand -->
    <rect x="50" y="130" width="22" height="28" rx="2" fill="#b45309" transform="rotate(-15 50 130)" />
    <rect x="53" y="134" width="16" height="20" rx="1" fill="#fef3c7" transform="rotate(-15 50 130)" />
  </g>

  <!-- Executive Wooden Desk (Foreground) -->
  <g filter="url(#shadow)">
    <!-- Desk Top -->
    <path d="M10 165 H230 L220 200 H20 Z" fill="url(#deskGrad)" />
    <!-- Desk Front Panel -->
    <path d="M20 200 H220 V210 H20 Z" fill="#1e293b" />
    
    <!-- Props on Desk -->
    <!-- Modern Laptop -->
    <path d="M125 170 L155 170 L160 185 L120 185 Z" fill="#94a3b8" />
    <path d="M128 150 H152 V170 H128 Z" fill="#cbd5e1" rx="1" />
    <!-- Laptop Screen Glow -->
    <path d="M130 152 H150 V168 H130 Z" fill="#38bdf8" opacity="0.8" />
    <!-- Code/Chart lines on screen -->
    <line x1="133" y1="157" x2="147" y2="157" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <line x1="133" y1="162" x2="142" y2="162" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

    <!-- Coffee Mug with Steam -->
    <rect x="175" y="165" width="14" height="16" rx="2" fill="#f8fafc" />
    <path d="M189 170 C193 170 193 178 189 178" fill="none" stroke="#f8fafc" stroke-width="2" />
    <!-- Coffee Steam -->
    <path d="M179 160 Q182 155 179 150" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M184 158 Q187 153 184 148" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

    <!-- Desk Name Plate / Badge Holder (Clean, No Text) -->
    <g transform="translate(60, 168)">
      <polygon points="0,12 8,0 42,0 50,12" fill="#fbbf24" />
      <polygon points="3,12 8,3 42,3 47,12" fill="#d97706" />
      <rect x="10" y="4" width="30" height="7" rx="1" fill="#fef3c7" />
    </g>

    <!-- Professional Desk Lamp -->
    <path d="M200 175 L205 155 L215 155 L220 175 Z" fill="#334155" />
    <path d="M210 155 L210 135" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <path d="M195 130 Q210 120 225 130 Z" fill="#f59e0b" />
    <!-- Lamp Light Glow Cone -->
    <polygon points="210,132 170,195 235,195" fill="#fbbf24" opacity="0.12" />
  </g>

  <!-- High-end Office Ambient Highlights -->
  <circle cx="120" cy="20" r="1.5" fill="#fef08a" opacity="0.5" />
  <circle cx="180" cy="15" r="1" fill="#fef08a" opacity="0.6" />
  <circle cx="60" cy="25" r="1" fill="#fef08a" opacity="0.4" />
</svg>