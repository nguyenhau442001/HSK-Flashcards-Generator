<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="light-beam" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Cinema Environment -->
  <!-- Ambient Wall Lighting / Sconces -->
  <circle cx="25" cy="110" r="18" fill="url(#lamp-glow)"/>
  <rect x="22" y="100" width="6" height="20" rx="3" fill="#334155"/>
  <path d="M15 115 L35 115 L30 125 L20 125 Z" fill="#64748b"/>

  <circle cx="215" cy="110" r="18" fill="url(#lamp-glow)"/>
  <rect x="212" y="100" width="6" height="20" rx="3" fill="#334155"/>
  <path d="M205 115 L225 115 L220 125 L210 125 Z" fill="#64748b"/>

  <!-- Exit Sign (Darkened context for end of movie) -->
  <rect x="102" y="32" width="36" height="16" rx="4" fill="#065f46"/>
  <rect x="105" y="35" width="30" height="10" rx="2" fill="#10b981" opacity="0.3"/>

  <!-- Movie Screen (Now showing end credits / blank blue-gray with house lights coming up) -->
  <rect x="35" y="55" width="170" height="95" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="37" y="57" width="166" height="91" fill="url(#screen-glow)"/>
  
  <!-- Subtle rolling credits line representations on screen -->
  <rect x="70" y="80" width="100" height="4" rx="2" fill="#64748b" opacity="0.4"/>
  <rect x="90" y="92" width="60" height="4" rx="2" fill="#64748b" opacity="0.3"/>
  <rect x="80" y="104" width="80" height="4" rx="2" fill="#64748b" opacity="0.3"/>
  <rect x="95" y="116" width="50" height="3" rx="1.5" fill="#64748b" opacity="0.2"/>

  <!-- House lights turning on (Beams from top corners) -->
  <polygon points="0,0 35,55 0,90" fill="url(#light-beam)"/>
  <polygon points="240,0 205,55 240,90" fill="url(#light-beam)"/>

  <!-- Cinema Seat Rows (Foreground) -->
  <!-- Back row seats silhouette -->
  <path d="M30 160 Q30 145 45 145 L75 145 Q90 145 90 160 L90 190 L30 190 Z" fill="#1e293b"/>
  <path d="M95 160 Q95 145 110 145 L140 145 Q155 145 155 160 L155 190 L95 190 Z" fill="#1e293b"/>
  <path d="M160 160 Q160 145 175 145 L205 145 Q220 145 220 160 L220 190 L160 190 Z" fill="#1e293b"/>

  <!-- Front Row & Main Characters -->
  <!-- Seat structure base -->
  <rect x="20" y="165" width="200" height="55" fill="#0f172a"/>

  <!-- Character 1 (Left - Stretching/Yawning as movie ends) -->
  <!-- Body/Outfit -->
  <path d="M50 210 L50 175 Q50 165 65 165 L85 165 Q100 165 100 175 L100 210 Z" fill="#475569"/>
  <!-- Head & Hair -->
  <circle cx="75" cy="148" r="14" fill="#fcd34d"/>
  <path d="M61 145 C61 135 89 135 89 145 C89 148 85 145 75 140 C65 145 61 148 61 145 Z" fill="#b45309"/>
  <!-- Arm stretching up -->
  <path d="M63 165 L55 140 Q53 135 58 133 L62 135 L70 160" fill="#fcd34d"/>
  <!-- Face expression: Relaxed / Eyes closed / Yawning -->
  <path d="M70 151 Q75 148 80 151" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="75" cy="155" r="3" fill="#b45309"/> <!-- Open mouth -->

  <!-- Character 2 (Right - Gathering popcorn bucket, getting ready to leave) -->
  <!-- Body/Outfit -->
  <path d="M140 210 L145 175 Q145 165 157 165 L173 165 Q185 165 185 175 L190 210 Z" fill="#0284c7"/>
  <!-- Head & Hair -->
  <circle cx="165" cy="145" r="14" fill="#fcd34d"/>
  <path d="M151 142 C152 132 178 132 180 142 C175 138 156 138 151 142 Z" fill="#334155"/>
  <!-- Arm reaching for popcorn -->
  <path d="M175 165 L185 175 L175 185" fill="#fcd34d" stroke="#fcd34d" stroke-linejoin="round"/>
  <!-- Face expression: Content, smiling -->
  <path d="M160 148 Q163 146 166 148" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M163 153 Q165 156 167 153" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Popcorn Bucket Prop on armrest/lap -->
  <path d="M115 175 L121 205 L139 205 L145 175 Z" fill="#ef4444"/>
  <path d="M113 175 L147 175 L145 170 L115 170 Z" fill="#f8fafc"/>
  <!-- Popcorn puffs top -->
  <circle cx="123" cy="168" r="4" fill="#fef08a"/>
  <circle cx="130" cy="166" r="5" fill="#fef08a"/>
  <circle cx="137" cy="168" r="4" fill="#fef08a"/>
  <!-- Vertical stripes on bucket -->
  <path d="M122 175 L123 205" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <path d="M130 175 L130 205" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <path d="M138 175 L137 205" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- Cup with straw prop -->
  <rect x="100" y="180" width="11" height="25" rx="2" fill="#38bdf8" opacity="0.8"/>
  <path d="M102 180 L102 170 L97 165" stroke="#f8fafc" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Foreground Floor -->
  <rect x="0" y="210" width="240" height="30" fill="#090d16"/>
  
  <!-- Ambient lighting highlights on floor/edges -->
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2"/>
</svg>