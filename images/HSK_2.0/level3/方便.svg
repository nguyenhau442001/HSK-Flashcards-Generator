<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Character Outfit & Skin Gradients -->
    <linearGradient id="sweater-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Interior Background Elements (Desk, Shelf, Lamp) -->
  <!-- Ambient Wall Deco / Shelf -->
  <rect x="25" y="45" width="90" height="6" rx="3" fill="#334155" opacity="0.6"/>
  <circle cx="50" cy="35" r="10" fill="#f59e0b" opacity="0.2"/>
  <rect x="85" y="30" width="12" height="15" rx="2" fill="#38bdf8" opacity="0.4"/>
  <rect x="100" y="27" width="10" height="18" rx="2" fill="#ec4899" opacity="0.4"/>

  <!-- Desk Surface -->
  <rect x="0" y="170" width="240" height="70" fill="#0f172a"/>
  <path d="M0 170 L240 170" stroke="#334155" stroke-width="3"/>

  <!-- Warm Lamp Light Effect -->
  <circle cx="190" cy="90" r="70" fill="url(#lamp-glow)"/>
  <!-- Desk Lamp Fixture -->
  <path d="M190 40 L190 80" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M175 40 L205 40 L212 55 L168 55 Z" fill="#f59e0b"/>

  <!-- Coffee Mug -->
  <rect x="160" y="145" width="22" height="25" rx="4" fill="url(#mug-grad)"/>
  <path d="M182 150 C189 150, 189 162, 182 162" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Steam from mug -->
  <path d="M167 138 C165 133, 173 130, 171 125" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Plant in Pot -->
  <path d="M205 155 L215 155 L220 170 L200 170 Z" fill="#64748b"/>
  <circle cx="210" cy="148" r="12" fill="#10b981"/>
  <circle cx="201" cy="142" r="9" fill="#34d399"/>
  <circle cx="218" cy="140" r="10" fill="#059669"/>

  <!-- CHARACTER -->
  <!-- Body & Sweater -->
  <path d="M55 200 C55 175, 75 165, 95 165 C115 165, 135 175, 135 200 Z" fill="url(#sweater-grad)"/>
  <!-- Collar -->
  <path d="M78 165 C78 173, 112 173, 112 165 Z" fill="#fbcfe8"/>

  <!-- Neck & Head -->
  <rect x="88" y="142" width="18" height="25" rx="8" fill="#fbcfe8"/>
  <circle cx="97" cy="122" r="26" fill="#fbcfe8"/>

  <!-- Hair -->
  <path d="M71 120 C71 100, 85 92, 97 92 C115 92, 124 102, 124 122 C124 135, 120 140, 118 140 C116 140, 114 130, 110 125 C102 118, 92 118, 84 125 C78 130, 71 135, 71 120 Z" fill="#334155"/>

  <!-- Face Expression (Happy, approving, looking at the convenient software) -->
  <circle cx="89" cy="120" r="2" fill="#0f172a"/>
  <circle cx="105" cy="120" r="2" fill="#0f172a"/>
  <!-- Smile -->
  <path d="M93 130 C96 134, 100 134, 103 130" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <circle cx="86" cy="125" r="4" fill="#fda4af" opacity="0.6"/>
  <circle cx="108" cy="125" r="4" fill="#fda4af" opacity="0.6"/>

  <!-- Arms interacting -->
  <!-- Left arm holding phone/tablet base -->
  <path d="M60 180 C60 170, 75 160, 85 175" stroke="#be185d" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Right arm gesturing in satisfaction/ease -->
  <path d="M125 180 C135 170, 130 155, 115 155" stroke="#be185d" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="112" cy="155" r="6" fill="#fbcfe8"/>

  <!-- MAIN PROP: The Smart Device / Software Interface ("Convenient Software") -->
  <!-- Tablet/Phone floating at an angle -->
  <g transform="translate(68, 82) rotate(-8)">
    <!-- Device Shadow -->
    <rect x="4" y="4" width="76" height="96" rx="12" fill="#000000" opacity="0.3"/>
    <!-- Device Body -->
    <rect x="0" y="0" width="76" height="96" rx="12" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <!-- Screen -->
    <rect x="6" y="6" width="64" height="84" rx="8" fill="url(#screen-glow)"/>

    <!-- UI Elements inside the "convenient software" (Abstract clean shapes, NO text) -->
    <!-- App Header Bar -->
    <rect x="14" y="14" width="24" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="60" cy="17" r="4" fill="#10b981"/>

    <!-- Convenient Dashboard Cards (Representing smooth workflow) -->
    <!-- Card 1 -->
    <rect x="14" y="28" width="48" height="16" rx="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="22" cy="36" r="4" fill="#38bdf8"/>
    <rect x="30" y="33" width="24" height="3" rx="1.5" fill="#0f172a" opacity="0.6"/>
    <rect x="30" y="38" width="16" height="2.5" rx="1" fill="#64748b" opacity="0.4"/>

    <!-- Card 2 -->
    <rect x="14" y="48" width="48" height="16" rx="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="22" cy="56" r="4" fill="#f59e0b"/>
    <rect x="30" y="53" width="22" height="3" rx="1.5" fill="#0f172a" opacity="0.6"/>
    <rect x="30" y="58" width="14" height="2.5" rx="1" fill="#64748b" opacity="0.4"/>

    <!-- Floating Action Checkmark (Success / Efficiency) -->
    <circle cx="58" cy="74" r="10" fill="#10b981"/>
    <path d="M54 74 L57 77 L63 70" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Sparkles/Action indicators emphasizing "convenience/smoothness" -->
  <path d="M52 75 L55 82 L62 85 L55 88 L52 95 L49 88 L42 85 L49 82 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M148 70 L150 74 L154 76 L150 78 L148 82 L146 78 L142 76 L146 74 Z" fill="#38bdf8" opacity="0.9"/>
  <circle cx="138" cy="115" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="45" cy="135" r="2" fill="#38bdf8" opacity="0.7"/>
</svg>