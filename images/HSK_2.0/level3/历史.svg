<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="lampGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <radialGradient id="ambientLight" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#ambientLight)"/>

  <!-- Wallpaper / Bookshelf Background Elements -->
  <g opacity="0.4">
    <!-- Window with arched top showing night sky/stars -->
    <path d="M175 35 h30 v50 a15 15 0 0 1 -30 0 z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="185" cy="50" r="1" fill="#fbbf24"/>
    <circle cx="195" cy="45" r="1.5" fill="#fbbf24"/>
    <circle cx="198" cy="65" r="1" fill="#fbbf24"/>
    
    <!-- Bookshelf / Wall Trim -->
    <rect x="15" y="25" width="80" height="6" rx="3" fill="#475569"/>
    <!-- Books on shelf -->
    <rect x="22" y="10" width="8" height="15" rx="1" fill="#ec4899"/>
    <rect x="31" y="8" width="10" height="17" rx="1" fill="#3b82f6"/>
    <rect x="42" y="12" width="7" height="13" rx="1" fill="#10b981"/>
    <rect x="51" y="7" width="12" height="18" rx="1" fill="#f59e0b"/>
  </g>

  <!-- Desk Surface -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="url(#deskGrad)"/>
  <rect x="0" y="165" width="240" height="5" fill="#475569"/>

  <!-- Desk Lamp Light Cone -->
  <polygon points="195,55 150,170 230,170" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- Props: Globe (History/World context) -->
  <g transform="translate(20, 110)">
    <!-- Stand -->
    <path d="M22 45 L32 45 M27 30 L27 45 M17 55 C17 38 37 38 37 55" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Sphere -->
    <circle cx="27" cy="27" r="18" fill="#38bdf8" opacity="0.8"/>
    <!-- Continents stylized -->
    <path d="M18 20 Q22 15 28 22 T35 30 Q30 35 23 32 Z" fill="#0369a1" opacity="0.6"/>
    <path d="M16 28 Q20 25 22 32 Z" fill="#0369a1" opacity="0.6"/>
  </g>

  <!-- Historical Artifacts: Old Scroll and Vase/Pottery -->
  <g transform="translate(145, 135)">
    <!-- Pottery / Amphora (Ancient artifact) -->
    <path d="M 10 25 C 2 20 2 10 10 5 C 14 2 18 2 22 5 C 30 10 30 20 22 25 C 25 28 26 33 22 35 C 18 37 14 37 10 35 C 6 33 7 28 10 25 Z" fill="#d97706"/>
    <ellipse cx="16" cy="5" rx="3" ry="1" fill="#fbbf24"/>
    <path d="M10 15 Q16 18 22 15" fill="none" stroke="#92400e" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Open Ancient Scroll on Desk -->
  <g transform="translate(90, 145)">
    <!-- Scroll Base / Paper -->
    <path d="M 10 10 Q 35 2 60 10 L 65 25 Q 35 18 5 25 Z" fill="url(#scrollGrad)"/>
    <!-- Scroll Roll Ends (Left & Right) -->
    <ellipse cx="8" cy="17" rx="3" ry="8" fill="#b45309"/>
    <ellipse cx="62" cy="17" rx="3" ry="8" fill="#b45309"/>
    <!-- Fake hieroglyphics / historical marks -->
    <path d="M18 10 L22 12 M25 9 L28 13 M35 11 L40 10 M45 12 L48 10" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Open History Book with Illustrations -->
  <g transform="translate(60, 125)">
    <!-- Book Cover -->
    <path d="M 5 20 Q 35 10 65 20 L 65 50 Q 35 40 5 50 Z" fill="#991b1b"/>
    <!-- Pages -->
    <path d="M 8 22 Q 35 13 62 22 L 62 47 Q 35 38 8 47 Z" fill="#f8fafc"/>
    <!-- Center Binding Shadow -->
    <line x1="35" y1="16" x2="35" y2="43" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Tiny sketches on book pages -->
    <circle cx="20" cy="28" r="4" fill="#64748b" opacity="0.4"/>
    <path d="M 45 25 L 55 25 M 48 30 L 53 30" stroke="#64748b" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Main Character: Young Man Studying History -->
  <!-- Body & Chair -->
  <g transform="translate(65, 80)">
    <!-- Chair Back -->
    <rect x="5" y="10" width="20" height="50" rx="6" fill="#334155"/>
    
    <!-- Torso (Lean forward, engaged posture) -->
    <path d="M 15 35 Q 35 30 50 55 L 40 90 L 10 80 Z" fill="#3b82f6"/>
    <!-- Collar / Neck -->
    <path d="M 26 26 L 34 26 L 36 34 L 24 34 Z" fill="#e2e8f0"/>

    <!-- Head & Face (Happy, interested expression looking down at book) -->
    <g transform="translate(28, 5)">
      <!-- Hair -->
      <path d="M -5 12 C -5 -2 15 -2 20 12 C 22 18 18 22 15 20 C 10 12 5 15 -2 20 C -5 20 -5 15 -5 12 Z" fill="#1e293b"/>
      <!-- Face Base -->
      <circle cx="8" cy="15" r="11" fill="#fbcfe8"/>
      <!-- Ear -->
      <circle cx="-1" cy="15" r="2.5" fill="#f472b6"/>
      <!-- Eye (Happy squint / focused gaze) -->
      <path d="M 8 13 Q 11 11 14 14" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <!-- Eyebrow (Raised with interest) -->
      <path d="M 7 10 Q 11 8 15 11" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Smile (Enjoying learning) -->
      <path d="M 9 18 Q 12 21 15 18" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Cheek blush -->
      <circle cx="12" cy="17" r="2.5" fill="#fb7185" opacity="0.5"/>
    </g>

    <!-- Arms & Hands reaching towards the books -->
    <!-- Right arm (holding chin or resting) -->
    <path d="M 38 45 Q 50 55 45 70" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="45" cy="71" r="4" fill="#fbcfe8"/>

    <!-- Left arm reaching down -->
    <path d="M 20 40 Q 10 55 25 70" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <circle cx="26" cy="71" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Desk Lamp (Foreground / Top Right) -->
  <g transform="translate(195, 45)">
    <!-- Lamp Shade -->
    <path d="M -15 15 L 15 15 L 22 28 L -22 28 Z" fill="#f59e0b"/>
    <!-- Bulb Glow -->
    <ellipse cx="0" cy="28" rx="8" ry="4" fill="#fef08a"/>
    <!-- Stand Arm -->
    <path d="M 0 15 C 0 0 -15 -10 -25 -25" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <!-- Base -->
    <ellipse cx="-25" cy="-23" rx="6" ry="3" fill="#475569"/>
  </g>

  <!-- Sparkles / Interest Icons (Representing passion for discovery) -->
  <g transform="translate(115, 65)" fill="#fbbf24">
    <path d="M 0 6 C 2 6 6 2 6 0 C 6 -2 2 -6 0 -6 C -2 -6 -6 -2 -6 0 C -6 2 -2 6 0 6 Z" opacity="0.9"/>
  </g>
  <g transform="translate(55, 95)" fill="#38bdf8">
    <path d="M 0 4 C 1.5 4 4 1.5 4 0 C 4 -1.5 1.5 -4 0 -4 C -1.5 -4 -4 -1.5 -4 0 C -4 1.5 -1.5 4 0 4 Z" opacity="0.8"/>
  </g>
  <g transform="translate(145, 90)" fill="#f43f5e">
    <path d="M 0 5 C 2 5 5 2 5 0 C 5 -2 2 -5 0 -5 C -2 -5 -5 -2 -5 0 C -5 2 -2 5 0 5 Z" opacity="0.7"/>
  </g>

</svg>