<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Stack of boxes (The action of moving) -->
  <g transform="translate(60, 100)">
    <rect x="0" y="40" width="60" height="60" rx="4" fill="#fb923c"/>
    <rect x="5" y="45" width="50" height="50" rx="2" fill="#f59e0b"/>
    <path d="M0 40h60v10H0z" fill="#ea580c"/>
    
    <rect x="10" y="0" width="50" height="40" rx="4" fill="#38bdf8"/>
    <rect x="15" y="5" width="40" height="30" rx="2" fill="#0ea5e9"/>
    <path d="M10 0h50v8H10z" fill="#0284c7"/>
  </g>

  <!-- Character legs/motion -->
  <g transform="translate(140, 120)">
    <rect x="0" y="0" width="12" height="80" rx="6" fill="#ec4899"/>
    <rect x="25" y="20" width="12" height="60" rx="6" fill="#ec4899"/>
    <ellipse cx="6" cy="80" rx="8" ry="4" fill="#1e293b"/>
    <ellipse cx="31" cy="80" rx="8" ry="4" fill="#1e293b"/>
  </g>

  <!-- Decorative elements/Motion lines -->
  <path d="M180 60c10-10 20-10 30 0" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="215" cy="50" r="2" fill="#fbbf24"/>
  
  <rect x="190" y="190" width="30" height="30" rx="8" fill="#10b981" opacity="0.3"/>
  <circle cx="30" cy="40" r="10" fill="#38bdf8" opacity="0.2"/>
</svg>