<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Golden Spotlight Gradient for "Important" Object -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>

    <!-- Capsule Gradient (Health/Vitality Theme) -->
    <linearGradient id="capsuleLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="capsuleRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glowing Heart/Pulse Line Gradient -->
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Drop Shadows & Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Atmospheric background details (Medical Cross / Hexagons Subtle Pattern) -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="2" fill="none">
    <circle cx="40" cy="50" r="25"/>
    <circle cx="200" cy="70" r="35"/>
    <path d="M190,180 L210,180 M200,170 L200,190"/>
    <path d="M30,190 L50,190 M40,180 L40,200"/>
  </g>

  <!-- Ambient Light Spotlight behind the central "Important" health capsule -->
  <circle cx="120" cy="115" r="80" fill="url(#goldGlow)"/>
  
  <!-- Floating Sparkles / Importance Particles -->
  <g filter="url(#glow)">
    <path d="M 80,60 L 83,68 L 91,71 L 83,74 L 80,82 L 77,74 L 69,71 L 77,68 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M 165,50 L 167,55 L 172,57 L 167,59 L 165,64 L 163,59 L 158,57 L 163,55 Z" fill="#38bdf8" opacity="0.9"/>
    <path d="M 180,120 L 181,123 L 184,124 L 181,125 L 180,128 L 179,125 L 176,124 L 179,123 Z" fill="#fbbf24" opacity="0.7"/>
    <circle cx="60" cy="130" r="2" fill="#34d399" opacity="0.8"/>
  </g>

  <!-- ==================== CENTRAL IMPORTANT OBJECT (Health Capsule & Heartbeat) ==================== -->
  <g filter="url(#softShadow)" transform="translate(0, 5)">
    <!-- Pedestal / Glow Base -->
    <ellipse cx="120" cy="155" rx="35" ry="10" fill="#0f172a" opacity="0.8"/>
    <ellipse cx="120" cy="155" rx="28" ry="6" fill="#f59e0b" opacity="0.4" filter="url(#glow)"/>

    <!-- Giant Vitality Capsule (Representing 'Health is Important') -->
    <g transform="translate(120, 115) rotate(-25)">
      <!-- Capsule Shadow -->
      <rect x="-22" y="-42" width="44" height="84" rx="22" fill="#000000" opacity="0.3"/>
      <!-- Left half (Red - Vitality) -->
      <path d="M -20,-40 L 20,-40 L 20,0 L -20,0 Z" fill="url(#capsuleLeft)"/>
      <path d="M -20,-40 C -30,-40 -20,-20 -20,0 L 20,0 C 20,-20 30,-40 20,-40 Z" fill="#f87171"/>
      <rect x="-20" y="-40" width="40" height="40" rx="20" fill="url(#capsuleLeft)"/>
      <!-- Right half (Blue/Cyan - Energy) -->
      <path d="M -20,0 L 20,0 L 20,40 L -20,40 Z" fill="url(#capsuleRight)"/>
      <rect x="-20" y="0" width="40" height="40" rx="0" fill="url(#capsuleRight)"/>
      <path d="M -20,0 L 20,0 C 20,20 30,40 20,40 L -20,40 C -30,40 -20,20 -20,0 Z" fill="#0284c7"/>
      <!-- Capsule Highlight -->
      <path d="M -12,-35 C -15,-25 -15,-10 -12,0" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M -12,10 C -15,20 -15,30 -12,38" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
      
      <!-- Center Gold Ring / Seal of Importance -->
      <rect x="-22" y="-4" width="44" height="8" fill="#fbbf24"/>
      <rect x="-20" y="-3" width="40" height="6" fill="#f59e0b"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff" filter="url(#glow)"/>
    </g>

    <!-- EKG / Vital Pulse Line wrapping around -->
    <path d="M 40,145 L 75,145 L 85,125 L 95,165 L 105,135 L 115,155 L 125,145 L 160,145" 
          stroke="url(#pulseGlow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  </g>

  <!-- ==================== CHARACTER (Protective, Caring, Earnest Expression) ==================== -->
  <g id="character" filter="url(#softShadow)">
    <!-- Character Body / Torso (Modern teal/slate hoodie to contrast warm skin) -->
    <path d="M 65,220 C 65,190 85,175 120,175 C 155,175 175,190 175,220 Z" fill="#0ea5e9"/>
    <!-- Hoodie collar/hood folds -->
    <path d="M 90,175 L 105,200 L 120,185 L 135,200 L 150,175" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 105,200 L 100,220 M 135,200 L 140,220" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M 105,160 L 105,180 C 105,185 135,185 135,180 L 135,160 Z" fill="url(#skin)"/>

    <!-- Head Group -->
    <g transform="translate(120, 130)">
      <!-- Ears -->
      <circle cx="-32" cy="0" r="8" fill="url(#skin)"/>
      <circle cx="-32" cy="0" r="4" fill="#e08a47" opacity="0.3"/>
      <circle cx="32" cy="0" r="8" fill="url(#skin)"/>
      <circle cx="32" cy="0" r="4" fill="#e08a47" opacity="0.3"/>

      <!-- Face Base -->
      <rect x="-30" y="-35" width="60" height="65" rx="30" fill="url(#skin)"/>

      <!-- Hair Back / Base -->
      <path d="M -30,-15 C -35,-35 -15,-42 0,-42 C 15,-42 35,-35 30,-15 Z" fill="#1e293b"/>
      <!-- Stylish Modern Hair Spikes -->
      <path d="M -32,-20 C -25,-45 -5,-48 5,-42 C 20,-48 35,-35 33,-18 C 30,-25 20,-32 5,-30 C -10,-32 -25,-25 -32,-20 Z" fill="#0f172a"/>
      <path d="M -15,-38 C -5,-46 10,-44 20,-36 C 10,-40 -5,-40 -15,-38 Z" fill="#334155"/>

      <!-- Eyebrows (Earnest, Caring angle - inner edges raised slightly) -->
      <path d="M -20,-14 C -15,-18 -8,-16 -4,-13" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 4,-13 C 8,-16 15,-18 20,-14" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- Expressive Eyes (Wide, attentive, glistening) -->
      <g>
        <!-- Left Eye -->
        <circle cx="-12" cy="-5" r="6.5" fill="#0f172a"/>
        <circle cx="-10" cy="-7" r="2.5" fill="#ffffff"/>
        <circle cx="-13.5" cy="-3.5" r="1" fill="#ffffff"/>
        <!-- Right Eye -->
        <circle cx="12" cy="-5" r="6.5" fill="#0f172a"/>
        <circle cx="14" cy="-7" r="2.5" fill="#ffffff"/>
        <circle cx="10.5" cy="-3.5" r="1" fill="#ffffff"/>
      </g>

      <!-- Warm Cheeks (Emphasizing health/vitality and friendliness) -->
      <ellipse cx="-18" cy="4" rx="5" ry="3" fill="#f43f5e" opacity="0.35"/>
      <ellipse cx="18" cy="4" rx="5" ry="3" fill="#f43f5e" opacity="0.35"/>

      <!-- Nose -->
      <path d="M 0,1 C -2,5 2,5 0,1 Z" fill="#e08a47"/>

      <!-- Mouth (Open, earnest, speaking/teaching expression emphasizing importance) -->
      <path d="M -6,12 C -6,19 6,19 6,12 Z" fill="#9f1239"/>
      <path d="M -5,12 C -5,17 5,17 5,12 Z" fill="#f43f5e"/>
      <!-- Teeth highlight -->
      <path d="M -4,12 L 4,12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Chin highlight -->
      <path d="M -8,23 C -3,27 3,27 8,23" stroke="#e08a47" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Hands Cupping / Emphasizing the Central Object -->
    <!-- Left Hand -->
    <g transform="translate(75, 135)">
      <path d="M 10,0 C -5,5 -15,15 -10,25 C -5,35 10,30 20,20 C 15,10 12,5 10,0 Z" fill="url(#skin)" filter="url(#softShadow)"/>
      <!-- Fingers wrapped slightly -->
      <path d="M -10,25 C -2,28 10,25 20,20" stroke="#e08a47" stroke-width="2" fill="none"/>
    </g>

    <!-- Right Hand -->
    <g transform="translate(165, 135) scale(-1, 1)">
      <path d="M 10,0 C -5,5 -15,15 -10,25 C -5,35 10,30 20,20 C 15,10 12,5 10,0 Z" fill="url(#skin)" filter="url(#softShadow)"/>
      <path d="M -10,25 C -2,28 10,25 20,20" stroke="#e08a47" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Glow & Framing Border -->
  <rect x="0" y="0" width="240" height="240" rx="24" stroke="#334155" stroke-width="2" fill="none" opacity="0.5"/>
</svg>