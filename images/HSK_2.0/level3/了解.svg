<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Desk and Interior Gradients -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="lamp-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="globe-ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Clip Path for Globe -->
    <clipPath id="globe-clip">
      <circle cx="120" cy="125" r="32" />
    </clipPath>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Environment / Window showing travel inspiration -->
  <g opacity="0.6">
    <!-- Window Frame -->
    <rect x="156" y="25" width="56" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Window Sky -->
    <path d="M158 27 h52 v66 h-52 z" fill="#1e3a8a"/>
    <!-- Distant Mountain/Landmark silhouette through window -->
    <path d="M158 75 L175 50 L190 65 L202 45 L210 75 Z" fill="#3b82f6" opacity="0.4"/>
    <circle cx="198" cy="40" r="6" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Bookshelf Background -->
  <g fill="#334155" opacity="0.4">
    <rect x="25" y="30" width="55" height="6" rx="2"/>
    <rect x="30" y="15" width="45" height="15" rx="2"/>
    <rect x="35" y="45" width="10" height="25" rx="1"/>
    <rect x="47" y="42" width="12" height="28" rx="1" fill="#f59e0b"/>
    <rect x="61" y="48" width="8" height="22" rx="1"/>
  </g>

  <!-- Ambient Lamp Light Cone -->
  <polygon points="45,15 5,160 85,160" fill="url(#lamp-glow)" />

  <!-- Desk Surface -->
  <rect x="15" y="155" width="210" height="12" fill="url(#desk-grad)" rx="3"/>
  <rect x="10" y="167" width="220" height="5" fill="#0f172a" rx="2"/>

  <!-- Desk Props: Stack of books & Notebook -->
  <g transform="translate(165, 135)">
    <rect x="0" y="10" width="35" height="10" rx="2" fill="#ef4444"/>
    <rect x="-3" y="5" width="38" height="7" rx="2" fill="#3b82f6"/>
    <rect x="2" y="0" width="32" height="7" rx="2" fill="#10b981"/>
    <!-- Pen -->
    <line x1="-12" y1="18" x2="5" y2="18" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Central Focus: The Globe (Representing "Country / Exploring") -->
  <g transform="translate(0, 5)">
    <!-- Stand -->
    <path d="M120 160 L120 148" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M104 157 C104 135 136 135 136 157" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Globe Sphere -->
    <circle cx="120" cy="125" r="32" fill="url(#globe-ocean)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Continents on Globe (Cliped) -->
    <g clip-path="url(#globe-clip)">
      <!-- Landmass stylized -->
      <path d="M100 110 Q110 100 125 110 T140 130 Q135 145 115 140 T100 110 Z" fill="#22c55e" opacity="0.85"/>
      <path d="M125 105 Q135 95 145 110 T130 125 Z" fill="#22c55e" opacity="0.85"/>
      <!-- Latitude/Longitude grid highlight -->
      <ellipse cx="120" cy="125" rx="32" ry="12" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.4"/>
      <line x1="120" y1="93" x2="120" y2="157" stroke="#bae6fd" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- Magnifying Glass hovering over the globe (Action of "Investigating / Learning about") -->
    <g transform="translate(125, 110) rotate(-15)">
      <!-- Glass Rim -->
      <circle cx="0" cy="0" r="16" fill="#f8fafc" fill-opacity="0.2" stroke="#f59e0b" stroke-width="3.5"/>
      <!-- Lens reflection -->
      <path d="M-9 -6 A 11 11 0 0 1 6 -9" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
      <!-- Handle -->
      <rect x="-3" y="15" width="6" height="20" rx="3" fill="#d97706" transform="rotate(25 0 15)"/>
    </g>
  </g>

  <!-- Character: Curious Learner / Explorer -->
  <g transform="translate(0, 5)">
    <!-- Body / Torso (leaning forward attentively) -->
    <path d="M75 160 C75 135 85 125 98 120 L90 160 Z" fill="#6366f1"/>
    <path d="M70 160 C70 138 82 126 95 120 L80 160 Z" fill="#4f46e5"/> <!-- Jacket/Shirt collar -->

    <!-- Neck -->
    <path d="M85 118 C85 114 91 114 93 118" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="89" cy="98" r="18" fill="#fbcfe8"/>

    <!-- Hair (Stylish modern look) -->
    <path d="M72 98 C72 82 95 80 106 95 C107 92 105 87 100 85 C90 80 75 85 72 98 Z" fill="#1e293b"/>
    <path d="M73 97 C76 89 85 86 93 87 C84 89 77 92 73 97 Z" fill="#334155"/>

    <!-- Facial Expression: Focused, bright eyes, slight smile -->
    <!-- Eye (w/ pupil looking down-right towards globe) -->
    <circle cx="95" cy="96" r="2.5" fill="#0f172a"/>
    <!-- Eyebrow raised in discovery/curiosity -->
    <path d="M92 90 Q96 88 100 91" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Gentle happy smile -->
    <path d="M96 104 Q99 107 102 103" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Rosy cheek -->
    <circle cx="100" cy="102" r="3.5" fill="#fda4af" opacity="0.6"/>

    <!-- Active Hands reaching towards globe -->
    <!-- Left Arm / Hand supporting/pointing -->
    <path d="M85 135 C95 135 102 130 108 125" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
    <circle cx="109" cy="124" r="3.5" fill="#fbcfe8"/>
  </g>

  <!-- Desk Lamp on Left -->
  <g transform="translate(30, 95)">
    <!-- Lamp Base -->
    <ellipse cx="15" cy="65" rx="12" ry="4" fill="#64748b"/>
    <!-- Lamp Stand/Arm -->
    <path d="M15 65 L15 35 L30 20" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lamp Shade -->
    <path d="M20 12 L40 22 L32 30 L15 22 Z" fill="#f59e0b"/>
    <ellipse cx="23" cy="26" rx="6" ry="3" fill="#fef08a"/>
  </g>

  <!-- Decorative Sparkles representing "Insight / Understanding" -->
  <g fill="#f59e0b">
    <path d="M135 75 Q135 83 143 83 Q135 83 135 91 Q135 83 127 83 Q135 83 135 75 Z" opacity="0.9"/>
    <path d="M75 55 Q75 60 80 60 Q75 60 75 65 Q75 60 70 60 Q75 60 75 55 Z" opacity="0.7" transform="scale(0.8) translate(20, 10)"/>
    <path d="M165 95 Q165 99 169 99 Q165 99 165 103 Q165 99 161 99 Q165 99 165 95 Z" opacity="0.8"/>
  </g>

</svg>