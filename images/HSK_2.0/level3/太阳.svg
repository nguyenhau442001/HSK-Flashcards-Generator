<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Sun Disc Gradient -->
    <linearGradient id="sunDisc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Mountain Gradient Back -->
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Mountain Gradient Front -->
    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (Hills/Mountains & Plants for real-world context) -->
  <g>
    <!-- Distant Mountain Range -->
    <path d="M-10 190 Q 60 130 130 160 T 250 140 L 250 240 L -10 240 Z" fill="url(#mountainBack)" />
    
    <!-- Closer Mountain Range -->
    <path d="M0 210 Q 90 150 170 190 T 240 175 L 240 240 L 0 240 Z" fill="url(#mountainFront)" />

    <!-- Foreground Hills & Rooftop/Balcony context -->
    <path d="M-10 225 Q 70 200 150 215 T 250 210 L 250 240 L -10 240 Z" fill="#090d16" />
    
    <!-- Potted Plant on Balcony/Windowsill (Context Prop) -->
    <g transform="translate(195, 195)">
      <!-- Pot -->
      <path d="M-10 15 L 10 15 L 7 35 L -7 35 Z" fill="#f97316" />
      <ellipse cx="0" cy="15" rx="10" ry="3" fill="#fb923c" />
      <!-- Plant Stems & Leaves -->
      <path d="M0 15 Q -5 0 -15 -5" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <path d="M0 15 Q 8 -5 18 -2" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <path d="M0 15 Q 0 -10 2 -20" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <circle cx="-15" cy="-5" r="5" fill="#34d399" />
      <circle cx="18" cy="-2" r="6" fill="#34d399" />
      <circle cx="2" cy="-20" r="5" fill="#34d399" />
    </g>

    <!-- Additional Small Foliage Silhouette on Left -->
    <path d="M 15 240 C 15 220, 25 210, 30 200 C 25 215, 10 220, 0 230 Z" fill="#0f172a" />
    <path d="M 25 240 C 25 215, 45 205, 55 190 C 45 210, 30 220, 15 240 Z" fill="#090d16" />
  </g>

  <!-- MÀT TRỜI (SUN) - Central Action-Packed Scene Subject -->
  <g transform="translate(120, 105)">
    <!-- Huge Ambient Glow Layer -->
    <circle cx="0" cy="0" r="85" fill="url(#sunGlow)" filter="url(#softGlow)" />

    <!-- Energetic Rotating/Alternating Sun Rays (Action-packed) -->
    <g opacity="0.9">
      <!-- Ray 1 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(0)" />
      <!-- Ray 2 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(30)" />
      <!-- Ray 3 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(60)" />
      <!-- Ray 4 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(90)" />
      <!-- Ray 5 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(120)" />
      <!-- Ray 6 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(150)" />
      <!-- Ray 7 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(180)" />
      <!-- Ray 8 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(210)" />
      <!-- Ray 9 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(240)" />
      <!-- Ray 10 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(270)" />
      <!-- Ray 11 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(300)" />
      <!-- Ray 12 -->
      <polygon points="0,-68 4,-48 -4,-48" fill="#fbbf24" transform="rotate(330)" />
    </g>

    <!-- Main Sun Disc (Vibrant and Friendly 2D Vector style) -->
    <circle cx="0" cy="0" r="42" fill="url(#sunDisc)" stroke="#f59e0b" stroke-width="3" />

    <!-- Friendly, Expressive Face for HSK App Engagement -->
    <g>
      <!-- Blushing Cheeks -->
      <ellipse cx="-16" cy="4" rx="5" ry="3" fill="#fb7185" opacity="0.6" />
      <ellipse cx="16" cy="4" rx="5" ry="3" fill="#fb7185" opacity="0.6" />

      <!-- Sparkling Happy Eyes -->
      <circle cx="-13" cy="-4" r="3.5" fill="#1e293b" />
      <circle cx="13" cy="-4" r="3.5" fill="#1e293b" />
      <!-- Eye Sparkles -->
      <circle cx="-14.5" cy="-5.5" r="1.2" fill="#ffffff" />
      <circle cx="11.5" cy="-5.5" r="1.2" fill="#ffffff" />

      <!-- Cute Cheerful Open Smile -->
      <path d="M -10 6 Q 0 16 10 6" fill="#1e293b" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <!-- Tongue detail -->
      <path d="M -4 10 Q 0 13 4 10 Z" fill="#fb7185" />
    </g>

    <!-- Floating Heat/Energy Sparkles (Action-packed touches) -->
    <g>
      <!-- Sparkle Top Left -->
      <path d="M -55 -45 L -52 -52 L -45 -55 L -52 -58 L -55 -65 L -58 -58 L -65 -55 L -58 -52 Z" fill="#38bdf8" opacity="0.8" transform="scale(0.5) translate(-70, -40)" />
      <!-- Sparkle Top Right -->
      <path d="M 55 -45 L 58 -52 L 65 -55 L 58 -58 L 55 -65 L 52 -58 L 45 -55 L 52 -52 Z" fill="#f43f5e" opacity="0.8" transform="scale(0.6) translate(80, -30)" />
      <!-- Sparkle Right -->
      <path d="M 65 15 L 67 10 L 72 8 L 67 6 L 65 1 L 63 6 L 58 8 L 63 10 Z" fill="#fbbf24" opacity="0.9" transform="scale(0.7) translate(30, 20)" />
    </g>
  </g>

  <!-- Foreground Atmospheric Elements (Clouds gracefully passing) -->
  <g>
    <!-- Left Fluffy Cloud -->
    <path d="M 25 90 
             Q 20 80 35 75 
             Q 45 60 65 65 
             Q 85 62 90 78 
             Q 105 80 100 95 
             Q 95 105 25 105 Z" 
          fill="#334155" opacity="0.5" />
          
    <!-- Right Sleek Cloud -->
    <path d="M 160 145 
             Q 155 135 170 132 
             Q 180 120 195 124 
             Q 210 122 215 135 
             Q 225 137 220 148 
             Q 215 155 160 155 Z" 
          fill="#334155" opacity="0.4" />
  </g>

  <!-- Border Frame / Accent Overlay for polished app vector look -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
</svg>