<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Warm Glow for Teacher (Satisfaction) -->
    <radialGradient id="glow-teacher" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Classroom Interior Details -->
  <!-- Window & Outdoor Moonlight/Atmosphere -->
  <path d="M170 30 H210 V110 H170 Z" fill="#090d16" stroke="#334155" stroke-width="2" />
  <path d="M170 30 L210 110 M210 30 L170 110" stroke="#334155" stroke-width="1" />
  <polygon points="170,30 210,110 210,140 170,140" fill="url(#window-light)" />

  <!-- Bookshelf Background -->
  <rect x="20" y="40" width="60" height="110" fill="#0f172a" rx="2" />
  <line x1="20" y1="70" x2="80" y2="70" stroke="#334155" stroke-width="2" />
  <line x1="20" y1="100" x2="80" y2="100" stroke="#334155" stroke-width="2" />
  <line x1="20" y1="130" x2="80" y2="130" stroke="#334155" stroke-width="2" />
  <!-- Books on shelf -->
  <rect x="25" y="52" width="8" height="18" fill="#38bdf8" rx="1" />
  <rect x="35" y="48" width="12" height="22" fill="#ec4899" rx="1" />
  <rect x="50" y="55" width="6" height="15" fill="#f59e0b" rx="1" />
  <rect x="26" y="80" width="10" height="20" fill="#10b981" rx="1" />
  <rect x="38" y="82" width="14" height="18" fill="#fb923c" rx="1" />

  <!-- Blackboard on wall -->
  <rect x="90" y="25" width="70" height="50" rx="2" fill="#064e3b" stroke="#047857" stroke-width="2" />
  <!-- Abstract geometric shapes / formulas on board -->
  <path d="M100 45 Q 110 35, 120 45 T 140 45" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="125" cy="55" r="4" fill="none" stroke="#fef08a" stroke-width="1.5" />
  <line x1="135" y1="52" x2="145" y2="60" stroke="#fef08a" stroke-width="1.5" />

  <!-- Ambient Satisfaction Glow behind Teacher -->
  <circle cx="170" cy="135" r="50" fill="url(#glow-teacher)" />

  <!-- Classroom Desk -->
  <path d="M40 170 H200 L190 210 H50 Z" fill="url(#desk-grad)" />
  <path d="M35 165 H205 V172 H35 Z" fill="#475569" rx="1" />

  <!-- Student Character (Left side, presenting/answering) -->
  <g transform="translate(65, 115)">
    <!-- Body / Torso -->
    <path d="M15 55 C15 40, 25 35, 35 35 C45 35, 55 40, 55 55 L55 85 L15 85 Z" fill="#38bdf8" />
    <!-- Collar / Tie -->
    <polygon points="35,35 30,45 40,45" fill="#f8fafc" />
    <polygon points="35,45 33,60 37,60" fill="#0284c7" />

    <!-- Head & Hair -->
    <circle cx="35" cy="20" r="14" fill="#fcd34d" />
    <path d="M21 20 C21 10, 30 6, 38 8 C46 10, 49 16, 49 20 C45 16, 25 16, 21 20 Z" fill="#1e293b" />
    <!-- Face expression: hopeful / earnest -->
    <circle cx="30" cy="19" r="1.5" fill="#1e293b" />
    <circle cx="40" cy="19" r="1.5" fill="#1e293b" />
    <path d="M33 25 Q35 27, 37 25" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Raised arm pointing to answer / speaking gesture -->
    <path d="M15 45 C5 40, -5 25, 0 20 C5 15, 15 30, 22 42" fill="#fcd34d" />
    <!-- Notebook on desk in front of student -->
    <path d="M-10 65 L25 55 L35 70 L0 80 Z" fill="#f8fafc" />
    <line x1="-2" y1="65" x2="15" y2="60" stroke="#cbd5e1" stroke-width="1" />
    <line x1="0" y1="70" x2="18" y2="65" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- Teacher Character (Right side, expressing satisfaction: nodding, smiling, warm posture) -->
  <g transform="translate(135, 100)">
    <!-- Glow / Aura of approval -->
    <circle cx="35" cy="35" r="35" fill="#f59e0b" opacity="0.15" />

    <!-- Body / Torso (Professional blazer) -->
    <path d="M10 70 C10 50, 20 45, 35 45 C50 45, 60 50, 60 70 L65 110 L5 110 Z" fill="#1e293b" />
    <path d="M20 45 L35 65 L50 45 Z" fill="#f8fafc" />
    <polygon points="32,55 38,55 35,75" fill="#ef4444" />

    <!-- Head & Hair (Wise / Friendly Teacher) -->
    <circle cx="35" cy="25" r="15" fill="#fcd34d" />
    <!-- Glasses -->
    <circle cx="28" cy="23" r="5" fill="none" stroke="#475569" stroke-width="1.5" />
    <circle cx="42" cy="23" r="5" fill="none" stroke="#475569" stroke-width="1.5" />
    <line x1="33" y1="23" x2="37" y2="23" stroke="#475569" stroke-width="1.5" />
    
    <!-- Hair Style -->
    <path d="M20 22 C20 12, 28 8, 36 8 C44 8, 50 14, 50 22 C48 18, 22 18, 20 22 Z" fill="#475569" />

    <!-- Satisfied Smile & Expression -->
    <path d="M30 31 Q35 36, 40 31" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
    <!-- Gentle happy eye curves -->
    <path d="M25 21 Q28 19, 31 21" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M39 21 Q42 19, 45 21" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arms crossed / approving gesture (Hand on chin or approving thumbs up) -->
    <!-- Arm holding chin thoughtfully with satisfaction -->
    <path d="M15 60 C5 60, 0 45, 15 40 C22 38, 28 45, 32 42" fill="#fcd34d" stroke="#d97706" stroke-width="1" />
    <circle cx="33" cy="38" r="4" fill="#fcd34d" />
  </g>

  <!-- Props on Teacher's Desk (Right side) -->
  <!-- Red grading pen / marker -->
  <path d="M165 155 L175 145 L178 148 L168 158 Z" fill="#ef4444" />
  <path d="M175 145 L177 143 L180 146 L178 148 Z" fill="#fcd34d" />

  <!-- Open Textbook / Answer sheet with correct checkmark -->
  <path d="M110 150 L145 140 L155 165 L120 175 Z" fill="#f8fafc" />
  <line x1="120" y1="155" x2="135" y2="150" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="123" y1="162" x2="138" y2="157" stroke="#94a3b8" stroke-width="1.5" />
  <!-- Big Green Checkmark symbolizing 'Satisfactory Answer' -->
  <path d="M130 160 L137 167 L150 150" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sparkles / Indicators of Positive Validation (Satisfaction) -->
  <g transform="translate(140, 65)">
    <path d="M0 10 L5 5 L10 10 L5 15 Z" fill="#fbbf24" />
    <circle cx="15" cy="-5" r="2" fill="#38bdf8" />
    <circle cx="-10" cy="2" r="1.5" fill="#10b981" />
  </g>
  <g transform="translate(195, 95)">
    <path d="M0 0 L3 -3 L6 0 L3 3 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(115, 80)">
    <circle cx="0" cy="0" r="2.5" fill="#f43f5e" />
  </g>
</svg>