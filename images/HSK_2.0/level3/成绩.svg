<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background glow for high achievement -->
  <circle cx="120" cy="110" r="70" fill="#f59e0b" opacity="0.1" filter="url(#glow)" />

  <!-- Room Interior / Environment -->
  <!-- Window / Bookshelf background element -->
  <rect x="35" y="45" width="50" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="60" y1="45" x2="60" y2="110" stroke="#334155" stroke-width="2" />
  
  <!-- Desk surface -->
  <path d="M 15 175 L 225 175 L 210 215 L 30 215 Z" fill="url(#deskGrad)" />
  <rect x="20" y="170" width="200" height="8" rx="3" fill="#475569" />

  <!-- Background Props: Study Lamp -->
  <path d="M 190 170 L 195 120 L 205 120 L 210 170 Z" fill="#475569" />
  <path d="M 180 115 C 180 100, 220 100, 220 115 Z" fill="#fbbf24" />
  <path d="M 185 115 L 215 115 L 205 130 L 195 130 Z" fill="#f59e0b" />
  <ellipse cx="200" cy="115" rx="15" ry="3" fill="#fef08a" opacity="0.8" />

  <!-- Main Character (Young student, happy male) -->
  <!-- Chair Back -->
  <rect x="75" y="115" width="22" height="65" rx="8" fill="#334155" />

  <!-- Character Torso & Arms -->
  <!-- Hoodie / Shirt (Teal/Cyan accent) -->
  <path d="M 85 145 Q 120 135 155 145 L 165 190 Q 120 200 75 190 Z" fill="#0ea5e9" />
  <!-- Sleeves & Hands holding exam paper -->
  <path d="M 85 145 L 75 170 L 95 175 Z" fill="#0284c7" />
  <path d="M 155 145 L 165 170 L 145 175 Z" fill="#0284c7" />
  <!-- Hands -->
  <circle cx="95" cy="175" r="7" fill="#fed7aa" />
  <circle cx="145" cy="175" r="7" fill="#fed7aa" />

  <!-- Neck & Head -->
  <rect x="112" y="125" width="16" height="22" rx="6" fill="#fed7aa" />
  <!-- Head shape -->
  <circle cx="120" cy="110" r="24" fill="#fed7aa" />
  
  <!-- Hair (Styled dark hair) -->
  <path d="M 96 110 C 96 90, 144 90, 144 110 C 144 115, 142 120, 138 120 C 132 110, 108 110, 102 120 C 98 120, 96 115, 96 110 Z" fill="#1e293b" />
  <path d="M 110 94 C 115 90, 125 90, 132 94 C 125 92, 115 92, 110 94 Z" fill="#334155" />

  <!-- Happy Facial Expression -->
  <!-- Closed happy eyes ^ ^ -->
  <path d="M 108 108 Q 112 104 116 108" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 124 108 Q 128 104 132 108" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Smiling open mouth -->
  <path d="M 114 116 Q 120 124 126 116" fill="#ef4444" />
  <path d="M 115 116 Q 120 121 125 116" fill="#ffffff" />
  <!-- Rosy cheeks -->
  <circle cx="106" cy="114" r="4" fill="#fca5a5" opacity="0.6" />
  <circle cx="134" cy="114" r="4" fill="#fca5a5" opacity="0.6" />

  <!-- Foreground Props: The Exam Paper / Test Result ("成绩") -->
  <g transform="translate(100, 150) rotate(-8)">
    <!-- Paper background -->
    <rect x="0" y="0" width="40" height="50" rx="3" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Mock checkmarks and red high grade mark (A+ style visual representation) -->
    <line x1="8" y1="10" x2="16" y2="18" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="16" y1="18" x2="30" y2="6" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="26" x2="32" y2="26" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="8" y1="34" x2="26" y2="34" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Big shiny Star / Grade Indicator -->
    <path d="M 28 35 L 30 40 L 35 40 L 31 43 L 33 48 L 28 45 L 23 48 L 25 43 L 21 40 L 26 40 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.5" />
  </g>

  <!-- Additional Foreground Desk Items -->
  <!-- Pencil Holder / Pen -->
  <rect x="50" y="160" width="14" height="22" rx="3" fill="#cbd5e1" />
  <line x1="57" y1="150" x2="55" y2="165" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
  <line x1="53" y1="153" x2="52" y2="165" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />

  <!-- Sparkles / Success indicators -->
  <path d="M 70 85 L 72 90 L 77 92 L 72 94 L 70 99 L 68 94 L 63 92 L 68 90 Z" fill="#fbbf24" />
  <path d="M 160 70 L 161.5 73.5 L 165 75 L 161.5 76.5 L 160 80 L 158.5 76.5 L 155 75 L 158.5 73.5 Z" fill="#38bdf8" />
  <circle cx="150" cy="95" r="2.5" fill="#f43f5e" />
  <circle cx="85" cy="135" r="2" fill="#10b981" />

</svg>