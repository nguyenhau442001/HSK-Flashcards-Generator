<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Object Gradients -->
    <linearGradient id="magnifierGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light Effects -->
  <circle cx="120" cy="110" r="90" fill="url(#amberGlow)"/>
  <circle cx="180" cy="60" r="60" fill="url(#blueGlow)"/>

  <!-- Background Environment: Investigation Board / Desk Surface -->
  <g opacity="0.6">
    <!-- Desk Surface Grid / Lines -->
    <line x1="20" y1="200" x2="220" y2="200" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="215" x2="200" y2="215" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Secondary context props (blur/depth) -->
    <rect x="35" y="140" width="45" height="55" rx="4" fill="#334155" transform="rotate(-12 35 140)"/>
    <rect x="160" y="150" width="50" height="40" rx="4" fill="#334155" transform="rotate(15 160 150)"/>
    <circle cx="190" cy="130" r="8" fill="#10b981" opacity="0.6"/>
  </g>

  <!-- Main Document / Evidence Sheet (The Core Context) -->
  <g filter="url(#shadow)">
    <!-- Paper base -->
    <path d="M 65 50 
             L 175 50 
             C 179 50, 182 53, 182 57 
             L 182 183 
             C 182 187, 179 190, 175 190 
             L 65 190 
             C 61 190, 58 187, 58 183 
             L 58 57 
             C 58 53, 61 50, 65 50 Z" 
          fill="#f8fafc"/>
          
    <!-- Paper Header Accent -->
    <rect x="75" y="65" width="60" height="8" rx="2" fill="#cbd5e1"/>
    
    <!-- Abstract document lines & charts representing data analysis -->
    <line x1="75" y1="85" x2="165" y2="85" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="75" y1="100" x2="145" y2="100" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Mini Bar Chart inside document -->
    <rect x="75" y="125" width="12" height="35" rx="2" fill="#cbd5e1"/>
    <rect x="95" y="110" width="12" height="50" rx="2" fill="#cbd5e1"/>
    <rect x="115" y="140" width="12" height="20" rx="2" fill="#cbd5e1"/>
    <!-- The "Primary" Highlighting Bar (Amber/Gold) -->
    <rect x="135" y="90" width="14" height="70" rx="2" fill="#f59e0b" filter="url(#glow)"/>
  </g>

  <!-- Central Action Element: Premium Magnifying Glass (Focusing on the main element) -->
  <g filter="url(#shadow)" transform="translate(10, 5)">
    
    <!-- Magnifier Handle -->
    <path d="M 125 125 
             L 165 165 
             C 171 171, 171 180, 165 186 
             C 159 192, 150 192, 144 186 
             L 104 146 Z" 
          fill="url(#darkMetal)"/>
          
    <!-- Handle Grip Ridges -->
    <line x1="128" y1="148" x2="142" y2="162" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="134" y1="154" x2="148" y2="168" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="160" x2="154" y2="174" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

    <!-- Handle Connector Ring -->
    <rect x="115" y="115" width="18" height="14" rx="3" fill="url(#goldMetal)" transform="rotate(45 124 122)"/>

    <!-- Outer Golden Rim -->
    <circle cx="105" cy="105" r="48" fill="url(#goldMetal)"/>
    
    <!-- Inner Lens Rim -->
    <circle cx="105" cy="105" r="41" fill="#0f172a"/>

    <!-- Glass Lens Surface -->
    <circle cx="105" cy="105" r="38" fill="url(#magnifierGlass)"/>
    
    <!-- Magnified focal point inside the lens (The core subject/star symbol representing "Primary") -->
    <g transform="translate(105, 105) scale(1.1)">
      <!-- Glowing Target Star / Core Icon -->
      <path d="M 0 -16 
               C 3 -6,  6 -3,  16 0 
               C 6 3,   3 6,   0 16 
               C -3 6,  -6 3,  -16 0 
               C -6 -3, -3 -6, 0 -16 Z" 
            fill="#fbbf24" 
            filter="url(#glow)"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>

    <!-- Glass Reflection / Specular Highlight -->
    <path d="M 77 82 
             C 85 70, 98 68, 110 70
             C 98 73, 85 80, 77 95 Z" 
          fill="#ffffff" 
          opacity="0.5"/>
  </g>

  <!-- Dynamic Accent Sparks / Particles for Visual Engagement -->
  <g>
    <circle cx="45" cy="85" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="195" cy="95" r="4" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="60" cy="165" r="2.5" fill="#10b981" filter="url(#glow)"/>
    
    <!-- Floating star sparkle -->
    <path d="M 190 45 L 192 52 L 199 54 L 192 56 L 190 63 L 188 56 L 181 54 L 188 52 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M 55 40 L 56 44 L 60 45 L 56 46 L 55 50 L 54 46 L 50 45 L 54 44 Z" fill="#38bdf8" opacity="0.8"/>
  </g>
</svg>