<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Cat Fur Gradient (Orange/Ginger Tabby) -->
    <linearGradient id="catBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Cushion Gradient -->
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Room Details -->
  <!-- Wallpaper subtle stripe & floor -->
  <rect x="0" y="0" width="240" height="170" fill="#1e293b" />
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#0f172a" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="3" />

  <!-- Cozy Wall Shelf with Plant -->
  <rect x="25" y="60" width="80" height="6" rx="3" fill="#475569" />
  <!-- Mini Pot -->
  <path d="M 45 60 L 50 45 L 60 45 L 65 60 Z" fill="#f43f5e" />
  <!-- Plant Leaves -->
  <path d="M 55 45 Q 45 35 38 40 Q 45 45 55 45 Z" fill="#10b981" />
  <path d="M 55 45 Q 65 30 72 35 Q 65 42 55 45 Z" fill="#34d399" />
  <path d="M 55 45 Q 55 25 55 25 Q 55 35 55 45 Z" fill="#10b981" />

  <!-- Warm Hanging Light in Corner -->
  <circle cx="190" cy="50" r="40" fill="url(#lampGlow)" />
  <path d="M 190 0 L 190 25" stroke="#64748b" stroke-width="2" />
  <path d="M 175 25 L 205 25 L 200 35 L 180 35 Z" fill="#fbbf24" />

  <!-- Window Frame showing night sky & stars -->
  <g opacity="0.6">
    <rect x="140" y="45" width="50" height="70" rx="4" fill="#090d16" stroke="#334155" stroke-width="3" />
    <line x1="165" y1="45" x2="165" y2="115" stroke="#334155" stroke-width="2" />
    <line x1="140" y1="80" x2="190" y2="80" stroke="#334155" stroke-width="2" />
    <circle cx="150" cy="60" r="1.5" fill="#ffffff" />
    <circle cx="180" cy="70" r="1" fill="#ffffff" />
    <circle cx="155" cy="100" r="1.5" fill="#ffffff" />
  </g>

  <!-- MAIN SCENE: Cozy Rug and Cat on Cushion (Representing 'Con' - Animal Counter) -->
  <g filter="url(#shadow)">
    <!-- Round Soft Rug -->
    <ellipse cx="120" cy="185" rx="85" ry="35" fill="#334155" />
    <ellipse cx="120" cy="185" rx="75" ry="30" fill="#475569" />

    <!-- Cozy Cushion -->
    <g transform="translate(90, 160)">
      <ellipse cx="30" cy="20" rx="45" ry="22" fill="url(#cushionGrad)" />
      <!-- Cushion details -->
      <ellipse cx="30" cy="20" rx="35" ry="15" fill="#0284c7" opacity="0.3" />
      <circle cx="30" cy="20" r="5" fill="#0ea5e9" />
    </g>

    <!-- CAT SUBJECT (The 'Con' in 'Nhà tôi có một con mèo') -->
    <g transform="translate(92, 115)">
      <!-- Cat Tail (Curled around) -->
      <path d="M 10 35 C -5 35 -10 55 10 65 C 20 70 30 60 25 50" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" />

      <!-- Cat Body (Sleeping loaf pose) -->
      <ellipse cx="38" cy="38" rx="32" ry="24" fill="url(#catBody)" />

      <!-- Cat Back Stripes -->
      <path d="M 25 20 Q 30 28 35 20" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" />
      <path d="M 38 18 Q 43 26 48 18" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" />

      <!-- Cat Head -->
      <circle cx="60" cy="28" r="18" fill="url(#catBody)" />

      <!-- Cat Ears -->
      <polygon points="48,16 53,2 61,14" fill="#ea580c" />
      <polygon points="51,14 54,6 59,13" fill="#fed7aa" />

      <polygon points="65,14 73,2 78,16" fill="#ea580c" />
      <polygon points="67,13 72,6 75,14" fill="#fed7aa" />

      <!-- Sleeping Face Details -->
      <!-- Closed Happy Eyes / Winking ^_^ -->
      <path d="M 54 28 Q 57 32 60 28" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 64 28 Q 67 32 70 28" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />

      <!-- Cute Cat Nose & Mouth -->
      <polygon points="63,33 67,33 65,35" fill="#7c2d12" />
      <path d="M 65 35 Q 63 38 61 36" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 65 35 Q 67 38 69 36" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" />

      <!-- Rosy Cheeks -->
      <circle cx="53" cy="33" r="3" fill="#fda4af" opacity="0.6" />
      <circle cx="73" cy="33" r="3" fill="#fda4af" opacity="0.6" />

      <!-- Paws tucked in -->
      <ellipse cx="45" cy="50" rx="8" ry="6" fill="#fb923c" />
      <ellipse cx="60" cy="48" rx="8" ry="6" fill="#fb923c" />
    </g>

    <!-- Sleeping ZZZ Animation elements -->
    <g opacity="0.8">
      <text x="165" y="110" font-family="sans-serif" font-weight="bold" font-size="14" fill="#38bdf8">z</text>
      <text x="175" y="95" font-family="sans-serif" font-weight="bold" font-size="18" fill="#38bdf8">Z</text>
      <text x="188" y="75" font-family="sans-serif" font-weight="bold" font-size="22" fill="#38bdf8">Z</text>
    </g>
  </g>

  <!-- Foreground Foreground Plant/Prop (Framing the scene) -->
  <g transform="translate(15, 180)">
    <path d="M 0 60 Q 5 30 25 10 Q 15 35 0 60 Z" fill="#10b981" />
    <path d="M -5 60 Q 15 40 40 25 Q 25 45 -5 60 Z" fill="#059669" />
  </g>
</svg>