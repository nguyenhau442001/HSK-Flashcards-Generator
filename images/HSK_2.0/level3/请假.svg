<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Office Environment) -->
  <g opacity="0.4">
    <!-- Window with City View / Night Ambiance -->
    <rect x="150" y="20" width="70" height="90" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <line x1="185" y1="20" x2="185" y2="110" stroke="#334155" stroke-width="2"/>
    <line x1="150" y1="65" x2="220" y2="65" stroke="#334155" stroke-width="2"/>
    <!-- City lights through window -->
    <rect x="158" y="30" width="8" height="12" fill="#fbbf24" opacity="0.6"/>
    <rect x="170" y="45" width="10" height="8" fill="#38bdf8" opacity="0.5"/>
    <rect x="200" y="35" width="12" height="25" fill="#fbbf24" opacity="0.4"/>
    <rect x="160" y="80" width="15" height="15" fill="#fbbf24" opacity="0.5"/>

    <!-- Bookshelf in background -->
    <rect x="20" y="25" width="40" height="75" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="20" y1="50" x2="60" y2="50" stroke="#334155" stroke-width="2"/>
    <line x1="20" y1="75" x2="60" y2="75" stroke="#334155" stroke-width="2"/>
    <rect x="25" y="32" width="6" height="16" fill="#ec4899" opacity="0.8"/>
    <rect x="33" y="28" width="8" height="20" fill="#38bdf8" opacity="0.8"/>
    <rect x="26" y="58" width="12" height="15" fill="#f59e0b" opacity="0.8"/>
  </g>

  <!-- Ambient Light Glow -->
  <circle cx="120" cy="140" r="70" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Office Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)"/>
  <rect x="0" y="166" width="240" height="4" fill="#64748b"/>

  <!-- Desk Props: Laptop -->
  <g transform="translate(135, 115)">
    <!-- Laptop Base -->
    <path d="M -15 50 L 55 50 L 65 60 L -25 60 Z" fill="#64748b" filter="url(#dropShadow)"/>
    <rect x="-20" y="52" width="80" height="2" rx="1" fill="#94a3b8"/>
    <!-- Laptop Screen -->
    <path d="M -10 5 L 50 5 L 45 50 L -15 50 Z" fill="#334155" filter="url(#dropShadow)"/>
    <rect x="-6" y="9" width="51" height="38" rx="2" fill="url(#screenGrad)"/>
    <!-- Dashboard UI abstraction on screen -->
    <rect x="0" y="14" width="20" height="4" rx="2" fill="#bae6fd" opacity="0.8"/>
    <rect x="0" y="22" width="35" height="18" rx="2" fill="#0284c7" opacity="0.6"/>
    <circle cx="35" cy="16" r="3" fill="#34d399"/>
  </g>

  <!-- Desk Props: Coffee Mug with steam -->
  <g transform="translate(195, 135)">
    <ellipse cx="12" cy="5" rx="8" ry="3" fill="#cbd5e1"/>
    <path d="M 4 5 L 7 28 C 7 31 9 32 12 32 C 15 32 17 31 17 28 L 20 5 Z" fill="#f1f5f9" filter="url(#dropShadow)"/>
    <path d="M 19 10 C 23 10 24 16 20 20" fill="none" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Steam lines -->
    <path d="M 9 -2 C 8 -6 12 -8 11 -12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 15 -1 C 16 -5 13 -7 14 -11" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Potted Plant on Desk -->
  <g transform="translate(25, 125)">
    <path d="M 5 25 L 15 25 L 18 40 L 2 40 Z" fill="#f43f5e" filter="url(#dropShadow)"/>
    <ellipse cx="10" cy="25" rx="5" ry="2" fill="#fda4af"/>
    <!-- Leaves -->
    <path d="M 10 25 C 5 15 -5 10 -2 0 C 8 5 10 15 10 25 Z" fill="#10b981" filter="url(#dropShadow)"/>
    <path d="M 10 25 C 15 10 25 5 28 -2 C 20 5 15 15 10 25 Z" fill="#059669"/>
    <path d="M 10 25 C 8 10 12 0 15 -8 C 12 5 10 15 10 25 Z" fill="#34d399"/>
  </g>

  <!-- MAIN SUBJECT: Application for Leave (Xin nghỉ phép) -->
  <g transform="translate(55, 75)" filter="url(#dropShadow)">
    <!-- Clipboard / Backing Board -->
    <rect x="-10" y="-10" width="95" height="115" rx="8" fill="#cbd5e1"/>
    <rect x="-6" y="-6" width="87" height="107" rx="6" fill="#94a3b8"/>

    <!-- Clip at top -->
    <path d="M 22 -14 L 38 -14 C 40 -14 41 -13 41 -11 L 41 -6 C 41 -4 40 -3 38 -3 L 22 -3 C 20 -3 19 -4 19 -6 L 19 -11 C 19 -13 20 -14 22 -14 Z" fill="#475569"/>
    <rect x="25" y="-10" width="10" height="5" rx="2" fill="#cbd5e1"/>

    <!-- The Leave Form Document -->
    <rect x="0" y="0" width="75" height="95" rx="4" fill="url(#paperGrad)"/>

    <!-- Form Header Graphic (Calendar/Clock icon representing time off) -->
    <circle cx="37" cy="18" r="10" fill="#fef3c7"/>
    <path d="M 37 12 L 37 18 L 41 21" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Red Stamp Symbolizing Approval / Official Leave Request -->
    <g transform="translate(48, 55) rotate(-15)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
      <path d="M -7 -2 L -2 4 L 7 -5" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    </g>

    <!-- Document Lines (Simulating text fields without actual letters) -->
    <rect x="10" y="36" width="30" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="10" y="46" width="55" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="10" y="53" width="45" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="10" y="60" width="50" height="3" rx="1.5" fill="#cbd5e1"/>
    
    <!-- Signature Line -->
    <line x1="10" y1="80" x2="35" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- Stylized checkmark/signature -->
    <path d="M 45 74 C 47 72 52 82 58 70" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating Interactive/Action Elements (Highlighting the "action" aspect) -->
  <g transform="translate(145, 60)">
    <!-- Glowing approval badge popping out -->
    <circle cx="0" cy="0" r="16" fill="#10b981" filter="url(#glow)"/>
    <path d="M -6 0 L -2 4 L 7 -5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Calendar Icon Accent -->
  <g transform="translate(45, 65)" filter="url(#dropShadow)">
    <rect x="-12" y="-12" width="24" height="24" rx="6" fill="#3b82f6"/>
    <path d="M -6 -4 L 6 -4 M -6 2 L 6 2 M -3 -8 L -3 -12 M 3 -8 L 3 -12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <rect x="-4" y="5" width="8" height="4" rx="1" fill="#93c5fd"/>
  </g>

  <!-- Sparkles / Action flourishes -->
  <path d="M 130 45 L 133 52 L 140 55 L 133 58 L 130 65 L 127 58 L 120 55 L 127 52 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M 40 135 L 42 139 L 46 141 L 42 143 L 40 147 L 38 143 L 34 141 L 38 139 Z" fill="#38bdf8" opacity="0.8"/>
  <circle cx="160" cy="100" r="3" fill="#f43f5e"/>
  <circle cx="35" cy="50" r="2" fill="#fb923c"/>
</svg>