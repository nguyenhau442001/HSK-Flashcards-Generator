<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow for Friendship/Good Relation -->
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Cafe Wall & Interior Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Character 1 (Left) Colors -->
    <linearGradient id="sweater1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 (Right) Colors -->
    <linearGradient id="sweater2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Wall & Window Setting (Context: Cozy Cafe) -->
  <g>
    <!-- Window Frame -->
    <rect x="30" y="25" width="180" height="95" rx="8" fill="#111827" stroke="#334155" stroke-width="3"/>
    <!-- City Night Bokeh through Window -->
    <circle cx="60" cy="55" r="12" fill="#38bdf8" opacity="0.3"/>
    <circle cx="85" cy="45" r="8" fill="#fbbf24" opacity="0.4"/>
    <circle cx="160" cy="65" r="16" fill="#ec4899" opacity="0.25"/>
    <circle cx="190" cy="40" r="10" fill="#34d399" opacity="0.3"/>
    <path d="M30 75 L210 75" stroke="#334155" stroke-width="2"/>
    <path d="M115 25 L115 120" stroke="#334155" stroke-width="2"/>

    <!-- Warm Ambiance Glow behind characters -->
    <circle cx="120" cy="130" r="70" fill="url(#warmGlow)"/>
  </g>

  <!-- Hanging Pendant Lights -->
  <path d="M80 0 L80 35" stroke="#64748b" stroke-width="2"/>
  <path d="M160 0 L160 25" stroke="#64748b" stroke-width="2"/>
  <path d="M70 35 L90 35 L95 42 L65 42 Z" fill="#fbbf24"/>
  <path d="M150 25 L170 25 L175 32 L145 32 Z" fill="#fbbf24"/>

  <!-- Coffee Table & Props -->
  <g filter="url(#dropShadow)">
    <!-- Table Surface -->
    <ellipse cx="120" cy="180" rx="90" ry="25" fill="url(#tableGrad)" stroke="#475569" stroke-width="2"/>
    <!-- Coffee Cups & Saucers -->
    <ellipse cx="85" cy="175" rx="12" ry="5" fill="#64748b"/>
    <path d="M75 165 C73 175 97 175 95 165 Z" fill="#f8fafc"/>
    <path d="M93 167 C98 167 98 173 93 173" stroke="#f8fafc" stroke-width="2" fill="none"/>
    <path d="M82 163 Q85 160 88 163" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/> <!-- Steam -->

    <ellipse cx="155" cy="175" rx="12" ry="5" fill="#64748b"/>
    <path d="M145 165 C143 175 167 175 165 165 Z" fill="#f8fafc"/>
    <path d="M163 167 C168 167 168 173 163 173" stroke="#f8fafc" stroke-width="2" fill="none"/>
    <path d="M152 163 Q155 160 158 163" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/> <!-- Steam -->
    
    <!-- Small Plant on Table -->
    <path d="M115 175 L125 175 L123 162 L117 162 Z" fill="#e2e8f0"/>
    <circle cx="120" cy="158" r="8" fill="#10b981"/>
    <circle cx="115" cy="154" r="6" fill="#34d399"/>
    <circle cx="124" cy="153" r="6" fill="#059669"/>
  </g>

  <!-- Character 1 (Left - Friendly young man) -->
  <g id="characterLeft" filter="url(#dropShadow)">
    <!-- Body/Torso -->
    <path d="M55 215 C55 185 70 170 90 170 C105 170 115 185 115 215 Z" fill="url(#sweater1)"/>
    <!-- Collar -->
    <path d="M75 170 Q90 182 105 170" stroke="#0f172a" stroke-width="3" fill="none"/>
    <!-- Head & Neck -->
    <rect x="82" y="145" width="16" height="30" fill="#fbcfe8"/>
    <circle cx="90" cy="130" r="22" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M68 128 C68 112 80 108 92 108 C106 108 114 116 114 130 C114 135 112 135 110 130 C105 115 95 112 90 112 C78 112 72 118 70 128 Z" fill="#334155"/>
    <!-- Face Expressions (Warm Laughing Eyes, Big Smile) -->
    <path d="M80 128 Q85 122 90 128" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M96 128 Q101 122 106 128" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M85 138 Q90 146 95 138" stroke="#be185d" stroke-width="2" stroke-linecap="round" fill="#fda4af"/>
    <!-- Blushing Cheeks -->
    <circle cx="78" cy="135" r="4" fill="#fb7185" opacity="0.6"/>
    <circle cx="102" cy="135" r="4" fill="#fb7185" opacity="0.6"/>
    
    <!-- Gesturing Arm (Leaning forward happily) -->
    <path d="M60 185 Q75 165 95 180" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="95" cy="180" r="6" fill="#fbcfe8"/>
  </g>

  <!-- Character 2 (Right - Friendly young woman) -->
  <g id="characterRight" filter="url(#dropShadow)">
    <!-- Body/Torso -->
    <path d="M125 215 C125 185 135 170 150 170 C170 170 185 185 185 215 Z" fill="url(#sweater2)"/>
    <!-- Collar -->
    <path d="M135 170 Q150 185 165 170" stroke="#0f172a" stroke-width="3" fill="none"/>
    <!-- Head & Neck -->
    <rect x="142" y="145" width="16" height="30" fill="#fbcfe8"/>
    <circle cx="150" cy="130" r="22" fill="#fbcfe8"/>
    <!-- Hair (Ponytail style) -->
    <path d="M132 120 C132 105 150 105 165 110 C175 113 178 125 175 135 C173 140 168 145 168 145 C168 145 178 128 170 120 C160 112 145 112 135 120 Z" fill="#451a03"/>
    <circle cx="174" cy="138" r="6" fill="#451a03"/> <!-- Ponytail bun -->
    
    <!-- Face Expressions (Joyful Wink / Big Smile) -->
    <path d="M140 128 Q145 122 150 128" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Winking Eye -->
    <path d="M156 128 Q161 133 166 128" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M145 138 Q150 146 155 138" stroke="#be185d" stroke-width="2" stroke-linecap="round" fill="#fda4af"/>
    <!-- Blushing Cheeks -->
    <circle cx="138" cy="135" r="4" fill="#fb7185" opacity="0.6"/>
    <circle cx="162" cy="135" r="4" fill="#fb7185" opacity="0.6"/>

    <!-- Gesturing Arm -->
    <path d="M180 185 Q165 165 145 180" stroke="#be185d" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="145" cy="180" r="6" fill="#fbcfe8"/>
  </g>

  <!-- Floating Heart Symbols illustrating "Good Relationship / Connection" -->
  <g>
    <path d="M120 95 C120 88 110 82 105 90 C100 82 90 88 90 95 C90 105 105 115 105 115 C105 115 120 105 120 95 Z" fill="#ec4899" opacity="0.9" transform="scale(0.8) translate(40, 10)" filter="url(#dropShadow)"/>
    
    <path d="M120 95 C120 88 110 82 105 90 C100 82 90 88 90 95 C90 105 105 115 105 115 C105 115 120 105 120 95 Z" fill="#38bdf8" opacity="0.8" transform="scale(0.5) translate(100, 30)" filter="url(#dropShadow)"/>

    <path d="M120 95 C120 88 110 82 105 90 C100 82 90 88 90 95 C90 105 105 115 105 115 C105 115 120 105 120 95 Z" fill="#fbbf24" opacity="0.85" transform="scale(0.6) translate(80, -10)" filter="url(#dropShadow)"/>
  </g>
</svg>