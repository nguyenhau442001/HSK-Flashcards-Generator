<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Suitcase Shell Gradient -->
    <linearGradient id="caseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Suitcase Trim/Accent -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Lighting Glow -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light / Window / Lamp beam -->
  <circle cx="180" cy="50" r="70" fill="url(#lampGlow)"/>

  <!-- Interior Wall & Floor -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2"/>

  <!-- Background Context: Travel Posters / Shelf -->
  <rect x="25" y="45" width="50" height="35" rx="4" fill="#334155" opacity="0.7"/>
  <circle cx="50" cy="60" r="10" fill="#f43f5e" opacity="0.8"/>
  <path d="M35 70 Q50 50 65 70 Z" fill="#38bdf8" opacity="0.6"/>

  <rect x="165" y="30" width="45" height="60" rx="4" fill="#334155" opacity="0.7"/>
  <path d="M175 75 L187 50 L200 75 Z" fill="#10b981" opacity="0.7"/>
  
  <!-- Wardrobe / Furniture Edge -->
  <path d="M210 0 L240 0 L240 160 L210 160 Z" fill="#1e293b" opacity="0.5"/>

  <!-- SCENE OBJECT: The Suitcase (行李箱) -->
  <g filter="url(#shadow)">
    <!-- Wheels -->
    <rect x="75" y="195" width="8" height="12" rx="3" fill="#0f172a"/>
    <rect x="157" y="195" width="8" height="12" rx="3" fill="#0f172a"/>
    <circle cx="79" cy="207" r="3" fill="#64748b"/>
    <circle cx="161" cy="207" r="3" fill="#64748b"/>

    <!-- Handle Base (Retracted or Extended) -->
    <path d="M105 55 L135 55 L135 70 L105 70 Z" fill="#64748b"/>
    <path d="M112 35 L128 35 L128 55 L112 55 Z" fill="#94a3b8"/>
    <rect x="110" y="30" width="20" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Main Body Shell -->
    <rect x="70" y="65" width="100" height="135" rx="16" fill="url(#caseGrad)"/>

    <!-- Shell Ribs / Grooves for realism -->
    <line x1="70" y1="95" x2="170" y2="95" stroke="#0284c7" stroke-width="4"/>
    <line x1="70" y1="125" x2="170" y2="125" stroke="#0284c7" stroke-width="4"/>
    <line x1="70" y1="155" x2="170" y2="155" stroke="#0284c7" stroke-width="4"/>
    
    <line x1="120" y1="65" x2="120" y2="200" stroke="#0284c7" stroke-width="3" stroke-dasharray="8 4"/>

    <!-- Corner Protectors -->
    <path d="M70 81 C70 72 77 65 86 65 L70 65 Z" fill="url(#accentGrad)"/>
    <path d="M170 81 C170 72 163 65 154 65 L170 65 Z" fill="url(#accentGrad)"/>
    <path d="M70 185 C70 194 77 200 86 200 L70 200 Z" fill="url(#accentGrad)"/>
    <path d="M170 185 C170 194 163 200 154 200 L170 200 Z" fill="url(#accentGrad)"/>

    <!-- Side Handle -->
    <path d="M170 100 C178 100 178 120 170 120" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>

    <!-- Zipper & Lock Area -->
    <path d="M70 80 L170 80" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="2 2"/>
    <rect x="113" y="76" width="14" height="8" rx="2" fill="#fbbf24"/>
  </g>

  <!-- Context Prop: Travel Neck Pillow resting near the suitcase -->
  <g filter="url(#shadow)">
    <path d="M45 180 C30 180 20 165 25 150 C30 135 45 130 55 140 C65 150 60 160 55 170 Z" fill="#ec4899"/>
    <!-- Pillow clasp -->
    <rect x="45" y="172" width="10" height="6" rx="2" fill="#fbbf24"/>
  </g>

  <!-- Context Prop: Passport and boarding pass on the floor -->
  <g transform="rotate(-15 175 190)" filter="url(#shadow)">
    <!-- Passport -->
    <rect x="165" y="175" width="30" height="38" rx="3" fill="#1e3a8a"/>
    <rect x="172" y="185" width="16" height="12" rx="2" fill="#fbbf24" opacity="0.8"/>
    <!-- Boarding pass sticking out -->
    <rect x="175" y="160" width="24" height="30" rx="2" fill="#f8fafc"/>
    <line x1="180" y1="168" x2="194" y2="168" stroke="#94a3b8" stroke-width="2"/>
    <line x1="180" y1="174" x2="190" y2="174" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Atmospheric Light Dust / Sparkles -->
  <circle cx="95" cy="40" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="140" cy="30" r="2" fill="#fef08a" opacity="0.6"/>
  <circle cx="200" cy="110" r="1" fill="#fef08a" opacity="0.9"/>
  <circle cx="40" cy="115" r="1.5" fill="#38bdf8" opacity="0.7"/>
</svg>