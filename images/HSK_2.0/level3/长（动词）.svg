<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wall Grid Pattern -->
    <pattern id="wallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Warm Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Background -->
  <rect x="0" y="0" width="240" height="190" fill="url(#wallGrid)" opacity="0.6"/>
  <rect x="0" y="190" width="240" height="50" fill="#0f172a"/>
  <!-- Floor Baseboard -->
  <rect x="0" y="184" width="240" height="6" fill="#334155"/>

  <!-- Ambient Light from Lamp -->
  <circle cx="180" cy="50" r="80" fill="url(#lampGlow)"/>

  <!-- Growth Chart Wall Decal / Height Measurement Ticks -->
  <g transform="translate(30, 20)">
    <line x1="0" y1="0" x2="0" y2="164" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <!-- Ticks & Markers -->
    <g stroke="#64748b" stroke-width="1.5">
      <line x1="-4" y1="20" x2="0" y2="20"/>
      <line x1="-8" y1="50" x2="0" y2="50"/>
      <line x1="-4" y1="80" x2="0" y2="80"/>
      <line x1="-8" y1="110" x2="0" y2="110"/>
      <line x1="-4" y1="140" x2="0" y2="140"/>
    </g>
    <!-- Cute Height Pencil/Arrow Marker at current growth level -->
    <path d="M -12 75 L -2 78 L -12 81 Z" fill="#38bdf8"/>
    <circle cx="-12" cy="78" r="3" fill="#38bdf8"/>
  </g>

  <!-- Hanging Pendant Lamp -->
  <path d="M 180 0 L 180 35" stroke="#64748b" stroke-width="2"/>
  <path d="M 160 35 L 200 35 L 195 48 L 165 48 Z" fill="#fbbf24"/>
  <ellipse cx="180" cy="48" rx="15" ry="4" fill="#fef08a"/>

  <!-- Potted Plant on Floor (Showing Growth) -->
  <g transform="translate(190, 154)">
    <!-- Pot -->
    <path d="M -12 10 L 12 10 L 9 30 L -9 30 Z" fill="url(#potGrad)"/>
    <ellipse cx="0" cy="10" rx="12" ry="3" fill="#fdba74"/>
    <!-- Soil -->
    <ellipse cx="0" cy="11" rx="9" ry="2" fill="#78350f"/>
    <!-- Growing Plant Stem & Leaves -->
    <path d="M 0 11 Q 2 -10 15 -25" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 11 Q -4 -5 -12 -15" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M 15 -25 C 22 -30, 25 -20, 15 -18 C 10 -15, 12 -22, 15 -25 Z" fill="url(#leafGrad)"/>
    <path d="M -12 -15 C -18 -20, -20 -10, -12 -8 C -7 -6, -9 -12, -12 -15 Z" fill="url(#leafGrad)"/>
    <path d="M 4 -2 C 10 -6, 12 0, 4 3 Z" fill="url(#leafGrad)"/>
  </g>

  <!-- Main Scene Subject: Child measuring height against the wall -->
  <g transform="translate(75, 45)">
    <!-- Shadow on floor/wall -->
    <ellipse cx="25" cy="142" rx="18" ry="5" fill="#090d16" opacity="0.5"/>

    <!-- Kid's Body & Clothes -->
    <!-- Legs -->
    <rect x="16" y="105" width="7" height="35" rx="3.5" fill="#38bdf8"/>
    <rect x="27" y="105" width="7" height="35" rx="3.5" fill="#38bdf8"/>
    <!-- Shoes -->
    <path d="M 12 138 C 12 135, 16 135, 23 135 C 24 135, 24 140, 24 140 L 12 140 Z" fill="#f43f5e"/>
    <path d="M 27 138 C 27 135, 31 135, 38 135 C 39 135, 39 140, 39 140 L 27 140 Z" fill="#f43f5e"/>

    <!-- Torso (Colorful Hoodie) -->
    <path d="M 14 65 L 36 65 C 41 65, 42 95, 42 105 L 8 105 C 8 95, 9 65, 14 65 Z" fill="#8b5cf6"/>
    <!-- Hoodie Pocket -->
    <path d="M 17 90 L 33 90 C 34 95, 33 100, 25 100 C 17 100, 16 95, 17 90 Z" fill="#7c3aed"/>

    <!-- Arms reaching up to measure / touch head -->
    <!-- Left Arm (bent holding head/hair to show measuring) -->
    <path d="M 14 70 C 5 70, 2 85, 10 90" fill="none" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round"/>
    <!-- Right Arm (Raised straight up, touching height mark) -->
    <path d="M 36 68 C 48 55, 48 35, 48 30" fill="none" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round"/>
    <!-- Right Hand Flat on Head/Wall -->
    <circle cx="48" cy="27" r="5" fill="#fde047"/>

    <!-- Neck -->
    <rect x="21" y="58" width="8" height="10" fill="#fde047"/>

    <!-- Head & Face -->
    <circle cx="25" cy="45" r="16" fill="#fde047"/>

    <!-- Hair (Cute spiky/rounded tufts) -->
    <path d="M 10 42 C 9 30, 20 25, 25 25 C 30 25, 40 30, 39 42 C 35 35, 15 35, 10 42 Z" fill="#b45309"/>

    <!-- Face Details (Happy, looking up proudly) -->
    <!-- Closed Happy Eyes ^ ^ -->
    <path d="M 18 43 Q 21 39 24 43" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <path d="M 27 43 Q 30 39 33 43" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <!-- Smiling Mouth -->
    <path d="M 22 49 Q 25 53 28 49" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="17" cy="47" r="3" fill="#fb7185" opacity="0.6"/>
    <circle cx="33" cy="47" r="3" fill="#fb7185" opacity="0.6"/>
  </g>

  <!-- Floating Sparkles / Growth Energy Icons -->
  <g transform="translate(130, 60)">
    <!-- Sparkle 1 -->
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(50, 110)">
    <!-- Sparkle 2 -->
    <path d="M 0 -5 L 1.5 -1.5 L 5 0 L 1.5 1.5 L 0 5 L -1.5 1.5 L -5 0 L -1.5 -1.5 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(150, 130)">
    <!-- Sparkle 3 -->
    <path d="M 0 -6 L 1.8 -1.8 L 6 0 L 1.8 1.8 L 0 6 L -1.8 1.8 L -6 0 L -1.8 -1.8 Z" fill="#10b981"/>
  </g>

  <!-- Small Wooden Stool / Props adding environmental depth -->
  <g transform="translate(150, 165)">
    <ellipse cx="15" cy="5" rx="16" ry="5" fill="#b45309"/>
    <rect x="3" y="8" width="4" height="20" fill="#92400e" rx="2"/>
    <rect x="23" y="8" width="4" height="20" fill="#92400e" rx="2"/>
    <!-- Toy on Stool (Building blocks showing incremental height) -->
    <rect x="8" y="-4" width="8" height="9" fill="#ec4899" rx="1"/>
    <rect x="10" y="-12" width="4" height="8" fill="#38bdf8" rx="1"/>
  </g>

</svg>