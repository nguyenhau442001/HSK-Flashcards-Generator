<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="85%" cy="15%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)"/>
  <circle cx="210" cy="30" r="60" fill="url(#sunGlow)"/>

  <!-- Rolling Hills -->
  <path d="M0 240 V200 Q60 180 120 200 Q180 220 240 190 V240 Z" fill="#064e3b"/>
  <path d="M0 240 V215 Q80 200 160 220 Q200 230 240 210 V240 Z" fill="#10b981"/>

  <!-- Tree Trunk -->
  <path d="M40 210 Q45 180 35 140 Q38 135 42 140 Q50 170 55 210 Z" fill="#334155"/>
  <path d="M38 155 Q25 145 15 150 Q25 140 38 150 Z" fill="#334155"/>
  <path d="M40 165 Q55 155 65 160 Q55 150 40 160 Z" fill="#334155"/>

  <!-- Blossoms (Cherry Blossom Style) -->
  <g id="blossoms">
    <circle cx="35" cy="135" r="12" fill="#ec4899" opacity="0.8"/>
    <circle cx="45" cy="145" r="10" fill="#f472b6" opacity="0.9"/>
    <circle cx="25" cy="145" r="8" fill="#fb923c" opacity="0.7"/>
    <circle cx="55" cy="155" r="9" fill="#ec4899" opacity="0.8"/>
    <circle cx="15" cy="150" r="6" fill="#f472b6" opacity="0.9"/>
    <circle cx="40" cy="125" r="7" fill="#fb923c" opacity="0.6"/>
    <circle cx="65" cy="160" r="5" fill="#f472b6" opacity="0.8"/>
  </g>

  <!-- Flying Bird (Action) -->
  <g transform="translate(140, 80) rotate(-10)">
    <path d="M0 0 Q10 -15 25 -5 Q15 5 0 0 Z" fill="#38bdf8"/> <!-- Wing 1 -->
    <path d="M5 5 Q15 20 30 10 Q20 0 5 5 Z" fill="#0ea5e9"/> <!-- Wing 2 -->
    <path d="M-5 5 Q5 15 20 5 Q15 -5 -5 5 Z" fill="#7dd3fc"/> <!-- Body -->
    <path d="M20 5 L28 2 L28 8 Z" fill="#fbbf24"/> <!-- Beak -->
  </g>

  <!-- Floating Petals -->
  <path d="M100 120 Q105 125 100 130 Q95 125 100 120 Z" fill="#f472b6" transform="rotate(15 100 120)"/>
  <path d="M160 160 Q165 165 160 170 Q155 165 160 160 Z" fill="#ec4899" transform="rotate(-20 160 160)"/>
  <path d="M80 180 Q85 185 80 190 Q75 185 80 180 Z" fill="#fb923c" transform="rotate(45 80 180)"/>
  <path d="M200 130 Q205 135 200 140 Q195 135 200 130 Z" fill="#f472b6" transform="rotate(10 200 130)"/>

  <!-- Ground Flowers -->
  <g transform="translate(180, 215)">
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
    <circle cx="0" cy="-5" r="2" fill="#ec4899"/>
    <circle cx="5" cy="0" r="2" fill="#ec4899"/>
    <circle cx="-5" cy="0" r="2" fill="#ec4899"/>
    <circle cx="0" cy="5" r="2" fill="#ec4899"/>
  </g>
  
  <g transform="translate(110, 225)">
    <circle cx="0" cy="0" r="2" fill="#fbbf24"/>
    <circle cx="0" cy="-4" r="2" fill="#38bdf8"/>
    <circle cx="4" cy="0" r="2" fill="#38bdf8"/>
    <circle cx="-4" cy="0" r="2" fill="#38bdf8"/>
    <circle cx="0" cy="4" r="2" fill="#38bdf8"/>
  </g>

  <!-- Atmospheric Light Particles -->
  <circle cx="60" cy="60" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="180" cy="40" r="2" fill="#fbbf24" opacity="0.3"/>
  <circle cx="220" cy="100" r="1" fill="#fbbf24" opacity="0.5"/>
</svg>