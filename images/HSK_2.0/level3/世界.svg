<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Globe Ocean Gradient -->
    <radialGradient id="globeOcean" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- Globe Shadow (3D Depth) -->
    <radialGradient id="globeShadow" cx="65%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Stars/Sparkles -->
  <g fill="#fbbf24" opacity="0.4">
    <circle cx="35" cy="45" r="1.5"/>
    <circle cx="205" cy="35" r="1"/>
    <circle cx="215" cy="110" r="1.5"/>
    <circle cx="25" cy="180" r="1"/>
    <path d="M120 20 L122 25 L127 27 L122 29 L120 34 L118 29 L113 27 L118 25 Z" fill="#38bdf8" opacity="0.6"/>
    <path d="M190 70 L191 73 L194 74 L191 75 L190 78 L189 75 L186 74 L189 73 Z" fill="#fbbf24" opacity="0.7"/>
    <path d="M45 115 L46 117 L48 118 L46 119 L45 121 L44 119 L42 118 L44 117 Z" fill="#ec4899" opacity="0.6"/>
  </g>

  <!-- Desk / Surface -->
  <path d="M 0 200 L 240 200 L 240 240 L 0 240 Z" fill="#090d16"/>
  <path d="M 0 200 L 240 200" stroke="#334155" stroke-width="2"/>

  <!-- Background Environment Props (Travel items, compass, folded map) -->
  <g transform="translate(180, 155)">
    <!-- Folded Map -->
    <path d="M-20 40 L0 30 L20 42 L10 52 L-10 44 Z" fill="#cbd5e1"/>
    <path d="M-20 40 L-10 44 L-10 25 L-20 20 Z" fill="#94a3b8"/>
    <path d="M0 30 L20 42 L20 22 L0 15 Z" fill="#e2e8f0"/>
    <path d="M-10 44 L10 52 L10 32 L-10 25 Z" fill="#f8fafc"/>
    <path d="M-5 35 Q0 33 5 37" stroke="#ef4444" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Vintage Compass Prop -->
  <g transform="translate(45, 175)">
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="12" fill="#0f172a"/>
    <polygon points="0,-10 3,0 0,8 -3,0" fill="#ef4444"/>
    <polygon points="0,10 3,0 0,-8 -3,0" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="2" fill="#f59e0b"/>
  </g>

  <!-- MAIN SUBJECT: The World (Globe on a Stand) -->
  <g transform="translate(120, 115)">
    <!-- Stand Base -->
    <path d="M-25 75 L25 75 C30 75 32 78 30 82 C28 85 -28 85 -30 82 C-32 78 -30 75 -25 75 Z" fill="#64748b"/>
    <path d="M-5 35 L5 35 L7 75 L-7 75 Z" fill="#94a3b8"/>

    <!-- Stand Arch (Meridian Ring) -->
    <path d="M -54 -10 C -54 -50, -30 -68, 0 -68 C 30 -68, 54 -50, 54 -10 C 54 25, 42 55, 30 70 L 22 62 C 32 50, 42 25, 42 -10 C 42 -40, 22 -56, 0 -56 C -22 -56, -42 -40, -42 -10 C -42 25, -32 50, -22 62 L -30 70 C -42 55, -54 25, -54 -10 Z" fill="#f59e0b" filter="url(#glow)"/>
    <path d="M -54 -10 C -54 -50, -30 -68, 0 -68 C 30 -68, 54 -50, 54 -10 C 54 25, 42 55, 30 70 L 22 62 C 32 50, 42 25, 42 -10 C 42 -40, 22 -56, 0 -56 C -22 -56, -42 -40, -42 -10 C -42 25, -32 50, -22 62 L -30 70 C -42 55, -54 25, -54 -10 Z" fill="#fbbf24"/>

    <!-- Globe Sphere -->
    <circle cx="0" cy="-10" r="50" fill="url(#globeOcean)"/>

    <!-- Continents (Stylized Vector Landmasses with rich green/amber tones) -->
    <g clip-path="url(#globeClip)">
      <clipPath id="globeClip">
        <circle cx="0" cy="-10" r="50"/>
      </clipPath>
      
      <!-- Landmass 1 (North/South America stylized) -->
      <path d="M -30 -40 Q -15 -45 -5 -30 Q 5 -15 -10 10 Q -25 35 -35 25 Q -45 10 -35 -10 Z" fill="#10b981"/>
      
      <!-- Landmass 2 (Eurasia/Africa stylized) -->
      <path d="M 15 -50 Q 35 -40 45 -20 Q 35 15 20 40 Q 5 40 10 10 Q 15 -10 15 -50 Z" fill="#059669"/>
      
      <!-- Small Island / Australia -->
      <path d="M 30 35 Q 40 30 45 45 Q 35 50 30 35 Z" fill="#10b981"/>
    </g>

    <!-- Globe Inner Shadow for 3D sphere effect -->
    <circle cx="0" cy="-10" r="50" fill="url(#globeShadow)"/>
    
    <!-- Specular Highlight on Globe -->
    <ellipse cx="-18" cy="-30" rx="12" ry="6" transform="rotate(-30 -18 -30)" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- CHARACTER INTERACTING: Curious Explorer / Learner -->
  <g transform="translate(120, 160)">
    <!-- Character Body / Shoulders -->
    <path d="M -45 55 C -45 25, -25 20, 0 20 C 25 20, 45 25, 45 55 Z" fill="url(#jacketGrad)"/>
    
    <!-- Collar & Scarf -->
    <path d="M -15 20 L 0 32 L 15 20 L 10 15 L 0 22 L -10 15 Z" fill="#38bdf8"/>
    <path d="M -22 24 Q 0 40 22 24 C 28 35, 20 45, 0 45 C -20 45, -28 35, -22 24 Z" fill="#0284c7"/>

    <!-- Neck -->
    <rect x="-7" y="10" width="14" height="15" rx="4" fill="#fcd34d"/>

    <!-- Head -->
    <circle cx="0" cy="-6" r="22" fill="#fde68a"/>

    <!-- Hair (Adventurer style) -->
    <path d="M -20 -15 C -22 -28, -5 -30, 8 -25 C 22 -20, 24 -5, 22 2 C 18 5, 12 -5, 5 -12 C -2 -18, -12 -10, -20 -15 Z" fill="#451a03"/>

    <!-- Face details: Looking up happily with wonder -->
    <g transform="translate(0, -6)">
      <!-- Eyes (Happy arcs) -->
      <path d="M -9 -2 Q -6 -6 -3 -2" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 3 -2 Q 6 -6 9 -2" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      
      <!-- Cheeks (Excited blush) -->
      <circle cx="-11" cy="3" r="3.5" fill="#f43f5e" opacity="0.4"/>
      <circle cx="11" cy="3" r="3.5" fill="#f43f5e" opacity="0.4"/>

      <!-- Smile -->
      <path d="M -4 6 Q 0 11 4 6" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Pointing Hand reaching towards the globe -->
    <g transform="translate(32, -15)">
      <circle cx="0" cy="0" r="6" fill="#fcd34d"/>
      <path d="M 4 -2 L 12 -5 L 12 -1 L 4 3 Z" fill="#fcd34d"/>
    </g>
  </g>

  <!-- Foreground Atmospheric Magic Sparkles & Orbit Ring -->
  <path d="M 40 100 Q 120 70 200 110" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,6" fill="none" opacity="0.6"/>
  <path d="M 50 130 Q 120 95 190 135" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,8" fill="none" opacity="0.5"/>

  <!-- Glowing interactive sparks near the globe -->
  <circle cx="150" cy="85" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="90" cy="115" r="2.5" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="135" cy="135" r="2" fill="#fbbf24" filter="url(#glow)"/>
</svg>