<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="treeTrunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="canopy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Environment: Sky & Sun -->
  <rect x="0" y="0" width="240" height="150" fill="url(#skyGrad)" />
  <circle cx="190" cy="45" r="22" fill="url(#sunGrad)" opacity="0.9" />
  <circle cx="190" cy="45" r="30" fill="#fbbf24" opacity="0.15" />

  <!-- Distant Mountains/Hills -->
  <path d="M0 130 L40 100 L90 120 L150 95 L200 115 L240 90 L240 150 L0 150 Z" fill="#0f172a" opacity="0.5" />
  <path d="M0 135 L60 110 L120 125 L180 105 L240 120 L240 150 L0 150 Z" fill="#1e293b" opacity="0.8" />

  <!-- Ground / Park Environment -->
  <path d="M0 140 Q 60 130, 120 138 T 240 135 L 240 240 L 0 240 Z" fill="url(#groundGrad)" />

  <!-- Background Trees -->
  <g opacity="0.7">
    <path d="M30 140 L40 100 L50 140 Z" fill="#047857" />
    <rect x="38" y="135" width="4" height="10" fill="#78350f" />
    <path d="M200 145 L212 105 L224 145 Z" fill="#047857" />
    <rect x="209" y="140" width="6" height="12" fill="#78350f" />
    <path d="M215 148 L223 115 L231 148 Z" fill="#059669" />
  </g>

  <!-- Foreground Main Tree (Left) -->
  <g>
    <!-- Trunk -->
    <path d="M35 155 Q 38 120, 30 90 L 48 90 Q 52 120, 50 155 Z" fill="url(#treeTrunk)" />
    <!-- Foliage / Canopy -->
    <circle cx="40" cy="85" r="28" fill="url(#canopy)" />
    <circle cx="22" cy="95" r="20" fill="#059669" />
    <circle cx="58" cy="92" r="22" fill="#10b981" />
    <circle cx="40" cy="65" r="22" fill="#34d399" />
  </g>

  <!-- Detailed Environmental Props (Flowers & Grass Tufts) -->
  <g fill="#10b981">
    <path d="M15 170 Q 17 160, 20 170" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <path d="M18 172 Q 21 162, 24 172" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <!-- Flowers -->
    <circle cx="70" cy="155" r="3" fill="#fb923c" />
    <circle cx="76" cy="162" r="3" fill="#ec4899" />
    <circle cx="170" cy="150" r="3" fill="#fbbf24" />
    <circle cx="176" cy="156" r="3" fill="#38bdf8" />
  </g>

  <!-- Wooden Park Bench -->
  <g transform="translate(130, 140)">
    <!-- Bench Legs -->
    <rect x="10" y="20" width="4" height="15" fill="#475569" />
    <rect x="35" y="20" width="4" height="15" fill="#475569" />
    <!-- Seat Slats -->
    <rect x="5" y="15" width="40" height="4" rx="1" fill="#b45309" />
    <rect x="5" y="20" width="40" height="4" rx="1" fill="#92400e" />
    <!-- Backrest -->
    <rect x="5" y="3" width="40" height="4" rx="1" fill="#b45309" />
    <rect x="5" y="8" width="40" height="4" rx="1" fill="#92400e" />
    <path d="M10 8 L10 20" stroke="#78350f" stroke-width="3" />
    <path d="M39 8 L39 20" stroke="#78350f" stroke-width="3" />
  </g>

  <!-- Character 1: Young Woman Planting / Caring for a Sapling -->
  <g transform="translate(75, 120)">
    <!-- Shadow -->
    <ellipse cx="25" cy="55" rx="18" ry="6" fill="#022c22" opacity="0.6" />
    
    <!-- Kneeling / Crouching Body -->
    <!-- Legs -->
    <path d="M15 45 Q 22 52, 35 48" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M12 35 L 20 48" stroke="#1e40af" stroke-width="8" stroke-linecap="round" />

    <!-- Torso -->
    <path d="M18 20 Q 15 35, 25 42 L 35 35 Q 38 22, 32 18 Z" fill="#ec4899" />

    <!-- Head & Hair -->
    <circle cx="28" cy="10" r="9" fill="#fbcfe8" />
    <!-- Hair bun -->
    <circle cx="34" cy="5" r="5" fill="#1e293b" />
    <path d="M20 7 Q 28 2, 35 10" fill="#1e293b" />

    <!-- Arms & Action: Tending to Sapling -->
    <path d="M24 25 Q 35 30, 42 38" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Hand holding trowel/soil -->
    <circle cx="43" cy="38" r="3" fill="#cbd5e1" />
  </g>

  <!-- Sapling being planted -->
  <g transform="translate(112, 155)">
    <!-- Mound of soil -->
    <ellipse cx="8" cy="15" rx="14" ry="7" fill="#78350f" />
    <!-- Stem & leaves -->
    <path d="M8 15 L 8 -5" stroke="#16a34a" stroke-width="3" stroke-linecap="round" />
    <path d="M8 0 Q 3 -5, 8 -10 Q 13 -5, 8 0" fill="#4ade80" />
    <path d="M8 5 Q 14 0, 15 8 Q 10 10, 8 5" fill="#22c55e" />
  </g>

  <!-- Character 2: Young Man Holding Watering Can / Recycling Sign vibe -->
  <g transform="translate(155, 110)">
    <!-- Shadow -->
    <ellipse cx="20" cy="65" rx="15" ry="5" fill="#022c22" opacity="0.6" />

    <!-- Standing Legs -->
    <path d="M12 40 L 10 63" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <path d="M25 40 L 28 63" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <!-- Shoes -->
    <rect x="6" y="61" width="8" height="4" rx="2" fill="#334155" />
    <rect x="24" y="61" width="9" height="4" rx="2" fill="#334155" />

    <!-- Torso (Green eco-shirt) -->
    <path d="M10 20 L 30 20 L 32 45 L 8 45 Z" fill="#10b981" />

    <!-- Head & Face -->
    <circle cx="20" cy="10" r="9" fill="#fde68a" />
    <!-- Hair -->
    <path d="M11 8 Q 20 0, 29 8 Q 25 3, 15 3 Z" fill="#451a03" />

    <!-- Arms holding Watering Can -->
    <path d="M10 25 Q 0 30, -5 25" stroke="#fde68a" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M28 25 Q 38 30, 42 22" stroke="#fde68a" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Watering Can Prop -->
    <g transform="translate(-15, 15)">
      <rect x="0" y="5" width="14" height="12" rx="3" fill="#38bdf8" />
      <!-- Spout -->
      <path d="M14 8 L 22 2" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <!-- Handle -->
      <path d="M0 8 Q -4 10, 0 14" stroke="#0284c7" stroke-width="2" fill="none" />
      <!-- Water drops falling toward sapling -->
      <circle cx="24" cy="5" r="1.5" fill="#38bdf8" opacity="0.8" />
      <circle cx="28" cy="10" r="1.5" fill="#38bdf8" opacity="0.8" />
      <circle cx="32" cy="16" r="2" fill="#38bdf8" opacity="0.8" />
    </g>
  </g>

  <!-- Eco-Friendly Details: Floating Green Leaves (Symbolizing clean environment) -->
  <g fill="#34d399" opacity="0.8">
    <path d="M 60 70 Q 65 60, 70 70 Q 65 80, 60 70 Z" transform="rotate(25 65 70)" />
    <path d="M 140 50 Q 144 42, 148 50 Q 144 58, 140 50 Z" transform="rotate(-15 144 50)" />
    <path d="M 110 85 Q 113 78, 116 85 Q 113 92, 110 85 Z" transform="rotate(45 113 85)" />
  </g>

  <!-- Foreground Grass blades for depth -->
  <g stroke="#059669" stroke-width="2" stroke-linecap="round">
    <line x1="2" y1="200" x2="5" y2="185" />
    <line x1="8" y1="205" x2="12" y2="190" />
    <line x1="230" y1="210" x2="228" y2="195" />
    <line x1="235" y1="205" x2="236" y2="190" />
  </g>

  <!-- Subtle framing border/glow -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />
</svg>