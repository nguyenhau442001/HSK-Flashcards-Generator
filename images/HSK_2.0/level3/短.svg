<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <radialGradient id="sunGlow" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Road Surface Gradient -->
    <linearGradient id="roadGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Building Gradient Left -->
    <linearGradient id="bldgLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Building Gradient Right -->
    <linearGradient id="bldgRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Drop Shadow for Characters/Objects -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />

  <!-- Stars / City Glow Environment -->
  <circle cx="40" cy="40" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="85" cy="25" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="130" cy="50" r="1" fill="#94a3b8" opacity="0.5"/>
  <circle cx="190" cy="30" r="1.2" fill="#f8fafc" opacity="0.7"/>

  <!-- Distant City Skyline Silhouette -->
  <path d="M0 120 L20 120 L20 90 L35 90 L35 120 L60 120 L60 75 L80 75 L80 120 L110 120 L110 85 L130 85 L130 120 L160 120 L160 95 L180 95 L180 120 L210 120 L210 80 L240 80 L240 160 L0 160 Z" fill="#0f172a" opacity="0.8" />

  <!-- Warm Street Lamp Glow (Top Right) -->
  <circle cx="200" cy="95" r="25" fill="#fbbf24" opacity="0.15" />
  <path d="M198 75 L202 75 L204 115 L196 115 Z" fill="#64748b" />
  <circle cx="200" cy="75" r="3" fill="#fbbf24" />

  <!-- SCENE: "这条路很短" (This road is very short) -->
  <!-- Context: A short, charming urban alleyway connecting two main streets, clearly framed from end to end -->

  <!-- Left Building (Foreground/Midground) -->
  <path d="M0 150 L50 135 L50 240 L0 240 Z" fill="url(#bldgLeft)" />
  <!-- Windows on Left Building -->
  <rect x="15" y="148" width="10" height="15" rx="2" fill="#fbbf24" opacity="0.8" />
  <rect x="30" y="144" width="10" height="15" rx="2" fill="#38bdf8" opacity="0.6" />
  <rect x="15" y="175" width="10" height="15" rx="2" fill="#38bdf8" opacity="0.6" />
  <rect x="30" y="171" width="10" height="15" rx="2" fill="#fbbf24" opacity="0.8" />

  <!-- Right Building (Foreground/Midground) -->
  <path d="M190 135 L240 150 L240 240 L190 240 Z" fill="url(#bldgRight)" />
  <!-- Windows on Right Building -->
  <rect x="200" y="148" width="10" height="15" rx="2" fill="#fbbf24" opacity="0.8" />
  <rect x="215" y="144" width="10" height="15" rx="2" fill="#fbbf24" opacity="0.8" />
  <rect x="200" y="175" width="10" height="15" rx="2" fill="#38bdf8" opacity="0.6" />
  <rect x="215" y="171" width="10" height="15" rx="2" fill="#fbbf24" opacity="0.9" />

  <!-- THE SHORT ROAD (Perspective ground plane) -->
  <polygon points="50,135 190,135 240,240 0,240" fill="url(#roadGrad)" />

  <!-- Pavement / Sidewalk borders -->
  <polygon points="50,135 60,135 30,240 0,240" fill="#475569" />
  <polygon points="190,135 180,135 210,240 240,240" fill="#475569" />

  <!-- Road markings (Dashed center line indicating the short distance) -->
  <line x1="120" y1="145" x2="120" y2="155" stroke="#f8fafc" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="120" y1="170" x2="120" y2="185" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4,4" opacity="0.7" />
  <line x1="120" y1="205" x2="120" y2="225" stroke="#f8fafc" stroke-width="2" stroke-dasharray="5,5" opacity="0.7" />

  <!-- Decorative potted plants / shrubs on the sides to enhance real-world feel -->
  <circle cx="55" cy="142" r="5" fill="#10b981" filter="url(#shadow)" />
  <circle cx="58" cy="140" r="4" fill="#34d399" />
  <rect x="53" y="145" width="4" height="5" fill="#cbd5e1" />

  <circle cx="185" cy="142" r="5" fill="#10b981" filter="url(#shadow)" />
  <circle cx="182" cy="140" r="4" fill="#34d399" />
  <rect x="183" y="145" width="4" height="5" fill="#cbd5e1" />

  <!-- CHARACTER 1: Pointing & Smiling (Tourist/Hiker realizing how short the path is) -->
  <g transform="translate(85, 145)" filter="url(#shadow)">
    <!-- Shadow on ground -->
    <ellipse cx="5" cy="45" rx="8" ry="3" fill="#0f172a" opacity="0.5"/>
    <!-- Legs -->
    <rect x="1" y="28" width="4" height="18" fill="#1e293b" />
    <rect x="6" y="28" width="4" height="18" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="2" cy="46" rx="3" ry="1.5" fill="#f8fafc"/>
    <ellipse cx="8" cy="46" rx="3" ry="1.5" fill="#f8fafc"/>
    <!-- Body / Jacket -->
    <path d="M0 12 L10 12 L12 30 L-2 30 Z" fill="#38bdf8" />
    <path d="M5 12 L5 30" stroke="#0284c7" stroke-width="1.5" />
    <!-- Head -->
    <circle cx="5" cy="6" r="6" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M-1 4 C0 1 10 1 11 4 C10 2 0 2 -1 4 Z" fill="#b45309" />
    <!-- Arm pointing forward towards the end of the road -->
    <path d="M10 15 L22 12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="22" cy="12" r="2" fill="#fcd34d" />
    <!-- Other arm -->
    <path d="M0 15 L-4 22" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- CHARACTER 2: Walking companion / Friend looking surprised/amused -->
  <g transform="translate(140, 155)" filter="url(#shadow)">
    <!-- Shadow on ground -->
    <ellipse cx="5" cy="45" rx="8" ry="3" fill="#0f172a" opacity="0.5"/>
    <!-- Legs -->
    <rect x="2" y="28" width="4" height="18" fill="#b45309" />
    <rect x="8" y="28" width="4" height="18" fill="#b45309" />
    <!-- Shoes -->
    <ellipse cx="3" cy="46" rx="3" ry="1.5" fill="#1e293b"/>
    <ellipse cx="9" cy="46" rx="3" ry="1.5" fill="#1e293b"/>
    <!-- Body / Sweater -->
    <path d="M1 12 L11 12 L13 30 L-1 30 Z" fill="#ec4899" />
    <!-- Head -->
    <circle cx="6" cy="6" r="6" fill="#fcd34d" />
    <!-- Hair (Ponytail) -->
    <path d="M0 4 C1 -1 11 -1 12 3 C9 0 2 0 0 4 Z" fill="#1e293b" />
    <circle cx="13" cy="4" r="2" fill="#1e293b" />
    <!-- Arms in gesture of amazement / realization -->
    <path d="M2 15 L-3 12" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
    <path d="M10 15 L15 12" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Visual Distance Indicator Graphic (Subtle context element floating above the road) -->
  <g transform="translate(95, 110)" opacity="0.85">
    <line x1="0" y1="5" x2="50" y2="5" stroke="#fbbf24" stroke-width="2" stroke-dasharray="2,2"/>
    <circle cx="0" cy="5" r="3" fill="#fbbf24"/>
    <circle cx="50" cy="5" r="3" fill="#fbbf24"/>
    <!-- Small bracket indicating "short" span -->
    <path d="M0 0 L0 5 L50 5 L50 0" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Atmospheric Elements (Soft glowing particles / dust in the evening air) -->
  <circle cx="70" cy="180" r="1.5" fill="#fbbf24" opacity="0.6" />
  <circle cx="160" cy="190" r="1" fill="#38bdf8" opacity="0.7" />
  <circle cx="110" cy="220" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="30" cy="210" r="1.5" fill="#38bdf8" opacity="0.4" />

  <!-- Interior Ambient Warm Glow from Shop Windows along the alley -->
  <path d="M50 160 L50 190 L53 190 L53 160 Z" fill="#fbbf24" opacity="0.4" />
  <path d="M187 160 L187 190 L190 190 L190 160 Z" fill="#fbbf24" opacity="0.4" />

  <!-- Outer frame border accent for clean HSK app card look -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>