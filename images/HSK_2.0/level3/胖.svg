<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Glow for Interior Room -->
    <radialGradient id="roomGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Cat Fur Gradient -->
    <linearGradient id="catBody" x1="30%" y1="20%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior & Atmosphere -->
  <rect width="240" height="240" rx="24" fill="url(#roomGlow)" />
  
  <!-- Wallpaper details / subtle window light beam -->
  <polygon points="120,0 240,0 240,200 80,200" fill="#38bdf8" opacity="0.03" />

  <!-- Wooden Floor Base -->
  <path d="M 0 175 L 240 175 L 240 240 L 0 240 Z" fill="url(#floorGrad)" />
  <line x1="0" y1="175" x2="240" y2="175" stroke="#334155" stroke-width="2" />
  <!-- Floor planks perspective lines -->
  <line x1="120" y1="175" x2="60" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.5" />
  <line x1="120" y1="175" x2="180" y2="240" stroke="#1e293b" stroke-width="1.5" opacity="0.5" />

  <!-- Background Environment Props -->
  <!-- Cozy Plant in Pot -->
  <g transform="translate(35, 115)">
    <!-- Pot -->
    <path d="M 5 30 L 15 60 C 15 60, 25 62, 35 60 L 45 30 Z" fill="#64748b" />
    <ellipse cx="25" cy="30" rx="20" ry="5" fill="#475569" />
    <!-- Plant Leaves -->
    <path d="M 25 30 Q 10 5, 0 15 Q -5 25, 15 30" fill="#10b981" />
    <path d="M 25 30 Q 30 -2, 45 10 Q 55 20, 35 30" fill="#34d399" />
    <path d="M 25 30 Q 25 -10, 22 -15 Q 15 -10, 25 30" fill="#059669" />
  </g>

  <!-- Floor Cushion / Rug -->
  <ellipse cx="120" cy="185" rx="75" ry="22" fill="#334155" filter="url(#softShadow)" />
  <ellipse cx="120" cy="183" rx="70" ry="19" fill="#1e293b" />
  <ellipse cx="120" cy="183" rx="64" ry="16" fill="#38bdf8" opacity="0.15" />
  <!-- Rug stitching details -->
  <ellipse cx="120" cy="183" rx="60" ry="14" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />

  <!-- MAIN SUBJECT: The extremely chubby, round cat (representing "胖" / plump, heavy, chubby) -->
  <g transform="translate(120, 160)" filter="url(#softShadow)">
    
    <!-- Cat Shadow beneath -->
    <ellipse cx="0" cy="22" rx="55" ry="10" fill="#090d16" opacity="0.6" />

    <!-- Back / Body (Oversized, ultra-round) -->
    <!-- We use massive radii to emphasize being 'pàng' (béo, mập) -->
    <ellipse cx="0" cy="-10" rx="58" ry="46" fill="url(#catBody)" />

    <!-- Chubby Belly bulge overlapping forward -->
    <ellipse cx="0" cy="4" rx="52" ry="38" fill="#fef08a" opacity="0.3" />

    <!-- Chubby Cheeks & Head integrated into the massive round body -->
    <circle cx="-32" cy="-28" r="22" fill="#fbbf24" />
    <circle cx="32" cy="-28" r="22" fill="#fbbf24" />
    <circle cx="0" cy="-22" r="38" fill="url(#catBody)" />

    <!-- Cat Ears -->
    <polygon points="-48,-38 -32,-62 -18,-42" fill="#f59e0b" stroke="#d97706" stroke-width="2" stroke-linejoin="round" />
    <polygon points="-44,-40 -32,-56 -22,-42" fill="#fda4af" />

    <polygon points="18,-42 32,-62 48,-38" fill="#f59e0b" stroke="#d97706" stroke-width="2" stroke-linejoin="round" />
    <polygon points="22,-42 32,-56 44,-40" fill="#fda4af" />

    <!-- Cute Fat Cheeks / Whisker Pads -->
    <ellipse cx="-22" cy="-12" rx="14" ry="10" fill="#fef3c7" />
    <ellipse cx="22" cy="-12" rx="14" ry="10" fill="#fef3c7" />

    <!-- Closed Happy / Content Eyes (Arcs) -->
    <path d="M -28 -22 Q -22 -28 -16 -22" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 16 -22 Q 22 -28 28 -22" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />

    <!-- Tiny Content Cat Mouth & Nose -->
    <polygon points="0,-16 -4,-21 4,-21" fill="#e11d48" />
    <path d="M -3 -14 Q 0 -10 3 -14" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Whiskers -->
    <line x1="-36" y1="-14" x2="-52" y2="-17" stroke="#1e293b" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="-36" y1="-10" x2="-54" y2="-11" stroke="#1e293b" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="36" y1="-14" x2="52" y2="-17" stroke="#1e293b" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="36" y1="-10" x2="54" y2="-11" stroke="#1e293b" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Extremely Stubby Paws (Too fat to reach far!) -->
    <!-- Front Left Paw -->
    <ellipse cx="-34" cy="18" rx="12" ry="9" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <line x1="-38" y1="21" x2="-38" y2="24" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
    <line x1="-32" y1="21" x2="-32" y2="24" stroke="#d97706" stroke-width="2" stroke-linecap="round" />

    <!-- Front Right Paw -->
    <ellipse cx="34" cy="18" rx="12" ry="9" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <line x1="32" y1="21" x2="32" y2="24" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
    <line x1="38" y1="21" x2="38" y2="24" stroke="#d97706" stroke-width="2" stroke-linecap="round" />

    <!-- Chubby Tiger Stripes on Forehead -->
    <path d="M 0 -38 L -4 -48 L 0 -44 L 4 -48 Z" fill="#d97706" />
    <path d="M -12 -34 L -20 -42" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 -34 L 20 -42" stroke="#d97706" stroke-width="3" stroke-linecap="round" />

    <!-- Back Chubby Tail curling around -->
    <path d="M 50 10 Q 75 15 65 0 Q 55 -15 62 -25" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />
    <path d="M 50 10 Q 75 15 65 0 Q 55 -15 62 -25" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Foreground Props: Food Bowl overflowing (Context for getting 'béo, mập') -->
  <g transform="translate(55, 175)" filter="url(#softShadow)">
    <!-- Cat Bowl -->
    <path d="M 5 15 L 15 35 C 15 35, 25 37, 35 35 L 45 15 Z" fill="#ec4899" />
    <ellipse cx="25" cy="15" rx="20" ry="6" fill="#f472b6" />
    <ellipse cx="25" cy="15" rx="16" ry="4" fill="#78350f" />
    <!-- Overflowing fish kibble / treats -->
    <circle cx="20" cy="12" r="4" fill="#b45309" />
    <circle cx="30" cy="13" r="4.5" fill="#92400e" />
    <circle cx="25" cy="9" r="3.5" fill="#b45309" />
    <!-- Little fish biscuit icon representation -->
    <path d="M 10 10 Q 15 5 20 12 Q 15 15 10 10 Z" fill="#d97706" />
  </g>

  <!-- Floating Scale / Weight context elements (subtle narrative details) -->
  <g transform="translate(180, 150)" filter="url(#softShadow)">
    <!-- Floor Scale -->
    <rect x="-22" y="10" width="44" height="12" rx="4" fill="#334155" stroke="#475569" stroke-width="2" />
    <rect x="-16" y="13" width="32" height="6" rx="2" fill="#0f172a" />
    <!-- Digital glowing readout (no numbers/text, just friendly abstract dashes/dots) -->
    <circle cx="-5" cy="16" r="1.5" fill="#38bdf8" />
    <circle cx="0" cy="16" r="1.5" fill="#38bdf8" />
    <circle cx="5" cy="16" r="1.5" fill="#ef4444" /> <!-- High weight indicator glow! -->
    <!-- Upward rising steam / visual weight emphasis lines -->
    <path d="M 0 5 Q 5 -2 0 -10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    <path d="M -10 8 Q -5 2 -10 -5" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Ambient lighting highlights -->
  <circle cx="120" cy="40" r="1.5" fill="#ffffff" opacity="0.6" filter="url(#subtleGlow)" />
  <circle cx="45" cy="60" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="200" cy="90" r="1.5" fill="#ffffff" opacity="0.5" />
</svg>