<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <!-- River glow & flow -->
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="motherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    
    <linearGradient id="childGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Distant Pagoda/Temple silhouette referencing Chinese cultural heritage -->
  <g opacity="0.4" fill="#64748b">
    <polygon points="195,115 205,115 200,100" />
    <rect x="197" y="115" width="6" height="15" />
    <path d="M190,130 L210,130 L208,135 L192,135 Z" />
    <rect x="196" y="135" width="8" height="15" />
  </g>

  <!-- Rolling Background Mountains -->
  <path d="M-10,140 Q40,90 90,120 T190,105 Q220,115 250,130 L250,250 L-10,250 Z" fill="url(#mountainGrad)" />
  
  <!-- The Great Yellow River curving majestically through the landscape representing 'Mother River' -->
  <path d="M -10,160 Q 60,130 110,165 T 250,150 L 250,210 Q 180,215 110,185 T -10,210 Z" fill="url(#riverGrad)" opacity="0.9" />
  
  <!-- River sparkling highlights -->
  <path d="M 40,155 Q 60,145 80,155" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 140,180 Q 160,170 180,182" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 90,170 Q 100,163 115,172" stroke="#fef3c7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Foreground Cliff / Earth bank -->
  <path d="M-10,240 L-10,190 Q45,185 85,210 T250,195 L250,240 Z" fill="#0f172a" />

  <!-- Traditional Terraced Greenery / Fields near the river -->
  <path d="M10,225 Q50,210 90,220" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M20,233 Q60,218 100,228" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Mother and Child (symbolizing "母亲河" - Mother River concept intimately) -->
  <g transform="translate(115, 142)">
    <!-- Mother figure looking out lovingly -->
    <!-- Mother body/dress -->
    <path d="M 12,30 C 12,20 22,12 32,15 C 42,18 48,25 50,45 L 55,70 L 5,70 L 8,45 Z" fill="url(#motherGrad)" />
    <!-- Mother head & hair -->
    <circle cx="30" cy="8" r="8" fill="#fcd34d" />
    <path d="M 22,6 C 24,1 36,1 38,6 C 36,9 24,9 22,6 Z" fill="#1e293b" />
    <!-- Mother arm pointing to the grand river -->
    <path d="M 42,28 Q 55,25 62,35" stroke="#fb7185" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Child figure looking up -->
    <!-- Child body -->
    <path d="M -15,40 C -15,32 -8,28 0,30 C 8,32 12,38 14,50 L 18,70 L -25,70 L -20,50 Z" fill="url(#childGrad)" />
    <!-- Child head & hair -->
    <circle cx="-3" cy="20" r="6.5" fill="#fcd34d" />
    <path d="M -9,18 C -8,14 3,14 3,18 Z" fill="#1e293b" />
    <!-- Child raised arm pointing/reaching -->
    <path d="M 5,32 Q 18,25 22,18" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Warm atmospheric glow / Sun or lantern motif -->
  <circle cx="50" cy="65" r="22" fill="#fbbf24" opacity="0.15" />
  <circle cx="50" cy="65" r="14" fill="#f59e0b" opacity="0.25" />

  <!-- Foreground decorative cultural elements (Traditional railing / bridge post) -->
  <g fill="#334155">
    <rect x="195" y="180" width="6" height="40" rx="2" />
    <circle cx="198" cy="177" r="4" fill="#475569" />
    <rect x="225" y="185" width="6" height="35" rx="2" />
    <circle cx="228" cy="182" r="4" fill="#475569" />
    <path d="M 198,188 L 228,193" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 198,202 L 228,207" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Soft floating birds in the sky to add scale and life -->
  <path d="M 75,55 Q 80,48 85,55 Q 90,48 95,55" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 115,40 Q 118,35 122,40 Q 126,35 130,40" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5" />

</svg>