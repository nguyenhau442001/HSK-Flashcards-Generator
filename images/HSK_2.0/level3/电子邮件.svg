<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Ambient lighting from screen -->
  <circle cx="150" cy="120" r="80" fill="#38bdf8" opacity="0.08" filter="blur(20px)"/>
  
  <!-- Environment & Room Context -->
  <rect x="20" y="20" width="200" height="180" rx="16" fill="#1e293b" opacity="0.6"/>
  
  <!-- Window with night city vibe -->
  <path d="M35 45 H85 V105 H35 Z" fill="#090d16" rx="4"/>
  <path d="M45 55 h12 v15 h-12 z" fill="#f59e0b" opacity="0.6"/>
  <path d="M65 75 h15 v20 h-15 z" fill="#38bdf8" opacity="0.4"/>
  <path d="M45 80 h12 v15 h-12 z" fill="#f59e0b" opacity="0.4"/>
  
  <!-- Indoor Plant for warmth -->
  <path d="M30 175 c0-15 10-25 10-25 s10 10 10 25 z" fill="#10b981" opacity="0.8"/>
  <path d="M35 155 c5-10 12-15 12-15 s6 8 0 18 z" fill="#34d399" opacity="0.8"/>
  <rect x="33" y="175" width="14" height="16" rx="3" fill="#fb923c"/>
  
  <!-- Desk Surface -->
  <path d="M20 180 L220 180 V195 H20 Z" fill="#334155"/>
  <rect x="15" y="195" width="210" height="6" rx="3" fill="#475569"/>

  <!-- Physical Documents / Files (representing '文件' to be sent) -->
  <g transform="translate(45, 155) rotate(-8)">
    <rect width="36" height="45" rx="3" fill="#f8fafc"/>
    <rect x="6" y="8" width="20" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="6" y="15" width="24" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="6" y="22" width="16" height="3" rx="1.5" fill="#cbd5e1"/>
    <circle cx="26" cy="35" r="4" fill="#ef4444" opacity="0.8"/>
  </g>
  <g transform="translate(60, 160) rotate(5)">
    <rect width="36" height="45" rx="3" fill="#e2e8f0"/>
    <rect x="6" y="8" width="22" height="3" rx="1.5" fill="#94a3b8"/>
    <rect x="6" y="15" width="14" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Laptop (Modern Workstation) -->
  <path d="M110 145 H190 L205 180 H95 Z" fill="#64748b"/>
  <path d="M115 90 H185 V145 H115 Z" fill="#cbd5e1" rx="4"/>
  <path d="M120 95 H180 V138 H120 Z" fill="#0f172a"/>

  <!-- Screen UI: Email Composition & Action (电子邮件 concept) -->
  <!-- Email Window Header -->
  <rect x="126" y="102" width="48" height="6" rx="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="130" cy="105" r="1.5" fill="#ef4444"/>
  <circle cx="135" cy="105" r="1.5" fill="#f59e0b"/>
  <circle cx="140" cy="105" r="1.5" fill="#10b981"/>

  <!-- Email Attachment Icon inside Screen -->
  <rect x="130" y="113" width="40" height="20" rx="3" fill="#1e293b"/>
  <path d="M142 123 l6 -6 a3 3 0 0 1 4 4 l-7 7 a1.5 1.5 0 0 1 -2 -2 l5 -5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Send Button / Action glowing indicator -->
  <rect x="156" y="113" width="10" height="8" rx="2" fill="#10b981"/>
  <path d="M158 117 l2 1.5 l3 -3" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Flying Data / Email Transmission Stream (Visualizing sending '电子邮件') -->
  <path d="M150 115 Q 110 90, 80 110 T 40 90" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.9"/>
  
  <!-- Mini Envelope Icon flying towards destination -->
  <g transform="translate(85, 95) rotate(-15)">
    <rect width="18" height="12" rx="2" fill="#fbbf24"/>
    <path d="M1 2 l8 6 l8 -6" stroke="#d97706" stroke-width="1.5" fill="none"/>
  </g>
  <g transform="translate(45, 110) rotate(-35)">
    <rect width="14" height="10" rx="2" fill="#38bdf8"/>
    <path d="M1 2 l6 4 l6 -4" stroke="#0284c7" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Human Character (Colleague / Sender pointing at screen/docs) -->
  <!-- Torso & Shoulders -->
  <path d="M100 180 C100 155, 120 150, 120 150 C120 150, 140 155, 140 180 Z" fill="#6366f1"/>
  
  <!-- Neck & Head -->
  <rect x="114" y="132" width="12" height="22" fill="#fcd34d"/>
  <circle cx="120" cy="120" r="16" fill="#fcd34d"/>
  
  <!-- Hair -->
  <path d="M104 115 c2-12, 12-16, 20-16 c10 0, 14 6, 16 14 c-3 2-8 1-12 1 c-8 0-14 3-24 1z" fill="#334155"/>
  
  <!-- Expressive Face & Gesture (Requesting/Instructing Action) -->
  <circle cx="115" cy="118" r="1.5" fill="#1e293b"/>
  <circle cx="127" cy="118" r="1.5" fill="#1e293b"/>
  <!-- Smile -->
  <path d="M118 126 q3 2 6 0" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Pointing Arm (Instructing: "Please send this document via email") -->
  <path d="M125 155 L95 142 L90 148 L115 165 Z" fill="#fcd34d"/>
  <!-- Hand pointing down at files -->
  <circle cx="88" cy="150" r="4" fill="#fcd34d"/>
  
  <!-- Additional warm lighting accent on character -->
  <path d="M110 110 c-5 5-5 15 0 20" stroke="#fbbf24" stroke-width="1.5" opacity="0.5" fill="none" filter="blur(2px)"/>
</svg>