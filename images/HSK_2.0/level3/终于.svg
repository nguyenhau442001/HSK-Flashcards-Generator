<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Mountain Gradient - Peak Achieved -->
    <linearGradient id="mountainPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Mountain Gradient - Back Range -->
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Golden Hour Glow -->
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Flag Gradient -->
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting & Stars -->
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)" />
  <circle cx="45" cy="50" r="1" fill="#94a3b8" opacity="0.6" />
  <circle cx="85" cy="30" r="1.5" fill="#e2e8f0" opacity="0.8" />
  <circle cx="130" cy="45" r="1" fill="#94a3b8" opacity="0.4" />
  <circle cx="30" cy="90" r="1.2" fill="#cbd5e1" opacity="0.5" />

  <!-- Distant Background Mountains -->
  <polygon points="10,200 80,110 160,200" fill="url(#mountainBack)" />
  <polygon points="90,200 170,95 240,200" fill="#1e293b" opacity="0.8" />

  <!-- Majestic Sun/Sunrise behind peak -->
  <circle cx="170" cy="80" r="28" fill="#fbbf24" opacity="0.9" />
  <circle cx="170" cy="80" r="34" fill="#f59e0b" opacity="0.3" />

  <!-- Main Foreground Mountain (Success Peak) -->
  <polygon points="40,200 145,60 230,200" fill="url(#mountainPeak)" />
  <!-- Mountain Shadow Side -->
  <polygon points="145,60 230,200 145,200" fill="#0284c7" opacity="0.3" />

  <!-- Rocky Textures & Snow Cap at the Summit -->
  <path d="M145,60 L130,85 L138,90 L145,80 L155,95 L165,82 L145,60 Z" fill="#f8fafc" opacity="0.9" />
  <path d="M110,130 L125,120 L135,140 Z" fill="#0284c7" opacity="0.2" />
  <path d="M170,120 L185,145 L160,150 Z" fill="#0284c7" opacity="0.3" />

  <!-- Trail / Path leading up to the summit -->
  <path d="M70,200 Q100,170 120,150 Q135,135 142,100" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M70,200 Q100,170 120,150 Q135,135 142,100" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8" />

  <!-- Summit Flag & Pole (The Goal Reached - "Finally") -->
  <line x1="145" y1="60" x2="145" y2="30" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <!-- Waving Victory Flag -->
  <path d="M145,30 L175,38 L160,46 L175,54 L145,46 Z" fill="url(#flagGrad)" />
  <path d="M145,30 L175,38 L160,46 L175,54 L145,46 Z" fill="#000000" opacity="0.1" />

  <!-- Triumphant Climber Silhouette / Details at the Summit -->
  <!-- Climber Body -->
  <circle cx="132" cy="74" r="5" fill="#f8fafc" />
  <path d="M132,79 L130,95 L124,105" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M132,79 L138,95 L144,103" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arms raised in victory -->
  <path d="M127,82 L118,72" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <path d="M137,82 L146,70" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <!-- Backpack -->
  <rect x="127" y="78" width="4" height="8" rx="2" fill="#fb923c" />

  <!-- Confetti / Success Sparkles for "Finally Achieved" -->
  <circle cx="110" cy="50" r="2.5" fill="#38bdf8" />
  <circle cx="185" cy="55" r="2" fill="#fbbf24" />
  <circle cx="160" cy="22" r="2.5" fill="#ec4899" />
  <circle cx="125" cy="30" r="1.5" fill="#10b981" />
  <path d="M95,65 L98,68 L95,71 L92,68 Z" fill="#fbbf24" />
  <path d="M195,85 L198,88 L195,91 L192,88 Z" fill="#38bdf8" />

  <!-- Foreground Atmospheric Hills/Rocks (Framing) -->
  <path d="M0,220 Q40,195 90,210 Q160,230 240,205 L240,240 L0,240 Z" fill="#0f172a" />
  <path d="M0,228 Q70,210 140,225 Q200,238 240,220 L240,240 L0,240 Z" fill="#090d16" />

  <!-- Compass / Goal Marker Icon embedded in landscape subtle detail -->
  <circle cx="210" cy="190" r="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <polygon points="210,181 213,190 210,199 207,190" fill="#ec4899" />
  <polygon points="210,199 213,190 210,181 207,190" fill="#38bdf8" opacity="0.5" />
  <circle cx="210" cy="190" r="2" fill="#f8fafc" />

  <!-- Outer Border / Frame Stroke to match design system -->
  <rect x="0.5" y="0.5" width="239" height="239" rx="23.5" fill="none" stroke="#334155" stroke-width="1" opacity="0.4" />
</svg>