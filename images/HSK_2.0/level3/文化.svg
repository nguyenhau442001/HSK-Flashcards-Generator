<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting & Elements -->
  <circle cx="120" cy="110" r="90" fill="url(#lanternGlow)" />
  
  <!-- Traditional Chinese Pavilion Roof Silhouette in Background -->
  <path d="M 60,90 Q 120,70 180,90 L 195,105 Q 120,95 45,105 Z" fill="#334155" opacity="0.6"/>
  <path d="M 75,72 Q 120,58 165,72 L 175,85 Q 120,75 65,85 Z" fill="#334155" opacity="0.6"/>

  <!-- Hanging Red Lanterns (Atmosphere) -->
  <g>
    <!-- Left Lantern -->
    <line x1="45" y1="20" x2="45" y2="50" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 35,50 Q 45,45 55,50 L 52,75 Q 45,80 38,75 Z" fill="#ef4444" />
    <path d="M 38,75 L 45,85 L 52,75 Z" fill="#b91c1c" />
    
    <!-- Right Lantern -->
    <line x1="195" y1="20" x2="195" y2="50" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 185,50 Q 195,45 205,50 L 202,75 Q 195,80 188,75 Z" fill="#ef4444" />
    <path d="M 188,75 L 195,85 L 202,75 Z" fill="#b91c1c" />
  </g>

  <!-- MAIN SCENE: Traditional Cultural Heritage Elements (Tea, Scroll, Porcelain, Architecture) -->

  <!-- Wooden Table Surface -->
  <path d="M 20,185 L 220,185 L 210,215 L 30,215 Z" fill="url(#woodGrad)" />
  <path d="M 20,185 L 220,185 L 225,190 L 15,190 Z" fill="#b45309" /> <!-- Table Edge Highlight -->
  
  <!-- Left Prop: Traditional Tea Set (Ceramic Teapot & Cup) -->
  <g transform="translate(45, 140)">
    <!-- Saucer -->
    <ellipse cx="20" cy="42" rx="18" ry="5" fill="#cbd5e1" />
    <!-- Teacup -->
    <path d="M 10,30 Q 12,42 20,42 Q 28,42 30,30 Z" fill="#e2e8f0" />
    <ellipse cx="20" cy="30" rx="10" ry="3" fill="#047857" />
    
    <!-- Teapot -->
    <path d="M 50,15 Q 65,10 70,25 Q 75,40 55,42 Q 35,40 40,25 Q 45,10 50,15 Z" fill="url(#teaGrad)" />
    <!-- Lid -->
    <ellipse cx="50" cy="14" rx="8" ry="3" fill="#065f46" />
    <circle cx="50" cy="10" r="2.5" fill="url(#goldGrad)" />
    <!-- Spout -->
    <path d="M 70,20 Q 82,15 84,10" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    <!-- Handle -->
    <path d="M 38,25 Q 28,30 36,38" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Center Prop: Majestic Traditional Chinese Arch (Paifang/Architecture) & Handscroll -->
  <!-- Handscroll Base on Table -->
  <g transform="translate(75, 160)">
    <!-- Scroll Left Rolled End -->
    <ellipse cx="10" cy="12" rx="5" ry="12" fill="url(#goldGrad)" />
    <rect x="7" y="0" width="6" height="24" fill="#b45309" />
    
    <!-- Scroll Right Rolled End -->
    <ellipse cx="80" cy="12" rx="5" ry="12" fill="url(#goldGrad)" />
    <rect x="77" y="0" width="6" height="24" fill="#b45309" />

    <!-- Open Paper Part showing brush strokes (Art/Calligraphy motif) -->
    <rect x="12" y="2" width="66" height="20" fill="#fef3c7" />
    <!-- Abstract Calligraphy / Painting Strokes on Scroll -->
    <path d="M 22,12 Q 30,6 38,15" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 45,8 Q 52,18 62,10" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
    <circle cx="68" cy="12" r="3" fill="#dc2626" />
  </g>

  <!-- Right Prop: Chinese Blue and White Porcelain Vase with Plum Blossoms -->
  <g transform="translate(160, 115)">
    <!-- Vase Body -->
    <path d="M 18,25 Q 8,40 12,55 Q 16,70 20,70 L 30,70 Q 34,70 38,55 Q 42,40 32,25 Z" fill="#f8fafc" />
    <!-- Vase Neck & Rim -->
    <rect x="20" y="16" width="10" height="9" fill="#f8fafc" />
    <ellipse cx="25" cy="16" rx="6" ry="2" fill="#e2e8f0" />
    
    <!-- Porcelain Blue Decorative Patterns -->
    <path d="M 13,38 Q 25,45 37,38" fill="none" stroke="#2563eb" stroke-width="3" opacity="0.8" />
    <path d="M 16,52 Q 25,58 34,52" fill="none" stroke="#2563eb" stroke-width="3" opacity="0.8" />
    <circle cx="25" cy="45" r="4" fill="none" stroke="#2563eb" stroke-width="2" />

    <!-- Plum Blossom Branches Emerging from Vase -->
    <path d="M 25,16 Q 15,0 5,-10" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 20,8 Q 30,-2 38,-12" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    
    <!-- Pink/White Plum Blossom Petals -->
    <circle cx="5" cy="-10" r="4" fill="#f472b6" />
    <circle cx="2" cy="-14" r="3" fill="#fbcfe8" />
    <circle cx="9" cy="-7" r="3.5" fill="#f472b6" />
    
    <circle cx="38" cy="-12" r="4" fill="#f472b6" />
    <circle cx="42" cy="-15" r="3" fill="#fbcfe8" />
    <circle cx="34" cy="-9" r="3.5" fill="#f472b6" />
    <circle cx="25" cy="-5" r="3.5" fill="#f472b6" />
  </g>

  <!-- Central Hero Element: Traditional Chinese Architecture Gable/Roof Floating subtly as a cultural emblem -->
  <g transform="translate(120, 75)">
    <!-- Multi-tiered traditional roof structure -->
    <path d="M -45,15 Q 0,-5 45,15 L 55,25 Q 0,10 -55,25 Z" fill="url(#roofGrad)" />
    <path d="M -30,0 Q 0,-15 30,0 L 36,8 Q 0,-3 -36,8 Z" fill="url(#roofGrad)" />
    
    <!-- Golden Ornamental Ridge/Finial -->
    <path d="M -8,-15 Q 0,-25 8,-15 Z" fill="url(#goldGrad)" />
    
    <!-- Supporting Bracket (Douogong style abstract aesthetic) -->
    <rect x="-12" y="25" width="24" height="6" fill="#b45309" rx="1" />
    <rect x="-20" y="22" width="40" height="3" fill="url(#goldGrad)" rx="1" />
  </g>

  <!-- Floating Cultural Symbols / Magic Accents (Represents Cultural Vibrancy) -->
  <g opacity="0.9">
    <!-- Glowing Accent Star/Sparkle 1 -->
    <path d="M 35,80 Q 35,90 25,90 Q 35,90 35,100 Q 35,90 45,90 Q 35,90 35,80 Z" fill="#fbbf24" />
    <!-- Glowing Accent Star/Sparkle 2 -->
    <path d="M 200,65 Q 200,72 193,72 Q 200,72 200,79 Q 200,72 207,72 Q 200,72 200,65 Z" fill="#38bdf8" />
    <!-- Floating Hand Fan (Traditional Cultural Artifact) -->
    <g transform="translate(170, 130) rotate(25)">
      <path d="M 0,0 L 20,-25 Q 30,-15 25,0 Z" fill="#ec4899" />
      <path d="M 0,0 L 10,-28 Q 20,-20 18,0 Z" fill="#f472b6" />
      <path d="M 0,0 L 0,-30 Q 10,-25 10,0 Z" fill="#fb7185" />
      <line x1="0" y1="0" x2="12" y2="-28" stroke="#831843" stroke-width="1" />
      <line x1="0" y1="0" x2="22" y2="-22" stroke="#831843" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#78350f" />
    </g>
  </g>

  <!-- Ambient Front Lighting Vignette -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
</svg>