<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glass Liquid Gradient (Fruit Punch/Tropical Drink) -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Smoothie Cup Gradient -->
    <linearGradient id="smoothieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#030712" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Glow from Drinks -->
  <circle cx="120" cy="130" r="60" fill="#fbbf24" opacity="0.12" filter="url(#glow)" />
  <circle cx="70" cy="140" r="40" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <!-- Background Cafe / Environment Elements -->
  <!-- Warm lights on the wall -->
  <circle cx="40" cy="60" r="3" fill="#fbbf24" opacity="0.6" />
  <circle cx="100" cy="40" r="2" fill="#fbbf24" opacity="0.4" />
  <circle cx="200" cy="50" r="4" fill="#fbbf24" opacity="0.5" />
  <circle cx="170" cy="80" r="2" fill="#38bdf8" opacity="0.4" />
  
  <!-- Wooden Wall Panel Line -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#0f172a" stroke-width="2" opacity="0.5" />

  <!-- Table Surface with Perspective -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="url(#tableGrad)" />
  <!-- Table Edge Highlight -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="1.5" opacity="0.8" />

  <!-- Tableware: Saucer/Coaster for smoothie -->
  <ellipse cx="70" cy="180" rx="30" ry="10" fill="#334155" filter="url(#dropShadow)" />
  <ellipse cx="70" cy="178" rx="28" ry="9" fill="#64748b" />

  <!-- Tableware: Wooden Coaster for tall glass -->
  <ellipse cx="150" cy="185" rx="36" ry="12" fill="#0f172a" filter="url(#dropShadow)" />
  <ellipse cx="150" cy="183" rx="34" ry="11" fill="#b45309" />
  <ellipse cx="150" cy="182" rx="30" ry="9" fill="#d97706" />

  <!-- ==========================================
       SUBJECT 1: TO-GO SMOOTHIE CUP (Left)
       ========================================== -->
  <g id="smoothieCup" filter="url(#dropShadow)">
    <!-- Cup Shadow on Table -->
    <ellipse cx="70" cy="178" rx="22" ry="6" fill="#030712" opacity="0.4" />

    <!-- Plastic Cup Body -->
    <path d="M 52 110 L 88 110 L 82 175 L 58 175 Z" fill="#ffffff" opacity="0.15" />
    <path d="M 52 110 L 88 110 L 82 175 L 58 175 Z" fill="url(#smoothieGrad)" opacity="0.85" />

    <!-- Smoothie Liquid Level -->
    <path d="M 55 125 L 85 125 L 82 175 L 58 175 Z" fill="url(#smoothieGrad)" />
    
    <!-- Whipped Cream Top -->
    <path d="M 48 110 C 48 102 58 100 64 105 C 70 98 80 100 82 108 C 88 106 92 112 88 116 L 52 116 C 48 114 48 110 48 110 Z" fill="#f8fafc" />
    <path d="M 60 107 C 62 103 70 103 72 107 C 75 103 82 106 80 112 L 56 112 C 54 107 60 107 60 107 Z" fill="#cbd5e1" opacity="0.5" />

    <!-- Berry / Cherry on top -->
    <circle cx="70" cy="101" r="7" fill="#ef4444" />
    <circle cx="68" cy="99" r="2" fill="#fca5a5" />
    <!-- Mint leaf -->
    <path d="M 72 96 C 76 94 79 97 77 100 C 74 101 71 99 72 96 Z" fill="#10b981" />

    <!-- Dome Lid Rim / Straw -->
    <rect x="68" y="70" width="6" height="50" rx="3" fill="#38bdf8" transform="rotate(-15 71 95)" />
    <!-- Straw Highlight -->
    <rect x="70" y="70" width="2" height="50" rx="1" fill="#bae6fd" transform="rotate(-15 71 95)" opacity="0.7" />

    <!-- Plastic Cup Highlight -->
    <path d="M 56 115 L 61 170" stroke="url(#glassShine)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- ==========================================
       SUBJECT 2: TALL TROPICAL GLASS (Right)
       ========================================== -->
  <g id="tallGlass" filter="url(#dropShadow)">
    <!-- Glass Base Shadow -->
    <ellipse cx="150" cy="183" rx="24" ry="7" fill="#030712" opacity="0.4" />

    <!-- Glass Base -->
    <ellipse cx="150" cy="178" rx="22" ry="6" fill="#cbd5e1" opacity="0.8" />

    <!-- Glass Body (Tapered Highball) -->
    <!-- Outer glass shape with slight transparency -->
    <path d="M 130 85 L 170 85 L 163 178 L 137 178 Z" fill="#ffffff" opacity="0.1" />

    <!-- Layered Drink (Sunrise Cocktail / Juice) -->
    <!-- Bottom layer (Grenadine/Red) -->
    <path d="M 139 150 L 161 150 L 163 178 L 137 178 Z" fill="#f43f5e" />
    <!-- Middle layer (Orange juice) -->
    <path d="M 134 115 L 166 115 L 161 150 L 139 150 Z" fill="#fb923c" />
    <!-- Top layer (Yellow juice / Pineapple) -->
    <path d="M 131 90 L 169 90 L 166 115 L 134 115 Z" fill="#fde047" />

    <!-- Ice Cubes floating -->
    <g opacity="0.85">
      <!-- Ice Cube 1 -->
      <path d="M 140 100 L 150 97 L 153 107 L 143 110 Z" fill="#ffffff" opacity="0.6" />
      <path d="M 150 97 L 156 100 L 159 110 L 153 107 Z" fill="#e2e8f0" opacity="0.7" />
      <!-- Ice Cube 2 -->
      <path d="M 148 130 L 158 127 L 161 137 L 151 140 Z" fill="#ffffff" opacity="0.5" />
    </g>

    <!-- Lemon / Lime Slice on Rim -->
    <g transform="translate(160, 80) rotate(25)">
      <!-- Citrus Slice Body -->
      <circle cx="0" cy="0" r="16" fill="#facc15" />
      <circle cx="0" cy="0" r="14" fill="#fef08a" />
      <!-- Segments -->
      <path d="M 0 0 L 10 10 M 0 0 L -10 10 M 0 0 L 10 -10 M 0 0 L -10 -10" stroke="#facc15" stroke-width="2" />
      <circle cx="0" cy="0" r="15" fill="none" stroke="#eab308" stroke-width="2" />
      <!-- Rind -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#ca8a04" stroke-width="2.5" />
    </g>

    <!-- Glass Rim -->
    <ellipse cx="150" cy="85" rx="20" ry="5" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" />

    <!-- Glass Specular Highlights -->
    <path d="M 134 92 L 139 170" stroke="url(#glassShine)" stroke-width="4" stroke-linecap="round" />
    <path d="M 164 92 L 161 150" stroke="#ffffff" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />
  </g>

  <!-- ==========================================
       ENVIRONMENTAL PROPS & DETAILS
       ========================================== -->
  
  <!-- Mint leaves & scattered berries on table -->
  <g transform="translate(102, 172)">
    <circle cx="0" cy="0" r="5" fill="#e11d48" />
    <circle cx="-2" cy="-2" r="1.5" fill="#fda4af" />
    <path d="M 6 2 C 12 -2 15 5 10 8 C 5 11 1 6 6 2 Z" fill="#059669" />
  </g>
  <g transform="translate(190, 168) rotate(-35)">
    <path d="M 0 0 C 8 -4 12 4 7 8 C 2 12 -4 4 0 0 Z" fill="#10b981" />
    <path d="M 2 2 C 5 0 7 3 5 5" fill="none" stroke="#065f46" stroke-width="0.8" />
  </g>

  <!-- Strawberries / Fruit slice near base -->
  <g transform="translate(112, 155) rotate(15)">
    <!-- Strawberry body -->
    <path d="M 0 5 C -6 0 -8 -8 0 -14 C 8 -8 6 0 0 5 Z" fill="#ef4444" />
    <!-- Seeds -->
    <circle cx="-2" cy="-5" r="0.6" fill="#fef08a" />
    <circle cx="2" cy="-8" r="0.6" fill="#fef08a" />
    <circle cx="0" cy="-2" r="0.6" fill="#fef08a" />
    <!-- Leaf crown -->
    <path d="M -3 -13 L 0 -10 L 3 -13 L 0 -15 Z" fill="#22c55e" />
  </g>

  <!-- Atmospheric glowing bubbles / condensation effects -->
  <circle cx="112" cy="120" r="2.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="118" cy="105" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="106" cy="135" r="2" fill="#38bdf8" opacity="0.5" />
  <circle cx="125" cy="140" r="1" fill="#38bdf8" opacity="0.7" />

  <!-- Sparkling Highlights (Magic/Freshness indicators) -->
  <g fill="#fbbf24">
    <path d="M 185 100 Q 185 105 190 105 Q 185 105 185 110 Q 185 105 180 105 Q 185 105 185 100 Z" opacity="0.8" />
    <path d="M 45 130 Q 45 133 48 133 Q 45 133 45 136 Q 45 133 42 133 Q 45 133 45 130 Z" opacity="0.6" />
  </g>
</svg>