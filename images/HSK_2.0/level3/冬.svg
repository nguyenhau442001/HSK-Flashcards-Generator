<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Winter Night Sky Gradient Effect -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Background Scenery (Winter Street / Park at Night) -->
  <!-- Distant Hills / Snow ground -->
  <path d="M0 160 Q 60 145, 120 160 T 240 155 L 240 240 L 0 240 Z" fill="#334155"/>
  <path d="M0 180 Q 90 170, 160 185 T 240 175 L 240 240 L 0 240 Z" fill="#475569"/>
  <path d="M0 200 Q 80 195, 150 205 T 240 198 L 240 240 L 0 240 Z" fill="#64748b"/>

  <!-- Pine Trees with Snow Tops -->
  <!-- Tree 1 -->
  <polygon points="35,160 20,195 50,195" fill="#1e293b"/>
  <polygon points="35,160 27,173 43,173" fill="#f8fafc"/>
  <polygon points="35,172 23,190 47,190" fill="#f8fafc"/>
  <rect x="33" y="195" width="4" height="15" fill="#78350f"/>

  <!-- Tree 2 -->
  <polygon points="205,150 190,190 220,190" fill="#1e293b"/>
  <polygon points="205,150 198,162 212,162" fill="#f8fafc"/>
  <polygon points="205,163 193,180 217,180" fill="#f8fafc"/>
  <rect x="203" y="190" width="4" height="15" fill="#78350f"/>

  <!-- Cozy House / Cabin Structure on the side -->
  <path d="M160 130 L 210 110 L 210 170 L 160 170 Z" fill="url(#roofGrad)"/>
  <path d="M155 125 L 215 105 L 220 115 L 160 135 Z" fill="#f8fafc"/> <!-- Snow on roof -->
  <rect x="170" y="130" width="30" height="40" fill="#1e293b"/>
  <!-- Warm Window -->
  <rect x="177" y="140" width="16" height="22" rx="2" fill="#fbbf24"/>
  <path d="M185 140 L 185 162 M177 151 L 193 151" stroke="#b45309" stroke-width="1.5"/>

  <!-- Streetlamp casting warm glow -->
  <rect x="65" y="110" width="4" height="90" fill="#334155"/>
  <circle cx="67" cy="110" r="8" fill="#fbbf24"/>
  <!-- Light cone -->
  <polygon points="67,118 40,210 94,210" fill="#fbbf24" opacity="0.15"/>

  <!-- Falling Snowflakes (Stylized beautiful soft glowing dots & shapes) -->
  <!-- Layer 1 (Small) -->
  <circle cx="30" cy="40" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="90" cy="30" r="2" fill="#f8fafc" opacity="0.9"/>
  <circle cx="130" cy="55" r="1" fill="#f8fafc" opacity="0.7"/>
  <circle cx="180" cy="45" r="2" fill="#f8fafc" opacity="0.9"/>
  <circle cx="215" cy="75" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="45" cy="95" r="2" fill="#f8fafc" opacity="0.7"/>
  <circle cx="110" cy="115" r="1.5" fill="#f8fafc" opacity="0.9"/>

  <!-- Layer 2 (Medium with sparkle/cross shape) -->
  <g fill="#f8fafc">
    <path d="M 60 65 Q 60 60, 65 60 Q 60 60, 60 55 Q 60 60, 55 60 Q 60 60, 60 65" opacity="0.9"/>
    <path d="M 150 85 Q 150 80, 155 80 Q 150 80, 150 75 Q 150 80, 145 80 Q 150 80, 150 85" opacity="0.8"/>
    <path d="M 195 25 Q 195 20, 200 20 Q 195 20, 195 15 Q 195 20, 190 20 Q 195 20, 195 25" opacity="0.9"/>
    <path d="M 25 135 Q 25 130, 30 130 Q 25 130, 25 125 Q 25 130, 20 130 Q 25 130, 25 135" opacity="0.7"/>
  </g>

  <!-- Main Characters: Expressive human subjects enjoying the snow -->
  <!-- Character 1 (Person admiring snow, pointing up, wearing winter gear) -->
  <g transform="translate(95, 135)">
    <!-- Legs / Boots -->
    <rect x="18" y="45" width="8" height="20" rx="4" fill="#38bdf8"/>
    <rect x="30" y="45" width="8" height="20" rx="4" fill="#38bdf8"/>
    <ellipse cx="20" cy="65" rx="5" ry="3" fill="#0f172a"/>
    <ellipse cx="34" cy="65" rx="5" ry="3" fill="#0f172a"/>
    
    <!-- Coat / Torso -->
    <path d="M 15 15 L 41 15 C 45 15, 47 25, 45 45 L 11 45 C 9 25, 11 15, 15 15 Z" fill="#ec4899"/>
    <!-- Scarf -->
    <path d="M 20 15 Q 28 22, 36 15 L 34 25 Q 28 28, 22 25 Z" fill="#fbbf24"/>
    <path d="M 32 23 L 35 42 L 40 42 L 36 23 Z" fill="#fbbf24"/>

    <!-- Head & Face (Smiling, eyes closed in joy) -->
    <circle cx="28" cy="5" r="11" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 17 4 Q 28 -4, 39 4 C 39 8, 35 6, 35 6 C 35 6, 30 1, 23 2 C 18 3, 17 4, 17 4 Z" fill="#451a03"/>
    <!-- Winter Hat (Beanie with pompom) -->
    <path d="M 17 3 Q 28 -3, 39 3 L 37 -4 Q 28 -8, 19 -4 Z" fill="#38bdf8"/>
    <circle cx="28" cy="-7" r="4" fill="#f8fafc"/>
    <!-- Face features -->
    <path d="M 23 4 Q 25 6, 27 4" stroke="#7c2d12" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 29 4 Q 31 6, 33 4" stroke="#7c2d12" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 27 8 Q 28 10, 29 8" stroke="#e11d48" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="21" cy="7" r="2.5" fill="#fda4af" opacity="0.6"/>
    <circle cx="35" cy="7" r="2.5" fill="#fda4af" opacity="0.6"/>

    <!-- Arms & Raised Hand pointing at beauty -->
    <path d="M 13 18 L 4 28" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <circle cx="2" cy="29" r="3.5" fill="#fed7aa"/>
    
    <path d="M 43 18 L 54 8" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <circle cx="56" cy="6" r="3.5" fill="#fed7aa"/>
  </g>

  <!-- Character 2 (Person holding a warm drink, looking up happily) -->
  <g transform="translate(130, 140)">
    <!-- Legs / Boots -->
    <rect x="15" y="40" width="8" height="25" rx="4" fill="#0284c7"/>
    <rect x="27" y="40" width="8" height="25" rx="4" fill="#0284c7"/>
    <ellipse cx="17" cy="65" rx="5" ry="3" fill="#1e293b"/>
    <ellipse cx="31" cy="65" rx="5" ry="3" fill="#1e293b"/>
    
    <!-- Puffer Jacket -->
    <path d="M 12 15 C 10 15, 8 30, 12 45 L 34 45 C 38 30, 36 15, 34 15 Z" fill="#10b981"/>
    <!-- Jacket Zipper / Details -->
    <line x1="23" y1="15" x2="23" y2="45" stroke="#047857" stroke-width="1.5"/>

    <!-- Head & Face -->
    <circle cx="23" cy="4" r="10" fill="#fed7aa"/>
    <!-- Winter Hood with fur lining -->
    <path d="M 11 3 C 11 -6, 35 -6, 35 3 C 37 8, 33 13, 33 13 L 13 13 C 13 13, 9 8, 11 3 Z" fill="#047857"/>
    <path d="M 12 3 C 12 -4, 34 -4, 34 3 C 34 5, 32 7, 32 7 L 14 7 C 14 7, 12 5, 12 3 Z" fill="#f8fafc" opacity="0.9"/>
    
    <!-- Face features (Smiling eyes looking up) -->
    <path d="M 18 3 Q 20 1, 22 3" stroke="#7c2d12" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 24 3 Q 26 1, 28 3" stroke="#7c2d12" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 22 7 Q 23 9, 24 7" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="17" cy="6" r="2" fill="#fda4af" opacity="0.6"/>
    <circle cx="29" cy="6" r="2" fill="#fda4af" opacity="0.6"/>

    <!-- Hands holding a red mug of hot cocoa -->
    <path d="M 16 25 L 20 30 L 26 30" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mug -->
    <rect x="18" y="27" width="9" height="11" rx="2" fill="#ef4444"/>
    <path d="M 27 29 C 29 29, 29 34, 27 34" stroke="#ef4444" stroke-width="1.5" fill="none"/>
    <!-- Steam from hot drink -->
    <path d="M 21 23 Q 20 20, 22 17" stroke="#f8fafc" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M 25 24 Q 26 21, 24 18" stroke="#f8fafc" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>

  <!-- Cute Snowman in the foreground completing the winter scenery -->
  <g transform="translate(30, 150)">
    <!-- Snowman Body -->
    <circle cx="25" cy="50" r="16" fill="#f8fafc"/>
    <circle cx="25" cy="28" r="12" fill="#f8fafc"/>
    <circle cx="25" cy="12" r="9" fill="#f8fafc"/>
    
    <!-- Scarf -->
    <path d="M 17 18 C 22 22, 28 22, 33 18 L 32 24 C 27 26, 21 26, 18 24 Z" fill="#ef4444"/>
    <path d="M 28 22 L 30 35 L 25 35 L 24 22 Z" fill="#ef4444"/>

    <!-- Hat -->
    <rect x="18" y="1" width="14" height="4" rx="1" fill="#334155"/>
    <path d="M 20 1 L 20 -7 C 20 -8, 30 -8, 30 -7 L 30 1 Z" fill="#334155"/>
    
    <!-- Face & Buttons -->
    <circle cx="22" cy="11" r="1" fill="#0f172a"/>
    <circle cx="28" cy="11" r="1" fill="#0f172a"/>
    <polygon points="25,13 29,14 25,15" fill="#f97316"/> <!-- Carrot nose -->
    <!-- Smile -->
    <circle cx="23" cy="16" r="0.7" fill="#0f172a"/>
    <circle cx="25" cy="17" r="0.7" fill="#0f172a"/>
    <circle cx="27" cy="16" r="0.7" fill="#0f172a"/>
    
    <!-- Buttons -->
    <circle cx="25" cy="25" r="1.2" fill="#0f172a"/>
    <circle cx="25" cy="31" r="1.2" fill="#0f172a"/>

    <!-- Stick Arms -->
    <path d="M 11 25 L 3 22" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <path d="M 39 25 L 47 21" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground snow pile overlay for depth -->
  <path d="M0 220 Q 70 210, 150 225 T 240 215 L 240 240 L 0 240 Z" fill="#f8fafc" opacity="0.9"/>
</svg>