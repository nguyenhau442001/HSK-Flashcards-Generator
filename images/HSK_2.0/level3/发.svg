<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="phoneGlow" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient background glow for phone action -->
  <circle cx="120" cy="120" r="100" fill="url(#phoneGlow)"/>

  <!-- Background Environment: Cozy room details -->
  <!-- Window / Night City Vibe -->
  <path d="M 180,30 L 210,30 L 210,90 L 180,90 Z" fill="#334155" opacity="0.4"/>
  <rect x="186" y="38" width="8" height="20" rx="2" fill="#fbbf24" opacity="0.6"/>
  <rect x="198" y="38" width="8" height="20" rx="2" fill="#38bdf8" opacity="0.4"/>
  
  <!-- Bookshelf / Prop in background -->
  <rect x="25" y="60" width="35" height="8" rx="2" fill="#475569" opacity="0.5"/>
  <rect x="32" y="45" width="8" height="15" rx="1" fill="#ec4899" opacity="0.7"/>
  <rect x="42" y="48" width="10" height="12" rx="1" fill="#3b82f6" opacity="0.7"/>

  <!-- Plant -->
  <path d="M 30,195 Q 30,175 45,170 Q 30,165 35,150" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="30" cy="195" r="12" fill="#64748b"/>
  <path d="M 22,195 L 38,195 L 35,207 L 25,207 Z" fill="#475569"/>

  <!-- Character: Upper body, sitting at desk / cozy armchair -->
  <!-- Chair Back -->
  <rect x="75" y="80" width="90" height="110" rx="25" fill="#334155"/>
  
  <!-- Character Body / Hoodie -->
  <path d="M 70,220 C 70,170 85,150 120,150 C 155,150 170,170 170,220 Z" fill="#6366f1"/>
  <!-- Hoodie Strings / Details -->
  <path d="M 108,165 L 108,185" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <path d="M 132,165 L 132,185" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100,158 C 110,168 130,168 140,158" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck & Head -->
  <rect x="110" y="125" width="20" height="30" rx="8" fill="#fbcfe8"/>
  <circle cx="120" cy="115" r="26" fill="#fbcfe8"/>
  
  <!-- Hair (Stylized modern neat hair) -->
  <path d="M 94,110 C 94,90 110,88 120,88 C 135,88 146,95 146,115 C 146,120 144,125 144,125 C 144,125 138,112 126,110 C 110,108 98,118 94,110 Z" fill="#1e293b"/>

  <!-- Facial expression: happy, focused, content -->
  <circle cx="112" cy="116" r="2.5" fill="#1e293b"/>
  <circle cx="128" cy="116" r="2.5" fill="#1e293b"/>
  <path d="M 116,124 Q 120,128 124,124" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Rosy cheeks -->
  <circle cx="107" cy="121" r="4" fill="#fda4af" opacity="0.6"/>
  <circle cx="133" cy="121" r="4" fill="#fda4af" opacity="0.6"/>

  <!-- Arms holding the phone -->
  <!-- Left Arm -->
  <path d="M 75,185 Q 90,160 110,165" fill="none" stroke="#6366f1" stroke-width="16" stroke-linecap="round"/>
  <!-- Right Arm -->
  <path d="M 165,185 Q 145,155 130,165" fill="none" stroke="#6366f1" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Hands -->
  <circle cx="108" cy="167" r="8" fill="#fbcfe8"/>
  <circle cx="132" cy="167" r="8" fill="#fbcfe8"/>

  <!-- Smartphone Device (Held actively in hands) -->
  <g transform="translate(100, 135)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="40" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Phone Screen -->
    <rect x="3" y="6" width="34" height="58" rx="4" fill="url(#screenGrad)"/>
    
    <!-- UI elements inside phone: Chat bubble graphic representing "sending a message" -->
    <rect x="7" y="14" width="22" height="14" rx="4" fill="#3b82f6"/>
    <path d="M 7,22 L 5,26 L 11,24 Z" fill="#3b82f6"/>
    <!-- Tiny message lines -->
    <line x1="10" y1="18" x2="22" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="22" x2="17" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Secondary incoming/sent bubble -->
    <rect x="11" y="34" width="22" height="14" rx="4" fill="#e2e8f0"/>
    <line x1="14" y1="38" x2="26" y2="38" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="42" x2="21" y2="42" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Home indicator -->
    <rect x="14" y="62" width="12" height="2" rx="1" fill="#94a3b8"/>
  </g>

  <!-- ACTION & MOTION EFFECTS: "Sending" metaphor (Flying message bubbles/sparkles springing from the phone) -->
  <!-- Floating energetic message particle 1 -->
  <g transform="translate(145, 115)">
    <rect x="0" y="0" width="24" height="16" rx="5" fill="#10b981" opacity="0.9"/>
    <path d="M 0,8 L -5,12 L 3,10 Z" fill="#10b981" opacity="0.9"/>
    <line x1="5" y1="6" x2="19" y2="6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="10" x2="13" y2="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating energetic message particle 2 (higher up, smaller) -->
  <g transform="translate(170, 75)">
    <rect x="0" y="0" width="18" height="12" rx="4" fill="#38bdf8" opacity="0.9"/>
    <path d="M 18,6 L 22,9 L 16,9 Z" fill="#38bdf8" opacity="0.9"/>
    <line x1="3" y1="4" x2="12" y2="4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="8" x2="9" y2="8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Radio/Action Waves & Sparkles indicating "Sending / Transmission" -->
  <path d="M 145, 140 Q 160, 130 165, 100" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M 152, 145 Q 172, 135 178, 105" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.8"/>

  <!-- Sparkle stars -->
  <path d="M 175, 55 L 178, 48 L 185, 45 L 178, 42 L 175, 35 L 172, 42 L 165, 45 L 172, 48 Z" fill="#fbbf24"/>
  <path d="M 140, 40 L 142, 36 L 146, 34 L 142, 32 L 140, 28 L 138, 32 L 134, 34 L 138, 36 Z" fill="#38bdf8" opacity="0.7"/>
  <circle cx="195" cy="95" r="3" fill="#ec4899" opacity="0.8"/>
  <circle cx="130" cy="70" r="2" fill="#fbbf24" opacity="0.9"/>

  <!-- Desk surface foreground element -->
  <path d="M 0,225 L 240,225 L 240,240 L 0,240 Z" fill="#0f172a"/>
  <rect x="0" y="222" width="240" height="4" fill="#334155"/>
  
  <!-- Coffee mug on desk (contextual prop) -->
  <g transform="translate(65, 205)">
    <rect x="0" y="5" width="16" height="17" rx="3" fill="#cbd5e1"/>
    <path d="M 16,8 C 21,8 21,17 16,17" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Steam rising -->
    <path d="M 5,2 Q 3,-2 8,-5" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 11,1 Q 13,-3 10,-6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>