<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and clipping -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="skyGlow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="mountainBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="mountainMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="mountainFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="trailGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <!-- Container Base -->
  <g clip-path="url(#cardClip)">
    <rect width="240" height="240" fill="url(#bgGradient)"/>
    
    <!-- Atmospheric Sky & Sun -->
    <rect width="240" height="240" fill="url(#skyGlow)"/>
    <circle cx="180" cy="70" r="28" fill="#fbbf24" opacity="0.15"/>
    <circle cx="180" cy="70" r="18" fill="#fbbf24" opacity="0.3"/>

    <!-- Distant Mountains & Clouds -->
    <path d="M-10 160 L50 90 L110 150 L170 80 L250 170 L250 240 L-10 240 Z" fill="url(#mountainBack)"/>
    
    <!-- Clouds -->
    <path d="M30 100 Q40 90 55 95 Q70 85 90 95 Q110 90 120 105 Z" fill="#64748b" opacity="0.2"/>
    <path d="M140 120 Q150 110 165 115 Q180 105 200 115 Q215 110 225 125 Z" fill="#64748b" opacity="0.2"/>

    <!-- Mid-ground Mountain Range & Hiking Trail -->
    <path d="M-20 200 Q40 130 90 150 T200 110 L260 220 L260 250 L-20 250 Z" fill="url(#mountainMid)"/>

    <!-- Winding Hiking Trail -->
    <path d="M40 240 Q70 210 110 200 T150 150 T190 110 T220 70" fill="none" stroke="url(#trailGradient)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <path d="M40 240 Q70 210 110 200 T150 150 T190 110 T220 70" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round"/>

    <!-- Foreground Crag / Slope -->
    <path d="M-10 240 L40 190 Q90 180 130 210 L250 240 Z" fill="url(#mountainFront)"/>
    <path d="M120 240 L160 195 Q190 180 250 205 L250 240 Z" fill="#334155" opacity="0.6"/>

    <!-- Pine Trees (Silhouette/Vector Style) -->
    <!-- Far trees -->
    <polygon points="50,140 40,165 60,165" fill="#1e293b"/>
    <polygon points="65,130 55,160 75,160" fill="#1e293b"/>
    <!-- Mid trees -->
    <polygon points="25,185 13,215 37,215" fill="#0f172a"/>
    <rect x="23" y="215" width="4" height="8" fill="#78350f"/>
    
    <polygon points="205,95 193,125 217,125" fill="#1e293b"/>
    <rect x="203" y="125" width="4" height="8" fill="#78350f"/>

    <polygon points="225,85 215,115 235,115" fill="#0f172a"/>
    <rect x="223" y="115" width="4" height="8" fill="#78350f"/>

    <!-- Rocks and Foliage in Foreground -->
    <circle cx="85" cy="225" r="12" fill="#475569"/>
    <path d="M70 240 Q80 220 95 230 T110 240 Z" fill="#64748b"/>
    <circle cx="210" cy="220" r="16" fill="#475569"/>

    <!-- Action Hiker Character (Climbing Upward) -->
    <g transform="translate(130, 95)">
      <!-- Trekking Poles -->
      <line x1="-15" y1="65" x2="25" y2="10" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <line x1="25" y1="60" x2="45" y2="5" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Left Arm (Reaching up) -->
      <path d="M-2 25 L15 5 L25 10" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Backpack -->
      <rect x="-18" y="15" width="16" height="22" rx="4" fill="#ec4899"/>
      <rect x="-15" y="18" width="10" height="8" rx="2" fill="#f43f5e"/>
      <path d="M-18 24 L-12 24" stroke="#fbcfe8" stroke-width="2"/>

      <!-- Body / Torso (Dynamic leaning forward angle) -->
      <path d="M-8 38 L-2 20 L12 32 L5 48 Z" fill="#38bdf8"/>
      <path d="M-3 22 L7 28" stroke="#0284c7" stroke-width="3"/> <!-- Strap -->

      <!-- Right Arm (Back) -->
      <path d="M2 32 L20 45" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>

      <!-- Head & Hat -->
      <circle cx="-2" cy="10" r="8" fill="#fed7aa"/>
      <!-- Sun Hat -->
      <ellipse cx="-2" cy="5" rx="11" ry="3" fill="#facc15"/>
      <path d="M-10 4 C-8 -2 4 -2 6 4 Z" fill="#eab308"/>

      <!-- Left Leg (Stepping up high) -->
      <path d="M3 45 L18 55 L32 45" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30 43 L36 47" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/> <!-- Hiking boot -->

      <!-- Right Leg (Pushing off) -->
      <path d="M-3 46 L-15 65 L-25 72" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-26 70 L-31 75" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/> <!-- Hiking boot -->
    </g>

    <!-- Scenic Details: Flying Birds -->
    <path d="M 60 50 Q 65 42 70 50 Q 75 42 80 50" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 75 35 Q 78 30 82 35 Q 86 30 89 35" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Floating Nature Particles / Sparkles for vibrancy -->
    <circle cx="105" cy="85" r="2" fill="#fbbf24" opacity="0.8"/>
    <circle cx="165" cy="65" r="1.5" fill="#fbbf24" opacity="0.6"/>
    <circle cx="90" cy="140" r="2" fill="#38bdf8" opacity="0.5"/>
    <circle cx="150" cy="120" r="1.5" fill="#f43f5e" opacity="0.7"/>

    <!-- Subtle Vignette / Border Frame -->
    <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
  </g>
</svg>