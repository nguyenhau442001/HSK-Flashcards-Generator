<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wall & Desk Lighting Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Amber Glow for Clock -->
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Character Outfit & Skin Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Canvas Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Background -->
  <!-- Wall base -->
  <rect x="0" y="0" width="240" height="170" fill="url(#wallGrad)" />
  <!-- Wooden Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#334155" />
  <path d="M 0 170 L 240 170 L 240 176 L 0 176 Z" fill="#475569" />
  <!-- Floor/Desk shadow -->
  <rect x="0" y="170" width="240" height="6" fill="#0f172a" opacity="0.6" />

  <!-- Window with Night Cityscape (Context for time) -->
  <g transform="translate(18, 22)">
    <rect width="60" height="90" rx="8" fill="#0b0f19" stroke="#475569" stroke-width="3" />
    <!-- City buildings outside -->
    <rect x="8" y="40" width="12" height="50" fill="#1e293b" />
    <rect x="24" y="25" width="16" height="65" fill="#1e293b" />
    <rect x="44" y="50" width="10" height="40" fill="#1e293b" />
    <!-- Window pane grid -->
    <line x1="30" y1="0" x2="30" y2="90" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="45" x2="60" y2="45" stroke="#475569" stroke-width="2" />
    <!-- Warm city lights glow -->
    <rect x="11" y="55" width="3" height="3" fill="#fbbf24" opacity="0.8" />
    <rect x="28" y="35" width="4" height="4" fill="#fbbf24" opacity="0.8" />
    <rect x="28" y="45" width="4" height="4" fill="#fbbf24" opacity="0.5" />
    <rect x="47" y="65" width="3" height="3" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Wall Clock (Crucial Prop for "3:10" - 3 o'clock and 10 minutes) -->
  <g transform="translate(170, 30)">
    <!-- Glow behind clock -->
    <circle cx="30" cy="30" r="35" fill="url(#clockGlow)" />
    <!-- Clock Body -->
    <circle cx="30" cy="30" r="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3" filter="url(#shadow)" />
    <!-- Inner dial rim -->
    <circle cx="30" cy="30" r="24" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 10.5" />
    
    <!-- Clock Hands indicating 3:10 -->
    <!-- Hour Hand (pointing at 3 -> 90 degrees / right) -->
    <line x1="30" y1="30" x2="43" y2="30" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
    <!-- Minute Hand (pointing at 2 -> 60 degrees / down-right, representing 10 minutes) -->
    <line x1="30" y1="30" x2="41" y2="41" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    <!-- Second Hand -->
    <line x1="30" y1="30" x2="16" y2="20" stroke="#94a3b8" stroke-width="1" />
    <!-- Center Pin -->
    <circle cx="30" cy="30" r="2.5" stroke="#0f172a" stroke-width="1" fill="#f8fafc" />
  </g>

  <!-- Desk Props (Lamp, Notebook, Pen) -->
  <!-- Desk Lamp -->
  <g transform="translate(25, 120)">
    <path d="M 15 50 L 25 50 L 22 25 L 18 25 Z" fill="#64748b" />
    <path d="M 10 27 Q 20 5 30 27 Z" fill="#fbbf24" filter="url(#shadow)" />
    <!-- Lamp base -->
    <ellipse cx="20" cy="50" rx="12" ry="4" fill="#475569" />
  </g>

  <!-- Open Notebook & Pen on Desk -->
  <g transform="translate(110, 150)">
    <!-- Notebook shadow -->
    <polygon points="0,15 70,10 80,35 10,40" fill="#000000" opacity="0.3" />
    <!-- Notebook cover -->
    <polygon points="5,12 65,8 75,32 15,36" fill="#ec4899" />
    <!-- Notebook pages -->
    <polygon points="8,10 63,6 73,30 18,34" fill="#f8fafc" />
    <!-- Page lines -->
    <line x1="20" y1="16" x2="55" y2="14" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="22" y1="21" x2="57" y2="19" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="24" y1="26" x2="59" y2="24" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Pen -->
    <line x1="68" y1="22" x2="90" y2="35" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#shadow)" />
  </g>

  <!-- Main Character (Student/Person glancing at the clock) -->
  <g transform="translate(60, 75)" filter="url(#shadow)">
    <!-- Body & Torso -->
    <path d="M 35 70 Q 35 48 55 48 L 85 48 Q 105 48 105 70 L 115 95 L 25 95 Z" fill="url(#shirtGrad)" />
    <!-- Collar -->
    <path d="M 55 48 L 70 60 L 85 48 Z" fill="#e0f2fe" />

    <!-- Neck -->
    <rect x="63" y="36" width="14" height="15" rx="4" fill="#fbcfe8" />

    <!-- Head & Hair (Facing right towards the clock) -->
    <!-- Head base -->
    <circle cx="70" cy="30" r="20" fill="#fbcfe8" />
    
    <!-- Hair Style -->
    <path d="M 50 30 C 50 16 60 10 73 10 C 88 10 92 22 92 35 L 92 40 L 50 40 Z" fill="url(#hairGrad)" />
    <!-- Hair fringe -->
    <path d="M 53 26 C 60 32 75 32 85 27 C 82 20 70 18 53 26 Z" fill="url(#hairGrad)" />

    <!-- Facial Profile (Looking up-right) -->
    <!-- Eye (curious/expressive) -->
    <circle cx="82" cy="28" r="2.5" fill="#0f172a" />
    <!-- Smile -->
    <path d="M 83 36 Q 87 38 85 40" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Arms & Hands in a relaxed, working/studying posture -->
    <!-- Left arm resting on desk -->
    <path d="M 35 60 Q 20 75 25 95" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <circle cx="25" cy="95" r="6" fill="#fbcfe8" />
    
    <!-- Right arm bent, holding cheek or resting -->
    <path d="M 100 65 Q 115 75 105 95" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <circle cx="105" cy="95" r="6" fill="#fbcfe8" />
  </g>

  <!-- Coffee Mug Prop on Desk -->
  <g transform="translate(195, 135)" filter="url(#shadow)">
    <!-- Mug Body -->
    <rect x="0" y="5" width="18" height="22" rx="4" fill="#10b981" />
    <!-- Mug Handle -->
    <path d="M 16 10 C 23 10 23 22 16 22" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <!-- Steam wisps representing afternoon/morning break -->
    <path d="M 5 0 Q 7 -5 4 -10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 12 -2 Q 14 -7 11 -12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

</svg>