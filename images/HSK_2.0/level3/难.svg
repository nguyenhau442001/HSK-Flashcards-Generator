<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Lamp Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Lighting / Wall glow from desk lamp -->
  <circle cx="180" cy="90" r="70" fill="#f59e0b" opacity="0.1" filter="url(#glow)" />

  <!-- Background Environment (Bookshelf & Window) -->
  <g opacity="0.4">
    <!-- Window with Night Sky -->
    <rect x="25" y="30" width="50" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <line x1="50" y1="30" x2="50" y2="100" stroke="#334155" stroke-width="2" />
    <line x1="25" y1="65" x2="75" y2="65" stroke="#334155" stroke-width="2" />
    <!-- Stars outside -->
    <circle cx="35" cy="45" r="1" fill="#fbbf24" />
    <circle cx="65" cy="50" r="1.5" fill="#f8fafc" />
    <circle cx="45" cy="85" r="1" fill="#f8fafc" />

    <!-- Bookshelf -->
    <rect x="160" y="25" width="55" height="8" rx="2" fill="#475569" />
    <path d="M170 15 L175 25 L165 25 Z" fill="#ec4899" />
    <rect x="180" y="10" width="10" height="15" rx="1" fill="#10b981" />
    <rect x="192" y="12" width="12" height="13" rx="1" fill="#f59e0b" />
  </g>

  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="url(#deskGrad)" />
  <rect x="0" y="176" width="240" height="4" fill="#475569" />

  <!-- Desk Lamp -->
  <g>
    <!-- Base -->
    <ellipse cx="200" cy="180" rx="12" ry="4" fill="#64748b" />
    <!-- Stand -->
    <path d="M200 180 L200 120 L185 90" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <!-- Shade -->
    <path d="M170 85 L200 75 L190 95 Z" fill="#fbbf24" />
    <!-- Light Cone (Semi-transparent) -->
    <polygon points="185,90 120,180 180,180" fill="#fbbf24" opacity="0.12" />
  </g>

  <!-- Laptop & Messy Papers (Context for "Difficult" task) -->
  <g transform="translate(110, 140)">
    <!-- Laptop Base -->
    <polygon points="-10,40 50,40 60,48 -20,48" fill="#64748b" />
    <rect x="-18" y="38" width="80" height="2" rx="1" fill="#94a3b8" />
    <!-- Laptop Screen -->
    <polygon points="-10,40 50,40 45,-10 -5,-10" fill="url(#screenGrad)" />
    <!-- Difficult Error/Complex UI on screen (Abstract graphs/lines, NO text) -->
    <path d="M5 10 L15 25 L25 5 L35 30" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="35" cy="30" r="3" fill="#f43f5e" />
    <line x1="2" y1="-2" x2="20" y2="-2" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
    <line x1="2" y1="3" x2="12" y2="3" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Stack of Papers / Hard Work -->
  <g transform="translate(30, 160)">
    <polygon points="0,20 40,10 45,15 5,25" fill="#cbd5e1" />
    <polygon points="5,15 45,5 50,10 10,20" fill="#f8fafc" />
    <line x1="15" y1="10" x2="35" y2="5" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
    <line x1="12" y1="13" x2="25" y2="9" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(75, 155)">
    <rect x="0" y="5" width="14" height="20" rx="3" fill="#38bdf8" />
    <path d="M14 9 C18 9, 18 19, 14 19" fill="none" stroke="#38bdf8" stroke-width="2" />
    <!-- Steam -->
    <path d="M4 0 C4 -3, 8 -3, 8 -6" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- MAIN CHARACTER: Stressed/Overwhelmed Student -->
  <g transform="translate(85, 65)">
    <!-- Body / Hoodie (Deep Teal / Blue-Gray) -->
    <path d="M20 95 C10 95, -5 110, -10 115 L70 115 C65 110, 50 95, 40 95 Z" fill="#0284c7" />
    <!-- Shoulders & Torso -->
    <path d="M10 70 C0 70, -10 95, -10 115 L70 115 C70 95, 60 70, 50 70 Z" fill="#0369a1" />
    
    <!-- Hood outline behind head -->
    <path d="M5 25 C-5 35, -5 65, 10 75 L50 75 C65 65, 65 35, 55 25 Z" fill="#0284c7" />

    <!-- Neck -->
    <rect x="23" y="55" width="14" height="20" fill="#fbcfe8" />
    <path d="M23 65 Q30 70 37 65" fill="#f43f5e" opacity="0.2" />

    <!-- Head (Tilted downward, tense) -->
    <circle cx="30" cy="40" r="24" fill="#ffedd5" />
    <path d="M6 35 C6 20, 54 20, 54 35 C54 45, 6 45, 6 35 Z" fill="#78350f" /> <!-- Hair top -->
    <path d="M10 32 C10 30, 15 25, 25 28 Z" fill="#78350f" />
    <path d="M40 27 C48 25, 52 30, 50 34 Z" fill="#78350f" />

    <!-- Expressive Face (Embodying '难' - Difficult/Stressed) -->
    <!-- Tense Eyebrows (angled sharply inward and down) -->
    <path d="M16 35 L24 39" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    <path d="M44 35 L36 39" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />

    <!-- Closed / Strained Eyes (Arcs showing worry) -->
    <path d="M18 42 Q21 46 24 42" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <path d="M36 42 Q39 46 42 42" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

    <!-- Sweat Drop (Classic sign of difficulty/stress) -->
    <path d="M47 38 C47 38, 52 44, 52 47 C52 50, 49 51, 47 51 C45 51, 42 50, 42 47 C42 44, 47 38, 47 38 Z" fill="#38bdf8" opacity="0.85" />
    <path d="M46 45 Q48 47 47 49" fill="none" stroke="#bae6fd" stroke-width="1" stroke-linecap="round" />

    <!-- Open Stressed Mouth -->
    <path d="M25 52 Q30 47 35 52 Q30 58 25 52 Z" fill="#991b1b" />

    <!-- Hands clutching head in frustration -->
    <!-- Left Hand -->
    <g transform="translate(2, 30)">
      <circle cx="5" cy="5" r="7" fill="#ffedd5" />
      <path d="M-2 2 L8 0 L5 10 Z" fill="#ffedd5" />
      <path d="M5 5 C2 5, 0 8, 0 12" stroke="#d97706" stroke-width="1.5" fill="none" />
    </g>
    <!-- Right Hand -->
    <g transform="translate(48, 30)">
      <circle cx="5" cy="5" r="7" fill="#ffedd5" />
      <path d="M12 2 L2 0 L5 10 Z" fill="#ffedd5" />
      <path d="M5 5 C8 5, 10 8, 10 12" stroke="#d97706" stroke-width="1.5" fill="none" />
    </g>
  </g>

  <!-- Dynamic Accent / Floating Confusion Marks (Subtle, non-textual) -->
  <g transform="translate(170, 50)" opacity="0.8">
    <path d="M0 10 Q5 0 10 10 T20 10" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="25" cy="5" r="2" fill="#fb923c" />
  </g>
  
  <g transform="translate(50, 70)" opacity="0.7">
    <path d="M10 0 Q5 10 0 0 T-10 0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>