<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Windshield Glow -->
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Taxi Yellow Gradient -->
    <linearGradient id="taxiYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Speed/Motion Blur Lines Gradient -->
    <linearGradient id="motionBlur" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <clipPath id="windshieldClip">
      <path d="M 50,85 C 70,72 170,72 190,85 L 205,125 C 210,135 35,135 35,125 Z"/>
    </clipPath>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (City lights, night ambiance) -->
  <g opacity="0.3">
    <!-- Buildings -->
    <rect x="20" y="70" width="30" height="100" fill="#334155" rx="2"/>
    <rect x="190" y="50" width="35" height="120" fill="#334155" rx="2"/>
    <!-- Building Windows -->
    <rect x="28" y="80" width="6" height="8" fill="#fbbf24"/>
    <rect x="38" y="80" width="6" height="8" fill="#fbbf24"/>
    <rect x="28" y="95" width="6" height="8" fill="#38bdf8"/>
    <rect x="38" y="95" width="6" height="8" fill="#38bdf8"/>
    <rect x="198" y="60" width="8" height="10" fill="#fbbf24"/>
    <rect x="210" y="60" width="8" height="10" fill="#38bdf8"/>
    <rect x="198" y="80" width="8" height="10" fill="#38bdf8"/>
    <rect x="210" y="80" width="8" height="10" fill="#fbbf24"/>
  </g>

  <!-- Motion Blur Streaks -->
  <path d="M 0,110 L 60,110" stroke="url(#motionBlur)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 180,120 L 240,120" stroke="url(#motionBlur)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 10,140 L 80,140" stroke="url(#motionBlur)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 150,135 L 220,135" stroke="url(#motionBlur)" stroke-width="2" stroke-linecap="round"/>

  <!-- TAXI CAB INTERIOR & EXTERIOR FRAME -->
  <g filter="url(#shadow)">
    <!-- Car Body Base (Hood & Roof frame) -->
    <path d="M 25,120 Q 120,105 215,120 L 230,175 Q 120,185 10,175 Z" fill="#b45309" />
    <path d="M 20,125 C 20,125 45,75 120,75 C 195,75 220,125 220,125 L 230,170 C 230,170 120,180 10,170 Z" fill="url(#taxiYellow)"/>
    
    <!-- Checker pattern stripe on taxi -->
    <g opacity="0.9">
      <rect x="30" y="145" width="12" height="6" fill="#1e293b"/>
      <rect x="54" y="145" width="12" height="6" fill="#1e293b"/>
      <rect x="78" y="145" width="12" height="6" fill="#1e293b"/>
      <rect x="102" y="145" width="12" height="6" fill="#1e293b"/>
      <rect x="126" y="145" width="12" height="6" fill="#1e293b"/>
      <rect x="150" y="145" width="12" height="6" fill="#1e293b"/>
      <rect x="174" y="145" width="12" height="6" fill="#1e293b"/>
      <rect x="198" y="145" width="12" height="6" fill="#1e293b"/>
    </g>
  </g>

  <!-- Windshield (Clipped View into Interior & Driver) -->
  <path d="M 45,85 C 65,70 175,70 195,85 L 210,130 C 215,140 25,140 30,130 Z" fill="#0f172a" stroke="#d97706" stroke-width="3"/>
  
  <g clip-path="url(#windshieldClip)">
    <!-- Interior Background -->
    <rect x="0" y="0" width="240" height="240" fill="#1e293b"/>
    <path d="M 30,120 L 210,120 L 220,140 L 20,140 Z" fill="#334155"/>

    <!-- Dashboard -->
    <path d="M 25,122 Q 120,112 215,122 L 225,140 Q 120,145 15,140 Z" fill="#0f172a"/>
    <!-- GPS / Meter Screen Glow -->
    <rect x="105" y="122" width="30" height="14" rx="2" fill="#0284c7" filter="url(#shadow)"/>
    <rect x="110" y="125" width="10" height="4" rx="1" fill="#38bdf8"/>
    <rect x="123" y="125" width="8" height="4" rx="1" fill="#10b981"/>

    <!-- Steering Wheel -->
    <g filter="url(#shadow)">
      <ellipse cx="120" cy="135" rx="32" ry="16" fill="none" stroke="#475569" stroke-width="8"/>
      <path d="M 96,135 L 108,135" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
      <path d="M 144,135 L 132,135" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
      <path d="M 120,135 L 120,151" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
      <circle cx="120" cy="135" r="7" fill="#334155"/>
    </g>

    <!-- DRIVER CHARACTER (司机) -->
    <!-- Driver Torso & Uniform (White shirt & Blue vest/tie) -->
    <path d="M 85,160 C 85,140 155,140 155,160 L 170,200 C 170,200 70,200 85,160 Z" fill="#3b82f6"/>
    <path d="M 100,140 L 120,170 L 140,140 Z" fill="#f8fafc"/> <!-- Shirt collar -->
    <polygon points="117,152 123,152 125,175 120,180 115,175" fill="#ef4444"/> <!-- Tie -->

    <!-- Driver Neck -->
    <rect x="110" y="125" width="20" height="20" fill="#fbcfe8" rx="4"/>

    <!-- Driver Head -->
    <g filter="url(#shadow)">
      <ellipse cx="120" cy="105" rx="26" ry="30" fill="#fbcfe8"/>
    </g>

    <!-- Driver Ears -->
    <circle cx="94" cy="108" r="5" fill="#fbcfe8"/>
    <circle cx="146" cy="108" r="5" fill="#fbcfe8"/>

    <!-- Friendly Face Features -->
    <!-- Eyes (Happy curved lines) -->
    <path d="M 106,98 C 109,102 113,102 116,98" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 124,98 C 127,102 131,102 134,98" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="103" cy="107" r="4" fill="#fb7185" opacity="0.6"/>
    <circle cx="137" cy="107" r="4" fill="#fb7185" opacity="0.6"/>
    <!-- Confident Smile -->
    <path d="M 112,113 C 116,118 124,118 128,113" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Professional Driver Cap (Peaked Cap) -->
    <path d="M 93,92 C 93,75 147,75 147,92 Z" fill="#1e293b"/>
    <ellipse cx="120" cy="92" rx="28" ry="8" fill="#334155"/>
    <path d="M 94,92 C 105,100 135,100 146,92 L 152,95 C 135,105 105,105 88,95 Z" fill="#0f172a"/> <!-- Visor brim -->
    <!-- Gold Cap Badge / Accent -->
    <ellipse cx="120" cy="91" rx="5" ry="3" fill="#fbbf24"/>

    <!-- Hands on Steering Wheel -->
    <circle cx="92" cy="135" r="8" fill="#fbcfe8" filter="url(#shadow)"/>
    <circle cx="148" cy="135" r="8" fill="#fbcfe8" filter="url(#shadow)"/>
  </g>

  <!-- Windshield Reflection Overlay (Adds gloss and realism) -->
  <path d="M 52,87 C 68,75 140,75 155,87 L 140,115 C 100,110 65,115 52,87 Z" fill="#ffffff" opacity="0.15" clip-path="url(#windshieldClip)"/>

  <!-- TAXI ROOF SIGN (The classic lit "TAXI" sign) -->
  <g filter="url(#shadow)">
    <!-- Mount brackets -->
    <rect x="110" y="62" width="6" height="8" fill="#334155"/>
    <rect x="124" y="62" width="6" height="8" fill="#334155"/>
    <!-- Sign Box -->
    <rect x="95" y="48" width="50" height="16" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <!-- Inner glowing details (abstract representation of signage without explicit text) -->
    <rect x="100" y="53" width="12" height="6" rx="2" fill="#e11d48"/>
    <rect x="114" y="53" width="12" height="6" rx="2" fill="#e11d48"/>
    <rect x="128" y="53" width="12" height="6" rx="2" fill="#e11d48"/>
  </g>

  <!-- Headlights Glow (Atmospheric lighting on the road/scene) -->
  <path d="M 25,145 L 5,175 L 20,185 Z" fill="#fbbf24" opacity="0.3" filter="url(#shadow)"/>
  <path d="M 215,145 L 235,175 L 220,185 Z" fill="#fbbf24" opacity="0.3" filter="url(#shadow)"/>
  <ellipse cx="28" cy="155" rx="5" ry="8" fill="#fef08a" filter="url(#shadow)"/>
  <ellipse cx="212" cy="155" rx="5" ry="8" fill="#fef08a" filter="url(#shadow)"/>

  <!-- Vignette / Frame border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>