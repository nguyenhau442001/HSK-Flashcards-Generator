<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>

  <!-- Sky & Environment Gradients / Shapes -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect x="0" y="0" width="240" height="110" fill="url(#skyGrad)"/>

  <!-- Distant Hills & Trees -->
  <path d="M0 90 Q 60 70, 130 85 T 240 80 L 240 110 L 0 110 Z" fill="#064e3b" opacity="0.6"/>

  <!-- River Bank (Far Side) -->
  <path d="M0 100 Q 80 90, 240 105 L 240 120 L 0 120 Z" fill="#047857"/>

  <!-- The River (Curving across the scene) -->
  <path d="M -10 120 C 60 115, 120 145, 250 135 L 250 190 C 130 200, 60 160, -10 165 Z" fill="url(#riverGrad)"/>

  <!-- River Sparkles / Ripples -->
  <path d="M 70 145 Q 90 142, 110 148" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 140 155 Q 160 152, 180 158" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 40 132 Q 50 130, 60 134" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- River Bank (Foreground) -->
  <path d="M -10 160 C 80 155, 140 200, 250 185 L 250 240 L -10 240 Z" fill="url(#bankGrad)"/>

  <!-- Grass and Foliage Details -->
  <path d="M 15 170 L 18 160 L 21 170" fill="#34d399"/>
  <path d="M 25 173 L 29 162 L 32 173" fill="#34d399"/>
  <path d="M 215 200 L 218 190 L 222 200" fill="#34d399"/>
  <path d="M 225 203 L 228 193 L 232 203" fill="#34d399"/>

  <!-- Charming Footbridge across the river -->
  <path d="M 100 115 Q 130 95, 160 125" stroke="url(#bridgeGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <line x1="110" y1="113" x2="112" y2="128" stroke="#b45309" stroke-width="2"/>
  <line x1="130" y1="104" x2="132" y2="121" stroke="#b45309" stroke-width="2"/>
  <line x1="150" y1="113" x2="152" y2="130" stroke="#b45309" stroke-width="2"/>

  <!-- Character 1 (Hiking / Pointing at river width) -->
  <!-- Legs -->
  <line x1="75" y1="210" x2="70" y2="230" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="85" y1="210" x2="90" y2="230" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Torso & Backpack -->
  <rect x="70" y="185" width="22" height="28" rx="6" fill="#ef4444"/>
  <rect x="66" y="188" width="8" height="20" rx="3" fill="#f97316"/> <!-- Backpack -->
  <!-- Head & Hat -->
  <circle cx="81" cy="172" rx="9" fill="#fcd34d"/>
  <path d="M 70 167 Q 81 160, 92 167" fill="#dc2626"/> <!-- Cap -->
  <!-- Arm pointing forward/across -->
  <path d="M 81 190 L 115 180" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="116" cy="179" r="3" fill="#fcd34d"/>

  <!-- Character 2 (Curious Friend listening/looking) -->
  <!-- Legs -->
  <line x1="135" y1="215" x2="130" y2="235" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="215" x2="150" y2="235" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Torso -->
  <rect x="130" y="190" width="22" height="27" rx="6" fill="#3b82f6"/>
  <!-- Head & Hair -->
  <circle cx="141" cy="177" rx="9" fill="#fcd34d"/>
  <path d="M 131 174 Q 141 168, 151 174" fill="#334155"/> <!-- Hair -->
  <!-- Arm raised holding measuring/surveying tool concept or hand on chin -->
  <path d="M 141 195 L 133 182" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="132" cy="180" r="3" fill="#fcd34d"/>

  <!-- Measuring Tool / Laser Distance Meter concept (Visualizing "meters / length") -->
  <!-- Glowing dashed measurement arc or line spanning across the river -->
  <path d="M 115 180 Q 150 140, 180 165" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4" fill="none" filter="url(#glow)"/>
  <!-- Distance marker node 1 -->
  <circle cx="115" cy="180" r="5" fill="#f59e0b"/>
  <circle cx="115" cy="180" r="2" fill="#fff"/>
  <!-- Distance marker node 2 -->
  <circle cx="180" cy="165" r="5" fill="#f59e0b"/>
  <circle cx="180" cy="165" r="2" fill="#fff"/>

  <!-- Floating measurement indicator bracket -->
  <path d="M 135 152 L 135 147 L 165 147 L 165 152" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <!-- Little aesthetic dots representing digital readouts (abstracted, NO letters/numbers) -->
  <circle cx="146" cy="143" r="2.5" fill="#38bdf8"/>
  <circle cx="154" cy="143" r="2.5" fill="#38bdf8"/>

  <!-- Environment details: Trees on background -->
  <circle cx="45" cy="95" r="14" fill="#047857"/>
  <rect x="43" y="102" width="4" height="10" fill="#78350f"/>
  
  <circle cx="195" cy="100" r="16" fill="#047857"/>
  <rect x="193" y="108" width="4" height="12" fill="#78350f"/>

  <!-- Foreground Bush -->
  <path d="M 190 220 Q 195 205, 210 210 Q 225 205, 230 220 Z" fill="#059669"/>
</svg>