<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="riverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGradient)"/>

  <!-- Distant Skyline Silhouette -->
  <path d="M0 160 L20 145 L40 155 L60 130 L90 140 L110 110 L130 145 L160 125 L190 150 L220 135 L240 155 V180 H0 Z" fill="#0f172a" opacity="0.5"/>

  <!-- Main Cityscape -->
  <!-- Building Left -->
  <rect x="15" y="100" width="35" height="80" fill="#334155"/>
  <rect x="20" y="110" width="5" height="5" fill="#fbbf24" opacity="0.8"/>
  <rect x="30" y="110" width="5" height="5" fill="#38bdf8" opacity="0.6"/>
  <rect x="20" y="125" width="5" height="5" fill="#fbbf24" opacity="0.8"/>
  <rect x="40" y="140" width="5" height="5" fill="#fbbf24" opacity="0.8"/>
  <rect x="20" y="155" width="5" height="5" fill="#38bdf8" opacity="0.6"/>

  <!-- Building Center-Left (Tallest) -->
  <rect x="55" y="60" width="45" height="120" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <rect x="65" y="75" width="8" height="4" fill="#fbbf24"/>
  <rect x="82" y="75" width="8" height="4" fill="#fbbf24"/>
  <rect x="65" y="90" width="8" height="4" fill="#38bdf8"/>
  <rect x="82" y="105" width="8" height="4" fill="#fbbf24"/>
  <rect x="65" y="120" width="8" height="4" fill="#fbbf24"/>
  <rect x="82" y="135" width="8" height="4" fill="#38bdf8"/>
  <rect x="65" y="150" width="8" height="4" fill="#fbbf24"/>

  <!-- Building Center-Right -->
  <rect x="110" y="85" width="40" height="95" fill="#334155"/>
  <rect x="118" y="95" width="24" height="2" fill="#10b981" opacity="0.5"/>
  <rect x="118" y="110" width="6" height="6" fill="#fbbf24"/>
  <rect x="134" y="110" width="6" height="6" fill="#fbbf24"/>
  <rect x="118" y="125" width="6" height="6" fill="#38bdf8"/>
  <rect x="134" y="140" width="6" height="6" fill="#fbbf24"/>

  <!-- Building Right -->
  <rect x="160" y="110" width="30" height="70" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <rect x="170" y="120" width="10" height="3" fill="#fbbf24"/>
  <rect x="170" y="135" width="10" height="3" fill="#fbbf24"/>
  <rect x="170" y="150" width="10" height="3" fill="#38bdf8"/>

  <!-- Far Right Modern Building -->
  <path d="M200 130 L230 140 V180 H200 Z" fill="#334155"/>
  <rect x="205" y="145" width="4" height="4" fill="#fbbf24"/>
  <rect x="215" y="155" width="4" height="4" fill="#fbbf24"/>

  <!-- River/Water Foreground -->
  <rect x="0" y="180" width="240" height="60" fill="url(#riverGradient)"/>
  <path d="M20 195 Q120 190 220 195" stroke="#38bdf8" stroke-width="0.5" fill="none" opacity="0.3"/>
  <path d="M10 210 Q120 205 230 210" stroke="#38bdf8" stroke-width="0.5" fill="none" opacity="0.2"/>
  <path d="M30 225 Q120 220 210 225" stroke="#38bdf8" stroke-width="0.5" fill="none" opacity="0.1"/>

  <!-- Bridge -->
  <path d="M0 175 C60 155, 180 155, 240 175" stroke="#475569" stroke-width="4" fill="none"/>
  <path d="M40 168 L40 178" stroke="#475569" stroke-width="1"/>
  <path d="M80 162 L80 175" stroke="#475569" stroke-width="1"/>
  <path d="M120 160 L120 175" stroke="#475569" stroke-width="1"/>
  <path d="M160 162 L160 175" stroke="#475569" stroke-width="1"/>
  <path d="M200 168 L200 178" stroke="#475569" stroke-width="1"/>

  <!-- Traffic Light Trails (Action) -->
  <path d="M0 173 Q120 158 240 173" stroke="#fb923c" stroke-width="1.5" fill="none" opacity="0.6" stroke-dasharray="40 10"/>
  <path d="M0 177 Q120 162 240 177" stroke="#ec4899" stroke-width="1" fill="none" opacity="0.4" stroke-dasharray="30 20"/>
  <path d="M240 175 Q120 160 0 175" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.5" stroke-dasharray="50 15"/>

  <!-- Atmospheric Details -->
  <circle cx="210" cy="40" r="12" fill="#f59e0b" opacity="0.1"/>
  <circle cx="210" cy="40" r="8" fill="#fbbf24" opacity="0.2"/>
  
  <!-- Foreground Detail -->
  <path d="M0 240 L60 220 L100 240 Z" fill="#0f172a"/>
  <rect x="40" y="215" width="15" height="10" rx="2" fill="#334155"/>
  <rect x="42" y="217" width="11" height="2" fill="#475569"/>
</svg>