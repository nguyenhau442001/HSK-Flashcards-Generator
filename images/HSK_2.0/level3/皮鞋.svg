<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow behind shoe -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Leather Gradient (Rich Deep Brown) -->
    <linearGradient id="leather" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="40%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Leather Highlight -->
    <linearGradient id="leatherHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </linearGradient>

    <!-- Sole Gradient -->
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shoe Shine Highlight -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Floor Surface Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light/Atmospheric Glow -->
  <circle cx="120" cy="120" r="90" fill="url(#amberGlow)"/>

  <!-- Background Environment Details (Warm boutique/wardrobe vibe) -->
  <!-- Ambient floating sparkles / polish dust -->
  <circle cx="60" cy="70" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="180" cy="60" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="195" cy="110" r="2.5" fill="#f59e0b" opacity="0.5"/>
  <circle cx="45" cy="140" r="1.5" fill="#38bdf8" opacity="0.4"/>

  <!-- Wooden Floor Shelf Surface -->
  <path d="M 20 185 L 220 185 L 230 210 L 10 210 Z" fill="#0f172a" opacity="0.9"/>
  <path d="M 20 185 L 220 185 L 220 188 L 20 188 Z" fill="#334155"/>
  <rect x="20" y="188" width="200" height="22" fill="url(#floorGrad)"/>

  <!-- Main Subject Group: 皮鞋 (Leather Shoe) with drop shadow -->
  <g filter="url(#dropShadow)">
    
    <!-- Shoe Sole Stack -->
    <path d="M 45 168 Q 120 176 195 162 L 197 172 Q 120 186 43 178 Z" fill="url(#soleGrad)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 45 174 Q 120 182 195 168 L 197 172 Q 120 186 43 178 Z" fill="#b45309" opacity="0.8"/> <!-- Welt accent -->

    <!-- Main Shoe Upper (Leather Body) -->
    <path d="M 45 168 
             C 45 150, 55 125, 75 118 
             C 95 111, 115 120, 130 115 
             C 155 106, 185 85, 205 92 
             C 215 96, 215 125, 195 152 
             C 175 170, 90 178, 45 168 Z" 
          fill="url(#leather)" stroke="#78350f" stroke-width="2" stroke-linejoin="round"/>

    <!-- Leather Texture Contour / Layer for Depth -->
    <path d="M 50 165 
             C 50 150, 60 128, 77 122 
             C 95 116, 112 123, 126 118 
             C 145 111, 175 92, 195 97 
             C 205 100, 205 120, 190 144 
             C 170 160, 90 168, 50 165 Z" 
          fill="url(#leatherHighlight)" opacity="0.4"/>

    <!-- Toe Cap (Classic Oxford / Brogue panel styling) -->
    <path d="M 45 168 
             C 45 150, 55 125, 75 118 
             C 77 125, 76 150, 68 167 
             Z" 
          fill="#451a03" opacity="0.4"/>
    <!-- Toe Cap Seam Line -->
    <path d="M 75 118 C 73 135, 71 152, 68 167" fill="none" stroke="#271c19" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Lacing Area / Tongue (Eyestay) -->
    <path d="M 125 117 C 135 114, 155 105, 175 102 C 180 115, 160 128, 135 128 Z" fill="#291304" stroke="#451a03" stroke-width="1"/>
    
    <!-- Shoelaces (Detailed clean vector loops) -->
    <path d="M 132 116 Q 142 121 152 112" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <path d="M 140 114 Q 150 119 160 110" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <path d="M 148 112 Q 158 117 168 108" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Shoe Opening (Ankle Collar) -->
    <path d="M 175 102 C 185 105, 200 110, 198 120 C 195 128, 175 125, 165 118 Z" fill="#1e1005" stroke="#451a03" stroke-width="1"/>

    <!-- Glossy High-Polish Shine (Giving the "leather shoe / 皮鞋" look) -->
    <path d="M 60 145 C 80 120, 130 115, 160 102 C 150 115, 110 135, 65 155 Z" fill="url(#shine)" style="mix-blend-mode: overlay;" />
    
    <!-- Secondary Sharp Highlight on Toe -->
    <path d="M 50 155 C 55 140, 65 130, 72 128 C 65 138, 58 148, 50 155 Z" fill="#ffffff" opacity="0.25"/>

  </g>

  <!-- Foreground Context Prop: Shoe Polish Tin / Brush setup for narrative depth -->
  <!-- Small wooden brush -->
  <g transform="translate(30, 155) rotate(-10)">
    <rect x="0" y="10" width="35" height="12" rx="4" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
    <rect x="2" y="6" width="31" height="6" rx="2" fill="#fef08a" opacity="0.9"/> <!-- Bristles -->
    <!-- Metal accent on brush -->
    <rect x="15" y="10" width="5" height="12" fill="#cbd5e1" opacity="0.6"/>
  </g>

  <!-- Golden Polish Tin Lid Open -->
  <g transform="translate(180, 160)">
    <!-- Tin Base -->
    <ellipse cx="15" cy="12" rx="14" ry="8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <!-- Polish Cream Inside -->
    <ellipse cx="15" cy="11" rx="12" ry="6" fill="#451a03"/>
    <ellipse cx="13" cy="10" rx="6" ry="3" fill="#854d0e" opacity="0.6"/> <!-- Shine on cream -->
    <!-- Tin Lid (Proppped behind) -->
    <path d="M 2 8 C 8 -2, 22 -2, 28 8 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Dynamic Action/Vibe Effects (Sparkles of brilliance/cleanliness) -->
  <g transform="translate(130, 75)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(75, 95) scale(0.6)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#f59e0b"/>
  </g>
  <g transform="translate(190, 80) scale(0.8)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#38bdf8"/>
  </g>

  <!-- Framing / App UI Safe Border (Subtle inner stroke) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>