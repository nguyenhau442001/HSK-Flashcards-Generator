<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tearGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Room Environment (Background Elements) -->
  <!-- Wallpaper / Wall -->
  <rect x="20" y="20" width="200" height="150" rx="12" fill="url(#nightSky)" opacity="0.7"/>
  
  <!-- Window showing night -->
  <path d="M 160 45 L 200 45 L 200 115 L 160 115 Z" fill="#090d16" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
  <!-- Window pane cross -->
  <line x1="180" y1="45" x2="180" y2="115" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="80" x2="200" y2="80" stroke="#334155" stroke-width="2"/>
  <!-- Star outside window -->
  <circle cx="172" cy="60" r="1.5" fill="#f8fafc"/>
  <circle cx="190" cy="95" r="1" fill="#f8fafc"/>

  <!-- Bookshelf / Toys in background -->
  <rect x="35" y="55" width="45" height="60" rx="4" fill="#334155" opacity="0.4"/>
  <line x1="35" y1="85" x2="80" y2="85" stroke="#475569" stroke-width="2"/>
  <!-- Books -->
  <rect x="42" y="65" width="8" height="20" rx="1" fill="#f43f5e"/>
  <rect x="52" y="63" width="10" height="22" rx="1" fill="#38bdf8"/>
  <rect x="64" y="67" width="7" height="18" rx="1" fill="#fbbf24"/>
  <!-- Small toy blocks on shelf -->
  <rect x="40" y="93" width="10" height="10" rx="2" fill="#10b981"/>
  <rect x="53" y="91" width="12" height="12" rx="2" fill="#ec4899"/>

  <!-- Warm Wall Lamp -->
  <circle cx="120" cy="55" r="30" fill="url(#lampGlow)"/>
  <path d="M 115 35 L 125 35 L 128 45 L 112 45 Z" fill="#94a3b8"/>
  <path d="M 120 35 L 120 20" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="46" r="5" fill="#fbbf24"/>

  <!-- Wooden Floor -->
  <path d="M 20 170 L 220 170 L 220 210 L 20 210 Z" fill="#1e293b"/>
  <line x1="20" y1="170" x2="220" y2="170" stroke="#475569" stroke-width="3"/>
  <!-- Floor planks perspective lines -->
  <line x1="20" y1="190" x2="220" y2="190" stroke="#0f172a" stroke-width="2" opacity="0.6"/>

  <!-- Rug -->
  <ellipse cx="120" cy="195" rx="75" ry="18" fill="#334155" opacity="0.6"/>
  <ellipse cx="120" cy="193" rx="65" ry="14" fill="#475569" opacity="0.5"/>

  <!-- Crib / Toddler Bed Context -->
  <path d="M 70 140 L 70 190 M 170 140 L 170 190" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <rect x="65" y="135" width="110" height="12" rx="4" fill="#94a3b8"/>
  <line x1="85" y1="140" x2="85" y2="190" stroke="#475569" stroke-width="3"/>
  <line x1="105" y1="140" x2="105" y2="190" stroke="#475569" stroke-width="3"/>
  <line x1="125" y1="140" x2="125" y2="190" stroke="#475569" stroke-width="3"/>
  <line x1="145" y1="140" x2="145" y2="190" stroke="#475569" stroke-width="3"/>
  <line x1="165" y1="140" x2="165" y2="190" stroke="#475569" stroke-width="3"/>

  <!-- Dropped Toy (Teddy Bear) on the floor enhancing the emotional narrative -->
  <g transform="translate(75, 185) rotate(-25)">
    <circle cx="10" cy="8" r="8" fill="#d97706"/>
    <circle cx="4" cy="3" r="3" fill="#b45309"/>
    <circle cx="16" cy="3" r="3" fill="#b45309"/>
    <ellipse cx="10" cy="12" rx="9" ry="11" fill="#d97706"/>
    <circle cx="10" cy="14" r="4" fill="#fde68a"/>
    <circle cx="8" cy="13" r="1" fill="#1e293b"/>
    <circle cx="12" cy="13" r="1" fill="#1e293b"/>
  </g>

  <!-- MAIN CHARACTER: CRYING BABY (Hòa mình vào ngữ cảnh "孩子哭了") -->
  <g id="crying-baby" transform="translate(100, 110)">
    <!-- Blanket / Sleep sack around baby's body -->
    <path d="M 15 50 Q 15 25 40 25 Q 65 25 65 50 L 70 75 Q 70 80 65 80 L 15 80 Q 10 80 10 75 Z" fill="#38bdf8"/>
    <!-- Blanket folded edge -->
    <path d="M 12 40 Q 40 48 68 40" fill="none" stroke="#bae6fd" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Arms raised in crying motion -->
    <path d="M 22 35 Q 10 20 8 15" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linecap="round"/>
    <path d="M 58 35 Q 70 20 72 15" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linecap="round"/>
    <!-- Hands / fists -->
    <circle cx="8" cy="13" r="4" fill="#fcd34d"/>
    <circle cx="72" cy="13" r="4" fill="#fcd34d"/>

    <!-- Head & Face (Crying Expression) -->
    <circle cx="40" cy="20" r="18" fill="#fcd34d"/>
    
    <!-- Chubby rosy cheeks -->
    <circle cx="27" cy="24" r="4" fill="#f43f5e" opacity="0.6"/>
    <circle cx="53" cy="24" r="4" fill="#f43f5e" opacity="0.6"/>

    <!-- Tightly closed crying eyes (arcs pointing down/in) -->
    <path d="M 27 16 Q 31 12 35 16" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 45 16 Q 49 12 53 16" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyebrows scrunched up -->
    <path d="M 28 12 L 34 14" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <path d="M 52 12 L 46 14" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

    <!-- Wide open crying mouth -->
    <path d="M 32 23 Q 40 34 48 23 Z" fill="#991b1b"/>
    <!-- Little tongue inside -->
    <path d="M 35 29 Q 40 33 45 29 Z" fill="#f43f5e"/>

    <!-- Tears & Tear Streams -->
    <!-- Left Tear Stream -->
    <path d="M 31 18 Q 28 24 29 31" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <!-- Right Tear Stream -->
    <path d="M 49 18 Q 52 24 51 31" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    
    <!-- Falling Tears (Dynamic motion) -->
    <circle cx="27" cy="35" r="2.5" fill="#38bdf8"/>
    <path d="M 27 32 Q 28.5 35 27 38 Q 25.5 35 27 32 Z" fill="#38bdf8"/>

    <circle cx="53" cy="37" r="3" fill="#38bdf8"/>
    <path d="M 53 33 Q 55 37 53 41 Q 51 37 53 33 Z" fill="#38bdf8"/>

    <!-- Big Splash Tear falling away -->
    <g transform="translate(60, 48)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
      <path d="M 0 -5 Q 2 0 0 5 Q -2 0 0 -5 Z" fill="#38bdf8"/>
    </g>
    <g transform="translate(20, 42)">
      <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
      <path d="M 0 -4 Q 1.5 0 0 4 Q -1.5 0 0 -4 Z" fill="#38bdf8"/>
    </g>

    <!-- Hair tuft (baby hair) -->
    <path d="M 40 2 Q 43 -2 46 1" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  </g>

</svg>