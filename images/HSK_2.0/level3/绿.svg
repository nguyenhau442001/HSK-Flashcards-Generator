<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm backlight for character -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Leaf Green Gradient (Highlighting the target word '绿') -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Magnifier Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background container with rounded HSK app card style -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric back lighting -->
  <circle cx="120" cy="90" r="100" fill="url(#lampGlow)"/>

  <!-- ==================== ENVIRONMENT / PROPS ==================== -->
  
  <!-- Wooden Desk Surface -->
  <path d="M 0 195 L 240 195 L 240 240 L 0 240 Z" fill="#090d16"/>
  <path d="M 0 190 L 240 190 L 240 195 L 0 195 Z" fill="#334155"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#475569" stroke-width="2"/>

  <!-- Potted Plant Stand / Base in Background -->
  <ellipse cx="65" cy="190" rx="22" ry="7" fill="#1e293b"/>
  <path d="M 50 165 L 80 165 L 85 190 L 45 190 Z" fill="#64748b" filter="url(#dropShadow)"/>
  
  <!-- Background Foliage -->
  <path d="M 65 165 Q 40 130 50 110 Q 60 130 65 165 Z" fill="#166534"/>
  <path d="M 65 165 Q 90 120 75 105 Q 65 125 65 165 Z" fill="#15803d"/>

  <!-- Warm Desk Lamp (Top Right) -->
  <path d="M 210 30 L 190 70 L 205 75 L 225 35 Z" fill="#475569"/>
  <ellipse cx="215" cy="32" rx="12" ry="6" fill="#64748b"/>
  <path d="M 195 70 C 185 90 180 110 180 150" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- Light Beam overlay -->
  <polygon points="175,75 225,35 150,190 110,190" fill="#fbbf24" opacity="0.05"/>

  <!-- ==================== CHARACTER ==================== -->
  <g id="character" filter="url(#dropShadow)">
    <!-- Character Torso & Hoodie -->
    <path d="M 85 200 C 85 170 100 150 125 150 C 150 150 165 170 165 200 Z" fill="#38bdf8"/>
    <!-- Hoodie Pocket / Details -->
    <path d="M 105 180 C 105 175 145 175 145 180 L 140 195 L 110 195 Z" fill="#0ea5e9"/>

    <!-- Character Neck -->
    <rect x="113" y="135" width="24" height="20" rx="8" fill="#fbcfe8"/>

    <!-- Character Head -->
    <circle cx="125" cy="115" r="28" fill="#fbcfe8"/>

    <!-- Hair -->
    <path d="M 98 115 C 98 90 152 90 152 115 C 152 125 145 120 140 110 C 130 95 120 95 110 110 C 105 120 98 125 98 115 Z" fill="#1e293b"/>
    <!-- Cute hair tuft -->
    <path d="M 125 93 C 130 85 138 88 135 95 Z" fill="#1e293b"/>

    <!-- Face Expression (Curious, focused, happy) -->
    <!-- Eyes (closed happy arches or focused dots - let's do sweet black dots with catchlights) -->
    <circle cx="115" cy="116" r="2.5" fill="#0f172a"/>
    <circle cx="135" cy="116" r="2.5" fill="#0f172a"/>
    <!-- Rosy Cheeks -->
    <circle cx="111" cy="122" r="4" fill="#fda4af" opacity="0.6"/>
    <circle cx="139" cy="122" r="4" fill="#fda4af" opacity="0.6"/>
    <!-- Smile -->
    <path d="M 121 123 Q 125 127 129 123" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Arm (Holding stem) -->
    <path d="M 90 170 C 80 170 85 190 95 195" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="95" cy="195" r="5" fill="#fbcfe8"/>

    <!-- Right Arm (Holding Magnifying Glass) -->
    <path d="M 160 170 C 175 170 160 145 145 138" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="145" cy="138" r="5" fill="#fbcfe8"/>
  </g>

  <!-- ==================== CENTRAL FOCUS: THE LEAF & MAGNIFIER ==================== -->
  
  <!-- Botanical Specimen Book / Desk Mat -->
  <g filter="url(#dropShadow)">
    <rect x="75" y="160" width="90" height="40" rx="4" fill="#f8fafc"/>
    <rect x="75" y="160" width="45" height="40" rx="4" fill="#f1f5f9"/>
    <!-- Book binding center line -->
    <line x1="120" y1="160" x2="120" y2="200" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Fake text lines on notebook -->
    <line x1="85" y1="172" x2="110" y2="172" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="85" y1="182" x2="105" y2="182" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- The Leaf (Subject of "这片叶子是绿色的。") -->
  <g id="leaf-object" filter="url(#dropShadow)">
    <!-- Main Leaf Stem -->
    <path d="M 105 190 Q 115 175 120 145" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Leaf Blade (Vibrant Green) -->
    <path d="M 120 145 C 145 135 155 160 135 185 C 115 190 100 170 120 145 Z" fill="url(#leafGrad)"/>
    
    <!-- Leaf Veins -->
    <path d="M 120 175 Q 128 170 136 165" fill="none" stroke="#86efac" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 122 166 Q 130 162 140 155" fill="none" stroke="#86efac" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 119 181 Q 112 178 107 175" fill="none" stroke="#86efac" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Magnifying Glass (Highlighting the vivid green color) -->
  <g id="magnifier" filter="url(#dropShadow)">
    <!-- Handle -->
    <path d="M 135 128 L 155 108" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <path d="M 135 128 L 155 108" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Lens Rim -->
    <circle cx="123" cy="138" r="22" fill="none" stroke="#cbd5e1" stroke-width="5"/>
    <circle cx="123" cy="138" r="22" fill="none" stroke="#64748b" stroke-width="2"/>
    
    <!-- Lens Glass Surface (Transparent Blue Tint) -->
    <circle cx="123" cy="138" r="20" fill="url(#lensGrad)"/>
    
    <!-- Lens Glass Specular Highlight -->
    <path d="M 110 126 C 115 122 125 122 132 127" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Sparkles / Vibrancy Indicators (Emphasizing the rich green color) -->
  <g id="sparkles">
    <!-- Star sparkle 1 -->
    <path d="M 145 130 L 147 135 L 152 137 L 147 139 L 145 144 L 143 139 L 138 137 L 143 135 Z" fill="#4ade80" opacity="0.9"/>
    <!-- Star sparkle 2 -->
    <path d="M 98 150 L 99 153 L 102 154 L 99 155 L 98 158 L 97 155 L 94 154 L 97 153 Z" fill="#facc15" opacity="0.8"/>
    <!-- Small glowing dots -->
    <circle cx="130" cy="150" r="2" fill="#4ade80"/>
    <circle cx="112" cy="165" r="1.5" fill="#facc15"/>
  </g>

</svg>