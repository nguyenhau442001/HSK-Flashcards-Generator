<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Warm Plate/Food Accent -->
    <linearGradient id="soup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Flow Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>

  <!-- Ambient Light / Environment Details -->
  <circle cx="120" cy="80" r="90" fill="#38bdf8" opacity="0.03"/>
  
  <!-- Back Wall & Window Frame -->
  <path d="M 30 120 L 210 120" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Wall Plant (Atmospheric depth) -->
  <path d="M 200 120 Q 205 90 220 80" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="220" cy="78" r="6" fill="#10b981"/>
  <circle cx="210" cy="95" r="5" fill="#34d399"/>
  <circle cx="195" cy="105" r="4" fill="#10b981"/>
  <!-- Pot -->
  <path d="M 190 120 L 210 120 L 207 132 L 193 132 Z" fill="#cbd5e1"/>

  <!-- ================= SCENE 1: DINING (First: 我们吃饭) ================= -->
  <g transform="translate(15, 10)" filter="url(#shadow)">
    <!-- Table surface segment -->
    <path d="M 5 125 C 25 115, 75 115, 95 125 L 105 160 C 95 168, 25 168, 5 160 Z" fill="url(#table)"/>

    <!-- Bowl / Food -->
    <ellipse cx="50" cy="132" rx="18" ry="8" fill="#e2e8f0"/>
    <ellipse cx="50" cy="130" rx="15" ry="6" fill="url(#soup)"/>
    <!-- Steam / Action -->
    <path d="M 44 118 Q 47 112 44 106" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 54 116 Q 51 110 54 104" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Chopsticks -->
    <line x1="32" y1="126" x2="68" y2="138" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Mini Dining Character (Head & Shoulders) -->
    <circle cx="50" cy="95" r="14" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 36 95 C 36 82, 64 82, 64 95 C 60 90, 40 90, 36 95 Z" fill="#475569"/>
    <!-- Body/Shirt -->
    <path d="M 32 120 C 32 108, 68 108, 68 120 Z" fill="#ec4899"/>
    <!-- Happy Face -->
    <circle cx="45" cy="95" r="1.5" fill="#1e293b"/>
    <circle cx="55" cy="95" r="1.5" fill="#1e293b"/>
    <path d="M 48 99 Q 50 102 52 99" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>


  <!-- ================= TIMELINE / "SUBSEQUENT" FLOW CONNECTOR ================= -->
  <!-- Action-packed transition curve representing "Then / 然后" -->
  <g filter="url(#shadow)">
    <path d="M 85 95 Q 120 40 155 95" fill="none" stroke="url(#arrowGrad)" stroke-width="6" stroke-dasharray="6 4" stroke-linecap="round"/>
    
    <!-- Flow Direction Arrowhead -->
    <path d="M 145 88 L 158 96 L 148 102" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Floating Sparkles representing chronological progression -->
    <circle cx="120" cy="55" r="3" fill="#fbbf24"/>
    <circle cx="100" cy="65" r="2" fill="#f59e0b"/>
    <circle cx="140" cy="65" r="2" fill="#fbbf24"/>
  </g>


  <!-- ================= SCENE 2: CINEMA / MOVIE (Then: 看电影) ================= -->
  <g transform="translate(130, 10)" filter="url(#shadow)">
    <!-- Table surface segment -->
    <path d="M 5 125 C 25 115, 75 115, 95 125 L 105 160 C 95 168, 25 168, 5 160 Z" fill="url(#table)"/>

    <!-- Cinema Screen / Device -->
    <rect x="30" y="70" cy="0" width="40" height="28" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="33" y="73" width="34" height="22" rx="1" fill="url(#screenGlow)"/>
    <!-- Mini movie imagery on screen -->
    <circle cx="50" cy="84" r="6" fill="#fef08a" opacity="0.8"/>
    <path d="M 40 91 L 46 83 L 52 87 L 60 79" fill="none" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Stand for Screen -->
    <path d="M 50 98 L 50 106" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="50" cy="106" rx="10" ry="3" fill="#64748b"/>

    <!-- Popcorn Tub on Table -->
    <path d="M 72 122 L 78 138 C 78 138, 86 138, 88 138 L 94 122 Z" fill="#ef4444"/>
    <path d="M 73 122 L 93 122 L 91 120 L 75 120 Z" fill="#ffffff"/>
    <circle cx="83" cy="118" r="3" fill="#fef08a"/>
    <circle cx="80" cy="116" r="2.5" fill="#fef08a"/>
    <circle cx="86" cy="117" r="2.5" fill="#fef08a"/>

    <!-- Mini Cinema Character (Head & Shoulders) -->
    <circle cx="50" cy="95" r="14" fill="#fed7aa"/>
    <!-- Hair (Stylish neat cut) -->
    <path d="M 36 92 C 38 78, 62 78, 64 92 C 60 88, 40 88, 36 92 Z" fill="#1e293b"/>
    <!-- 3D Cinema Glasses -->
    <rect x="42" y="91" width="7" height="4" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="51" y="91" width="7" height="4" rx="1" fill="#ec4899" opacity="0.8"/>
    <line x1="49" y1="93" x2="51" y2="93" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Body/Shirt -->
    <path d="M 32 120 C 32 108, 68 108, 68 120 Z" fill="#3b82f6"/>
    
    <!-- Smile beneath glasses -->
    <path d="M 47 100 Q 50 103 53 100" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Floor Shadow Anchor -->
  <ellipse cx="120" cy="185" rx="90" ry="8" fill="#000000" opacity="0.3"/>
</svg>