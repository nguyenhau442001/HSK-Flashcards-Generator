<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Teacher Glow -->
    <radialGradient id="teacher-glow" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Chalkboard Gradient -->
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Window Light -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Ambient Window Light from side -->
  <polygon points="0,0 90,0 40,240 0,240" fill="url(#window-light)"/>

  <!-- Classroom Environment / Background -->
  <!-- Classroom Back Wall -->
  <rect x="15" y="15" width="210" height="155" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Large Chalkboard -->
  <rect x="30" y="25" width="130" height="85" rx="4" fill="url(#board-grad)" stroke="#475569" stroke-width="3"/>
  
  <!-- Abstract Math/Science Drawings on Board (No Text!) -->
  <!-- Geometric shapes & graphs -->
  <path d="M 45 85 L 65 55 L 85 85 Z" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="120" cy="70" r="15" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
  <path d="M 100 85 Q 120 45 140 85" fill="none" stroke="#f472b6" stroke-width="2"/>
  <line x1="40" y1="95" x2="150" y2="95" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bulletin Board / Props on Right Wall -->
  <rect x="175" y="30" width="35" height="45" rx="3" fill="#334155"/>
  <rect x="180" y="38" width="25" height="4" rx="2" fill="#94a3b8"/>
  <rect x="180" y="46" width="18" height="4" rx="2" fill="#cbd5e1"/>
  <circle cx="192" cy="62" r="6" fill="#f43f5e"/>

  <!-- Classroom Floor with perspective -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <!-- Floor wood plank lines -->
  <line x1="0" y1="190" x2="240" y2="190" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="0" y1="215" x2="240" y2="215" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Teacher Glow Effect -->
  <circle cx="140" cy="130" r="70" fill="url(#teacher-glow)"/>

  <!-- Teacher's Desk / Podium -->
  <g filter="url(#shadow)">
    <!-- Desk Body -->
    <path d="M 115 145 L 195 145 L 185 190 L 125 190 Z" fill="#334155"/>
    <!-- Desk Front Panel -->
    <path d="M 120 150 L 190 150 L 183 185 L 127 185 Z" fill="#475569"/>
    <!-- Desk Top Surface -->
    <polygon points="105,145 205,145 195,138 115,138" fill="#64748b"/>
    <!-- Open Book / Laptop on Desk -->
    <path d="M 135 140 L 150 135 L 165 140 L 150 145 Z" fill="#f8fafc"/>
    <path d="M 170 138 L 185 136 L 190 142 L 175 144 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Teacher Character (讲课 - Lecturing / Explaining) -->
  <g id="teacher" filter="url(#shadow)">
    <!-- Body / Suit Jacket -->
    <path d="M 135 155 L 165 155 L 172 200 L 128 200 Z" fill="#1e293b"/>
    <path d="M 142 155 L 150 175 L 158 155 Z" fill="#f8fafc"/> <!-- Shirt collar & tie -->
    <polygon points="148,162 152,162 150,175" fill="#ef4444"/> <!-- Red Tie -->

    <!-- Head & Hair -->
    <circle cx="150" cy="115" r="16" fill="#fbcfe8"/> <!-- Face base (warm skin tone) -->
    <path d="M 134 115 C 134 100, 166 100, 166 115 C 166 120, 160 115, 150 112 C 140 115, 134 120, 134 115 Z" fill="#334155"/> <!-- Neat hair -->

    <!-- Facial Expression (Engaged, enthusiastic teaching) -->
    <!-- Friendly smiling eyes -->
    <path d="M 142 112 Q 145 109 148 112" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 152 112 Q 155 109 158 112" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Open enthusiastic smile (speaking / lecturing) -->
    <path d="M 146 120 Q 150 125 154 120" fill="#fda4af" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Left Arm (Gesturing actively / explaining) -->
    <path d="M 135 160 Q 115 145 110 130" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="110" cy="128" r="4" fill="#fbcfe8"/>

    <!-- Right Arm (Holding chalk / pointing to board) -->
    <path d="M 165 160 Q 185 135 190 120" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="191" cy="118" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Student Desks & Students in Foreground/Midground -->
  <!-- Student 1 (Left, listening attentively) -->
  <g id="student-left" filter="url(#shadow)">
    <!-- Desk -->
    <path d="M 25 180 L 85 180 L 75 220 L 35 220 Z" fill="#475569"/>
    <polygon points="20,180 90,180 80,173 30,173" fill="#64748b"/>
    
    <!-- Student Body -->
    <path d="M 45 185 L 65 185 L 70 230 L 40 230 Z" fill="#3b82f6"/>
    
    <!-- Head & Hair -->
    <circle cx="55" cy="155" r="13" fill="#fed7aa"/>
    <path d="M 42 155 C 42 142, 68 142, 68 155 C 68 158, 60 152, 55 152 C 50 152, 42 158, 42 155 Z" fill="#0f172a"/>
    
    <!-- Attentive face profile/angle -->
    <circle cx="59" cy="157" r="1.5" fill="#1e293b"/>
    <path d="M 54 163 Q 57 166 60 163" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Notebook & Pen on Student Desk -->
    <rect x="42" y="175" width="24" height="4" rx="1" fill="#f8fafc"/>
    <line x1="45" y1="177" x2="60" y2="177" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Student 2 (Center-left, writing notes) -->
  <g id="student-center" filter="url(#shadow)">
    <!-- Desk -->
    <path d="M 80 195 L 140 195 L 130 240 L 90 240 Z" fill="#334155"/>
    <polygon points="75,195 145,195 135,188 85,188" fill="#475569"/>

    <!-- Student Body -->
    <path d="M 100 200 L 125 200 L 130 240 L 95 240 Z" fill="#ec4899"/>

    <!-- Head (Bent down taking notes) -->
    <circle cx="110" cy="175" r="13" fill="#fde68a"/>
    <path d="M 97 172 C 97 160, 123 160, 123 172 C 123 177, 118 172, 110 172 C 102 172, 97 177, 97 172 Z" fill="#78350f"/>

    <!-- Hand writing -->
    <path d="M 115 188 L 122 192" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Ambient lighting / highlight particles for app-polish -->
  <circle cx="180" cy="80" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="160" cy="45" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="60" cy="60" r="2" fill="#34d399" opacity="0.6"/>
  <circle cx="95" cy="40" r="1.5" fill="#f472b6" opacity="0.6"/>

  <!-- Decorative App Frame Border (Subtle inner glow rim) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>