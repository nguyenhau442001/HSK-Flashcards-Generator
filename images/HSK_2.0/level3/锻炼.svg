<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Window Glow Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Sunset/Morning Warm Light -->
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Pants Gradient -->
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Dumbbell Metallic Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    
    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT & INTERIOR DETAILS -->
  <!-- Room Back Wall & Floor Divider -->
  <path d="M 0,175 L 240,175" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <rect x="0" y="175" width="240" height="65" fill="url(#floorGrad)" />
  <path d="M 0,175 L 240,175" stroke="#475569" stroke-width="2"/>

  <!-- Large Window Frame (Background Context) -->
  <rect x="135" y="40" width="75" height="110" rx="4" fill="#0f172a" stroke="#334155" stroke-width="3" />
  <!-- Window Panes & Light -->
  <rect x="140" y="45" width="31.5" height="50" fill="url(#windowGlow)" />
  <rect x="175.5" y="45" width="31.5" height="50" fill="url(#windowGlow)" />
  <rect x="140" y="99" width="31.5" height="46" fill="url(#windowGlow)" />
  <rect x="175.5" y="99" width="31.5" height="46" fill="url(#windowGlow)" />
  <!-- City Skyline Silhouette through Window -->
  <path d="M 145,135 L 145,115 L 152,115 L 152,135 L 160,135 L 160,105 L 170,105 L 170,135 L 182,135 L 182,90 L 195,90 L 195,135 L 205,135" fill="#1e293b" opacity="0.8"/>
  <!-- Morning Sun / Glow Effect -->
  <circle cx="172.5" cy="70" r="14" fill="url(#sunGlow)" />

  <!-- Potted Plant (Prop for Interior Depth) -->
  <path d="M 205,175 L 213,145 L 227,145 L 235,175 Z" fill="#64748b" />
  <ellipse cx="220" cy="145" rx="7" ry="2" fill="#94a3b8" />
  <!-- Plant Leaves -->
  <path d="M 220,145 Q 210,120 195,125" fill="none" stroke="url(#leafGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 220,145 Q 235,110 240,115" fill="none" stroke="url(#leafGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 220,145 Q 225,115 220,100" fill="none" stroke="url(#leafGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Yoga / Exercise Mat -->
  <path d="M 35,185 Q 35,178 45,178 L 145,178 Q 155,178 155,185 Q 155,192 145,192 L 45,192 Q 35,192 35,185 Z" fill="#0284c7" opacity="0.4" />
  <path d="M 35,185 L 155,185" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />

  <!-- WATER BOTTLE (Prop for Exercise) -->
  <rect x="25" y="155" width="10" height="20" rx="3" fill="#cbd5e1" />
  <path d="M 27,155 L 33,155 L 33,152 L 27,152 Z" fill="#38bdf8" />
  <path d="M 28,162 L 32,162" stroke="#94a3b8" stroke-width="1" />

  <!-- MAIN CHARACTER: WORKING OUT / EXERCISING ("锻炼") -->
  <!-- Character Shadow on Floor -->
  <ellipse cx="90" cy="187" rx="35" ry="7" fill="#020617" opacity="0.6"/>

  <!-- Legs in Lunge / Squat Pose -->
  <!-- Back leg (bent knee kneeling/stretching) -->
  <path d="M 75,145 Q 60,165 50,178 Q 65,183 75,175" fill="url(#pantsGrad)" stroke="#1e293b" stroke-width="1" stroke-linejoin="round"/>
  <!-- Front leg (bent knee forward) -->
  <path d="M 95,145 L 115,175 L 135,178 Q 130,183 110,183 Q 95,180 90,160" fill="url(#pantsGrad)" stroke="#1e293b" stroke-width="1" stroke-linejoin="round"/>
  <!-- Sneakers -->
  <path d="M 45,178 Q 40,182 52,185 L 68,185 Q 73,185 70,178 Z" fill="#f8fafc" />
  <path d="M 120,178 Q 125,185 140,183 L 140,175 Z" fill="#f8fafc" />

  <!-- Torso (Dynamic leaning forward posture for exercise) -->
  <path d="M 70,110 Q 90,115 100,145 L 75,150 Q 65,130 65,115 Z" fill="url(#shirtGrad)" stroke="#0284c7" stroke-width="1" stroke-linejoin="round"/>
  <!-- Athletic Armband Detail -->
  <rect x="73" y="118" width="8" height="6" rx="2" fill="#f59e0b" transform="rotate(15 77 121)" />

  <!-- Head & Face -->
  <!-- Neck -->
  <path d="M 68,105 L 75,112" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
  <!-- Head Circle -->
  <circle cx="62" cy="95" r="15" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" />
  <!-- Hair (Stylish short sporty hair) -->
  <path d="M 48,95 Q 49,82 62,80 Q 77,80 75,93 Q 70,86 62,86 Q 52,86 48,95 Z" fill="#1e293b" />
  <!-- Determined Facial Expression (Sweat drop & focused eyes) -->
  <!-- Eye (Closed focus/effort arc) -->
  <path d="M 58,95 Q 62,98 66,95" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Smiling / Gritting expression -->
  <path d="M 62,101 Q 65,103 68,101" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sweat Drop (Classic exertion symbol) -->
  <path d="M 72,90 Q 75,95 72,98 Q 69,95 72,90 Z" fill="#38bdf8" opacity="0.9" />

  <!-- Arms holding Dumbbells / Exercising -->
  <!-- Back Arm reaching back/up -->
  <path d="M 75,115 Q 60,110 50,125" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <circle cx="50" cy="126" r="5" fill="#fde047" />

  <!-- Front Arm pressing forward/up with dumbbell -->
  <path d="M 75,115 Q 95,110 105,125" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  
  <!-- Dumbbell in Hand -->
  <g transform="translate(105, 125) rotate(25)">
    <!-- Handle -->
    <rect x="-4" y="-12" width="8" height="24" rx="2" fill="url(#metalGrad)" />
    <!-- Weights Left -->
    <rect x="-8" y="-16" width="16" height="6" rx="2" fill="#334155" stroke="#64748b" stroke-width="1" />
    <!-- Weights Right -->
    <rect x="-8" y="10" width="16" height="6" rx="2" fill="#334155" stroke="#64748b" stroke-width="1" />
    <!-- Accent Ring on Dumbbell -->
    <rect x="-6" y="-3" width="12" height="6" rx="1" fill="#f59e0b" />
  </g>

  <!-- DYNAMIC MOTION & ENERGY EFFECTS (Subtle glowing particles) -->
  <circle cx="120" cy="110" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="128" cy="118" r="1.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="40" cy="140" r="2" fill="#38bdf8" opacity="0.5"/>
  <path d="M 112,135 Q 118,130 125,138" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- FOREGROUND FRAME ACCENTS (Subtle Vignette / Polish) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15" />
</svg>