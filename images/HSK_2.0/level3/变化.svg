<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="energyLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Ground/Street -->
  <path d="M0 180 Q120 170 240 180 L240 240 L0 240 Z" fill="#334155" />
  
  <!-- LEFT SIDE: THE PAST (Traditional/Old) -->
  <g clip-path="inset(0 120 0 0)">
    <!-- Old Brick Building -->
    <rect x="20" y="80" width="80" height="100" fill="#78350f" />
    <rect x="35" y="100" width="15" height="20" fill="#451a03" />
    <rect x="65" y="100" width="15" height="20" fill="#451a03" />
    <rect x="35" y="140" width="15" height="20" fill="#451a03" />
    <rect x="65" y="140" width="15" height="20" fill="#451a03" />
    
    <!-- Vintage Lamp Post -->
    <rect x="105" y="120" width="4" height="60" fill="#475569" />
    <circle cx="107" y="115" r="8" fill="#f59e0b" fill-opacity="0.3" />
    <circle cx="107" y="115" r="4" fill="#fbbf24" />
    
    <!-- Cobblestone details -->
    <rect x="10" y="190" width="15" height="8" rx="2" fill="#475569" opacity="0.5" />
    <rect x="40" y="200" width="15" height="8" rx="2" fill="#475569" opacity="0.5" />
    <rect x="80" y="195" width="15" height="8" rx="2" fill="#475569" opacity="0.5" />
  </g>

  <!-- RIGHT SIDE: THE FUTURE (Modern/Tech) -->
  <g clip-path="inset(0 0 0 120)">
    <!-- Modern Glass Skyscraper -->
    <rect x="140" y="40" width="70" height="140" fill="#0c4a6e" />
    <rect x="145" y="45" width="60" height="130" fill="#0ea5e9" opacity="0.4" />
    
    <!-- Neon Accents -->
    <rect x="140" y="70" width="70" height="2" fill="#ec4899" />
    <rect x="140" y="110" width="70" height="2" fill="#38bdf8" />
    
    <!-- Floating Drone -->
    <g transform="translate(180, 60)">
      <rect x="0" y="0" width="20" height="6" rx="3" fill="#10b981" />
      <path d="M2 0 L6 -4 M14 0 L18 -4" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="4" cy="-5" r="3" fill="#334155" />
      <circle cx="16" cy="-5" r="3" fill="#334155" />
    </g>
    
    <!-- High-tech Road -->
    <path d="M120 210 L240 210" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4" />
    <circle cx="160" cy="225" r="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="200" cy="225" r="12" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
  </g>

  <!-- TRANSITION EFFECT (The "Change" Line) -->
  <rect x="118" y="20" width="4" height="200" fill="url(#energyLine)" />
  <path d="M120 20 L110 40 M120 80 L135 100 M120 160 L105 180" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  
  <!-- Atmospheric Particles -->
  <circle cx="40" cy="50" r="1" fill="#fde68a" opacity="0.4" />
  <circle cx="200" cy="30" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="220" cy="100" r="1" fill="#ec4899" opacity="0.5" />
  <circle cx="30" cy="120" r="1.2" fill="#fbbf24" opacity="0.3" />
</svg>