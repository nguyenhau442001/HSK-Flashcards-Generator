<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Golden Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Coin Rim Gradient -->
    <linearGradient id="coinRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="15%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <g opacity="0.15">
    <circle cx="40" cy="50" r="30" fill="#38bdf8"/>
    <circle cx="200" cy="80" r="45" fill="#f59e0b"/>
    <path d="M 120 20 Q 150 50 180 20" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  </g>

  <!-- Wooden / Modern Counter Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#tableGrad)"/>
  <rect x="0" y="166" width="240" height="4" fill="#38bdf8" opacity="0.6"/>

  <!-- SCENE: OPEN BOOK (Representing "Cuốn sách này...") -->
  <g transform="translate(35, 95)" filter="url(#shadow)">
    <!-- Book Shadow -->
    <ellipse cx="85" cy="85" rx="75" ry="15" fill="#020617" opacity="0.6" filter="url(#glow)"/>

    <!-- Book Base / Pages -->
    <path d="M 15 75 Q 85 95 155 75 L 155 15 Q 85 30 15 15 Z" fill="#f8fafc"/>
    
    <!-- Left Page -->
    <path d="M 15 15 Q 85 30 85 85 L 85 95 Q 15 75 15 15 Z" fill="#f1f5f9"/>
    <path d="M 25 30 L 70 35 M 25 45 L 65 50 M 25 60 L 70 65" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Page -->
    <path d="M 85 85 Q 85 30 155 15 L 155 75 Q 85 95 85 85 Z" fill="#ffffff"/>
    <path d="M 100 30 L 145 25 M 100 45 L 135 40 M 100 60 L 145 55" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <!-- Book Spine & Cover -->
    <path d="M 10 15 Q 85 32 160 15 L 163 25 Q 85 42 7 25 Z" fill="url(#bookCover)"/>
    <path d="M 12 18 Q 85 35 158 18 L 158 78 Q 85 98 12 78 Z" fill="url(#bookCover)"/>
    
    <!-- Bookmark Ribbon hanging out -->
    <path d="M 83 40 L 83 105 L 88 115 L 93 105 L 93 40 Z" fill="#ef4444"/>
  </g>

  <!-- SCENE: STACK OF CHINESE YUAN COINS (Representing "ba mươi đồng") -->
  <!-- Bottom Coin -->
  <g transform="translate(145, 130)" filter="url(#shadow)">
    <ellipse cx="35" cy="20" rx="35" ry="16" fill="#b45309"/>
    <ellipse cx="35" cy="17" rx="35" ry="16" fill="url(#coinGrad)"/>
    <ellipse cx="35" cy="17" rx="32" ry="13" fill="none" stroke="url(#coinRim)" stroke-width="1.5"/>
    <!-- Square Hole -->
    <path d="M 31 13 L 39 13 L 39 21 L 31 21 Z" fill="#1e293b"/>
  </g>

  <!-- Middle Coin -->
  <g transform="translate(135, 110)" filter="url(#shadow)">
    <ellipse cx="35" cy="20" rx="35" ry="16" fill="#b45309"/>
    <ellipse cx="35" cy="17" rx="35" ry="16" fill="url(#coinGrad)"/>
    <ellipse cx="35" cy="17" rx="32" ry="13" fill="none" stroke="url(#coinRim)" stroke-width="1.5"/>
    <!-- Square Hole -->
    <path d="M 31 13 L 39 13 L 39 21 L 31 21 Z" fill="#1e293b"/>
    <!-- Embossed star/symbol detail (abstract, non-text) -->
    <circle cx="23" cy="17" r="1.5" fill="#fef3c7" opacity="0.7"/>
    <circle cx="47" cy="17" r="1.5" fill="#fef3c7" opacity="0.7"/>
  </g>

  <!-- Top Coin (Tilted/Dynamic action) -->
  <g transform="translate(150, 85) rotate(-15)" filter="url(#shadow)">
    <ellipse cx="35" cy="20" rx="35" ry="16" fill="#b45309"/>
    <ellipse cx="35" cy="17" rx="35" ry="16" fill="url(#coinGrad)"/>
    <ellipse cx="35" cy="17" rx="32" ry="13" fill="none" stroke="url(#coinRim)" stroke-width="1.5"/>
    <!-- Square Hole -->
    <path d="M 31 13 L 39 13 L 39 21 L 31 21 Z" fill="#1e293b"/>
    <circle cx="35" cy="8" r="1.5" fill="#fef3c7" opacity="0.7"/>
    <circle cx="35" cy="26" r="1.5" fill="#fef3c7" opacity="0.7"/>
  </g>

  <!-- Floating Sparkles & Action Elements -->
  <g filter="url(#glow)">
    <!-- Golden Sparkle 1 -->
    <path d="M 120 70 Q 120 80 110 80 Q 120 80 120 90 Q 120 80 130 80 Q 120 80 120 70 Z" fill="#fbbf24"/>
    <!-- Golden Sparkle 2 -->
    <path d="M 195 95 Q 195 101 189 101 Q 195 101 195 107 Q 195 101 201 101 Q 195 101 195 95 Z" fill="#fef3c7"/>
    <!-- Little Accent Dot -->
    <circle cx="110" cy="120" r="3" fill="#38bdf8"/>
    <circle cx="180" cy="145" r="4" fill="#10b981"/>
  </g>

  <!-- Foreground Atmospheric Leaf/Pen to add framing/depth -->
  <g transform="translate(15, 140) rotate(-25)">
    <!-- Cute Pencil/Stylus representing study props -->
    <path d="M 0 0 L 15 0 L 12 40 L 3 40 Z" fill="#ec4899"/>
    <path d="M 3 40 L 12 40 L 7.5 48 Z" fill="#f59e0b"/>
    <path d="M 7.5 48 L 9 51 L 6 51 Z" fill="#1e293b"/>
    <rect x="2" y="3" width="11" height="3" fill="#ffffff" opacity="0.8"/>
  </g>

</svg>