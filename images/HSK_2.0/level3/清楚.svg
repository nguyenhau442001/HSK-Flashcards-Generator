<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Magnifier Beam -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glass Lens Gradient -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Document Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background elements / Workshop desk texture -->
  <g opacity="0.15">
    <circle cx="40" cy="50" r="2" fill="#ffffff" />
    <circle cx="200" cy="40" r="3" fill="#ffffff" />
    <circle cx="210" cy="180" r="1.5" fill="#ffffff" />
    <circle cx="30" cy="200" r="2" fill="#ffffff" />
    <path d="M 0 190 Q 60 180 120 195 T 240 185" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Atmospheric Light Beam from Magnifier -->
  <polygon points="125,105 40,240 210,240" fill="url(#beamGrad)" />

  <!-- Background Map / Document Context (Blurred/Darker) -->
  <g transform="translate(35, 30) rotate(-6)">
    <!-- Base Paper -->
    <rect x="0" y="0" width="130" height="100" rx="6" fill="#334155" opacity="0.6" />
    <!-- Blurry lines representing complex, unclear text -->
    <rect x="15" y="20" width="70" height="6" rx="3" fill="#64748b" opacity="0.5" />
    <rect x="15" y="36" width="100" height="6" rx="3" fill="#64748b" opacity="0.5" />
    <rect x="15" y="52" width="50" height="6" rx="3" fill="#64748b" opacity="0.5" />
    <rect x="15" y="68" width="85" height="6" rx="3" fill="#64748b" opacity="0.5" />
  </g>

  <!-- Main Crisp Document / Blueprint (The "Clear" Focus) -->
  <g transform="translate(65, 45) rotate(4)" filter="url(#shadow)">
    <!-- Paper Sheet -->
    <rect x="0" y="0" width="125" height="135" rx="8" fill="url(#paperGrad)" />
    
    <!-- Paper clip at top -->
    <path d="M 35,-6 C 35,-14 49,-14 49,-6 L 49,8 C 49,12 35,12 35,8 Z" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Unclear/Blurry background lines on the paper -->
    <g opacity="0.25">
      <rect x="16" y="25" width="60" height="5" rx="2.5" fill="#94a3b8" />
      <rect x="16" y="38" width="80" height="5" rx="2.5" fill="#94a3b8" />
      <rect x="16" y="51" width="45" height="5" rx="2.5" fill="#94a3b8" />
    </g>

    <!-- CRYSTAL CLEAR ELEMENT: Detailed architectural/mechanical crisp drawing revealed -->
    <g transform="translate(16, 65)">
      <!-- Target Icon / Compass Crisp Symbol -->
      <circle cx="45" cy="35" r="24" fill="none" stroke="#3b82f6" stroke-width="3.5" />
      <circle cx="45" cy="35" r="8" fill="#10b981" />
      <path d="M 45,5 L 45,15 M 45,55 L 45,65 M 15,35 L 25,35 M 65,35 L 75,35" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
      
      <!-- Crisp Checkmark Badge representing "Clarity/Correctness" -->
      <circle cx="85" cy="15" r="12" fill="#10b981" />
      <path d="M 79,15 L 83,19 L 92,10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Crisp mini data bars -->
      <rect x="0" y="70" width="12" height="20" rx="3" fill="#f59e0b" />
      <rect x="18" y="60" width="12" height="30" rx="3" fill="#3b82f6" />
      <rect x="36" y="50" width="12" height="40" rx="3" fill="#10b981" />
      <rect x="54" y="65" width="12" height="25" rx="3" fill="#ec4899" />
    </g>
  </g>

  <!-- Interactive Magnifying Glass (The Action Tool of Clarity) -->
  <g transform="translate(125, 115) rotate(-15)" filter="url(#shadow)">
    <!-- Light Beam / Focus Circle under lens -->
    <circle cx="0" cy="0" r="46" fill="#fef08a" opacity="0.15" filter="url(#glow)" />

    <!-- Magnifier Handle -->
    <!-- Metallic/Modern dark handle with warm orange accent -->
    <rect x="-12" y="35" width="24" height="65" rx="12" fill="#334155" />
    <rect x="-7" y="35" width="14" height="65" rx="7" fill="#fb923c" />
    
    <!-- Handle grip ridges -->
    <line x1="-7" y1="50" x2="7" y2="50" stroke="#ea580c" stroke-width="2" opacity="0.6" />
    <line x1="-7" y1="65" x2="7" y2="65" stroke="#ea580c" stroke-width="2" opacity="0.6" />
    <line x1="-7" y1="80" x2="7" y2="80" stroke="#ea580c" stroke-width="2" opacity="0.6" />

    <!-- Handle Connector / Collar -->
    <rect x="-16" y="25" width="32" height="14" rx="4" fill="#64748b" />
    <rect x="-14" y="27" width="28" height="10" rx="3" fill="#94a3b8" />

    <!-- Outer Rim of Lens (Glossy Steel/Blue) -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#1e293b" stroke-width="8" />
    <circle cx="0" cy="0" r="44" fill="none" stroke="#38bdf8" stroke-width="5" />
    <circle cx="0" cy="0" r="40" fill="url(#lensGlass)" />

    <!-- Lens Specular Highlight (Glass Shine) -->
    <path d="M -28 -24 C -15 -35 15 -35 28 -24 C 20 -30 -20 -30 -28 -24 Z" fill="#ffffff" opacity="0.6" rx="4" />
  </g>

  <!-- Dynamic Accent Sparks / Starbursts signifying "Aha! Crystal Clear!" -->
  <g fill="#f59e0b">
    <path d="M 185,55 L 188,65 L 198,68 L 188,71 L 185,81 L 182,71 L 172,68 L 182,65 Z" filter="url(#glow)" />
    <path d="M 65,160 L 67,166 L 73,168 L 67,170 L 65,176 L 63,170 L 57,168 L 63,166 Z" fill="#38bdf8" />
    <circle cx="160" cy="35" r="3" fill="#fbbf24" />
    <circle cx="75" cy="25" r="2" fill="#38bdf8" />
  </g>

  <!-- Floating Sparkles / Clarity indicators -->
  <g opacity="0.9">
    <circle cx="105" cy="95" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="130" cy="75" r="2.5" fill="#f59e0b" />
    <circle cx="120" cy="140" r="3" fill="#10b981" />
  </g>
</svg>