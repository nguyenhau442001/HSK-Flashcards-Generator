<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Road Gradient (Long ribbon-like road) -->
    <linearGradient id="roadGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing accent for action feel -->
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Background Environment (Hills, Trees, Sun/Moon) -->
  <g id="scenery">
    <!-- Moon / Glowing Orb -->
    <circle cx="190" cy="55" r="18" fill="#fbbf24" opacity="0.9" />
    <circle cx="190" cy="55" r="24" fill="#fbbf24" opacity="0.2" />

    <!-- Distant Mountains / Hills -->
    <path d="M0 120 Q50 90 100 110 T240 95 L240 240 L0 240 Z" fill="#1e1b4b" opacity="0.6" />
    <path d="M0 140 Q70 115 150 130 T240 125 L240 240 L0 240 Z" fill="#312e81" opacity="0.8" />

    <!-- Pine Trees on Hills -->
    <polygon points="30,125 38,105 46,125" fill="#065f46" />
    <polygon points="34,115 38,105 42,115" fill="#34d399" opacity="0.3" />
    
    <polygon points="205,130 213,112 221,130" fill="#065f46" />
    <polygon points="170,135 177,118 184,135" fill="#065f46" />
  </g>

  <!-- THE MAIN SUBJECT: A long winding road ("条" - long strip classifier in action) -->
  <g id="long_road">
    <!-- Road Base Shadow/Glow -->
    <path d="M -10 240 Q 60 170 120 180 T 250 140 L 250 240 Z" fill="#0f172a" />
    
    <!-- The Long Road Itself -->
    <path d="M 10 240 Q 70 160 130 175 T 230 130" 
          fill="none" stroke="url(#roadGrad)" stroke-width="36" stroke-linecap="round" />
    
    <!-- Road Borders (Curbs) -->
    <path d="M 10 240 Q 70 160 130 175 T 230 130" 
          fill="none" stroke="#64748b" stroke-width="40" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="0" style="mix-blend-mode: overlay;" />

    <!-- Glowing Center Stripe (Emphasizing the length) -->
    <path d="M 10 240 Q 70 160 130 175 T 230 130" 
          fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10,8" stroke-linecap="round" />
          
    <!-- Dynamic Speed Light Streaks -->
    <path d="M 30 220 Q 80 165 125 176" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Foreground Elements (Enhancing scale and depth) -->
  <g id="foreground_props">
    <!-- Cute delivery scooter driving along the long road -->
    <g transform="translate(110, 158) scale(0.8)">
      <!-- Scooter Shadow -->
      <ellipse cx="15" cy="18" rx="12" ry="4" fill="#000000" opacity="0.4" />
      
      <!-- Scooter Body -->
      <path d="M 5 10 Q 15 -2 25 5 L 28 15 L 2 15 Z" fill="#ec4899" />
      <circle cx="8" cy="15" r="5" fill="#334155" />
      <circle cx="24" cy="15" r="5" fill="#334155" />
      
      <!-- Rider (Little character) -->
      <circle cx="16" cy="0" r="6" fill="#fb923c" /> <!-- Helmet -->
      <path d="M 12 5 Q 16 2 20 5 L 18 12 L 14 12 Z" fill="#38bdf8" /> <!-- Jacket -->
      
      <!-- Motion lines behind scooter -->
      <line x1="-3" y1="12" x2="-8" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="-5" y1="8" x2="-12" y2="8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Streetlamp casting warm light -->
    <g transform="translate(45, 175)">
      <!-- Pole -->
      <rect x="0" y="-45" width="4" height="45" fill="#475569" rx="2" />
      <!-- Lamp Head -->
      <path d="M -6 -45 L 10 -45 L 6 -50 L -2 -50 Z" fill="#334155" />
      <!-- Light Cone -->
      <polygon points="2,-45 2,25 35,35 2,-45" fill="#fbbf24" opacity="0.15" />
      <!-- Glow Circle -->
      <circle cx="2" cy="-45" r="8" fill="#fbbf24" opacity="0.8" />
    </g>

    <!-- Additional roadside details -->
    <!-- Bush 1 -->
    <circle cx="75" cy="195" r="10" fill="#047857" />
    <circle cx="84" cy="198" r="8" fill="#059669" />
    <circle cx="68" cy="200" r="7" fill="#065f46" />

    <!-- Bush 2 -->
    <circle cx="180" cy="135" r="8" fill="#047857" />
    <circle cx="187" cy="138" r="6" fill="#059669" />

    <!-- Floating Sparkles / Atmosphere -->
    <circle cx="100" cy="80" r="1.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="140" cy="65" r="2" fill="#fbbf24" opacity="0.7" />
    <circle cx="60" cy="100" r="1.5" fill="#fbbf24" opacity="0.9" />
    <circle cx="165" cy="105" r="2" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Foreground Frame / Vignette Effect (Clean rounded border overlay) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="4" opacity="0.4" />
</svg>