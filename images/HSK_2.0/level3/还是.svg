<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Base Background -->
    <rect width="240" height="240" fill="url(#bgGrad)"/>
    
    <!-- Ambient Interior Lighting / Window shape -->
    <path d="M150 20 L210 20 L210 130 L150 130 Z" fill="#334155" opacity="0.3"/>
    <path d="M155 25 L205 25 L205 125 L155 125 Z" fill="#0f172a" opacity="0.5"/>
    <!-- Medical cross subtle wall decor -->
    <g transform="translate(180, 50)" opacity="0.15">
      <rect x="-3" y="-12" width="6" height="24" rx="2" fill="#38bdf8"/>
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#38bdf8"/>
    </g>

    <!-- Ambient Glow from Desk Lamp -->
    <circle cx="150" cy="110" r="70" fill="url(#warmGlow)"/>

    <!-- Desk / Counter Surface -->
    <path d="M10 180 L230 180 L230 240 L10 240 Z" fill="url(#tableGrad)"/>
    <line x1="10" y1="180" x2="230" y2="180" stroke="#475569" stroke-width="2"/>

    <!-- Medical Props on Desk -->
    <!-- Stethoscope -->
    <path d="M 60 190 Q 75 190 80 205 Q 85 220 100 210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="210" r="6" fill="#cbd5e1" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Medical Clipboard / Chart -->
    <g transform="translate(170, 160) rotate(10)">
      <rect x="0" y="0" width="30" height="40" rx="3" fill="#cbd5e1"/>
      <rect x="8" y="-4" width="14" height="6" rx="2" fill="#64748b"/>
      <line x1="6" y1="10" x2="24" y2="10" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="18" x2="20" y2="18" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="26" x2="22" y2="26" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Character 1: Friend / Advisor (Standing, showing concern, pointing/advising) -->
    <g id="advisor-character">
      <!-- Body / Torso -->
      <path d="M 175 185 L 205 185 L 210 130 L 170 130 Z" fill="#0ea5e9"/>
      <!-- Head -->
      <circle cx="190" cy="105" r="16" fill="#fbcfe8"/>
      <!-- Hair -->
      <path d="M 175 100 Q 190 85 206 100 Q 200 90 190 90 Q 180 90 175 100 Z" fill="#334155"/>
      <!-- Facial expression: caring, earnest eyes & mouth -->
      <circle cx="185" cy="105" r="1.5" fill="#1e293b"/>
      <circle cx="195" cy="105" r="1.5" fill="#1e293b"/>
      <path d="M 188 113 Q 190 115 192 113" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Arm gesturing towards hospital/doctor advice -->
      <path d="M 180 135 L 140 145 L 135 140" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="133" cy="138" r="5" fill="#fbcfe8"/>
    </g>

    <!-- Character 2: Patient (Sitting, looking unwell, holding head/arm, hesitant) -->
    <g id="patient-character">
      <!-- Torso -->
      <path d="M 50 190 L 95 190 L 100 130 L 65 130 Z" fill="#10b981"/>
      <!-- Head -->
      <circle cx="75" cy="105" r="17" fill="#fde047"/> <!-- slightly pale/warm tone -->
      <circle cx="75" cy="105" r="17" fill="#fbcfe8" opacity="0.6"/>
      <!-- Hair -->
      <path d="M 59 105 Q 75 80 91 105 Q 85 92 75 92 Q 65 92 59 105 Z" fill="#1e293b"/>
      <!-- Worried/Unwell Face -->
      <circle cx="70" cy="106" r="1.5" fill="#1e293b"/>
      <circle cx="80" cy="106" r="1.5" fill="#1e293b"/>
      <!-- Worried eyebrows -->
      <line x1="67" y1="102" x2="73" y2="104" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="77" y1="104" x2="83" y2="102" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Frown / worried mouth -->
      <path d="M 72 115 Q 75 112 78 115" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Feverish / Sick cheek flush -->
      <circle cx="67" cy="110" r="3" fill="#ef4444" opacity="0.3"/>
      <circle cx="83" cy="110" r="3" fill="#ef4444" opacity="0.3"/>

      <!-- Hand touching forehead (showing feeling unwell) -->
      <path d="M 68 135 L 65 115 L 75 105" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="75" cy="105" r="4.5" fill="#fbcfe8"/>
    </g>

    <!-- Visual emphasis/suggestion element (Thermometer floating gently above) -->
    <g transform="translate(115, 60) rotate(-15)">
      <!-- Thermometer -->
      <rect x="-4" y="-20" width="8" height="35" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
      <circle cx="0" cy="18" r="6" fill="#ef4444"/>
      <rect x="-2" y="-10" width="4" height="20" rx="2" fill="#ef4444"/>
      <!-- Glow rays -->
      <path d="M -12 -25 L -8 -21" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <path d="M 12 -25 L 8 -21" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <path d="M -15 -5 L -10 -5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Warm accent lighting highlight on top rim -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
  </g>
</svg>