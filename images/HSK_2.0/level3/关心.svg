<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Moonlight -->
    <linearGradient id="moonlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Classroom/Office Interior Background -->
  <!-- Window -->
  <g transform="translate(15, 20)">
    <rect x="0" y="0" width="45" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="3" y="3" width="39" height="69" rx="2" fill="url(#moonlight)"/>
    <!-- Window Grid -->
    <line x1="22.5" y1="3" x2="22.5" y2="72" stroke="#334155" stroke-width="1.5"/>
    <line x1="3" y1="37.5" x2="42" y2="37.5" stroke="#334155" stroke-width="1.5"/>
    <!-- Cute Moon outside -->
    <circle cx="33" cy="15" r="5" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Bookshelf Background Element -->
  <g transform="translate(180, 25)">
    <rect x="0" y="0" width="45" height="90" rx="2" fill="#111827" opacity="0.6"/>
    <line x1="0" y1="30" x2="45" y2="30" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="60" x2="45" y2="60" stroke="#334155" stroke-width="2"/>
    <!-- Books -->
    <rect x="6" y="12" width="8" height="18" rx="1" fill="#ec4899"/>
    <rect x="15" y="10" width="10" height="20" rx="1" fill="#38bdf8"/>
    <rect x="27" y="15" width="7" height="15" rx="1" fill="#f59e0b"/>
    <rect x="8" y="40" width="12" height="20" rx="1" fill="#10b981"/>
    <rect x="22" y="42" width="9" height="18" rx="1" fill="#a855f7"/>
  </g>

  <!-- Ambient Lighting Overlays -->
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Desk Surface -->
  <path d="M 20 185 L 220 185 C 225 185, 225 195, 220 195 L 20 195 C 15 195, 15 185, 20 185 Z" fill="#334155" filter="url(#softShadow)"/>
  <rect x="35" y="195" width="170" height="30" fill="#1e293b"/>
  <!-- Desk Wood Grain / Accent -->
  <line x1="35" y1="198" x2="205" y2="198" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Study Props on Desk -->
  <!-- Stack of books -->
  <g transform="translate(45, 172)">
    <rect x="0" y="10" width="28" height="4" rx="1" fill="#3b82f6"/>
    <rect x="-2" y="6" width="32" height="4" rx="1" fill="#f43f5e"/>
    <rect x="2" y="2" width="26" height="4" rx="1" fill="#10b981"/>
    <!-- Pencil holder / pen -->
    <rect x="35" y="-3" width="8" height="16" rx="2" fill="#64748b"/>
    <line x1="37" y1="-7" x2="39" y2="-3" stroke="#f59e0b" stroke-width="2"/>
    <line x1="41" y1="-6" x2="43" y2="-3" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Desk Lamp -->
  <g transform="translate(190, 140)">
    <path d="M 0 45 C 0 45, 10 45, 15 30 C 20 15, 15 5, 15 5" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 45 L 20 45" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <!-- Lamp Shade -->
    <path d="M 2 -2 L 28 -2 L 22 -15 L 8 -15 Z" fill="#f59e0b"/>
    <!-- Light Cone (Subtle) -->
    <polygon points="15,-15 35,45 -5,45" fill="#fef08a" opacity="0.1"/>
  </g>

  <!-- MAIN SCENE: Teacher (Left) caring for Student (Right) -->
  
  <!-- Teacher (Left - standing/leaning slightly to show care) -->
  <g transform="translate(60, 95)" filter="url(#softShadow)">
    <!-- Body / Torso (Professional vest / shirt) -->
    <path d="M 15 45 C 15 30, 30 25, 40 25 C 50 25, 65 30, 65 45 L 60 90 L 20 90 Z" fill="#38bdf8"/>
    <!-- Shirt collar -->
    <path d="M 32 25 L 40 38 L 48 25 Z" fill="#f8fafc"/>
    <rect x="38" y="38" width="4" height="45" fill="#cbd5e1"/>

    <!-- Teacher Head & Hair -->
    <circle cx="40" cy="12" r="14" fill="#fbcfe8"/> <!-- Face base -->
    <!-- Hair (Gentle neat bob) -->
    <path d="M 26 10 C 26 -2, 54 -2, 54 10 C 54 16, 50 18, 48 12 C 46 6, 34 6, 32 12 C 30 18, 26 16, 26 10 Z" fill="#334155"/>
    
    <!-- Gentle Caring Expression -->
    <circle cx="35" cy="11" r="1.5" fill="#1e293b"/>
    <circle cx="45" cy="11" r="1.5" fill="#1e293b"/>
    <!-- Warm Smile -->
    <path d="M 37 16 Q 40 19 43 16" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Warm Blush -->
    <circle cx="32" cy="14" r="2.5" fill="#f43f5e" opacity="0.3"/>
    <circle cx="48" cy="14" r="2.5" fill="#f43f5e" opacity="0.3"/>

    <!-- Teacher Arm & Hand (Reaching out warmly to touch/adjust student's shoulder or point encouragingly) -->
    <path d="M 55 40 Q 68 45, 75 55" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="77" cy="58" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Student (Right - sitting at desk, studying hard with slight fatigue, receiving care) -->
  <g transform="translate(130, 105)" filter="url(#softShadow)">
    <!-- Chair back -->
    <rect x="-12" y="-15" width="10" height="95" rx="3" fill="#475569"/>

    <!-- Student Torso & Hoodie -->
    <path d="M -5 40 C -5 25, 10 20, 25 20 C 40 20, 55 25, 55 40 L 50 85 L 0 85 Z" fill="#10b981"/>
    <!-- Hoodie Strings / Collar details -->
    <path d="M 18 20 C 18 28, 22 28, 22 20" fill="none" stroke="#047857" stroke-width="2"/>
    <line x1="20" y1="28" x2="18" y2="40" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="28" x2="26" y2="40" stroke="#047857" stroke-width="2" stroke-linecap="round"/>

    <!-- Student Head & Hair -->
    <circle cx="22" cy="5" r="14" fill="#fed7aa"/> <!-- Face base -->
    <!-- Messy/Studious Hair -->
    <path d="M 8 5 C 8 -5, 36 -5, 36 5 C 38 12, 34 14, 30 8 C 28 3, 16 3, 14 8 C 10 14, 8 10, 8 5 Z" fill="#78350f"/>
    <path d="M 32 3 C 36 6, 38 12, 35 15" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

    <!-- Focused / Slightly overwhelmed expression, feeling touched by care -->
    <circle cx="17" cy="5" r="1.5" fill="#1e293b"/>
    <circle cx="27" cy="5" r="1.5" fill="#1e293b"/>
    <!-- Soft concentrated / relieved mouth -->
    <path d="M 20 11 Q 22 13 24 11" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Warm Blush of appreciation -->
    <circle cx="14" cy="8" r="2" fill="#f43f5e" opacity="0.3"/>
    <circle cx="30" cy="8" r="2" fill="#f43f5e" opacity="0.3"/>

    <!-- Student Arms resting on desk -->
    <path d="M 0 55 Q 15 50, 35 65" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <circle cx="37" cy="68" r="4" fill="#fed7aa"/>
  </g>

  <!-- Open Textbook on Desk in front of Student -->
  <g transform="translate(135, 165)">
    <path d="M -15 15 C 0 10, 25 10, 40 15 L 45 35 C 30 30, 0 30, -20 35 Z" fill="#e2e8f0" filter="url(#softShadow)"/>
    <!-- Pages binding and text lines -->
    <line x1="12" y1="12" x2="12" y2="33" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Left page lines -->
    <line x1="-8" y1="17" x2="4" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-10" y1="22" x2="2" y2="21" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-7" y1="27" x2="3" y2="26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Right page lines -->
    <line x1="20" y1="16" x2="33" y2="17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="21" x2="35" y2="22" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="26" x2="31" y2="27" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cute bookmark -->
    <polygon points="5,15 10,15 7,22" fill="#ef4444"/>
  </g>

  <!-- Emotional Care Symbol / Visual Metaphor (Warm glowing heart floating gently between them to signify 关心 - care/concern) -->
  <g transform="translate(110, 75)" filter="url(#softShadow)">
    <path d="M 0 -6 C -8 -16, -20 -4, 0 14 C 20 -4, 8 -16, 0 -6 Z" fill="#f43f5e" opacity="0.9"/>
    <!-- Sparkles around the heart -->
    <circle cx="-12" cy="-10" r="1.5" fill="#fef08a"/>
    <circle cx="14" cy="-8" r="1" fill="#fef08a"/>
    <path d="M 0 -18 L 0 -14 M -2 -16 L 2 -16" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

</svg>