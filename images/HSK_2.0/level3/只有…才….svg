<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Golden Key & Glow Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Chest Gradients -->
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    
    <linearGradient id="chestRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Treasure Glow -->
    <radialGradient id="treasureGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="keyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Portal / Arcane Glow behind chest -->
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Background Details: Mysterious Ruins / Stone Wall Texture -->
  <g opacity="0.15">
    <path d="M 0,0 L 240,0 L 240,240 L 0,240 Z" fill="none"/>
    <!-- Brick pattern lines -->
    <line x1="0" y1="40" x2="240" y2="40" stroke="#94a3b8" stroke-width="1" stroke-dasharray="30 10 20 10"/>
    <line x1="0" y1="80" x2="240" y2="80" stroke="#94a3b8" stroke-width="1" stroke-dasharray="15 25 35 15"/>
    <line x1="0" y1="120" x2="240" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="40 10 10 20"/>
    <line x1="0" y1="160" x2="240" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="20 20 20 20"/>
    <line x1="0" y1="200" x2="240" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="10 30 20 20"/>
  </g>

  <!-- Magical Arcane Portal Aura -->
  <circle cx="120" cy="115" r="85" fill="url(#portalGlow)" />

  <!-- Stone Floor / Pedestal -->
  <ellipse cx="120" cy="190" rx="90" ry="25" fill="#0f172a" filter="url(#shadow)"/>
  <ellipse cx="120" cy="185" rx="80" ry="20" fill="#334155" stroke="#475569" stroke-width="2"/>
  <ellipse cx="120" cy="183" rx="72" ry="16" fill="#1e293b"/>

  <!-- Magical Treasure Chest (Locked) -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Back Lid Shadow & Glow -->
    <circle cx="120" cy="95" r="50" fill="url(#treasureGlow)"/>

    <!-- Chest Base -->
    <path d="M 75,115 L 165,115 L 170,155 L 70,155 Z" fill="url(#chestWood)"/>
    <!-- Wood Planks Detail -->
    <line x1="72" y1="135" x2="168" y2="135" stroke="#78350f" stroke-width="2" opacity="0.6"/>
    
    <!-- Chest Base Metal Trim -->
    <path d="M 68,153 L 172,153 L 175,160 L 65,160 Z" fill="url(#chestRim)"/>
    <rect x="75" y="115" width="90" height="6" fill="url(#chestRim)" rx="2"/>

    <!-- Vertical Metal Bands -->
    <rect x="85" y="115" width="8" height="45" fill="#451a03" opacity="0.3"/>
    <rect x="147" y="115" width="8" height="45" fill="#451a03" opacity="0.3"/>
    <rect x="87" y="115" width="4" height="45" fill="url(#chestRim)"/>
    <rect x="149" y="115" width="4" height="45" fill="url(#chestRim)"/>

    <!-- Chest Lid (Closed securely) -->
    <path d="M 72,112 C 72,90 168,90 168,112 Z" fill="url(#chestWood)"/>
    <path d="M 70,110 C 70,86 170,86 170,110 L 168,115 L 72,115 Z" fill="url(#chestRim)" opacity="0.8"/>
    <path d="M 72,112 C 72,90 168,90 168,112 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>

    <!-- Heavy Duty Lock Mechanism (Centerpiece representing the "Only way/condition") -->
    <rect x="108" y="125" width="24" height="28" rx="4" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <circle cx="120" cy="139" r="6" fill="#0f172a"/>
    <!-- Keyhole (Crucial focal point) -->
    <path d="M 118,136 L 122,136 L 123,142 L 117,142 Z" fill="#fbbf24"/>
    <circle cx="120" cy="135" r="2.5" fill="#fbbf24"/>
  </g>

  <!-- Glowing Magical Sparkles around Chest & Key -->
  <g fill="#fbbf24">
    <circle cx="85" cy="80" r="2" opacity="0.8" filter="url(#glow)"/>
    <circle cx="155" cy="90" r="3" opacity="0.9" filter="url(#glow)"/>
    <circle cx="140" cy="65" r="1.5" opacity="0.6"/>
    <circle cx="100" cy="60" r="2.5" opacity="0.7" filter="url(#glow)"/>
  </g>

  <!-- THE KEY TO SUCCESS / CONDITION: The Golden Master Key -->
  <!-- Floating dynamically in an action-oriented diagonal pose, pointing directly to the lock -->
  <g filter="url(#shadow)" transform="translate(5, -5)">
    <!-- Ambient Glow behind Key -->
    <circle cx="105" cy="85" r="30" fill="url(#keyGlow)"/>

    <g transform="rotate(-35, 105, 85)">
      <!-- Key Shaft -->
      <rect x="98" y="70" width="14" height="75" rx="3" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>
      <rect x="101" y="73" width="4" height="65" fill="url(#goldLight)" rx="1"/>

      <!-- Key Bow (Handle) - Ornate, premium design representing high value solution -->
      <circle cx="105" cy="55" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="7" filter="url(#shadow)"/>
      <circle cx="105" cy="55" r="12" fill="none" stroke="#b45309" stroke-width="1.5" opacity="0.5"/>
      <circle cx="105" cy="55" r="20" fill="url(#goldGrad)" opacity="0.15"/>
      <!-- Inner diamond cut out in handle -->
      <path d="M 105,43 L 114,55 L 105,67 L 96,55 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>

      <!-- Key Bit (Complex teeth representing the exact condition / "Only by this way") -->
      <path d="M 112,125 L 132,125 L 132,145 L 124,145 L 124,137 L 118,137 L 118,145 L 112,145 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="115" y="128" width="14" height="4" fill="url(#goldLight)" rx="1"/>
      
      <!-- Highlight sheen on shaft -->
      <line x1="100" y1="75" x2="100" y2="120" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>

  <!-- Dynamic Energy Sparks & Action Lines radiating from the Key -->
  <g stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.8" filter="url(#glow)">
    <line x1="65" y1="50" x2="75" y2="58" />
    <line x1="135" y1="45" x2="125" y2="53" />
    <line x1="50" y1="90" x2="62" y2="92" />
  </g>

  <!-- Floating Magic Sparkle Stars -->
  <g fill="#38bdf8" filter="url(#glow)">
    <path d="M 45,120 Q 50,120 50,115 Q 50,120 55,120 Q 50,120 50,125 Q 50,120 45,120 Z" />
    <path d="M 190,140 Q 195,140 195,135 Q 195,140 200,140 Q 195,140 195,145 Q 195,140 190,140 Z" />
  </g>
  <g fill="#fbbf24">
    <path d="M 160,45 Q 165,45 165,40 Q 165,45 170,45 Q 165,45 165,50 Q 165,45 160,45 Z" />
    <path d="M 75,165 Q 78,165 78,162 Q 78,165 81,165 Q 78,165 78,168 Q 78,165 75,165 Z" />
  </g>

  <!-- Atmospheric Lighting / Vignette -->
  <circle cx="120" cy="120" r="125" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15"/>
</svg>