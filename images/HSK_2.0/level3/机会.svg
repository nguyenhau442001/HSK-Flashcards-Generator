<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window / Opportunity Light Glow -->
    <linearGradient id="gold-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- ENVIRONMENT: Interior Office / Room Context -->
  <!-- Wallpaper / Back Wall Details -->
  <path d="M0 0 H240 V170 H0 Z" fill="#1e293b"/>
  
  <!-- Bookshelf / Prop in Background -->
  <rect x="25" y="45" width="30" height="80" rx="4" fill="#334155" opacity="0.5"/>
  <rect x="30" y="60" width="20" height="6" rx="2" fill="#64748b" opacity="0.6"/>
  <rect x="30" y="80" width="16" height="6" rx="2" fill="#64748b" opacity="0.6"/>
  <rect x="30" y="100" width="18" height="6" rx="2" fill="#64748b" opacity="0.6"/>

  <!-- Large Window (Symbolizing "Opening / Opportunity" metaphor) -->
  <g transform="translate(145, 20)">
    <rect x="0" y="0" width="70" height="110" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="6" y="6" width="58" height="98" fill="#38bdf8" opacity="0.12"/>
    <!-- Window Panes -->
    <line x1="35" y1="6" x2="35" y2="104" stroke="#475569" stroke-width="2"/>
    <line x1="6" y1="55" x2="64" y2="55" stroke="#475569" stroke-width="2"/>
    <!-- City Silhouette Outside -->
    <path d="M10 95 L10 75 L20 75 L20 95 Z M24 95 L24 60 L32 60 L32 95 Z M38 95 L38 68 L50 68 L50 95 Z M54 95 L54 82 L60 82 L60 95 Z" fill="#64748b" opacity="0.4"/>
  </g>

  <!-- Golden Beam of Light streaming through the window ("The Good Opportunity") -->
  <polygon points="145,20 215,20 240,170 80,170" fill="url(#gold-beam)"/>
  <circle cx="180" cy="70" r="25" fill="#fef08a" opacity="0.15" filter="blur(8px)"/>

  <!-- Floating Sparkles / Glowing Particles representing "The Opportunity" -->
  <g fill="#fbbf24">
    <path d="M120 60 L122 65 L127 67 L122 69 L120 74 L118 69 L113 67 L118 65 Z" opacity="0.9"/>
    <path d="M95 95 L96 98 L99 99 L96 100 L95 103 L94 100 L91 99 L94 98 Z" opacity="0.7"/>
    <path d="M150 115 L151 118 L154 119 L151 120 L150 123 L149 120 L146 119 L149 118 Z" opacity="0.8"/>
  </g>

  <!-- Desk Surface -->
  <rect x="0" y="165" width="240" height="75" fill="url(#desk-grad)" filter="url(#soft-shadow)"/>
  <path d="M0 165 H240 V170 H0 Z" fill="#475569"/> <!-- Desk Edge Highlight -->

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M35 155 L65 155 L75 167 L25 167 Z" fill="#94a3b8"/>
  <rect x="30" y="125" width="35" height="32" rx="3" fill="#cbd5e1"/>
  <rect x="34" y="129" width="27" height="22" rx="1" fill="#0f172a"/>
  <!-- Glowing screen content (abstract interface line) -->
  <line x1="38" y1="135" x2="50" y2="135" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="141" x2="57" y2="141" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="147" x2="45" y2="147" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Coffee Mug -->
  <rect x="78" y="145" width="14" height="18" rx="3" fill="#f43f5e"/>
  <path d="M92 149 C96 149 96 159 92 159" stroke="#f43f5e" stroke-width="2.5" fill="none"/>

  <!-- Paperwork / Document with "Job Offer / Acceptance" styling -->
  <g transform="translate(105, 140) rotate(-8)">
    <rect x="0" y="0" width="36" height="26" rx="2" fill="#f8fafc"/>
    <line x1="6" y1="6" x2="22" y2="6" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="12" x2="30" y2="12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="17" x2="24" y2="17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Gold Seal / Star Badge -->
    <circle cx="28" cy="20" r="4" fill="#fbbf24"/>
  </g>

  <!-- MAIN SUBJECT / CHARACTER: Excited Professional experiencing a breakthrough/opportunity -->
  <g transform="translate(100, 75)">
    <!-- Character Shadow -->
    <ellipse cx="25" cy="92" rx="28" ry="6" fill="#0f172a" opacity="0.6"/>

    <!-- Chair Back -->
    <path d="M-5 35 C-5 15 15 10 35 10 C55 10 75 15 75 35 L70 90 L-2 90 Z" fill="#334155"/>
    <path d="M5 35 C5 22 20 18 35 18 C50 18 65 22 65 35 L62 85 L8 85 Z" fill="#475569"/>

    <!-- Body / Torso (Wearing stylish modern blazer) -->
    <path d="M8 50 C8 45 15 42 25 42 C35 42 42 45 42 50 L52 90 L-2 90 Z" fill="#0ea5e9"/>
    <!-- Inner Shirt / Collar -->
    <path d="M25 42 L18 53 L32 53 Z" fill="#f8fafc"/>
    <path d="M25 53 L22 65 L28 65 Z" fill="#e11d48"/> <!-- Tie / Accent -->

    <!-- Neck -->
    <rect x="20" y="32" width="10" height="12" rx="3" fill="#fbcfe8"/>

    <!-- Head & Face (Expression: Amazed, joyful realization, wide eyes, big smile) -->
    <circle cx="25" cy="22" r="14" fill="#fbcfe8"/>
    
    <!-- Hair (Stylized modern dark hair) -->
    <path d="M11 20 C11 11 18 8 26 8 C34 8 39 12 39 20 C39 22 38 24 38 24 C38 24 35 15 26 15 C17 15 13 22 13 22 Z" fill="#1e293b"/>

    <!-- Facial Expressions - Wide happy eyes -->
    <circle cx="20" cy="20" r="2" fill="#0f172a"/>
    <circle cx="30" cy="20" r="2" fill="#0f172a"/>
    <!-- Eyebrows raised high (surprise / good news) -->
    <path d="M18 15 C19 13 22 13 23 14" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M27 14 C28 13 31 13 32 15" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Big Happy Smile -->
    <path d="M21 25 C21 29 29 29 29 25" fill="#e11d48"/>
    <path d="M21 25 C21 29 29 29 29 25 Z" stroke="#0f172a" stroke-width="1" fill="none"/>

    <!-- Arms & Hands in a gesture of joyful realization ("Eureka! / This is it!") -->
    <!-- Left Arm (bent back, hand near head) -->
    <path d="M5 50 C-2 50 -8 40 -2 30 C2 24 10 26 8 35" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-3" cy="28" r="4" fill="#fbcfe8"/>

    <!-- Right Arm (raised forward in excitement) -->
    <path d="M45 50 C55 45 62 35 58 25" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
    <circle cx="57" cy="22" r="4" fill="#fbcfe8"/>
  </g>

  <!-- Foreground Atmospheric Lighting Elements -->
  <!-- Warm glow overlay on the bottom right corner -->
  <circle cx="240" cy="240" r="80" fill="#f59e0b" opacity="0.1" filter="blur(20px)"/>
</svg>