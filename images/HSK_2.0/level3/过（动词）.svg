<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background with atmospheric gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="clockTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT / SCENERY: Cozy room interior showing the passage of time -->
  <!-- Wallpaper lines & background details -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.4">
    <line x1="0" y1="60" x2="240" y2="60" />
    <line x1="0" y1="120" x2="240" y2="120" />
    <line x1="0" y1="180" x2="240" y2="180" />
  </g>

  <!-- Large arched window showing day-to-night sunset gradient (time passing quickly) -->
  <path d="M 150,30 L 210,30 L 210,130 L 150,130 Z" fill="url(#windowGlow)" />
  <path d="M 150,30 C 150,15 210,15 210,30 L 210,130 L 150,130 Z" fill="#f97316" opacity="0.2" />
  <!-- Window frame -->
  <rect x="146" y="26" width="68" height="108" rx="4" fill="none" stroke="#475569" stroke-width="3" />
  <line x1="180" y1="26" x2="180" y2="134" stroke="#475569" stroke-width="2" />
  <line x1="146" y1="80" x2="214" y2="80" stroke="#475569" stroke-width="2" />

  <!-- Bookshelf & props on the left -->
  <rect x="20" y="80" width="50" height="110" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="20" y1="115" x2="70" y2="115" stroke="#334155" stroke-width="2" />
  <line x1="20" y1="150" x2="70" y2="150" stroke="#334155" stroke-width="2" />
  <!-- Stack of books -->
  <rect x="28" y="95" width="34" height="8" rx="1" fill="#38bdf8" />
  <rect x="26" y="103" width="38" height="9" rx="1" fill="#ec4899" />
  <rect x="30" y="133" width="30" height="14" rx="1" fill="#10b981" />

  <!-- Desk & working setup -->
  <rect x="70" y="150" width="130" height="8" rx="2" fill="#64748b" />
  <rect x="85" y="158" width="12" height="40" fill="#475569" />
  <rect x="175" y="158" width="12" height="40" fill="#475569" />

  <!-- Laptop on desk -->
  <path d="M 100,150 L 140,150 L 145,138 L 95,138 Z" fill="#94a3b8" />
  <rect x="90" y="148" width="60" height="3" rx="1.5" fill="#cbd5e1" />

  <!-- MAIN CHARACTER: Surprised person watching time fly -->
  <!-- Chair back -->
  <path d="M 115,160 L 135,160 L 135,120 C 135,110 115,110 115,120 Z" fill="#334155" />
  
  <!-- Character Body -->
  <path d="M 105,190 C 105,170 145,170 145,190 Z" fill="#38bdf8" />
  <!-- Character Head & Hair -->
  <circle cx="125" cy="115" r="18" fill="#fcd34d" />
  <path d="M 107,112 C 107,98 143,98 143,112 C 143,115 140,110 135,105 C 125,98 115,102 107,112 Z" fill="#1e293b" />
  
  <!-- Expressive Face (Wide eyes showing realization/shock at fast time) -->
  <circle cx="119" cy="113" r="2.5" fill="#0f172a" />
  <circle cx="131" cy="113" r="2.5" fill="#0f172a" />
  <!-- Surprised open mouth -->
  <ellipse cx="125" cy="122" rx="3" ry="4.5" fill="#0f172a" />
  <!-- Raised surprised eyebrows -->
  <path d="M 116,108 Q 119,106 122,108" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 128,108 Q 131,106 134,108" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

  <!-- Active arms reacting -->
  <path d="M 108,160 Q 95,150 100,140" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" />
  <path d="M 142,160 Q 155,150 150,140" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" />

  <!-- DYNAMIC ACTION VISUALS: Representing "Time passing very quickly" (时间过得很快) -->
  <!-- Motion blur speed lines sweeping across the room -->
  <path d="M 200,60 C 160,70 120,80 80,90" fill="none" stroke="url(#clockTrail)" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 210,80 C 170,95 130,100 70,120" fill="none" stroke="url(#clockTrail)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round" />
  <path d="M 190,40 C 150,45 110,60 50,70" fill="none" stroke="url(#clockTrail)" stroke-width="5" stroke-dasharray="6 4" stroke-linecap="round" filter="url(#glow)" />

  <!-- Flying Clocks & Gear Icons indicating rapid passage of time -->
  <!-- Clock 1 (Large, spinning fast with motion trails) -->
  <g transform="translate(180, 75)">
    <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#fbbf24" stroke-width="3" filter="url(#glow)" />
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="6" y2="4" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <!-- Speed arcs around clock -->
    <path d="M -16,-10 C -20,-4 -20,4 -16,10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Clock 2 (Smaller, blurring past) -->
  <g transform="translate(110, 50) scale(0.7)">
    <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#ec4899" stroke-width="3" />
    <line x1="0" y1="0" x2="8" y2="0" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-4" y2="-8" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Floating glowing hourglass / time particles -->
  <g transform="translate(75, 85) rotate(-15)">
    <polygon points="-6,-10 6,-10 6,-8 2,-2 6,4 6,6 -6,6 -6,4 -2,-2 -6,-8" fill="#38bdf8" opacity="0.8" />
    <polygon points="-4,2 4,2 6,8 -6,8" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Additional glowing digital time fragments / speed dashes -->
  <circle cx="140" cy="70" r="2" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="95" cy="100" r="3" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="165" cy="110" r="1.5" fill="#ec4899" filter="url(#glow)" />

  <!-- Floor line and grounding shadow -->
  <rect x="0" y="198" width="240" height="42" fill="#0f172a" />
  <line x1="0" y1="198" x2="240" y2="198" stroke="#334155" stroke-width="2" />
  <ellipse cx="125" cy="198" rx="35" ry="4" fill="#000000" opacity="0.4" />
</svg>