<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Warm Glow Gradient for Music/Passion -->
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Headphone Gradient -->
    <linearGradient id="hp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Vinyl Record Gradient -->
    <linearGradient id="vinyl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character Skin Tone -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <!-- Hoodie Gradient -->
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Light/Glow behind character -->
  <circle cx="120" cy="120" r="90" fill="url(#glow-grad)" />

  <!-- Background Environment & Props -->
  <!-- Record Player / Turntable Desk -->
  <rect x="35" y="165" width="170" height="50" rx="6" fill="#0f172a" filter="url(#shadow)" />
  <rect x="45" y="155" width="75" height="15" rx="3" fill="#334155" />
  <!-- Turntable Platter -->
  <circle cx="82" cy="145" r="32" fill="url(#vinyl-grad)" stroke="#475569" stroke-width="2" />
  <circle cx="82" cy="145" r="28" fill="none" stroke="#1e293b" stroke-width="1" />
  <circle cx="82" cy="145" r="22" fill="none" stroke="#1e293b" stroke-width="1" />
  <!-- Vinyl Label -->
  <circle cx="82" cy="145" r="10" fill="#f43f5e" />
  <circle cx="82" cy="145" r="3" fill="#0f172a" />
  <!-- Tonearm -->
  <path d="M 105 125 L 112 140 L 109 155" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="105" cy="125" r="4" fill="#94a3b8" />

  <!-- Music Notes Floating (Visualizing passion for music) -->
  <g fill="#fbbf24" opacity="0.85" filter="url(#shadow)">
    <!-- Note 1 -->
    <path d="M 185 95 L 185 70 C 185 64 195 60 200 65 L 200 80 C 200 83 197 86 193 86 C 189 86 185 83 185 80 Z" />
    <ellipse cx="181" cy="94" rx="5" ry="4" />
    <ellipse cx="196" cy="80" rx="5" ry="4" />

    <!-- Note 2 -->
    <path d="M 45 110 L 45 95 C 45 91 51 88 55 91 L 55 102 C 55 104 53 106 50 106 C 47 106 45 104 45 102 Z" />
    <ellipse cx="42" cy="109" rx="3.5" ry="2.5" />
    <ellipse cx="52" cy="101" rx="3.5" ry="2.5" />
  </g>

  <!-- Sparkles / Excitement Indicators -->
  <path d="M 195 40 L 198 48 L 206 51 L 198 54 L 195 62 L 192 54 L 184 51 L 192 48 Z" fill="#38bdf8" opacity="0.9" />
  <path d="M 50 50 L 52 55 L 57 57 L 52 59 L 50 64 L 48 59 L 43 57 L 48 55 Z" fill="#f43f5e" opacity="0.9" />
  <path d="M 140 30 L 141.5 34 L 145.5 35.5 L 141.5 37 L 140 41 L 138.5 37 L 134.5 35.5 L 138.5 34 Z" fill="#fbbf24" opacity="0.8" />

  <!-- Character: Upper body, deeply engaged/excited about music -->
  <g transform="translate(0, 10)">
    <!-- Body / Hoodie -->
    <path d="M 90 180 C 85 145 100 125 120 125 C 140 125 155 145 150 180 Z" fill="url(#hoodie)" filter="url(#shadow)" />
    <!-- Hoodie Strings -->
    <path d="M 113 135 Q 115 150 110 160" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M 127 135 Q 125 150 130 160" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="111" y="110" width="18" height="20" rx="6" fill="url(#skin)" />

    <!-- Head & Face -->
    <circle cx="120" cy="95" r="28" fill="url(#skin)" filter="url(#shadow)" />

    <!-- Hair (Expressive stylized locks) -->
    <path d="M 94 95 C 92 75 105 65 120 65 C 138 65 148 78 147 98 C 143 85 135 73 120 73 C 105 73 97 85 94 95 Z" fill="#1e293b" />
    <path d="M 93 92 C 92 85 96 76 103 72 C 100 80 98 88 93 92 Z" fill="#1e293b" />

    <!-- Closed Happy/Excited Eyes (^ ^ expression) -->
    <path d="M 107 92 C 109 88 113 88 115 92" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 125 92 C 127 88 131 88 133 92" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cheeks (Blushing with joy) -->
    <ellipse cx="106" cy="98" rx="4" ry="2.5" fill="#f43f5e" opacity="0.4" />
    <ellipse cx="134" cy="98" rx="4" ry="2.5" fill="#f43f5e" opacity="0.4" />

    <!-- Big Happy Open Smile -->
    <path d="M 113 103 C 113 111 127 111 127 103 Z" fill="#0f172a" />
    <path d="M 115 103 C 115 107 125 107 125 103 Z" fill="#f43f5e" />

    <!-- Over-ear Headphones (Highlighting 'Music') -->
    <!-- Headband -->
    <path d="M 95 90 C 92 65 148 65 145 90" fill="none" stroke="url(#hp-grad)" stroke-width="6" stroke-linecap="round" />
    <!-- Left Ear Cup -->
    <rect x="91" y="85" width="10" height="22" rx="5" fill="url(#hp-grad)" filter="url(#shadow)" />
    <rect x="89" y="88" width="4" height="16" rx="2" fill="#fbbf24" />
    <!-- Right Ear Cup -->
    <rect x="139" y="85" width="10" height="22" rx="5" fill="url(#hp-grad)" filter="url(#shadow)" />
    <rect x="147" y="88" width="4" height="16" rx="2" fill="#fbbf24" />
  </g>

  <!-- Foreground details on desk -->
  <!-- Coffee Mug representing cozy atmosphere -->
  <path d="M 175 168 L 178 193 C 178 196 181 198 184 198 L 196 198 C 199 198 202 196 202 193 L 205 168 Z" fill="#38bdf8" filter="url(#shadow)" />
  <!-- Mug Handle -->
  <path d="M 202 173 C 212 173 212 191 202 191" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <!-- Steam rising from mug -->
  <path d="M 183 160 C 181 153 187 149 185 142" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 195 158 C 193 151 199 147 197 140" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Stack of Vinyl Records / Album Cases on the left desk -->
  <rect x="45" y="170" width="30" height="8" rx="2" fill="#ec4899" />
  <rect x="42" y="178" width="34" height="8" rx="2" fill="#38bdf8" />
  <rect x="40" y="186" width="38" height="9" rx="2" fill="#fbbf24" />
</svg>