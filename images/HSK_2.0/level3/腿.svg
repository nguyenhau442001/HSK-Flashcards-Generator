<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow for Pain / Context -->
    <radialGradient id="pain-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Pants Gradient -->
    <linearGradient id="pants-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <!-- Shoe Gradient -->
    <linearGradient id="shoe-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements (Park bench / Environment) -->
  <!-- Ground -->
  <path d="M0 195 L240 195 L240 240 L0 240 Z" fill="#0f172a" opacity="0.8"/>
  <rect x="0" y="193" width="240" height="3" fill="#334155" opacity="0.5"/>

  <!-- Park Bench Silhouette/Context in Background -->
  <path d="M140 130 L210 130 L215 175 L135 175 Z" fill="#334155" opacity="0.3"/>
  <rect x="145" y="140" width="60" height="6" rx="3" fill="#475569" opacity="0.4"/>
  <rect x="145" y="152" width="60" height="6" rx="3" fill="#475569" opacity="0.4"/>
  <rect x="145" y="164" width="60" height="6" rx="3" fill="#475569" opacity="0.4"/>

  <!-- PAIN / STRAIN GLOW AROUND THE THIGH/LEG -->
  <circle cx="115" cy="125" r="55" fill="url(#pain-glow)"/>

  <!-- MAIN CHARACTER / LEG FOCUS -->
  <!-- Sitting posture context: Body/Upper leg angle -->
  
  <!-- Torso & Hip Base (Upper body leaning forward over the sore leg) -->
  <path d="M 85 70 C 85 55, 105 50, 115 65 C 120 72, 122 85, 115 95 Z" fill="#a855f7"/> <!-- Hoodie -->
  <circle cx="105" cy="55" r="14" fill="#fcd34d"/> <!-- Head bowed down -->

  <!-- Arms holding the aching thigh -->
  <path d="M 110 75 C 110 75, 130 90, 125 110 C 124 116, 118 120, 112 118 C 108 116, 106 110, 108 105 Z" fill="#a855f7"/>
  <!-- Hands gripping the thigh -->
  <circle cx="112" cy="115" r="7" fill="#fcd34d"/>

  <!-- THE TARGET: THIGH & LEG (腿 - tuǐ) -->
  <!-- Thigh (Thigh / Upper Leg in blue pants) -->
  <g transform="rotate(-15 115 125)">
    <!-- Upper Leg / Thigh -->
    <path d="M 75 105 C 75 95, 115 95, 125 125 C 130 140, 130 155, 125 160 C 120 165, 80 145, 75 125 Z" fill="url(#pants-grad)"/>
    
    <!-- Knee joint contour -->
    <circle cx="123" cy="148" r="14" fill="#0284c7" opacity="0.6"/>

    <!-- Lower Leg (Shin & Calf) extending down -->
    <path d="M 120 155 L 145 195 L 125 200 L 110 160 Z" fill="url(#pants-grad)"/>

    <!-- Sneaker / Foot -->
    <path d="M 135 195 C 135 190, 155 190, 165 196 C 172 200, 172 208, 160 210 L 125 210 Z" fill="url(#shoe-grad)"/>
    <path d="M 125 205 L 163 205" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- BACKGROUND LEG (Crossed or resting behind) -->
  <path d="M 80 115 C 80 115, 90 140, 110 160" stroke="#0284c7" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- PAIN INDICATORS (Action lines & Star sparks representing sharp pain "很疼") -->
  <g fill="#fbbf24">
    <!-- Spark 1 -->
    <path d="M 100 100 L 104 110 L 114 114 L 104 118 L 100 128 L 96 118 L 86 114 L 96 110 Z" transform="scale(0.6) translate(60, 40)"/>
    <!-- Spark 2 -->
    <path d="M 140 100 L 143 107 L 150 110 L 143 113 L 140 120 L 137 113 L 130 110 L 137 107 Z" transform="scale(0.5) translate(130, 40)"/>
  </g>

  <!-- Sweat drop / discomfort detail -->
  <path d="M 95 45 C 95 45, 92 50, 92 53 C 92 55, 93.5 57, 95 57 C 96.5 57, 98 55, 98 53 C 98 50, 95 45, 95 45 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Foreground Atmospheric Elements / Vignette -->
  <circle cx="20" cy="20" r="40" fill="#38bdf8" opacity="0.03" filter="blur(10px)"/>
  <circle cx="220" cy="220" r="50" fill="#f43f5e" opacity="0.03" filter="blur(10px)"/>
</svg>