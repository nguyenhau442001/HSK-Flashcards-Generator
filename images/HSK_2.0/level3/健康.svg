<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Park Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Heart / Vitality Gradient -->
    <linearGradient id="vitalityGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Scenery (Park & Nature) -->
  <!-- Warm Morning Sun / Glow -->
  <circle cx="180" cy="70" r="35" fill="url(#sunGrad)" opacity="0.15" />
  <circle cx="180" cy="70" r="25" fill="url(#sunGrad)" opacity="0.25" />

  <!-- Distant Hills / Bushes -->
  <path d="M-20 160 Q 40 120 100 150 T 260 140 L 260 170 L -20 170 Z" fill="#064e3b" opacity="0.4" />
  <path d="M-10 170 Q 70 130 150 165 T 250 155 L 250 180 L -10 180 Z" fill="#047857" opacity="0.5" />

  <!-- Park Ground -->
  <path d="M 0 165 Q 120 145 240 165 L 240 240 L 0 240 Z" fill="url(#groundGrad)" />

  <!-- Running Track Curve Detail -->
  <path d="M 0 185 Q 120 165 240 185" stroke="#34d399" stroke-width="4" fill="none" opacity="0.3" stroke-dasharray="6,6" />

  <!-- Environment Props: Trees & Plants -->
  <!-- Tree Left -->
  <path d="M 30 165 L 30 100 Q 30 80 50 75 Q 30 70 35 50 Q 15 60 20 80 Q 5 90 25 110 L 25 165 Z" fill="#334155" />
  <circle cx="35" cy="55" r="22" fill="#10b981" opacity="0.8" />
  <circle cx="20" cy="75" r="18" fill="#059669" opacity="0.8" />
  <circle cx="50" cy="70" r="16" fill="#34d399" opacity="0.8" />

  <!-- Tree Right Background -->
  <path d="M 210 160 L 210 110 Q 210 95 225 90 Q 210 85 215 70 Q 200 78 204 95 Q 190 102 205 115 L 205 160 Z" fill="#334155" />
  <circle cx="215" cy="75" r="18" fill="#059669" opacity="0.7" />
  <circle cx="200" cy="95" r="15" fill="#34d399" opacity="0.7" />

  <!-- Main Active Character (Jogging / Running) -->
  <g transform="translate(100, 110)">
    <!-- Motion Lines / Speed Lines -->
    <line x1="-35" y1="20" x2="-15" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="-45" y1="35" x2="-20" y2="35" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="-30" y1="50" x2="-10" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- Back Arm (Swinging backward) -->
    <path d="M 5 -5 L -10 15 L -20 10" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Back Hand -->
    <circle cx="-20" cy="10" r="4" fill="#fbcfe8" />

    <!-- Back Leg (Kicking back) -->
    <path d="M -2 30 L -18 45 L -28 35" stroke="#1e293b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Back Shoe -->
    <path d="M -34 33 Q -28 32 -24 38 L -32 40 Z" fill="#f43f5e" />

    <!-- Torso (Leaning forward dynamically) -->
    <path d="M 10 -15 L -5 32 L 8 35 L 15 -10 Z" fill="url(#shirtGrad)" />
    <!-- Sweatband / Fitness Detail on Shirt -->
    <path d="M 4 -3 L 13 -6" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />

    <!-- Head & Face -->
    <!-- Neck -->
    <path d="M 12 -13 L 16 -22" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" />
    <!-- Head Circle -->
    <circle cx="20" cy="-30" r="12" fill="#fbcfe8" />
    <!-- Hair (Dynamic runner style) -->
    <path d="M 10 -36 Q 18 -44 30 -38 Q 25 -32 28 -28 Q 15 -28 10 -36 Z" fill="#1e293b" />
    <!-- Joyful Expression / Open Eye -->
    <path d="M 22 -31 Q 25 -29 28 -31" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Smiling Mouth -->
    <path d="M 23 -26 Q 26 -23 29 -26" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Front Arm (Bending forward) -->
    <path d="M 12 -10 L 28 5 L 20 20" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Front Hand -->
    <circle cx="20" cy="20" r="4" fill="#fbcfe8" />

    <!-- Front Leg (Stepping forward) -->
    <path d="M 5 32 L 18 48 L 32 45" stroke="url(#pantsGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Front Shoe -->
    <path d="M 30 43 Q 40 43 42 49 L 32 52 Z" fill="#f43f5e" />
  </g>

  <!-- Secondary Companion Character (Walking / Jogging behind) -->
  <g transform="translate(45, 125)">
    <!-- Body -->
    <path d="M 5 -10 L -2 25 L 8 28 L 12 -6 Z" fill="#10b981" />
    <!-- Head -->
    <circle cx="12" cy="-22" r="10" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 4 -26 Q 10 -33 20 -26 Q 15 -22 17 -18 Q 8 -18 4 -26 Z" fill="#334155" />
    <!-- Smile -->
    <path d="M 14 -18 Q 16 -16 19 -18" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Legs -->
    <path d="M 0 25 L -8 40" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <path d="M 6 27 L 14 42" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <!-- Arms -->
    <path d="M 8 -5 L -5 10" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Floating Vitality Icons & Sparkles (Representing 'Health' & 'Good Exercise') -->
  <!-- Glowing Heart Symbol above runner -->
  <g transform="translate(115, 60)">
    <animateTransform attributeName="transform" type="translate" values="115,62; 115,56; 115,62" dur="2.5s" repeatCount="indefinite" />
    <path d="M 0 -5 C -8 -15 -20 -5 0 15 C 20 -5 8 -15 0 -5 Z" fill="url(#vitalityGlow)" />
    <!-- Soft glow halo -->
    <circle cx="0" cy="0" r="14" fill="#f43f5e" opacity="0.2">
      <animate attributeName="r" values="12;18;12" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Sparkles representing energy and well-being -->
  <g fill="#fbbf24">
    <!-- Sparkle 1 -->
    <path d="M 75 80 Q 75 72 83 72 Q 75 72 75 64 Q 75 72 67 72 Q 75 72 75 80 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite" />
    </path>
    <!-- Sparkle 2 -->
    <path d="M 160 100 Q 160 94 166 94 Q 160 94 160 88 Q 160 94 154 94 Q 160 94 160 100 Z">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite" />
    </path>
    <!-- Sparkle 3 -->
    <path d="M 135 155 Q 135 150 140 150 Q 135 150 135 145 Q 135 150 130 150 Q 135 150 135 155 Z">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.5s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Foreground Atmospheric Leaf / Foliage frame element (Top-Left) -->
  <path d="M -10 -10 Q 30 -5 40 30 Q 10 20 -10 -10 Z" fill="#047857" opacity="0.6" />
</svg>