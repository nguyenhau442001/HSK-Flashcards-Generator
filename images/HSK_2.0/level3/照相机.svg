<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Camera Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Grip/Accent Gradient -->
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Background Elements (Travel/Photo vibe) -->
  <g opacity="0.3">
    <!-- Starry/bokeh particles -->
    <circle cx="40" cy="50" r="2" fill="#38bdf8" />
    <circle cx="200" cy="40" r="3" fill="#fbbf24" />
    <circle cx="210" cy="180" r="1.5" fill="#38bdf8" />
    <circle cx="30" cy="190" r="2.5" fill="#ec4899" />
    
    <!-- Abstract map/lines -->
    <path d="M 20 120 Q 70 100, 120 140 T 220 110" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />
  </g>

  <!-- Surface/Desk -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Secondary Prop: Travel Tag / Polaroids stacked under -->
  <g transform="translate(150, 160) rotate(12)" filter="url(#shadow)">
    <rect x="0" y="0" width="45" height="55" rx="2" fill="#f1f5f9" />
    <rect x="5" y="5" width="35" height="35" fill="#38bdf8" opacity="0.3" />
  </g>
  <g transform="translate(35, 155) rotate(-15)" filter="url(#shadow)">
    <rect x="0" y="0" width="45" height="55" rx="2" fill="#f1f5f9" />
    <rect x="5" y="5" width="35" height="35" fill="#10b981" opacity="0.3" />
  </g>

  <!-- MAIN SUBJECT: CAMERA (zhàoxiàngjī) -->
  <g filter="url(#shadow)">
    <!-- Camera Strap Left -->
    <path d="M 50 110 C 20 110, 10 150, 20 180" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round" />
    <!-- Camera Strap Right -->
    <path d="M 190 110 C 220 110, 230 150, 220 180" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round" />

    <!-- Camera Body Base (Retro Style) -->
    <rect x="45" y="85" width="150" height="100" rx="16" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Dark Grip Accent (Left & Right) -->
    <path d="M 45 101 C 45 92, 52 85, 61 85 L 61 185 L 61 185 C 52 185, 45 178, 45 169 Z" fill="url(#darkMetal)" />
    <path d="M 195 101 C 195 92, 188 85, 179 85 L 179 185 L 179 185 C 188 185, 195 178, 195 169 Z" fill="url(#darkMetal)" />
    <line x1="61" y1="85" x2="61" y2="185" stroke="#475569" stroke-width="1" />
    <line x1="179" y1="85" x2="179" y2="185" stroke="#475569" stroke-width="1" />

    <!-- Top Plate (Silver highlight) -->
    <path d="M 65 85 L 175 85 L 180 72 L 60 72 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />

    <!-- Viewfinder / Flash Housing (Center Top) -->
    <path d="M 95 72 L 145 72 L 140 60 L 100 60 Z" fill="#cbd5e1" />
    <rect x="110" y="63" width="20" height="5" rx="2.5" fill="#334155" />

    <!-- Shutter Button & Dials (Top Right) -->
    <rect x="158" y="65" width="14" height="7" rx="2" fill="#94a3b8" />
    <circle cx="175" cy="68" r="5" fill="#fbbf24" filter="url(#shadow)" />
    <circle cx="175" cy="68" r="2" fill="#d97706" />

    <!-- Film Advance / Left Dial (Top Left) -->
    <rect x="68" y="65" width="12" height="7" rx="2" fill="#94a3b8" />

    <!-- MAIN LENS ASSEMBLY -->
    <g transform="translate(120, 135)">
      <!-- Outer Lens Shadow/Rim -->
      <circle cx="0" cy="0" r="42" fill="#0f172a" />
      <circle cx="0" cy="0" r="39" fill="url(#darkMetal)" stroke="#64748b" stroke-width="2" />
      
      <!-- Lens Ribs/Texture -->
      <circle cx="0" cy="0" r="35" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="6 2" />

      <!-- Inner Metal Barrel -->
      <circle cx="0" cy="0" r="30" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="0" cy="0" r="26" fill="#0f172a" />

      <!-- Glass Elements -->
      <circle cx="0" cy="0" r="23" fill="url(#lensGlass)" />
      
      <!-- Lens Reflections & Highlights -->
      <path d="M -12 -12 A 18 18 0 0 1 12 -12 A 16 16 0 0 0 -12 -12 Z" fill="#ffffff" opacity="0.4" />
      <circle cx="-8" cy="8" r="4" fill="#38bdf8" opacity="0.6" filter="url(#glow)" />
      <circle cx="10" cy="10" r="2" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Flash / Light Sensor (Top Left of Body) -->
    <circle cx="80" cy="102" r="6" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <circle cx="80" cy="102" r="3" fill="#fbbf24" />

    <!-- Red Accent Stripe / Brand Mark area -->
    <path d="M 61 105 L 75 105 L 75 110 L 61 110 Z" fill="#ef4444" />
  </g>

  <!-- Floating Interactive Elements / Action Sparkles -->
  <g transform="translate(185, 95)" filter="url(#glow)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(55, 65)" filter="url(#glow)">
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#38bdf8" />
  </g>

  <!-- Flying Photo Sparkle (Magic photo coming out feel) -->
  <g transform="translate(115, 30) rotate(-10)" filter="url(#shadow)">
    <rect x="-20" y="-15" width="40" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="-16" y="-11" width="32" height="18" fill="#38bdf8" opacity="0.2" />
    <!-- Mini sun in photo -->
    <circle cx="6" cy="-2" r="3" fill="#f59e0b" />
    <!-- Mini mountain in photo -->
    <path d="M -12 7 L -4 -1 L 2 7 Z" fill="#10b981" />
    <path d="M -4 7 L 2 2 L 10 7 Z" fill="#059669" />
  </g>
</svg>