<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Vanity Mirror Glow -->
    <radialGradient id="mirrorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#331810"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>

    <!-- Soft Cheek Blush Gradient -->
    <radialGradient id="blushGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Mirror Frame Gradient -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Interior Details -->
  <!-- Wallpaper subtle accents -->
  <g fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <path d="M30 40 Q40 30 50 40" />
    <path d="M190 50 Q200 40 210 50" />
    <circle cx="205" cy="180" r="15" />
    <path d="M30 190 L50 210" />
  </g>

  <!-- Bookshelf / Plant in Background -->
  <g opacity="0.7">
    <rect x="195" y="100" width="30" height="80" rx="4" fill="#0f172a" />
    <rect x="200" y="110" width="20" height="6" rx="2" fill="#38bdf8" />
    <rect x="202" y="125" width="16" height="6" rx="2" fill="#ec4899" />
    <rect x="200" y="140" width="20" height="6" rx="2" fill="#10b981" />
    <!-- Small Plant hanging -->
    <circle cx="210" cy="95" r="10" fill="#065f46" />
    <path d="M205 95 Q210 115 220 120" fill="none" stroke="#059669" stroke-width="2" />
  </g>

  <!-- Vanity Table and Mirror Setup -->
  <g id="vanitySetup">
    <!-- Table Surface -->
    <path d="M20 200 L220 200 L210 220 L30 220 Z" fill="#334155" />
    <rect x="35" y="220" width="170" height="8" rx="2" fill="#1e293b" />

    <!-- Mirror Glow Backdrop -->
    <circle cx="120" cy="115" r="70" fill="url(#mirrorGlow)" />

    <!-- Vanity Mirror Outer Frame -->
    <circle cx="120" cy="110" r="54" fill="url(#frameGrad)" />
    <!-- Mirror Glass Reflective Surface -->
    <circle cx="120" cy="110" r="48" fill="#bae6fd" />
    <!-- Mirror Glass Highlight Curve -->
    <path d="M90 90 A 45 45 0 0 1 150 90 A 50 50 0 0 0 90 90 Z" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Cosmetics and Props on Table -->
  <g id="tableProps">
    <!-- Perfume Bottle -->
    <rect x="150" y="185" width="14" height="20" rx="3" fill="#ec4899" opacity="0.8" />
    <rect x="154" y="180" width="6" height="5" rx="1" fill="#fbbf24" />
    <!-- Makeup Brush Container -->
    <rect x="70" y="180" width="12" height="25" rx="2" fill="#38bdf8" />
    <path d="M72 180 L74 165 L78 165 L80 180 Z" fill="#cbd5e1" />
    <path d="M73 165 Q76 160 79 165" fill="#f43f5e" />
  </g>

  <!-- Main Character: Young Woman Admiring her Face in Mirror -->
  <g id="character">
    <!-- Torso and Shoulders (facing slightly angled) -->
    <path d="M85 225 C85 195 95 190 120 190 C145 190 155 195 155 225 Z" fill="#ec4899" />
    <!-- Collar / Shirt Detail -->
    <path d="M105 190 Q120 205 135 190 L130 185 L110 185 Z" fill="#fbcfe8" />
    <!-- Neck -->
    <path d="M110 160 L110 185 L130 185 L130 160 Z" fill="url(#skinGrad)" />
    <path d="M115 170 Q120 175 125 170" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.3" />

    <!-- Back Hair Flow -->
    <path d="M85 110 C70 130 75 160 80 185 C95 185 100 160 100 140 Z" fill="url(#hairGrad)" />
    <path d="M155 110 C170 130 165 160 160 185 C145 185 140 160 140 140 Z" fill="url(#hairGrad)" />

    <!-- Head / Face (Focus of Illustration: Khuôn mặt) -->
    <ellipse cx="120" cy="120" rx="28" ry="32" fill="url(#skinGrad)" />

    <!-- Ears -->
    <circle cx="91" cy="122" r="5" fill="url(#skinGrad)" />
    <circle cx="149" cy="122" r="5" fill="url(#skinGrad)" />
    <!-- Small Earrings -->
    <circle cx="91" cy="126" r="1.5" fill="#fbbf24" />
    <circle cx="149" cy="126" r="1.5" fill="#fbbf24" />

    <!-- Front Hair / Bangs framing the face -->
    <path d="M92 105 Q100 90 120 92 Q140 90 148 105 Q145 125 140 130 Q130 115 120 115 Q110 115 100 130 Q95 125 92 105 Z" fill="url(#hairGrad)" />
    <!-- Hair Strand Highlight -->
    <path d="M105 96 Q120 94 135 96" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- Facial Features: Expressing beauty, happiness, and self-admiration -->
    <!-- Eyebrows (gentle, well-groomed) -->
    <path d="M103 111 Q110 107 117 111" fill="none" stroke="#331810" stroke-width="2" stroke-linecap="round" />
    <path d="M123 111 Q130 107 137 111" fill="none" stroke="#331810" stroke-width="2" stroke-linecap="round" />

    <!-- Eyes (bright, expressive, looking happily forward) -->
    <ellipse cx="110" cy="119" rx="4" ry="5" fill="#0f172a" />
    <ellipse cx="130" cy="119" rx="4" ry="5" fill="#0f172a" />
    <!-- Eye Highlights -->
    <circle cx="111.5" cy="117.5" r="1.5" fill="#ffffff" />
    <circle cx="131.5" cy="117.5" r="1.5" fill="#ffffff" />
    <!-- Eyelashes -->
    <path d="M105 116 Q110 113 115 116" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <path d="M125 116 Q130 113 135 116" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

    <!-- Rosy Cheeks (Highlighting the "Face" beauty context) -->
    <circle cx="104" cy="128" r="7" fill="url(#blushGrad)" />
    <circle cx="136" cy="128" r="7" fill="url(#blushGrad)" />

    <!-- Nose (Cute, subtle button nose) -->
    <path d="M118 126 Q120 130 122 126" fill="none" stroke="#d78d61" stroke-width="1.5" stroke-linecap="round" />

    <!-- Lips (Gentle, happy smile) -->
    <path d="M113 136 Q120 142 127 136 Q120 144 113 136 Z" fill="#f43f5e" />

  </g>

  <!-- Foreground Atmospheric Elements / Sparkles representing beauty and radiance -->
  <g fill="#fbbf24">
    <!-- Star Sparkle 1 -->
    <path d="M60 80 Q65 80 65 75 Q65 80 70 80 Q65 80 65 85 Q65 80 60 80 Z" opacity="0.8" />
    <!-- Star Sparkle 2 -->
    <path d="M175 95 Q180 95 180 90 Q180 95 185 95 Q180 95 180 100 Q180 95 175 95 Z" opacity="0.9" />
    <!-- Tiny Glow Dots -->
    <circle cx="50" cy="120" r="2" opacity="0.6" />
    <circle cx="190" cy="140" r="1.5" opacity="0.5" />
    <circle cx="95" cy="65" r="2" opacity="0.7" />
  </g>

  <!-- Ambient Light Overlay on Left Side -->
  <path d="M0 0 L100 0 L0 240 Z" fill="#38bdf8" opacity="0.04" />

</svg>