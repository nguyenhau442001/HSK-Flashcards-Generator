<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wood Desk Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Amber Accent -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Paper Gradient (Clean white/cream with depth) -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Secondary Paper (overlapping) -->
    <linearGradient id="paper-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Soft Shadow for floating elements -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Golden Glow behind main subject -->
  <circle cx="120" cy="110" r="90" fill="url(#glow)" />

  <!-- Atmospheric background elements (Studio desk setup) -->
  <g opacity="0.4">
    <!-- Pen Holder / Cup in background -->
    <rect x="180" y="90" width="28" height="35" rx="6" fill="#475569" />
    <path d="M 185 90 L 178 75 L 214 75 L 207 90 Z" fill="#64748b" />
    <!-- Pens sticking out -->
    <line x1="190" y1="75" x2="186" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="198" y1="75" x2="202" y2="45" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
    <line x1="204" y1="75" x2="212" y2="55" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Wooden Desk Surface at bottom -->
  <path d="M 0 170 Q 120 160 240 170 L 240 240 L 0 240 Z" fill="url(#desk-grad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#475569" stroke-width="2" />

  <!-- MAIN SCENE: THE TABS / SHEETS OF PAPER (Representing 张 - "tấm, tờ") -->
  
  <!-- Back Paper Sheet (Slightly rotated & shifted for layering) -->
  <g filter="url(#drop-shadow)" transform="rotate(8 135 110)">
    <rect x="75" y="60" width="105" height="135" rx="4" fill="url(#paper-grad-2)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Abstract design lines on background paper -->
    <line x1="90" y1="80" x2="150" y2="80" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="90" y1="96" x2="165" y2="96" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <line x1="90" y1="112" x2="130" y2="112" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Front Main Sheet of Paper (The hero object - crisp, vibrant, detailed) -->
  <g filter="url(#drop-shadow)" transform="rotate(-5 110 115)">
    <!-- Paper Base -->
    <rect x="55" y="45" width="115" height="145" rx="6" fill="url(#paper-grad)" stroke="#ffffff" stroke-width="2" />

    <!-- Colorful Creative Illustration printed ON the sheet (showing it's a piece of art/sheet) -->
    <!-- Sun / Accent circle -->
    <circle cx="85" cy="75" r="14" fill="#fef3c7" />
    <circle cx="85" cy="75" r="8" fill="#fbbf24" />

    <!-- Landscape graphic on paper -->
    <path d="M 65 125 L 90 95 L 115 125 Z" fill="#38bdf8" opacity="0.8" />
    <path d="M 95 125 L 125 85 L 155 125 Z" fill="#0284c7" />
    <path d="M 65 125 L 155 125 L 155 135 L 65 135 Z" fill="#10b981" />

    <!-- Text-like graphic lines (mocking authentic document/sheet layout) -->
    <rect x="70" y="147" width="70" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="70" y="159" width="45" height="4" rx="2" fill="#e2e8f0" />

    <!-- Corner fold/curl effect for realism -->
    <path d="M 150 45 L 170 45 L 170 65 Z" fill="#cbd5e1" />
    <path d="M 150 45 L 170 65 L 150 65 Z" fill="#94a3b8" opacity="0.5" />
  </g>

  <!-- Interactive Action Prop: Modern Styling Pen resting on the paper -->
  <g filter="url(#drop-shadow)" transform="rotate(25 120 135)">
    <!-- Pen Body -->
    <rect x="80" y="130" width="85" height="10" rx="5" fill="#f43f5e" />
    <!-- Pen Grip/Tip -->
    <path d="M 165 130 L 180 135 L 165 140 Z" fill="#e2e8f0" />
    <!-- Pen Cap/Clip -->
    <rect x="85" y="132" width="12" height="6" rx="2" fill="#fb7185" />
    <line x1="82" y1="135" x2="95" y2="135" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Floating decorative sparkles / magic learning dust -->
  <g fill="#fbbf24">
    <path d="M 45 65 Q 45 70 40 70 Q 45 70 45 75 Q 45 70 50 70 Q 45 70 45 65 Z" opacity="0.9" />
    <path d="M 195 155 Q 195 160 190 160 Q 195 160 195 165 Q 195 160 200 160 Q 195 160 195 155 Z" opacity="0.7" />
    <circle cx="55" cy="150" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="175" cy="70" r="2.5" fill="#ec4899" opacity="0.8" />
  </g>
</svg>