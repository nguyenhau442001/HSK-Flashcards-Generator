<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="60%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#24335E"/>
    </linearGradient>

    <!-- Mountain Gradient - Distant -->
    <linearGradient id="mountDist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A506B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>

    <!-- Mountain Gradient - Near -->
    <linearGradient id="mountNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Sunset/Dawn Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Outfit 2 Gradient -->
    <linearGradient id="jacket2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Platform/Balcony Gradient -->
    <linearGradient id="platformGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Stars / Sparkles in night sky -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="35" cy="30" r="1.5"/>
    <circle cx="75" cy="20" r="1"/>
    <circle cx="120" cy="40" r="1.5"/>
    <circle cx="170" cy="25" r="1"/>
    <circle cx="210" cy="45" r="1.5"/>
    <circle cx="20" cy="65" r="1"/>
    <circle cx="225" cy="80" r="1"/>
  </g>

  <!-- Ambient Sky Glow (Sunrise/Sunset over mountains) -->
  <circle cx="120" cy="110" r="90" fill="url(#sunGlow)"/>

  <!-- Distant Mountains -->
  <path d="M-10 160 L45 95 L95 140 L160 80 L220 135 L250 110 L250 180 L-10 180 Z" fill="url(#mountDist)"/>

  <!-- Near Mountains / Hills -->
  <path d="M-10 170 L30 120 L75 155 L135 110 L185 150 L250 125 L250 190 L-10 190 Z" fill="url(#mountNear)"/>
  
  <!-- Pine Trees silhouettes on mountains -->
  <g fill="#0F172A">
    <polygon points="30,130 25,145 35,145"/>
    <polygon points="35,125 30,138 40,138"/>
    <polygon points="135,120 130,135 140,135"/>
    <polygon points="140,115 135,128 145,128"/>
    <polygon points="185,160 180,172 190,172"/>
  </g>

  <!-- Golden Horizon Light streak -->
  <path d="M0 150 Q120 130 240 150 L240 155 Q120 135 0 155 Z" fill="#FBBF24" opacity="0.4"/>

  <!-- Scenic Viewpoint / Balcony Foreground -->
  <path d="M0 175 L240 175 L240 240 L0 240 Z" fill="url(#platformGrad)"/>
  
  <!-- Wooden railing structure -->
  <rect x="0" y="170" width="240" height="8" rx="3" fill="#64748B"/>
  <rect x="15" y="178" width="6" height="30" fill="#475569" rx="2"/>
  <rect x="75" y="178" width="6" height="30" fill="#475569" rx="2"/>
  <rect x="135" y="178" width="6" height="30" fill="#475569" rx="2"/>
  <rect x="195" y="178" width="6" height="30" fill="#475569" rx="2"/>
  <rect x="0" y="195" width="240" height="5" rx="2" fill="#475569"/>

  <!-- Binoculars on tripod looking out -->
  <g transform="translate(180, 160)">
    <!-- Tripod Legs -->
    <line x1="0" y1="0" x2="-15" y2="25" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="15" y2="25" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="2" y2="28" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Scope body -->
    <rect x="-10" y="-8" width="22" height="10" rx="4" fill="#38BDF8" transform="rotate(-15)"/>
    <circle cx="0" cy="-3" r="4" fill="#0EA5E9"/>
  </g>

  <!-- CHARACTER 1: Person pointing in awe (Left) -->
  <g transform="translate(75, 130)">
    <!-- Shadow -->
    <ellipse cx="0" cy="48" rx="16" ry="4" fill="#000000" opacity="0.4"/>
    
    <!-- Legs -->
    <rect x="-8" y="25" width="6" height="25" rx="3" fill="#1E293B"/>
    <rect x="2" y="25" width="6" height="25" rx="3" fill="#1E293B"/>
    <!-- Shoes -->
    <path d="M-12 50 L-6 50 C-4 50 -4 46 -7 46 L-12 46 Z" fill="#334155"/>
    <path d="M2 50 L8 50 C10 50 10 46 7 46 L2 46 Z" fill="#334155"/>

    <!-- Torso / Jacket -->
    <path d="M-12 0 L12 0 L15 28 L-15 28 Z" fill="url(#jacketGrad)"/>
    
    <!-- Head & Hair -->
    <circle cx="0" cy="-14" r="11" fill="#FCD34D"/> <!-- Face -->
    <path d="M-12 -16 C-12 -24 12 -24 12 -16 C12 -12 10 -8 6 -10 C3 -11 0 -15 -3 -10 C-8 -8 -12 -12 -12 -16 Z" fill="#334155"/> <!-- Hair -->

    <!-- Facial expression: Eyes wide, happy open mouth -->
    <circle cx="-3" cy="-15" r="1.5" fill="#1E293B"/>
    <circle cx="3" cy="-15" r="1.5" fill="#1E293B"/>
    <path d="M-2 -10 Q0 -6 2 -10 Z" fill="#1E293B"/> <!-- Open mouth -->
    <circle cx="-5" cy="-12" r="2" fill="#F87171" opacity="0.5"/> <!-- Blush -->
    <circle cx="5" cy="-12" r="2" fill="#F87171" opacity="0.5"/>

    <!-- Left Arm (Holding railing / down) -->
    <path d="M-12 5 C-18 10 -15 20 -15 20" stroke="#0284C7" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Right Arm (Pointing excitedly upward/outward) -->
    <path d="M12 5 C22 -2 25 -15 28 -15" stroke="#0284C7" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Pointing hand -->
    <circle cx="29" cy="-15" r="2.5" fill="#FCD34D"/>
  </g>

  <!-- CHARACTER 2: Person holding camera / taking photo (Right) -->
  <g transform="translate(130, 125)">
    <!-- Shadow -->
    <ellipse cx="0" cy="53" rx="16" ry="4" fill="#000000" opacity="0.4"/>
    
    <!-- Legs -->
    <rect x="-6" y="30" width="6" height="25" rx="3" fill="#0F172A"/>
    <rect x="2" y="30" width="6" height="25" rx="3" fill="#0F172A"/>
    <!-- Shoes -->
    <rect x="-9" y="53" width="9" height="4" rx="2" fill="#334155"/>
    <rect x="1" y="53" width="9" height="4" rx="2" fill="#334155"/>

    <!-- Torso / Jacket -->
    <path d="M-12 5 L12 5 L15 32 L-15 32 Z" fill="url(#jacket2Grad)"/>
    
    <!-- Head & Hair -->
    <circle cx="0" cy="-9" r="11" fill="#FCD34D"/> <!-- Face -->
    <path d="M-11 -13 C-5 -22 8 -20 12 -12 C10 -16 2 -18 -4 -13 C-8 -10 -10 -13 -11 -13 Z" fill="#78350F"/> <!-- Hair/Bun -->
    <circle cx="8" cy="-15" r="4" fill="#78350F"/> <!-- Hair bun -->

    <!-- Facial expression: smiling eyes -->
    <path d="M-5 -10 Q-3 -13 -1 -10" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M1 -10 Q3 -13 5 -10" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M-2 -6 Q0 -4 2 -6 Z" fill="#1E293B"/> <!-- Smile -->

    <!-- Arms holding Camera up to face -->
    <path d="M-12 10 C-18 5 -10 -2 -5 -5" stroke="#BE123C" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M12 10 C18 5 10 -2 5 -5" stroke="#BE123C" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Camera Prop -->
    <rect x="-8" y="-9" width="16" height="11" rx="3" fill="#64748B"/>
    <circle cx="0" cy="-3" r="4" fill="#1E293B"/>
    <circle cx="0" cy="-3" r="2.5" fill="#38BDF8"/>
    <rect x="-5" y="-12" width="4" height="3" rx="1" fill="#94A3B8"/>
    <circle cx="5" cy="-7" r="1" fill="#EF4444"/> <!-- Shutter light -->
  </g>

  <!-- Floating aesthetic nature elements (birds in distance) -->
  <g fill="#94A3B8" opacity="0.8">
    <path d="M45 70 Q50 65 55 70 Q60 65 65 70 Q55 75 45 70 Z"/>
    <path d="M60 80 Q64 76 68 80 Q72 76 76 80 Q68 84 60 80 Z" transform="scale(0.8) translate(20, 10)"/>
  </g>

  <!-- Sparkles of wonder / magic atmosphere -->
  <g fill="#FBBF24">
    <path d="M95 95 L97 100 L102 102 L97 104 L95 109 L93 104 L88 102 L93 100 Z" opacity="0.9"/>
    <path d="M150 75 L151.5 78.5 L155 80 L151.5 81.5 L150 85 L148.5 81.5 L145 80 L148.5 78.5 Z" opacity="0.7"/>
    <circle cx="110" cy="85" r="1.5" opacity="0.8"/>
    <circle cx="130" cy="95" r="2" opacity="0.6"/>
  </g>
</svg>