<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Light Gradient -->
    <radialGradient id="lampGlow" cx="120" cy="50" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Thought Bubble/Memory Flash Glow -->
    <radialGradient id="memoryGlow" cx="120" cy="75" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- Background Environment / Room Context -->
  <g id="environment">
    <!-- Bookshelf in background -->
    <rect x="25" y="60" width="45" height="95" rx="4" fill="#334155" opacity="0.6"/>
    <rect x="30" y="80" width="35" height="4" fill="#475569" opacity="0.6"/>
    <rect x="30" y="110" width="35" height="4" fill="#475569" opacity="0.6"/>
    <rect x="30" y="140" width="35" height="4" fill="#475569" opacity="0.6"/>
    
    <!-- Colorful books on shelf -->
    <path d="M35 70 h6 v10 h-6 z" fill="#f43f5e" opacity="0.7"/>
    <path d="M43 68 h8 v12 h-8 z" fill="#38bdf8" opacity="0.7"/>
    <path d="M53 72 h5 v8 h-5 z" fill="#10b981" opacity="0.7"/>
    <path d="M36 100 h7 v10 h-7 z" fill="#fb923c" opacity="0.7"/>
    <path d="M45 102 h9 v8 h-9 z" fill="#a855f7" opacity="0.7"/>

    <!-- Desk Surface -->
    <path d="M10 180 L230 180 L220 210 L20 210 Z" fill="#0f172a"/>
    <rect x="10" y="172" width="220" height="8" rx="3" fill="#475569"/>

    <!-- Desk Props: Laptop & Coffee Mug -->
    <path d="M145 160 L205 160 L212 173 L138 173 Z" fill="#64748b"/>
    <path d="M150 156 L200 156 L205 160 L145 160 Z" fill="#94a3b8"/>
    <circle cx="175" cy="165" r="4" fill="#38bdf8" opacity="0.6"/>

    <rect x="120" y="152" width="14" height="18" rx="3" fill="#ec4899"/>
    <path d="M134 156 C138 156 138 166 134 166" stroke="#ec4899" stroke-width="2" fill="none"/>
  </g>

  <!-- Memory Visualisation / Thought Cloud (Representing "Remembering a name") -->
  <g id="memory-concept" filter="url(#dropShadow)">
    <circle cx="120" cy="75" r="42" fill="url(#memoryGlow)"/>
    <path d="M120 40 
             C135 40, 145 50, 143 65 
             C155 67, 160 78, 153 88 
             C150 98, 138 102, 125 100 
             C115 108, 100 102, 98 92 
             C85 90, 82 78, 90 68 
             C88 55, 100 42, 115 42 Z" 
          fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" opacity="0.9"/>
          
    <!-- Light bulb / Spark of realization inside thought bubble -->
    <path d="M120 57 C126 57, 130 61, 130 67 C130 71, 127 74, 125 77 L115 77 C113 74, 110 71, 110 67 C110 61, 114 57, 120 57 Z" fill="#fbbf24"/>
    <rect x="116" y="78" width="8" height="3" rx="1.5" fill="#94a3b8"/>
    <path d="M117 83 h6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Sparkles -->
    <path d="M137 53 l4 -4 M103 53 l-4 -4 M120 48 v-5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Main Character (Thoughtful, realizing/remembering pose) -->
  <g id="character" filter="url(#dropShadow)">
    <!-- Character Body / Torso -->
    <path d="M90 185 C90 155, 110 145, 120 145 C130 145, 150 155, 150 185 Z" fill="#38bdf8"/>
    
    <!-- Collar / Shirt details -->
    <path d="M112 145 L120 156 L128 145 Z" fill="#f8fafc"/>

    <!-- Head and Neck -->
    <rect x="113" y="125" width="14" height="25" fill="#fbcfe8"/>
    <path d="M98 105 C98 85, 142 85, 142 105 C142 125, 142 135, 120 135 C98 135, 98 125, 98 105 Z" fill="#fbcfe8"/>

    <!-- Hair (Stylish dark hair) -->
    <path d="M98 105 C98 80, 142 80, 142 105 C142 110, 138 102, 135 98 C130 88, 110 88, 105 98 C102 102, 98 110, 98 105 Z" fill="#334155"/>
    <path d="M102 100 C108 92, 132 92, 138 100 C134 94, 106 94, 102 100 Z" fill="#475569"/>

    <!-- Facial Expression: Focused, eyes slightly upward (remembering) -->
    <!-- Eyebrows (slight furrow of concentration) -->
    <path d="M106 108 L114 106" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M126 106 L134 108" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes looking up-right -->
    <circle cx="111" cy="113" r="3" fill="#1e293b"/>
    <circle cx="129" cy="113" r="3" fill="#1e293b"/>
    <circle cx="112" cy="112" r="1" fill="#ffffff"/>
    <circle cx="130" cy="112" r="1" fill="#ffffff"/>

    <!-- Gentle Smile (Got it! / Remembering) -->
    <path d="M116 123 Q120 127 124 123" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Rosy Cheeks -->
    <circle cx="106" cy="118" r="4" fill="#f43f5e" opacity="0.3"/>
    <circle cx="134" cy="118" r="4" fill="#f43f5e" opacity="0.3"/>

    <!-- Hand raised to chin (Classic "thinking/remembering" gesture) -->
    <path d="M100 155 C90 145, 105 130, 115 132" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="115" cy="132" r="6" fill="#fbcfe8"/>
  </g>

  <!-- Foreground Atmospheric Elements -->
  <!-- Ambient glowing floating dust/particles for depth -->
  <circle cx="70" cy="90" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="170" cy="100" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="160" cy="50" r="2.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="80" cy="140" r="1.5" fill="#38bdf8" opacity="0.5"/>
</svg>