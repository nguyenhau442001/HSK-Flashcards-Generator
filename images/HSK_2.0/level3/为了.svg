<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Warm Spotlight Gradient for Goal/Purpose Focus -->
    <radialGradient id="spotlight" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Target Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Runner Suit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Environmental Atmosphere: Subtle Park/Track Elements -->
  <!-- Distant trees / bushes silhouette -->
  <circle cx="30" cy="190" r="40" fill="#1e293b" opacity="0.6" />
  <circle cx="70" cy="180" r="50" fill="#1e293b" opacity="0.8" />
  <circle cx="210" cy="195" r="45" fill="#1e293b" opacity="0.7" />

  <!-- Running Track / Ground Surface -->
  <path d="M-10 190 Q120 160 250 190 L250 240 L-10 240 Z" fill="#0f172a" />
  <path d="M-10 195 Q120 168 250 195" stroke="#334155" stroke-width="4" fill="none" />
  <path d="M-10 210 Q120 183 250 210" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.5" />

  <!-- THE TARGET (Representing "Purpose / Goal" - 为了 achieve health) -->
  <g transform="translate(180, 75)" filter="url(#shadow)">
    <!-- Target Outer Ring -->
    <circle cx="0" cy="0" r="32" fill="#ef4444" />
    <!-- Target White Ring -->
    <circle cx="0" cy="0" r="24" fill="#f8fafc" />
    <!-- Target Inner Red -->
    <circle cx="0" cy="0" r="16" fill="#ef4444" />
    <!-- Target Bullseye -->
    <circle cx="0" cy="0" r="8" fill="url(#goldGrad)" />
    <!-- Glowing Pulsing Aura -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Glowing Arrow / Action Vector piercing the goal (Symbolizing "Action taken FOR purpose") -->
  <g filter="url(#shadow)">
    <path d="M 60 160 Q 120 120 170 80" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 4" fill="none" opacity="0.8" />
    <polygon points="175,75 165,72 170,82" fill="#38bdf8" />
  </g>

  <!-- MAIN SUBJECT: Active Runner (Representing Health / Exercise) -->
  <g transform="translate(95, 125)" filter="url(#shadow)">
    <!-- Motion Trails -->
    <path d="M -40 25 L -70 30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <path d="M -30 45 L -60 55" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.3" />

    <!-- Back Leg (Stride forward) -->
    <path d="M 0 20 L -25 45 L -15 55" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Back Shoe -->
    <ellipse cx="-15" cy="57" rx="8" ry="4" fill="#f8fafc" />

    <!-- Torso (Dynamic forward lean) -->
    <path d="M -10 -10 L 10 25 L -5 30 L -20 -5 Z" fill="url(#suitGrad)" />

    <!-- Head & Sweat / Energy Spark -->
    <circle cx="-15" cy="-22" r="11" fill="#fcd34d" />
    <!-- Hair -->
    <path d="M -26 -22 Q -22 -32 -10 -30" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" />
    <!-- Determined Face Expression (Side Profile) -->
    <path d="M -10 -20 Q -6 -18 -8 -15" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <!-- Sweat Drop -->
    <path d="M -22 -15 Q -20 -18 -18 -15 Q -20 -12 -22 -15 Z" fill="#38bdf8" />

    <!-- Front Arm (Pumped back/forward) -->
    <path d="M -5 -5 L 15 -15 L 25 -5" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Hand -->
    <circle cx="27" cy="-3" r="4" fill="#fcd34d" />

    <!-- Back Arm -->
    <path d="M -15 -5 L -30 10 L -20 20" fill="none" stroke="#0369a1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Front Leg (Planting/Pushing) -->
    <path d="M 5 25 L 20 45 L 35 40" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Shoe -->
    <ellipse cx="38" cy="40" rx="9" ry="5" fill="#f8fafc" />
  </g>

  <!-- HEALTH / VITALITY PROPS (Floating heart / wellness symbols near the target to connect action to purpose) -->
  <g transform="translate(195, 25)" filter="url(#shadow)">
    <path d="M 0 10 Q -10 -2 -5 -12 Q 0 -18 7 -10 Q 14 -18 19 -12 Q 24 -2 14 10 L 7 18 Z" fill="#ec4899">
      <animateTransform attributeName="transform" type="scale" values="1; 1.1; 1" dur="2s" repeatCount="indefinite" additive="sum" />
    </path>
  </g>

  <g transform="translate(145, 35)" opacity="0.8" filter="url(#shadow)">
    <path d="M 0 6 Q -6 -1 -3 -7 Q 0 -11 4 -6 Q 8 -11 11 -7 Q 14 -1 8 6 L 4 11 Z" fill="#10b981" />
  </g>

  <!-- Energy Sparkles / Ambient Details -->
  <circle cx="110" cy="70" r="3" fill="#fbbf24" />
  <circle cx="130" cy="95" r="2" fill="#38bdf8" />
  <circle cx="70" cy="90" r="2.5" fill="#f43f5e" />
  <path d="M 160 120 L 166 126 M 166 120 L 160 126" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Decorative Foreground Vignette / Frame border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>