<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="handle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Door Surface -->
  <rect x="30" y="20" width="180" height="200" rx="4" fill="#334155" />
  <rect x="40" y="30" width="160" height="180" rx="2" fill="#1e293b" opacity="0.5" />
  
  <!-- Door Frame/Shadow -->
  <path d="M30 20 L210 20 L210 220 L30 220 Z" fill="none" stroke="#475569" stroke-width="2" />
  
  <!-- Light Spill from Door Crack -->
  <rect x="205" y="20" width="5" height="200" fill="#f59e0b" opacity="0.3" />

  <!-- Handle Glow -->
  <circle cx="165" cy="120" r="40" fill="url(#handle-glow)" />

  <!-- Door Handle (The 'Ba' object) -->
  <rect x="145" y="115" width="50" height="10" rx="5" fill="#fbbf24" />
  <circle cx="145" cy="120" r="8" fill="#f59e0b" />
  <rect x="142" y="110" width="6" height="20" rx="3" fill="#d97706" />

  <!-- Hand Grasping (The 'Ba' action) -->
  <!-- Arm -->
  <path d="M-10 160 Q 60 160 130 135" stroke="#fb923c" stroke-width="24" stroke-linecap="round" fill="none" />
  
  <!-- Palm/Back of Hand -->
  <path d="M125 135 L155 135 L165 115 L135 110 Z" fill="#fb923c" />
  
  <!-- Fingers wrapping around handle -->
  <path d="M145 108 Q 155 105 165 110" stroke="#fdba74" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M148 115 Q 158 112 168 117" stroke="#fdba74" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M150 122 Q 160 119 170 124" stroke="#fdba74" stroke-width="8" stroke-linecap="round" fill="none" />
  
  <!-- Thumb -->
  <path d="M130 135 Q 140 120 155 125" stroke="#fb923c" stroke-width="9" stroke-linecap="round" fill="none" />

  <!-- Action Lines (Closing the door) -->
  <path d="M215 80 L225 80" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M215 120 L230 120" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M215 160 L225 160" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Floor Reflection -->
  <ellipse cx="120" cy="230" rx="80" ry="10" fill="#38bdf8" opacity="0.1" />
</svg>