<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Study Light Gradient -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lamp Glow -->
  <circle cx="120" cy="80" r="110" fill="url(#lampGlow)"/>

  <!-- Background Environment: Cozy Study Room -->
  <g id="environment">
    <!-- Bookshelf in background -->
    <rect x="25" y="45" width="45" height="90" rx="4" fill="#334155" opacity="0.6"/>
    <line x1="25" y1="75" x2="70" y2="75" stroke="#1e293b" stroke-width="3"/>
    <line x1="25" y1="105" x2="70" y2="105" stroke="#1e293b" stroke-width="3"/>
    <!-- Books on shelf -->
    <rect x="32" y="55" width="8" height="20" rx="1" fill="#f43f5e"/>
    <rect x="42" y="58" width="10" height="17" rx="1" fill="#38bdf8"/>
    <rect x="54" y="53" width="7" height="22" rx="1" fill="#10b981"/>

    <!-- Window with night view -->
    <path d="M 175,40 L 215,40 L 215,95 L 175,95 Z" fill="#0b0f19" stroke="#334155" stroke-width="3"/>
    <circle cx="195" cy="60" r="4" fill="#fef08a" opacity="0.8"/>
    <!-- Plant near window -->
    <path d="M 180,95 Q 185,80 195,85 Q 205,80 210,95 Z" fill="#10b981" opacity="0.8"/>
    <rect x="190" y="88" width="10" height="7" rx="2" fill="#cbd5e1"/>

    <!-- Desk Surface -->
    <path d="M 15,160 L 225,160 L 215,205 L 25,205 Z" fill="#475569"/>
    <path d="M 15,160 L 225,160 L 225,165 L 15,165 Z" fill="#64748b"/>
  </g>

  <!-- Study Props on Desk -->
  <g id="props">
    <!-- Desk Lamp -->
    <path d="M 195,160 L 195,120 L 210,95 L 190,90 Z" fill="#94a3b8"/>
    <ellipse cx="200" cy="92" rx="12" ry="5" fill="#f59e0b"/>

    <!-- Coffee Mug -->
    <rect x="165" y="140" width="14" height="18" rx="3" fill="#f8fafc"/>
    <path d="M 179,144 C 185,144 185,154 179,154" fill="none" stroke="#f8fafc" stroke-width="2"/>

    <!-- Laptop showing a simple quiz question (just graphical checkmark / friendly shapes, NO text) -->
    <path d="M 70,162 L 130,162 L 135,130 L 65,130 Z" fill="#cbd5e1"/>
    <!-- Laptop Screen -->
    <rect x="72" y="98" width="56" height="34" rx="3" fill="url(#screenGrad)"/>
    <!-- Simple shape on screen representing an easy puzzle: Big clear Star -->
    <polygon points="100,105 104,115 115,115 107,121 110,131 100,125 90,131 93,121 85,115 96,115" fill="#fef08a"/>
  </g>

  <!-- Main Character: Confident & Relaxed Student -->
  <g id="character">
    <!-- Chair Back -->
    <path d="M 90,165 L 115,100 L 135,100 L 135,165 Z" fill="#334155" opacity="0.7"/>

    <!-- Character Body & Hoodie -->
    <path d="M 75,185 C 75,150 125,150 125,185 Z" fill="#ec4899"/>
    <!-- Hoodie Strings -->
    <line x1="95" y1="155" x2="95" y2="168" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="105" y1="155" x2="105" y2="168" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="95" y="132" width="10" height="14" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="100" cy="115" r="18" fill="#fbcfe8"/>

    <!-- Hair (Stylish Dark Bob) -->
    <path d="M 82,112 C 82,98 118,98 118,112 C 118,122 115,130 110,130 C 105,125 102,118 95,118 C 88,118 85,125 82,125 C 82,120 82,115 82,112 Z" fill="#0f172a"/>

    <!-- Relaxed, Confident Facial Expression -->
    <!-- Smiling Eyes (Happy arc) -->
    <path d="M 90,113 Q 94,110 98,113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 102,113 Q 106,110 110,113" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Confident Smile -->
    <path d="M 94,120 Q 100,126 106,120" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="89" cy="117" r="3" fill="#f43f5e" opacity="0.4"/>
    <circle cx="111" cy="117" r="3" fill="#f43f5e" opacity="0.4"/>

    <!-- Arms / Hands expressing ease (One hand gesturing casually, one resting) -->
    <!-- Left arm resting -->
    <path d="M 78,160 Q 70,170 75,185" fill="none" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
    <!-- Right arm raised gesturing effortlessly (thumbs up gesture or relaxed open hand) -->
    <path d="M 122,160 Q 135,150 130,135" fill="none" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="130" cy="132" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Sparkling Visual Accent (Representing "Easy / Piece of Cake" without any symbols/text) -->
  <g id="sparkles">
    <!-- Star Sparkle top right of laptop -->
    <path d="M 145,95 Q 145,102 152,102 Q 145,102 145,109 Q 145,102 138,102 Q 145,102 145,95 Z" fill="#fbbf24"/>
    <!-- Small secondary sparkle -->
    <path d="M 60,115 Q 60,119 64,119 Q 60,119 60,123 Q 60,119 56,119 Q 60,119 60,115 Z" fill="#38bdf8"/>
    <!-- Glowing checkmark shape built cleanly with vector paths, NO text -->
    <path d="M 135,70 L 142,78 L 158,60" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>