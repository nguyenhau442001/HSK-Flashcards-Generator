<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Deep Slate Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="canvGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />

  <!-- Ambient lighting from lamp/window top-left -->
  <circle cx="60" cy="40" r="80" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="180" cy="80" r="50" fill="#fbbf24" opacity="0.06" filter="url(#glow)" />

  <!-- Room Interior Background details -->
  <!-- Bookshelf / Window backdrop -->
  <rect x="25" y="45" width="45" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="25" y1="75" x2="70" y2="75" stroke="#334155" stroke-width="1.5" />
  <!-- Book items on shelf -->
  <rect x="32" y="55" width="8" height="18" rx="2" fill="#ec4899" opacity="0.8" />
  <rect x="42" y="52" width="6" height="21" rx="2" fill="#38bdf8" opacity="0.8" />
  <rect x="50" y="57" width="12" height="16" rx="2" fill="#f59e0b" opacity="0.8" />

  <!-- Hanging picture frame on wall -->
  <rect x="155" y="40" width="40" height="30" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <rect x="160" y="45" width="30" height="20" fill="#0f172a" />
  <circle cx="175" cy="52" r="4" fill="#38bdf8" opacity="0.8" />
  <path d="M163 60 L173 53 L183 60 Z" fill="#10b981" opacity="0.7" />

  <!-- Studio Desk Surface -->
  <path d="M10 185 C10 180, 20 175, 30 175 L210 175 C220 175, 230 180, 230 185 L235 220 C235 228, 228 235, 220 235 L20 235 C12 235, 5 228, 5 220 Z" fill="url(#deskGradient)" />
  <!-- Desk edge highlight -->
  <path d="M10 175 L230 175" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <!-- Art Supplies on Desk (Left side) -->
  <!-- Jar for brushes -->
  <rect x="25" y="150" width="16" height="28" rx="3" fill="#475569" />
  <rect x="23" y="146" width="20" height="5" rx="1.5" fill="#64748b" />
  <!-- Paintbrushes -->
  <line x1="29" y1="146" x2="22" y2="125" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" />
  <line x1="33" y1="146" x2="35" y2="120" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="37" y1="146" x2="45" y2="128" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Palette with paint blobs -->
  <ellipse cx="65" cy="170" rx="16" ry="10" fill="#f1f5f9" transform="rotate(-15 65 170)" />
  <circle cx="58" cy="167" r="2.5" fill="#ef4444" />
  <circle cx="65" cy="165" r="2.5" fill="#3b82f6" />
  <circle cx="72" cy="168" r="2.5" fill="#eab308" />
  <circle cx="68" cy="173" r="2.5" fill="#10b981" />

  <!-- MAIN PROP: The Easel and Canvas (Center-Right) -->
  <!-- Easel structure -->
  <line x1="130" y1="85" x2="110" y2="210" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <line x1="130" y1="85" x2="160" y2="210" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <line x1="130" y1="85" x2="135" y2="215" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <!-- Easel shelf -->
  <rect x="95" y="155" width="75" height="6" rx="2" fill="#64748b" />

  <!-- THE PAINTING (Canvas) - Representing "画" (picture/painting) -->
  <rect x="105" y="95" width="55" height="65" rx="3" fill="url(#canvGradient)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Artwork inside the canvas depicting a landscape scenery -->
  <!-- Mountain background in painting -->
  <path d="M112 140 L125 115 L138 135 L148 120 L153 140 Z" fill="#94a3b8" />
  <path d="M125 115 L132 125 L125 140 Z" fill="#64748b" /> <!-- Mountain shadow -->
  <!-- Sun in painting -->
  <circle cx="142" cy="108" r="6" fill="#fbbf24" />
  <!-- River/Greenery in painting -->
  <path d="M105 140 Q 130 135, 153 148 L153 160 L105 160 Z" fill="#10b981" opacity="0.8" />
  <path d="M115 142 Q 130 148, 145 141" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Tiny red house in painting -->
  <rect x="122" y="133" width="8" height="7" fill="#ef4444" />
  <path d="M121 133 L126 129 L131 133 Z" fill="#b91c1c" />

  <!-- CHARACTER: The Painter (Sitting/Leaning in front of the canvas) -->
  <!-- Torso & Clothing -->
  <path d="M70 170 C70 150, 95 145, 105 160 L115 210 L70 210 Z" fill="#38bdf8" />
  <!-- Collar/Apron detail -->
  <path d="M85 155 L95 170 L80 170 Z" fill="#e0f2fe" />
  <rect x="75" y="155" width="30" height="55" rx="4" fill="#0284c7" />
  
  <!-- Head & Hair -->
  <circle cx="85" cy="125" r="16" fill="#fbcfe8" /> <!-- Skin tone -->
  <path d="M68 125 C68 110, 102 110, 102 125 C102 130, 98 132, 98 132 L95 120 L75 120 L72 132 C72 132, 68 130, 68 125 Z" fill="#334155" /> <!-- Stylish dark hair -->
  
  <!-- Face expressions (Focused, happy creation) -->
  <!-- Eye (focused looking at canvas) -->
  <circle cx="91" cy="125" r="2" fill="#0f172a" />
  <!-- Gentle smile -->
  <path d="M89 132 Q 93 136, 96 132" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Rosy cheek -->
  <circle cx="94" cy="129" r="3.5" fill="#fda4af" opacity="0.6" />

  <!-- Arms and Hand holding paintbrush actively painting -->
  <!-- Right arm reaching forward -->
  <path d="M95 160 C105 160, 115 150, 125 145" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none" />
  <!-- Hand -->
  <circle cx="127" cy="144" r="5" fill="#fbcfe8" />
  <!-- Paintbrush actively touching the canvas -->
  <line x1="125" y1="145" x2="118" y2="137" stroke="#713f12" stroke-width="3" stroke-linecap="round" />
  <line x1="118" y1="137" x2="114" y2="132" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" /> <!-- Pink paint tip -->

  <!-- Left arm resting or holding palette -->
  <path d="M75 165 C68 175, 72 190, 80 195" stroke="#0284c7" stroke-width="9" stroke-linecap="round" fill="none" />
  <circle cx="81" cy="197" r="4.5" fill="#fbcfe8" />

  <!-- Sparkles/Magic of creation (Visual flair indicating the act of "画" - drawing/painting) -->
  <path d="M102 115 L104 120 L109 122 L104 124 L102 129 L100 124 L95 122 L100 120 Z" fill="#fbbf24" opacity="0.9" />
  <path d="M148 88 L149 91 L152 92 L149 93 L148 96 L147 93 L144 92 L147 91 Z" fill="#38bdf8" opacity="0.8" />
  <circle cx="118" cy="110" r="1.5" fill="#f43f5e" />
  <circle cx="138" cy="150" r="2" fill="#10b981" />

</svg>