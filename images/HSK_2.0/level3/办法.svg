<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  <defs>
    <linearGradient id="tableGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Workbench Surface -->
  <path d="M0 160 L240 160 L240 216 Q240 240 216 240 L24 240 Q0 240 0 216 Z" fill="#1e293b"/>
  <rect x="0" y="160" width="240" height="4" fill="#334155"/>

  <!-- Blueprint (The Method/Plan) -->
  <path d="M40 175 L130 165 L140 210 L50 225 Z" fill="#38bdf8" opacity="0.2"/>
  <path d="M45 180 L125 172 M48 190 L128 182 M51 200 L131 192" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  <circle cx="90" cy="190" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Scattered Tools -->
  <rect x="160" y="200" width="30" height="6" rx="2" fill="#94a3b8" transform="rotate(15 160 200)"/>
  <rect x="185" y="180" width="4" height="25" rx="2" fill="#475569" transform="rotate(-20 185 180)"/>
  <circle cx="190" cy="210" r="4" fill="#64748b"/>

  <!-- The Complex Problem (Mechanical Device) -->
  <g transform="translate(120, 110)">
    <!-- Outer Housing -->
    <path d="M-50 -40 Q0 -60 50 -40 L60 40 Q0 60 -60 40 Z" fill="#334155" stroke="#475569" stroke-width="3"/>
    
    <!-- Internal Gears (The Problem) -->
    <circle cx="-20" cy="-10" r="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M-20 -28 L-20 -32 M-20 8 L-20 12 M-38 -10 L-42 -10 M-2 -10 L2 -10" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    
    <circle cx="25" cy="15" r="22" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M25 -7 L25 -12 M25 37 L25 42 M3 -15 L-2 -20" stroke="#475569" stroke-width="3" stroke-linecap="round" transform="rotate(45 25 15)"/>
    
    <!-- Wires and Connections -->
    <path d="M-20 -10 Q5 0 25 15" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
    <path d="M-40 20 Q-10 30 20 20" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- The Solution (The "Bànfǎ" Action) -->
  <!-- Character's Arms -->
  <path d="M20 140 Q40 100 95 105" fill="none" stroke="#f1f5f9" stroke-width="12" stroke-linecap="round"/>
  <path d="M220 140 Q200 100 145 105" fill="none" stroke="#f1f5f9" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Hands holding the "Key" component -->
  <path d="M90 105 Q95 95 105 100 L110 110 L95 115 Z" fill="#e2e8f0"/>
  <path d="M150 105 Q145 95 135 100 L130 110 L145 115 Z" fill="#e2e8f0"/>

  <!-- The Glowing "Method" Piece -->
  <g transform="translate(120, 105)">
    <circle cx="0" cy="0" r="25" fill="url(#glow)"/>
    <!-- The Golden Gear/Solution -->
    <path d="M0 -12 L3 -18 L-3 -18 Z M12 0 L18 3 L18 -3 Z M0 12 L-3 18 L3 18 Z M-12 0 L-18 -3 L-18 3 Z" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="10" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
    <path d="M-4 -4 L4 4 M-4 4 L4 -4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Atmospheric Light Accents -->
  <circle cx="120" cy="105" r="60" fill="url(#glow)" opacity="0.3"/>
  <path d="M110 40 Q120 20 130 40" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8" stroke-linecap="round">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" />
  </path>
  <path d="M100 50 L105 45 M140 50 L135 45" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>