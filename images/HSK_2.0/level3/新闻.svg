<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="tabletScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Interior Environment & Room Details -->
  <g id="environment">
    <!-- Window with night city view -->
    <rect x="150" y="30" width="60" height="85" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M165 40 h15 v25 h-15 z M185 40 h15 v25 h-15 z M165 75 h15 v25 h-15 z M185 75 h15 v25 h-15 z" fill="#1e293b" opacity="0.8"/>
    <!-- City lights through window -->
    <circle cx="172" cy="50" r="1.5" fill="#fbbf24"/>
    <circle cx="192" cy="60" r="1.5" fill="#f43f5e"/>
    <circle cx="177" cy="85" r="1.5" fill="#38bdf8"/>
    <circle cx="190" cy="90" r="1.5" fill="#fbbf24"/>

    <!-- Bookshelf / Plant in background -->
    <path d="M25 50 h30 v6 h-30 z" fill="#334155"/>
    <path d="M30 35 h20 v15 h-20 z" fill="#475569"/>
    <!-- Small Plant -->
    <path d="M35 35 Q32 25 40 22 Q48 25 45 35 Z" fill="#10b981"/>
    <path d="M40 35 v-5" stroke="#065f46" stroke-width="1.5"/>
    <path d="M20 70 h35 v120 h-35 z" fill="#1e293b" opacity="0.3"/>

    <!-- Ambient Light from Lamp -->
    <polygon points="100,50 60,180 140,180" fill="url(#lampGlow)" opacity="0.6"/>

    <!-- Desk Surface -->
    <path d="M10 180 h220 v35 c0 2.76-2.24 5-5 5 h-210 c-2.76 0-5-2.24-5-5 z" fill="url(#deskGrad)" filter="url(#softShadow)"/>
    <!-- Desk trim highlight -->
    <path d="M10 180 h220 v2 h-220 z" fill="#475569"/>
  </g>

  <!-- Desk Props (Coffee cup, desk lamp, plant) -->
  <g id="desk-props">
    <!-- Coffee Mug -->
    <path d="M200 160 h16 c2 0 3 1 3 3 v10 c0 2-1 3-3 3 h-16 c-2 0-3-1-3-3 v-10 c0-2 1-3 3-3 z" fill="#f8fafc"/>
    <path d="M219 164 c3 0 5 1 5 3 s-2 3-5 3" stroke="#f8fafc" stroke-width="2" fill="none"/>
    <path d="M204 157 c1-3 5-3 6 0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Desk Lamp -->
    <path d="M90 180 l10 -50 h10 l10 50 z" fill="#334155"/>
    <path d="M100 130 l-15 -30 h40 z" fill="#f59e0b"/>
    <ellipse cx="105" cy="100" rx="20" ry="8" fill="#f59e0b"/>
  </g>

  <!-- Main Character (Viewer/Reader reacting to news) -->
  <g id="character" filter="url(#softShadow)">
    <!-- Chair Back -->
    <path d="M75 100 h50 v85 h-50 z" rx="10" fill="#334155"/>

    <!-- Torso (Hoodie / Casual Wear) -->
    <path d="M70 140 c0-15 10-25 30-25 h20 c20 0 30 10 30 25 v40 h-80 z" fill="#3b82f6"/>
    <!-- Hoodie Strings & Details -->
    <path d="M95 125 q5 15 10 20" stroke="#93c5fd" stroke-width="2" fill="none"/>
    <path d="M125 125 q-5 15 -10 20" stroke="#93c5fd" stroke-width="2" fill="none"/>

    <!-- Neck -->
    <path d="M97 115 h26 v15 h-26 z" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <circle cx="110" cy="95" r="22" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M88 95 c0-15 10-24 22-24 c13 0 24 9 24 24 c0 4-2 6-2 6 c-2-5-6-8-12-8 c-8 0-12 5-15 12 c-2-3-5-6-9-6 c-3 0-6 3-8 12 z" fill="#1e293b"/>

    <!-- Expressive Face (Eyes wide, mouth open in engaging news update reaction) -->
    <circle cx="102" cy="93" r="3" fill="#0f172a"/>
    <circle cx="118" cy="93" r="3" fill="#0f172a"/>
    <!-- Eyebrows raised -->
    <path d="M99 87 c3-2 6-2 8 0" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M115 87 c3-2 6-2 8 0" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Mouth (surprised/excited "O" shape) -->
    <ellipse cx="110" cy="103" rx="4" ry="5" fill="#9f1239"/>

    <!-- Arms & Hands interacting with Tablet -->
    <!-- Left Arm -->
    <path d="M75 140 c-10 10 -15 25 -5 35 l10 5" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm (Holding / Pointing at tablet) -->
    <path d="M145 140 c15 5 20 20 15 30 l-10 10" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="152" cy="173" r="6" fill="#fbcfe8"/>
    <circle cx="80" cy="175" r="6" fill="#fbcfe8"/>
  </g>

  <!-- Interactive Device (Large Tablet/Monitor displaying News Broadcast) -->
  <g id="news-device" filter="url(#softShadow)">
    <!-- Stand -->
    <path d="M100 180 h20 v10 h-20 z" fill="#64748b"/>
    <path d="M90 190 h40 v4 h-40 z" fill="#475569"/>

    <!-- Tablet Body (Angled upright on desk) -->
    <rect x="70" y="110" width="80" height="70" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <!-- Screen -->
    <rect x="75" y="115" width="70" height="55" rx="4" fill="url(#tabletScreen)"/>
    <rect x="75" y="115" width="70" height="55" rx="4" fill="url(#screenGlow)"/>

    <!-- News UI Elements on Screen (Abstract dynamic charts, globe, video streams - NO text) -->
    <!-- Breaking News Graphic / Globe representation -->
    <circle cx="110" cy="135" r="14" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M96 135 h28 M110 121 v28 M99 125 q11 5 22 0 M99 145 q11 -5 22 0" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.6"/>
    
    <!-- Live Broadcast Indicator (Red Dot + Bar) -->
    <circle cx="83" cy="123" r="3" fill="#f43f5e"/>
    <path d="M90 122 h10 v2 h-10 z" fill="#f43f5e" rx="1"/>

    <!-- News Ticker / Graph bars at bottom of screen -->
    <rect x="80" y="155" width="12" height="10" rx="1" fill="#f59e0b"/>
    <rect x="96" y="150" width="12" height="15" rx="1" fill="#10b981"/>
    <rect x="112" y="145" width="12" height="20" rx="1" fill="#38bdf8"/>
    <rect x="128" y="152" width="12" height="13" rx="1" fill="#ec4899"/>
  </g>

  <!-- Foreground Atmospheric Elements & Action Effects -->
  <g id="action-effects">
    <!-- Floating Data / News Stream Particles -->
    <circle cx="65" cy="100" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="55" cy="115" r="2" fill="#fbbf24" opacity="0.7"/>
    <circle cx="175" cy="130" r="3.5" fill="#10b981" opacity="0.9"/>
    <circle cx="185" cy="110" r="2" fill="#ec4899" opacity="0.8"/>

    <!-- News Wave / Signal Pulse emanating from screen -->
    <path d="M60 130 q-10 -10 0 -20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M55 135 q-15 -15 0 -30" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
    
    <path d="M160 130 q10 -10 0 -20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M165 135 q15 -15 0 -30" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>
</svg>