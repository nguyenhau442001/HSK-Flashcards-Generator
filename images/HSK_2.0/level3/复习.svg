<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Lamp Gradient -->
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Window Night Gradient -->
    <linearGradient id="windowNight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Wallpaper Pattern / Room Interior Details -->
  <path d="M0 150 L240 150" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="25" y="40" width="65" height="75" rx="4" fill="url(#windowNight)" stroke="#334155" stroke-width="2"/>
  <!-- Window Panes & Moon -->
  <line x1="57" y1="40" x2="57" y2="115" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="77" x2="90" y2="77" stroke="#334155" stroke-width="2"/>
  <circle cx="45" cy="58" r="8" fill="#fbbf24" opacity="0.8"/>

  <!-- Bookshelf Background -->
  <rect x="175" y="45" width="40" height="85" rx="2" fill="#334155" opacity="0.4"/>
  <line x1="175" y1="70" x2="215" y2="70" stroke="#1e293b" stroke-width="2"/>
  <line x1="175" y1="95" x2="215" y2="95" stroke="#1e293b" stroke-width="2"/>
  <rect x="182" y="52" width="8" height="18" rx="1" fill="#38bdf8"/>
  <rect x="192" y="49" width="10" height="21" rx="1" fill="#ec4899"/>
  <rect x="180" y="78" width="9" height="17" rx="1" fill="#10b981"/>
  <rect x="193" y="75" width="14" height="20" rx="1" fill="#f59e0b"/>

  <!-- Study Desk Surface -->
  <path d="M10 185 L230 185 L220 150 L20 150 Z" fill="#334155" filter="url(#softShadow)"/>
  <rect x="10" y="185" width="220" height="8" rx="2" fill="#475569"/>

  <!-- Desk Lamp (Top Right) -->
  <path d="M175 150 L185 100 L195 100 L205 150 Z" fill="#64748b"/>
  <path d="M170 95 C170 85 200 85 200 95 Z" fill="#38bdf8"/>
  <!-- Lamp Light Cone -->
  <polygon points="185,95 130,195 230,195" fill="url(#lampGlow)" style="mix-blend-mode: screen;" pointer-events="none"/>

  <!-- Alarm Clock ("Exam Time" Context Prop) -->
  <circle cx="55" cy="140" r="12" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="55" cy="140" r="10" fill="#f8fafc"/>
  <line x1="55" y1="140" x2="55" y2="134" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="140" x2="60" y2="142" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="51" cy="127" r="2" fill="#64748b"/>
  <circle cx="59" cy="127" r="2" fill="#64748b"/>
  <!-- Red alert badge on clock -->
  <circle cx="63" cy="132" r="3" fill="#ef4444"/>

  <!-- Coffee Mug -->
  <rect x="195" y="160" width="16" height="20" rx="3" fill="#e2e8f0"/>
  <path d="M211 165 C216 165 216 175 211 175" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  <!-- Steam lines -->
  <path d="M200 152 C200 148 204 148 204 144" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Open Textbook / Review Materials -->
  <g transform="translate(85, 155)">
    <!-- Left Page -->
    <path d="M0 8 C20 4 40 4 60 12 L60 32 C40 24 20 24 0 28 Z" fill="#f1f5f9"/>
    <path d="M5 14 L35 12" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <path d="M5 20 L40 18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Right Page -->
    <path d="M60 12 C80 4 100 4 120 8 L120 28 C100 24 80 24 60 32 Z" fill="#f8fafc"/>
    <line x1="70" y1="13" x2="105" y2="15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="70" y1="19" x2="100" y2="21" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Highlight Marker on book -->
    <rect x="70" y="12" width="18" height="4" rx="1" fill="#fde047" opacity="0.8"/>

    <!-- Spine -->
    <path d="M60 12 L60 32" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Stack of extra notebooks -->
  <rect x="125" y="172" width="35" height="12" rx="2" fill="#38bdf8"/>
  <rect x="120" y="178" width="38" height="10" rx="2" fill="#10b981"/>

  <!-- Character: Student Studying (Focused & Determined) -->
  <!-- Body / Torso -->
  <path d="M85 220 C85 195 100 185 125 185 C150 185 165 195 165 220 Z" fill="#38bdf8"/>
  <!-- Collar / Shirt Detail -->
  <polygon points="115,185 125,200 135,185" fill="#f8fafc"/>

  <!-- Head & Face -->
  <circle cx="125" cy="145" r="22" fill="#fed7aa"/>
  
  <!-- Hair (Messy/Studious style) -->
  <path d="M103 145 C103 125 120 120 135 122 C148 124 150 135 148 145 C146 132 135 126 120 127 C108 128 103 138 103 145 Z" fill="#1e293b"/>
  <path d="M115 123 C120 118 135 118 142 125 C138 121 125 120 115 123 Z" fill="#1e293b"/>

  <!-- Glasses (Exam Prep vibe) -->
  <circle cx="117" cy="147" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="133" cy="147" r="6" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="123" y1="147" x2="127" y2="147" stroke="#0f172a" stroke-width="2"/>

  <!-- Focused Eyes & Eyebrows -->
  <path d="M112 143 L120 145" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M130 145 L138 143" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Determined Expression / Mouth -->
  <path d="M123 158 Q125 161 128 158" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>

  <!-- Hands Resting / Writing -->
  <!-- Left Arm & Hand -->
  <path d="M95 195 C90 180 100 170 110 165" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="110" cy="165" r="6" fill="#fed7aa"/>

  <!-- Right Arm & Hand holding pen -->
  <path d="M155 195 C160 180 145 170 138 165" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="138" cy="165" r="6" fill="#fed7aa"/>
  <!-- Pen -->
  <line x1="135" y1="162" x2="125" y2="155" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Conceptual Accent (Mental focus sparkles - NO TEXT) -->
  <g transform="translate(145, 105)" opacity="0.8">
    <path d="M 0 10 Q 0 0 10 0 Q 0 0 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(100, 115) scale(0.6)" opacity="0.8">
    <path d="M 0 10 Q 0 0 10 0 Q 0 0 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Z" fill="#38bdf8"/>
  </g>
</svg>