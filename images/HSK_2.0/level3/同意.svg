<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="table-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Hand Gradient 1 -->
    <linearGradient id="skin-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Hand Gradient 2 -->
    <linearGradient id="skin-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Hand Cuff 1 -->
    <linearGradient id="cuff-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Hand Cuff 2 -->
    <linearGradient id="cuff-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Document Paper Gradient -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Stamp Gradient -->
    <linearGradient id="stamp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Lighting / Ambient Glow -->
  <circle cx="120" cy="110" r="90" fill="url(#lamp-glow)"/>

  <!-- Scene Environment: Office/Study Desk backdrop -->
  <g id="environment">
    <!-- Back wall detail / shelf line -->
    <rect x="30" y="45" width="180" height="3" rx="1.5" fill="#334155" opacity="0.4"/>
    <!-- Small background prop: tiny potted plant -->
    <path d="M 185 48 L 195 48 L 198 38 L 182 38 Z" fill="#64748b"/>
    <circle cx="190" cy="34" r="8" fill="#10b981"/>
    <circle cx="186" cy="30" r="6" fill="#34d399"/>
    
    <!-- Desk Surface -->
    <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#table-top)"/>
    <!-- Desk edge highlight -->
    <rect x="0" y="160" width="240" height="4" fill="#475569"/>
  </g>

  <!-- Central Prop: Contract / Agreement Document with Checkmark -->
  <g id="contract-document" filter="url(#shadow)">
    <!-- Clipboard/Folder back -->
    <rect x="75" y="80" width="90" height="110" rx="6" transform="rotate(3 120 135)" fill="#475569"/>
    <!-- Paper Sheet -->
    <rect x="72" y="75" width="90" height="110" rx="4" transform="rotate(-2 120 130)" fill="url(#paper-grad)"/>
    
    <!-- Abstract text lines on paper -->
    <rect x="85" y="90" width="45" height="4" rx="2" fill="#cbd5e1" transform="rotate(-2 120 130)"/>
    <rect x="85" y="102" width="65" height="4" rx="2" fill="#e2e8f0" transform="rotate(-2 120 130)"/>
    <rect x="85" y="114" width="55" height="4" rx="2" fill="#e2e8f0" transform="rotate(-2 120 130)"/>
    <rect x="85" y="126" width="40" height="4" rx="2" fill="#e2e8f0" transform="rotate(-2 120 130)"/>

    <!-- Large Green Checkmark (Symbolizing Agreement on Paper) -->
    <path d="M 98 155 L 112 168 L 142 138" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  </g>

  <!-- Action Elements: Two Hands Reaching a Deal (Handshake / Agreement gesture) -->
  <g id="agreement-hands" filter="url(#shadow)">
    <!-- Left Arm & Sleeve (Corporate/Modern Outfit - Blue) -->
    <path d="M -10 200 Q 30 170 75 145 L 75 180 Q 20 200 -10 220 Z" fill="url(#cuff-blue)"/>
    <path d="M 45 158 L 72 144 L 70 156 L 40 172 Z" fill="#0284c7" opacity="0.6"/>

    <!-- Left Hand (Warm/Tan skin, dynamic pose extending to the right) -->
    <g>
      <!-- Palm and Thumb -->
      <path d="M 75 145 C 90 135 105 130 115 135 C 120 138 122 143 115 148 C 105 155 95 160 85 165 Z" fill="url(#skin-left)"/>
      <!-- Fingers gripping or meeting in agreement -->
      <path d="M 105 132 C 115 130 128 135 132 142 C 135 148 130 152 122 150 C 115 148 110 145 105 142 Z" fill="url(#skin-left)"/>
    </g>

    <!-- Right Arm & Sleeve (Emerald/Teal Outfit) -->
    <path d="M 250 200 Q 210 170 165 145 L 165 180 Q 220 200 250 220 Z" fill="url(#cuff-emerald)"/>

    <!-- Right Hand (Sleek/Sleeved contrast, meeting left hand) -->
    <g>
      <!-- Palm and Thumb reaching left -->
      <path d="M 165 145 C 150 135 135 130 125 135 C 120 138 118 143 125 148 C 135 155 145 160 155 165 Z" fill="url(#skin-right)"/>
      <!-- Fingers intertwining / meeting -->
      <path d="M 135 132 C 125 130 112 135 108 142 C 105 148 110 152 118 150 C 125 148 130 145 135 142 Z" fill="url(#skin-right)"/>
    </g>
  </g>

  <!-- Central Focus: Handshake Impact / Approved Stamp Overlay -->
  <g id="agreement-sparkle" filter="url(#shadow)">
    <!-- Golden Energy Burst at the exact meeting point of agreement -->
    <path d="M 120 115 L 124 128 L 137 132 L 124 136 L 120 149 L 116 136 L 103 132 L 116 128 Z" fill="#fbbf24"/>
    <circle cx="120" cy="132" r="3" fill="#ffffff"/>

    <!-- Secondary floating celebration sparks -->
    <circle cx="95" cy="105" r="4" fill="#38bdf8"/>
    <circle cx="148" cy="112" r="3" fill="#10b981"/>
    <circle cx="132" cy="95" r="5" fill="#f43f5e"/>
    
    <!-- Tiny sparkle stars -->
    <path d="M 82 120 L 84 125 L 89 127 L 84 129 L 82 134 L 80 129 L 75 127 L 80 125 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M 155 135 L 157 139 L 161 141 L 157 143 L 155 147 L 153 143 L 149 141 L 153 139 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Foreground Atmospheric Elements / Bokeh -->
  <circle cx="40" cy="190" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="205" cy="180" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="180" cy="210" r="1" fill="#ffffff" opacity="0.2"/>
  <circle cx="60" cy="215" r="2.5" fill="#ffffff" opacity="0.25"/>

</svg>