<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.6" />
    </linearGradient>

    <!-- Calendar Highlight (Highlighting a 'segment' of time) -->
    <linearGradient id="timeSpan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Office / Room Interior -->
  <!-- Wallpaper / Back Wall -->
  <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b" />
  
  <!-- Window showing night/evening (busy overtime context) -->
  <path d="M 160 35 L 200 35 L 200 95 L 160 95 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <!-- Window panes -->
  <line x1="180" y1="35" x2="180" y2="95" stroke="#334155" stroke-width="2" />
  <line x1="160" y1="65" x2="200" y2="65" stroke="#334155" stroke-width="2" />
  <!-- City light dots outside -->
  <circle cx="170" cy="50" r="1.5" fill="#f59e0b" />
  <circle cx="190" cy="55" r="1" fill="#38bdf8" />
  <circle cx="175" cy="80" r="1.5" fill="#ef4444" />
  
  <!-- Light beam from window -->
  <polygon points="160,35 120,170 180,170" fill="url(#windowLight)" />

  <!-- Wall Shelf with 'Time/Schedule' items -->
  <rect x="40" y="45" width="70" height="6" rx="3" fill="#334155" />
  <!-- Small clock showing late hours -->
  <circle cx="55" cy="35" r="8" fill="#cbd5e1" />
  <circle cx="55" cy="35" r="7" fill="#1e293b" />
  <line x1="55" y1="35" x2="58" y2="33" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="55" y1="35" x2="55" y2="31" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />

  <!-- WALL CALENDAR (Representing "这段" - this segment of time) -->
  <g transform="translate(80, 35)" filter="url(#shadow)">
    <!-- Calendar Body -->
    <rect x="0" y="0" width="32" height="38" rx="4" fill="#f8fafc" />
    <rect x="0" y="0" width="32" height="10" rx="4" fill="#ef4444" />
    <circle cx="10" cy="3" r="2" fill="#cbd5e1" />
    <circle cx="22" cy="3" r="2" fill="#cbd5e1" />
    <!-- Highlighted segment of days (The 'duàn' / time span) -->
    <rect x="6" y="16" width="20" height="15" rx="2" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5" />
    <!-- Tiny grid lines inside calendar -->
    <line x1="9" y1="19" x2="13" y2="19" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="16" y1="19" x2="20" y2="19" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="23" y1="19" x2="27" y2="19" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    
    <line x1="9" y1="24" x2="13" y2="24" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="16" y1="24" x2="20" y2="24" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
    <line x1="23" y1="24" x2="27" y2="24" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
    
    <line x1="9" y1="29" x2="13" y2="29" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
    <line x1="16" y1="29" x2="20" y2="29" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="23" y1="29" x2="27" y2="29" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- DESK & PROPS -->
  <!-- Desk Surface -->
  <rect x="15" y="160" width="210" height="12" rx="4" fill="#334155" filter="url(#shadow)" />
  <rect x="25" y="172" width="190" height="40" fill="#1e293b" />

  <!-- Multiple Work Items (Showing being busy: Laptop, papers, coffee, tablet) -->
  <!-- Laptop Base -->
  <path d="M 75 160 L 135 160 L 145 163 L 65 163 Z" fill="#94a3b8" />
  <!-- Laptop Screen with Busy Code/Graphs -->
  <path d="M 80 120 L 130 120 C 132 120 133 121 133 123 L 133 158 C 133 160 132 160 130 160 L 80 160 C 78 160 77 160 77 158 L 77 123 C 77 121 78 120 80 120 Z" fill="#0f172a" stroke="#64748b" stroke-width="2" />
  <rect x="83" y="125" width="44" height="30" fill="url(#screenGlow)" rx="2" />
  <!-- Graph lines on screen -->
  <polyline points="87,148 95,140 103,144 113,133 121,137" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Stack of Papers / Documents (Busy workload) -->
  <g transform="translate(145, 145)">
    <rect x="0" y="10" width="30" height="5" rx="1" fill="#cbd5e1" transform="rotate(-5)" />
    <rect x="-2" y="5" width="32" height="6" rx="1" fill="#f1f5f9" transform="rotate(2)" />
    <rect x="2" y="0" width="28" height="6" rx="1" fill="#e2e8f0" />
    <line x1="6" y1="3" x2="16" y2="3" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="5" x2="22" y2="5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Coffee Mug (Fuel for busy times) -->
  <rect x="45" y="142" width="16" height="18" rx="3" fill="#f8fafc" />
  <path d="M 61 146 C 65 146 65 154 61 156" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
  <!-- Steam lines -->
  <path d="M 50 134 C 52 131 48 128 50 125" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M 57 136 C 59 133 55 130 57 127" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- CHARACTER: Busy Professional -->
  <g transform="translate(90, 80)">
    <!-- Body / Torso (leaning forward, active) -->
    <path d="M 15 65 C 10 65 5 75 0 90 L 50 90 C 45 75 40 65 35 65 Z" fill="#2563eb" />
    <!-- Shirt Collar & Tie -->
    <polygon points="25,65 20,73 30,73" fill="#f8fafc" />
    <polygon points="23,73 25,85 27,73" fill="#ef4444" />

    <!-- Head & Hair (Expressive stressed/busy look) -->
    <circle cx="25" cy="40" r="16" fill="#fde047" />
    <!-- Hair style -->
    <path d="M 10 38 C 10 25 20 22 28 23 C 38 24 40 32 40 38 C 38 35 30 33 22 35 C 16 36 12 37 10 38 Z" fill="#1e293b" />
    
    <!-- Face features: Busy/Focused expression -->
    <!-- Eyebrows furrowed in concentration -->
    <line x1="17" y1="36" x2="22" y2="38" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="28" y1="38" x2="33" y2="36" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes (Focused dots) -->
    <circle cx="19" cy="41" r="1.5" fill="#1e293b" />
    <circle cx="31" cy="41" r="1.5" fill="#1e293b" />
    <!-- Mouth (slight grimace/tired line) -->
    <path d="M 22 49 Q 25 46 28 49" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Sweat drop (showing stress / busy nature) -->
    <path d="M 38 42 C 38 42 41 46 41 48 C 41 49.5 39.5 51 38 51 C 36.5 51 35 49.5 35 48 C 35 46 38 42 38 42 Z" fill="#38bdf8" />

    <!-- Arms & Hands interacting with laptop & head -->
    <!-- Right Arm (typing on laptop) -->
    <path d="M 38 72 L 50 78 L 45 82" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="45" cy="82" r="4" fill="#fde047" /> <!-- Hand -->

    <!-- Left Arm (Hand touching head, feeling overwhelmed/busy) -->
    <path d="M 12 72 C 5 70 -2 55 5 48" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" />
    <circle cx="5" cy="48" r="4" fill="#fde047" /> <!-- Hand on head -->
  </g>

  <!-- PENDING TASKS / FLOATING NOTIFICATIONS (Visual metaphor for busyness) -->
  <g transform="translate(170, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="36" height="24" rx="4" fill="#ffffff" />
    <polyline points="8,12 14,18 28,8" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g transform="translate(25, 105)" filter="url(#shadow)">
    <rect x="0" y="0" width="32" height="20" rx="4" fill="#ffffff" />
    <line x1="8" y1="7" x2="24" y2="7" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="13" x2="18" y2="13" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>

</svg>