<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container with Night/Indoor contrast -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="windowExt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="70" y="40" width="100" height="110" rx="6" />
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Wall & Floor -->
  <rect x="0" y="0" width="240" height="170" fill="#1e293b" />
  <rect x="0" y="170" width="240" height="70" fill="#0f172a" />
  <!-- Baseboard -->
  <rect x="0" y="165" width="240" height="5" fill="#334155" />

  <!-- Window Frame Exterior (Outside View) -->
  <rect x="65" y="35" width="110" height="120" rx="8" fill="#334155" />
  <rect x="70" y="40" width="100" height="110" fill="url(#windowExt)" />

  <!-- OUTSIDE SCENE: Wind and swirling leaves/dust (Showing "刮风") -->
  <g clip-path="url(#windowClip)">
    <!-- Distant moon/glow -->
    <circle cx="140" cy="70" r="12" fill="#fbbf24" opacity="0.4" />
    
    <!-- Bent tree trunk & branches in the wind -->
    <path d="M150,150 Q145,110 160,80 Q165,70 160,65" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M156,95 Q135,90 120,80" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M158,85 Q175,75 185,60" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Wind Swirl Lines (Dynamic Wind Effect) -->
    <path d="M 75,60 Q 100,50 125,70 T 165,65" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round" />
    <path d="M 85,95 Q 115,85 140,100 T 165,90" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round" />
    <path d="M 70,120 Q 100,110 130,130" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" />

    <!-- Flying Leaves (Indicates strong wind) -->
    <path d="M95,80 C98,82 96,86 92,85 Z" fill="#f59e0b" />
    <path d="M125,65 C128,67 126,71 122,70 Z" fill="#10b981" />
    <path d="M110,115 C113,117 111,121 107,120 Z" fill="#fb923c" />
    <path d="M145,100 C148,102 146,106 142,105 Z" fill="#f59e0b" />
  </g>

  <!-- Window Frame Grids / Inner Structure -->
  <rect x="68" y="38" width="104" height="114" rx="6" fill="none" stroke="#475569" stroke-width="4" />
  <!-- Center divider -->
  <line x1="120" y1="40" x2="120" y2="150" stroke="#334155" stroke-width="4" />
  <line x1="70" y1="95" x2="170" y2="95" stroke="#334155" stroke-width="4" />

  <!-- Curtains blown dramatically inward by the wind -->
  <!-- Left Curtain -->
  <path d="M 68,40 Q 50,70 55,110 Q 60,130 68,140 Z" fill="#38bdf8" opacity="0.85" />
  <!-- Right Curtain (blown heavily to the right inside room) -->
  <path d="M 172,40 Q 195,65 185,105 Q 175,130 172,140 Z" fill="#38bdf8" opacity="0.85" />

  <!-- Room Interior Details -->
  <!-- Desk beneath window -->
  <rect x="50" y="150" width="140" height="8" rx="3" fill="#475569" />
  <!-- Cute Lamp on desk with warm glow -->
  <path d="M 95,150 L 105,135 L 115,150 Z" fill="#cbd5e1" />
  <path d="M 105,137 L 105,128" stroke="#cbd5e1" stroke-width="2" />
  <path d="M 98,128 Q 105,120 112,128 Z" fill="#fbbf24" />
  <!-- Lamp Light Cone -->
  <polygon points="105,128 75,170 135,170" fill="url(#warmLight)" />

  <!-- Plant pot on desk (rustling slightly) -->
  <path d="M 140,140 L 148,150 L 132,150 Z" fill="#64748b" />
  <circle cx="140" cy="136" r="8" fill="#10b981" />
  <circle cx="135" cy="132" r="6" fill="#059669" />
  <circle cx="145" cy="133" r="6" fill="#34d399" />

  <!-- Character (Observing the wind from inside, cozy and safe) -->
  <!-- Character Body / Hoodie -->
  <path d="M 25,200 Q 25,175 45,175 Q 65,175 65,200 Z" fill="#ec4899" />
  <!-- Character Head -->
  <circle cx="45" cy="162" r="14" fill="#fbcfe8" />
  <!-- Cozy Hair -->
  <path d="M 31,160 Q 35,148 45,148 Q 57,148 59,160 Q 50,154 40,156 Z" fill="#451a03" />
  <!-- Face expression (curious/surprised at the wind) -->
  <circle cx="49" cy="162" r="1.5" fill="#1e293b" />
  <path d="M 53,165 Q 55,167 57,165" stroke="#1e293b" stroke-width="1.2" fill="none" stroke-linecap="round" />

  <!-- Character hands holding a warm mug -->
  <rect x="40" y="178" width="10" height="12" rx="3" fill="#f8fafc" />
  <path d="M 45,181 Q 48,181 48,184 Q 48,187 45,187" stroke="#f8fafc" stroke-width="1.5" fill="none" />

  <!-- Indoor Ambient Details: Cozy Rug on Floor -->
  <ellipse cx="120" cy="205" rx="55" ry="15" fill="#334155" opacity="0.6" />
</svg>