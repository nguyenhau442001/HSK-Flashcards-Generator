<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <clipPath id="doorwayClip">
      <rect x="75" y="45" width="90" height="155" rx="4" />
    </clipPath>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- ENVIRONMENT: Apartment hallway / Doorway scene -->
  <!-- Floor -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />
  
  <!-- Wall Background -->
  <rect x="0" y="0" width="240" height="190" fill="url(#wallGrad)" />

  <!-- Apartment Door Frame (Left Character's apartment) -->
  <rect x="15" y="40" width="60" height="150" fill="#1b263b" stroke="#475569" stroke-width="3" />
  <rect x="22" y="48" width="46" height="134" fill="#0f172a" />
  <!-- Number plate on door -->
  <circle tcx="45" cy="65" r="5" fill="#f59e0b" />

  <!-- Open Doorway/Threshold between apartments (Right side neighbor visiting) -->
  <!-- Warm glow spilling from neighbor's doorway -->
  <path d="M 140 45 L 210 45 L 210 190 L 140 190 Z" fill="url(#warmLight)" />

  <!-- Hanging Houseplant (Context Prop - Friendly home vibe) -->
  <path d="M 100 20 Q 105 5 110 20" stroke="#64748b" stroke-width="2" fill="none" />
  <path d="M 90 20 L 120 20 L 115 30 L 95 30 Z" fill="#38bdf8" />
  <path d="M 105 30 C 95 35 90 45 95 50 C 100 55 105 40 105 30 Z" fill="#10b981" />
  <path d="M 105 30 C 115 35 120 45 115 50 C 110 55 105 40 105 30 Z" fill="#10b981" />
  <path d="M 105 30 C 100 38 102 48 108 52 C 112 45 108 35 105 30 Z" fill="#059669" />

  <!-- Floor Mat -->
  <ellipse cx="115" cy="188" rx="35" ry="8" fill="#334155" />
  <ellipse cx="115" cy="188" rx="30" ry="6" fill="#475569" />

  <!-- CHARACTER 1: Neighbor standing in doorway, smiling warmly, holding a plate of warm cookies/fruit -->
  <g id="neighbor">
    <!-- Body / Torso -->
    <path d="M 95 120 L 135 120 L 142 185 L 88 185 Z" fill="#ec4899" />
    <path d="M 100 120 L 140 120 L 145 140 L 95 140 Z" fill="#f472b6" /> <!-- collar/shirt detail -->

    <!-- Legs -->
    <rect x="100" y="180" width="12" height="15" fill="#334155" />
    <rect x="124" y="180" width="12" height="15" fill="#334155" />
    <ellipse cx="106" cy="195" rx="8" ry="4" fill="#0f172a" />
    <ellipse cx="130" cy="195" rx="8" ry="4" fill="#0f172a" />

    <!-- Head & Face -->
    <circle cx="120" cy="95" r="16" fill="#fbcfe8" />
    <!-- Hair -->
    <path d="M 104 95 C 102 75 138 75 136 95 C 138 85 102 85 104 95 Z" fill="#881337" />
    <path d="M 104 90 C 104 78 136 78 136 90 Z" fill="#be123c" />
    
    <!-- Friendly Expression (Smiling eyes, big happy mouth) -->
    <path d="M 112 92 Q 116 88 120 92" stroke="#4c0519" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 124 92 Q 128 88 132 92" stroke="#4c0519" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 117 100 Q 120 106 123 100" fill="#4c0519" /> <!-- Smile -->
    <!-- Rosy Cheeks -->
    <circle cx="111" cy="97" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="131" cy="97" r="3" fill="#f43f5e" opacity="0.4" />

    <!-- Arms & Gift (Plate of baked goods) -->
    <!-- Left Arm -->
    <path d="M 95 125 L 80 145 L 90 150" stroke="#ec4899" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Right Arm holding tray -->
    <path d="M 135 125 L 145 145 L 135 155" stroke="#ec4899" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Plate / Tray -->
    <ellipse cx="125" cy="155" rx="20" ry="6" fill="#e2e8f0" />
    <ellipse cx="125" cy="153" rx="18" ry="4" fill="#cbd5e1" />
    <!-- Cookies / Buns on plate -->
    <circle cx="120" cy="150" r="5" fill="#d97706" />
    <circle cx="132" cy="151" r="5" fill="#b45309" />
    <circle cx="126" cy="147" r="4" fill="#f59e0b" />
  </g>

  <!-- CHARACTER 2: Resident receiving the neighbor, welcoming posture -->
  <g id="resident">
    <!-- Body -->
    <path d="M 40 125 L 75 125 L 80 185 L 35 185 Z" fill="#38bdf8" />
    <path d="M 42 125 L 73 125 L 70 145 L 45 145 Z" fill="#bae6fd" />

    <!-- Legs -->
    <rect x="45" y="180" width="10" height="15" fill="#1e293b" />
    <rect x="62" y="180" width="10" height="15" fill="#1e293b" />
    <ellipse cx="50" cy="195" rx="7" ry="4" fill="#0f172a" />
    <ellipse cx="67" cy="195" rx="7" ry="4" fill="#0f172a" />

    <!-- Head -->
    <circle cx="58" cy="98" r="15" fill="#fde68a" />
    <!-- Hair -->
    <path d="M 44 95 C 44 80 72 80 72 95 C 65 85 51 85 44 95 Z" fill="#1e293b" />

    <!-- Friendly Expression -->
    <path d="M 51 96 Q 54 93 57 96" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 61 96 Q 64 93 67 96" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 56 103 Q 59 108 62 103" fill="#0f172a" />

    <!-- Welcoming Arms (Reaching out slightly) -->
    <path d="M 72 130 Q 85 135 88 145" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none" />
    <circle cx="89" cy="146" r="3" fill="#fde68a" />
    
    <path d="M 42 130 Q 35 140 40 150" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none" />
    <circle cx="41" cy="152" r="3" fill="#fde68a" />
  </g>

  <!-- Friendly Atmosphere details (Sparkles / Heart accent above indicating friendliness) -->
  <g fill="#f59e0b" opacity="0.9">
    <path d="M 105 60 C 105 55 110 50 115 55 C 120 50 125 55 125 60 C 125 66 115 72 115 72 C 115 72 105 66 105 60 Z" fill="#fb7185" transform="scale(0.6) translate(110, 30)" />
    <!-- Sparkles -->
    <path d="M 85 75 L 87 80 L 92 82 L 87 84 L 85 89 L 83 84 L 78 82 L 83 80 Z" fill="#fbbf24" />
    <path d="M 155 95 L 156 98 L 159 99 L 156 100 L 155 103 L 154 100 L 151 99 L 154 98 Z" fill="#fbbf24" />
  </g>
  
</svg>