<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Character & Cat Gradients -->
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Canvas Container with rounded corners -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Background Interior Elements -->
  <!-- Window view showing night sky -->
  <path d="M175 30 L210 35 L210 90 L175 85 Z" fill="#090d16" opacity="0.8" />
  <circle cx="195" cy="45" r="1.5" fill="#f8fafc" opacity="0.6" />
  <circle cx="185" cy="65" r="1" fill="#f8fafc" opacity="0.4" />

  <!-- Wall Shelf with Plant -->
  <rect x="15" y="55" width="70" height="4" rx="2" fill="#334155" />
  <path d="M35 55 C35 45 45 45 45 55" fill="#10b981" />
  <path d="M25 55 C25 40 38 40 35 55" fill="#059669" />
  <path d="M48 55 C48 42 60 42 55 55" fill="#34d399" />
  <path d="M38 45 L40 55 L42 45 Z" fill="#475569" />

  <!-- Cozy Floor Lamp Glow & Pole -->
  <circle cx="215" cy="130" r="60" fill="url(#lamp-glow)" />
  <rect x="213" y="80" width="4" height="135" rx="2" fill="#475569" />
  <path d="M205 75 L225 75 L220 95 L210 95 Z" fill="#f59e0b" />

  <!-- Room Floor -->
  <rect x="0" y="210" width="240" height="30" fill="#0b0f19" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2" />

  <!-- Sofa / Couch -->
  <path d="M 20 150 Q 20 130 40 130 L 140 130 Q 160 130 160 150 L 160 210 L 20 210 Z" fill="#334155" />
  <!-- Sofa Cushions -->
  <rect x="25" y="135" width="60" height="70" rx="10" fill="#475569" />
  <rect x="90" y="135" width="65" height="70" rx="10" fill="#475569" />

  <!-- Coffee Table & Mug -->
  <rect x="150" y="180" width="60" height="25" rx="4" fill="#64748b" />
  <ellipse cx="180" cy="180" rx="20" ry="6" fill="#94a3b8" />
  <rect x="172" y="165" width="12" height="15" rx="3" fill="#f8fafc" />
  <path d="M 184 170 Q 190 170 190 175 Q 190 180 184 180" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
  <!-- Steam from mug -->
  <path d="M 176 160 Q 178 155 176 150" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- HUMAN CHARACTER (Young Woman Sitting & Admiring) -->
  <!-- Legs / Skirt -->
  <path d="M 95 180 L 130 180 L 135 210 L 100 210 Z" fill="#1e293b" />
  
  <!-- Torso -->
  <path d="M 80 135 Q 110 130 115 175 L 85 175 Z" fill="url(#shirt-grad)" />

  <!-- Head & Face -->
  <circle cx="100" cy="110" r="16" fill="#fbcfe8" />
  <!-- Hair Style -->
  <path d="M 84 105 C 84 90 116 90 116 105 C 116 120 110 125 108 125 C 105 125 100 115 95 115 C 90 115 84 110 84 105 Z" fill="#334155" />
  <!-- Facial expression: Happy / Admiring eyes & smiling mouth -->
  <circle cx="95" cy="108" r="1.5" fill="#0f172a" />
  <circle cx="105" cy="108" r="1.5" fill="#0f172a" />
  <path d="M 98 113 Q 100 116 102 113" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  <!-- Blush -->
  <circle cx="92" cy="112" r="2.5" fill="#f43f5e" opacity="0.4" />
  <circle cx="108" cy="112" r="2.5" fill="#f43f5e" opacity="0.4" />

  <!-- Arms reaching out lovingly towards the cat -->
  <path d="M 105 140 Q 125 145 130 155" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <circle cx="132" cy="157" r="3" fill="#fbcfe8" />

  <!-- THE SUBJECT: "这只小猫" (This small cat) -->
  <!-- Sitting upright on the cushion, looking adorable -->
  <g transform="translate(50, 150)">
    <!-- Cat Body -->
    <ellipse cx="20" cy="35" rx="14" ry="18" fill="url(#cat-grad)" />
    
    <!-- Cat Head -->
    <circle cx="20" cy="18" r="13" fill="url(#cat-grad)" />

    <!-- Cat Ears -->
    <path d="M 10 10 L 13 2 L 18 10 Z" fill="#ea580c" />
    <path d="M 22 10 L 27 2 L 30 10 Z" fill="#ea580c" />
    <path d="M 12 8 L 13 4 L 16 9 Z" fill="#fbcfe8" />
    <path d="M 24 9 L 27 4 L 28 8 Z" fill="#fbcfe8" />

    <!-- Cat Eyes (Big, cute, sparkling) -->
    <circle cx="16" cy="16" r="2.5" fill="#0f172a" />
    <circle cx="24" cy="16" r="2.5" fill="#0f172a" />
    <circle cx="17" cy="15" r="1" fill="#ffffff" />
    <circle cx="25" cy="15" r="1" fill="#ffffff" />

    <!-- Cat Nose & Mouth -->
    <polygon points="19,19 21,19 20,20.5" fill="#f43f5e" />
    <path d="M 20 20.5 Q 18 22 17 21" fill="none" stroke="#0f172a" stroke-width="1" stroke-linecap="round" />
    <path d="M 20 20.5 Q 22 22 23 21" fill="none" stroke="#0f172a" stroke-width="1" stroke-linecap="round" />

    <!-- Cat Paws (Plopped nicely) -->
    <ellipse cx="14" cy="48" rx="3" ry="2" fill="#fff7ed" />
    <ellipse cx="26" cy="48" rx="3" ry="2" fill="#fff7ed" />

    <!-- Cat Tail (Curled playfully) -->
    <path d="M 32 40 Q 42 45 38 30" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Floating Sparkles / Joy indicators emphasizing "可爱" (Cute) -->
  <g fill="#fbbf24">
    <path d="M 35 120 L 37 125 L 42 127 L 37 129 L 35 134 L 33 129 L 28 127 L 33 125 Z" opacity="0.9" />
    <path d="M 120 110 L 121 113 L 124 114 L 121 115 L 120 118 L 119 115 L 116 114 L 119 113 Z" opacity="0.7" />
    <circle cx="70" cy="120" r="2" opacity="0.8" />
    <circle cx="45" cy="155" r="1.5" opacity="0.8" />
  </g>
</svg>