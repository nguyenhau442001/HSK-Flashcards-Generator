<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Comfort -->
    <radialGradient id="comfortGlow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Character 1 (Worried) Gradient -->
    <linearGradient id="sweater1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Character 2 (Reassuring) Gradient -->
    <linearGradient id="sweater2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Comfort Lighting Overlay -->
  <circle cx="150" cy="120" r="110" fill="url(#comfortGlow)" />

  <!-- ROOM ENVIRONMENT & PROPS -->
  <!-- Back Wall Details / Bookshelf -->
  <g opacity="0.4">
    <!-- Bookshelf Unit -->
    <rect x="20" y="30" width="70" height="120" rx="4" fill="#334155" />
    <rect x="25" y="35" width="60" height="4" fill="#475569" />
    <rect x="25" y="70" width="60" height="4" fill="#475569" />
    <rect x="25" y="105" width="60" height="4" fill="#475569" />
    <!-- Mini Books on Shelf -->
    <rect x="30" y="52" width="8" height="18" rx="1" fill="#ec4899" />
    <rect x="40" y="48" width="6" height="22" rx="1" fill="#38bdf8" />
    <rect x="48" y="55" width="10" height="15" rx="1" fill="#fbbf24" />
    <rect x="30" y="85" width="12" height="20" rx="1" fill="#10b981" />
    <rect x="44" y="88" width="7" height="17" rx="1" fill="#818cf8" />
  </g>

  <!-- Window with Night City View -->
  <g>
    <!-- Window Frame Outer -->
    <rect x="155" y="35" width="60" height="75" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <!-- Night Sky -->
    <rect x="158" y="38" width="54" height="69" rx="4" fill="url(#nightSky)" />
    <!-- Distant City Lights / Stars -->
    <circle cx="170" cy="55" r="1" fill="#ffffff" opacity="0.8" />
    <circle cx="195" cy="45" r="1.5" fill="#fef08a" opacity="0.9" />
    <circle cx="202" cy="75" r="1" fill="#ffffff" opacity="0.7" />
    <!-- City Skyline Silhouette -->
    <path d="M158 90 L165 75 L170 78 L178 70 L185 82 L192 68 L200 80 L208 72 L212 90 Z" fill="#1e293b" opacity="0.8" />
    <!-- Window Crossbars -->
    <line x1="185" y1="38" x2="185" y2="107" stroke="#475569" stroke-width="2" />
    <line x1="158" y1="72" x2="212" y2="72" stroke="#475569" stroke-width="2" />
    <!-- Warm Window Glow Sill Effect -->
    <rect x="153" y="108" width="64" height="4" rx="2" fill="#334155" />
  </g>

  <!-- House Plant on Side Table -->
  <g>
    <!-- Small Table -->
    <rect x="155" y="175" width="55" height="8" rx="2" fill="#334155" />
    <path d="M165 183 L168 210" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <path d="M200 183 L197 210" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <!-- Pot -->
    <path d="M172 155 L188 155 L192 175 L168 175 Z" fill="#94a3b8" />
    <!-- Plant Leaves -->
    <path d="M180 155 Q165 130 155 135 Q150 145 175 155 Z" fill="#10b981" />
    <path d="M182 155 Q195 125 210 135 Q215 148 185 155 Z" fill="#059669" />
    <path d="M180 155 Q180 120 185 120 Q190 120 182 155 Z" fill="#34d399" />
  </g>

  <!-- Flooring -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a" />
  <line x1="0" y1="210" x2="240" y2="210" stroke="#334155" stroke-width="2" />

  <!-- COUCH / SEATING -->
  <g filter="url(#softShadow)">
    <!-- Couch Base -->
    <rect x="35" y="140" width="130" height="75" rx="16" fill="#475569" />
    <!-- Couch Cushions -->
    <rect x="40" y="130" width="120" height="60" rx="14" fill="#64748b" />
    <!-- Couch Armrest Left -->
    <rect x="25" y="125" width="22" height="85" rx="11" fill="#334155" />
    <!-- Cozy Cushion Throw -->
    <path d="M42 135 Q60 120 75 145 Z" fill="#f43f5e" opacity="0.85" />
  </g>


  <!-- CHARACTERS: WORRIED FRIEND & REASSURING FRIEND -->

  <!-- CHARACTER 1: WORRIED (Left, sitting slightly slumped, holding mug with both hands) -->
  <g id="character-worried" filter="url(#softShadow)">
    <!-- Legs/Feet -->
    <rect x="58" y="195" width="14" height="20" rx="6" fill="#1e293b" />
    <ellipse cx="65" cy="215" rx="8" ry="4" fill="#0f172a" />

    <!-- Body / Torso (Slumped forward slightly) -->
    <path d="M50 145 Q65 140 75 175 L55 185 Q45 160 50 145 Z" fill="url(#sweater1)" />

    <!-- Head -->
    <circle cx="62" cy="115" r="18" fill="#ffedd5" />
    <!-- Hair (Messy/Stressed cute bob) -->
    <path d="M46 115 Q45 95 62 97 Q80 95 78 115 Q75 105 62 105 Q48 105 46 115 Z" fill="#334155" />
    <path d="M72 103 Q82 112 76 122 Q72 115 72 103 Z" fill="#334155" />

    <!-- Worried Facial Expression -->
    <!-- Eyebrows (Slanted up in worry) -->
    <line x1="53" y1="110" x2="59" y2="113" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="65" y1="113" x2="71" y2="110" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Eyes (Downcast / Anxious dots or closed arcs) -->
    <circle cx="56" cy="117" r="1.5" fill="#1e293b" />
    <circle cx="68" cy="117" r="1.5" fill="#1e293b" />
    <!-- Worried Mouth (Small wavy/flat frown) -->
    <path d="M60 125 Q62 123 64 125" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Pink Anxious Cheeks (Faint) -->
    <circle cx="53" cy="121" r="2.5" fill="#f43f5e" opacity="0.3" />
    <circle cx="71" cy="121" r="2.5" fill="#f43f5e" opacity="0.3" />

    <!-- Arms holding Mug -->
    <!-- Left Arm -->
    <path d="M52 148 Q45 160 55 168" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <!-- Right Arm -->
    <path d="M70 152 Q72 163 64 168" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />

    <!-- Hot Drink Mug -->
    <rect x="55" y="160" width="14" height="16" rx="3" fill="#ffffff" />
    <path d="M69 164 Q74 164 74 168 Q74 172 69 172" fill="none" stroke="#ffffff" stroke-width="2" />
    <!-- Steam / Warmth -->
    <path d="M59 154 Q57 150 61 146" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M65 153 Q67 149 63 145" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>


  <!-- CHARACTER 2: REASSURING (Right, leaning in warmly, placing a comforting hand on shoulder) -->
  <g id="character-reassuring" filter="url(#softShadow)">
    <!-- Legs/Feet -->
    <rect x="122" y="190" width="16" height="25" rx="6" fill="#1e293b" />
    <ellipse cx="130" cy="215" rx="9" ry="4" fill="#0f172a" />

    <!-- Body / Torso (Leaning forward with empathy) -->
    <path d="M110 140 Q130 135 125 175 L100 185 Q90 160 110 140 Z" fill="url(#sweater2)" />

    <!-- Head (Tilted lovingly towards friend) -->
    <g transform="rotate(-8 115 110)">
      <!-- Head Circle -->
      <circle cx="115" cy="110" r="18" fill="#ffedd5" />
      <!-- Friendly Hair (Short stylish neat look) -->
      <path d="M98 108 Q97 90 115 92 Q133 90 132 108 Q125 98 115 98 Q105 98 98 108 Z" fill="#451a03" />
      <path d="M100 106 Q98 115 104 118 Q100 112 100 106 Z" fill="#451a03" />

      <!-- Reassuring Facial Expression -->
      <!-- Eyebrows (Relaxed, warm arch) -->
      <path d="M107 106 Q110 104 113 106" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />
      <path d="M119 106 Q122 104 125 106" fill="none" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" />
      <!-- Eyes (Happy warm closed smiling arcs ^ ^) -->
      <path d="M106 112 Q109 109 112 112" fill="none" stroke="#451a03" stroke-width="1.8" stroke-linecap="round" />
      <path d="M118 112 Q121 109 124 112" fill="none" stroke="#451a03" stroke-width="1.8" stroke-linecap="round" />
      <!-- Gentle Reassuring Smile -->
      <path d="M111 119 Q115 123 119 119" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round" />
      <!-- Warm Pink Cheeks -->
      <circle cx="106" cy="116" r="3" fill="#f43f5e" opacity="0.35" />
      <circle cx="124" cy="116" r="3" fill="#f43f5e" opacity="0.35" />
    </g>

    <!-- Arms & Comforting Gesture -->
    <!-- Reaching Arm placing hand on friend's shoulder -->
    <path d="M112 145 Q85 135 73 148" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" />
    <!-- Hand gently resting -->
    <circle cx="71" cy="149" r="4.5" fill="#ffedd5" />
    <!-- Other Arm Relaxed -->
    <path d="M125 152 Q135 168 125 180" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND ATMOSPHERIC SPARKLES / HEART-WARMING ELEMENT (Subtle, non-distracting) -->
  <g opacity="0.8">
    <path d="M95 95 Q97 91 101 93 Q97 97 95 95 Z" fill="#fbbf24" />
    <path d="M135 80 Q136 77 140 79 Q136 82 135 80 Z" fill="#f43f5e" />
    <circle cx="85" cy="85" r="1.5" fill="#fbbf24" opacity="0.6" />
    <circle cx="125" cy="70" r="1" fill="#ffffff" opacity="0.7" />
  </g>
</svg>