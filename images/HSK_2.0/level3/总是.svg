<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with dark-mode slate tones -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Subtle background glow for atmosphere -->
  <circle cx="120" cy="110" r="90" fill="#1e293b" opacity="0.6"/>
  
  <!-- Desk/Workspace Surface -->
  <path d="M 20 185 L 220 185 L 230 215 L 10 215 Z" fill="#334155" opacity="0.5"/>
  <rect x="20" y="180" width="200" height="6" rx="3" fill="#475569"/>

  <!-- Multi-tasking Desk Environment (representing "always busy") -->
  <!-- Coffee Cup (fueled up for endless work) -->
  <path d="M 35 155 L 45 155 L 43 178 L 37 178 Z" fill="#e2e8f0"/>
  <path d="M 43 162 C 48 162 48 172 43 172" stroke="#e2e8f0" stroke-width="2.5" fill="none"/>
  <!-- Steam from coffee -->
  <path d="M 38 145 C 36 140 42 135 40 128" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 42 147 C 44 142 38 137 40 130" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Open Laptop (Active) -->
  <path d="M 65 140 L 125 140 L 135 175 L 55 175 Z" fill="#64748b"/>
  <path d="M 68 143 L 122 143 L 130 171 L 60 171 Z" fill="#0f172a"/>
  <!-- Screen Activity (Code/Charts/Data) -->
  <rect x="75" y="148" width="25" height="4" rx="1" fill="#38bdf8"/>
  <rect x="75" y="156" width="35" height="4" rx="1" fill="#34d399"/>
  <rect x="75" y="164" width="18" height="4" rx="1" fill="#f43f5e"/>
  <!-- Laptop Base -->
  <path d="M 45 175 L 145 175 L 150 180 L 40 180 Z" fill="#94a3b8"/>

  <!-- Secondary Screen / Tablet showing continuous notifications -->
  <rect x="145" y="125" width="55" height="50" rx="4" transform="rotate(10 145 125)" fill="#334155"/>
  <rect x="150" y="130" width="45" height="40" rx="2" transform="rotate(10 145 125)" fill="#1e293b"/>
  <!-- Notification badges -->
  <circle cx="165" cy="142" r="5" fill="#f59e0b"/>
  <circle cx="180" cy="155" r="5" fill="#ec4899"/>
  
  <!-- Clock on the wall indicating constant passing time (Always) -->
  <circle cx="120" cy="65" r="28" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <!-- Clock ticks -->
  <line x1="120" y1="40" x2="120" y2="44" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="86" x2="120" y2="90" stroke="#94a3b8" stroke-width="2"/>
  <line x1="95" y1="65" x2="99" y2="65" stroke="#94a3b8" stroke-width="2"/>
  <line x1="141" y1="65" x2="145" y2="65" stroke="#94a3b8" stroke-width="2"/>
  <!-- Clock Hands (Spinning/Action) -->
  <line x1="120" y1="65" x2="120" y2="50" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="65" x2="135" y2="60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="65" r="3" fill="#fbbf24"/>

  <!-- Floating action/busy indicators (Repeated activity loops) -->
  <!-- Gear 1 (Working mechanism) -->
  <path d="M 185 75 L 189 73 L 192 76 L 191 81 L 196 84 L 195 89 L 190 90 L 188 95 L 183 94 L 181 99 L 176 97 L 175 92 L 170 91 L 171 86 L 176 83 L 175 78 L 180 77 Z" fill="#fbbf24" opacity="0.9"/>
  <circle cx="185" cy="85" r="4" fill="#1e293b"/>

  <!-- Gear 2 (Smaller, interlocking) -->
  <path d="M 160 95 L 163 93 L 165 96 L 164 100 L 168 102 L 167 106 L 163 107 L 161 111 L 157 110 L 155 114 L 151 112 L 151 108 L 147 107 L 148 103 L 152 101 L 152 97 L 156 96 Z" fill="#38bdf8" opacity="0.9"/>
  <circle cx="157" cy="104" r="3" fill="#1e293b"/>

  <!-- Motion lines indicating continuous, nonstop action -->
  <path d="M 15 115 C 25 110 25 125 35 120" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 10 130 C 20 125 20 140 30 135" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <path d="M 220 95 C 210 90 210 105 200 100" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 225 110 C 215 105 215 120 205 115" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Energy sparks / Endless cycle elements -->
  <path d="M 70 95 L 75 105 L 85 107 L 75 109 L 70 119 L 65 109 L 55 107 L 65 105 Z" fill="#fbbf24"/>
  <path d="M 105 115 L 108 120 L 115 122 L 108 124 L 105 130 L 102 124 L 95 122 L 102 120 Z" fill="#34d399"/>

  <!-- Central character silhouette or focused presence representing "He is always busy" -->
  <!-- Head & Shoulders hunched over work, showing dedication/constant state -->
  <path d="M 95 180 C 95 155 115 140 135 140 C 155 140 175 155 175 180 Z" fill="#475569"/>
  <!-- Head -->
  <circle cx="135" cy="122" r="16" fill="#cbd5e1"/>
  <!-- Hair -->
  <path d="M 121 120 C 121 110 135 105 145 112 C 150 115 149 124 149 124 C 149 124 135 118 125 122 Z" fill="#334155"/>
  <!-- Concentrated brow/face profile hint -->
  <path d="M 145 122 C 147 124 147 127 145 128" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

</svg>