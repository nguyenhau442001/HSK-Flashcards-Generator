<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  <defs>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Stadium Track with Perspective -->
  <path d="M20 240 L60 80 L180 80 L220 240 Z" fill="url(#trackGrad)"/>
  <path d="M60 80 L180 80 L185 85 L55 85 Z" fill="#475569"/>
  
  <!-- Lane Lines -->
  <line x1="90" y1="80" x2="60" y2="240" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>
  <line x1="120" y1="80" x2="120" y2="240" stroke="#94a3b8" stroke-width="3"/>
  <line x1="150" y1="80" x2="180" y2="240" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Stadium Lights Glow -->
  <circle cx="40" cy="40" r="60" fill="url(#glow)"/>
  <circle cx="200" cy="40" r="60" fill="url(#glow)"/>

  <!-- The Winner (Representing the standard) -->
  <g transform="translate(130, 95)">
    <!-- Motion Lines -->
    <path d="M-10 5 Q-20 5 -25 10" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M-12 15 Q-22 15 -27 20" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4"/>
    <!-- Body -->
    <path d="M5 25 L12 10 L18 25 L15 40 L8 40 Z" fill="#38bdf8"/>
    <circle cx="15" cy="5" r="4" fill="#fcd34d"/>
    <!-- Arms in victory -->
    <path d="M5 15 L-2 5 M18 15 L25 5" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs running fast -->
    <path d="M10 40 L5 55 M15 40 L22 52" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Finish Line Ribbon (Broken) -->
  <path d="M100 115 Q120 110 135 115 M155 115 Q170 120 190 115" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- The "Chà" Subject (The one who is lagging/worse) -->
  <g transform="translate(70, 160)">
    <!-- Exhaustion/Sweat drops -->
    <circle cx="25" cy="5" r="1.5" fill="#38bdf8" opacity="0.8">
      <animate attributeName="cy" values="5;15" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <!-- Body - Hunched over -->
    <path d="M10 30 Q15 10 25 15 L30 35 L20 45 L10 45 Z" fill="#fb923c"/>
    <circle cx="28" cy="12" r="5" fill="#ffedd5"/>
    <!-- Arms - Struggling -->
    <path d="M18 20 L5 25 M25 22 L35 30" stroke="#ffedd5" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs - Heavy/Slow -->
    <path d="M15 45 L10 65 M25 45 L30 60" stroke="#ffedd5" stroke-width="3" stroke-linecap="round"/>
    <!-- Shadow -->
    <ellipse cx="20" cy="70" rx="15" ry="4" fill="#000" opacity="0.3"/>
  </g>

  <!-- Foreground Depth Elements -->
  <rect x="0" y="220" width="240" height="20" fill="#0f172a" opacity="0.5"/>
  
  <!-- Visualizing the "Gap" (The 'Chà' or 'Thiếu') -->
  <path d="M110 130 L110 170" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <path d="M110 150 L90 150" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  <path d="M110 150 L130 150" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
</svg>