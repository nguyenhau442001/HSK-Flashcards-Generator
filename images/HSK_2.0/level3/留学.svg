<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window View / US Vibe Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Warm Indoor Light -->
    <linearGradient id="indoorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Luggage Gradient -->
    <linearGradient id="luggageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- BACKGROUND ARCHITECTURE & ROOM INTERIOR -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4"/>
  <!-- Floor -->
  <path d="M 20 170 L 220 170 L 230 220 L 10 220 Z" fill="#0f172a"/>
  <!-- Floor Planks -->
  <line x1="60" y1="170" x2="30" y2="220" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
  <line x1="120" y1="170" x2="110" y2="220" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>
  <line x1="180" y1="170" x2="190" y2="220" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>

  <!-- BIG AIRPORT / APARTMENT WINDOW (Showing US Landmark Context like Statue of Liberty silhouette & Skyline) -->
  <g transform="translate(130, 35)">
    <!-- Window Frame Outer -->
    <rect x="0" y="0" width="75" height="115" rx="6" fill="#334155" filter="url(#shadow)"/>
    <!-- Window Glass -->
    <rect x="4" y="4" width="67" height="107" rx="4" fill="url(#skyGrad)"/>
    
    <!-- Sunset / City Skyline Silhouette inside window -->
    <path d="M 4 80 L 12 80 L 12 111 L 4 111 Z" fill="#1e293b" opacity="0.6"/>
    <path d="M 15 65 L 28 65 L 28 111 L 15 111 Z" fill="#1e293b" opacity="0.7"/>
    <path d="M 30 50 L 45 50 L 45 111 L 30 111 Z" fill="#1e293b" opacity="0.8"/>
    <!-- Statue of Liberty Silhouette Mini -->
    <path d="M 55 90 L 57 75 L 59 73 L 60 75 L 62 90 Z" fill="#1e293b" opacity="0.9"/>
    <circle cx="59.5" cy="71" r="2" fill="#1e293b" opacity="0.9"/>

    <!-- Window Grid crossbars -->
    <line x1="37.5" y1="4" x2="37.5" y2="111" stroke="#334155" stroke-width="3"/>
    <line x1="4" y1="57" x2="71" y2="57" stroke="#334155" stroke-width="3"/>
  </g>

  <!-- WARM INDOOR LIGHT OVERLAY -->
  <rect x="20" y="20" width="200" height="150" fill="url(#indoorGlow)" pointer-events="none"/>

  <!-- PROPS: STUDY & TRAVEL (Bookshelf, Desk, Globe, Luggage) -->
  <!-- Bookshelf in background -->
  <g transform="translate(30, 45)" opacity="0.85">
    <rect x="0" y="0" width="40" height="85" fill="#334155" rx="2"/>
    <rect x="4" y="25" width="32" height="4" fill="#475569"/>
    <rect x="4" y="55" width="32" height="4" fill="#475569"/>
    <!-- Colorful Books -->
    <rect x="6" y="10" width="6" height="15" fill="#f59e0b" rx="1"/>
    <rect x="13" y="12" width="5" height="13" fill="#10b981" rx="1"/>
    <rect x="20" y="8" width="8" height="17" fill="#3b82f6" rx="1"/>
    <!-- Globe on shelf -->
    <circle cx="20" cy="40" r="8" fill="#38bdf8"/>
    <path d="M 14 38 Q 20 34 26 40" stroke="#10b981" stroke-width="2" fill="none"/>
    <path d="M 17 44 Q 22 46 24 41" stroke="#10b981" stroke-width="2" fill="none"/>
    <path d="M 20 31 L 20 49" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Study Desk with Laptop & Passport/Plane Ticket -->
  <g transform="translate(25, 115)">
    <!-- Desk Surface -->
    <rect x="0" y="0" width="95" height="10" fill="#475569" rx="2" filter="url(#shadow)"/>
    <rect x="5" y="10" width="8" height="45" fill="#334155"/>
    <rect x="82" y="10" width="8" height="45" fill="#334155"/>

    <!-- Open Laptop -->
    <path d="M 20 0 L 40 0 L 38 -15 L 22 -15 Z" fill="#94a3b8"/>
    <rect x="23" y="-14" width="14" height="12" fill="#38bdf8" rx="1"/>
    <path d="M 15 2 L 45 2 L 48 5 L 12 5 Z" fill="#cbd5e1" rx="1"/>

    <!-- Passport & Acceptance Letter Prop -->
    <rect x="55" y="-3" width="16" height="12" fill="#dc2626" rx="1" transform="rotate(-10 55 -3)" filter="url(#shadow)"/>
    <rect x="58" y="-1" width="10" height="2" fill="#fbbf24" rx="0.5" transform="rotate(-10 58 -1)"/>
    
    <!-- Coffee Mug -->
    <rect x="75" y="-10" width="9" height="12" fill="#f8fafc" rx="2"/>
    <path d="M 84 -7 C 88 -7 88 -2 84 -2" stroke="#f8fafc" stroke-width="2" fill="none"/>
  </g>

  <!-- LUGGAGE (Ready for studying abroad) -->
  <g transform="translate(110, 130)" filter="url(#shadow)">
    <!-- Main Suitcase -->
    <rect x="0" y="10" width="32" height="45" rx="6" fill="url(#luggageGrad)"/>
    <!-- Suitcase details (ribs) -->
    <line x1="0" y1="22" x2="32" y2="22" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="36" x2="32" y2="36" stroke="#0284c7" stroke-width="2"/>
    <!-- Handle -->
    <path d="M 10 10 L 10 4 L 22 4 L 22 10" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="8" cy="55" r="3" fill="#0f172a"/>
    <circle cx="24" cy="55" r="3" fill="#0f172a"/>
  </g>


  <!-- MAIN CHARACTER: FEMALE STUDENT DEPARTING FOR STUDY ABROAD -->
  <g transform="translate(135, 80)">
    <!-- Shadow beneath character -->
    <ellipse cx="25" cy="98" rx="22" ry="6" fill="#020617" opacity="0.4"/>

    <!-- Legs & Boots -->
    <g>
      <!-- Left Leg -->
      <line x1="16" y1="55" x2="14" y2="85" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="13" cy="87" rx="5" ry="3" fill="#0f172a"/>
      <!-- Right Leg (stepping forward) -->
      <line x1="28" y1="55" x2="35" y2="85" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="37" cy="87" rx="5" ry="3" fill="#0f172a"/>
    </g>

    <!-- Torso / Stylish Jacket -->
    <g>
      <path d="M 12 25 L 38 25 L 42 58 L 8 58 Z" fill="url(#jacketGrad)" rx="4" filter="url(#shadow)"/>
      <!-- Scarf (warm travel vibe) -->
      <path d="M 18 20 Q 25 28 32 20 Q 38 35 35 42 L 28 40 Q 28 32 24 25 Z" fill="#fb923c"/>
      <path d="M 32 35 L 38 52 L 32 54 L 28 40 Z" fill="#f97316"/>
    </g>

    <!-- Backpack Straps & Backpack visible behind/over shoulder -->
    <path d="M 16 26 L 10 40" stroke="#0369a1" stroke-width="4" stroke-linecap="round"/>
    <path d="M 32 26 L 38 40" stroke="#0369a1" stroke-width="4" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <g transform="translate(25, 12)">
      <!-- Hair back -->
      <circle cx="0" cy="0" r="14" fill="#0f172a"/>
      <path d="M -12 2 Q -15 15 -8 20 L -3 10 Z" fill="#0f172a"/>
      
      <!-- Face Base -->
      <circle cx="0" cy="0" r="12" fill="#fbcfe8"/>
      
      <!-- Happy, Expressive Face -->
      <!-- Eyes (bright, looking forward excitedly) -->
      <circle cx="-4" cy="-1" r="1.5" fill="#0f172a"/>
      <circle cx="4" cy="-1" r="1.5" fill="#0f172a"/>
      <!-- Gentle Smile -->
      <path d="M -3 4 Q 0 7 3 4" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Rosy Cheeks -->
      <circle cx="-6" cy="2" r="2" fill="#fda4af" opacity="0.6"/>
      <circle cx="6" cy="2" r="2" fill="#fda4af" opacity="0.6"/>

      <!-- Hair front / bangs -->
      <path d="M -12 -4 Q -2 -10 10 -4 Q 8 -12 -2 -12 Q -10 -12 -12 -4 Z" fill="#0f172a"/>
      <!-- Ponytail bouncing behind -->
      <path d="M 10 -2 Q 22 -5 18 5 Q 15 2 10 2 Z" fill="#0f172a"/>
    </g>

    <!-- Arms & Interaction -->
    <!-- Left Arm holding luggage handle -->
    <path d="M 12 30 Q 0 45 -5 55" stroke="#ec4899" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Right Arm waving happily -->
    <path d="M 38 30 Q 50 22 45 10" stroke="#ec4899" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="45" cy="8" r="3.5" fill="#fbcfe8"/>
  </g>

  <!-- AIRPLANE VIBE / FLIGHT PATH ACCENT -->
  <g transform="translate(40, 45)" opacity="0.7">
    <!-- Dashed flight arc -->
    <path d="M 0 40 Q 40 10 90 25" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <!-- Mini Airplane Icon -->
    <path d="M 90 25 L 82 22 L 80 24 L 85 27 L 80 30 L 78 29 L 75 31 L 78 33 L 90 25 Z" fill="#38bdf8"/>
  </g>

  <!-- Potted Plant for interior warmth -->
  <g transform="translate(195, 145)">
    <path d="M 0 15 L 6 25 L 18 25 L 24 15 Z" fill="#cbd5e1"/>
    <path d="M 12 15 Q 12 0 20 -5" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 12 15 Q 5 5 0 -2" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 12 15 Q 15 -8 8 -15" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>