<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wood-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="wood-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting -->
  <circle cx="120" cy="0" r="140" fill="url(#lamp-glow)" />

  <!-- Room Interior / Walls & Floor -->
  <path d="M 20,40 L 120,20 L 220,40 L 220,150 L 120,170 L 20,150 Z" fill="#334155" opacity="0.4" />
  <!-- Floor Plane -->
  <path d="M 20,150 L 120,170 L 220,150 L 220,210 L 120,225 L 20,210 Z" fill="#0f172a" />
  <!-- Back Wall -->
  <rect x="30" y="45" width="180" height="105" fill="#1e293b" rx="4" />

  <!-- Window in Background (Left) -->
  <rect x="45" y="60" width="35" height="55" rx="4" fill="#38bdf8" opacity="0.15" />
  <path d="M 62,60 L 62,115 M 45,87 L 80,87" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- Bookshelf Background (Right) -->
  <rect x="155" y="55" width="40" height="75" rx="2" fill="#0f172a" opacity="0.6" />
  <line x1="155" y1="80" x2="195" y2="80" stroke="#334155" stroke-width="2" />
  <line x1="155" y1="105" x2="195" y2="105" stroke="#334155" stroke-width="2" />
  <!-- Tiny Books -->
  <rect x="162" y="68" width="6" height="12" fill="#ec4899" rx="1" />
  <rect x="170" y="66" width="5" height="14" fill="#38bdf8" rx="1" />
  <rect x="182" y="70" width="8" height="10" fill="#10b981" rx="1" />
  <rect x="160" y="90" width="14" height="15" fill="#f59e0b" rx="1" />

  <!-- Potted Plant on Left Context -->
  <ellipse cx="45" cy="148" rx="12" ry="5" fill="#0f172a" />
  <path d="M 37,135 Q 35,148 45,148 Q 55,148 53,135 Z" fill="#f8fafc" />
  <path d="M 45,135 Q 30,120 28,105 Q 45,115 45,135 Z" fill="#10b981" />
  <path d="M 45,135 Q 60,115 65,100 Q 50,120 45,135 Z" fill="#34d399" />
  <path d="M 45,135 Q 45,110 43,95 Q 47,110 45,135 Z" fill="#059669" />

  <!-- Floor Rug -->
  <ellipse cx="120" cy="190" rx="75" ry="20" fill="#334155" opacity="0.6" />
  <ellipse cx="120" cy="190" rx="65" ry="16" fill="#1e293b" />
  <!-- Rug Pattern stripes -->
  <path d="M 70,185 Q 120,175 170,185" stroke="#fb923c" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="6,4" />

  <!-- CENTRAL SUBJECT: THE TABLE AND CENTERED OBJECT -->
  <!-- Table Drop Shadow -->
  <ellipse cx="120" cy="178" rx="55" ry="12" fill="#000000" opacity="0.5" />

  <!-- Table Legs -->
  <!-- Back Left Leg -->
  <path d="M 80,145 L 75,178" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
  <!-- Back Right Leg -->
  <path d="M 160,145 L 165,178" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
  <!-- Front Left Leg -->
  <path d="M 70,155 L 62,185" stroke="#b45309" stroke-width="6" stroke-linecap="round" />
  <!-- Front Right Leg -->
  <path d="M 170,155 L 178,185" stroke="#b45309" stroke-width="6" stroke-linecap="round" />

  <!-- Table Under-Rim -->
  <path d="M 65,142 C 65,142 120,152 175,142 L 175,152 C 175,152 120,162 65,152 Z" fill="url(#wood-side)" />

  <!-- Table Top (Ellipse for perspective) -->
  <ellipse cx="120" cy="142" rx="58" ry="16" fill="url(#wood-top)" filter="url(#shadow)" />
  <ellipse cx="120" cy="140" rx="54" ry="13" fill="#fbbf24" opacity="0.2" />

  <!-- CONTEXTUAL PROPS ON THE SIDES OF THE TABLE -->
  <!-- Left Prop: Stack of Books -->
  <rect x="85" y="128" width="18" height="6" rx="1" fill="#ec4899" />
  <rect x="83" y="132" width="20" height="5" rx="1" fill="#38bdf8" />
  <rect x="86" y="135" width="16" height="5" rx="1" fill="#10b981" />

  <!-- Right Prop: Mug / Cup -->
  <rect x="138" y="123" width="10" height="12" rx="2" fill="#f8fafc" />
  <path d="M 148,126 C 153,126 153,132 148,133" stroke="#f8fafc" stroke-width="2" fill="none" />
  <!-- Steam from mug -->
  <path d="M 141,119 Q 143,115 141,111" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- ===================================================== -->
  <!-- MAIN FOCUS: THE OBJECT EXACTLY "ZHONGJIAN" (IN THE MIDDLE) -->
  <!-- ===================================================== -->
  <!-- Glowing aura highlighting the center position -->
  <ellipse cx="120" cy="130" rx="22" ry="12" fill="#38bdf8" opacity="0.3" filter="url(#glow)" />

  <!-- Central Object: A Glowing Magical Compass / Globe Toy -->
  <!-- Stand base -->
  <ellipse cx="120" cy="138" rx="10" ry="4" fill="#b45309" />
  <rect x="118" y="132" width="4" height="7" fill="#d97706" />
  
  <!-- Globe / Sphere Outer Ring -->
  <circle cx="120" cy="120" r="15" fill="#0284c7" filter="url(#shadow)" />
  <circle cx="120" cy="120" r="15" fill="none" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Golden Meridian Ring -->
  <ellipse cx="120" cy="120" rx="6" ry="15" fill="none" stroke="#fbbf24" stroke-width="2.5" />
  
  <!-- Inner glowing sphere details -->
  <circle cx="120" cy="120" r="14" fill="url(#wood-top)" opacity="0.3" />
  <path d="M 110,115 Q 120,110 130,118 Q 125,128 115,125 Z" fill="#10b981" opacity="0.8" />
  <circle cx="120" cy="120" r="3" fill="#ffffff" />

  <!-- Sparkles / Attention Indicators above the center object -->
  <g fill="#fbbf24">
    <path d="M 120,95 L 122,102 L 129,104 L 122,106 L 120,113 L 118,106 L 111,104 L 118,102 Z" />
    <circle cx="103" cy="107" r="2" opacity="0.8" />
    <circle cx="137" cy="107" r="2" opacity="0.8" />
  </g>

  <!-- Foreground / Atmospheric Elements -->
  <!-- Hanging Pendant Light (Top Right corner hint) -->
  <path d="M 200,0 L 200,30" stroke="#475569" stroke-width="2" />
  <path d="M 185,30 L 215,30 L 220,40 L 180,40 Z" fill="#334155" />
  <path d="M 185,40 Q 200,50 215,40 Z" fill="#fbbf24" opacity="0.8" filter="url(#glow)" />

</svg>