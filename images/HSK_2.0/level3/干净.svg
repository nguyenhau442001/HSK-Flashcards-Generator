<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm sunlight gradient from window -->
    <linearGradient id="sunlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Floor gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ROOM INTERIOR: "房间很干净" (The room is very clean) -->
  
  <!-- Back Wall -->
  <rect x="20" y="25" width="200" height="155" fill="#2d3748" rx="4" />
  
  <!-- Wooden Floor -->
  <path d="M 20 180 L 220 180 L 235 220 L 5 220 Z" fill="url(#floor-grad)" />
  <!-- Floor Planks perspective lines -->
  <line x1="20" y1="195" x2="220" y2="195" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <line x1="12" y1="210" x2="228" y2="210" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>

  <!-- Window with Glowing Sunlight Effect -->
  <rect x="35" y="45" width="55" height="85" fill="#38bdf8" opacity="0.2" rx="2" />
  <!-- Window Frame -->
  <rect x="35" y="45" width="55" height="85" fill="none" stroke="#64748b" stroke-width="3" rx="2" />
  <line x1="62.5" y1="45" x2="62.5" y2="130" stroke="#64748b" stroke-width="2" />
  <line x1="35" y1="87.5" x2="90" y2="87.5" stroke="#64748b" stroke-width="2" />
  <!-- Sunlight Beam projecting onto room -->
  <polygon points="35,45 90,45 130,180 20,180" fill="url(#sunlight)" />

  <!-- Wall Shelf -->
  <rect x="135" y="70" width="70" height="6" fill="#64748b" rx="1" />
  <!-- Neat books on shelf -->
  <rect x="145" y="48" width="10" height="22" fill="#ec4899" rx="1" />
  <rect x="157" y="44" width="8" height="26" fill="#38bdf8" rx="1" />
  <rect x="167" y="50" width="12" height="20" fill="#10b981" rx="1" />
  <!-- Small potted plant on shelf (clean & fresh) -->
  <path d="M 188 70 L 196 70 L 194 58 L 190 58 Z" fill="#f8fafc" />
  <circle cx="192" cy="55" r="7" fill="#10b981" />
  <circle cx="189" cy="53" r="5" fill="#34d399" />

  <!-- Bed / Sofa with neatly arranged pillows (showing tidiness/cleanliness) -->
  <rect x="120" y="140" width="90" height="40" fill="#475569" rx="6" />
  <!-- Mattress edge -->
  <rect x="120" y="135" width="90" height="8" fill="#cbd5e1" rx="3" />
  <!-- Fluffy neat pillows -->
  <rect x="128" y="118" width="25" height="18" fill="#f8fafc" rx="6" />
  <rect x="158" y="118" width="25" height="18" fill="#f8fafc" rx="6" />
  <!-- Blanket folded neatly -->
  <path d="M 170 135 L 210 135 L 210 175 L 170 175 Z" fill="#38bdf8" opacity="0.8" rx="2" />

  <!-- CHARACTER: Happy, satisfied person admiring the clean room -->
  <g transform="translate(75, 95)">
    <!-- Body / Torso -->
    <path d="M 18 45 C 18 35, 32 35, 32 45 L 35 85 L 15 85 Z" fill="#fb923c" />
    <!-- Arms stretched happily in satisfaction -->
    <path d="M 18 48 C 5 45, -5 30, -10 25" fill="none" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" />
    <path d="M 32 48 C 45 45, 50 30, 55 25" fill="none" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" />
    
    <!-- Head -->
    <circle cx="25" cy="22" r="14" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M 11 20 C 11 10, 25 8, 39 15 C 39 15, 37 25, 35 25 C 33 25, 30 15, 25 15 C 20 15, 15 20, 11 20 Z" fill="#334155" />
    <!-- Face expression: Big happy smile & closed happy eyes -->
    <path d="M 19 21 Q 22 24 25 21" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 27 21 Q 30 24 33 21" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 23 27 Q 26 31 29 27" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />

    <!-- Legs -->
    <rect x="18" y="85" width="5" height="25" fill="#1e293b" />
    <rect x="27" y="85" width="5" height="25" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="20.5" cy="111" rx="5" ry="2.5" fill="#f8fafc" />
    <ellipse cx="29.5" cy="111" rx="5" ry="2.5" fill="#f8fafc" />
  </g>

  <!-- Sparkling / Cleanliness effect icons (subtle glowing stars denoting spotless clean environment) -->
  <g fill="#fef08a">
    <!-- Sparkle 1 near shelf -->
    <path d="M 130 50 Q 130 40 120 40 Q 130 40 130 30 Q 130 40 140 40 Q 130 40 130 50 Z" />
    <!-- Sparkle 2 near floor -->
    <path d="M 60 160 Q 60 153 53 153 Q 60 153 60 146 Q 60 153 67 153 Q 60 153 60 160 Z" transform="scale(0.8) translate(30, 20)" />
    <!-- Sparkle 3 near window -->
    <path d="M 100 80 Q 100 74 94 74 Q 100 74 100 68 Q 100 74 106 74 Q 100 74 100 80 Z" transform="scale(0.6) translate(60, 20)" />
  </g>

  <!-- Potted Plant on Floor (Adds to the neat/clean home feel) -->
  <g transform="translate(25, 150)">
    <path d="M 5 20 L 15 20 L 18 35 L 2 35 Z" fill="#cbd5e1" rx="2" />
    <ellipse cx="10" cy="20" rx="5" ry="2" fill="#94a3b8" />
    <!-- Plant stems & leaves -->
    <path d="M 10 20 C 10 10, 5 5, 2 0" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <path d="M 10 20 C 12 10, 18 5, 22 2" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <path d="M 10 20 C 10 8, 10 2, 10 -5" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  </g>

</svg>