<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm Night Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Fever Thermometer Glow/Red Glow -->
    <radialGradient id="feverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Blanket Gradient -->
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Pillow Gradient -->
    <linearGradient id="pillowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment & Props -->
  <!-- Wallpaper subtle stars/dots pattern -->
  <g fill="#334155" opacity="0.4">
    <circle cx="30" cy="40" r="1.5" />
    <circle cx="70" cy="25" r="1" />
    <circle cx="110" cy="50" r="2" />
    <circle cx="190" cy="35" r="1.5" />
    <circle cx="215" cy="70" r="1" />
  </g>

  <!-- Nightstand -->
  <rect x="155" y="130" width="60" height="70" rx="4" fill="#334155" />
  <rect x="160" y="140" width="50" height="22" rx="2" fill="#1e293b" />
  <circle cx="185" cy="151" r="3" fill="#64748b" />
  <rect x="160" y="170" width="50" height="22" rx="2" fill="#1e293b" />
  <circle cx="185" cy="181" r="3" fill="#64748b" />

  <!-- Lamp on Nightstand -->
  <path d="M175,130 L195,130 L190,110 L180,110 Z" fill="#64748b" />
  <path d="M165,110 L205,110 L195,85 L175,85 Z" fill="#fb923c" />
  <!-- Lamp Light Effect -->
  <circle cx="185" cy="100" r="45" fill="url(#lampGlow)" />
  <path d="M182,130 L188,130 L190,200 L180,200 Z" fill="#475569" />

  <!-- Medicine bottle & cup on nightstand -->
  <rect x="138" y="165" width="14" height="25" rx="3" fill="#cbd5e1" />
  <rect x="140" y="162" width="10" height="4" rx="1" fill="#ef4444" />
  <rect x="122" y="175" width="12" height="15" rx="2" fill="#f8fafc" opacity="0.9" />
  <path d="M128,170 C125,170 125,175 128,175" stroke="#cbd5e1" stroke-width="2" fill="none" />

  <!-- Bed Structure -->
  <!-- Headboard -->
  <rect x="20" y="70" width="115" height="135" rx="8" fill="#475569" />
  <rect x="28" y="78" width="99" height="119" rx="4" fill="#334155" />

  <!-- Bed Frame & Mattress -->
  <rect x="25" y="125" width="145" height="75" rx="8" fill="#cbd5e1" />
  <rect x="25" y="130" width="145" height="70" rx="6" fill="#f1f5f9" />

  <!-- Pillow -->
  <path d="M35,135 Q70,132 105,135 L108,165 Q70,168 32,165 Z" fill="url(#pillowGrad)" />

  <!-- Sick Child (Em bé) Character -->
  <g id="sick-child">
    <!-- Body under blanket -->
    <path d="M45,155 Q90,140 145,155 L150,200 L45,200 Z" fill="url(#blanketGrad)" />
    <!-- Blanket fold edge -->
    <path d="M45,155 Q90,140 145,155 L145,163 Q90,148 45,163 Z" fill="#0284c7" />

    <!-- Cute stuffed toy peeking from blanket -->
    <circle cx="58" cy="180" r="10" fill="#d97706" />
    <circle cx="52" cy="173" r="5" fill="#d97706" />
    <circle cx="64" cy="173" r="5" fill="#d97706" />
    <circle cx="56" cy="179" r="1" fill="#1e293b" />
    <circle cx="60" cy="179" r="1" fill="#1e293b" />
    <ellipse cx="58" cy="182" rx="1.5" ry="1" fill="#1e293b" />

    <!-- Head & Face -->
    <!-- Head circle -->
    <circle cx="95" cy="120" r="22" fill="#ffedd5" />
    
    <!-- Fever red cheeks and glow -->
    <circle cx="95" cy="120" r="30" fill="url(#feverGlow)" />
    <circle cx="82" cy="125" r="6" fill="#fca5a5" opacity="0.7" />
    <circle cx="108" cy="125" r="6" fill="#fca5a5" opacity="0.7" />

    <!-- Hair (Messy, cute tufts) -->
    <path d="M75,115 C75,100 90,100 95,98 C100,100 115,100 115,115 C112,112 105,105 95,108 C85,105 78,112 75,115 Z" fill="#78350f" />
    <circle cx="95" cy="98" r="3" fill="#78350f" />

    <!-- Closed tired eyes (arcs) -->
    <path d="M83,118 Q87,114 91,118" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M99,118 Q103,114 107,118" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Sad/Feverish Mouth -->
    <path d="M93,130 Q95,127 97,130" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Sweat Drop (Classic fever sign) -->
    <path d="M112,110 C112,110 116,115 116,118 C116,120 114,121 112,121 C110,121 108,120 108,118 C108,115 112,110 112,110 Z" fill="#38bdf8" />
  </g>

  <!-- Mother/Parent Character caring for the child -->
  <g id="caring-parent">
    <!-- Parent Arm reaching out -->
    <path d="M170,110 C150,110 130,115 110,118 L110,128 C130,125 150,120 170,120 Z" fill="#f43f5e" />
    
    <!-- Parent Hand / Palm touching child's forehead -->
    <circle cx="107" cy="116" r="8" fill="#fbcfe8" />
    <path d="M103,113 C105,110 109,110 111,113 Z" fill="#f43f5e" />

    <!-- Parent Body (Sitting beside bed) -->
    <path d="M150,130 L190,130 L200,210 L150,210 Z" fill="#f43f5e" />
    <!-- Parent Shoulder/Head hint -->
    <circle cx="175" cy="95" r="18" fill="#fbcfe8" />
    <path d="M165,85 C170,75 185,75 190,85 C185,90 165,90 165,85 Z" fill="#451a03" />
    <!-- Concerned expression on parent face profile -->
    <circle cx="182" cy="95" r="1.5" fill="#451a03" />
    <path d="M178,101 Q181,99 184,101" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Medical Thermometer (Visual metaphor floating/placed gently) -->
  <g transform="translate(118, 85) rotate(-25)">
    <!-- Thermometer Body -->
    <rect x="0" y="0" width="6" height="35" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <!-- Mercury bulb -->
    <circle cx="3" cy="32" r="4" fill="#ef4444" />
    <!-- Mercury level (high = fever!) -->
    <rect x="2" y="8" width="2" height="24" rx="1" fill="#ef4444" />
    <!-- Temp scale ticks -->
    <line x1="4" y1="12" x2="6" y2="12" stroke="#94a3b8" stroke-width="1" />
    <line x1="4" y1="16" x2="6" y2="16" stroke="#94a3b8" stroke-width="1" />
    <line x1="4" y1="20" x2="6" y2="20" stroke="#94a3b8" stroke-width="1" />
    <line x1="4" y1="24" x2="6" y2="24" stroke="#ef4444" stroke-width="1" />
  </g>

  <!-- Floating Ambient Warmth / Fever Indicator Particles -->
  <g fill="#ef4444" opacity="0.6">
    <circle cx="95" cy="85" r="2.5" />
    <circle cx="108" cy="92" r="1.5" />
    <circle cx="85" cy="90" r="2" />
  </g>
</svg>