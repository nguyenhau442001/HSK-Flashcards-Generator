<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Amber Light Gradient -->
    <radialGradient id="lampGlow" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Coffee Steam Gradient -->
    <linearGradient id="steamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting from Desk Lamp -->
  <circle cx="180" cy="40" r="140" fill="url(#lampGlow)" />

  <!-- Room Interior & Background Props -->
  <!-- Bookshelf Background -->
  <rect x="25" y="45" width="60" height="90" rx="4" fill="#1e293b" opacity="0.6" />
  <!-- Books on Shelf -->
  <rect x="30" y="70" width="10" height="60" rx="2" fill="#3b82f6" />
  <rect x="42" y="65" width="12" height="65" rx="2" fill="#10b981" />
  <rect x="56" y="80" width="8" height="50" rx="2" fill="#f43f5e" />
  <rect x="66" y="60" width="14" height="70" rx="2" fill="#f59e0b" />
  <!-- Shelf Board -->
  <rect x="20" y="130" width="70" height="6" rx="2" fill="#475569" />

  <!-- Window Frame showing night city / stars -->
  <rect x="150" y="30" width="60" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <!-- Window Panes -->
  <line x1="180" y1="30" x2="180" y2="100" stroke="#475569" stroke-width="2" />
  <line x1="150" y1="65" x2="210" y2="65" stroke="#475569" stroke-width="2" />
  <!-- Tiny distant city lights / stars outside window -->
  <circle cx="162" cy="45" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="195" cy="50" r="1" fill="#38bdf8" opacity="0.8" />
  <circle cx="168" cy="85" r="1" fill="#fbbf24" opacity="0.5" />
  <circle cx="198" cy="80" r="1.5" fill="#ffffff" opacity="0.7" />

  <!-- Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 235 C 240 237.76 237.76 240 235 240 L 5 240 C 2.24 240 0 237.76 0 235 Z" fill="url(#deskGrad)" />
  <rect x="0" y="165" width="240" height="6" fill="#475569" opacity="0.5" />

  <!-- Study Desk Lamp (Right Side) -->
  <path d="M 195 170 L 205 170 L 200 110 Z" fill="#64748b" />
  <path d="M 200 115 L 215 85 L 225 90 L 205 120 Z" fill="#94a3b8" />
  <path d="M 205 75 C 190 75 180 95 185 105 L 220 100 C 220 85 210 75 205 75 Z" fill="#334155" filter="url(#shadow)" />
  <ellipse cx="202" cy="102" rx="16" ry="6" fill="#fbbf24" />

  <!-- Coffee Mug & Rising Steam (Left Side) -->
  <rect x="25" y="142" width="18" height="22" rx="3" fill="#cbd5e1" filter="url(#shadow)" />
  <path d="M 43 148 C 48 148 48 158 43 158" stroke="#cbd5e1" stroke-width="2.5" fill="none" />
  <!-- Coffee Steam Trails -->
  <path d="M 30 138 C 32 133 28 128 32 122" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 38 136 C 36 131 40 126 37 120" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Open Notebook / Planner in Center -->
  <g filter="url(#shadow)">
    <!-- Notebook Cover Base -->
    <path d="M 65 155 L 175 155 L 180 195 L 60 195 Z" fill="#0284c7" />
    <!-- Left Page -->
    <path d="M 68 157 L 118 153 L 120 190 L 70 193 Z" fill="#f8fafc" />
    <!-- Right Page -->
    <path d="M 122 153 L 172 157 L 170 193 L 120 190 Z" fill="#f1f5f9" />
    <!-- Center Binding Spine -->
    <line x1="120" y1="153" x2="120" y2="191" stroke="#cbd5e1" stroke-width="3" />
    
    <!-- Mock Handwritten Notes & Sketches (Abstract lines representing hard work/studying) -->
    <line x1="75" y1="165" x2="105" y2="163" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="75" y1="172" x2="110" y2="170" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="75" y1="179" x2="95" y2="177" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <circle cx="102" cy="178" r="3" fill="#f43f5e" /> <!-- Red correction mark -->

    <line x1="130" y1="163" x2="160" y2="165" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="130" y1="170" x2="165" y2="172" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <polyline points="130,182 135,178 140,182 146,176" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- The Main Subject: Dedicated Student (Upper Body leaned forward into work) -->
  <g id="student" filter="url(#shadow)">
    <!-- Hoodie / Clothing (Cosy purple/indigo tone) -->
    <path d="M 85 190 C 85 160 100 145 120 145 C 140 145 155 160 155 190 Z" fill="#6366f1" />
    
    <!-- Shoulders & Back Lean -->
    <path d="M 75 190 C 75 168 92 150 120 150 C 148 150 165 168 165 190 Z" fill="#4f46e5" />

    <!-- Head & Hair (Deep focused posture leaning down towards notebook) -->
    <circle cx="120" cy="120" r="22" fill="#fcd34d" /> <!-- Neck -->
    <path d="M 100 115 C 95 95 110 80 130 85 C 145 88 155 102 150 120 C 145 122 135 115 125 115 C 115 115 105 120 100 115 Z" fill="#1e293b" /> <!-- Stylish Dark Hair -->
    
    <!-- Face Profile / Bent Head Facing Downward -->
    <path d="M 125 105 C 135 105 142 112 140 122 C 138 128 130 132 122 130 Z" fill="#fde68a" />
    <!-- Focused Eyebrow / Determined Expression line -->
    <line x1="132" y1="114" x2="138" y2="116" stroke="#b45309" stroke-width="2" stroke-linecap="round" />

    <!-- Arms Resting on Desk / Holding Pen -->
    <!-- Left Arm -->
    <path d="M 85 175 C 95 165 110 165 125 175 L 115 195 L 90 195 Z" fill="#4f46e5" />
    <!-- Right Arm (Reaching Forward with Pen) -->
    <path d="M 155 175 C 145 165 130 165 120 175 L 125 188 L 150 185 Z" fill="#6366f1" />
    
    <!-- Hand & Pen Writing/Working Intensely -->
    <circle cx="123" cy="180" r="6" fill="#fde68a" />
    <!-- Pen Object -->
    <line x1="120" y1="175" x2="110" y2="198" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" filter="url(#shadow)" />
  </g>

  <!-- Action & Energy Elements (Sparks of 'Nỗ lực' / Effort & Focus) -->
  <!-- Glowing Effort Sparkle 1 -->
  <path d="M 140 135 Q 145 135 145 130 Q 145 135 150 135 Q 145 135 145 140 Q 145 135 140 135 Z" fill="#fbbf24" />
  <!-- Glowing Effort Sparkle 2 -->
  <path d="M 95 130 Q 98 130 98 127 Q 98 130 101 130 Q 98 130 98 133 Q 98 130 95 130 Z" fill="#38bdf8" />
  <!-- Focus Energy Sweat Drop / Gleam -->
  <path d="M 144 110 C 146 113 145 116 142 116 C 139 116 138 113 140 110 C 141 108 143 108 144 110 Z" fill="#38bdf8" opacity="0.8" />
  
  <!-- Subtle Dynamic Lighting Highlights on Head/Shoulders -->
  <path d="M 108 92 C 115 88 128 88 135 92" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round" />
</svg>