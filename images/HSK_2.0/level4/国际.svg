<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background elements (global network nodes) -->
  <g opacity="0.2">
    <circle cx="40" cy="50" r="2" fill="#38bdf8" />
    <circle cx="200" cy="40" r="3" fill="#fbbf24" />
    <circle cx="210" cy="120" r="2" fill="#38bdf8" />
    <circle cx="30" cy="180" r="2.5" fill="#10b981" />
    <path d="M40 50 L120 70 L200 40" stroke="#38bdf8" stroke-width="0.75" fill="none" stroke-dasharray="2 2" />
    <path d="M30 180 L120 140 L210 120" stroke="#10b981" stroke-width="0.75" fill="none" stroke-dasharray="2 2" />
  </g>

  <!-- Conference Room Environment / Desk Surface -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="url(#deskGrad)" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#64748b" stroke-width="2" />

  <!-- Main Subject: International Conference Setup -->
  <g filter="url(#shadow)">
    <!-- Large Main Display Screen (representing international conference/broadcast) -->
    <rect x="35" y="45" width="170" height="100" rx="8" fill="#0f172a" stroke="#475569" stroke-width="4" />
    <rect x="41" y="51" width="158" height="88" rx="4" fill="url(#screenGrad)" />
    
    <!-- Screen Inner UI: Connected Video Panels (Global Meeting) -->
    <rect x="49" y="59" width="44" height="34" rx="3" fill="#1e293b" opacity="0.9" />
    <circle cx="71" cy="71" r="8" fill="#fb923c" />
    <path d="M63 85 C63 80 67 78 71 78 C75 78 79 80 79 85 Z" fill="#fb923c" />

    <rect x="98" y="59" width="44" height="34" rx="3" fill="#1e293b" opacity="0.9" />
    <circle cx="120" cy="71" r="8" fill="#38bdf8" />
    <path d="M112 85 C112 80 116 78 120 78 C124 78 128 80 128 85 Z" fill="#38bdf8" />

    <rect x="147" y="59" width="44" height="34" rx="3" fill="#1e293b" opacity="0.9" />
    <circle cx="169" cy="71" r="8" fill="#10b981" />
    <path d="M161 85 C161 80 165 78 169 78 C173 78 177 80 177 85 Z" fill="#10b981" />

    <!-- Connection lines overlaying screen -->
    <path d="M71 71 L120 71 L169 71" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.8"/>

    <!-- Dynamic Waveform / Global Data Indicator at bottom of screen -->
    <path d="M49 122 Q 70 105, 95 122 T 145 122 T 191 122" stroke="#38bdf8" stroke-width="2" fill="none" filter="url(#glow)"/>

    <!-- Screen Stand -->
    <path d="M105 145 L135 145 L140 185 L100 185 Z" fill="#334155" />
    <ellipse cx="120" cy="185" rx="35" ry="5" fill="#0f172a" />
  </g>

  <!-- Foreground Elements: Interactive Globe & Mic (Symbols of Internationalism) -->
  <!-- Globe Stand and Sphere -->
  <g filter="url(#shadow)" transform="translate(35, 125)">
    <!-- Base -->
    <ellipse cx="20" cy="60" rx="18" ry="6" fill="#64748b" />
    <path d="M17 20 L23 20 L23 60 L17 60 Z" fill="#94a3b8" />
    <path d="M5 20 C5 5 35 5 35 20" stroke="#94a3b8" stroke-width="3" fill="none" />
    
    <!-- Globe Ball -->
    <circle cx="20" cy="20" r="22" fill="url(#globeGrad)" />
    <!-- Continents Stylized -->
    <path d="M10 12 Q15 8 22 14 T28 28 Q22 32 15 25 Z" fill="#10b981" opacity="0.8" />
    <path d="M6 22 Q10 18 14 24 T8 30 Z" fill="#10b981" opacity="0.8" />
    <!-- Meridian Ring -->
    <ellipse cx="20" cy="20" rx="22" ry="8" fill="none" stroke="#fbbf24" stroke-width="1.5" transform="rotate(-30 20 20)" />
  </g>

  <!-- Professional Conference Microphone (Foreground Right) -->
  <g filter="url(#shadow)" transform="translate(165, 130)">
    <!-- Mic Base -->
    <ellipse cx="20" cy="55" rx="14" ry="4" fill="#64748b" />
    <path d="M18 35 L22 35 L22 55 L18 55 Z" fill="#94a3b8" />
    <!-- Flexible Neck -->
    <path d="M20 35 Q25 25 15 18" stroke="#cbd5e1" stroke-width="3" fill="none" />
    <!-- Mic Head -->
    <rect x="10" y="5" width="20" height="15" rx="7" fill="#f59e0b" />
    <rect x="13" y="7" width="14" height="11" rx="5" fill="#fbbf24" />
    <!-- Sound Waves / Action Emission -->
    <path d="M35 10 C38 12, 38 16, 35 18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M40 7 C45 10, 45 18, 40 21" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- Additional Atmospheric Details (Floating translation/globe pins) -->
  <g transform="translate(140, 45)">
    <circle cx="0" cy="0" r="6" fill="#ec4899" />
    <path d="M-3 0 L0 5 L3 0" fill="#ec4899" />
    <circle cx="0" cy="0" r="2" fill="#fff" />
  </g>

  <g transform="translate(85, 38)">
    <circle cx="0" cy="0" r="5" fill="#fbbf24" />
    <path d="M-2.5 0 L0 4 L2.5 0" fill="#fbbf24" />
    <circle cx="0" cy="0" r="1.5" fill="#fff" />
  </g>

  <!-- Sparkles / International Connection Highlights -->
  <path d="M 180 95 L 183 98 L 180 101 L 177 98 Z" fill="#38bdf8" filter="url(#glow)" />
  <path d="M 60 100 L 62 102 L 60 104 L 58 102 Z" fill="#fbbf24" filter="url(#glow)" />
</svg>