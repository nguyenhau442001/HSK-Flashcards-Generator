<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Golden Hour Glow -->
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Map Surface Gradient -->
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="backpackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    
    <!-- Mountains Gradient -->
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="mountainNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#sunGlow)"/>

  <!-- ENVIRONMENT: Distant Landscape / Scenic View out of frame or background -->
  <g opacity="0.6">
    <!-- Distant Mountains -->
    <polygon points="10,130 60,80 110,130" fill="url(#mountainFar)"/>
    <polygon points="90,130 145,65 210,130" fill="url(#mountainFar)"/>
    <!-- Sun / Compass element -->
    <circle cx="185" cy="55" r="18" fill="#fbbf24" opacity="0.8"/>
    <circle cx="185" cy="55" r="24" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.5"/>
  </g>

  <!-- ENVIRONMENT: Wooden Table Surface / Desk Setup -->
  <path d="M 0,150 L 240,150 L 240,240 L 0,240 Z" fill="#0f172a" opacity="0.9"/>
  <!-- Tabletop edge light -->
  <path d="M 0,150 L 240,150" stroke="#334155" stroke-width="3"/>
  <!-- Wooden plank texture line -->
  <path d="M 0,190 L 240,190" stroke="#090d16" stroke-width="2"/>

  <!-- PROPS: Travel Gear (Camera, Compass, Coffee Cup) on Table -->
  <!-- Camera -->
  <g transform="translate(25, 160) scale(0.8)" filter="url(#softShadow)">
    <rect x="0" y="8" width="36" height="24" rx="4" fill="#64748b"/>
    <rect x="10" y="2" width="16" height="8" rx="2" fill="#475569"/>
    <circle cx="18" cy="20" r="8" fill="#1e293b"/>
    <circle cx="18" cy="20" r="5" fill="#38bdf8"/>
    <circle cx="15" cy="17" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="6" cy="13" r="2" fill="#cbd5e1"/>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(195, 155)" filter="url(#softShadow)">
    <rect x="0" y="5" width="18" height="22" rx="3" fill="#f8fafc"/>
    <path d="M 18,10 C 23,10 23,20 18,22" stroke="#f8fafc" stroke-width="3" fill="none"/>
    <ellipse cx="9" cy="5" rx="9" ry="3" fill="#e2e8f0"/>
    <ellipse cx="9" cy="5" rx="7" ry="2" fill="#78350f"/>
  </g>

  <!-- PROPS: Giant Unfurled Travel Map on Table -->
  <g filter="url(#softShadow)">
    <path d="M 45,135 Q 120,120 195,135 L 210,195 Q 120,210 30,195 Z" fill="url(#mapGrad)"/>
    <!-- Map Details (Fake rivers, routes, destination markers) -->
    <path d="M 60,150 Q 90,170 130,155 T 180,180" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 80,180 Q 120,140 170,150" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <!-- Pin / Marker on Map -->
    <g transform="translate(130, 145)">
      <path d="M0,0 C-5,-5 -5,-12 0,-16 C5,-12 5,-5 0,0 Z" fill="#ef4444"/>
      <circle cx="0" cy="-10" r="2" fill="#ffffff"/>
    </g>
    <!-- Compass Rose Icon on Map -->
    <circle cx="65" cy="165" r="10" stroke="#b45309" stroke-width="1" fill="none" opacity="0.4"/>
    <polygon points="65,157 67,165 65,173 63,165" fill="#b45309" opacity="0.5"/>
  </g>

  <!-- MAIN CHARACTER: Adventurer / Traveler leaning over map -->
  <g transform="translate(90, 45)" filter="url(#softShadow)">
    
    <!-- Backpack resting beside or on chair/shoulder -->
    <g transform="translate(-45, 45)">
      <rect x="0" y="0" width="30" height="40" rx="8" fill="url(#backpackGrad)"/>
      <rect x="5" y="10" width="20" height="15" rx="4" fill="#9f1239"/>
      <path d="M 8,0 Q 15,-8 22,0" stroke="#e11d48" stroke-width="4" fill="none"/>
    </g>

    <!-- Torso (Leaning Forward Posture) -->
    <path d="M -15,55 Q 25,50 55,75 L 40,110 Q 5,90 -25,95 Z" fill="url(#jacketGrad)"/>
    <!-- Jacket Zipper & Collar -->
    <path d="M 10,53 L 30,78" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <path d="M 22,48 Q 32,55 35,62" fill="#0284c7"/>

    <!-- Head and Hair -->
    <g transform="translate(35, 25)">
      <!-- Neck -->
      <rect x="-3" y="18" width="10" height="12" rx="4" fill="#fcd34d"/>
      
      <!-- Head Base -->
      <circle cx="5" cy="5" r="18" fill="#fde047"/>
      
      <!-- Cheeks / Expression (Joyful, Excited) -->
      <circle cx="-2" cy="8" r="3" fill="#fb7185" opacity="0.6"/>
      <circle cx="14" cy="8" r="3" fill="#fb7185" opacity="0.6"/>
      
      <!-- Eyes (Happy Arcs) -->
      <path d="M -4,2 Q -1,0 2,3" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 10,2 Q 13,0 16,3" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      
      <!-- Smiling Open Mouth -->
      <path d="M 3,10 Q 7,16 11,10" fill="#991b1b"/>
      
      <!-- Stylish Hair -->
      <path d="M -13,0 C -15,-12 0,-18 12,-12 C 20,-8 22,2 20,8 C 15,3 10,-5 2,-4 C -6,-3 -11,2 -13,0 Z" fill="#334155"/>
      <path d="M 15,-7 C 22,-3 25,6 23,12 C 21,12 21,3 15,-7 Z" fill="#1e293b"/>
    </g>

    <!-- Arms interacting with the map -->
    <!-- Back Arm (Holding/Pointing) -->
    <path d="M -5,60 Q -25,80 -15,100" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="-15" cy="103" r="5" fill="#fde047"/>

    <!-- Front Arm (Reaching out excitedly over the map) -->
    <path d="M 35,65 Q 60,85 75,95" stroke="url(#jacketGrad)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Sleeve Cuff -->
    <path d="M 68,91 L 78,98" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
    <!-- Hand Pointing at Map -->
    <circle cx="80" cy="99" r="5" fill="#fde047"/>
    <path d="M 83,101 L 90,105" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND / DYNAMIC ELEMENTS: Travel energy/sparkles -->
  <g transform="translate(130, 95)" opacity="0.9">
    <!-- Star sparkle 1 -->
    <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(60, 120) scale(0.6)" opacity="0.8">
    <!-- Star sparkle 2 -->
    <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#38bdf8"/>
  </g>
  <g transform="translate(170, 75) scale(0.7)" opacity="0.8">
    <!-- Star sparkle 3 -->
    <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#f43f5e"/>
  </g>

</svg>