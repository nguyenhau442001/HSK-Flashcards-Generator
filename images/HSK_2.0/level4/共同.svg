<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Table Top Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="goalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Glow (The Shared Goal / Vision) -->
  <circle cx="120" cy="85" r="70" fill="url(#goalGlow)"/>

  <!-- Background Environment / Window looking at night city -->
  <g opacity="0.15">
    <rect x="70" y="25" width="100" height="95" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="120" y1="25" x2="120" y2="120" stroke="#38bdf8" stroke-width="2"/>
    <line x1="70" y1="70" x2="170" y2="70" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Hanging Lamps for Warm Atmosphere -->
  <path d="M70 0 L70 45" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M170 0 L170 30" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 45 Q70 35 80 45 Z" fill="#f59e0b"/>
  <path d="M160 30 Q170 20 180 30 Z" fill="#f59e0b"/>

  <!-- Giant Shared Puzzle / Goal Structure in Center Background -->
  <g transform="translate(120, 65)">
    <!-- Orbiting decorative particles -->
    <circle cx="-45" cy="-25" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="50" cy="-15" r="2.5" fill="#10b981" opacity="0.8"/>
    <circle cx="-25" cy="35" r="2" fill="#ec4899" opacity="0.8"/>

    <!-- Central Glowing Star (The Joint Objective) -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <g filter="url(#glow)">
      <polygon points="0,-22 5,-7 20,-7 8,2 13,17 0,8 -13,17 -8,2 -20,-7 -5,-7" fill="#fbbf24"/>
    </g>

    <!-- Interlocking puzzle piece backing (Symbolizing 'Together/Joint') -->
    <path d="M-30,-15 
             C-30,-25 -10,-25 -10,-15 
             C-5,-15 -5,-30 5,-30 
             C15,-30 15,-15 20,-15 
             C30,-15 30,10 20,10 
             C15,10 15,25 5,25 
             C-5,25 -5,10 -10,10 
             C-10,10 -30,10 -30,-15 Z" 
          fill="#3b82f6" opacity="0.25" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Table Surface -->
  <path d="M20 170 L220 170 L230 210 L10 210 Z" fill="url(#tableGrad)" filter="url(#shadow)"/>
  <rect x="20" y="166" width="200" height="6" rx="3" fill="#475569"/>

  <!-- Foreground Props on Table -->
  <!-- Blueprint / Plan -->
  <g transform="translate(85, 175) rotate(-5)">
    <rect x="0" y="0" width="70" height="30" rx="3" fill="#f8fafc" opacity="0.9"/>
    <line x1="8" y1="8" x2="35" y2="8" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="16" x2="50" y2="16" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="25" y2="22" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="58" cy="15" r="6" fill="#10b981" opacity="0.8"/>
    <path d="M55 15 L57 17 L62 12" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(45, 170)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#ec4899"/>
    <path d="M16 10 C22 10 22 20 16 20" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M5 0 Q8 -5 5 -10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M11 2 Q14 -3 11 -8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Character Left (Collaborator 1 - Teammate A) -->
  <g transform="translate(40, 110)">
    <!-- Body / Torso -->
    <path d="M25 45 C25 30 45 30 45 45 L50 75 C50 78 47 80 44 80 L26 80 C23 80 20 78 20 75 Z" fill="#3b82f6"/>
    <!-- Collar / Shirt Detail -->
    <path d="M35 30 L28 42 L42 42 Z" fill="#f8fafc"/>
    
    <!-- Head -->
    <circle cx="35" cy="18" r="14" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M21 16 C21 8 28 4 35 4 C42 4 49 8 49 16 C49 18 47 18 45 15 C40 10 30 10 25 15 C23 18 21 18 21 16 Z" fill="#1e293b"/>
    <!-- Face Expression (Focused & Happy) -->
    <circle cx="39" cy="16" r="1.5" fill="#1e293b"/>
    <path d="M38 21 C39 23 41 23 42 21" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left Arm reaching toward center -->
    <path d="M25 45 C15 48 5 60 5 60" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="3" cy="61" r="4" fill="#fed7aa"/>
    
    <!-- Right Arm (Raised in enthusiastic alignment) -->
    <path d="M45 45 C55 45 65 35 70 25" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="72" cy="23" r="4" fill="#fed7aa"/>
  </g>

  <!-- Character Right (Collaborator 2 - Teammate B) -->
  <g transform="translate(145, 110)">
    <!-- Body / Torso -->
    <path d="M35 45 C35 30 15 30 15 45 L10 75 C10 78 13 80 16 80 L34 80 C37 80 40 78 40 75 Z" fill="#10b981"/>
    <!-- Collar -->
    <path d="M25 30 L18 42 L32 42 Z" fill="#f8fafc"/>

    <!-- Head -->
    <circle cx="25" cy="18" r="14" fill="#ffedd5"/>
    <!-- Hair (Ponytail/Bun style) -->
    <path d="M11 16 C11 8 18 4 25 4 C32 4 39 8 39 16 C39 18 37 18 35 15 C30 10 20 10 15 15 C13 18 11 18 11 16 Z" fill="#78350f"/>
    <circle cx="25" cy="2" r="4" fill="#78350f"/>
    <!-- Face Expression -->
    <circle cx="21" cy="16" r="1.5" fill="#1e293b"/>
    <path d="M18 21 C19 23 21 23 22 21" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right Arm reaching toward center -->
    <path d="M35 45 C45 48 55 60 55 60" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <circle cx="57" cy="61" r="4" fill="#ffedd5"/>

    <!-- Left Arm (Raised matching) -->
    <path d="M15 45 C5 45 -5 35 -10 25" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-12" cy="23" r="4" fill="#ffedd5"/>
  </g>

  <!-- Central High-Five / Joining Force Spark -->
  <g transform="translate(120, 155)">
    <circle cx="0" cy="0" r="14" fill="#fbbf24" filter="url(#shadow)"/>
    <path d="M-6 0 L-2 4 L7 -4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dynamic action sparks -->
    <path d="M-20 -5 L-15 -3" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 -5 L15 -3" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 -20 L0 -15" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ambient Light / Highlights -->
  <circle cx="120" cy="85" r="12" fill="#fff" opacity="0.9" filter="url(#shadow)"/>
</svg>