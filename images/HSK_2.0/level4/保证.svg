<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window/Light Gradient -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Warm Lamp Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk/Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Pledge Hand Glow -->
    <filter id="pledgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip Path for Window -->
    <clipPath id="windowClip">
      <path d="M 150 20 L 210 20 L 210 110 L 150 110 Z"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT & INTERIOR -->
  <!-- Wallpaper Details / Stripes -->
  <path d="M 0 0 L 240 0 L 240 160 L 0 160 Z" fill="#1e293b"/>
  <path d="M 30 0 L 30 160 M 70 0 L 70 160 M 110 0 L 110 160 M 150 0 L 150 160 M 190 0 L 190 160" stroke="#273548" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>

  <!-- Window Frame & Cityscape Silhouette -->
  <rect x="148" y="18" width="64" height="94" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <g clip-path="url(#windowClip)">
    <rect x="150" y="20" width="60" height="90" fill="url(#windowGlow)"/>
    <!-- Distant City Skyline -->
    <polygon points="152,110 152,85 158,85 158,110" fill="#1e293b"/>
    <polygon points="160,110 160,65 170,65 170,110" fill="#1e293b"/>
    <polygon points="172,110 172,75 182,75 182,110" fill="#1e293b"/>
    <polygon points="184,110 184,50 196,50 196,110" fill="#1e293b"/>
    <polygon points="198,110 198,80 208,80 208,110" fill="#1e293b"/>
    <!-- Tiny Window Lights -->
    <rect x="187" y="58" width="2" height="3" fill="#fbbf24" opacity="0.8"/>
    <rect x="191" y="64" width="2" height="3" fill="#fbbf24" opacity="0.8"/>
    <rect x="163" y="72" width="2" height="3" fill="#38bdf8" opacity="0.8"/>
  </g>
  <!-- Window Crossbar -->
  <line x1="180" y1="20" x2="180" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="65" x2="210" y2="65" stroke="#334155" stroke-width="2"/>

  <!-- Bookshelf / Prop in Background -->
  <rect x="18" y="35" width="45" height="75" rx="2" fill="#172033" stroke="#2a3b55" stroke-width="1.5"/>
  <line x1="18" y1="60" x2="63" y2="60" stroke="#2a3b55" stroke-width="1.5"/>
  <line x1="18" y1="85" x2="63" y2="85" stroke="#2a3b55" stroke-width="1.5"/>
  <!-- Books on shelf -->
  <rect x="22" y="44" width="6" height="16" rx="1" fill="#ec4899"/>
  <rect x="29" y="42" width="5" height="18" rx="1" fill="#38bdf8"/>
  <rect x="35" y="46" width="8" height="14" rx="1" fill="#f59e0b"/>
  <rect x="22" y="69" width="7" height="16" rx="1" fill="#10b981"/>
  <rect x="31" y="67" width="9" height="18" rx="1" fill="#8b5cf6"/>

  <!-- Hanging Pendant Lamp -->
  <path d="M 95 0 L 95 30" stroke="#64748b" stroke-width="2"/>
  <path d="M 80 30 L 110 30 L 115 42 L 75 42 Z" fill="#fbbf24"/>
  <circle cx="95" cy="42" r="6" fill="#fef08a"/>
  <!-- Lamp Glow Effect -->
  <circle cx="95" cy="55" r="50" fill="url(#lampGlow)" style="mix-blend-mode: screen;"/>

  <!-- MAIN DESK -->
  <rect x="0" y="160" width="240" height="80" fill="url(#deskGrad)"/>
  <path d="M 0 160 L 240 160" stroke="#475569" stroke-width="3"/>

  <!-- Desk Props -->
  <!-- Laptop -->
  <path d="M 160 150 L 205 150 L 215 160 L 150 160 Z" fill="#64748b"/>
  <path d="M 163 125 L 202 125 C 204 125 205 126 205 128 L 205 150 L 160 150 L 160 128 C 160 126 161 125 163 125 Z" fill="#cbd5e1"/>
  <rect x="165" y="129" width="34" height="18" rx="1" fill="#0f172a"/>
  <path d="M 175 135 L 182 141 L 195 132" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Document / Contract Prop (Symbolizing commitment/guarantee) -->
  <path d="M 75 148 L 115 143 L 118 160 L 72 160 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="82" y1="151" x2="102" y2="149" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="82" y1="155" x2="96" y2="153" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Red Seal/Stamp on document -->
  <circle cx="108" cy="154" r="4" fill="#ef4444"/>

  <!-- Coffee Mug -->
  <rect x="125" y="142" width="14" height="18" rx="2" fill="#38bdf8"/>
  <path d="M 139 146 C 143 146 143 154 139 154" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- CHARACTER: The Confident Guarantor -->
  <g id="character">
    <!-- Torso / Body (Leaning forward slightly, determined pose) -->
    <path d="M 85 140 C 85 115 105 105 120 105 C 135 105 155 115 155 140 L 150 165 L 90 165 Z" fill="#0284c7"/>
    <!-- Collar & Tie -->
    <path d="M 110 105 L 120 118 L 130 105 Z" fill="#f8fafc"/>
    <polygon points="117,116 123,116 122,145 118,145" fill="#ef4444"/>

    <!-- Neck -->
    <rect x="112" y="94" width="16" height="15" rx="4" fill="#fcd34d"/>

    <!-- Head & Face -->
    <circle cx="120" cy="80" r="18" fill="#fcd34d"/>

    <!-- Hair (Stylized modern neat cut) -->
    <path d="M 102 78 C 102 65 112 60 122 60 C 135 60 138 72 138 78 C 138 78 135 70 123 70 C 110 70 102 78 102 78 Z" fill="#1e293b"/>

    <!-- Facial Expression: Determined, Confident Smile -->
    <!-- Confident Eyebrows -->
    <path d="M 108 73 L 115 75" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 125 75 L 132 73" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes (Focused/Happy) -->
    <circle cx="112" cy="78" r="2" fill="#1e293b"/>
    <circle cx="128" cy="78" r="2" fill="#1e293b"/>
    <!-- Confident Smile -->
    <path d="M 113 86 Q 120 92 127 86" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="108" cy="83" r="3" fill="#fb7185" opacity="0.5"/>
    <circle cx="132" cy="83" r="3" fill="#fb7185" opacity="0.5"/>

    <!-- BACK ARM (Supporting) -->
    <path d="M 90 120 L 70 145 L 80 150 L 95 130 Z" fill="#0284c7"/>
    <circle cx="75" cy="148" r="6" fill="#fcd34d"/>

    <!-- FRONT ARM & HAND (THE PLEDGE / "GUARANTEE" GESTURE - Hand over heart / chest) -->
    <!-- Upper Arm -->
    <path d="M 140 115 L 130 135 L 115 130 L 125 110 Z" fill="#0369a1"/>
    <!-- Forearm & Hand pressing firmly on chest -->
    <path d="M 130 135 L 120 132 C 115 132 110 136 112 142 C 113 145 118 147 122 145 L 135 138 Z" fill="#fcd34d" filter="url(#pledgeGlow)"/>
    <!-- Fingers firmly placed -->
    <circle cx="120" cy="143" r="5" fill="#fcd34d"/>

    <!-- ACTION LINES / CONFIDENCE EMISSION (Representing absolute certainty/promise) -->
    <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <line x1="145" y1="95" x2="160" y2="90"/>
      <line x1="150" y1="108" x2="170" y2="108"/>
      <line x1="145" y1="120" x2="160" y2="125"/>
    </g>
    <!-- Little Sparkle of Trust -->
    <path d="M 162 75 L 165 82 L 172 85 L 165 88 L 162 95 L 159 88 L 152 85 L 159 82 Z" fill="#fbbf24"/>
    <path d="M 135 50 L 137 55 L 142 57 L 137 59 L 135 64 L 133 59 L 128 57 L 133 55 Z" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- FOREGROUND PLANT (Depth & framing) -->
  <path d="M 0 240 L 0 200 C 0 190 15 190 20 205 L 25 240 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Monstera/Leafy Plant Silhouette -->
  <path d="M 15 200 Q -5 180 5 150 Q 25 170 15 200 Z" fill="#10b981" opacity="0.85"/>
  <path d="M 18 190 Q 35 160 30 130 Q 15 150 18 190 Z" fill="#059669" opacity="0.9"/>
  <path d="M 10 210 Q 30 200 45 220 Q 25 230 10 210 Z" fill="#10b981" opacity="0.8"/>
</svg>