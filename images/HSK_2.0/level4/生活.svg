<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for Gradients & Filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Window Light Gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Coffee Steam / Soft Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Room Interior / Background Layers -->
  <g id="room-interior">
    <!-- Back Wall -->
    <rect x="15" y="15" width="210" height="155" rx="12" fill="#1e293b" />
    
    <!-- Floor -->
    <path d="M15 170 L225 170 L235 220 L5 220 Z" fill="#0f172a" />
    <path d="M15 170 L225 170 L225 173 L15 173 Z" fill="#334155" opacity="0.6" />

    <!-- Window showing night/evening sky -->
    <rect x="145" y="35" width="60" height="85" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="3" />
    <!-- City Skyline outside window -->
    <path d="M150 90 L150 120 L160 120 L160 75 L165 75 L165 120 L175 120 L175 65 L182 65 L182 120 L195 120 L195 85 L200 85 L200 120 Z" fill="#1e293b" />
    <!-- Window Light Beam casting into room -->
    <polygon points="145,50 40,170 120,170" fill="url(#windowLight)" />
  </g>

  <!-- Furniture: Bookshelf & Plants (Background Depth) -->
  <g id="bookshelf">
    <rect x="25" y="45" width="45" height="110" rx="4" fill="#334155" />
    <!-- Shelves -->
    <rect x="27" y="75" width="41" height="4" fill="#475569" />
    <rect x="27" y="105" width="41" height="4" fill="#475569" />
    <rect x="27" y="135" width="41" height="4" fill="#475569" />
    <!-- Books -->
    <rect x="31" y="55" width="8" height="20" rx="1" fill="#f43f5e" />
    <rect x="40" y="52" width="6" height="23" rx="1" fill="#38bdf8" />
    <rect x="48" y="57" width="10" height="18" rx="1" fill="#fbbf24" />
    <rect x="32" y="85" width="7" height="20" rx="1" fill="#10b981" />
    <rect x="41" y="82" width="12" height="23" rx="1" fill="#a855f7" />
  </g>

  <!-- Hanging Picture Frame -->
  <g id="wall-art" transform="translate(85, 40)">
    <rect x="0" y="0" width="38" height="45" rx="3" fill="#475569" />
    <rect x="3" y="3" width="32" height="39" rx="2" fill="#f8fafc" />
    <!-- Abstract landscape inside frame -->
    <circle cx="19" cy="18" r="8" fill="#fb923c" />
    <path d="M3 35 Q 15 20, 25 32 T 35 35 Z" fill="#34d399" />
  </g>

  <!-- Main Subject: Cozy Living Desk & Lifestyle Elements -->
  <g id="main-scene" filter="url(#shadow)">
    <!-- Wooden Desk -->
    <path d="M50 145 L190 145 L200 170 L40 170 Z" fill="#b45309" />
    <rect x="45" y="140" width="150" height="8" rx="3" fill="#d97706" />

    <!-- Laptop -->
    <path d="M75 125 L125 125 L135 142 L65 142 Z" fill="#94a3b8" />
    <path d="M78 127 L122 127 L129 140 L71 140 Z" fill="#cbd5e1" />
    <path d="M60 142 L140 142 L145 145 L55 145 Z" fill="#64748b" />
    <!-- Laptop screen content (Code/UI lines) -->
    <rect x="82" y="102" width="36" height="23" rx="2" fill="#0f172a" />
    <line x1="86" y1="108" x2="104" y2="108" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="86" y1="114" x2="110" y2="114" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <line x1="86" y1="120" x2="96" y2="120" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />

    <!-- Coffee Mug & Steam -->
    <g id="coffee-mug">
      <path d="M152 126 C152 122, 168 122, 168 126 L166 142 C166 145, 154 145, 154 142 Z" fill="#f8fafc" />
      <path d="M167 129 C173 129, 173 139, 167 139" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
      <ellipse cx="160" cy="126" rx="8" ry="2" fill="#78350f" />
      <!-- Steam -->
      <path d="M157 118 C155 114, 161 110, 159 106" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.7" />
      <path d="M163 117 C165 113, 159 109, 161 105" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- Potted Plant on Desk (Nature & Life representation) -->
    <g id="desk-plant" transform="translate(165, 95)">
      <!-- Pot -->
      <path d="M6 32 L18 32 L21 48 L3 48 Z" fill="#f43f5e" />
      <ellipse cx="12" cy="32" rx="6" ry="1.5" fill="#fda4af" />
      <!-- Stems & Leaves -->
      <path d="M12 32 C12 20, 4 15, 2 10" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
      <path d="M12 32 C12 18, 20 12, 24 8" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
      <path d="M12 32 C12 22, 12 10, 12 5" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
      <!-- Leaf Shapes -->
      <path d="M2 10 C-2 5, 4 2, 8 7 Z" fill="url(#leafGrad)" />
      <path d="M24 8 C28 4, 22 0, 18 5 Z" fill="url(#leafGrad)" />
      <path d="M12 5 C16 0, 10 -2, 8 4 Z" fill="#34d399" />
    </g>

    <!-- Warm Desk Lamp -->
    <g id="desk-lamp">
      <!-- Base -->
      <ellipse cx="55" cy="142" rx="10" ry="4" fill="#cbd5e1" />
      <!-- Arm -->
      <path d="M52 142 L45 110 L30 95" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Shade -->
      <path d="M20 85 L40 85 L35 98 L25 98 Z" fill="#38bdf8" />
      <!-- Light Cone from Lamp -->
      <polygon points="30,96 55,145 90,145" fill="#fbbf24" opacity="0.15" />
    </g>
  </g>

  <!-- Foreground Foreground Elements (Depth Framing) -->
  <g id="foreground-props">
    <!-- Cozy Cat Sleeping on the Edge of the Floor/Rug -->
    <g id="sleeping-cat" transform="translate(100, 175)">
      <!-- Cat Body -->
      <ellipse cx="25" cy="20" rx="18" ry="12" fill="#fb923c" />
      <!-- Cat Head -->
      <circle cx="12" cy="18" r="10" fill="#fb923c" />
      <!-- Ears -->
      <polygon points="5,12 8,6 12,14" fill="#ea580c" />
      <polygon points="14,13 18,7 20,16" fill="#ea580c" />
      <!-- Tail -->
      <path d="M38 22 C 45 25, 42 15, 38 12" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" />
      <!-- Sleeping Eye (Curved line) -->
      <path d="M8 17 Q 10 19, 12 17" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Floor Rug -->
    <ellipse cx="115" cy="195" rx="75" ry="15" fill="#334155" opacity="0.8" />
    <ellipse cx="115" cy="195" rx="65" ry="11" fill="#475569" opacity="0.6" />
  </g>

  <!-- Dynamic Atmospheric Sparkles / Joyful Lifestyle Particles -->
  <g id="atmosphere">
    <circle cx="70" cy="80" r="2" fill="#fef08a" opacity="0.8" filter="url(#softGlow)" />
    <circle cx="130" cy="60" r="1.5" fill="#fef08a" opacity="0.6" />
    <circle cx="105" cy="95" r="2.5" fill="#38bdf8" opacity="0.5" filter="url(#softGlow)" />
    <circle cx="180" cy="135" r="2" fill="#34d399" opacity="0.7" />
  </g>
</svg>