  <circle cx="170" cy="100" r="4" fill="#fb923c"/>
  <path d="M65 95l10 10m-10 0l10-10" stroke="#fb923c" stroke-width="2"/>
  <path d="M165 95l10 10m-10 0l10-10" stroke="#fb923c" stroke-width="2"/>
  
  <!-- Decorative atmosphere -->
  <circle cx="40" cy="50" r="3" fill="#10b981" opacity="0.6"/>
  <circle cx="200" cy="70" r="5" fill="#ec4899" opacity="0.6"/>
  <circle cx="150" cy="40" r="2" fill="#fbbf24" opacity="0.8"/>
