      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background elements: A park bench and tree suggesting an outdoor setting -->
  <path d="M40 180h160v10H40z" fill="#334155"/>
  <path d="M60 190h10v30H60zM170 190h10v30H170z" fill="#475569"/>
  
  <!-- The Subject: A person standing, gesturing "about" (approximate) with hands -->
  <!-- Body -->
