<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b1f1a"/>
      <stop offset="60%" stop-color="#1e1312"/>
      <stop offset="100%" stop-color="#0f0a09"/>
    </radialGradient>

    <!-- Bowl interior gradient -->
    <radialGradient id="soupGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff3b00"/>
      <stop offset="45%" stop-color="#cc1100"/>
      <stop offset="85%" stop-color="#8a0700"/>
      <stop offset="100%" stop-color="#520300"/>
    </radialGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff7b54" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ffae42" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Character Skin Warmth/Flush Gradient -->
    <radialGradient id="flushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4a4a" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#ff7b54" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffb199" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Bowl/Table -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#050202" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Atmospheric Background Elements / Ambient Spicy Glow -->
  <circle cx="120" cy="110" r="90" fill="#ff2200" opacity="0.08" filter="blur(20px)"/>
  <circle cx="120" cy="80" r="40" fill="#ffaa00" opacity="0.12" filter="blur(15px)"/>

  <!-- Chopsticks and Steam Background -->
  <g id="steam-and-environment">
    <!-- Steam rising dynamically -->
    <path d="M95 110 C85 85, 115 70, 100 45 C90 30, 110 20, 105 10" fill="none" stroke="url(#steamGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M145 110 C155 85, 125 70, 140 45 C150 30, 130 20, 135 10" fill="none" stroke="url(#steamGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 120 C115 95, 130 80, 122 55 C115 40, 125 25, 120 15" fill="none" stroke="url(#steamGrad)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Table surface -->
  <path d="M20 205 Q120 195 220 205 L230 230 Q120 240 10 230 Z" fill="#140a08"/>
  <ellipse cx="120" cy="205" rx="100" ry="8" fill="#2d1714"/>

  <!-- BACK OF BOWL (for depth) -->
  <ellipse cx="120" cy="145" rx="72" ry="16" fill="#33110e"/>

  <!-- HOT SOUP -->
  <ellipse cx="120" cy="148" rx="66" ry="14" fill="url(#soupGrad)"/>

  <!-- Chili Oils & Floating Spices in Soup -->
  <circle cx="105" cy="145" r="5" fill="#ffdd00" opacity="0.8"/>
  <circle cx="135" cy="150" r="4" fill="#ffcc00" opacity="0.7"/>
  <circle cx="120" cy="143" r="6" fill="#ffea75" opacity="0.9"/>
  <!-- Floating chili peppers inside bowl -->
  <path d="M90 148 Q95 145 100 149 Q98 152 90 148 Z" fill="#ff1900"/>
  <path d="M140 146 Q146 143 148 148 Q144 151 140 146 Z" fill="#ff1900"/>
  <ellipse cx="125" cy="153" rx="4" ry="2" fill="#ff1900" transform="rotate(30 125 153)"/>

  <!-- CHARACTER -->
  <g id="expressive-character">
    <!-- Character Shoulders & Hoodie/Shirt -->
    <path d="M60 210 C60 175, 80 165, 120 165 C160 165, 180 175, 180 210 Z" fill="#3b82f6" filter="url(#dropShadow)"/>
    <!-- Collar details -->
    <path d="M100 165 L120 185 L140 165 Z" fill="#eff6ff"/>
    <path d="M110 165 L120 178 L130 165 Z" fill="#dbeafe"/>

    <!-- Head / Face Base Shape -->
    <ellipse cx="120" cy="122" rx="42" ry="46" fill="#fde047" filter="url(#dropShadow)"/>

    <!-- Ears -->
    <circle cx="76" cy="124" r="8" fill="#fde047"/>
    <circle cx="164" cy="124" r="8" fill="#fde047"/>
    <circle cx="76" cy="124" r="4" fill="#facc15"/>
    <circle cx="164" cy="124" r="4" fill="#facc15"/>

    <!-- Extreme Spicy Flush (Blush overlay across entire face) -->
    <ellipse cx="120" cy="128" rx="38" ry="36" fill="url(#flushGrad)"/>
    <!-- Extra intense cheek glow -->
    <circle cx="92" cy="128" r="14" fill="#ff2a00" opacity="0.6" filter="blur(4px)"/>
    <circle cx="148" cy="128" r="14" fill="#ff2a00" opacity="0.6" filter="blur(4px)"/>

    <!-- Sweat Drops (Spicy reaction!) -->
    <!-- Sweat drop 1 (Left temple) -->
    <path d="M84 105 C84 98, 90 92, 90 92 C90 92, 96 98, 96 105 C96 109, 93 112, 90 112 C87 112, 84 109, 84 105 Z" fill="#38bdf8" opacity="0.9" filter="url(#dropShadow)"/>
    <!-- Sweat drop 2 (Right forehead, elongated) -->
    <path d="M138 92 C138 85, 143 80, 143 80 C143 80, 148 85, 148 92 C148 96, 146 98, 143 98 C140 98, 138 96, 138 92 Z" fill="#38bdf8" opacity="0.9"/>
    <!-- Sweat drop tiny trail -->
    <circle cx="143" cy="103" r="2" fill="#38bdf8" opacity="0.8"/>

    <!-- Eyes (Squeezed shut intensely from the spicy heat) -->
    <!-- Left Eye -->
    <path d="M96 114 Q105 124 114 114" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>
    <!-- Right Eye -->
    <path d="M126 114 Q135 124 144 114" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>

    <!-- Eyebrows (Tensed up / expressive) -->
    <path d="M92 106 L112 110" fill="none" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M148 106 L128 110" fill="none" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Open Gasping Mouth (Panting from spicy heat!) -->
    <ellipse cx="120" cy="144" rx="14" ry="16" fill="#7f1d1d"/>
    <!-- Mouth Interior & Tongue -->
    <path d="M106 142 C106 134, 134 134, 134 142 C134 154, 106 154, 106 142 Z" fill="#991b1b"/>
    <path d="M112 150 C112 144, 128 144, 128 150 C128 156, 112 156, 112 150 Z" fill="#ef4444"/>
    <!-- Panting Steam / Heat wave from mouth -->
    <path d="M120 132 C118 126, 122 122, 120 116" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Tongue panting / Heat lines -->
    <path d="M120 148 L120 154" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- FRONT RIM OF BOWL -->
  <path d="M48 148 C48 178, 192 178, 192 148 C192 168, 180 188, 120 188 C60 188, 48 168, 48 148 Z" fill="#e11d48" filter="url(#dropShadow)"/>
  <!-- Bowl Inner Rim Highlight -->
  <path d="M50 148 C50 142, 190 142, 190 148 C190 154, 50 154, 50 148 Z" fill="#ff4d6d" opacity="0.6"/>
  <!-- Bowl Pattern (Traditional Chinese/Asian style wave/stripe accent) -->
  <path d="M75 168 Q120 182 165 168" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round"/>
  <path d="M85 174 Q120 187 155 174" fill="none" stroke="#9f1239" stroke-width="2" stroke-linecap="round"/>

  <!-- PROPS: Spicy Chili Peppers resting near the bowl -->
  <!-- Chili 1 (Left) -->
  <g transform="translate(45, 175) rotate(-25)">
    <path d="M0 10 C-5 0, -15 -10, -25 -5 C-30 -2, -32 5, -25 12 C-15 15, -5 18, 0 10 Z" fill="#dc2626" filter="url(#dropShadow)"/>
    <!-- Stem -->
    <path d="M-25 -5 C-28 -8, -32 -10, -35 -12" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Chili 2 (Right, dynamic angle) -->
  <g transform="translate(185, 170) rotate(45)">
    <path d="M0 10 C8 0, 20 -10, 30 -2 C35 5, 32 12, 22 18 C12 20, 5 18, 0 10 Z" fill="#ef4444" filter="url(#dropShadow)"/>
    <!-- Stem -->
    <path d="M30 -2 C35 -5, 40 -8, 45 -10" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Chopsticks resting across bowl -->
  <g filter="url(#dropShadow)">
    <line x1="75" y1="130" x2="175" y2="155" stroke="#b45309" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="77" y1="134" x2="177" y2="159" stroke="#92400e" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Chopstick tips (lighter wood) -->
    <line x1="75" y1="130" x2="85" y2="132.5" stroke="#fcd34d" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="77" y1="134" x2="87" y2="136.5" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  </g>

</svg>