<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Cinema Marquee / Glow Gradient -->
    <linearGradient id="marqueeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Archway Neon -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Red Velvet Curtain Gradient -->
    <linearGradient id="curtainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting / Wall Texture -->
  <path d="M 0,0 L 240,0 L 240,180 L 0,180 Z" fill="#151e32"/>

  <!-- Ambient Wall Sconces / Lights -->
  <circle cx="45" cy="70" r="15" fill="#f59e0b" opacity="0.15"/>
  <circle cx="195" cy="70" r="15" fill="#f59e0b" opacity="0.15"/>
  <circle cx="45" cy="70" r="4" fill="#fef08a"/>
  <circle cx="195" cy="70" r="4" fill="#fef08a"/>

  <!-- Floor Surface -->
  <path d="M 0,175 L 240,175 L 240,240 L 0,240 Z" fill="url(#floorGrad)"/>
  <!-- Floor Tile Lines (Perspective) -->
  <path d="M 120,175 L 20,240 M 120,175 L 70,240 M 120,175 L 120,240 M 120,175 L 170,240 M 120,175 L 220,240" stroke="#334155" stroke-width="1.5" opacity="0.5"/>
  <!-- Polished Floor Reflection -->
  <ellipse cx="120" cy="180" rx="60" ry="8" fill="#38bdf8" opacity="0.1"/>

  <!-- CINEMA ENTRANCE STRUCTURE (The Main Subject - 'Lối vào') -->
  <!-- Outer Archway Frame -->
  <path d="M 65,180 L 65,65 Q 120,35 175,65 L 175,180 Z" fill="#0f172a" stroke="#334155" stroke-width="3"/>

  <!-- Glowing Neon Strip Border -->
  <path d="M 69,178 L 69,67 Q 120,39 171,67 L 171,178" fill="none" stroke="url(#neonGlow)" stroke-width="3" stroke-linecap="round"/>

  <!-- Inner Deep Corridor / Hallway -->
  <path d="M 75,180 L 75,72 Q 120,48 165,72 L 165,180 Z" fill="#090d16"/>
  <!-- Corridor Perspective Lines -->
  <path d="M 120,110 L 120,180" stroke="#1e293b" stroke-width="2"/>
  <path d="M 120,110 L 90,72" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 120,110 L 150,72" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Red Velvet Curtains (Pulled to sides) -->
  <!-- Left Curtain -->
  <path d="M 75,72 C 85,100 70,140 75,180 L 65,180 L 65,72 Z" fill="url(#curtainGrad)"/>
  <!-- Right Curtain -->
  <path d="M 165,72 C 155,100 170,140 165,180 L 175,180 L 175,72 Z" fill="url(#curtainGrad)"/>

  <!-- Cinema Marquee Sign Above Entrance -->
  <rect x="50" y="22" width="140" height="30" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <rect x="55" y="27" width="130" height="20" rx="3" fill="#1e1b4b"/>
  
  <!-- Marquee Bulb Lights (Yellow Dots) -->
  <circle cx="58" cy="37" r="2" fill="#fef08a"/><circle cx="68" cy="37" r="2" fill="#fef08a"/>
  <circle cx="78" cy="37" r="2" fill="#fef08a"/><circle cx="88" cy="37" r="2" fill="#fef08a"/>
  <circle cx="98" cy="37" r="2" fill="#fef08a"/><circle cx="108" cy="37" r="2" fill="#fef08a"/>
  <circle cx="118" cy="37" r="2" fill="#fef08a"/><circle cx="128" cy="37" r="2" fill="#fef08a"/>
  <circle cx="138" cy="37" r="2" fill="#fef08a"/><circle cx="148" cy="37" r="2" fill="#fef08a"/>
  <circle cx="158" cy="37" r="2" fill="#fef08a"/><circle cx="168" cy="37" r="2" fill="#fef08a"/>
  <circle cx="178" cy="37" r="2" fill="#fef08a"/>

  <!-- Abstract Graphic on Marquee (Film Reel Icon representation) -->
  <circle cx="120" cy="37" r="7" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="120" cy="37" r="2" fill="#38bdf8"/>

  <!-- Ticket Booth / Stanchion Props in Foreground -->
  <!-- Left Stanchion & Velvet Rope -->
  <circle cx="35" cy="185" r="5" fill="#fbbf24"/>
  <rect x="33" y="185" width="4" height="40" rx="2" fill="#fbbf24"/>
  <path d="M 35,190 Q 52,210 70,185" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Stanchion & Velvet Rope -->
  <circle cx="205" cy="185" r="5" fill="#fbbf24"/>
  <rect x="203" y="185" width="4" height="40" rx="2" fill="#fbbf24"/>
  <path d="M 205,190 Q 187,210 170,185" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Popcorn Bucket Prop (Left side foreground) -->
  <g transform="translate(20, 195)">
    <path d="M 4,0 L 16,0 L 18,25 L 2,25 Z" fill="#fff" stroke="#ef4444" stroke-width="2"/>
    <!-- Red stripes -->
    <line x1="7" y1="0" x2="8" y2="25" stroke="#ef4444" stroke-width="2"/>
    <line x1="13" y1="0" x2="12" y2="25" stroke="#ef4444" stroke-width="2"/>
    <!-- Popcorn puffs spilling out -->
    <circle cx="7" cy="-3" r="4" fill="#fef08a"/>
    <circle cx="12" cy="-5" r="5" fill="#fef08a"/>
    <circle cx="14" cy="-1" r="4" fill="#fef08a"/>
  </g>

  <!-- 3D Action / Direction Indicator (Glowing directional arrows pointing inside the entrance) -->
  <g transform="translate(120, 135)" opacity="0.9">
    <path d="M 0,-15 L 0,5 M -6,-1 L 0,7 L 6,-1" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0,-5 L 0,15 M -6,9 L 0,17 L 6,9" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </g>

  <!-- Atmospheric Sparkles / Glowing Particles -->
  <circle cx="105" cy="95" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="135" cy="85" r="2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="95" cy="130" r="1" fill="#ec4899" opacity="0.7"/>
  <circle cx="150" cy="120" r="1.5" fill="#fef08a" opacity="0.6"/>
</svg>