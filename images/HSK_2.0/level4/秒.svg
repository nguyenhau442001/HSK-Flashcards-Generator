<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stopwatch Body Gradient (Metallic Dark Blue/Slate) -->
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Action Orange/Red Gradient for sweep -->
    <linearGradient id="actionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Glow Effect for Speed Trails -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Soft Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Ambient Vector Lines & Speed Orbs for "Seconds/Time" Context -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="120" cy="120" r="105" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 12"/>
    <!-- Floating speed ticks -->
    <line x1="120" y1="10" x2="120" y2="20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="220" x2="120" y2="230" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="120" x2="20" y2="120" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="220" y1="120" x2="230" y2="120" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Motion/Speed Streaks representing elapsed seconds -->
  <g filter="url(#glow)">
    <path d="M 65 55 Q 90 40 120 40" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 45 90 Q 30 120 40 150" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 190 90 Q 210 120 195 160" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- STOPWATCH MAIN GROUP (Center at 120, 125) -->
  <g filter="url(#shadow)">
    <!-- Stopwatch Top Rings and Crown -->
    <path d="M 108 42 L 132 42" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="120" cy="34" r="12" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
    <rect x="116" y="44" width="8" height="10" rx="2" fill="url(#goldGrad)"/>
    
    <!-- Side Buttons (Start/Split) -->
    <!-- Right pusher (Start action) -->
    <rect x="156" y="66" width="12" height="8" rx="3" fill="url(#goldGrad)" transform="rotate(35 156 66)"/>
    <!-- Left pusher (Reset) -->
    <rect x="68" y="72" width="10" height="7" rx="3" fill="url(#goldGrad)" transform="rotate(-35 73 75)"/>

    <!-- Outer Gold Casing -->
    <circle cx="120" cy="130" r="72" fill="url(#goldGrad)"/>
    
    <!-- Inner Slate Casing -->
    <circle cx="120" cy="130" r="65" fill="url(#caseGrad)"/>

    <!-- Stopwatch Dial Face -->
    <circle cx="120" cy="130" r="56" fill="#0f172a"/>

    <!-- Dial Tick Marks (Second markers) -->
    <g stroke="#64748b" stroke-width="2" stroke-linecap="round">
      <line x1="120" y1="76" x2="120" y2="82"/> <!-- 60 sec -->
      <line x1="174" y1="130" x2="168" y2="130"/> <!-- 15 sec -->
      <line x1="120" y1="184" x2="120" y2="178"/> <!-- 30 sec -->
      <line x1="66" y1="130" x2="72" y2="130"/> <!-- 45 sec -->
      
      <!-- Minor ticks -->
      <line x1="158" y1="92" x2="153" y2="96" stroke-width="1" stroke="#475569"/>
      <line x1="158" y1="168" x2="153" y2="164" stroke-width="1" stroke="#475569"/>
      <line x1="82" y1="168" x2="87" y2="164" stroke-width="1" stroke="#475569"/>
      <line x1="82" y1="92" x2="87" y2="96" stroke-width="1" stroke="#475569"/>
    </g>

    <!-- Active Second Progress Arc (Showing swift movement) -->
    <path d="M 120 74 A 56 56 0 0 1 176 130" fill="none" stroke="url(#actionGrad)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

    <!-- Sub-dial (Seconds accumulator at top) -->
    <circle cx="120" cy="102" r="14" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <line x1="120" y1="91" x2="120" y2="96" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="120" y1="96" x2="124" y2="100" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Center Pin -->
    <circle cx="120" cy="130" r="6" fill="url(#goldGrad)"/>

    <!-- Main Second Hand (Action-packed red/orange pointer sweeping fast) -->
    <g filter="url(#glow)">
      <!-- Motion Blur Trail for the Hand -->
      <path d="M 120 130 L 155 95 A 50 50 0 0 1 170 130 Z" fill="#fb923c" opacity="0.3"/>
      <!-- Actual Hand -->
      <line x1="120" y1="130" x2="158" y2="92" stroke="url(#actionGrad)" stroke-width="3" stroke-linecap="round"/>
      <line x1="120" y1="130" x2="105" y2="145" stroke="url(#actionGrad)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Center Cap Pin -->
    <circle cx="120" cy="130" r="3" fill="#ffffff"/>
  </g>

  <!-- Foreground Dynamic Elements (Sparkles & Pulse rings representing 'A split second') -->
  <g transform="translate(120, 125)">
    <!-- Sparkle Top Right -->
    <path d="M 55 -55 Q 55 -35 75 -35 Q 55 -35 55 -15 Q 55 -35 35 -35 Q 55 -35 55 -55 Z" fill="#fbbf24" filter="url(#glow)"/>
    <!-- Sparkle Bottom Left -->
    <path d="M -65 35 Q -65 50 -80 50 Q -65 50 -65 65 Q -65 50 -50 50 Q -65 50 -65 35 Z" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Floating Energy/Time Particles -->
  <circle cx="45" cy="50" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="195" cy="70" r="3" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="180" cy="190" r="5" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="55" cy="195" r="3.5" fill="#10b981" filter="url(#glow)"/>
</svg>