<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Deep Slate Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Room Interior Backdrop -->
  <!-- Floor -->
  <path d="M 0,160 L 240,160 L 240,240 L 0,240 Z" fill="url(#floor-grad)"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="3"/>

  <!-- Wallpaper accent lines -->
  <path d="M 60,0 L 60,160 M 120,0 L 120,160 M 180,0 L 180,160" stroke="#1e293b" stroke-width="2" opacity="0.3"/>

  <!-- Tipped over bookshelf on the left -->
  <g transform="translate(30, 100) rotate(-15)" filter="url(#shadow)">
    <!-- Bookshelf frame -->
    <rect x="0" y="0" width="50" height="90" rx="4" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <rect x="4" y="4" width="42" height="82" fill="#92400e"/>
    <!-- Shelves inside (now vertical) -->
    <line x1="0" y1="30" x2="50" y2="30" stroke="#451a03" stroke-width="2"/>
    <line x1="0" y1="60" x2="50" y2="60" stroke="#451a03" stroke-width="2"/>
  </g>

  <!-- Chaotic Mess / Flying & Scattered Objects -->

  <!-- Spilled Coffee Cup & Splatter (Bottom Right) -->
  <g filter="url(#shadow)">
    <!-- Coffee puddle -->
    <path d="M 160,200 C 160,190 190,195 210,205 C 225,212 215,230 190,225 C 165,220 160,210 160,200 Z" fill="#78350f"/>
    <!-- Cup rolling -->
    <circle cx="170" cy="190" r="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 178,185 C 185,185 188,190 185,195" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Scattered Papers & Flying Documents (Center/Left) -->
  <g filter="url(#shadow)">
    <!-- Paper 1 -->
    <path d="M 70,180 L 110,170 L 120,195 L 80,205 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="80" y1="185" x2="100" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="85" y1="192" x2="105" y2="187" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Paper 2 (Flying) -->
    <path d="M 110,110 L 145,95 L 155,120 L 120,135 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="120" y1="115" x2="135" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="123" y1="122" x2="140" y2="117" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Paper 3 (Crinkled) -->
    <circle cx="65" cy="150" r="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 60,148 Q 65,155 70,148" fill="none" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Flying/Scattered Books -->
  <!-- Book 1 (Teal, Open/Flying) -->
  <g transform="translate(140, 130) rotate(45)" filter="url(#shadow)">
    <path d="M -15,-10 L 0,-15 L 15,-10 L 0, -5 Z" fill="#0d9488"/>
    <rect x="-14" y="-10" width="28" height="20" rx="2" fill="#14b8a6"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#0f766e" stroke-width="2"/>
    <line x1="-10" y1="-3" x2="-4" y2="-3" stroke="#f0fdfa" stroke-width="1.5"/>
    <line x1="-10" y1="2" x2="-4" y2="2" stroke="#f0fdfa" stroke-width="1.5"/>
    <line x1="4" y1="-3" x2="10" y2="-3" stroke="#f0fdfa" stroke-width="1.5"/>
    <line x1="4" y1="2" x2="10" y2="2" stroke="#f0fdfa" stroke-width="1.5"/>
  </g>

  <!-- Book 2 (Orange, Tilted on floor) -->
  <g transform="translate(95, 155) rotate(-30)" filter="url(#shadow)">
    <rect x="-12" y="-16" width="24" height="32" rx="2" fill="#ea580c"/>
    <rect x="-10" y="-14" width="20" height="28" fill="#c2410c"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#9a3412" stroke-width="2"/>
  </g>

  <!-- Book 3 (Purple, mid-air flip) -->
  <g transform="translate(180, 80) rotate(-75)" filter="url(#shadow)">
    <rect x="-10" y="-14" width="20" height="28" rx="2" fill="#9333ea"/>
    <path d="M -10,-14 L 0,-18 L 10,-14 Z" fill="#7e22ce"/>
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#f3e8ff" stroke-width="2"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#f3e8ff" stroke-width="2"/>
  </g>

  <!-- Tangled Lamp Cord & Broken Desk Lamp -->
  <g filter="url(#shadow)">
    <!-- Lamp Shade (Tilted on Floor) -->
    <g transform="translate(130, 185) rotate(60)">
      <path d="M -12,10 L 12,10 L 18,-10 L -18,-10 Z" fill="#f43f5e"/>
      <ellipse cx="0" cy="-10" rx="18" ry="4" fill="#fb7185"/>
      <circle cx="0" cy="10" r="3" fill="#ffe4e6"/>
    </g>

    <!-- Swirling/Tangled Cord -->
    <path d="M 120,180 Q 100,200 80,185 T 60,160 T 90,130 T 130,140" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M 120,180 Q 100,200 80,185 T 60,160 T 90,130 T 130,140" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating debris/particles for dynamic chaos feel -->
  <g fill="#fbbf24">
    <circle cx="50" cy="90" r="3" opacity="0.8"/>
    <circle cx="160" cy="50" r="4" opacity="0.8"/>
    <circle cx="210" cy="140" r="2" opacity="0.8"/>
    <rect x="190" y="110" width="5" height="5" transform="rotate(20 192.5 112.5)" opacity="0.8"/>
    <rect x="75" y="115" width="4" height="6" transform="rotate(-45 77 118)" opacity="0.8"/>
  </g>

  <!-- Action motion lines emphasizing chaotic movement -->
  <path d="M 100,70 Q 110,60 120,75" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 160,110 Q 170,100 165,90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 50,140 Q 40,130 55,120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

</svg>