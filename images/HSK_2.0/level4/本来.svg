<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Window View Gradient (Rainy/Stormy) -->
    <linearGradient id="stormGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Park Scene Gradient (Original Intention) -->
    <linearGradient id="parkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Golden/Warm Glow for Original Plan -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Cards -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient lighting/atmosphere -->
  <circle cx="120" cy="120" r="100" fill="#38bdf8" opacity="0.03"/>

  <!-- SCENE: Split narrative representing "Originally... but..." -->
  <!-- Left/Background context: The Original Plan (Sunny Park / Outdoors) -->
  <g transform="translate(20, 25)">
    <!-- Thought Bubble / Portal Frame representing "Originally..." -->
    <rect x="0" y="0" width="95" height="135" rx="16" fill="url(#parkGrad)" filter="url(#shadow)" opacity="0.85"/>
    <clipPath id="parkClip">
      <rect x="0" y="0" width="95" height="135" rx="16"/>
    </clipPath>
    
    <g clip-path="url(#parkClip)">
      <!-- Sun -->
      <circle cx="75" cy="35" r="16" fill="url(#sunGlow)"/>
      <!-- Park Hills / Trees -->
      <path d="M-10 100 Q 30 70 70 95 T 120 90 L 120 140 L -10 140 Z" fill="#059669" opacity="0.8"/>
      <path d="M20 110 Q 60 80 110 100 L 110 140 L 20 140 Z" fill="#34d399" opacity="0.9"/>
      
      <!-- Picnic Basket Icon representing original intent -->
      <g transform="translate(32, 65)">
        <path d="M5 15 L26 15 L29 32 C29 35 26 37 23 37 L8 37 C5 37 2 35 2 32 Z" fill="#fb923c"/>
        <path d="M2 22 L29 22" stroke="#ea580c" stroke-width="2"/>
        <path d="M9 15 C9 5 22 5 22 15" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Apple inside -->
        <circle cx="15.5" cy="18" r="4" fill="#ef4444"/>
        <path d="M15.5 14 C16 13 17 13 17.5 14" fill="none" stroke="#78350f" stroke-width="1.5"/>
      </g>
      
      <!-- Subtle "Ghost" indicator for Past/Original -->
      <text x="12" y="22" font-family="sans-serif" font-weight="800" font-size="10" fill="#fff" opacity="0.7">1. PLAN</text>
    </g>
  </g>

  <!-- Transition Arrow (Contrasting Shift: "But...") -->
  <g transform="translate(110, 80)">
    <circle cx="10" cy="15" r="14" fill="#1e293b" filter="url(#shadow)" stroke="#475569" stroke-width="2"/>
    <path d="M4 15 L16 15 M11 10 L16 15 L11 20" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right/Foreground context: The Reality (Rainy Window / Indoors) -->
  <g transform="translate(125, 25)">
    <!-- Main Window / Reality Frame -->
    <rect x="0" y="0" width="95" height="135" rx="16" fill="url(#stormGrad)" filter="url(#shadow)" stroke="#475569" stroke-width="2"/>
    <clipPath id="stormClip">
      <rect x="0" y="0" width="95" height="135" rx="16"/>
    </clipPath>

    <g clip-path="url(#stormClip)">
      <!-- Rainy streaks outside window -->
      <path d="M15 10 L10 35" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
      <path d="M45 5 L38 40" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
      <path d="M75 15 L68 50" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
      <path d="M25 50 L18 85" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
      <path d="M60 45 L53 80" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>

      <!-- Window Sill -->
      <rect x="-5" y="115" width="105" height="25" fill="#475569"/>
      <rect x="-5" y="112" width="105" height="5" fill="#64748b"/>

      <!-- Potted plant on sill (cozy indoor element) -->
      <path d="M32 112 L38 95 L57 95 L63 112 Z" fill="#f43f5e"/>
      <ellipse cx="47.5" cy="95" rx="9.5" ry="3" fill="#fda4af"/>
      <!-- Plant stems/leaves -->
      <path d="M47.5 95 Q 40 80 30 85" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="84" r="5" fill="#34d399"/>
      <path d="M47.5 95 Q 55 75 65 82" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <circle cx="67" cy="80" r="6" fill="#34d399"/>
      <path d="M47.5 95 Q 47.5 70 47.5 78" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="47.5" cy="74" r="7" fill="#059669"/>

      <!-- Raindrops pooling on window glass -->
      <circle cx="30" cy="90" r="2.5" fill="#38bdf8" opacity="0.8"/>
      <path d="M30 87 C31 89 31 91 30 92 C29 91 29 89 30 87 Z" fill="#bae6fd"/>

      <text x="12" y="22" font-family="sans-serif" font-weight="800" font-size="10" fill="#38bdf8" opacity="0.9">2. REALITY</text>
    </g>
  </g>

  <!-- Bottom Interactive Focus / Character Setup (Reinforcing the " originalmente " concept) -->
  <g transform="translate(20, 172)">
    <rect x="0" y="0" width="200" height="48" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Mini timeline / progression indicator -->
    <circle cx="28" cy="24" r="10" fill="#38bdf8" opacity="0.2"/>
    <circle cx="28" cy="24" r="5" fill="#38bdf8"/>
    
    <line x1="43" y1="24" x2="85" y2="24" stroke="#475569" stroke-width="3" stroke-dasharray="4 4"/>
    
    <circle cx="100" cy="24" r="10" fill="#f59e0b" opacity="0.2"/>
    <circle cx="100" cy="24" r="5" fill="#f59e0b"/>

    <line x1="115" y1="24" x2="157" y2="24" stroke="#475569" stroke-width="3" stroke-dasharray="4 4"/>

    <circle cx="172" cy="24" r="10" fill="#ef4444" opacity="0.2"/>
    <circle cx="172" cy="24" r="5" fill="#ef4444"/>

    <!-- Small illustrative icons inside the timeline nodes -->
    <!-- Sun icon -->
    <circle cx="28" cy="24" r="3" fill="#fbbf24"/>
    <!-- Pivot icon -->
    <path d="M97 22 L103 24 L97 26 Z" fill="#fff"/>
    <!-- Rain icon -->
    <path d="M170 22 L174 26" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path d="M173 21 L175 23" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>