<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Holographic Screen Glow Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Hologram Line Gradient -->
    <linearGradient id="holoLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Chart Line Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient background grid lines for tactical control room feel -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4">
    <line x1="30" y1="0" x2="30" y2="240"/>
    <line x1="90" y1="0" x2="90" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="210" y1="0" x2="210" y2="240"/>
    <line x1="0" y1="50" x2="240" y2="50"/>
    <line x1="0" y1="110" x2="240" y2="110"/>
    <line x1="0" y1="170" x2="240" y2="170"/>
  </g>

  <!-- Desk / Base Surface -->
  <path d="M 0 195 L 240 195 L 240 240 L 0 240 Z" fill="#0f172a"/>
  <path d="M 0 195 L 240 195" stroke="#334155" stroke-width="2"/>
  <!-- Desk surface glow accent -->
  <line x1="40" y1="195" x2="200" y2="195" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" opacity="0.6"/>

  <!-- Secondary Hologram Projector Device (Left Background) -->
  <g transform="translate(45, 175)">
    <ellipse cx="0" cy="15" rx="22" ry="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M -12 15 L -8 -2 L 8 -2 L 12 15 Z" fill="#334155"/>
    <ellipse cx="0" cy="-2" rx="8" ry="3" fill="#38bdf8" filter="url(#glow)"/>
    <!-- Small projection beam -->
    <path d="M 0 -2 L -18 -35 L 18 -35 Z" fill="url(#screenGrad)" opacity="0.7"/>
    <!-- Floating mini node -->
    <circle cx="0" cy="-35" r="3" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Secondary Hologram Projector Device (Right Background) -->
  <g transform="translate(195, 180)">
    <ellipse cx="0" cy="12" rx="18" ry="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M -10 12 L -6 -2 L 6 -2 L 10 12 Z" fill="#334155"/>
    <ellipse cx="0" cy="-2" rx="6" ry="2" fill="#10b981" filter="url(#glow)"/>
    <!-- Small projection beam -->
    <path d="M 0 -2 L -14 -28 L 14 -28 Z" fill="url(#screenGrad)" opacity="0.5"/>
    <!-- Floating mini node -->
    <circle cx="0" cy="-28" r="2.5" fill="#10b981" filter="url(#glow)"/>
  </g>

  <!-- MAIN HOLOGRAPHIC CONTROL TERMINAL (Center) -->
  <g filter="url(#shadow)">
    <!-- Main Projector Base -->
    <path d="M 80 190 L 160 190 L 175 205 L 65 205 Z" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="120" cy="190" rx="40" ry="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <!-- Projector Core Emitter -->
    <ellipse cx="120" cy="190" rx="24" ry="5" fill="#0f172a"/>
    <ellipse cx="120" cy="190" rx="16" ry="3" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Central Cone Projection Field -->
    <path d="M 120 187 L 25 55 L 215 55 Z" fill="url(#screenGrad)"/>
    
    <!-- Holographic Frame / Main Screen Area -->
    <g>
      <!-- Outer Hex/Panel Frame -->
      <path d="M 50 55 L 190 55 L 210 120 L 190 185 L 50 185 L 30 120 Z" fill="#0f172a" fill-opacity="0.6" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
      <path d="M 55 58 L 185 58 L 203 120 L 185 182 L 55 182 L 37 120 Z" fill="#1e293b" fill-opacity="0.8" stroke="#0284c7" stroke-width="1"/>

      <!-- Scanning Horizontal Lines inside screen -->
      <line x1="42" y1="85" x2="198" y2="85" stroke="url(#holoLine)" stroke-width="1.5"/>
      <line x1="38" y1="120" x2="202" y2="120" stroke="url(#holoLine)" stroke-width="2"/>
      <line x1="42" y1="155" x2="198" y2="155" stroke="url(#holoLine)" stroke-width="1.5"/>

      <!-- Data Visualizations: Dynamic Situation Status -->
      
      <!-- 1. Trend Line Graph (The shifting situation) -->
      <g transform="translate(48, 70)">
        <!-- Grid background for graph -->
        <rect width="144" height="65" rx="4" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
        
        <!-- Graph Area Fill -->
        <path d="M 10 50 L 35 38 L 65 45 L 95 20 L 125 30 L 134 15 L 134 55 L 10 55 Z" fill="url(#chartGrad)"/>
        
        <!-- Trend Line -->
        <path d="M 10 50 L 35 38 L 65 45 L 95 20 L 125 30 L 134 15" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        
        <!-- Data Points / Nodes -->
        <circle cx="35" cy="38" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="65" cy="45" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="95" cy="20" r="4" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
        <circle cx="125" cy="30" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="134" cy="15" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
      </g>

      <!-- 2. Status Metric Bars (Evaluating conditions) -->
      <g transform="translate(48, 142)">
        <!-- Bar 1: Stability -->
        <rect x="0" y="0" width="40" height="6" rx="3" fill="#334155"/>
        <rect x="0" y="0" width="32" height="6" rx="3" fill="#38bdf8" filter="url(#glow)"/>
        <circle cx="46" cy="3" r="2" fill="#38bdf8"/>

        <!-- Bar 2: Activity / Progress -->
        <rect x="54" y="0" width="40" height="6" rx="3" fill="#334155"/>
        <rect x="54" y="0" width="36" height="6" rx="3" fill="#10b981" filter="url(#glow)"/>
        <circle cx="100" cy="3" r="2" fill="#10b981"/>

        <!-- Bar 3: Alert / Warning Level -->
        <rect x="108" y="0" width="26" height="6" rx="3" fill="#334155"/>
        <rect x="108" y="0" width="18" height="6" rx="3" fill="#fbbf24" filter="url(#glow)"/>
        <circle cx="140" cy="3" r="2" fill="#fbbf24"/>
      </g>

      <!-- 3. Floating UI Diagnostic Indicators / Target Crosshairs -->
      <g transform="translate(160, 80)">
        <circle cx="0" cy="0" r="12" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8"/>
        <circle cx="0" cy="0" r="6" fill="#fb923c" fill-opacity="0.3" stroke="#fb923c" stroke-width="1"/>
        <line x1="-16" y1="0" x2="-6" y2="0" stroke="#fb923c" stroke-width="1.5"/>
        <line x1="6" y1="0" x2="16" y2="0" stroke="#fb923c" stroke-width="1.5"/>
        <line x1="0" y1="-16" x2="0" y2="-6" stroke="#fb923c" stroke-width="1.5"/>
        <line x1="0" y1="6" x2="0" y2="16" stroke="#fb923c" stroke-width="1.5"/>
      </g>

      <!-- Security / Status Badge Ring -->
      <g transform="translate(75, 80)">
        <circle cx="0" cy="0" r="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
        <!-- Checkmark icon inside badge -->
        <path d="M -4 0 L -1 3 L 5 -3" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Projector light beam rays spreading down to base -->
    <path d="M 96 187 L 50 55" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M 144 187 L 190 55" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Foreground Atmospheric Particles / Sparkles for Action & Energy -->
  <g fill="#38bdf8">
    <circle cx="35" cy="110" r="1.5" opacity="0.8" filter="url(#glow)"/>
    <circle cx="210" cy="95" r="2" opacity="0.9" filter="url(#glow)"/>
    <circle cx="100" cy="40" r="1.5" opacity="0.6"/>
    <circle cx="140" cy="45" r="2.5" fill="#fbbf24" opacity="0.8" filter="url(#glow)"/>
    <circle cx="190" cy="140" r="1.5" opacity="0.7"/>
    <circle cx="50" cy="160" r="2" fill="#10b981" opacity="0.8" filter="url(#glow)"/>
  </g>

  <!-- Glowing Interface Floating Ring Elements -->
  <ellipse cx="120" cy="55" rx="85" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.6" filter="url(#glow)"/>
</svg>