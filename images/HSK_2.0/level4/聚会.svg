<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for Gradients & Glows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <radialGradient id="warmLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="stringLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#warmLight)" />

  <!-- Background Environment / String Lights -->
  <path d="M 0 30 Q 60 70 120 40 T 240 50" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <path d="M 0 15 Q 120 85 240 25" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Hanging Party Lights -->
  <g fill="#fbbf24">
    <circle cx="45" cy="46" r="4" />
    <circle cx="95" cy="48" r="4" fill="#38bdf8" />
    <circle cx="145" cy="44" r="4" fill="#f43f5e" />
    <circle cx="195" cy="51" r="4" fill="#10b981" />
  </g>

  <!-- Confetti / Party Atmosphere -->
  <g opacity="0.8">
    <polygon points="25,75 28,82 22,80" fill="#f43f5e" />
    <circle cx="210" cy="90" r="2.5" fill="#fbbf24" />
    <rect x="15" y="120" width="5" height="3" rx="1" fill="#38bdf8" transform="rotate(25 17 121)" />
    <rect x="220" y="140" width="6" height="2" rx="1" fill="#10b981" transform="rotate(-15 223 141)" />
    <circle cx="190" cy="65" r="2" fill="#ec4899" />
    <polygon points="55,100 58,105 53,107" fill="#fb923c" />
  </g>

  <!-- Backdrop / Window or Banner hint -->
  <path d="M 60 40 L 180 40 L 200 130 L 40 130 Z" fill="#0f172a" opacity="0.3" />

  <!-- Table Structure -->
  <ellipse cx="120" cy="180" rx="90" ry="25" fill="#0f172a" opacity="0.7" />
  <path d="M 35 170 L 205 170 L 195 210 L 45 210 Z" fill="url(#tableGrad)" />
  <ellipse cx="120" cy="170" rx="85" ry="22" fill="#475569" />
  <ellipse cx="120" cy="167" rx="82" ry="20" fill="#334155" />

  <!-- Central Element: Celebration Cake with Candles & Food Spread -->
  <!-- Cake Stand -->
  <ellipse cx="120" cy="165" rx="35" ry="10" fill="#cbd5e1" />
  <rect x="115" y="150" width="10" height="15" fill="#94a3b8" />
  
  <!-- Cake Base -->
  <path d="M 95 150 C 95 142 145 142 145 150 L 142 162 C 142 168 98 168 98 162 Z" fill="#f43f5e" />
  <!-- Cake Frosting Drips -->
  <path d="M 95 150 Q 102 158 108 150 Q 115 160 120 150 Q 127 158 132 150 Q 139 158 145 150 L 144 153 C 144 153 120 162 96 153 Z" fill="#fbcfe8" />
  
  <!-- Candles -->
  <rect x="111" y="132" width="3" height="18" rx="1" fill="#38bdf8" />
  <ellipse cx="112.5" cy="131" rx="2" ry="3" fill="#fbbf24" />
  
  <rect x="125" y="134" width="3" height="16" rx="1" fill="#10b981" />
  <ellipse cx="126.5" cy="133" rx="2" ry="3" fill="#fbbf24" />

  <!-- Side Dishes / Drinks (Glasses Clinking Vibe) -->
  <!-- Glass Left -->
  <path d="M 60 150 L 68 170 L 52 170 Z" fill="#38bdf8" opacity="0.6" />
  <path d="M 57 158 L 63 158" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
  <line x1="60" y1="170" x2="60" y2="178" stroke="#94a3b8" stroke-width="2" />
  <ellipse cx="60" cy="178" rx="8" ry="3" fill="#64748b" />

  <!-- Glass Right -->
  <path d="M 180 148 L 189 168 L 171 168 Z" fill="#ec4899" opacity="0.6" />
  <path d="M 174 156 L 186 156" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
  <line x1="180" y1="168" x2="180" y2="176" stroke="#94a3b8" stroke-width="2" />
  <ellipse cx="180" cy="176" rx="8" ry="3" fill="#64748b" />

  <!-- Small Bowl of Snacks -->
  <path d="M 75 160 C 75 172 95 172 95 160 Z" fill="#f8fafc" />
  <circle cx="82" cy="161" r="2.5" fill="#f59e0b" />
  <circle cx="88" cy="162" r="2" fill="#f97316" />

  <!-- Gift Box -->
  <g transform="translate(145, 148)">
    <rect x="0" y="5" width="22" height="18" rx="2" fill="#8b5cf6" />
    <rect x="-2" y="3" width="26" height="5" rx="1" fill="#a78bfa" />
    <rect x="9" y="3" width="4" height="20" fill="#fbbf24" />
    <rect x="0" y="11" width="22" height="4" fill="#fbbf24" />
    <!-- Bow -->
    <path d="M 7 3 C 4 0 2 3 7 3 Z" fill="#fbbf24" />
    <path d="M 15 3 C 18 0 20 3 15 3 Z" fill="#fbbf24" />
  </g>

  <!-- People / Silhouettes / Character Arms interacting -->
  <!-- Left Friend (Raised hand cheering) -->
  <path d="M 15 210 Q 18 160 35 150" fill="none" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" />
  <circle cx="35" cy="138" r="9" fill="#fcd34d" /> <!-- Head/Hand placeholder representing cheer -->
  <path d="M 33 135 Q 36 125 42 128" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" /> <!-- Hand waving -->

  <!-- Right Friend (Toasting) -->
  <path d="M 225 210 Q 220 160 205 152" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <circle cx="205" cy="142" r="9" fill="#fcd34d" />
  <path d="M 207 139 Q 198 142 190 138" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

  <!-- Bottom Foreground Vignette Frame Effect -->
  <path d="M 0 240 L 240 240 L 240 220 Q 120 235 0 220 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Sparkles/Celebration Flares -->
  <g fill="#ffffff">
    <path d="M 120 95 L 122 103 L 130 105 L 122 107 L 120 115 L 118 107 L 110 105 L 118 103 Z" opacity="0.8" />
    <path d="M 75 75 L 76 79 L 80 80 L 76 81 L 75 85 L 74 81 L 70 80 L 74 79 Z" opacity="0.5" />
    <path d="M 165 80 L 166 84 L 170 85 L 166 86 L 165 90 L 164 86 L 160 85 L 164 84 Z" opacity="0.6" />
  </g>
</svg>