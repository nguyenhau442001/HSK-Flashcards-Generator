<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Golden Coin Gradients -->
    <linearGradient id="coin-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="coin-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Background Lighting -->
  <circle cx="120" cy="120" r="90" fill="#38bdf8" opacity="0.03" filter="blur(20px)" />
  <circle cx="120" cy="140" r="50" fill="#f59e0b" opacity="0.08" filter="blur(15px)" />

  <!-- SCENE: Modern Desk Environment representing Income (Thu nhập) -->
  <g id="environment">
    <!-- Desk Surface -->
    <path d="M 20,185 L 220,185 L 230,225 L 10,225 Z" fill="#334155" />
    <path d="M 20,185 L 220,185 L 220,190 L 20,190 Z" fill="#475569" />

    <!-- Laptop Base & Screen (Context of work / earning) -->
    <g transform="translate(45, 115)">
      <!-- Laptop Screen Back -->
      <rect x="15" y="-35" width="80" height="50" rx="4" fill="#64748b" />
      <rect x="18" y="-32" width="74" height="44" rx="2" fill="#0f172a" />
      <!-- UI Graphic on Screen (Income Chart / Growth Line) -->
      <path d="M 24,-5 L 35,-15 L 48,-10 L 62,-25 L 75,-12 L 86,-28" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="86" cy="-28" r="3" fill="#38bdf8" />
      
      <!-- Laptop Base -->
      <path d="M 0,15 L 110,15 L 120,25 L -10,25 Z" fill="#94a3b8" />
      <rect x="45" y="18" width="20" height="3" rx="1.5" fill="#475569" />
    </g>

    <!-- Coffee Mug (Cozy Workspace Prop) -->
    <g transform="translate(170, 145)">
      <rect x="0" y="5" width="16" height="20" rx="3" fill="#cbd5e1" />
      <path d="M 16,8 C 22,8 22,18 16,20" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <ellipse cx="8" cy="5" rx="8" ry="3" fill="#f1f5f9" />
      <!-- Coffee Surface -->
      <ellipse cx="8" cy="5" rx="6" ry="2" fill="#78350f" />
    </g>
  </g>

  <!-- MAIN FOCAL POINT: The Treasure Chest Overflowing with Wealth/Income -->
  <g id="treasure-chest" filter="url(#soft-shadow)">
    <!-- Chest Back / Inside shadow -->
    <rect x="75" y="115" width="90" height="35" fill="#451a03" />

    <!-- Overflowing Gold Coins (The Core Visual for "Income" / Thu nhập) -->
    <!-- Layer 1: Back coins -->
    <circle cx="100" cy="115" r="10" fill="url(#coin-edge)" />
    <circle cx="100" cy="114" r="9" fill="url(#coin-face)" />
    <circle cx="125" cy="112" r="11" fill="url(#coin-edge)" />
    <circle cx="125" cy="111" r="10" fill="url(#coin-face)" />
    <circle cx="145" cy="116" r="9" fill="url(#coin-edge)" />
    <circle cx="145" cy="115" r="8" fill="url(#coin-face)" />

    <!-- Layer 2: Middle spilling coins -->
    <circle cx="90" cy="122" r="11" fill="url(#coin-edge)" />
    <circle cx="90" cy="121" r="10" fill="url(#coin-face)" />
    <circle cx="112" cy="118" r="12" fill="url(#coin-edge)" />
    <circle cx="112" cy="117" r="11" fill="url(#coin-face)" />
    <circle cx="135" cy="119" r="10" fill="url(#coin-edge)" />
    <circle cx="135" cy="118" r="9" fill="url(#coin-face)" />
    <circle cx="155" cy="123" r="9" fill="url(#coin-edge)" />
    <circle cx="155" cy="122" r="8" fill="url(#coin-face)" />

    <!-- Layer 3: Front spilling pile -->
    <ellipse cx="100" cy="130" rx="10" ry="7" fill="url(#coin-edge)" />
    <ellipse cx="100" cy="129" rx="9" ry="6" fill="url(#coin-face)" />
    
    <ellipse cx="120" cy="126" rx="12" ry="8" fill="url(#coin-edge)" />
    <ellipse cx="120" cy="125" rx="11" ry="7" fill="url(#coin-face)" />

    <ellipse cx="140" cy="129" rx="11" ry="7" fill="url(#coin-edge)" />
    <ellipse cx="140" cy="128" rx="10" ry="6" fill="url(#coin-face)" />

    <!-- Chest Body (Wood & Metal Reinforcements) -->
    <path d="M 65,135 L 175,135 L 170,175 L 70,175 Z" fill="#92400e" />
    <path d="M 68,135 L 172,135 L 168,172 L 72,172 Z" fill="#b45309" />
    
    <!-- Wooden Planks Horizontal Lines -->
    <line x1="68" y1="148" x2="172" y2="148" stroke="#78350f" stroke-width="2" />
    <line x1="70" y1="161" x2="170" y2="161" stroke="#78350f" stroke-width="2" />

    <!-- Metal Straps -->
    <rect x="85" y="135" width="12" height="40" fill="#cbd5e1" />
    <rect x="87" y="135" width="8" height="40" fill="#f1f5f9" />
    <rect x="143" y="135" width="12" height="40" fill="#cbd5e1" />
    <rect x="145" y="135" width="8" height="40" fill="#f1f5f9" />

    <!-- Chest Open Lid -->
    <path d="M 65,135 C 60,100 80,75 120,75 C 160,75 180,100 175,135 Z" fill="#78350f" />
    <path d="M 68,133 C 64,102 82,80 120,80 C 158,80 176,102 172,133 Z" fill="#b45309" />
    <!-- Lid Metal Rim -->
    <path d="M 65,135 C 60,100 80,75 120,75 C 160,75 180,100 175,135" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <rect x="114" y="127" width="12" height="12" rx="2" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
  </g>

  <!-- ACTION & DYNAMICS: Flying Coins & Success Sparkles (Indicating active incoming wealth) -->
  <g id="dynamic-wealth" filter="url(#glow)">
    <!-- Floating Coin 1 -->
    <g transform="translate(70, 85) rotate(-15)">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="url(#coin-edge)" />
      <ellipse cx="0" cy="-1" rx="8" ry="5" fill="url(#coin-face)" />
    </g>

    <!-- Floating Coin 2 -->
    <g transform="translate(170, 75) rotate(25)">
      <ellipse cx="0" cy="0" rx="10" ry="7" fill="url(#coin-edge)" />
      <ellipse cx="0" cy="-1" rx="9" ry="6" fill="url(#coin-face)" />
    </g>

    <!-- Floating Coin 3 -->
    <g transform="translate(150, 50) rotate(10)">
      <ellipse cx="0" cy="0" rx="8" ry="5" fill="url(#coin-edge)" />
      <ellipse cx="0" cy="-1" rx="7" ry="4" fill="url(#coin-face)" />
    </g>

    <!-- Upward Growth Arrow (Subtle neon motif) -->
    <path d="M 185,110 L 205,90 L 205,102" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 205,90 L 193,90" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sparkles / Stars -->
    <!-- Star 1 -->
    <path d="M 55,60 Q 55,70 45,70 Q 55,70 55,80 Q 55,70 65,70 Q 55,70 55,60 Z" fill="#fbbf24" />
    <!-- Star 2 -->
    <path d="M 130,45 Q 130,55 120,55 Q 130,55 130,65 Q 130,55 140,55 Q 130,55 130,45 Z" fill="#38bdf8" />
    <!-- Star 3 -->
    <path d="M 195,135 Q 195,141 189,141 Q 195,141 195,147 Q 195,141 201,141 Q 195,141 195,135 Z" fill="#fbbf24" />
  </g>

  <!-- Foreground Atmospheric Lighting -->
  <circle cx="120" cy="180" r="70" fill="#f59e0b" opacity="0.05" filter="blur(10px)" />
</svg>