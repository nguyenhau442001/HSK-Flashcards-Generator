<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" rx="10" fill="#334155"/>
  
  <!-- Magnifying Glass -->
  <circle cx="120" cy="110" r="45" fill="none" stroke="#fbbf24" stroke-width="6"/>
  <path d="M150 140 L180 170" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Character: Focused Eye -->
  <path d="M85 110 Q120 70 155 110 Q120 150 85 110" fill="#f8fafc"/>
  <circle cx="120" cy="110" r="15" fill="#0f172a"/>
  <circle cx="125" cy="105" r="5" fill="#ffffff"/>
  
  <!-- Details on Desk -->
  <rect x="40" y="175" width="30" height="40" rx="2" fill="#ec4899"/>
  <rect x="170" y="180" width="40" height="30" rx="2" fill="#38bdf8"/>
  
  <!-- Light Particles -->
  <circle cx="190" cy="80" r="3" fill="#fb923c"/>
  <circle cx="50" cy="60" r="2" fill="#fb923c"/>
  <circle cx="210" cy="130" r="2" fill="#10b981"/>
  
  <!-- Eyebrow (Expression of focus) -->
  <path d="M95 90 Q120 75 145 90" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>