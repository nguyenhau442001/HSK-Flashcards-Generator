<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Telescope Base -->
  <rect x="80" y="140" width="80" height="10" rx="2" fill="#475569"/>
  <path d="M100 140 L110 90 L130 90 L140 140 Z" fill="#64748b"/>
  
  <!-- Telescope Body -->
  <rect x="90" y="70" width="60" height="20" rx="10" fill="#38bdf8" transform="rotate(-20 120 80)"/>
  <circle cx="150" cy="60" r="12" fill="#fbbf24" opacity="0.8"/>
  
  <!-- Stars and Cosmic Elements -->
  <circle cx="40" cy="40" r="2" fill="#f8fafc"/>
  <circle cx="200" cy="30" r="3" fill="#f8fafc"/>
  <circle cx="180" cy="100" r="2" fill="#f8fafc"/>
  <circle cx="50" cy="120" r="1.5" fill="#f8fafc"/>
  
  <!-- Glowing Future Path / Light Beam -->
  <path d="M150 70 L220 20 L230 40 Z" fill="#fb923c" opacity="0.3"/>
  
  <!-- Compass / Map Detail -->
  <circle cx="40" cy="190" r="25" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <path d="M40 170 L40 210 M20 190 L60 190" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
  <circle cx="40" cy="190" r="5" fill="#ec4899"/>
  
  <!-- Floating Book/Journal -->
  <rect x="160" y="160" width="50" height="40" rx="4" fill="#10b981"/>
  <path d="M165 170 L205 170 M165 180 L205 180 M165 190 L190 190" stroke="#064e3b" stroke-width="2" stroke-linecap="round"/>
</svg>