<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Dream Portal Glow Gradient -->
    <radialGradient id="dreamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Moon/Cosmic Glow -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Stars in the background -->
  <g fill="#93c5fd" opacity="0.6">
    <circle cx="35" cy="45" r="1.5" />
    <circle cx="85" cy="25" r="1" />
    <circle cx="195" cy="65" r="1.5" />
    <circle cx="215" cy="125" r="1" />
    <circle cx="25" cy="155" r="1.5" />
    <circle cx="55" cy="205" r="1" />
  </g>

  <!-- Bedroom Interior: Wall and Floor -->
  <path d="M0 0 H240 V165 L0 185 Z" fill="#151c2e" />
  <!-- Floor -->
  <path d="M0 165 L240 185 V240 H0 Z" fill="#0f1423" />
  <!-- Floor line/skirting board -->
  <line x1="0" y1="165" x2="240" y2="185" stroke="#2a3656" stroke-width="2" />
  <line x1="0" y1="183" x2="240" y2="203" stroke="#0a0e17" stroke-width="2" />

  <!-- Window showing night sky & moon -->
  <g transform="translate(160, 20)">
    <rect width="55" height="75" rx="6" fill="#090d16" stroke="#2a3656" stroke-width="3" />
    <circle cx="38" cy="25" r="10" fill="url(#moonGrad)" />
    <!-- Window frame cross -->
    <line x1="0" y1="37" x2="55" y2="37" stroke="#2a3656" stroke-width="2" />
    <line x1="27" y1="0" x2="27" y2="75" stroke="#2a3656" stroke-width="2" />
    <!-- Window sill -->
    <rect x="-3" y="75" width="61" height="5" rx="2" fill="#334155" />
    <!-- Tiny potted plant on windowsill -->
    <path d="M12 75 L15 67 H21 L24 75 Z" fill="#f43f5e" />
    <path d="M18 67 C15 63 14 60 18 57 C22 60 21 63 18 67 Z" fill="#10b981" />
  </g>

  <!-- Nightstand Table -->
  <g transform="translate(15, 125)">
    <rect x="0" y="0" width="50" height="55" rx="4" fill="#3b2f2f" stroke="#4a3a3a" stroke-width="1" />
    <!-- Drawer handle -->
    <rect x="18" y="16" width="14" height="4" rx="2" fill="#cbd5e1" />
    <!-- Open lower shelf area -->
    <rect x="6" y="32" width="38" height="18" fill="#251d1d" />
    <!-- Book stack on shelf -->
    <rect x="10" y="38" width="20" height="4" rx="1" fill="#38bdf8" />
    <rect x="12" y="42" width="18" height="4" rx="1" fill="#f43f5e" />
  </g>

  <!-- Bed / Pillow Setup (Lower Left foreground) -->
  <g transform="translate(15, 140)">
    <!-- Bed headboard hint -->
    <path d="M-5 -20 H10 V15 H-5 Z" fill="#2d3748" />
    <!-- Fluffy Pillow -->
    <rect x="5" y="-12" width="55" height="30" rx="12" fill="#f8fafc" filter="url(#shadow)" />
    <rect x="8" y="-9" width="49" height="24" rx="9" fill="#e2e8f0" />
    <!-- Blanket/Quilt edge -->
    <path d="M35 15 C60 10 90 20 120 10 V55 H35 Z" fill="#3b82f6" />
    <path d="M35 15 C60 10 90 20 120 10 V25 C90 35 60 25 35 30 Z" fill="#60a5fa" />
  </g>

  <!-- Sleeping Character (Head and hair visible) -->
  <g transform="translate(32, 133)">
    <!-- Head -->
    <circle cx="15" cy="5" r="14" fill="#fbcfe8" />
    <!-- Closed peaceful eyes (lashes) -->
    <path d="M10 5 Q13 8 16 5" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
    <!-- Cute rosy cheek -->
    <circle cx="19" cy="9" r="3" fill="#fb7185" opacity="0.6" />
    <!-- Hair -->
    <path d="M1 0 C2 -8 10 -10 18 -9 C26 -8 29 0 29 5 C29 7 28 8 28 8 C26 4 23 -2 15 -3 C7 -2 3 3 1 0 Z" fill="#334155" />
    <!-- Zzz floating up -->
    <g fill="#93c5fd" opacity="0.8" font-weight="bold">
      <text x="35" y="-10" font-size="12" font-family="sans-serif">z</text>
      <text x="45" y="-25" font-size="16" font-family="sans-serif">Z</text>
      <text x="58" y="-42" font-size="20" font-family="sans-serif">Z</text>
    </g>
  </g>

  <!-- Bedside Lamp with Warm Glow -->
  <g transform="translate(35, 100)">
    <!-- Lamp Glow Effect -->
    <circle cx="5" cy="0" r="35" fill="url(#lampGlow)" />
    <!-- Stand -->
    <path d="M2 15 H8 V32 H2 Z" fill="#64748b" />
    <ellipse cx="5" cy="32" rx="7" ry="3" fill="#475569" />
    <!-- Shade -->
    <path d="M-5 15 H15 L11 2 C10 0 8 0 5 0 C2 0 0 0 -1 2 Z" fill="#fbbf24" />
    <ellipse cx="5" cy="15" rx="10" ry="3" fill="#f59e0b" />
  </g>

  <!-- MAGICAL DREAM PORTAL (The core representation of "梦" / Dream) -->
  <!-- Rises dynamically from the sleeper's head into the room -->
  <g transform="translate(125, 95)">
    <!-- Background Dream Aura -->
    <circle cx="0" cy="0" r="55" fill="url(#dreamGlow)" filter="url(#glow)" />

    <!-- Swirling Dream Portal Ring -->
    <ellipse cx="0" cy="0" rx="50" ry="35" fill="none" stroke="url(#dreamGlow)" stroke-width="4" stroke-dasharray="10 6" transform="rotate(-15)" />
    <ellipse cx="0" cy="0" rx="42" ry="28" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" transform="rotate(25)" />

    <!-- Floating Magical Dream Elements (Whimsical Landscape inside the dream) -->
    <!-- Mini floating island -->
    <g transform="translate(-15, 10)">
      <!-- Land mass -->
      <path d="M-20 0 C-10 15 10 15 20 0 C15 -5 -15 -5 -20 0 Z" fill="#10b981" />
      <path d="M-20 0 C-10 15 10 15 20 0 C15 5 10 8 0 8 C-10 8 -15 5 -20 0 Z" fill="#047857" />
      <!-- Tiny tree -->
      <path d="M0 0 V-12" stroke="#78350f" stroke-width="2" />
      <circle cx="0" cy="-15" r="8" fill="#f43f5e" />
      <circle cx="-5" cy="-12" r="6" fill="#fb7185" />
    </g>

    <!-- Floating Dream Castle / Tower -->
    <g transform="translate(18, -12) scale(0.6)">
      <rect x="-8" y="-10" width="16" height="20" fill="#c084fc" rx="2" />
      <polygon points="-12,-10 0,-22 12,-10" fill="#f43f5e" />
      <rect x="-3" y="2" width="6" height="8" fill="#38bdf8" />
    </g>

    <!-- Floating Crescent Moon inside Dream -->
    <g transform="translate(-25, -25) scale(0.8)">
      <path d="M 0 -10 A 10 10 0 1 0 10 0 A 8 8 0 1 1 0 -10 Z" fill="#fbbf24" />
    </g>

    <!-- Magical Star in Dream -->
    <g transform="translate(10, 15) scale(0.7)" filter="url(#glow)">
      <path d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z" fill="#fef08a" />
    </g>
    <g transform="translate(-8, -8) scale(0.4)" filter="url(#glow)">
      <path d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z" fill="#38bdf8" />
    </g>

    <!-- Floating dreamy bubbles / sparkles -->
    <circle cx="35" cy="-2" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="-38" cy="15" r="2" fill="#c084fc" opacity="0.8" />
    <circle cx="25" cy="25" r="2.5" fill="#f43f5e" opacity="0.8" />
    <circle cx="-2" cy="-32" r="3.5" fill="#fbbf24" opacity="0.9" />

    <!-- Connecting swirl path from sleeper to dream -->
    <path d="M-85 35 C-50 45 -35 25 -20 15" fill="none" stroke="url(#dreamGlow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.7" />
  </g>

  <!-- Foreground decorative elements for depth (Bookshelf corner or plant) -->
  <g transform="translate(205, 130)">
    <path d="M10 20 C5 15 0 25 5 35 C10 45 25 35 20 25 C15 15 15 25 10 20 Z" fill="#047857" opacity="0.3" />
  </g>
</svg>