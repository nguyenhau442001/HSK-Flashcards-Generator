<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100% " stop-color="#090d16" />
    </linearGradient>

    <!-- Window Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Holographic Projection Gradient -->
    <linearGradient id="holoBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Environment / Room Details -->
  <!-- Back Wall -->
  <rect x="20" y="20" width="200" height="150" fill="#1e293b" rx="4" />
  
  <!-- Large Arch Window showing futuristic city / dreams outside -->
  <path d="M 85 35 L 155 35 A 35 35 0 0 1 190 70 L 190 120 L 50 120 L 50 70 A 35 35 0 0 1 85 35 Z" fill="url(#nightSky)" />
  
  <!-- Tiny City Lights outside window -->
  <circle cx="70" cy="100" r="1" fill="#38bdf8" opacity="0.6" />
  <circle cx="80" cy="110" r="1.5" fill="#f43f5e" opacity="0.5" />
  <circle cx="100" cy="95" r="1" fill="#fbbf24" opacity="0.7" />
  <circle cx="120" cy="105" r="1" fill="#38bdf8" opacity="0.8" />
  <circle cx="150" cy="90" r="1.5" fill="#10b981" opacity="0.7" />
  <circle cx="170" cy="100" r="1" fill="#fbbf24" opacity="0.5" />

  <!-- Window Frame -->
  <path d="M 85 35 L 155 35 A 35 35 0 0 1 190 70 L 190 120 L 50 120 L 50 70 A 35 35 0 0 1 85 35 Z" fill="none" stroke="#334155" stroke-width="3" />
  <line x1="120" y1="35" x2="120" y2="120" stroke="#334155" stroke-width="2" />
  <line x1="50" y1="85" x2="190" y2="85" stroke="#334155" stroke-width="2" />

  <!-- Wall Shelf with Prop (Anatomy model / Medical jar silhouette hinting at aspiration) -->
  <rect x="25" y="65" width="20" height="4" fill="#475569" rx="1" />
  <path d="M 31 65 L 31 57 C 31 55, 39 55, 39 57 L 39 65 Z" fill="#64748b" />
  <circle cx="35" cy="54" r="3" fill="#38bdf8" opacity="0.8" />

  <!-- Ambient Wall Light / Sticky Notes (Dream planning) -->
  <rect x="195" y="50" width="14" height="18" fill="#fde047" rx="2" transform="rotate(12 202 59)" opacity="0.85" />
  <line x1="198" y1="55" x2="205" y2="55" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" />
  <line x1="198" y1="59" x2="207" y2="59" stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" />

  <!-- Floor/Desk Surface -->
  <path d="M 10 170 L 230 170 L 220 220 L 20 220 Z" fill="#0f172a" />
  <line x1="10" y1="170" x2="230" y2="170" stroke="#334155" stroke-width="3" />

  <!-- Desk / Workstation Surface -->
  <rect x="25" y="160" width="190" height="15" fill="#334155" rx="3" />
  <rect x="35" y="175" width="170" height="8" fill="#1e293b" />

  <!-- MAIN SCENE: The Doctor's Dream Projection / Ambition (Medical Hologram / Aspiration) -->
  <!-- Hologram Projector Base on Desk -->
  <path d="M 95 165 L 145 165 L 135 160 L 105 160 Z" fill="#64748b" />
  <ellipse cx="120" cy="162" rx="15" ry="3" fill="#38bdf8" filter="url(#glow)" />

  <!-- Holographic Cone/Beam of Light representing 'Future Vision / Ideal' -->
  <polygon points="120,100 85,160 155,160" fill="url(#holoBeam)" />
  <polygon points="120,100 100,160 140,160" fill="#38bdf8" opacity="0.15" />

  <!-- Floating Hologram Elements: Stethoscope and Medical Cross (Visualizing the 'Ideal' / Profession Goal) -->
  <g transform="translate(120, 115)" filter="url(#glow)">
    <!-- Glowing Medical Cross (The Core Ideal) -->
    <rect x="-8" y="-22" width="16" height="44" fill="#38bdf8" rx="3" />
    <rect x="-22" y="-8" width="44" height="16" fill="#38bdf8" rx="3" />
    <rect x="-5" y="-18" width="10" height="36" fill="#e0f2fe" rx="2" />
    <rect x="-18" y="-5" width="36" height="10" fill="#e0f2fe" rx="2" />

    <!-- Stethoscope Hologram Ringing the cross -->
    <path d="M -18 -25 C -25 -25, -28 -15, -20 -5 C -15 2, -12 6, -12 12 C -12 18, -6 22, 0 22 C 6 22, 12 18, 12 12 C 12 6, 15 2, 20 -5 C 28 -15, 25 -25, 18 -25" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
    <!-- Stethoscope Chestpiece -->
    <circle cx="0" cy="25" r="5" fill="#10b981" />
    <circle cx="0" cy="25" r="2" fill="#ec4899" />
  </g>

  <!-- Sparkles / Aspirations Floating around -->
  <g fill="#fbbf24" filter="url(#glow)">
    <path d="M 75 130 Q 75 125 70 125 Q 75 125 75 120 Q 75 125 80 125 Q 75 125 75 130 Z" />
    <path d="M 165 110 Q 165 106 161 106 Q 165 106 165 102 Q 165 106 169 106 Q 165 106 165 110 Z" />
    <path d="M 145 80 Q 145 77 142 77 Q 145 77 145 74 Q 145 77 148 77 Q 145 77 145 80 Z" fill="#38bdf8" />
    <circle cx="95" cy="90" r="2" fill="#38bdf8" />
    <circle cx="150" cy="140" r="1.5" fill="#fbbf24" />
  </g>

  <!-- Foreground Desk Props -->
  <!-- Notebook and Pen (Studying hard to achieve the ideal) -->
  <g transform="translate(45, 150)">
    <!-- Open Book -->
    <path d="M 0 15 Q 25 10 50 15 L 50 30 Q 25 25 0 30 Z" fill="#e2e8f0" />
    <path d="M 50 15 Q 75 10 100 15 L 100 30 Q 75 25 50 30 Z" fill="#f8fafc" />
    <!-- Book spine / pages lines -->
    <line x1="50" y1="15" x2="50" y2="30" stroke="#cbd5e1" stroke-width="2" />
    <line x1="12" y1="19" x2="38" y2="17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="15" y1="23" x2="35" y2="21" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="62" y1="17" x2="88" y2="19" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="65" y1="21" x2="85" y2="23" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Pen lying across -->
    <line x1="30" y1="25" x2="70" y2="10" stroke="#ec4899" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 68 11 L 72 9 L 71 13 Z" fill="#fbbf24" />
  </g>

  <!-- Coffee Mug (Late night studying for the dream) -->
  <g transform="translate(175, 145)">
    <rect x="0" y="5" width="16" height="20" rx="3" fill="#f43f5e" />
    <path d="M 16 9 C 22 9, 22 19, 16 19" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 5 1 C 8 -2, 2 -5, 5 -8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 11 1 C 14 -2, 8 -5, 11 -8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Silhouette of the aspiring person/student looking up at the dream projection -->
  <g transform="translate(0, 15)">
    <!-- Back/Shoulders and Head -->
    <path d="M 180 185 C 170 170, 160 160, 145 160 C 130 160, 120 170, 115 185 L 115 205 L 180 205 Z" fill="#1e293b" />
    <!-- Hoodie / Jacket (Cozy study attire) -->
    <path d="M 115 185 C 120 170, 130 160, 145 160 C 160 160, 170 170, 180 185 L 185 205 L 105 205 Z" fill="#2563eb" />
    <!-- Collar -->
    <path d="M 135 160 L 145 172 L 155 160 Z" fill="#1d4ed8" />
    
    <!-- Neck -->
    <rect x="139" y="148" width="12" height="15" fill="#fbcfe8" rx="3" />

    <!-- Head profile turning upward towards the medical holographic vision -->
    <path d="M 135 138 C 132 142, 135 150, 142 150 C 150 150, 158 142, 155 134 C 158 128, 152 120, 145 122 C 138 120, 132 128, 135 138 Z" fill="#fbcfe8" />
    
    <!-- Hair (Styled neat student hair) -->
    <path d="M 134 130 C 132 122, 140 118, 147 119 C 154 120, 157 126, 156 132 C 152 127, 144 126, 134 130 Z" fill="#0f172a" />

    <!-- Determined / Inspired Eye glint facing the ideal projection -->
    <circle cx="150" cy="134" r="1.5" fill="#0f172a" />
    <path d="M 148 131 Q 151 130 153 132" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Ambient Lighting Glow on Desk from Hologram -->
  <ellipse cx="120" cy="165" rx="30" ry="6" fill="#38bdf8" opacity="0.3" filter="url(#softGlow)" />

  <!-- Outer frame inset line for polished UI badge look -->
  <rect x="12" y="12" width="216" height="216" rx="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" />
</svg>