<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Building Gradients -->
    <linearGradient id="buildGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="buildGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Skyline Lights -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Road Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements (City Silhouette & Lights) -->
  <g opacity="0.4">
    <!-- Distant buildings -->
    <rect x="20" y="70" width="30" height="90" fill="url(#buildGrad1)" />
    <rect x="55" y="50" width="35" height="110" fill="url(#buildGrad2)" />
    <rect x="95" y="85" width="25" height="75" fill="url(#buildGrad1)" />
    <rect x="125" y="60" width="40" height="100" fill="url(#buildGrad2)" />
    <rect x="170" y="80" width="50" height="80" fill="url(#buildGrad1)" />

    <!-- Building Windows (Tiny glowing dots) -->
    <fill color="#fde047" opacity="0.8">
      <rect x="26" y="80" width="4" height="6" fill="#fde047" />
      <rect x="36" y="80" width="4" height="6" fill="#fde047" />
      <rect x="26" y="95" width="4" height="6" fill="#38bdf8" />
      <rect x="36" y="95" width="4" height="6" fill="#fde047" />

      <rect x="65" y="60" width="5" height="8" fill="#fde047" />
      <rect x="75" y="60" width="5" height="8" fill="#fde047" />
      <rect x="65" y="75" width="5" height="8" fill="#fde047" />
      <rect x="75" y="75" width="5" height="8" fill="#38bdf8" />
      <rect x="65" y="90" width="5" height="8" fill="#38bdf8" />
      <rect x="75" y="90" width="5" height="8" fill="#fde047" />

      <rect x="135" y="70" width="6" height="8" fill="#fde047" />
      <rect x="148" y="70" width="6" height="8" fill="#fde047" />
      <rect x="135" y="88" width="6" height="8" fill="#38bdf8" />
      <rect x="148" y="88" width="6" height="8" fill="#fde047" />
    </fill>
    <!-- Neon architectural accents -->
    <line x1="55" y1="50" x2="90" y2="50" stroke="url(#neonPink)" stroke-width="2" filter="url(#softGlow)" />
    <line x1="125" y1="60" x2="165" y2="60" stroke="url(#neonBlue)" stroke-width="2" filter="url(#softGlow)" />
  </g>

  <!-- Elevated Highway / Multi-level Traffic Structure -->
  <!-- Under-bridge shadow -->
  <path d="M 0 150 Q 120 130 240 150 L 240 180 Q 120 160 0 180 Z" fill="#090d16" />
  
  <!-- Overpass Structure -->
  <path d="M -10 135 Q 120 110 250 135 L 250 155 Q 120 130 -10 155 Z" fill="#475569" />
  <path d="M -10 130 Q 120 105 250 130 L 250 135 Q 120 110 -10 135 Z" fill="#64748b" />
  <!-- Highway pillars -->
  <rect x="60" y="145" width="12" height="60" fill="#334155" />
  <rect x="170" y="145" width="12" height="60" fill="#334155" />

  <!-- Overpass Traffic Flow (Speed lines / light trails) -->
  <path d="M 10 125 Q 120 100 230 122" stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.6" filter="url(#softGlow)" stroke-dasharray="15 10" />
  <path d="M 5 138 Q 120 113 235 135" stroke="#ef4444" stroke-width="2" fill="none" opacity="0.6" filter="url(#softGlow)" />

  <!-- Main Multi-Lane Urban Street (Foreground) -->
  <path d="M -10 170 C 60 165, 120 170, 250 190 L 250 240 L -10 240 Z" fill="url(#roadGrad)" />
  
  <!-- Perspective Road Markings (Dashed Center Lines) -->
  <path d="M 10 195 Q 120 180 240 205" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-dasharray="8 6" opacity="0.9" />
  <path d="M 0 215 Q 120 198 245 224" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="12 8" />

  <!-- Traffic Light Pole & Signal (Right Side) -->
  <g transform="translate(195, 80)">
    <!-- Pole -->
    <rect x="8" y="30" width="4" height="95" fill="#64748b" />
    <rect x="2" y="30" width="16" height="3" fill="#475569" />
    <!-- Housing -->
    <rect x="0" y="5" width="20" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <!-- Red Light (Off) -->
    <circle cx="10" cy="13" r="3.5" fill="#7f1d1d" />
    <!-- Yellow Light (Off) -->
    <circle cx="10" cy="23" r="3.5" fill="#78350f" />
    <!-- Green Light (Active / Glowing) -->
    <circle cx="10" cy="33" r="3.5" fill="#10b981" filter="url(#glow)" />
    <circle cx="10" cy="33" r="2" fill="#d1fae5" />
    <!-- Visor hoods -->
    <path d="M 5 9 L 15 9 L 13 11 L 7 11 Z" fill="#475569" />
    <path d="M 5 19 L 15 19 L 13 21 L 7 21 Z" fill="#475569" />
    <path d="M 5 29 L 15 29 L 13 31 L 7 31 Z" fill="#475569" />
  </g>

  <!-- SECONDARY VEHICLE: Modern Sleek Electric Car (Background Lane) -->
  <g transform="translate(40, 168) scale(0.65)">
    <!-- Motion lines -->
    <line x1="-15" y1="15" x2="-5" y2="15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="-22" y1="20" x2="-8" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    
    <!-- Car Body (Cyan Electric) -->
    <path d="M 10 25 Q 25 10 55 10 L 85 15 Q 105 18 115 28 L 120 35 L 5 35 Z" fill="#06b6d4" />
    <path d="M 35 12 L 65 12 L 80 24 L 25 24 Z" fill="#1e293b" opacity="0.8" /> <!-- Windows -->
    <!-- Headlight -->
    <path d="M 112 28 L 118 31 L 112 34 Z" fill="#fef08a" filter="url(#glow)" />
    <!-- Wheels -->
    <circle cx="32" cy="35" r="9" fill="#0f172a" stroke="#64748b" stroke-width="3" />
    <circle cx="95" cy="35" r="9" fill="#0f172a" stroke="#64748b" stroke-width="3" />
  </g>

  <!-- PRIMARY VEHICLE: Dynamic Modern City Scooter / Delivery Moped (Foreground) -->
  <g transform="translate(85, 175)">
    <!-- Speed Lines Behind -->
    <g opacity="0.6">
      <line x1="-15" y1="20" x2="-2" y2="20" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)" />
      <line x1="-25" y1="28" x2="-5" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)" />
      <line x1="-12" y1="36" x2="-2" y2="36" stroke="#fb923c" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Scooter Shadow -->
    <ellipse cx="42" cy="46" rx="35" ry="5" fill="#020617" opacity="0.6" />

    <!-- Back Wheel -->
    <circle cx="18" cy="36" r="11" fill="#090d16" />
    <circle cx="18" cy="36" r="7" fill="#334155" />
    <circle cx="18" cy="36" r="2.5" fill="#94a3b8" />
    
    <!-- Front Wheel -->
    <circle cx="68" cy="36" r="11" fill="#090d16" />
    <circle cx="68" cy="36" r="7" fill="#334155" />
    <circle cx="68" cy="36" r="2.5" fill="#94a3b8" />

    <!-- Scooter Body & Floorboard (Vibrant Orange & White Accent) -->
    <path d="M 15 28 L 30 18 L 58 18 L 72 32 L 60 38 L 20 38 Z" fill="#f97316" />
    <path d="M 28 38 L 62 38 L 65 40 L 25 40 Z" fill="#c2410c" /> <!-- Foot rest -->

    <!-- Front Shield / Cowling -->
    <path d="M 55 16 L 72 32 L 68 36 L 50 20 Z" fill="#ea580c" />
    <circle cx="64" cy="27" r="4" fill="#fef08a" filter="url(#glow)" /> <!-- Headlight -->

    <!-- Rear Body & Storage Box (Delivery/Commuter style) -->
    <path d="M 12 18 L 30 18 L 25 36 L 10 36 Z" fill="#f97316" />
    <!-- Top Box / Delivery Case -->
    <rect x="5" y="4" width="20" height="16" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="8" y="9" width="14" height="3" rx="1.5" fill="#38bdf8" /> <!-- Accent strip on box -->

    <!-- Seat -->
    <path d="M 22 15 L 42 13 L 44 17 L 22 18 Z" fill="#1e293b" />

    <!-- Handlebar & Steering Stem -->
    <path d="M 52 18 L 58 7 L 62 7" stroke="#334155" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle cx="62" cy="7" r="2.5" fill="#06b6d4" /> <!-- Grip / Brake lever -->

    <!-- Rider Character -->
    <!-- Torso (Friendly blue jacket with motion lean) -->
    <path d="M 28 16 C 32 8, 42 8, 48 15 L 42 28 C 38 30, 32 28, 28 26 Z" fill="#3b82f6" />
    <path d="M 32 16 L 38 27" stroke="#1d4ed8" stroke-width="2" /> <!-- Jacket zipper line -->

    <!-- Backpack Straps & Back -->
    <path d="M 29 16 L 35 25" stroke="#1e293b" stroke-width="2" />

    <!-- Helmet & Head (Leaning forward into the motion) -->
    <g transform="translate(43, 7)">
      <!-- Head / Helmet (Bright Yellow Safety Color) -->
      <path d="M -4 -4 C 3 -8, 12 -4, 14 3 C 15 7, 12 11, 4 12 C -2 13, -7 8, -4 -4 Z" fill="#eab308" />
      <!-- Helmet Visor / Shield -->
      <path d="M 4 2 C 8 2, 11 4, 12 7 C 9 8, 5 7, 3 5 Z" fill="#0f172a" opacity="0.8" />
      <!-- Cute energetic eye peek through visor -->
      <circle cx="7" cy="5" r="1" fill="#ffffff" />
      <!-- Scarf fluttering behind -->
      <path d="M -4 6 Q -12 8, -20 5 Q -15 12, -6 10 Z" fill="#ec4899" filter="url(#softGlow)" />
    </g>

    <!-- Arms holding handlebars -->
    <path d="M 45 16 C 48 16, 54 10, 58 8" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Hands -->
    <circle cx="58" cy="8" r="2.5" fill="#fde047" />

    <!-- Legs leaning -->
    <path d="M 35 26 C 38 30, 42 35, 48 37" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Atmospheric Lighting Overlays & Highlights -->
  <!-- Warm glow from upper left street lamp or neon -->
  <circle cx="40" cy="30" r="80" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />
  <!-- Vibrant amber glow from right traffic light -->
  <circle cx="210" cy="110" r="50" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Floating Ambient Particles / Dust / Magic Motion Sparkles -->
  <g fill="#fde047" opacity="0.7">
    <circle cx="130" cy="150" r="1.5" filter="url(#softGlow)" />
    <circle cx="160" cy="130" r="2" filter="url(#softGlow)" />
    <circle cx="110" cy="120" r="1" />
    <circle cx="75" cy="140" r="1.5" />
    <circle cx="185" cy="165" r="2" filter="url(#softGlow)" />
    <circle cx="205" cy="190" r="1" />
  </g>
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="95" cy="160" r="1.5" filter="url(#softGlow)" />
    <circle cx="140" cy="175" r="2" filter="url(#softGlow)" />
    <circle cx="65" cy="125" r="1" />
  </g>

  <!-- Clean App Card Frame Border (InsetColor) -->
  <rect x="2" y="2" width="236" height="236" rx="22" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5" />
</svg>