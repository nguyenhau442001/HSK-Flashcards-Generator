<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Elevator Doors -->
  <rect x="60" y="40" width="55" height="160" fill="#334155" rx="4"/>
  <rect x="125" y="55" width="55" height="160" fill="#334155" rx="4"/>
  
  <!-- Elevator Light Indicator -->
  <circle cx="120" cy="30" r="6" fill="#10b981"/>
  
  <!-- Character: Person arriving just in time -->
  <g transform="translate(40, 80)">
    <path d="M40 120 C40 100 60 90 80 90 C100 90 120 100 120 120 L120 160 L40 160 Z" fill="#38bdf8"/>
    <circle cx="80" cy="75" r="20" fill="#fde68a"/>
    <path d="M70 70 L75 75 M90 70 L85 75 M75 85 Q80 90 85 85" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Arm reaching out -->
    <path d="M110 110 L140 100" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Floor details -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a"/>
  <rect x="0" y="210" width="240" height="4" fill="#fb923c"/>
  
  <!-- Decorative elements for depth -->
  <circle cx="200" cy="50" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="210" cy="70" r="2" fill="#fbbf24" opacity="0.3"/>
  
  <!-- Action lines -->
  <path d="M20 100 L40 100" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M10 120 L30 120" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 4"/>
</svg>