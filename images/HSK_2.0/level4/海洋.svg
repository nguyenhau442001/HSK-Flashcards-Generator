<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#09182c"/>
      <stop offset="0.5" stop-color="#0f2942"/>
      <stop offset="1" stop-color="#16385a"/>
    </linearGradient>

    <!-- Water Surface Shimmer Gradient -->
    <linearGradient id="surfaceGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1e40af" stop-opacity="0"/>
    </linearGradient>

    <!-- Sun Ray Gradient -->
    <linearGradient id="rayGrad" x1="0" y1="0" x2="0.5" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Submarine Body Gradient -->
    <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    
    <!-- Coral Gradient 1 -->
    <linearGradient id="coralGrad1" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#db2777"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Coral Gradient 2 -->
    <linearGradient id="coralGrad2" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Turtle Shell Gradient -->
    <linearGradient id="turtleGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Light Rays from Surface -->
  <polygon points="60,0 20,240 70,240 120,0" fill="url(#rayGrad)"/>
  <polygon points="150,0 120,240 170,240 210,0" fill="url(#rayGrad)"/>
  <polygon points="100,0 70,240 100,240 130,0" fill="url(#rayGrad)" opacity="0.6"/>

  <!-- Distant Background Marine Life (Silhouettes) -->
  <g fill="#1e3a5f" opacity="0.5">
    <!-- Whale Silhouette -->
    <path d="M 180,50 Q 160,40 140,55 C 130,62 110,60 100,55 Q 90,50 85,55 C 80,60 90,70 105,68 Q 120,66 130,72 C 145,80 175,70 190,58 Z"/>
    <!-- Small Fish School -->
    <ellipse cx="40" cy="90" rx="4" ry="2" />
    <ellipse cx="50" cy="85" rx="3" ry="1.5" />
    <ellipse cx="55" cy="95" rx="3.5" ry="1.8" />
    <ellipse cx="65" cy="90" rx="3" ry="1.5" />
  </g>

  <!-- Midground Sea Floor (Deep Blues & Teals) -->
  <!-- Ocean Floor Mound 1 (Right) -->
  <path d="M 160,240 Q 200,200 240,190 L 240,240 Z" fill="#0c2035"/>
  <!-- Ocean Floor Mound 2 (Left/Center) -->
  <path d="M -20,240 Q 60,190 120,210 Q 180,230 240,210 L 240,240 Z" fill="#0f2842"/>

  <!-- Coral Reefs & Seaweed -->
  <!-- Left Seaweed Stalks -->
  <path d="M 20,240 Q 15,200 25,160 Q 35,120 20,90" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 35,240 Q 40,190 30,150 Q 20,110 40,70" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Right Coral Formations -->
  <path d="M 210,240 C 210,200 190,190 185,160 C 180,130 205,120 200,100" fill="none" stroke="url(#coralGrad1)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 225,240 C 220,210 235,190 220,160 C 210,140 230,120 225,100" fill="none" stroke="url(#coralGrad2)" stroke-width="8" stroke-linecap="round"/>
  <!-- Coral Branching Node -->
  <circle cx="185" cy="160" r="7" fill="#f472b6"/>
  <circle cx="220" cy="160" r="5" fill="#a78bfa"/>

  <!-- Center Seaweed / Kelp -->
  <path d="M 90,240 Q 105,190 85,150 Q 65,110 90,70" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>

  <!-- Floating Bubbles -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="75" cy="140" r="4" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="70" cy="120" r="2.5" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="160" cy="100" r="5" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="165" cy="85" r="3" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="162" cy="73" r="1.5" stroke="#bae6fd" stroke-width="0.8"/>
  </g>

  <!-- MAIN SUBJECT 1: Cute Sea Turtle Swimming -->
  <g transform="translate(140, 130) rotate(-15)">
    <!-- Back Flippers -->
    <ellipse cx="-12" cy="12" rx="10" ry="5" fill="#065f46" transform="rotate(30 -12 12)"/>
    <ellipse cx="-8" cy="-12" rx="10" ry="5" fill="#065f46" transform="rotate(-30 -8 -12)"/>
    
    <!-- Front Flippers (Dynamic Action) -->
    <path d="M 5,2 C 15,10 30,25 25,30 C 20,35 10,25 2,12 Z" fill="url(#turtleGrad)" stroke="#065f46" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 5,-2 C 15,-10 30,-25 25,-30 C 20,-35 10,-25 2,-12 Z" fill="url(#turtleGrad)" stroke="#065f46" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Turtle Shell (Carapace) -->
    <ellipse cx="0" cy="0" rx="22" ry="17" fill="url(#turtleGrad)" stroke="#065f46" stroke-width="2"/>
    <!-- Shell Pattern (Hexagons/Lines) -->
    <ellipse cx="0" cy="0" rx="15" ry="11" fill="none" stroke="#047857" stroke-width="1.5"/>
    <line x1="-15" y1="0" x2="-22" y2="0" stroke="#047857" stroke-width="1.5"/>
    <line x1="5" y1="10" x2="8" y2="16" stroke="#047857" stroke-width="1.5"/>
    <line x1="5" y1="-10" x2="8" y2="-16" stroke="#047857" stroke-width="1.5"/>
    <line x1="12" y1="4" x2="19" y2="8" stroke="#047857" stroke-width="1.5"/>
    <line x1="12" y1="-4" x2="19" y2="-8" stroke="#047857" stroke-width="1.5"/>

    <!-- Turtle Head -->
    <circle cx="-24" cy="0" r="9" fill="#10b981" stroke="#065f46" stroke-width="1.5"/>
    <!-- Eyes & Smile -->
    <circle cx="-27" cy="-2" r="1.5" fill="#0f172a"/>
    <path d="M -29,3 Q -27,5 -25,3" fill="none" stroke="#065f46" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- MAIN SUBJECT 2: Mini Yellow Submarine exploring the ocean -->
  <g transform="translate(85, 95) rotate(5)">
    <!-- Propeller -->
    <rect x="-33" y="-6" width="6" height="12" rx="2" fill="#64748b"/>
    <ellipse cx="-30" cy="0" rx="2" ry="10" fill="#94a3b8" opacity="0.8"/>

    <!-- Submarine Body -->
    <rect x="-25" y="-14" width="46" height="28" rx="14" fill="url(#subGrad)" stroke="#d97706" stroke-width="2"/>
    
    <!-- Submarine Periscope / Conning Tower -->
    <path d="M -2,-14 L -2,-22 L 6,-22 L 6,-14 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <path d="M -5,-22 L 8,-22" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

    <!-- Porthole Window -->
    <circle cx="-4" cy="-1" r="7" fill="#38bdf8" stroke="#d97706" stroke-width="2"/>
    <!-- Window Glare -->
    <path d="M -7,-4 A 4 4 0 0 1 -1 -7" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Little Explorer Inside Porthole (Happy face hint) -->
    <circle cx="-5" cy="-1" r="3" fill="#fb923c"/>
    <circle cx="-6" cy="-2" r="0.8" fill="#0f172a"/>

    <!-- Submarine Front Nose & Light Beam -->
    <path d="M 21,-8 Q 28,0 21,8 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    
    <!-- Submarine Headlight Cone / Glow -->
    <polygon points="25,0 75,-25 75,25" fill="#fef08a" opacity="0.35"/>
  </g>

  <!-- Friendly Clownfish near Coral -->
  <g transform="translate(185, 125) scale(0.8)">
    <!-- Tail -->
    <polygon points="15,0 24,-8 24,8" fill="#f97316"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
    <!-- White Stripes -->
    <path d="M -4,-9 L -1,9" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 7,-7 L 9,7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Fins -->
    <path d="M -2,9 Q 2,14 6,9" fill="#f97316" stroke="#c2410c" stroke-width="1"/>
    <!-- Eye & Mouth -->
    <circle cx="-8" cy="-3" r="1.5" fill="#0f172a"/>
    <circle cx="-8.5" cy="-3.5" r="0.5" fill="#ffffff"/>
    <path d="M -11,2 Q -9,4 -7,2" fill="none" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Starfish on the ocean floor -->
  <g transform="translate(50, 205) rotate(12)">
    <path d="M 0,-12 L 3,-4 L 11,-5 L 5,1 L 8,9 L 0,5 L -8,9 L -5,1 L -11,-5 L -3,-4 Z" fill="#ec4899" stroke="#be185d" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Starfish Texture Dots -->
    <circle cx="0" cy="-2" r="1" fill="#fbcfe8"/>
    <circle cx="-2" cy="2" r="0.8" fill="#fbcfe8"/>
    <circle cx="2" cy="2" r="0.8" fill="#fbcfe8"/>
  </g>

  <!-- Little Glowing Particles / Plankton in Deep Water -->
  <circle cx="115" cy="65" r="1.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="45" cy="150" r="1" fill="#38bdf8" opacity="0.8"/>
  <circle cx="130" cy="180" r="2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="195" cy="80" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="25" cy="45" r="2" fill="#fef08a" opacity="0.6"/>

  <!-- Foreground Atmospheric Bubble Overlay -->
  <circle cx="110" cy="35" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <path d="M 108,33 A 2 2 0 0 1 112,33" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Outer Rounded Frame Border (Matching Dark Theme) -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>
</svg>