<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Background Elements -->
  <circle cx="180" cy="60" r="30" fill="#334155" opacity="0.5"/>
  <rect x="20" y="180" width="200" height="60" fill="#0f172a" opacity="0.3"/>
  
  <!-- Character 1 (The Inviter) -->
  <g transform="translate(40, 60)">
    <path d="M40 120 C40 100 60 90 80 90 C100 90 120 100 120 120 L120 170 L40 170 Z" fill="#38bdf8"/>
    <circle cx="80" cy="70" r="25" fill="#fde68a"/>
    <path d="M70 75 Q80 85 90 75" stroke="#78350f" stroke-width="2" fill="none"/>
    <!-- Arm extending with invitation -->
    <path d="M105 110 L140 90" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <rect x="135" y="80" width="20" height="25" rx="2" fill="#f1f5f9"/>
    <line x1="140" y1="85" x2="150" y2="85" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="140" y1="92" x2="150" y2="92" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Character 2 (The Receiver) -->
  <g transform="translate(120, 80)">
    <path d="M30 100 C30 80 50 70 70 70 C90 70 110 80 110 100 L110 150 L30 150 Z" fill="#ec4899"/>
    <circle cx="70" cy="55" r="20" fill="#fde68a"/>
    <!-- Hand reaching out -->
    <path d="M35 100 L10 110" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="200" cy="190" r="5" fill="#fbbf24"/>
  <circle cx="30" cy="200" r="3" fill="#10b981"/>
  <path d="M180 140 L190 130 L200 140" stroke="#fb923c" stroke-width="2" fill="none"/>
</svg>