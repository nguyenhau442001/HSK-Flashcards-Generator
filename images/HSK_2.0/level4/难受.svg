<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Fever/Sweat Glow Gradient -->
    <radialGradient id="feverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Blanket Gradient -->
    <linearGradient id="blanketGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Warm Lamp Light Gradient -->
    <radialGradient id="lampLight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting / Fever Aura -->
  <circle cx="120" cy="130" r="90" fill="url(#feverGlow)" />
  <circle cx="120" cy="40" r="100" fill="url(#lampLight)" />

  <!-- Room Interior Elements -->
  <!-- Wall shelf and medicine bottle in background -->
  <rect x="35" y="70" width="40" height="4" rx="2" fill="#334155" />
  <!-- Medicine Bottle -->
  <rect x="45" y="48" width="12" height="22" rx="3" fill="#cbd5e1" />
  <rect x="48" y="44" width="6" height="5" rx="1.5" fill="#ef4444" />
  <circle cx="51" cy="59" r="3" fill="#ef4444" opacity="0.8" />

  <!-- Bed / Pillow -->
  <ellipse cx="120" cy="155" rx="75" ry="35" fill="#334155" opacity="0.5" />
  <path d="M 65 130 C 65 110 175 110 175 130 C 175 150 65 150 65 130 Z" fill="#64748b" />
  <!-- Soft Pillow -->
  <rect x="75" y="112" width="90" height="35" rx="12" fill="#e2e8f0" />

  <!-- Character Head & Body (Hunched forward, miserable) -->
  <!-- Hunched shoulders/body under blanket -->
  <path d="M 70 200 C 70 160 90 140 120 140 C 150 140 170 160 170 200 Z" fill="url(#blanketGrad)" />
  
  <!-- Wrinkles on blanket -->
  <path d="M 90 160 C 100 170 110 165 125 175" stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 140 155 C 145 165 155 160 160 170" stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Fever Compress / Ice Bag on Head -->
  <path d="M 95 95 C 95 85 145 85 145 95 C 145 100 95 100 95 95 Z" fill="#38bdf8" />
  <rect x="117" y="87" width="6" height="10" rx="2" fill="#0284c7" />

  <!-- Character Face & Head -->
  <circle cx="120" cy="115" r="32" fill="#ffedd5" />

  <!-- Messy Hair -->
  <path d="M 90 110 C 88 95 105 85 120 88 C 135 85 152 95 150 110 C 145 100 135 98 120 100 C 105 98 95 100 90 110 Z" fill="#334155" />

  <!-- Suffering Facial Expression (难受) -->
  <!-- Tightly Closed / Dizzy Eyes (X-shape or wavy lines showing distress) -->
  <path d="M 103 113 L 113 119 M 113 113 L 103 119" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 127 113 L 137 119 M 137 113 L 127 119" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" />

  <!-- Rosy Fever Cheeks -->
  <circle cx="103" cy="123" r="6" fill="#f43f5e" opacity="0.4" />
  <circle cx="137" cy="123" r="6" fill="#f43f5e" opacity="0.4" />

  <!-- Wavy / Painful Frown Eyebrows -->
  <path d="M 100 108 C 105 105 110 110 115 108" stroke="#9a3412" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 125 108 C 130 110 135 105 140 108" stroke="#9a3412" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Groaning / Open Mouth -->
  <path d="M 115 128 C 115 134 125 134 125 128 Z" fill="#9a3412" />

  <!-- Big Sweat Drops (Showing discomfort & fever) -->
  <!-- Sweat Drop 1 -->
  <path d="M 90 105 C 87 110 87 115 90 117 C 93 115 93 110 90 105 Z" fill="#38bdf8" />
  <!-- Sweat Drop 2 -->
  <path d="M 150 115 C 147 120 147 125 150 127 C 153 125 153 120 150 115 Z" fill="#38bdf8" />

  <!-- Thermometer sticking out or held near -->
  <g transform="translate(145, 130) rotate(-25)">
    <rect x="0" y="0" width="6" height="35" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="3" cy="32" r="4" fill="#ef4444" />
    <rect x="2" y="8" width="2" height="20" fill="#ef4444" />
  </g>

  <!-- Foreground Atmospheric Elements (Floating warmth/chill particles) -->
  <circle cx="70" cy="80" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="170" cy="70" r="3" fill="#38bdf8" opacity="0.4" />
  <circle cx="190" cy="110" r="1.5" fill="#38bdf8" opacity="0.5" />
  <circle cx="50" cy="140" r="2.5" fill="#38bdf8" opacity="0.5" />
</svg>