<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Background Laboratory / Space Details -->
  <!-- Ambient stars and atoms -->
  <g fill="#38bdf8" opacity="0.3">
    <circle cx="35" cy="45" r="1.5" />
    <circle cx="205" cy="35" r="2" />
    <circle cx="215" cy="110" r="1" />
    <circle cx="25" cy="140" r="1.5" />
    <circle cx="180" cy="25" r="1" />
  </g>

  <!-- Background chalkboard / shelf line -->
  <line x1="20" y1="200" x2="220" y2="200" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- LAB BENCH / SURFACE -->
  <path d="M10 200 L30 185 L210 185 L230 200 Z" fill="#334155" />
  <rect x="25" y="200" width="190" height="15" fill="#1e293b" />
  <path d="M15 200 L225 200 L235 220 L5 220 Z" fill="#0f172a" />

  <!-- PROPS: Stack of books / journals -->
  <g transform="translate(30, 170)">
    <rect x="0" y="15" width="40" height="6" rx="1" fill="#0284c7" />
    <rect x="2" y="10" width="36" height="6" rx="1" fill="#059669" />
    <rect x="-2" y="4" width="44" height="7" rx="1" fill="#dc2626" />
    <!-- Magnifying glass resting on books -->
    <circle cx="35" cy="-2" r="10" fill="none" stroke="#94a3b8" stroke-width="3" />
    <circle cx="35" cy="-2" r="8" fill="#38bdf8" fill-opacity="0.2" />
    <line x1="42" y1="5" x2="52" y2="15" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- PROPS: Planet / Orrery Model on the left -->
  <g transform="translate(60, 140)">
    <!-- Base -->
    <ellipse cx="15" cy="45" rx="18" ry="6" fill="#475569" />
    <path d="M12 45 L12 25 L18 25 L18 45 Z" fill="#64748b" />
    <!-- Ring / Orbit -->
    <ellipse cx="15" cy="20" rx="22" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-20 15 20)" opacity="0.7" />
    <!-- Planet sphere -->
    <circle cx="15" cy="20" r="10" fill="url(#planetGrad)" filter="url(#glow)" />
    <!-- Small moon -->
    <circle cx="32" cy="12" r="3" fill="#cbd5e1" />
  </g>

  <!-- MAIN SUBJECT: SCIENTIFIC EXPERIMENT / MICROSCOPE & FLASK COMBO -->
  <!-- Center piece: Erlenmeyer Flask with energetic bubbling reaction -->
  <g transform="translate(110, 110)">
    <!-- Glow behind flask -->
    <circle cx="10" cy="35" r="25" fill="#10b981" filter="url(#glow)" opacity="0.3" />

    <!-- Flask Stand / Clamp base shadow -->
    <path d="M-20 75 L40 75 L30 78 L-10 78 Z" fill="#475569" />

    <!-- Flask Glass Body -->
    <!-- Liquid inside -->
    <path d="M-4 35 Q 2 30 10 35 Q 22 55 24 60 C 25 66 18 70 10 70 C 2 70 -5 66 -4 60 Z" fill="#10b981" opacity="0.8" />
    
    <!-- Bubbles rising in liquid -->
    <circle cx="6" cy="55" r="2" fill="#a7f3d0" />
    <circle cx="14" cy="45" r="3" fill="#a7f3d0" />
    <circle cx="2" cy="42" r="1.5" fill="#a7f3d0" />

    <!-- Flask Outline and Glass highlight -->
    <path d="M6 10 L14 10 L14 30 Q 25 50 28 62 C 32 72 20 75 10 75 C 0 75 -12 72 -8 62 Q -5 50 6 30 Z" 
          fill="#f8fafc" fill-opacity="0.15" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Flask neck rim -->
    <rect x="4" y="7" width="12" height="4" rx="2" fill="#cbd5e1" />

    <!-- Glass shine reflection -->
    <path d="M-2 40 Q 3 50 2 65" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Vapor / Steam rising -->
    <path d="M8 5 Q 3 0 10 -5 Q 18 -10 12 -18" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <path d="M13 3 Q 18 -2 12 -8 Q 6 -14 14 -22" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- SECONDARY FOCAL: ADVANCED MICROSCOPE -->
  <g transform="translate(150, 95)">
    <!-- Base -->
    <path d="M-15 85 L25 85 C 30 85 30 75 25 75 L-15 75 Z" fill="#64748b" />
    <!-- Spine / Arm -->
    <path d="M-5 75 L-5 35 C -5 20 5 15 15 15 L25 15 C 28 15 28 20 25 20 L15 20 C 8 20 2 24 2 35 L2 75 Z" fill="#475569" />
    <!-- Stage / Platform -->
    <rect x="-15" y="50" width="25" height="5" rx="1" fill="#94a3b8" />
    <!-- Glass Slide on stage with glowing specimen -->
    <rect x="-12" y="47" width="18" height="3" rx="1" fill="#e2e8f0" opacity="0.8" />
    <circle cx="-3" cy="48.5" r="2" fill="#ec4899" filter="url(#glow)" />
    
    <!-- Eyepiece & Body tube -->
    <rect x="12" y="5" width="22" height="8" rx="3" fill="#334155" transform="rotate(-25 12 5)" />
    <rect x="8" y="10" width="12" height="15" fill="#475569" />
    <!-- Lens focus knobs -->
    <circle cx="-3" cy="35" r="4" fill="#f59e0b" />
    
    <!-- Light beam pointed down from microscope -->
    <polygon points="-10,53 5,53 10,85 -15,85" fill="url(#beamGrad)" />
  </g>

  <!-- DNA DOUBLE HELIX STRAND FLOATING (Dynamic element) -->
  <g transform="translate(180, 45)">
    <path d="M0 0 Q 10 15 0 30 Q -10 45 0 60" fill="none" stroke="url(#dnaGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
    <path d="M20 0 Q 10 15 20 30 Q 30 45 20 60" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <!-- Rungs of DNA -->
    <line x1="4" y1="10" x2="16" y2="10" stroke="#cbd5e1" stroke-width="2" />
    <line x1="1" y1="25" x2="19" y2="25" stroke="#cbd5e1" stroke-width="2" />
    <line x1="-2" y1="40" x2="22" y2="40" stroke="#cbd5e1" stroke-width="2" />
    <line x1="2" y1="53" x2="18" y2="53" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- ATOM ORBITING MODEL (Classic Science Symbol integrated organically) -->
  <g transform="translate(45, 60)">
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="6" fill="#ef4444" filter="url(#glow)" />
    <circle cx="2" cy="-2" r="2" fill="#fca5a5" />

    <!-- Orbit 1 -->
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.5" transform="rotate(30)" />
    <circle cx="19" cy="-11" r="3" fill="#38bdf8" filter="url(#glow)" />

    <!-- Orbit 2 -->
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="none" stroke="#a855f7" stroke-width="1.5" transform="rotate(-30)" />
    <circle cx="-16" cy="-15" r="3" fill="#a855f7" filter="url(#glow)" />

    <!-- Orbit 3 -->
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="none" stroke="#10b981" stroke-width="1.5" transform="rotate(90)" />
    <circle cx="0" cy="22" r="3" fill="#10b981" />
  </g>

  <!-- Sparkles & Energy Dots in Atmosphere -->
  <g fill="#fbbf24">
    <circle cx="105" cy="50" r="2" filter="url(#glow)" />
    <circle cx="140" cy="35" r="1.5" />
    <path d="M135 15 L137 20 L142 22 L137 24 L135 29 L133 24 L128 22 L133 20 Z" fill="#fbbf24" opacity="0.8" />
  </g>
  <g fill="#38bdf8">
    <path d="M90 120 L91.5 124 L95.5 125.5 L91.5 127 L90 131 L88.5 127 L84.5 125.5 L88.5 124 Z" opacity="0.9" />
  </g>
  <g fill="#ec4899">
    <circle cx="170" cy="140" r="2.5" filter="url(#glow)" />
  </g>

  <!-- Foreground Atmospheric Vignette / Framing -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />
</svg>