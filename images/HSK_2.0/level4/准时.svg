<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Clock Background -->
  <circle cx="120" cy="120" r="80" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <circle cx="120" cy="120" r="72" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="4 8"/>
  
  <!-- Character -->
  <g transform="translate(60, 60)">
    <!-- Body -->
    <path d="M60 140 C60 110, 80 90, 120 90 C160 90, 180 110, 180 140 L180 180 L60 180 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="120" cy="80" r="35" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M90 75 C90 40, 150 40, 150 75 C150 60, 140 50, 120 50 C100 50, 90 60, 90 75" fill="#475569"/>
    <!-- Eyes -->
    <circle cx="105" cy="75" r="4" fill="#0f172a"/>
    <circle cx="135" cy="75" r="4" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M105 90 C110 98, 130 98, 135 90" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Arm pointing at watch -->
    <path d="M150 110 L180 130" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="185" cy="135" r="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
  </g>
  
  <!-- Clock Hands -->
  <line x1="120" y1="120" x2="120" y2="60" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="170" y2="120" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Decorative Accents -->
  <circle cx="40" cy="40" r="6" fill="#10b981"/>
  <circle cx="200" cy="180" r="8" fill="#ec4899"/>
  <path d="M180 50 L190 60 L180 70 L170 60 Z" fill="#38bdf8"/>
</svg>