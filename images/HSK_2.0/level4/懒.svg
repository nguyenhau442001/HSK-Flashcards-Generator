<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Cushion Gradient -->
    <linearGradient id="cushion-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Blanket Gradient -->
    <linearGradient id="blanket-grad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Cat Gradient -->
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Room Interior Details -->
  <!-- Wallpaper subtle stripe / accent -->
  <path d="M0 0h240v160H0z" fill="#172033" />
  <line x1="0" y1="160" x2="240" y2="160" stroke="#0f172a" stroke-width="4" />
  
  <!-- Window with Night Sky & Moon -->
  <g transform="translate(25, 20)">
    <rect width="45" height="55" rx="6" fill="#090d16" stroke="#334155" stroke-width="3" />
    <!-- Moon & Star -->
    <circle cx="33" cy="18" r="8" fill="#fef08a" opacity="0.9" />
    <path d="M14 38l3-3 3 3-3 3z" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Floating Lamp casting warm light -->
  <circle cx="185" cy="70" r="55" fill="url(#lamp-glow)" />
  <path d="M175 15h20l6 25h-32z" fill="#475569" />
  <line x1="185" y1="0" x2="185" y2="15" stroke="#475569" stroke-width="2" />
  <ellipse cx="185" cy="40" rx="16" ry="6" fill="#fbbf24" filter="url(#shadow)" />

  <!-- Houseplant (Pothos) in corner -->
  <g transform="translate(15, 105)">
    <!-- Pot -->
    <path d="M12 35h20l-3 20H15z" fill="#94a3b8" />
    <ellipse cx="22" cy="35" rx="10" ry="3" fill="#cbd5e1" />
    <!-- Vines -->
    <path d="M18 35 C10 40, 5 45, 8 55" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <path d="M26 35 C32 45, 30 55, 24 62" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    <!-- Leaves -->
    <path d="M5 52c-4-2-2-6 2-5 3 1 3 5-2 5z" fill="#34d399" />
    <path d="M27 58c3-3 6 0 4 3-2 3-5 1-4-3z" fill="#10b981" />
  </g>

  <!-- Floor and Sofa/Bed Base -->
  <!-- Floor base -->
  <rect x="0" y="160" width="240" height="80" fill="#0b0f19" />
  <line x1="0" y1="160" x2="240" y2="160" stroke="#334155" stroke-width="2" />

  <!-- Cozy Sofa / Daybed Structure -->
  <g filter="url(#shadow)">
    <!-- Backrest -->
    <rect x="35" y="105" width="170" height="65" rx="12" fill="#334155" />
    <rect x="40" y="110" width="160" height="55" rx="8" fill="#475569" />
    <!-- Seat Cushion -->
    <rect x="30" y="150" width="180" height="35" rx="10" fill="#64748b" />
  </g>

  <!-- Big Cozy Pillows -->
  <g filter="url(#shadow)">
    <!-- Left Pillow -->
    <rect x="38" y="115" width="35" height="42" rx="12" fill="url(#cushion-grad)" transform="rotate(-8 55 135)" />
  </g>

  <!-- MAIN SUBJECT: Sloth / Character lounging lazily -->
  <g id="lazy-character" filter="url(#shadow)">
    <!-- Sloth Body slumped over cushion -->
    <ellipse cx="120" cy="155" rx="55" ry="32" fill="#a16207" />
    
    <!-- Sloth Belly (soft round) -->
    <ellipse cx="115" cy="162" rx="35" ry="22" fill="#fef08a" opacity="0.9" />

    <!-- Sloth Head slumped forward/sideways -->
    <circle cx="82" cy="142" r="24" fill="#a16207" />
    
    <!-- Eye patch (sloth facial marking) -->
    <ellipse cx="78" cy="140" rx="9" ry="12" fill="#78350f" transform="rotate(15 78 140)" />
    
    <!-- Closed Sleepy Eyes (Arcs) -->
    <path d="M74 142q4 3 8 0" fill="none" stroke="#292524" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Cute Sloth Nose & Smile -->
    <ellipse cx="70" cy="147" rx="3" ry="2" fill="#292524" />
    <path d="M68 151q3 2 6 0" fill="none" stroke="#292524" stroke-width="1.5" stroke-linecap="round" />

    <!-- Lazing Limbs -->
    <!-- Dangling arm off the sofa -->
    <path d="M85 170c-5 12-12 18-18 22" fill="none" stroke="#a16207" stroke-width="12" stroke-linecap="round" />
    <!-- Claws -->
    <path d="M65 190l-3 4M67 192l-1 5M70 192l1 4" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

    <!-- Sloth Leg tucked -->
    <path d="M150 160c12 5 18 12 22 20" fill="none" stroke="#a16207" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Cozy Blue Blanket draped over legs -->
  <g filter="url(#shadow)">
    <path d="M90 150 Q130 145 175 160 Q185 185 160 195 Q110 200 85 180 Z" fill="url(#blanket-grad)" />
    <!-- Blanket fold details -->
    <path d="M100 160 Q130 158 160 170" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <path d="M110 172 Q130 170 150 182" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <!-- Fringe / Hem -->
    <line x1="85" y1="180" x2="82" y2="186" stroke="#bae6fd" stroke-width="2" />
    <line x1="93" y1="184" x2="90" y2="190" stroke="#bae6fd" stroke-width="2" />
    <line x1="101" y1="186" x2="99" y2="192" stroke="#bae6fd" stroke-width="2" />
  </g>

  <!-- Foreground Props: Half-eaten snack & Remote Control on floor -->
  <g transform="translate(155, 185)" filter="url(#shadow)">
    <!-- Drop shadow for props handled by filter -->
    <!-- Remote Control -->
    <rect x="25" y="5" width="16" height="32" rx="4" fill="#334155" transform="rotate(15 33 21)" />
    <!-- Remote buttons -->
    <circle cx="31" cy="14" r="1.5" fill="#ef4444" />
    <rect x="29" y="19" width="4" height="12" rx="1" fill="#64748b" />

    <!-- Snack Bowl -->
    <path d="M0 15h24l-3 14H3z" fill="#f8fafc" />
    <ellipse cx="12" cy="15" rx="12" ry="4" fill="#e2e8f0" />
    <ellipse cx="12" cy="16" rx="10" ry="3" fill="#cbd5e1" />
    <!-- Popcorn/Snacks inside -->
    <circle cx="9" cy="14" r="4" fill="#fef08a" />
    <circle cx="14" cy="13" r="5" fill="#fef08a" />
    <circle cx="12" cy="16" r="4" fill="#fef08a" />
  </g>

  <!-- ZZZ Sleep Indicators floating upwards -->
  <g fill="#93c5fd" opacity="0.8" font-family="sans-serif" font-weight="bold">
    <text x="50" y="115" font-size="14" transform="rotate(-15 50 115)">Z</text>
    <text x="62" y="98" font-size="18" transform="rotate(-5 62 98)">Z</text>
    <text x="78" y="76" font-size="24" transform="rotate(10 78 76)">Z</text>
  </g>

  <!-- Extra ambient lighting / warmth highlight -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.1" />
</svg>