<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bambooGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="segmentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="25%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="redPacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Night Elements / Festival Ambience -->
  <g opacity="0.4">
    <circle cx="40" cy="50" r="1.5" fill="#fef08a"/>
    <circle cx="80" cy="30" r="1" fill="#fef08a"/>
    <circle cx="190" cy="45" r="2" fill="#fef08a"/>
    <circle cx="210" cy="90" r="1" fill="#fef08a"/>
    <circle cx="30" cy="120" r="1.5" fill="#fef08a"/>
    <circle cx="170" cy="25" r="1.5" fill="#fef08a"/>
  </g>

  <!-- Festive Hanging Lanterns (Representing 'Holiday/Festival' - Jié) -->
  <g filter="url(#shadow)">
    <!-- Left Lantern -->
    <line x1="60" y1="0" x2="60" y2="45" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="60" cy="65" r="30" fill="url(#lanternGlow)"/>
    <path d="M 45 45 C 45 40 75 40 75 45 L 72 85 C 72 90 48 90 48 85 Z" fill="url(#redPacketGrad)"/>
    <!-- Lantern Ribs -->
    <path d="M 60 42 C 50 42 47 60 60 88 C 73 60 70 42 60 42 Z" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.6"/>
    <rect x="52" y="39" width="16" height="4" rx="1" fill="#fbbf24"/>
    <rect x="54" y="87" width="12" height="4" rx="1" fill="#fbbf24"/>
    <line x1="60" y1="91" x2="60" y2="105" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="60" cy="107" r="2" fill="#f43f5e"/>

    <!-- Right Lantern -->
    <line x1="180" y1="0" x2="180" y2="60" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="180" cy="80" r="35" fill="url(#lanternGlow)"/>
    <path d="M 163 58 C 163 52 197 52 197 58 L 193 102 C 193 108 167 108 167 102 Z" fill="url(#redPacketGrad)"/>
    <path d="M 180 55 C 168 55 165 75 180 105 C 195 75 192 55 180 55 Z" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.6"/>
    <rect x="171" y="52" width="18" height="5" rx="1" fill="#fbbf24"/>
    <rect x="173" y="101" width="14" height="5" rx="1" fill="#fbbf24"/>
    <line x1="180" y1="106" x2="180" y2="122" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="180" cy="124" r="2.5" fill="#f43f5e"/>
  </g>

  <!-- MAIN ILLUSTRATION: The Bamboo Section / Segment (Representing 'Section/Segment' - Jié as a physical counter/segment) -->
  <g transform="translate(120, 155)" filter="url(#shadow)">
    
    <!-- Floor Shadow -->
    <ellipse cx="0" cy="55" r="75" rx="75" ry="18" fill="#020617" opacity="0.7"/>
    
    <!-- Floating Magical Sparkles around the Object -->
    <g>
      <path d="M -70 -10 L -65 -15 L -60 -10 L -65 -5 Z" fill="#38bdf8" opacity="0.8"/>
      <path d="M 65 -40 L 70 -45 L 75 -40 L 70 -35 Z" fill="#fbbf24" opacity="0.9"/>
      <circle cx="-50" cy="30" r="2.5" fill="#34d399" opacity="0.8"/>
      <circle cx="55" cy="20" r="3" fill="#f43f5e" opacity="0.7"/>
      <path d="M 0 -75 L 3 -70 L 8 -67 L 3 -64 L 0 -59 L -3 -64 L -8 -67 L -3 -70 Z" fill="#fef08a"/>
    </g>

    <!-- Detailed 3D Bamboo Segment (The core visual metaphor for 'Jié' - section/segment) -->
    <!-- Lower Segment Base -->
    <g transform="translate(0, 10)">
      <!-- Cylinder Body -->
      <path d="M -35 0 C -35 15 35 15 35 0 L 35 35 C 35 50 -35 50 -35 35 Z" fill="url(#bambooGrad)"/>
      <!-- Bottom Ellipse Rim -->
      <ellipse cx="0" cy="35" rx="35" ry="10" fill="#047857"/>
      <ellipse cx="0" cy="35" rx="31" ry="8" fill="#065f46"/>
      <!-- Surface Highlight -->
      <path d="M -20 5 C -10 8 10 8 20 5 L 20 30 C 10 33 -10 33 -20 30 Z" fill="#34d399" opacity="0.2"/>
    </g>

    <!-- Node Ring 1 (Divider/Joint - The 'Jié') -->
    <g transform="translate(0, 5)">
      <ellipse cx="0" cy="0" rx="38" ry="10" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="0" cy="-2" rx="36" ry="8" fill="#fef08a"/>
      <ellipse cx="0" cy="-4" rx="35" ry="7" fill="url(#segmentGrad)"/>
      <!-- Highlight rim -->
      <path d="M -35 -4 C 0 -11 35 -4 35 -4 C 35 2 0 6 -35 2 Z" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- Middle Segment (The highlighted primary 'Section' - Jié) -->
    <g transform="translate(0, -35)">
      <!-- Main Cylinder -->
      <path d="M -35 0 C -35 12 35 12 35 0 L 35 40 C 35 52 -35 52 -35 40 Z" fill="url(#segmentGrad)"/>
      <!-- Side Shadow for 3D depth -->
      <path d="M 20 0 C 30 15 30 25 35 40 L 35 0 Z" fill="#047857" opacity="0.4"/>
      <!-- Dynamic Light Reflection -->
      <path d="M -15 5 C -5 8 5 8 15 5 L 15 35 C 5 38 -5 38 -15 35 Z" fill="#ffffff" opacity="0.25"/>
      
      <!-- Festive Ribbon wrapped around this specific 'section' -->
      <g transform="translate(0, 20)">
        <path d="M -37 -8 C -15 -2 15 -2 37 -8 L 37 2 C 15 8 -15 8 -37 2 Z" fill="url(#redPacketGrad)"/>
        <!-- Ribbon Knot / Bow -->
        <circle cx="0" cy="-3" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
        <!-- Bow loops -->
        <path d="M -4 -8 C -12 -18 -22 -10 -10 -2 Z" fill="#f43f5e" stroke="#9f1239" stroke-width="1"/>
        <path d="M 4 -8 C 12 -18 22 -10 10 -2 Z" fill="#f43f5e" stroke="#9f1239" stroke-width="1"/>
        <!-- Ribbon Tails -->
        <path d="M -3 3 C -8 15 -15 22 -10 25 C -7 20 -5 12 -2 5 Z" fill="#f43f5e"/>
        <path d="M 3 3 C 8 15 15 22 10 25 C 7 20 5 12 2 5 Z" fill="#f43f5e"/>
      </g>
    </g>

    <!-- Node Ring 2 (Top Joint) -->
    <g transform="translate(0, -40)">
      <ellipse cx="0" cy="0" rx="38" ry="10" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="0" cy="-2" rx="36" ry="8" fill="#fef08a"/>
      <ellipse cx="0" cy="-4" rx="35" ry="7" fill="url(#bambooGrad)"/>
      <path d="M -35 -4 C 0 -11 35 -4 35 -4 C 35 2 0 6 -35 2 Z" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- Top Segment Tip -->
    <g transform="translate(0, -75)">
      <path d="M -35 0 C -35 10 35 10 35 0 L 32 -15 C 32 -22 18 -25 0 -25 C -18 -25 -32 -22 -32 -15 Z" fill="url(#bambooGrad)"/>
      <ellipse cx="0" cy="0" rx="35" ry="8" fill="#047857" opacity="0.5"/>
      <!-- Cut top face with inner ring -->
      <ellipse cx="0" cy="-25" rx="18" ry="6" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
      <ellipse cx="0" cy="-26" rx="12" ry="4" fill="#ecfdf5"/>
    </g>

  </g>

  <!-- Foreground Atmospheric Particles -->
  <g opacity="0.7">
    <circle cx="45" cy="180" r="2" fill="#38bdf8"/>
    <circle cx="25" cy="200" r="1.5" fill="#fef08a"/>
    <circle cx="215" cy="160" r="2.5" fill="#fb923c"/>
    <circle cx="195" cy="210" r="1" fill="#34d399"/>
  </g>
</svg>