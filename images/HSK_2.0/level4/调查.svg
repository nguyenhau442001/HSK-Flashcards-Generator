<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%_night" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Magnifying Glass Lens Shading -->
    <linearGradient id="lensShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)"/>

  <!-- ENVIRONMENT: Wooden Desk & Investigation Board Backdrop -->
  <!-- Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="#0b1329"/>
  <path d="M 0 170 L 240 170 L 240 174 L 0 174 Z" fill="#334155" opacity="0.6"/>

  <!-- Cork Investigation Board / Files on Desk -->
  <g transform="translate(30, 45) rotate(-4)" filter="url(#shadow)">
    <!-- Document 1: Survey Form -->
    <rect x="0" y="0" width="110" height="140" rx="4" fill="#f8fafc"/>
    <rect x="12" y="15" width="40" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="12" y="28" width="86" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="12" y="38" width="60" height="4" rx="2" fill="#e2e8f0"/>
    
    <!-- Checkboxes & Lines -->
    <rect x="12" y="55" width="8" height="8" rx="2" fill="#38bdf8"/>
    <rect x="26" y="57" width="50" height="4" rx="2" fill="#94a3b8"/>

    <rect x="12" y="70" width="8" height="8" rx="2" fill="#38bdf8"/>
    <rect x="26" y="72" width="65" height="4" rx="2" fill="#94a3b8"/>

    <rect x="12" y="85" width="8" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="26" y="87" width="40" height="4" rx="2" fill="#cbd5e1"/>

    <!-- Pie Chart Graphic on Document -->
    <circle cx="65" cy="115" r="16" fill="#e2e8f0"/>
    <path d="M 65 115 L 65 99 A 16 16 0 0 1 81 115 Z" fill="#10b981"/>
    <path d="M 65 115 L 81 115 A 16 16 0 1 1 65 99 Z" fill="#6366f1"/>
  </g>

  <!-- Document 2: Stacked underneath, tilted other way -->
  <g transform="translate(115, 60) rotate(8)" filter="url(#shadow)">
    <rect x="0" y="0" width="95" height="120" rx="4" fill="#e2e8f0"/>
    <rect x="12" y="15" width="30" height="5" rx="2.5" fill="#94a3b8"/>
    <path d="M 15 70 Q 35 40 55 55 T 80 30" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <circle cx="55" cy="55" r="4" fill="#3b82f6"/>
    <circle cx="80" cy="30" r="4" fill="#10b981"/>
  </g>

  <!-- PROPS: Coffee Mug -->
  <g transform="translate(180, 110)" filter="url(#shadow)">
    <rect x="0" y="10" width="28" height="35" rx="4" fill="#ec4899"/>
    <path d="M 28 16 C 36 16 36 32 28 34" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 8 2 Q 4 -4 10 -10 T 12 -22" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M 18 4 Q 14 -2 20 -8 T 18 -18" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- PROPS: Fingerprint / Evidence Marker -->
  <g transform="translate(45, 140) rotate(-15)" filter="url(#shadow)">
    <rect x="0" y="0" width="24" height="24" rx="3" fill="#f59e0b"/>
    <text x="12" y="17" font-family="sans-serif" font-weight="bold" font-size="14" fill="#0f172a" text-anchor="middle">?</text>
  </g>

  <!-- MAIN SUBJECT: Dynamic Magnifying Glass (Investigation Tool) -->
  <!-- We place it centrally, angled dramatically, hovering over the documents -->
  <g transform="translate(95, 80) rotate(-25)" filter="url(#shadow)">
    <!-- Glass Rim (Outer) -->
    <circle cx="50" cy="50" r="46" fill="#0f172a" />
    <circle cx="50" cy="50" r="42" fill="#38bdf8" />
    
    <!-- Lens Background & Refraction Effect -->
    <circle cx="50" cy="50" r="38" fill="#1e293b"/>
    <circle cx="50" cy="50" r="38" fill="url(#lensShine)"/>

    <!-- Magnified Content Inside Lens (Enlarged detail of the chart/evidence) -->
    <g clip-path="url(#lensClip)">
      <clipPath id="lensClip">
        <circle cx="50" cy="50" r="38"/>
      </clipPath>
      <!-- Magnified Grid / Data lines -->
      <path d="M 20 40 L 70 30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M 30 65 L 75 55" stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      <!-- Glowing Target Crosshair -->
      <circle cx="50" cy="45" r="14" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
      <circle cx="50" cy="45" r="3" fill="#f59e0b"/>
    </g>

    <!-- Glass Rim Highlight -->
    <path d="M 16 35 A 42 42 0 0 1 84 35" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Magnifying Glass Handle -->
    <defs>
      <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fb923c"/>
        <stop offset="100%" stop-color="#c2410c"/>
      </linearGradient>
    </defs>
    <!-- Handle Connector -->
    <rect x="46" y="88" width="8" height="16" rx="2" fill="#64748b"/>
    <!-- Main Handle -->
    <path d="M 42 100 L 58 100 L 54 165 C 54 170 46 170 46 165 Z" fill="url(#handleGrad)"/>
    <!-- Handle Grip Lines -->
    <line x1="46" y1="115" x2="54" y2="115" stroke="#9a3412" stroke-width="2"/>
    <line x1="45" y1="125" x2="55" y2="125" stroke="#9a3412" stroke-width="2"/>
    <line x1="45" y1="135" x2="55" y2="135" stroke="#9a3412" stroke-width="2"/>
  </g>

  <!-- FOREGROUND ATMOSPHERE: Floating Sparkles / Search Particles -->
  <g fill="#fbbf24">
    <circle cx="35" cy="50" r="2" opacity="0.8" filter="url(#glow)"/>
    <circle cx="190" cy="70" r="3" opacity="0.6" filter="url(#glow)"/>
    <circle cx="160" cy="180" r="2.5" opacity="0.7"/>
    <circle cx="70" cy="195" r="1.5" opacity="0.5"/>
  </g>

  <!-- Accent Glowing Light Beams -->
  <path d="M 120 0 L 240 120 L 220 120 L 100 0 Z" fill="#ffffff" opacity="0.03"/>

</svg>