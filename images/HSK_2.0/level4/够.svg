<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Background and Ambient Glow -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="tableGlow" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="potGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="soupGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <circle cx="120" cy="140" r="100" fill="url(#tableGlow)" />

  <!-- Restaurant/Kitchen Background Elements -->
  <!-- Warm hanging lamps -->
  <path d="M70 0 L70 45" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="70" cy="48" r="12" fill="#fbbf24" opacity="0.8"/>
  <path d="M170 0 L170 30" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="170" cy="33" r="10" fill="#fbbf24" opacity="0.6"/>

  <!-- Wooden Table Surface -->
  <path d="M20 185 L220 185 L235 225 L5 225 Z" fill="#0f172a" opacity="0.6"/>
  <rect x="15" y="175" width="210" height="12" rx="4" fill="#334155" />
  <rect x="25" y="187" width="190" height="4" fill="#1e293b" />

  <!-- Side Dish 1 (Dumplings Plate) -->
  <ellipse cx="45" cy="165" rx="22" ry="10" fill="#cbd5e1"/>
  <ellipse cx="45" cy="163" rx="19" ry="8" fill="#f8fafc"/>
  <!-- Dumplings -->
  <path d="M35 162 C35 158 40 157 43 160 C46 157 51 158 51 162 Z" fill="#fde047"/>
  <path d="M42 163 C42 159 47 158 50 161 C53 158 58 159 58 163 Z" fill="#fef08a"/>
  <path d="M30 164 C30 160 35 159 38 162 C41 159 46 160 46 164 Z" fill="#fef08a"/>

  <!-- Side Dish 2 (Baozi Steamer/Plate) -->
  <ellipse cx="195" cy="168" rx="20" ry="9" fill="#cbd5e1"/>
  <ellipse cx="195" cy="166" rx="17" ry="7" fill="#f8fafc"/>
  <circle cx="190" cy="165" r="5" fill="#fde047"/>
  <circle cx="202" cy="166" r="5" fill="#fde047"/>

  <!-- Central Big Hot Pot (Representing abundance/enough for everyone) -->
  <!-- Pot base / handles -->
  <path d="M85 130 C85 110 155 110 155 130 Z" fill="#475569"/>
  <path d="M75 125 C65 125 65 145 75 145" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M165 125 C175 125 175 145 165 145" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Pot Body -->
  <path d="M75 130 L165 130 L155 180 L85 180 Z" fill="url(#potGrad)" />
  <!-- Pot Rim -->
  <ellipse cx="120" cy="130" rx="45" ry="10" fill="#f97316"/>
  <!-- Broth / Soup Inside -->
  <ellipse cx="120" cy="132" rx="41" ry="8" fill="url(#soupGrad)"/>
  
  <!-- Food items bubbling in pot -->
  <circle cx="105" cy="132" r="5" fill="#10b981" />
  <circle cx="130" cy="130" r="6" fill="#ef4444" />
  <circle cx="118" cy="134" r="4" fill="#f8fafc" />

  <!-- Steam / Aroma (Signifying a rich, overflowing feast) -->
  <path d="M105 115 Q100 100 110 90 Q120 80 115 65" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M135 118 Q140 102 130 92 Q120 82 128 65" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M120 120 Q120 105 125 95 Q130 85 122 70" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Overflowing Bowls Array (Showing "Enough for everyone" / 够) -->
  <!-- Bowl 1 (Left) -->
  <ellipse cx="75" cy="195" rx="16" ry="7" fill="#94a3b8"/>
  <path d="M63 195 L87 195 L83 210 C83 213 67 213 67 210 Z" fill="url(#bowlGrad)"/>
  <ellipse cx="75" cy="195" rx="12" ry="5" fill="#f59e0b"/>
  <!-- Food piling up -->
  <circle cx="73" cy="193" r="4" fill="#ef4444"/>
  <circle cx="78" cy="192" r="4.5" fill="#10b981"/>

  <!-- Bowl 2 (Center-Left) -->
  <ellipse cx="103" cy="202" rx="16" ry="7" fill="#94a3b8"/>
  <path d="M91 202 L115 202 L111 217 C111 220 95 220 95 217 Z" fill="url(#bowlGrad)"/>
  <ellipse cx="103" cy="202" rx="12" ry="5" fill="#f59e0b"/>
  <circle cx="100" cy="200" r="4" fill="#fde047"/>
  <circle cx="106" cy="199" r="4" fill="#ef4444"/>

  <!-- Bowl 3 (Center-Right) -->
  <ellipse cx="137" cy="202" rx="16" ry="7" fill="#94a3b8"/>
  <path d="M125 202 L149 202 L145 217 C145 220 129 220 129 217 Z" fill="url(#bowlGrad)"/>
  <ellipse cx="137" cy="202" rx="12" ry="5" fill="#f59e0b"/>
  <circle cx="135" cy="200" r="4.5" fill="#10b981"/>
  <circle cx="140" cy="201" r="4" fill="#fde047"/>

  <!-- Bowl 4 (Right) -->
  <ellipse cx="165" cy="195" rx="16" ry="7" fill="#94a3b8"/>
  <path d="M153 195 L177 195 L173 210 C173 213 157 213 157 210 Z" fill="url(#bowlGrad)"/>
  <ellipse cx="165" cy="195" rx="12" ry="5" fill="#f59e0b"/>
  <circle cx="163" cy="193" r="4" fill="#ef4444"/>
  <circle cx="168" cy="193" r="4" fill="#10b981"/>

  <!-- Chopsticks crossed -->
  <path d="M45 110 L100 145" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M50 140 L95 115" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Celebration/Success Sparkles (Highlighting 'Enough/Completeness') -->
  <path d="M190 90 L193 98 L201 101 L193 104 L190 112 L187 104 L179 101 L187 98 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M50 85 L52 90 L57 92 L52 94 L50 99 L48 94 L43 92 L48 90 Z" fill="#38bdf8" opacity="0.9"/>
  <circle cx="195" cy="70" r="3" fill="#ec4899"/>
  <circle cx="45" cy="65" r="2.5" fill="#10b981"/>
</svg>