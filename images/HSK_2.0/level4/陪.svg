<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Medical/Interior Lighting Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Shadow for Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT & PROPS (Hospital Corridor / Waiting Room Context) -->
  <!-- Ambient Lighting Glow -->
  <circle cx="120" cy="0" r="140" fill="url(#lampGlow)" />

  <!-- Wall & Floor Divider -->
  <rect x="0" y="0" width="240" height="175" fill="#1e293b" />
  <rect x="0" y="175" width="240" height="65" fill="#0f172a" />
  <!-- Baseboard Trim -->
  <rect x="0" y="170" width="240" height="5" fill="#334155" />

  <!-- Background Props: Medical Sign / Door Frame / Plant -->
  <!-- Cross Symbol Wall Plaque (Contextual Prop) -->
  <g transform="translate(195, 45)">
    <rect x="0" y="0" width="24" height="24" rx="6" fill="#334155" />
    <rect x="10" y="5" width="4" height="14" rx="1" fill="#38bdf8" />
    <rect x="5" y="10" width="14" height="4" rx="1" fill="#38bdf8" />
  </g>

  <!-- Potted Plant in Corner for Life & Richness -->
  <g transform="translate(25, 125)">
    <!-- Pot -->
    <path d="M5 25 L15 50 H35 L45 25 Z" fill="#64748b" />
    <!-- Leaves -->
    <path d="M25 25 Q10 10 0 15 Q10 25 25 25 Z" fill="#10b981" />
    <path d="M25 25 Q35 5 50 10 Q40 22 25 25 Z" fill="#34d399" />
    <path d="M25 25 Q25 0 25 -5 Q20 15 25 25 Z" fill="#10b981" />
  </g>

  <!-- Waiting Bench (Furniture Prop) -->
  <g transform="translate(45, 140)" filter="url(#softShadow)">
    <!-- Bench Cushion -->
    <rect x="0" y="10" width="150" height="16" rx="6" fill="#475569" />
    <!-- Bench Backrest -->
    <rect x="10" y="-8" width="130" height="20" rx="6" fill="#334155" />
    <!-- Bench Metal Legs -->
    <rect x="15" y="26" width="6" height="15" fill="#94a3b8" />
    <rect x="129" y="26" width="6" height="15" fill="#94a3b8" />
  </g>

  <!-- MAIN SUBJECT: COMPANION & MOTHER (ĐI CÙNG, THÁP TÙNG) -->
  <!-- Showing active support: Young person gently holding/guiding an older person -->
  
  <!-- Character 1: Mother / Older Person (Sitting on Bench) -->
  <g transform="translate(65, 102)">
    <!-- Legs -->
    <rect x="15" y="53" width="8" height="26" rx="4" fill="#64748b" />
    <rect x="32" y="53" width="8" height="26" rx="4" fill="#64748b" />
    <!-- Shoes -->
    <ellipse cx="18" cy="79" rx="6" ry="3" fill="#cbd5e1" />
    <ellipse cx="35" cy="79" rx="6" ry="3" fill="#cbd5e1" />

    <!-- Body / Outfit (Warm Teal Cardigan) -->
    <path d="M10 20 Q5 45 12 55 H42 Q48 45 42 20 Z" fill="#0d9488" />
    
    <!-- Head & Face (Older Woman with friendly expression) -->
    <circle cx="26" cy="8" r="12" fill="#fed7aa" />
    <!-- Hair (Grey bun) -->
    <path d="M14 8 Q14 -2 26 -2 Q38 -2 38 8 Q38 12 36 10" fill="#94a3b8" />
    <circle cx="36" cy="4" r="5" fill="#94a3b8" />
    <!-- Gentle Closed Smile -->
    <path d="M22 11 Q26 14 30 11" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Glasses -->
    <circle cx="22" cy="7" r="3.5" fill="none" stroke="#475569" stroke-width="1.2"/>
    <circle cx="30" cy="7" r="3.5" fill="none" stroke="#475569" stroke-width="1.2"/>
    <line x1="25.5" y1="7" x2="26.5" y2="7" stroke="#475569" stroke-width="1.2" />

    <!-- Arms -->
    <!-- Left Arm resting -->
    <path d="M10 22 Q4 32 12 40" stroke="#0d9488" stroke-width="7" stroke-linecap="round" fill="none" />
  </g>

  <!-- Character 2: Companion / Supporter (Standing close, holding arm & carrying bag - representing 'tháp tùng') -->
  <g transform="translate(108, 80)">
    <!-- Legs (Standing firmly, showing support stance) -->
    <rect x="22" y="70" width="9" height="35" rx="4.5" fill="#3b82f6" />
    <rect x="38" y="70" width="9" height="35" rx="4.5" fill="#2563eb" />
    <!-- Shoes -->
    <ellipse cx="25" cy="105" rx="7" ry="3.5" fill="#f8fafc" />
    <ellipse cx="42" cy="105" rx="7" ry="3.5" fill="#f8fafc" />

    <!-- Torso / Jacket (Orange/Coral modern hoodie) -->
    <path d="M18 30 Q12 55 20 72 H48 Q56 55 50 30 Z" fill="#fb923c" />
    <!-- Hoodie Pocket/Details -->
    <path d="M25 55 H43 L40 68 H28 Z" fill="#ea580c" />

    <!-- Shoulder Bag / Tote Bag Strap (Prop indicating going out together) -->
    <path d="M22 32 L8 55" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />
    <!-- Tote Bag -->
    <path d="M2 55 L12 55 L15 80 L0 80 Z" fill="#f1f5f9" />
    <path d="M4 60 L10 60" stroke="#cbd5e1" stroke-width="2" />

    <!-- Head & Face (Caring expression, looking slightly down toward companion) -->
    <circle cx="34" cy="16" r="13" fill="#ffedd5" />
    <!-- Hair (Trendy dark brown style) -->
    <path d="M21 16 Q20 3 34 3 Q48 3 47 16 Q45 19 41 12 Q34 7 26 13 Z" fill="#334155" />
    <!-- Eye (Warm dot looking right) -->
    <circle cx="39" cy="15" r="1.5" fill="#1e293b" />
    <!-- Smile -->
    <path d="M36 20 Q39 23 42 20" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Right Arm reaching forward to gently hold/support the older person -->
    <path d="M46 38 Q10 42 -7 38" stroke="#fb923c" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Hand gently touching/holding -->
    <circle cx="-7" cy="38" r="4" fill="#ffedd5" />

    <!-- Left Arm hanging back naturally -->
    <path d="M22 36 Q15 48 18 60" stroke="#ea580c" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Foreground Atmospheric Details -->
  <!-- Soft lighting highlights on floor -->
  <ellipse cx="120" cy="205" rx="80" ry="8" fill="#334155" opacity="0.3"/>
</svg>