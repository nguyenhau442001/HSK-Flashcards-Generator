<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container with Rounded Corners and Dark Theme Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background shapes for atmospheric depth -->
  <circle cx="180" cy="60" r="40" fill="#38bdf8" opacity="0.05" />
  <circle cx="60" cy="180" r="50" fill="#10b981" opacity="0.03" />

  <!-- Wooden Desk Surface at bottom -->
  <path d="M 0 180 Q 120 170 240 180 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2" opacity="0.6" />

  <!-- Desk Props: Plant & Coffee Mug -->
  <!-- Small Plant Pot -->
  <path d="M 25 180 L 35 155 L 55 155 L 65 180 Z" fill="#475569" />
  <ellipse cx="45" cy="155" rx="10" ry="3" fill="#64748b" />
  <!-- Plant Leaves -->
  <path d="M 45 152 Q 35 130 20 135 Q 35 145 45 152 Z" fill="#10b981" />
  <path d="M 45 152 Q 55 120 70 130 Q 55 140 45 152 Z" fill="#34d399" />
  <path d="M 45 152 Q 45 125 45 120 Q 45 135 45 152 Z" fill="#059669" />

  <!-- Coffee Mug -->
  <rect x="190" y="150" width="22" height="30" rx="4" fill="#cbd5e1" />
  <path d="M 212 156 C 222 156 222 170 212 174" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
  <path d="M 195 148 Q 201 143 207 148" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Main Subject: Modern Computer Monitor Setup (Symbolizing Connection/Communication Hub) -->
  <!-- Monitor Stand -->
  <polygon points="105,175 135,175 140,183 100,183" fill="#475569" />
  <rect x="115" y="130" width="10" height="47" fill="#64748b" rx="2" />

  <!-- Monitor Frame -->
  <rect x="55" y="45" width="130" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="4" />
  <!-- Screen Area -->
  <rect x="61" y="51" width="118" height="78" rx="6" fill="url(#screenGrad)" />

  <!-- UI Elements on Monitor (Connection Graph / Network) -->
  <!-- Network nodes and connecting pulses -->
  <line x1="85" y1="90" x2="120" y2="70" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
  <line x1="120" y1="70" x2="155" y2="100" stroke="#38bdf8" stroke-width="2" />
  <line x1="120" y1="70" x2="145" y2="75" stroke="#ec4899" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Node Avatars/Dots -->
  <circle cx="85" cy="90" r="8" fill="#10b981" />
  <circle cx="155" cy="100" r="8" fill="#fb923c" />
  <circle cx="145" cy="75" r="6" fill="#ec4899" />
  <!-- Central Hub Node with Glow -->
  <circle cx="120" cy="70" r="12" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="120" cy="70" r="6" fill="#ffffff" />

  <!-- Floating Connection Waves / Radar effect -->
  <path d="M 110 60 A 20 20 0 0 1 130 60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" stroke-linecap="round" />
  <path d="M 105 55 A 28 28 0 0 1 135 55" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />

  <!-- Secondary Subject: Sleek 2D Smartphone floating dynamically, emphasizing mobile contact -->
  <g transform="translate(145, 115) rotate(12)">
    <!-- Phone Shadow -->
    <rect x="2" y="2" width="46" height="76" rx="10" fill="#000000" opacity="0.3" />
    <!-- Phone Body -->
    <rect x="0" y="0" width="46" height="76" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <!-- Phone Screen -->
    <rect x="4" y="6" width="38" height="64" rx="6" fill="url(#phoneGrad)" />
    <!-- Chat Bubbles on Phone Screen -->
    <rect x="8" y="14" width="22" height="12" rx="4" fill="#ffffff" opacity="0.9" />
    <path d="M 8 26 L 12 26 L 8 30 Z" fill="#ffffff" opacity="0.9" />
    
    <rect x="16" y="32" width="22" height="12" rx="4" fill="#fbbf24" opacity="0.9" />
    <path d="M 38 44 L 34 44 L 38 48 Z" fill="#fbbf24" opacity="0.9" />
    
    <circle cx="23" cy="58" r="6" fill="#10b981" />
    <path d="M 20 58 L 22 60 L 27 55" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Dynamic Elements: Action-packed floating connection lines & glowing particles (Representing "Keeping in Touch") -->
  <path d="M 35 110 Q 50 80 75 95" fill="none" stroke="url(#accentGlow)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="35" cy="110" r="4" fill="#fbbf24" />
  
  <path d="M 160 40 Q 185 30 195 55" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" />
  <circle cx="195" cy="55" r="3" fill="#38bdf8" />

  <!-- Heart / Connection Symbol subtly integrated with vector precision -->
  <path d="M 85 45 C 80 38 70 38 65 44 C 60 50 67 60 75 66 C 83 60 90 50 85 44 Z" fill="#ec4899" opacity="0.85" filter="url(#glow)" />

</svg>