<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Bullseye Glow -->
    <radialGradient id="bullseyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Dart Highlight -->
    <linearGradient id="dartMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="dartFeather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient background elements / room depth -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#475569" stroke-width="2" opacity="0.5"/>

  <!-- Background props: Shelf with books/target planning items -->
  <g opacity="0.6">
    <rect x="25" y="140" width="40" height="40" rx="4" fill="#334155"/>
    <rect x="30" y="125" width="8" height="15" rx="1" fill="#38bdf8"/>
    <rect x="40" y="120" width="10" height="20" rx="1" fill="#f43f5e"/>
    <rect x="52" y="128" width="7" height="12" rx="1" fill="#10b981"/>
  </g>

  <!-- Main Subject: Dartboard on a Stand representing "Goal / Objective / 目的" -->
  <g filter="url(#shadow)">
    <!-- Stand tripod legs -->
    <path d="M120 120 L80 200" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 120 L160 200" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 120 L120 205" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <!-- Stand joint -->
    <circle cx="120" cy="120" r="10" fill="#64748b"/>

    <!-- Glow behind target -->
    <circle cx="120" cy="95" r="50" fill="url(#bullseyeGlow)"/>

    <!-- Dartboard Outer Ring -->
    <circle cx="120" cy="95" r="46" fill="#1e293b" stroke="#f8fafc" stroke-width="3"/>
    
    <!-- Dartboard Segments (Alternating colors via simple paths/circles) -->
    <circle cx="120" cy="95" r="38" fill="#991b1b"/>
    <circle cx="120" cy="95" r="32" fill="#f8fafc"/>
    <circle cx="120" cy="95" r="24" fill="#991b1b"/>
    <circle cx="120" cy="95" r="18" fill="#1e293b"/>
    
    <!-- Bullseye Rings -->
    <circle cx="120" cy="95" r="9" fill="#16a34a" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="120" cy="95" r="4" fill="#dc2626"/>

    <!-- Segment Divider Lines -->
    <line x1="120" y1="49" x2="120" y2="141" stroke="#f8fafc" stroke-width="1.5" opacity="0.6"/>
    <line x1="74" y1="95" x2="166" y2="95" stroke="#f8fafc" stroke-width="1.5" opacity="0.6"/>
    <line x1="87" y1="62" x2="153" y2="128" stroke="#f8fafc" stroke-width="1.5" opacity="0.6"/>
    <line x1="87" y1="128" x2="153" y2="62" stroke="#f8fafc" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Hitting the Bullseye - Dynamic Action Dart -->
  <g filter="url(#shadow)">
    <!-- Dart shaft/body stuck in center -->
    <path d="M145 75 L121 93" stroke="url(#dartMetal)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Dart flights (fins) -->
    <path d="M143 73 L160 55 L155 70 Z" fill="url(#dartFeather)"/>
    <path d="M147 77 L165 80 L152 85 Z" fill="url(#dartFeather)"/>
    <path d="M144 75 L158 67 Z" stroke="#fda4af" stroke-width="2"/>

    <!-- Impact Spark / Success Indicator -->
    <path d="M115 88 L110 82" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M125 90 L132 85" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M122 101 L127 107" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="95" r="2" fill="#ffffff"/>
  </g>

  <!-- Secondary Context Prop: Compass/Pathfinder on the floor (symbolizing direction/purpose) -->
  <g transform="translate(180, 170)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a"/>
    <!-- Compass needle -->
    <polygon points="0,-11 4,0 0,3" fill="#f43f5e"/>
    <polygon points="0,11 -4,0 0,-3" fill="#f8fafc"/>
    <circle cx="0" cy="0" r="2" fill="#fbbf24"/>
  </g>

  <!-- Floating Achievement / Success Stars -->
  <g fill="#fbbf24">
    <path d="M 60 70 L 63 76 L 70 77 L 65 82 L 66 88 L 60 85 L 54 88 L 55 82 L 50 77 L 57 76 Z" transform="scale(0.5) translate(40, 40)" opacity="0.9"/>
    <path d="M 60 70 L 63 76 L 70 77 L 65 82 L 66 88 L 60 85 L 54 88 L 55 82 L 50 77 L 57 76 Z" transform="scale(0.3) translate(280, 40)" opacity="0.7"/>
  </g>

  <!-- Additional atmospheric floating particles -->
  <circle cx="95" cy="50" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="155" cy="115" r="1.5" fill="#ec4899" opacity="0.8"/>
  <circle cx="75" cy="125" r="2.5" fill="#fbbf24" opacity="0.6"/>
</svg>