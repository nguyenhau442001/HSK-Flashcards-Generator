<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Warm Amber Glow for Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Sparkle filter/glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <circle cx="120" cy="90" r="90" fill="url(#spotlight)"/>
  
  <!-- Subtle Bokeh / City Lights in Background -->
  <circle cx="50" cy="60" r="3" fill="#fbbf24" opacity="0.4"/>
  <circle cx="190" cy="50" r="4" fill="#38bdf8" opacity="0.4"/>
  <circle cx="210" cy="110" r="2.5" fill="#f43f5e" opacity="0.4"/>
  <circle cx="30" cy="140" r="3.5" fill="#38bdf8" opacity="0.3"/>
  <circle cx="185" cy="180" r="2" fill="#fbbf24" opacity="0.5"/>

  <!-- Dramatic Floor / Surface Reflection -->
  <ellipse cx="120" cy="225" rx="70" ry="10" fill="#0f172a" opacity="0.6"/>

  <!-- CHARACTER: "Handsome / 帅" Guy -->
  <g transform="translate(0, 5)">
    
    <!-- Torso / Shoulders -->
    <!-- Jacket base -->
    <path d="M 75 195 C 75 160 95 150 120 150 C 145 150 165 160 165 195 L 180 225 L 60 225 Z" fill="url(#jacketGrad)"/>
    
    <!-- Inner Shirt / Collar -->
    <path d="M 100 150 L 120 175 L 140 150 L 130 150 L 120 165 L 110 150 Z" fill="#f8fafc"/>
    <path d="M 100 150 L 85 180 L 95 185 Z" fill="#0369a1"/>
    <path d="M 140 150 L 155 180 L 145 185 Z" fill="#0369a1"/>

    <!-- Neck -->
    <path d="M 105 130 L 105 155 L 135 155 L 135 130 Z" fill="#fbcfe8" opacity="0.9"/>
    <path d="M 115 140 L 125 140 L 125 155 L 115 155 Z" fill="#db2777" opacity="0.2"/> <!-- neck shadow -->

    <!-- Head Shape -->
    <path d="M 90 95 C 90 65 150 65 150 95 C 150 120 140 135 120 138 C 100 135 90 120 90 95 Z" fill="#fbcfe8"/>

    <!-- Ears -->
    <circle cx="88" cy="98" r="7" fill="#f472b6"/>
    <circle cx="152" cy="98" r="7" fill="#f472b6"/>
    <circle cx="89" cy="98" r="3" fill="#db2777" opacity="0.3"/>
    <circle cx="151" cy="98" r="3" fill="#db2777" opacity="0.3"/>

    <!-- Confident Facial Expression -->
    <!-- Eyebrows (Strong, angled upwards for charm/confidence) -->
    <path d="M 98 85 L 114 89" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 126 89 L 142 85" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Eyes (Expressive, looking slightly aside with a wink/glint) -->
    <!-- Left eye (winking/happy curve) -->
    <path d="M 100 98 Q 106 103 112 98" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Right eye (charming spark) -->
    <circle cx="134" cy="98" r="4" fill="#0f172a"/>
    <circle cx="135.5" cy="96.5" r="1.5" fill="#ffffff"/>

    <!-- Nose (Clean minimalist line) -->
    <path d="M 120 98 L 117 114 L 123 115" stroke="#db2777" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

    <!-- Confident Smirk / Smile -->
    <path d="M 108 122 Q 120 132 133 120" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Smile dimple/accent -->
    <circle cx="135" cy="122" r="1.5" fill="#e11d48" opacity="0.6"/>

    <!-- Stylish Modern Hair (Voluminous, layered) -->
    <path d="M 88 95 C 84 75 95 50 120 50 C 145 50 156 75 152 95 C 160 90 168 70 155 55 C 142 40 100 38 82 55 C 70 70 80 95 88 95 Z" fill="url(#hairGrad)"/>
    <!-- Hair Spikes/Fringe -->
    <path d="M 90 90 C 95 70 110 60 125 65 C 110 75 100 85 90 90 Z" fill="#475569"/>
    <path d="M 120 62 C 135 60 148 70 152 90 C 142 75 130 68 120 62 Z" fill="#334155"/>
    <path d="M 105 55 C 120 45 135 50 145 60 C 130 48 115 48 105 55 Z" fill="#64748b"/>

    <!-- Dynamic Pose / Hand Adjusting Collar (Adds action and casual swagger) -->
    <!-- Right Arm & Hand -->
    <path d="M 160 170 Q 185 160 170 130" stroke="#0284c7" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Hand near collar -->
    <circle cx="168" cy="126" r="8" fill="#fbcfe8"/>
    <path d="M 163 130 C 165 125 172 125 175 130" stroke="#db2777" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Left Arm (Casual tucked in or resting) -->
    <path d="M 80 170 Q 65 190 70 215" stroke="#0284c7" stroke-width="16" stroke-linecap="round" fill="none"/>

  </g>

  <!-- ACTION & CHARM EFFECTS (Visual cues for "Handsome/帅") -->
  <!-- Floating Sparkles / Stars (Classic anime/illustrative trope for gorgeous/handsome characters) -->
  <g filter="url(#glow)">
    <!-- Star 1 (Top Left) -->
    <path d="M 50 70 L 53 78 L 61 81 L 53 84 L 50 92 L 47 84 L 39 81 L 47 78 Z" fill="#fbbf24"/>
    <!-- Star 2 (Top Right - Larger) -->
    <path d="M 185 75 L 189 88 L 202 92 L 189 96 L 185 109 L 181 96 L 168 92 L 181 88 Z" fill="#f59e0b"/>
    <!-- Star 3 (Mid Right) -->
    <path d="M 195 135 L 197 141 L 203 143 L 197 145 L 195 151 L 193 145 L 187 143 L 193 141 Z" fill="#38bdf8"/>
    <!-- Sparkle 4 (Near Face) -->
    <path d="M 80 120 L 82 126 L 88 128 L 82 130 L 80 136 L 78 130 L 72 128 L 78 126 Z" fill="#fbbf24"/>
  </g>

  <!-- Musical Notes / Vibe floating (Enhancing the cool lifestyle scene) -->
  <path d="M 60 105 Q 63 100 68 102 T 71 108" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <circle cx="58" cy="107" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="69" cy="104" r="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Glowing Aura Accent behind character -->
  <circle cx="120" cy="115" r="55" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 6"/>

</svg>