<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Folder Gradient -->
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light Circle -->
  <circle cx="120" cy="110" r="90" fill="url(#glow)" />

  <!-- Background Environment Elements (Shelf & Plant hint) -->
  <path d="M 30 70 L 90 70" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <path d="M 150 70 L 210 70" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <!-- Mini potted plant silhouette -->
  <path d="M 180 70 L 190 55 L 200 70 Z" fill="#475569" />
  <circle cx="190" cy="50" r="12" fill="#10b981" opacity="0.6" />

  <!-- Desk Surface -->
  <path d="M 0 170 Q 120 160 240 170 L 240 240 L 0 240 Z" fill="url(#deskGrad)" />
  <!-- Desk edge highlight -->
  <path d="M 0 170 Q 120 160 240 170" stroke="#475569" stroke-width="2" fill="none" />

  <!-- Laptop Base & Screen (Context Props) -->
  <g transform="translate(145, 115)">
    <!-- Screen -->
    <rect x="0" y="0" width="60" height="42" rx="4" fill="#334155" />
    <rect x="4" y="4" width="52" height="30" rx="2" fill="#0f172a" />
    <circle cx="30" cy="19" r="6" fill="#38bdf8" opacity="0.8" />
    <!-- Keyboard Base -->
    <path d="M -8 44 L 68 44 L 60 52 L 0 52 Z" fill="#64748b" />
  </g>

  <!-- Coffee Mug -->
  <g transform="translate(35, 130)">
    <rect x="0" y="0" width="22" height="28" rx="4" fill="#f43f5e" />
    <path d="M 22 6 C 28 6, 28 20, 22 20" stroke="#f43f5e" stroke-width="3" fill="none" />
    <path d="M 5 0 L 17 0" stroke="#fda4af" stroke-width="2" stroke-linecap="round" />
    <!-- Steam -->
    <path d="M 8 -4 Q 11 -9 8 -14" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  </g>

  <!-- Main Subject: Application Folder (Xin/Đăng ký) -->
  <!-- Back Folder Flap -->
  <path d="M 70 85 L 110 85 L 120 95 L 170 95 L 170 175 L 70 175 Z" fill="#b45309" />

  <!-- Application Documents Inside -->
  <!-- Document 1 (Back) -->
  <rect x="80" y="75" width="80" height="95" rx="3" fill="#e2e8f0" />
  <!-- Document 2 (Middle) -->
  <rect x="85" y="65" width="80" height="95" rx="3" fill="url(#paperGrad)" />
  <path d="M 100 80 L 140 80" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  <path d="M 100 96 L 150 96" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
  <path d="M 100 110 L 135 110" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
  <path d="M 100 124 L 145 124" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
  <!-- Photo placeholder on form -->
  <rect x="130" y="135" width="20" height="25" rx="2" fill="#cbd5e1" />

  <!-- Front Folder Flap -->
  <path d="M 70 100 L 120 100 L 130 110 L 170 110 L 170 185 C 170 189 166 193 162 193 L 78 193 C 74 193 70 189 70 185 Z" fill="url(#folderGrad)" />

  <!-- Gold Star / Seal of Approval / Official Badge on Folder -->
  <circle cx="120" cy="145" r="16" fill="#f59e0b" />
  <circle cx="120" cy="145" r="12" fill="#fbbf24" />
  <path d="M 120 136 L 122.3 141.5 L 128.3 142 L 123.8 146.2 L 125.1 152.1 L 120 149 L 114.9 152.1 L 116.2 146.2 L 111.7 142 L 117.7 141.5 Z" fill="#ffffff" opacity="0.9" />

  <!-- Action Pen / Stylus writing the application -->
  <g transform="translate(130, 85) rotate(-35)">
    <!-- Pen Body -->
    <path d="M 0 0 L 8 0 L 12 50 L 4 50 Z" fill="#38bdf8" />
    <!-- Pen Tip -->
    <path d="M 4 50 L 8 50 L 6 56 Z" fill="#0f172a" />
    <!-- Pen Cap/Clip -->
    <path d="M 2 5 L 6 5 L 6 20 L 2 20 Z" fill="#0284c7" />
  </g>

  <!-- Sparkles / Action Highlights (Success, Official Submission) -->
  <g transform="translate(155, 60)">
    <path d="M 0 10 L 20 10 M 10 0 L 10 20" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  </g>
  <g transform="translate(60, 95) scale(0.6)">
    <path d="M 0 10 L 20 10 M 10 0 L 10 20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>
  <circle cx="165" cy="50" r="3" fill="#38bdf8" />
  <circle cx="65" cy="85" r="2.5" fill="#fbbf24" />

  <!-- Checkmark Stamp Badge Floating -->
  <g transform="translate(160, 120)">
    <circle cx="0" cy="0" r="14" fill="#10b981" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <path d="M -5 -1 L -1 4 L 6 -5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

</svg>