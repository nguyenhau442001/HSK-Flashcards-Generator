<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Glow for Notification / Reminder -->
    <radialGradient id="reminderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Desk/Room Context) -->
  <g opacity="0.3">
    <!-- Bookshelf / Wall accents -->
    <rect x="20" y="30" width="40" height="6" rx="3" fill="#64748b"/>
    <rect x="70" y="36" width="30" height="6" rx="3" fill="#475569"/>
    <!-- Plant silhouette -->
    <path d="M210 190 Q215 160 200 140 Q220 150 215 190 Z" fill="#10b981" opacity="0.4"/>
    <path d="M215 190 Q230 170 225 150 Q235 165 218 190 Z" fill="#34d399" opacity="0.4"/>
    <path d="M205 190 Q190 175 185 160 Q195 170 207 190 Z" fill="#059669" opacity="0.4"/>
    <path d="M200 190 L220 190 L215 210 L205 210 Z" fill="#64748b"/>
  </g>

  <!-- Ambient Glow around the central reminder action -->
  <circle cx="120" cy="115" r="70" fill="url(#reminderGlow)"/>

  <!-- Desk Surface -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#0f172a"/>
  <path d="M0 190 L240 190" stroke="#334155" stroke-width="2"/>

  <!-- Laptop / Desk Prop Base -->
  <path d="M60 190 L180 190 L195 210 L45 210 Z" fill="#334155" filter="url(#shadow)"/>
  <path d="M75 190 L165 190 L170 194 L70 194 Z" fill="#475569"/>

  <!-- Coffee Mug Prop -->
  <g transform="translate(175, 155)">
    <rect x="0" y="5" width="22" height="30" rx="4" fill="#cbd5e1"/>
    <path d="M22 10 C30 10 30 25 22 28" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <!-- Coffee steam -->
    <path d="M7 -2 Q10 -8 5 -14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M15 -4 Q18 -10 13 -16" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- MAIN SCENE SUBJECT: The Smart Alarm Clock / Interactive Reminder Hub -->
  <g filter="url(#shadow)" transform="translate(0, -5)">
    <!-- Clock Body -->
    <rect x="80" y="65" width="80" height="80" rx="22" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    
    <!-- Clock Feet -->
    <rect x="95" y="143" width="12" height="8" rx="4" fill="#64748b"/>
    <rect x="133" y="143" width="12" height="8" rx="4" fill="#64748b"/>

    <!-- Clock Top Bells / Accents -->
    <path d="M95 67 L90 53 C90 53 100 48 108 55 Z" fill="#fbbf24"/>
    <path d="M145 67 L150 53 C150 53 140 48 132 55 Z" fill="#fbbf24"/>
    <circle cx="120" cy="50" r="6" fill="#f59e0b"/>

    <!-- Screen Area -->
    <rect x="90" y="75" width="60" height="60" rx="14" fill="url(#screenGrad)" stroke="#334155" stroke-width="2"/>

    <!-- Digital Time Display -->
    <text x="120" y="102" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#f8fafc" text-anchor="middle">08:00</text>

    <!-- Active Reminder Indicator (Pulsing Dot & Wave) -->
    <circle cx="120" cy="120" r="6" fill="#38bdf8"/>
    <circle cx="120" cy="120" r="11" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="8;16;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- FLOATING ACTION ELEMENTS: Dynamic Reminder Notifications (The 'Tíxǐng' manifestation) -->
  
  <!-- Notification Card 1 (Top Left) -->
  <g filter="url(#shadow)" transform="translate(15, 45)">
    <rect width="75" height="36" rx="10" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="8" fill="#f59e0b"/>
    <!-- Exclamation mark icon representing alert/reminder -->
    <path d="M18 13 L18 18 M18 21 L18 22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Abstract text lines representing reminder message -->
    <rect x="32" y="12" width="30" height="4" rx="2" fill="#f8fafc"/>
    <rect x="32" y="20" width="20" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Notification Card 2 (Top Right - Action Burst) -->
  <g filter="url(#shadow)" transform="translate(150, 35)">
    <rect width="78" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="18" cy="20" r="8" fill="#10b981"/>
    <!-- Checkmark / Success Icon -->
    <path d="M14 20 L17 23 L22 17" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="32" y="14" width="34" height="4" rx="2" fill="#f8fafc"/>
    <rect x="32" y="22" width="22" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Glowing Bell / Reminder Icon Floating on Right -->
  <g filter="url(#shadow)" transform="translate(185, 95)">
    <circle cx="20" cy="20" r="18" fill="#ec4899"/>
    <!-- Bell Icon -->
    <path d="M20 11 C15.5 11 14 14.5 14 18.5 L14 21.5 L12 24 L28 24 L26 21.5 L26 18.5 C26 14.5 24.5 11 20 11 Z M18 25 C18 26.1 18.9 27 20 27 C21.1 27 22 26.1 22 25 Z" fill="#ffffff"/>
  </g>

  <!-- Floating Sparkles / Action Particles -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M50 120 L53 126 L59 129 L53 132 L50 138 L47 132 L41 129 L47 126 Z"/>
    <!-- Star 2 -->
    <path d="M190 150 L192 154 L196 156 L192 158 L190 162 L188 158 L184 156 L188 154 Z" fill="#38bdf8"/>
    <!-- Star 3 -->
    <path d="M75 165 L77 169 L81 171 L77 173 L75 177 L73 173 L69 171 L73 169 Z" fill="#ec4899"/>
  </g>

  <!-- Dynamic Connection Arcs (Showing the flow of reminding) -->
  <path d="M55 81 Q70 65 92 70" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M148 70 Q170 60 188 88" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>

</svg>