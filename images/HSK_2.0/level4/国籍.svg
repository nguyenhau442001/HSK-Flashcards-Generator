<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Passport Cover Gradient -->
    <linearGradient id="passport-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Stamp Glow & Ink -->
    <radialGradient id="stamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Glow behind desk -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.05" filter="blur(20px)"/>

  <!-- Wooden/Modern Desk Surface -->
  <path d="M 0,165 Q 120,155 240,165 L 240,240 L 0,240 Z" fill="url(#desk-grad)"/>
  <line x1="0" y1="165" x2="240" y2="165" stroke="#475569" stroke-width="2" opacity="0.5"/>

  <!-- BACKGROUND PROPS: Travel Globe -->
  <g transform="translate(185, 95)" filter="url(#soft-shadow)">
    <!-- Stand -->
    <path d="M -5,45 L 5,45 L 2,25 L -2,25 Z" fill="#64748b"/>
    <ellipse cx="0" cy="46" rx="12" ry="4" fill="#475569"/>
    <!-- Arc -->
    <path d="M 0,-25 A 30 30 0 0 1 0,35" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <!-- Globe Sphere -->
    <circle cx="0" cy="5" r="26" fill="#0284c7"/>
    <circle cx="0" cy="5" r="26" fill="url(#bg-grad)" opacity="0.2"/>
    <!-- Continents (Stylized vector shapes) -->
    <path d="M -10,-5 Q -5,-12 0,-8 Q 5,-15 12,-5 Q 15,2 8,10 Q 0,15 -8,5 Z" fill="#10b981" opacity="0.8"/>
    <path d="M -15,12 Q -10,8 -5,12 Q -8,18 -15,12 Z" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- BACKGROUND PROPS: Boarding Pass / Ticket -->
  <g transform="translate(35, 105) rotate(-15)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="55" height="35" rx="4" fill="#f8fafc"/>
    <rect x="0" y="0" width="15" height="35" fill="#cbd5e1"/>
    <line x1="22" y1="8" x2="48" y2="8" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="16" x2="40" y2="16" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="24" x2="45" y2="24" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="48" cy="27" r="4" fill="#fb923c"/>
  </g>

  <!-- MAIN SUBJECT: Open International Passport -->
  <g transform="translate(120, 115)" filter="url(#shadow)">
    
    <!-- Passport Shadow Base / Cover Back -->
    <rect x="-72" y="-42" width="144" height="85" rx="8" fill="#0369a1" transform="rotate(-3)"/>

    <!-- Left Page (Identity & Photo Page) -->
    <g transform="translate(-70, -40)">
      <rect x="0" y="0" width="68" height="80" rx="4" fill="#f8fafc"/>
      <!-- Security Watermark Lines -->
      <path d="M 5,10 Q 34,5 63,10" fill="none" stroke="#e2e8f0" stroke-width="2"/>
      <path d="M 5,70 Q 34,75 63,70" fill="none" stroke="#e2e8f0" stroke-width="2"/>
      
      <!-- User Photo Placeholder -->
      <rect x="8" y="12" width="22" height="28" rx="2" fill="#cbd5e1"/>
      <circle cx="19" cy="22" r="6" fill="#64748b"/>
      <path d="M 11,36 Q 19,28 27,36 Z" fill="#64748b"/>

      <!-- Fake Text Lines (Data Fields) -->
      <rect x="34" y="14" width="28" height="4" rx="1" fill="#94a3b8"/>
      <rect x="34" y="22" width="22" height="3" rx="1" fill="#cbd5e1"/>
      <rect x="34" y="28" width="18" height="3" rx="1" fill="#cbd5e1"/>

      <!-- Machine Readable Zone (MRZ) -->
      <rect x="8" y="46" width="52" height="2" rx="1" fill="#94a3b8"/>
      <rect x="8" y="52" width="46" height="2" rx="1" fill="#94a3b8"/>
      <rect x="8" y="58" width="50" height="2" rx="1" fill="#94a3b8"/>
    </g>

    <!-- Right Page (Visa & Stamps Page) -->
    <g transform="translate(2, -40)">
      <rect x="0" y="0" width="68" height="80" rx="4" fill="#f8fafc"/>
      <!-- Security Pattern -->
      <circle cx="34" cy="40" r="25" fill="none" stroke="#f1f5f9" stroke-width="8"/>

      <!-- Colorful Visas / Stamps Graphics -->
      <rect x="12" y="10" width="25" height="18" rx="2" fill="#fef08a" opacity="0.6" transform="rotate(-5 12 10)"/>
      <rect x="38" y="15" width="20" height="25" rx="2" fill="#fed7aa" opacity="0.6" transform="rotate(10 38 15)"/>
      <rect x="15" y="38" width="30" height="20" rx="2" fill="#bae6fd" opacity="0.6" transform="rotate(-8 15 38)"/>
      
      <!-- Lines inside visa page -->
      <line x1="16" y1="16" x2="32" y2="16" stroke="#ca8a04" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="42" y1="22" x2="54" y2="22" stroke="#ea580c" stroke-width="1"/>
    </g>

    <!-- Passport Center Spine Crease -->
    <rect x="-3" y="-41" width="6" height="82" fill="#e2e8f0"/>
    <line x1="0" y1="-41" x2="0" y2="41" stroke="#cbd5e1" stroke-width="1"/>

  </g>

  <!-- FOREGROUND / INTERACTION: Official Entry Stamp (Action Element) -->
  <g transform="translate(135, 95)" filter="url(#soft-shadow)">
    <!-- Glow Effect -->
    <circle cx="0" cy="0" r="24" fill="url(#stamp-glow)"/>
    
    <!-- Rubber Stamp Outer Ring -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="100" stroke-dashoffset="0" opacity="0.9"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#10b981" stroke-width="1" opacity="0.7"/>

    <!-- Stamp Center Graphics (Abstract Star / Globe Icon representing Nationality/Entry) -->
    <path d="M 0,-8 L 2,-2 L 8,-2 L 3,2 L 5,8 L 0,4 L -5,8 L -3,2 L -8,-2 L -2,-2 Z" fill="#10b981" opacity="0.9"/>
    
    <!-- Curved Date/Text Simulator in Stamp -->
    <path d="M -12,8 Q 0,14 12,8" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- FOUNTAIN PEN / STAMP TOOL -->
  <g transform="translate(85, 55) rotate(-35)" filter="url(#shadow)">
    <!-- Pen Body -->
    <path d="M -4,-40 L 4,-40 L 6,10 L 0,25 L -6,10 Z" fill="#fbbf24"/>
    <!-- Pen Cap / Clip -->
    <rect x="-4" y="-40" width="8" height="18" rx="2" fill="#d97706"/>
    <line x1="0" y1="-38" x2="0" y2="-25" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Pen Grip -->
    <rect x="-5" y="10" width="10" height="8" fill="#1e293b"/>
    <!-- Nib -->
    <path d="M -3,18 L 3,18 L 0,30 Z" fill="#94a3b8"/>
    <circle cx="0" cy="22" r="0.75" fill="#0f172a"/>
  </g>

  <!-- Floating Sparkles / Accomplishment Accents -->
  <g fill="#38bdf8" opacity="0.8">
    <path d="M 75,50 Q 75,55 70,55 Q 75,55 75,60 Q 75,55 80,55 Q 75,55 75,50 Z"/>
    <path d="M 165,135 Q 165,139 161,139 Q 165,139 165,143 Q 165,139 169,139 Q 165,139 165,135 Z" fill="#fbbf24"/>
    <circle cx="160" cy="65" r="2.5" fill="#10b981" opacity="0.7"/>
    <circle cx="65" cy="145" r="2" fill="#ec4899" opacity="0.7"/>
  </g>

</svg>