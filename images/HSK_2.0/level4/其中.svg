<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Teal/Cyan Highlight Gradient -->
    <linearGradient id="teal-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Soft Glassy Box Gradient -->
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Background Shapes/Atmosphere -->
  <circle cx="120" cy="110" r="85" fill="#334155" opacity="0.15" />
  
  <!-- Back Floor/Surface -->
  <ellipse cx="120" cy="190" rx="90" ry="25" fill="#0b0f19" opacity="0.7" />

  <!-- SCENE: OPEN TREASURE CHEST / COLLECTION BOX REPRESENTING "其中" (AMONG WHICH) -->
  <!-- Back rim of the box -->
  <path d="M 60 120 L 100 100 L 180 120 L 140 140 Z" fill="#475569" />

  <!-- Main Box Body -->
  <path d="M 60 120 L 60 170 C 60 180, 80 190, 120 190 C 160 190, 180 180, 180 170 L 180 120 C 180 130, 160 140, 120 140 C 80 140, 60 130, 60 120 Z" fill="url(#box-grad)" stroke="#64748b" stroke-width="2" />
  <path d="M 60 120 C 60 130, 80 140, 120 140 C 160 140, 180 130, 180 120" fill="none" stroke="#64748b" stroke-width="2" />

  <!-- Objects Inside (The group of items) -->
  <!-- Item 1 (Blue Gem/Object) -->
  <circle cx="95" cy="125" r="10" fill="#38bdf8" filter="url(#shadow)" />
  <circle cx="93" cy="123" r="3" fill="#bae6fd" opacity="0.8" />

  <!-- Item 2 (Pink/Red Gem/Object) -->
  <circle cx="145" cy="130" r="12" fill="#ec4899" filter="url(#shadow)" />
  <circle cx="142" cy="127" r="4" fill="#fbcfe8" opacity="0.8" />

  <!-- Item 3 (Green Gem/Object) -->
  <circle cx="120" cy="135" r="11" fill="#10b981" filter="url(#shadow)" />
  <circle cx="118" cy="132" r="3.5" fill="#a7f3d0" opacity="0.8" />

  <!-- THE FOCAL POINT: "THE ONE AMONG THEM" (其中) -->
  <!-- Glowing highlighted special element rising from the collection with magical aura -->
  <g filter="url(#shadow)">
    <!-- Light beam connecting down -->
    <polygon points="110,125 130,125 140,70 100,70" fill="url(#gold-glow)" opacity="0.25" />

    <!-- Floating Star / Special Item -->
    <circle cx="120" cy="70" r="20" fill="url(#gold-glow)" filter="url(#glow)" />
    
    <!-- Inner Star Vector Details -->
    <path d="M 120 52 L 124 64 L 136 68 L 124 72 L 120 84 L 116 72 L 104 68 L 116 64 Z" fill="#ffffff" />
    
    <!-- Orbiting Energy Sparkles -->
    <circle cx="95" cy="65" r="3" fill="#fef08a" />
    <circle cx="148" cy="80" r="2.5" fill="#fef08a" />
    <path d="M 138 55 Q 142 50 147 52" stroke="#fbbd24" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 98 85 Q 92 88 90 83" stroke="#fbbd24" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Front Rim of Box (to create depth, overlapping items) -->
  <path d="M 60 145 C 60 155, 80 165, 120 165 C 160 165, 180 155, 180 145 L 180 170 C 180 180, 160 190, 120 190 C 80 190, 60 180, 60 170 Z" fill="#1e293b" opacity="0.6" />

  <!-- Foreground decorative elements for rich scene framing -->
  <!-- Cute little floating dots / ambient sparkles -->
  <circle cx="45" cy="100" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="195" cy="110" r="3" fill="#ec4899" opacity="0.6" />
  <circle cx="75" cy="60" r="1.5" fill="#10b981" opacity="0.8" />
  <circle cx="170" cy="45" r="2" fill="#fbbf24" opacity="0.7" />

</svg>