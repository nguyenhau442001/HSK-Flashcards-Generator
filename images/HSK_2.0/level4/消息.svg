<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="4"/>
  
  <!-- Character: Upper body and arms -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 160 C 40 120, 80 120, 80 160 L 80 160" fill="#38bdf8"/>
    <!-- Arms holding phone -->
    <path d="M30 110 L 50 90 L 70 100" stroke="#fde68a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M90 110 L 70 90 L 50 100" stroke="#fde68a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Head -->
    <circle cx="60" cy="70" r="25" fill="#fde68a"/>
    <!-- Expression -->
    <path d="M50 65 Q 55 60 60 65" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M70 65 Q 75 60 80 65" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M55 80 Q 65 85 75 80" stroke="#ec4899" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Phone with glowing notification effect -->
  <rect x="95" y="130" width="50" height="70" rx="8" fill="#10b981"/>
  <rect x="100" y="135" width="40" height="60" rx="4" fill="#064e3b"/>
  <circle cx="120" cy="165" r="8" fill="#fbbf24"/>
  
  <!-- Ambient light/Action lines -->
  <circle cx="120" cy="165" r="15" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Background elements: Desk lamp -->
  <path d="M180 160 L 180 80 L 200 60" stroke="#94a3b8" stroke-width="6" fill="none"/>
  <path d="M200 60 L 220 50 L 220 70 Z" fill="#fbbf24"/>
  
  <!-- Coffee mug -->
  <rect x="30" y="140" width="20" height="25" rx="2" fill="#ec4899"/>
  <path d="M50 145 A 5 5 0 0 1 50 155" stroke="#ec4899" stroke-width="4" fill="none"/>
</svg>