<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Highway Asphalt Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Motion Blur Gradient -->
    <linearGradient id="motionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>
    
    <!-- Red Tail Light Glow -->
    <linearGradient id="tailGlow" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- 2. Distant Environment (Mountains & Cityscape Silhouettes) -->
  <path d="M 0 130 Q 30 110, 70 120 T 140 115 T 200 125 T 240 110 L 240 150 L 0 150 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M 0 140 L 40 125 L 80 135 L 130 120 L 180 130 L 240 115 L 240 160 L 0 160 Z" fill="#0f172a" />

  <!-- City Skyline Lights -->
  <circle cx="45" cy="132" r="1" fill="#f59e0b" opacity="0.8" />
  <circle cx="48" cy="133" r="1" fill="#38bdf8" opacity="0.8" />
  <circle cx="115" cy="128" r="1" fill="#f59e0b" opacity="0.9" />
  <circle cx="118" cy="127" r="1" fill="#ec4899" opacity="0.8" />
  <circle cx="170" cy="133" r="1" fill="#38bdf8" opacity="0.7" />

  <!-- 3. Highway Structure (Perspective Curves) -->
  <!-- Overpass / Supporting Pillar Shadows -->
  <path d="M 60 160 L 70 210 L 80 210 L 75 160 Z" fill="#090d16" />
  <path d="M 170 160 L 165 210 L 175 210 L 178 160 Z" fill="#090d16" />

  <!-- Main Roadway Surface (Sweeping High-speed Curve) -->
  <path d="M -20 160 Q 120 120, 260 180 L 260 220 Q 120 150, -20 210 Z" fill="url(#roadGrad)" filter="url(#shadow)" />

  <!-- Road Edges / Shoulders -->
  <path d="M -20 156 Q 120 116, 260 176 L 260 180 Q 120 120, -20 160 Z" fill="#475569" />
  <path d="M -20 210 Q 120 150, 260 220 L 260 216 Q 120 146, -20 206 Z" fill="#475569" />

  <!-- Glowing Lane Markings (Dashed Center Lines with Perspective) -->
  <path d="M -20 183 Q 120 135, 260 198" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="10, 10" fill="none" opacity="0.9" />

  <!-- Modern Highway Overhead Sign Structure -->
  <path d="M 90 145 L 90 70 L 150 70 L 150 85" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Overhead Gantry Sign Board -->
  <rect x="75" y="55" width="90" height="25" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
  <!-- Abstract Directional Graphics on Sign (No text) -->
  <path d="M 90 70 L 100 62 L 100 78 Z" fill="#38bdf8" />
  <line x1="102" y1="70" x2="115" y2="70" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="135" cy="67" r="5" fill="#10b981" />
  <path d="M 132 67 L 135 70 L 140 64" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 4. Dynamic Speed Lines (Motion effect) -->
  <path d="M 20 150 L 90 150" stroke="url(#motionGrad)" stroke-width="1" stroke-dasharray="20, 10" />
  <path d="M 80 180 L 180 180" stroke="url(#motionGrad)" stroke-width="1.5" stroke-dasharray="30, 15" />
  <path d="M 120 130 L 220 130" stroke="url(#motionGrad)" stroke-width="1" stroke-dasharray="15, 10" />

  <!-- 5. Vehicles (Action-packed foreground elements) -->
  
  <!-- Vehicle 1: Sleek Blue Sporty Car (Mid-ground, moving fast right) -->
  <g transform="translate(140, 140) scale(0.8)">
    <!-- Headlight beams projecting forward -->
    <path d="M 50 15 L 100 -5 L 100 25 Z" fill="url(#lightBeam)" />
    <!-- Car Body -->
    <path d="M 0 10 L 15 -5 L 35 -5 L 45 10 L 50 10 L 45 22 L -5 22 Z" fill="#38bdf8" filter="url(#shadow)" />
    <path d="M 16 -3 L 32 -3 L 38 9 L 12 9 Z" fill="#1e293b" /> <!-- Windows -->
    <!-- Wheels -->
    <circle cx="10" cy="22" r="6" fill="#0f172a" />
    <circle cx="10" cy="22" r="2" fill="#94a3b8" />
    <circle cx="38" cy="22" r="6" fill="#0f172a" />
    <circle cx="38" cy="22" r="2" fill="#94a3b8" />
  </g>

  <!-- Vehicle 2: Modern Orange Sedan (Foreground, dominant element, moving left-to-right) -->
  <g transform="translate(50, 165)" filter="url(#shadow)">
    <!-- Light Trail / Motion Glow -->
    <path d="M -30 12 L 0 12" stroke="url(#tailGlow)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Main Chassis -->
    <path d="M 0 15 L 15 2 L 50 -2 L 75 8 L 95 12 L 100 22 L 0 22 Z" fill="#fb923c" />
    <path d="M 20 0 L 48 -3 L 70 6 L 15 6 Z" fill="#ea580c" /> <!-- Body shaping -->
    
    <!-- Cabin & Windshield -->
    <path d="M 32 0 L 52 -10 L 72 -3 L 68 6 L 28 6 Z" fill="#1e293b" />
    <path d="M 35 -1 L 51 -9 L 68 -3 Z" fill="#38bdf8" opacity="0.3" /> <!-- Tinted Glass -->

    <!-- Headlights & Grille -->
    <path d="M 95 12 L 100 13 L 100 17 L 95 16 Z" fill="#fef08a" />
    <circle cx="98" cy="14" r="2" fill="#ffffff" />
    
    <!-- Wheels -->
    <g transform="translate(22, 20)">
      <circle cx="0" cy="0" r="8" fill="#0f172a" />
      <circle cx="0" cy="0" r="3" fill="#cbd5e1" />
      <path d="M -3 -3 L 3 3 M -3 3 L 3 -3" stroke="#475569" stroke-width="1.5" />
    </g>
    <g transform="translate(78, 20)">
      <circle cx="0" cy="0" r="8" fill="#0f172a" />
      <circle cx="0" cy="0" r="3" fill="#cbd5e1" />
      <path d="M -3 -3 L 3 3 M -3 3 L 3 -3" stroke="#475569" stroke-width="1.5" />
    </g>
  </g>

  <!-- 6. Foreground Highway Elements (Lamps, safety rails) -->
  <!-- Guardrail Posts & Railing (Right side) -->
  <path d="M 210 170 L 240 183" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M 210 173 L 240 186" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <!-- Guardrail vertical supports -->
  <line x1="215" y1="172" x2="215" y2="178" stroke="#475569" stroke-width="2" />
  <line x1="235" y1="180" x2="235" y2="186" stroke="#475569" stroke-width="2" />

  <!-- Modern Highway Light Pole (Left Foreground) -->
  <path d="M 15 150 L 15 40 L 35 30" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Light Fixture Glowing -->
  <path d="M 30 28 L 45 32 L 30 36 Z" fill="#fef08a" filter="url(#shadow)" />
  <ellipse cx="38" cy="45" rx="15" ry="5" fill="#fef08a" opacity="0.15" />

  <!-- Ambient glowing particle effects for high-speed atmosphere -->
  <circle cx="90" cy="110" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="160" cy="100" r="1" fill="#fbbf24" opacity="0.9" />
  <circle cx="190" cy="120" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="70" cy="130" r="1" fill="#ec4899" opacity="0.7" />

  <!-- Decorative App Frame Border (Subtle inset stroke) -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
</svg>