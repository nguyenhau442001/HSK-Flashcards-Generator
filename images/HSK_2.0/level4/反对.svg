<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Meeting Room Details -->
  <!-- Projector Screen / Board -->
  <rect x="50" y="30" width="140" height="85" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Rejected Plan Chart Graphics (Abstract bars and red X) -->
  <rect x="65" y="45" width="20" height="50" rx="2" fill="#334155"/>
  <rect x="95" y="60" width="20" height="35" rx="2" fill="#334155"/>
  <rect x="125" y="40" width="20" height="55" rx="2" fill="#334155"/>
  <rect x="155" y="70" width="20" height="25" rx="2" fill="#334155"/>
  <!-- Big Red X over the plan -->
  <path d="M 75 45 L 175 95 M 175 45 L 75 95" stroke="#ef4444" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Conference Table -->
  <path d="M 30 180 L 210 180 L 195 210 L 45 210 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <ellipse cx="120" cy="180" rx="90" ry="12" fill="#334155" stroke="#475569" stroke-width="2"/>

  <!-- Character 1 (Left - Opposing with X arms) -->
  <g transform="translate(45, 110)">
    <!-- Body/Torso -->
    <path d="M 15 70 L 35 70 L 40 40 L 10 40 Z" fill="#6366f1"/>
    <!-- Head -->
    <circle cx="25" cy="22" r="12" fill="#fbcfe8"/>
    <!-- Hair -->
    <path d="M 13 20 C 13 12, 37 12, 37 20 C 37 24, 30 26, 25 25 C 20 26, 13 24, 13 20 Z" fill="#475569"/>
    <!-- Crossed Arms (Opposition Gesture) -->
    <path d="M 8 45 L 42 55 L 38 63 L 12 53 Z" fill="#4f46e5" stroke="#312e81" stroke-width="1.5"/>
    <path d="M 10 52 L 40 42 L 36 34 L 6 44 Z" fill="#6366f1" stroke="#312e81" stroke-width="1.5"/>
    <!-- Hands -->
    <circle cx="6" cy="48" r="4" fill="#fbcfe8"/>
    <circle cx="44" cy="48" r="4" fill="#fbcfe8"/>
    <!-- Determined Face -->
    <path d="M 20 23 L 24 21" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 30 23 L 26 21" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 22 28 Q 25 26 28 28" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Character 3 (Right - Back turned / disapproving) -->
  <g transform="translate(155, 105)">
    <!-- Body/Torso -->
    <path d="M 10 75 L 35 75 L 30 40 L 15 40 Z" fill="#0ea5e9"/>
    <!-- Head -->
    <circle cx="22" cy="22" r="12" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 10 20 C 10 10, 34 12, 34 22 C 28 22, 20 20, 10 20 Z" fill="#1e293b"/>
    <!-- Raised Hand / Stopping Gesture -->
    <path d="M 32 35 L 45 25 L 48 30 L 35 45 Z" fill="#0ea5e9"/>
    <circle cx="47" cy="27" r="4" fill="#fed7aa"/>
    <!-- Head turned away slightly -->
    <path d="M 18 24 L 22 24" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 18 29 Q 22 27 24 29" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- MAIN CHARACTER (Center Foreground - Strong Rejection / "反对" action) -->
  <g transform="translate(90, 95)">
    <!-- Lower Body / Sitting -->
    <rect x="18" y="65" width="24" height="30" rx="6" fill="#f59e0b"/>
    
    <!-- Torso leaning forward aggressively -->
    <path d="M 12 35 L 48 35 L 40 70 L 20 70 Z" fill="#d97706"/>
    
    <!-- Head -->
    <circle cx="30" cy="18" r="14" fill="#fde68a"/>
    <!-- Hair (Spiky/Energetic) -->
    <path d="M 16 16 L 20 8 L 26 13 L 32 7 L 38 13 L 44 16 C 45 24, 15 24, 16 16 Z" fill="#b45309"/>
    
    <!-- Face - Angry / Protesting expression -->
    <!-- Angry Eyebrows -->
    <path d="M 22 17 L 27 20" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 38 17 L 33 20" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="25" cy="22" r="1.5" fill="#78350f"/>
    <circle cx="35" cy="22" r="1.5" fill="#78350f"/>
    <!-- Open Mouth shouting/objecting -->
    <path d="M 27 26 Q 30 32 33 26 Z" fill="#78350f"/>

    <!-- Dynamic Outstretched Arms (Palm out / Stop / Objecting) -->
    <!-- Left Arm pushing forward -->
    <path d="M 12 40 L -10 45 L -8 53 L 14 48 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <!-- Left Palm / Hand Stop Sign -->
    <rect x="-16" y="43" width="8" height="12" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <path d="M -16 46 L -8 46" stroke="#b45309" stroke-width="1"/>

    <!-- Right Arm pushing forward -->
    <path d="M 48 40 L 70 45 L 68 53 L 46 48 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <!-- Right Palm / Hand Stop Sign -->
    <rect x="68" y="43" width="8" height="12" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <path d="M 68 46 L 76 46" stroke="#b45309" stroke-width="1"/>
  </g>

  <!-- Foreground Props: Documents / Rejected Proposal Folders on Table -->
  <g transform="translate(35, 175)">
    <!-- Folder 1 (Slanted & Tossed) -->
    <g transform="rotate(-15) scale(0.8)">
      <rect x="0" y="0" width="40" height="30" rx="3" fill="#ef4444" opacity="0.9"/>
      <rect x="5" y="5" width="30" height="20" fill="#f8fafc" opacity="0.9"/>
      <path d="M 12 10 L 28 20 M 28 10 L 12 20" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(160, 185)">
    <!-- Folder 2 (Slanted other way) -->
    <g transform="rotate(20) scale(0.8)">
      <rect x="0" y="0" width="40" height="30" rx="3" fill="#ef4444" opacity="0.9"/>
      <rect x="5" y="5" width="30" height="20" fill="#f8fafc" opacity="0.9"/>
      <path d="M 12 10 L 28 20 M 28 10 L 12 20" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating Prohibition / Opposition Visual Accents (Red Shield/Cross floating near center) -->
  <g transform="translate(120, 75)">
    <circle cx="0" cy="0" r="16" fill="#ef4444" opacity="0.2"/>
    <circle cx="0" cy="0" r="12" fill="#ef4444"/>
    <path d="M -6 -6 L 6 6 M 6 -6 L -6 6" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

</svg>