<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Glow for Atmosphere -->
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Book Cover Gradient (Thick Book) -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="15%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Page Stack Gradient (Deep Thickness) -->
    <linearGradient id="pagesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Bookmark Ribbon -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#lampGlow)" />

  <!-- Wooden Desk Surface -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="#090d16" />
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />

  <!-- Background Environmental Props (Cosy Study Vibe) -->
  <!-- Miniature plant in pot -->
  <path d="M 30 170 L 46 170 L 42 150 L 34 150 Z" fill="#475569" />
  <path d="M 38 150 C 30 135 20 145 25 130 C 35 130 38 145 38 150 Z" fill="#10b981" />
  <path d="M 38 150 C 46 135 56 145 51 130 C 41 130 38 145 38 150 Z" fill="#059669" />

  <!-- Coffee Mug emitting steam -->
  <rect x="195" y="150" width="22" height="30" rx="4" fill="#38bdf8" />
  <path d="M 217 158 C 225 158 225 172 217 172" stroke="#38bdf8" stroke-width="3" fill="none" />
  <path d="M 202 142 C 204 136 200 132 203 126" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 210 144 C 212 138 208 134 211 128" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- MAIN SUBJECT: THE THICK BOOK ("Hòu" / Dày) -->
  <g filter="url(#dropShadow)">
    
    <!-- Back Cover & Spine Extended (Showing Extreme Thickness) -->
    <path d="M 50 85 L 170 65 L 205 130 L 85 150 Z" fill="#78350f" />

    <!-- Massive Page Block (The "Thickness" Focus) -->
    <!-- Side Pages Stack -->
    <path d="M 55 90 L 170 70 L 195 120 L 80 140 Z" fill="url(#pagesGrad)" />
    <!-- Individual page line details to emphasize thickness -->
    <path d="M 58 96 L 168 76" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 61 102 L 166 82" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 64 108 L 164 88" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 67 114 L 162 94" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 70 120 L 160 100" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 73 126 L 158 106" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 76 132 L 156 112" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Bottom Book Cover -->
    <path d="M 50 140 L 170 120 L 195 170 L 75 190 Z" fill="url(#coverGrad)" />

    <!-- Top Book Cover (Slightly Open / Raised Perspective) -->
    <path d="M 45 80 L 165 60 L 195 110 L 75 130 Z" fill="url(#coverGrad)" />
    
    <!-- Cover Emblem/Details (Decorative Vector shapes, NO TEXT) -->
    <circle cx="120" cy="90" r="12" fill="#fbbf24" opacity="0.8" />
    <circle cx="120" cy="90" r="8" fill="#d97706" opacity="0.5" />
    <path d="M 105 105 L 135 100" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

    <!-- Hanging Bookmark Ribbon -->
    <path d="M 180 88 C 185 110 170 135 185 155 L 192 153 C 180 130 195 110 188 86 Z" fill="url(#ribbonGrad)" />

    <!-- Glowing Magic/Knowledge Sparkles emerging to make it lively -->
    <g transform="translate(140, 50)">
      <path d="M 0 0 L 3 6 L 9 9 L 3 12 L 0 18 L -3 12 L -9 9 L -3 6 Z" fill="#fbbf24" />
    </g>
    <g transform="translate(70, 70) scale(0.6)">
      <path d="M 0 0 L 3 6 L 9 9 L 3 12 L 0 18 L -3 12 L -9 9 L -3 6 Z" fill="#38bdf8" />
    </g>
    <g transform="translate(190, 100) scale(0.8)">
      <path d="M 0 0 L 3 6 L 9 9 L 3 12 L 0 18 L -3 12 L -9 9 L -3 6 Z" fill="#ec4899" />
    </g>

  </g>

  <!-- Foreground Atmospheric Elements (Depth of field blur effect with opacity dots) -->
  <circle cx="25" cy="110" r="3" fill="#38bdf8" opacity="0.4" />
  <circle cx="15" cy="130" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="225" cy="80" r="4" fill="#ec4899" opacity="0.3" />
</svg>