<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Character 1 Gradients (Prankster) -->
    <linearGradient id="shirt-c1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="hair-c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Character 2 Gradients (Surprised Friend) -->
    <linearGradient id="shirt-c2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hair-c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Object Gradients -->
    <linearGradient id="box-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="box-lid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="spring-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Room Interior Details -->
  <!-- Floor line -->
  <line x1="20" y1="190" x2="220" y2="190" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <!-- Background shelf / frame hint -->
  <rect x="40" y="45" width="40" height="8" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="160" y="65" width="50" height="8" rx="4" fill="#334155" opacity="0.6"/>

  <!-- ==================== CHARACTER 1: The Prankster (Left) ==================== -->
  <g id="character-prankster" filter="url(#shadow)">
    <!-- Body / Torso -->
    <path d="M 50,190 L 50,155 C 50,145 60,140 70,140 L 85,140 C 95,140 105,145 105,155 L 105,190 Z" fill="url(#shirt-c1)" />
    <!-- Arm holding behind or gesturing -->
    <path d="M 85,145 Q 110,140 115,160" stroke="#fb923c" stroke-width="10" stroke-linecap="round" fill="none" />
    
    <!-- Head & Neck -->
    <rect x="70" y="125" width="16" height="20" fill="#ffd166" />
    <circle cx="78" cy="115" r="20" fill="#ffd166" />
    <!-- Hair -->
    <path d="M 58,115 C 58,100 70,95 82,95 C 95,95 98,105 98,115 C 98,115 90,110 78,112 C 66,114 58,115 58,115 Z" fill="url(#hair-c1)" />
    
    <!-- Mischievous Face (Character 1) -->
    <!-- Smirking Eye -->
    <path d="M 70,112 Q 74,108 78,112" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 82,111 Q 86,107 90,111" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Smirk/Grin -->
    <path d="M 74,121 Q 82,128 88,121" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="#f43f5e" />
    
    <!-- Hand hiding giggle -->
    <circle cx="95" cy="126" r="7" fill="#ffd166" />
  </g>

  <!-- ==================== PROP: The Joke Box / Jack-in-the-Box ==================== -->
  <g id="joke-box" filter="url(#shadow)">
    <!-- Box Shadow on Floor -->
    <ellipse cx="120" cy="190" rx="22" ry="6" fill="#090d16" opacity="0.6" />

    <!-- Spring (Stretching out) -->
    <path d="M 115,165 L 125,150 L 112,135 L 128,120 L 115,105 L 122,95" stroke="url(#spring-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Open Box Base -->
    <rect x="98" y="160" width="44" height="30" rx="4" fill="url(#box-body)" />
    <!-- Box Details (Ribbon/Stripe) -->
    <rect x="115" y="160" width="10" height="30" fill="#fbbf24" opacity="0.9" />

    <!-- Flying Lid -->
    <path d="M 125,140 L 155,125 L 160,132 L 130,147 Z" fill="url(#box-lid)" />
  </g>


  <!-- ==================== CHARACTER 2: Surprised Target (Right) ==================== -->
  <g id="character-surprised" filter="url(#shadow)">
    <!-- Body / Torso (Reeling back slightly) -->
    <path d="M 145,190 L 150,155 C 151,145 160,140 170,140 L 185,140 C 195,140 202,148 200,158 L 195,190 Z" fill="url(#shirt-c2)" />
    
    <!-- Arms thrown up in surprise -->
    <path d="M 152,145 Q 140,120 125,125" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 183,145 Q 200,125 210,135" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Hands -->
    <circle cx="123" cy="125" r="5" fill="#fcd34d" />
    <circle cx="212" cy="137" r="5" fill="#fcd34d" />

    <!-- Head & Neck -->
    <rect x="167" y="125" width="16" height="20" fill="#fcd34d" />
    <circle cx="175" cy="112" r="20" fill="#fcd34d" />
    
    <!-- Hair -->
    <path d="M 158,110 C 158,95 170,90 182,92 C 194,94 195,105 195,112 C 185,108 165,108 158,110 Z" fill="url(#hair-c2)" />

    <!-- Shocked/Amused Face -->
    <!-- Wide Eyes -->
    <circle cx="168" cy="110" r="4" fill="#ffffff" />
    <circle cx="169" cy="110" r="1.5" fill="#0f172a" />
    <circle cx="182" cy="110" r="4" fill="#ffffff" />
    <circle cx="183" cy="110" r="1.5" fill="#0f172a" />
    <!-- Shocked Eyebrows (Arched high) -->
    <path d="M 164,103 Q 168,100 172,103" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 178,103 Q 182,100 186,103" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <!-- Open "O" mouth of surprise/laughter -->
    <ellipse cx="175" cy="120" rx="5" ry="7" fill="#881337" />
    <ellipse cx="175" cy="118" rx="3" ry="3.5" fill="#f43f5e" />
  </g>


  <!-- ==================== DYNAMIC EFFECTS / PRANK ELEMENTS ==================== -->
  <!-- Floating Confetti / Surprise Sparkles -->
  <g id="confetti" opacity="0.9">
    <!-- Star sparkles -->
    <path d="M 140,95 L 143,102 L 150,105 L 143,108 L 140,115 L 137,108 L 130,105 L 137,102 Z" fill="#fbbf24" />
    <path d="M 105,75 L 107,80 L 112,82 L 107,84 L 105,89 L 103,84 L 98,82 L 103,80 Z" fill="#38bdf8" transform="scale(0.8) translate(30, 20)" />
    
    <!-- Colorful confetti bits -->
    <rect x="155" y="85" width="6" height="4" rx="1" fill="#ec4899" transform="rotate(25 158 87)" />
    <rect x="95" y="105" width="5" height="5" rx="1" fill="#10b981" transform="rotate(-15 97 107)" />
    <rect x="125" y="70" width="7" height="3" rx="1" fill="#fb923c" transform="rotate(45 128 71)" />
    <circle cx="85" cy="90" r="2.5" fill="#a855f7" />
    <circle cx="165" cy="105" r="2" fill="#38bdf8" />
  </g>

  <!-- Sweat drop on prankster for expressive playful tension -->
  <path d="M 94,98 Q 97,104 94,107 Q 91,104 94,98 Z" fill="#38bdf8" opacity="0.8" />
</svg>