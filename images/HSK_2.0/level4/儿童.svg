<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Slide Gradient -->
    <linearGradient id="slideGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100% " stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100% " stop-color="#047857"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Night Park Elements (Stars/Lights) -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="35" cy="45" r="2"/>
    <circle cx="205" cy="35" r="1.5"/>
    <circle cx="180" cy="70" r="2.5"/>
    <circle cx="60" cy="80" r="1.5"/>
  </g>
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="20" cy="110" r="2"/>
    <circle cx="220" cy="95" r="2"/>
  </g>

  <!-- Ground / Park Terrain -->
  <path d="M0 180 Q 80 165, 240 185 L 240 240 L 0 240 Z" fill="url(#groundGrad)"/>
  <!-- Secondary grassy mound for depth -->
  <path d="M0 200 Q 140 190, 240 210 L 240 240 L 0 240 Z" fill="#065f46" opacity="0.7"/>

  <!-- Playground Equipment: Slide -->
  <!-- Slide Support Structure -->
  <path d="M140 120 L155 190" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M170 120 L185 190" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Ladder Steps -->
  <line x1="144" y1="140" x2="158" y2="140" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="160" x2="162" y2="160" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="151" y1="180" x2="165" y2="180" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Slide Chute -->
  <path d="M90 90 Q 130 110, 175 125 L 185 115 Q 145 100, 100 80 Z" fill="#d97706"/>
  <path d="M95 85 L 175 125 L 170 135 L 85 95 Z" fill="url(#slideGrad)" filter="url(#shadow)"/>

  <!-- Playground Equipment: Seesaw (Background context) -->
  <g opacity="0.9">
    <polygon points="50,195 60,175 70,195" fill="#64748b"/>
    <line x1="20" y1="183" x2="100" y2="183" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="20" cy="180" r="6" fill="#38bdf8"/>
    <circle cx="100" cy="186" r="6" fill="#38bdf8"/>
  </g>

  <!-- MAIN SUBJECT: Child 1 (Sliding down actively with joy) -->
  <g transform="translate(10, -5)" filter="url(#shadow)">
    <!-- Motion lines -->
    <path d="M80 75 L65 70" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M90 65 L75 60" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Body/Torso (Blue Hoodie) -->
    <path d="M100 95 L125 107 L112 125 L88 113 Z" fill="#0ea5e9"/>
    <!-- Hoodie Hood/Head -->
    <circle cx="112" cy="85" r="12" fill="#fb923c"/>
    <!-- Face (Profile laughing) -->
    <path d="M120 84 Q 124 88, 118 92" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M102 80 Q 110 70, 122 78" fill="#1e293b"/>

    <!-- Arms raised in excitement -->
    <path d="M110 98 L130 90" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
    <path d="M103 105 L115 120" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>

    <!-- Legs extended on slide -->
    <path d="M120 120 L150 135" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <path d="M125 127 L155 142" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
    <!-- Sneakers -->
    <ellipse cx="153" cy="136" rx="5" ry="3" fill="#f43f5e"/>
    <ellipse cx="158" cy="143" rx="5" ry="3" fill="#f43f5e"/>
  </g>

  <!-- SECOND SUBJECT: Child 2 (Running/Playing happily near the base of the slide) -->
  <g transform="translate(0, 5)" filter="url(#shadow)">
    <!-- Torso (Pink/Magenta Shirt) -->
    <path d="M185 160 L200 175 L190 195 L175 180 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="192" cy="148" r="11" fill="#fbcfe8"/>
    <!-- Ponytail -->
    <path d="M200 145 Q 212 140, 205 155" fill="#881337"/>
    <!-- Face expression -->
    <path d="M195 150 Q 198 154, 202 150" stroke="#831843" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Arms (Action pose) -->
    <path d="M180 168 L165 175" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>
    <path d="M195 170 L210 160" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>

    <!-- Legs (Running stride) -->
    <path d="M185 190 L170 215" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
    <path d="M182 192 L195 212" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="168" cy="217" rx="4" ry="2.5" fill="#f59e0b"/>
    <ellipse cx="197" cy="214" rx="4" ry="2.5" fill="#f59e0b"/>
  </g>

  <!-- Atmospheric Foreground Details: Vibrant bushes/flowers -->
  <g>
    <circle cx="30" cy="190" r="16" fill="#059669"/>
    <circle cx="18" cy="198" r="12" fill="#10b981"/>
    <circle cx="42" cy="195" r="14" fill="#047857"/>
    <!-- Colorful flower dots on bushes -->
    <circle cx="25" cy="185" r="3" fill="#f43f5e"/>
    <circle cx="36" cy="192" r="3" fill="#fbbf24"/>
    <circle cx="32" cy="202" r="2.5" fill="#f43f5e"/>

    <circle cx="215" cy="205" r="12" fill="#059669"/>
    <circle cx="225" cy="212" r="10" fill="#10b981"/>
    <circle cx="205" cy="210" r="11" fill="#047857"/>
    <circle cx="218" cy="202" r="2.5" fill="#fbbf24"/>
  </g>

  <!-- Little bouncing ball on the grass -->
  <circle cx="140" cy="200" r="7" fill="#ef4444" filter="url(#shadow)"/>
  <path d="M136 197 Q 138 195, 142 197" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>