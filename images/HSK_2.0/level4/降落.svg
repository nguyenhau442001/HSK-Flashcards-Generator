<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#111c38" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Runway Glow Gradient -->
    <linearGradient id="runwayGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Wing Light Glow -->
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Motion Blur Filter for Touchdown Effect -->
    <filter id="motionBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5, 0" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Stars / Atmosphere -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="35" cy="30" r="1" />
    <circle cx="85" cy="20" r="1.5" />
    <circle cx="150" cy="35" r="1" />
    <circle cx="205" cy="25" r="1.2" />
    <circle cx="25" cy="65" r="1.2" />
    <circle cx="215" cy="70" r="1" />
  </g>

  <!-- Distant Cityscape & Horizon -->
  <path d="M0 130 L15 125 L22 130 L45 120 L52 130 L75 115 L88 130 L115 122 L130 130 L160 118 L170 130 L195 124 L210 130 L240 120 L240 140 L0 140 Z" fill="#0f172a" opacity="0.7" />
  <!-- Glowing City Lights -->
  <g fill="#f59e0b" opacity="0.8">
    <circle cx="17" cy="127" r="0.8" />
    <circle cx="47" cy="124" r="0.8" />
    <circle cx="78" cy="119" r="0.8" />
    <circle cx="118" cy="125" r="0.8" />
    <circle cx="163" cy="122" r="0.8" />
    <circle cx="198" cy="127" r="0.8" />
  </g>

  <!-- Airport Control Tower (Background Context) -->
  <g transform="translate(190, 80)">
    <path d="M12 50 L18 10 L26 10 L32 50 Z" fill="#334155" />
    <!-- Tower Cabin -->
    <path d="M8 10 L36 10 L34 2 L10 2 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <rect x="13" y="4" width="12" height="5" fill="#f59e0b" rx="1" opacity="0.9" />
    <!-- Radar Dish -->
    <path d="M22 2 L22 -4 M18 -4 L26 -4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <!-- Blinking Beacon -->
    <circle cx="22" cy="-6" r="2" fill="#ef4444" />
  </g>

  <!-- Perspective Runway -->
  <polygon points="40,240 100,135 140,135 200,240" fill="#090d16" />
  
  <!-- Runway Edge Lights (Amber/Red) -->
  <g fill="#f59e0b">
    <circle cx="105" cy="142" r="1.5" />
    <circle cx="95" cy="158" r="1.8" />
    <circle cx="82" cy="178" r="2.2" />
    <circle cx="67" cy="202" r="2.6" />
    <circle cx="50" cy="230" r="3" />

    <circle cx="135" cy="142" r="1.5" />
    <circle cx="145" cy="158" r="1.8" />
    <circle cx="158" cy="178" r="2.2" />
    <circle cx="173" cy="202" r="2.6" />
    <circle cx="190" cy="230" r="3" />
  </g>

  <!-- Runway Centerline Dashes -->
  <polygon points="119,138 121,138 122,145 118,145" fill="#ffffff" opacity="0.9" />
  <polygon points="118,152 122,152 124,162 116,162" fill="#ffffff" opacity="0.9" />
  <polygon points="116,170 124,170 127,184 113,184" fill="#ffffff" opacity="0.9" />
  <polygon points="112,193 128,193 132,212 108,212" fill="#ffffff" opacity="0.9" />
  <polygon points="106,222 134,222 140,245 100,245" fill="#ffffff" opacity="0.9" />

  <!-- Approach Lighting / Ambient Runway Glow -->
  <ellipse cx="120" cy="137" rx="45" ry="12" fill="url(#runwayGlow)" />

  <!-- TOUCHDOWN SMOKE / IMPACT EFFECT -->
  <g opacity="0.85">
    <ellipse cx="105" cy="139" rx="14" ry="6" fill="#cbd5e1" filter="url(#motionBlur)" />
    <circle cx="92" cy="138" r="8" fill="#e2e8f0" filter="url(#motionBlur)" />
    <circle cx="118" cy="137" r="10" fill="#94a3b8" filter="url(#motionBlur)" />
  </g>

  <!-- THE AIRPLANE (Main Subject - Landing Action) -->
  <g transform="translate(15, -5)">
    
    <!-- Motion lines / Speed trails behind the plane -->
    <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4" filter="url(#motionBlur)">
      <line x1="25" y1="110" x2="60" y2="110" />
      <line x1="15" y1="118" x2="50" y2="118" />
      <line x1="30" y1="126" x2="55" y2="126" />
    </g>

    <!-- Contrail/Vapor from Wing -->
    <path d="M 68 114 Q 90 125 105 137" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" filter="url(#motionBlur)" />

    <!-- Rear Tail Fin -->
    <path d="M 50 102 L 40 75 L 62 82 L 64 100 Z" fill="#cbd5e1" />
    <path d="M 52 85 L 59 87 L 57 97 L 50 95 Z" fill="#ef4444" /> <!-- Airline accent stripe -->

    <!-- Main Fuselage -->
    <path d="M 45 103 C 45 103, 90 98, 140 110 C 170 117, 175 122, 165 125 C 155 128, 90 123, 45 116 Z" fill="#f8fafc" />
    <!-- Fuselage Belly Shading -->
    <path d="M 45 116 C 90 123, 155 128, 165 125 C 160 127, 100 125, 45 116 Z" fill="#cbd5e1" />

    <!-- Cockpit Windows -->
    <path d="M 138 113 L 152 116 L 154 119 L 138 117 Z" fill="#0f172a" />
    
    <!-- Passenger Windows Line -->
    <g fill="#0f172a">
      <circle cx="125" cy="115" r="1.2" />
      <circle cx="115" cy="114.5" r="1.2" />
      <circle cx="105" cy="114" r="1.2" />
      <circle cx="95" cy="113.5" r="1.2" />
      <circle cx="85" cy="113" r="1.2" />
      <circle cx="75" cy="112.5" r="1.2" />
    </g>

    <!-- Red/Blue Airline Stripe on Fuselage -->
    <path d="M 48 112 Q 100 111 158 120 L 158 122 Q 100 113 48 114 Z" fill="#38bdf8" />

    <!-- Port Wing (Swept back, angled down for banking landing pose) -->
    <!-- Wing shadow/underside -->
    <path d="M 85 118 L 125 124 L 70 148 Z" fill="#94a3b8" />
    <!-- Main Wing Top -->
    <path d="M 80 116 L 125 123 L 65 142 Z" fill="#e2e8f0" />
    <!-- Flaps Extended Down (Landing configuration) -->
    <path d="M 72 136 L 118 124 L 121 127 L 75 145 Z" fill="#cbd5e1" />

    <!-- Landing Gear (Wheels touching down with impact sparks/smoke) -->
    <!-- Front/Nose Gear -->
    <g transform="translate(138, 123)">
      <line x1="0" y1="0" x2="2" y2="8" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="2" cy="9" r="2.5" fill="#1e293b" stroke="#f8fafc" stroke-width="1" />
      <!-- Impact spark -->
      <circle cx="4" cy="10" r="1.5" fill="#fbbf24" />
    </g>

    <!-- Main Landing Gear (Left) -->
    <g transform="translate(95, 123)">
      <line x1="0" y1="0" x2="-2" y2="12" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <!-- Wheel bogie -->
      <rect x="-6" y="11" width="8" height="4" rx="2" fill="#1e293b" stroke="#f8fafc" stroke-width="1" />
      <!-- Spark / Dust particles on contact -->
      <circle cx="-5" cy="15" r="2" fill="#fbbf24" />
      <circle cx="-9" cy="14" r="1.5" fill="#f97316" />
    </g>

    <!-- Starboard Wing (Visible partially behind fuselage) -->
    <path d="M 90 108 L 130 112 L 105 95 Z" fill="#cbd5e1" />

    <!-- Wingtip Landing Light Beam -->
    <polygon points="65,142 35,165 40,170 68,144" fill="url(#lightGlow)" opacity="0.6" style="mix-blend-mode: screen;" />
    <circle cx="66" cy="142" r="2.5" fill="#ffffff" />
    <circle cx="66" cy="142" r="5" fill="url(#lightGlow)" />

  </g>

  <!-- Foreground Atmospheric Vignette / Frame Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
</svg>