<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Workspace -->
    <radialGradient id="desk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Wooden Desk Surface Gradient -->
    <linearGradient id="desk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Block Gradients (Energetic HSK Palette) -->
    <linearGradient id="block-pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <linearGradient id="block-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="block-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="block-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="block-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Drop Shadow for Blocks -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg)" />

  <!-- Ambient Light Circle -->
  <circle cx="120" cy="140" r="90" fill="url(#desk-glow)" />

  <!-- Background Environment: Isometric Desk & Shelf elements -->
  <g opacity="0.4">
    <path d="M40 70 L200 70 L220 90 L20 90 Z" fill="#475569" />
    <rect x="50" y="45" width="20" height="25" rx="3" fill="#64748b" />
    <rect x="75" y="40" width="16" height="30" rx="3" fill="#475569" />
    <path d="M170 55 L190 40 L195 50 L175 65 Z" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Main Wooden Workspace Surface -->
  <path d="M20 150 L220 150 L235 210 L5 210 Z" fill="url(#desk)" stroke="#475569" stroke-width="1.5" />
  <!-- Desk edge highlight -->
  <path d="M5 210 L235 210 L235 214 L5 214 Z" fill="#0f172a" />

  <!-- Action Guide / Track Arrow (Visualizing sorting/arranging motion) -->
  <path d="M 45 125 Q 120 95 195 125" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.6" />
  <path d="M 188 120 L 198 126 L 189 133" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- THE SEQUENCE (Arranged blocks in a neat row, representing 排列 - to arrange in order) -->
  
  <!-- Block 1: Pink cylinder / pillar -->
  <g filter="url(#shadow)" transform="translate(35, 125)">
    <path d="M 0 15 L 0 35 C 0 40, 20 40, 20 35 L 20 15 C 20 10, 0 10, 0 15 Z" fill="url(#block-pink)" />
    <ellipse cx="10" cy="15" rx="10" ry="5" fill="#f472b6" />
    <!-- Number-like clear aesthetic groove -->
    <line x1="7" y1="22" x2="13" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Block 2: Blue arch / dome -->
  <g filter="url(#shadow)" transform="translate(68, 118)">
    <path d="M 0 42 L 0 22 C 0 10, 22 10, 22 22 L 22 42 Z" fill="url(#block-blue)" />
    <ellipse cx="11" cy="22" rx="11" ry="5" fill="#38bdf8" />
    <circle cx="11" cy="28" r="3" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Block 3: Amber triangular prism -->
  <g filter="url(#shadow)" transform="translate(101, 112)">
    <path d="M 2 48 L 12 12 L 22 48 Z" fill="url(#block-amber)" />
    <path d="M 12 12 L 22 48 L 17 50 L 7 14 Z" fill="#b45309" opacity="0.3"/>
    <ellipse cx="12" cy="48" rx="10" ry="4" fill="#fbbf24" />
    <circle cx="12" cy="32" r="2.5" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Block 4: Emerald cube -->
  <g filter="url(#shadow)" transform="translate(135, 118)">
    <path d="M 2 10 L 18 2 L 34 10 L 18 18 Z" fill="#6ee7b7" />
    <path d="M 2 10 L 18 18 L 18 40 L 2 32 Z" fill="url(#block-emerald)" />
    <path d="M 18 18 L 34 10 L 34 32 L 18 40 Z" fill="#047857" />
    <circle cx="18" cy="26" r="3" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Block 5: Purple tall cylinder -->
  <g filter="url(#shadow)" transform="translate(178, 105)">
    <path d="M 0 20 L 0 55 C 0 60, 18 60, 18 55 L 18 20 C 18 15, 0 15, 0 20 Z" fill="url(#block-purple)" />
    <ellipse cx="9" cy="20" rx="9" ry="4.5" fill="#c4b5fd" />
    <line x1="6" y1="35" x2="12" y2="35" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="6" y1="42" x2="12" y2="42" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Foreground Atmospheric Elements & Mini Props -->
  <!-- Small stray sorting token being placed -->
  <g filter="url(#shadow)" transform="translate(145, 155) rotate(-15)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#fb923c" />
    <circle cx="8" cy="8" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Mechanical/Smart Sorting Caliper / Tool accent on the left -->
  <g transform="translate(15, 160)" opacity="0.7">
    <path d="M0 10 L25 -10 L28 -5 L5 15 Z" fill="#64748b" />
    <circle cx="5" cy="12" r="4" fill="#94a3b8" />
  </g>

  <!-- Sparkles/Success Accents indicating correct arrangement -->
  <g fill="#fbbf24">
    <path d="M 55 90 Q 55 95 50 95 Q 55 95 55 100 Q 55 95 60 95 Q 55 95 55 90" />
    <path d="M 195 95 Q 195 99 191 99 Q 195 99 195 103 Q 195 99 199 99 Q 195 99 195 95" />
    <circle cx="120" cy="85" r="2" fill="#38bdf8" />
    <circle cx="85" cy="90" r="1.5" fill="#f472b6" />
  </g>
</svg>