<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Light Effect -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Wood Texture / Surface Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="book-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow-strong" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Glow -->
  <circle cx="120" cy="110" r="90" fill="url(#glow)" />

  <!-- Background Environment Elements (Bookshelf / Ambient Depth) -->
  <g opacity="0.15">
    <rect x="25" y="40" width="18" height="60" rx="3" fill="#38bdf8" />
    <rect x="47" y="35" width="14" height="65" rx="3" fill="#ec4899" />
    <rect x="175" y="45" width="22" height="55" rx="3" fill="#10b981" />
    <rect x="201" y="38" width="15" height="62" rx="3" fill="#fb923c" />
    <!-- Shelf line -->
    <rect x="15" y="100" width="210" height="4" rx="2" fill="#64748b" />
  </g>

  <!-- Desk Surface -->
  <path d="M 0 170 L 240 170 L 240 225 C 240 233 233 240 225 240 L 15 240 C 7 240 0 233 0 225 Z" fill="url(#desk-grad)" />
  <rect x="0" y="165" width="240" height="5" fill="#1e293b" opacity="0.6" />

  <!-- Main Scene: Open Dictionary/Book -->
  <g filter="url(#shadow)">
    <!-- Book Shadows and Base -->
    <path d="M 50 115 C 80 105, 110 110, 120 120 L 120 175 C 110 165, 80 160, 50 170 Z" fill="#b45309" />
    <path d="M 190 115 C 160 105, 130 110, 120 120 L 120 175 C 130 165, 160 160, 190 170 Z" fill="#b45309" />

    <!-- Left Page -->
    <path d="M 53 118 C 80 109, 110 114, 118 122 L 118 171 C 110 163, 80 158, 53 167 Z" fill="url(#paper-grad)" />
    <!-- Right Page -->
    <path d="M 187 118 C 160 109, 130 114, 122 122 L 122 171 C 130 163, 160 158, 187 167 Z" fill="url(#paper-grad)" />

    <!-- Book Spine Center Dark Line -->
    <line x1="120" y1="120" x2="120" y2="173" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- Abstract Lines on Pages representing 'Cíyǔ' (Words/Sentences) -->
  <g opacity="0.4" stroke="#64748b" stroke-linecap="round" stroke-width="3">
    <!-- Left Page Lines -->
    <line x1="65" y1="130" x2="100" y2="127" />
    <line x1="63" y1="142" x2="105" y2="139" />
    <line x1="64" y1="154" x2="95" y2="151" />

    <!-- Right Page Lines -->
    <line x1="135" y1="127" x2="175" y2="130" />
    <line x1="137" y1="139" x2="170" y2="142" />
    <line x1="136" y1="151" x2="165" y2="154" />
  </g>

  <!-- Magnifying Glass (Active Exploration/Discovery of Words) -->
  <g filter="url(#shadow)" transform="rotate(-15, 120, 105)">
    <!-- Glass Area / Highlight and Ring -->
    <circle cx="120" cy="95" r="32" fill="#0f172a" opacity="0.3" />
    <circle cx="120" cy="95" r="28" fill="#e0f2fe" fill-opacity="0.85" stroke="#38bdf8" stroke-width="4" />
    
    <!-- Lens Light Reflection Arc -->
    <path d="M 100 82 A 24 24 0 0 1 138 78" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Magnifying Glass Handle -->
    <path d="M 120 123 L 120 155 C 120 158, 123 161, 127 161 L 131 161 C 135 161, 138 158, 138 155 L 138 123 Z" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <rect x="123" y="130" width="12" height="22" rx="2" fill="#475569" />
  </g>

  <!-- Sparkling / Floating Linguistic Elements (Action & Vibrant Learning Context) -->
  <g>
    <!-- Glowing Star/Spark 1 (Top Left) -->
    <path d="M 60 70 Q 60 80 50 80 Q 60 80 60 90 Q 60 80 70 80 Q 60 80 60 70 Z" fill="#fbbf24" filter="url(#glow-strong)" />
    <circle cx="60" cy="80" r="2" fill="#ffffff" />

    <!-- Glowing Star/Spark 2 (Top Right) -->
    <path d="M 180 55 Q 180 65 170 65 Q 180 65 180 75 Q 180 65 190 65 Q 180 65 180 55 Z" fill="#38bdf8" filter="url(#glow-strong)" />
    <circle cx="180" cy="65" r="2" fill="#ffffff" />

    <!-- Small Floating Accent Orbs -->
    <circle cx="90" cy="60" r="4" fill="#ec4899" opacity="0.8" />
    <circle cx="150" cy="50" r="3" fill="#10b981" opacity="0.8" />
    <circle cx="45" cy="120" r="3.5" fill="#fb923c" opacity="0.9" />
    <circle cx="195" cy="115" r="5" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- Floating Semantic Concept Nodes / Dynamic Vector Blobs (Representing Words Connecting) -->
  <g opacity="0.9">
    <!-- Node 1 -->
    <rect x="75" y="42" width="24" height="14" rx="7" fill="#fbbf24" filter="url(#shadow)" />
    <circle cx="87" cy="49" r="3" fill="#0f172a" />

    <!-- Node 2 -->
    <rect x="138" y="38" width="28" height="14" rx="7" fill="#ec4899" filter="url(#shadow)" />
    <circle cx="152" cy="45" r="3" fill="#ffffff" />

    <!-- Connecting Dynamic Flow Line -->
    <path d="M 99 49 C 110 30, 125 30, 138 45" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.6" />
  </g>

</svg>