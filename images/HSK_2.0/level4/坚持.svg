<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Floor -->
    <path d="M0 140 L160 140 L170 160 L-10 160 Z" fill="#334155"/>
    
    <!-- Runner's Legs -->
    <path d="M60 130 L75 80 L90 130 Z" fill="#fb923c"/>
    <path d="M95 130 L110 80 L125 130 Z" fill="#f59e0b"/>
    
    <!-- Body -->
    <path d="M70 40 C70 20 110 20 110 40 L105 80 L75 80 Z" fill="#38bdf8"/>
    
    <!-- Head -->
    <circle cx="90" cy="35" r="20" fill="#fde68a"/>
    <path d="M80 30 L85 35 L80 40" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M100 30 L95 35 L100 40" stroke="#1e293b" stroke-width="2" fill="none"/>
    
    <!-- Sweat drops -->
    <path d="M115 20 Q120 30 115 35 Q110 30 115 20" fill="#38bdf8"/>
    
    <!-- Background elements (Distance markers) -->
    <rect x="140" y="50" width="10" height="80" rx="2" fill="#475569"/>
    <rect x="142" y="55" width="6" height="10" fill="#fbbf24"/>
    
    <!-- Motion lines -->
    <path d="M20 60 L40 60" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 80 L30 80" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Sun/Energy glow -->
    <circle cx="180" cy="30" r="25" fill="#fbbf24" opacity="0.2"/>
    <circle cx="180" cy="30" r="15" fill="#f59e0b"/>
  </g>
</svg>