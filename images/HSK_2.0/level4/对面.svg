<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Post Office Gradient (Warm Amber/Orange) -->
    <linearGradient id="postGrad" x1="20" y1="80" x2="110" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Bank Gradient (Cool Cyan/Blue) -->
    <linearGradient id="bankGrad" x1="130" y1="80" x2="220" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Road Surface -->
    <linearGradient id="roadGrad" x1="120" y1="180" x2="120" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Night/Evening Sky Details -->
  <circle cx="50" cy="40" r="1.5" fill="#64748b" opacity="0.6"/>
  <circle cx="190" cy="30" r="1.5" fill="#64748b" opacity="0.6"/>
  <circle cx="210" cy="65" r="1" fill="#64748b" opacity="0.4"/>
  <circle cx="30" cy="70" r="1" fill="#64748b" opacity="0.4"/>

  <!-- Ambient Light Cone from Streetlamp -->
  <path d="M120 72 L70 200 L170 200 Z" fill="#fef08a" opacity="0.05" filter="url(#glow)"/>

  <!-- ==================== BACKGROUND BUILDINGS (Context) ==================== -->
  <!-- Left Building (Post Office - 邮局) -->
  <g filter="url(#dropShadow)">
    <rect x="20" y="85" width="90" height="115" rx="4" fill="url(#postGrad)"/>
    <!-- Roof Accent -->
    <polygon points="15,85 115,85 110,72 20,72" fill="#d97706"/>
    <!-- Windows -->
    <rect x="32" y="100" width="20" height="26" rx="3" fill="#1e293b" opacity="0.8"/>
    <rect x="68" y="100" width="20" height="26" rx="3" fill="#1e293b" opacity="0.8"/>
    <rect x="32" y="140" width="20" height="26" rx="3" fill="#1e293b" opacity="0.8"/>
    <rect x="68" y="140" width="20" height="26" rx="3" fill="#1e293b" opacity="0.8"/>
    <!-- Post Icon Graphic (Envelope Symbol stylized) -->
    <circle cx="65" cy="55" r="14" fill="#ffffff" filter="url(#dropShadow)"/>
    <path d="M57 51 h16 v8 h-16 z" fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/>
    <path d="M57 51 l8 5 l8 -5" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Building (Bank - 银行) -->
  <g filter="url(#dropShadow)">
    <rect x="130" y="85" width="90" height="115" rx="4" fill="url(#bankGrad)"/>
    <!-- Roof/Columns -->
    <rect x="130" y="75" width="90" height="10" rx="2" fill="#0369a1"/>
    <rect x="142" y="95" width="8" height="90" rx="2" fill="#e0f2fe" opacity="0.8"/>
    <rect x="166" y="95" width="8" height="90" rx="2" fill="#e0f2fe" opacity="0.8"/>
    <rect x="190" y="95" width="8" height="90" rx="2" fill="#e0f2fe" opacity="0.8"/>
    <!-- Bank Windows -->
    <rect x="154" y="110" width="10" height="20" rx="2" fill="#1e293b" opacity="0.8"/>
    <rect x="178" y="110" width="10" height="20" rx="2" fill="#1e293b" opacity="0.8"/>
    <!-- Bank Icon Graphic (Coin/Shield Symbol stylized) -->
    <circle cx="175" cy="55" r="14" fill="#ffffff" filter="url(#dropShadow)"/>
    <circle cx="175" cy="55" r="8" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <path d="M175 49 v12" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ==================== STREET & ENVIRONMENT ==================== -->
  <!-- Street / Road separating the two ("Đối diện" across the street) -->
  <rect x="0" y="180" width="240" height="60" fill="url(#roadGrad)"/>
  
  <!-- Road Dashes -->
  <line x1="20" y1="210" x2="50" y2="210" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
  <line x1="70" y1="210" x2="100" y2="210" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
  <line x1="120" y1="210" x2="150" y2="210" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
  <line x1="170" y1="210" x2="200" y2="210" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
  <line x1="220" y1="210" x2="235" y2="210" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- Sidewalks -->
  <rect x="0" y="175" width="240" height="7" fill="#475569"/>
  <rect x="0" y="175" width="240" height="2" fill="#64748b"/>

  <!-- ==================== INTERACTION & "FACING" ELEMENTS ==================== -->
  <!-- Central Streetlamp casting warm light -->
  <rect x="117" y="55" width="6" height="125" fill="#475569" filter="url(#dropShadow)"/>
  <path d="M110 55 C110 45, 130 45, 130 55 Z" fill="#334155"/>
  <circle cx="120" cy="58" r="5" fill="#fef08a" filter="url(#glow)"/>

  <!-- Visual Connection: "Face-to-Face" (Đối diện) Indicator Arrows -->
  <g filter="url(#dropShadow)">
    <!-- Left pointing arrow over street -->
    <path d="M95 145 C105 140, 105 150, 115 145" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/>
    <polygon points="117,142 123,146 115,150" fill="#ec4899"/>
    
    <!-- Right pointing arrow over street -->
    <path d="M145 145 C135 140, 135 150, 125 145" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/>
    <polygon points="123,142 117,146 125,150" fill="#ec4899"/>
  </g>

  <!-- Cute Character 1 (Looking out from Post Office) -->
  <g transform="translate(48, 145)" filter="url(#dropShadow)">
    <!-- Body/Shirt -->
    <circle cx="12" cy="20" r="10" fill="#10b981"/>
    <!-- Head -->
    <circle cx="12" cy="10" r="8" fill="#fde047"/>
    <!-- Friendly Face Expression -->
    <circle cx="10" cy="9" r="1" fill="#1e293b"/>
    <circle cx="14" cy="9" r="1" fill="#1e293b"/>
    <path d="M10 12 Q12 14 14 12" fill="none" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Cute Character 2 (Looking out from Bank, facing Character 1 directly across the street) -->
  <g transform="translate(178, 145)" filter="url(#dropShadow)">
    <!-- Body/Shirt -->
    <circle cx="12" cy="20" r="10" fill="#f43f5e"/>
    <!-- Head -->
    <circle cx="12" cy="10" r="8" fill="#fde047"/>
    <!-- Friendly Face Expression -->
    <circle cx="10" cy="9" r="1" fill="#1e293b"/>
    <circle cx="14" cy="9" r="1" fill="#1e293b"/>
    <path d="M10 12 Q12 14 14 12" fill="none" stroke="#1e293b" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Plant / Tree Leaf on Left -->
  <path d="M0 160 Q15 150, 10 175 Q0 175, 0 160 Z" fill="#059669" opacity="0.9" filter="url(#dropShadow)"/>
  <path d="M0 170 Q25 160, 20 185 Q0 185, 0 170 Z" fill="#10b981" opacity="0.8"/>
</svg>