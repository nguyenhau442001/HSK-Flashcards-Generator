<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Glowing effect for medical light -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadows for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Ambient background elements (Clinic room atmosphere) -->
  <g opacity="0.15">
    <!-- Medical cabinet outline -->
    <rect x="25" y="30" width="60" height="90" rx="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="55" y1="30" x2="55" y2="120" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="48" cy="75" r="3" fill="#38bdf8"/>
    
    <!-- Wall medical cross light -->
    <path d="M190,40 h10 v15 h15 v10 h-15 v15 h-10 v-15 h-15 v-10 h15 z" fill="#38bdf8" opacity="0.3"/>
    
    <!-- Floor line -->
    <line x1="0" y1="195" x2="240" y2="195" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Exam Table / Bed -->
  <g filter="url(#shadow)">
    <!-- Table base/legs -->
    <path d="M60,195 L50,150 L70,150 L75,195 Z" fill="#334155"/>
    <path d="M180,195 L185,150 L165,150 L160,195 Z" fill="#334155"/>
    <!-- Cushion -->
    <rect x="35" y="130" width="170" height="25" rx="8" fill="#475569"/>
    <rect x="35" y="130" width="170" height="12" rx="6" fill="#64748b"/>
  </g>

  <!-- Cute Baby Patient (Scene Subject) -->
  <g id="baby-patient" filter="url(#shadow)">
    <!-- Pillow -->
    <ellipse cx="75" cy="125" rx="20" ry="10" fill="#cbd5e1"/>
    
    <!-- Baby Body under blanket -->
    <path d="M60,150 Q70,120 120,120 L160,150 Z" fill="#38bdf8"/>
    <!-- Blanket fold/texture -->
    <path d="M70,140 Q100,125 150,145" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>

    <!-- Baby Head -->
    <circle cx="85" cy="115" r="22" fill="#ffd166"/>
    
    <!-- Cheeks (Scared/shy flush) -->
    <circle cx="74" cy="122" r="5" fill="#ef4444" opacity="0.4"/>
    <circle cx="96" cy="122" r="5" fill="#ef4444" opacity="0.4"/>

    <!-- Eyes (Wincing / Tearful) -->
    <path d="M76,112 Q80,108 84,112" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M88,112 Q92,108 96,112" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tiny tear -->
    <circle cx="96" cy="116" r="2" fill="#38bdf8"/>

    <!-- Mouth (Worried/O-shape) -->
    <ellipse cx="86" cy="123" rx="3" ry="4" fill="#1e293b"/>

    <!-- Hair tuft -->
    <path d="M85,93 Q90,85 88,95" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

    <!-- Little arm clutching blanket -->
    <circle cx="105" cy="135" r="8" fill="#ffd166"/>
  </g>

  <!-- Pediatrician / Nurse character providing context -->
  <g id="nurse" filter="url(#shadow)">
    <!-- Body/Uniform -->
    <path d="M165,200 L160,140 L195,140 L200,200 Z" fill="#f8fafc"/>
    <!-- Stethoscope -->
    <path d="M175,140 Q180,155 185,140" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="185" cy="158" r="4" fill="#94a3b8"/>
    
    <!-- Nurse Head -->
    <circle cx="180" cy="115" r="18" fill="#fbcfe8"/>
    <!-- Nurse Cap -->
    <path d="M168,102 Q180,95 192,102 L189,96 L171,96 Z" fill="#ffffff"/>
    <path d="M178,98 h4 v6 h-4 z" fill="#ef4444"/>

    <!-- Gentle Friendly Face -->
    <circle cx="174" cy="113" r="1.5" fill="#1e293b"/>
    <circle cx="186" cy="113" r="1.5" fill="#1e293b"/>
    <path d="M178,118 Q180,121 182,118" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nurse Arm reaching out -->
    <path d="M165,145 Q145,140 130,148" fill="none" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- MAIN FOCAL POINT: The Syringe ("打针" - dǎzhēn) -->
  <g id="syringe" filter="url(#glow)" transform="translate(15, -10) rotate(-25 120 120)">
    
    <!-- Action motion lines -->
    <g opacity="0.6">
      <line x1="80" y1="110" x2="100" y2="110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 2"/>
      <line x1="75" y1="118" x2="95" y2="118" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 2"/>
    </g>

    <!-- Syringe Barrel (Outer clear casing) -->
    <rect x="100" y="105" width="60" height="26" rx="4" fill="#e2e8f0" fill-opacity="0.7" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Measurement graduation ticks -->
    <line x1="115" y1="105" x2="115" y2="112" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="125" y1="105" x2="125" y2="115" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="135" y1="105" x2="135" y2="112" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="145" y1="105" x2="145" y2="115" fill="none" stroke="#64748b" stroke-width="1.5"/>

    <!-- Liquid inside (Medicine - vibrant teal/cyan) -->
    <rect x="110" y="109" width="35" height="18" rx="2" fill="#10b981" opacity="0.85"/>
    
    <!-- Tiny air bubble in liquid -->
    <circle cx="120" cy="118" r="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Inner Plunger Rubber Seal -->
    <rect x="108" y="108" width="4" height="20" fill="#334155"/>

    <!-- Plunger Rod & Thumb Rest -->
    <rect x="65" y="113" width="45" height="10" rx="2" fill="#94a3b8"/>
    <!-- Plunger thumb disk -->
    <rect x="60" y="106" width="7" height="24" rx="2.5" fill="#38bdf8" filter="url(#shadow)"/>

    <!-- Finger grips on barrel -->
    <path d="M145,100 v36 c0,2 2,4 4,4 h2 c2,0 4,-2 4,-4 v-36 c0,-2 -2,-4 -4,-4 h-2 c-2,0 -4,2 -4,4 z" fill="#38bdf8" filter="url(#shadow)"/>

    <!-- Needle Hub (Plastic base) -->
    <path d="M160,113 L170,110 L170,126 L160,123 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>

    <!-- Metal Needle (Sharp point aiming at baby's arm) -->
    <path d="M170,117 L210,117.5 L210,118.5 L170,119 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    
    <!-- Gleam on needle tip -->
    <path d="M200,117.5 L210,118" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Medical tray on a stand with alcohol swab & extra tools -->
  <g id="medical-tray" filter="url(#shadow)" transform="translate(15, 20)">
    <!-- Stand pole -->
    <line x1="30" y1="160" x2="30" y2="110" stroke="#64748b" stroke-width="4"/>
    <path d="M20,160 Q30,150 40,160" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Tray plate -->
    <rect x="10" y="105" width="45" height="8" rx="4" fill="#94a3b8"/>
    <rect x="15" y="100" width="35" height="6" rx="2" fill="#cbd5e1"/>

    <!-- Cotton ball / swab on tray -->
    <circle cx="25" cy="103" r="3" fill="#ffffff"/>
    <circle cx="32" cy="103" r="2.5" fill="#f43f5e" opacity="0.8"/>
  </g>

  <!-- Floating Star/Sparkle accents for friendly app vibe -->
  <g fill="#fbbf24">
    <path d="M25,50 Q30,50 30,45 Q30,50 35,50 Q30,50 30,55 Q30,50 25,50 Z" opacity="0.6"/>
    <path d="M210,80 Q215,80 215,75 Q215,80 220,80 Q215,80 215,85 Q215,80 210,80 Z" opacity="0.8"/>
  </g>

  <!-- Soft vignette border framing -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
</svg>