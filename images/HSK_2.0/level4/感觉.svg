<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Warm Glow Gradient for Interior Light -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Outfit Gradients -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Sensory Aura Gradients (Representing 'Gǎnjué' / Feeling & Fatigue) -->
    <linearGradient id="senseWave" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Soft shadow filter for depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Room Elements -->
  <!-- Ambient light pool from desk lamp -->
  <circle cx="120" cy="140" r="100" fill="url(#lampGlow)"/>

  <!-- Wallpaper accent lines (subtle home interior detail) -->
  <line x1="0" y1="40" x2="240" y2="40" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" opacity="0.6"/>

  <!-- Wooden Desk Surface -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="#090d16"/>
  <path d="M 0 180 L 240 180 L 240 186 L 0 186 Z" fill="#334155"/>
  <rect x="0" y="186" width="240" height="54" fill="#1e1b18" opacity="0.3"/>

  <!-- Desk Lamp in Background -->
  <path d="M 190 180 L 195 120 L 205 120 L 210 180 Z" fill="#475569" filter="url(#softShadow)"/>
  <path d="M 180 120 C 180 100, 220 100, 220 120 Z" fill="#fbbf24"/>

  <!-- Houseplant (Adds life and tangible environment) -->
  <path d="M 25 180 L 35 150 L 55 150 L 65 180 Z" fill="#64748b"/>
  <path d="M 45 150 C 45 130, 20 120, 15 100 C 35 110, 45 130, 45 150 Z" fill="#10b981"/>
  <path d="M 45 150 C 55 120, 75 110, 85 95 C 75 120, 55 135, 45 150 Z" fill="#059669"/>
  <path d="M 45 150 C 40 120, 50 100, 45 80 C 42 105, 40 130, 45 150 Z" fill="#34d399"/>

  <!-- Sensory Waves / "Gǎnjué" (Feeling a bit tired/heavy today, internal state visualization) -->
  <path d="M 60 110 Q 90 90 120 110 T 180 110" fill="none" stroke="url(#senseWave)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 70 95 Q 100 75 130 95 T 190 95" fill="none" stroke="url(#senseWave)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- Hot Drink Mug (Context prop for cozy/tired scene) -->
  <g filter="url(#softShadow)">
    <rect x="155" y="150" width="22" height="26" rx="4" fill="url(#mugGrad)"/>
    <path d="M 177 156 C 185 156, 185 168, 177 168" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam / Warmth wisps -->
    <path d="M 161 142 C 163 136, 159 132, 163 126" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 171 144 C 173 138, 169 134, 173 128" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Main Subject: Character experiencing a physical sensation (tired/heavy head, leaning on hand) -->
  <g filter="url(#softShadow)">
    <!-- Character Body / Torso -->
    <path d="M 85 180 C 85 155, 105 145, 120 145 C 135 145, 155 155, 155 180 Z" fill="url(#sweaterGrad)"/>
    <!-- Sweater collar -->
    <path d="M 105 145 C 105 155, 135 155, 135 145 C 125 140, 115 140, 105 145 Z" fill="#0284c7"/>

    <!-- Left Arm resting on desk -->
    <path d="M 90 165 L 115 165 L 115 180 L 90 180 Z" fill="#0284c7"/>

    <!-- Right Arm supporting head (expressing "feeling tired/heavy") -->
    <path d="M 145 160 C 140 145, 135 130, 122 125 L 126 118 C 142 125, 148 145, 155 165 Z" fill="#38bdf8"/>
    
    <!-- Hand supporting chin/cheek -->
    <circle cx="120" cy="122" r="10" fill="#ffedd5"/>

    <!-- Head and Hair -->
    <!-- Hair back/base -->
    <circle cx="115" cy="100" r="24" fill="#334155"/>

    <!-- Face (Facing slightly downward/sideways, eyes closed or drowsy for "cảm giác mệt") -->
    <circle cx="115" cy="104" r="21" fill="#ffedd5"/>

    <!-- Hair bangs/front -->
    <path d="M 95 95 C 100 80, 130 80, 135 95 C 125 90, 105 90, 95 95 Z" fill="#1e293b"/>
    <path d="M 98 94 C 105 105, 115 102, 120 96 Z" fill="#1e293b"/>

    <!-- Closed / Drowsy Eyes (Showing the internal feeling/sensation) -->
    <path d="M 104 105 Q 109 109 114 105" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 120 105 Q 125 109 130 105" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Gentle rosy cheeks (warmth/human touch) -->
    <circle cx="106" cy="112" r="5" fill="#fda4af" opacity="0.6"/>
    <circle cx="128" cy="112" r="5" fill="#fda4af" opacity="0.6"/>

    <!-- Subtle gentle expression (neutral/pensive) -->
    <path d="M 115 116 Q 118 118 121 116" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating Sparkles / Sensory dots to reinforce the concept of perception/feeling -->
  <circle cx="85" cy="80" r="3" fill="#facc15" opacity="0.8"/>
  <circle cx="150" cy="70" r="2" fill="#c084fc" opacity="0.9"/>
  <circle cx="165" cy="100" r="3.5" fill="#38bdf8" opacity="0.7"/>
  <path d="M 75 130 L 79 134 L 75 138 L 71 134 Z" fill="#fb923c" opacity="0.8"/>
</svg>