  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Calendar Page -->
  <rect x="70" y="60" width="100" height="120" rx="4" fill="#f8fafc"/>
  <rect x="70" y="60" width="100" height="20" rx="4" fill="#f43f5e"/>
  <circle cx="85" cy="70" r="3" fill="#ffffff"/>
  <circle cx="110" cy="70" r="3" fill="#ffffff"/>
  <circle cx="135" cy="70" r="3" fill="#ffffff"/>
  <circle cx="160" cy="70" r="3" fill="#ffffff"/>
  
  <!-- Calendar Grid -->
  <rect x="80" y="90" width="80" height="80" fill="#e2e8f0" rx="2"/>
  <rect x="85" y="95" width="15" height="15" fill="#cbd5e1"/>
  <rect x="105" y="95" width="15" height="15" fill="#cbd5e1"/>
  <rect x="125" y="95" width="15" height="15" fill="#cbd5e1"/>
  <rect x="145" y="95" width="15" height="15" fill="#cbd5e1"/>
  <rect x="85" y="115" width="15" height="15" fill="#cbd5e1"/>
  
  <!-- The 'Early' Marker (The focus) -->
