  <line x1="180" y1="140" x2="180" y2="120" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="140" x2="195" y2="140" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Coffee Mug -->
  <path d="M40 150 L70 150 L65 190 L45 190 Z" fill="#fb923c"/>
  <path d="M68 155 Q80 155 80 170 Q80 185 68 185" stroke="#fb923c" stroke-width="6" fill="none"/>
  
  <!-- Steam -->
