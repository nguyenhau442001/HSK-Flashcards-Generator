<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing exchange energy gradient -->
    <linearGradient id="energy-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Window/Cafe background patterns -->
    <clipPath id="window-clip">
      <path d="M 40 30 L 200 30 L 200 110 L 40 110 Z" />
    </clipPath>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Background / Cafe Interior -->
  <g clip-path="url(#window-clip)">
    <!-- Soft warm background window light -->
    <circle cx="120" cy="50" r="80" fill="#fbbf24" opacity="0.05" />
    <circle cx="60" cy="40" r="30" fill="#f59e0b" opacity="0.08" />
    <circle cx="190" cy="60" r="40" fill="#38bdf8" opacity="0.08" />
    
    <!-- Ambient glowing nodes representing connection -->
    <path d="M 70 80 Q 120 40 170 80" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.3" />
  </g>

  <!-- Back wall & Environment shelf -->
  <rect x="0" y="105" width="240" height="5" fill="#334155" opacity="0.5" />
  <rect x="90" y="85" width="60" height="20" rx="2" fill="#475569" opacity="0.3" />
  <!-- Mini plant pot on shelf -->
  <path d="M 115 85 L 125 85 L 123 75 L 117 75 Z" fill="#64748b" />
  <circle cx="120" cy="72" r="8" fill="#10b981" opacity="0.8" />

  <!-- Cafe Table Surface -->
  <path d="M 20 185 L 220 185 L 205 140 L 35 140 Z" fill="url(#table-grad)" />
  <path d="M 20 185 L 220 185 L 220 190 L 20 190 Z" fill="#0f172a" />

  <!-- Coffee Cups & Props on Table -->
  <!-- Left Cup -->
  <ellipse cx="60" cy="155" rx="8" ry="4" fill="#cbd5e1" />
  <path d="M 52 155 L 54 170 C 54 172, 66 172, 66 170 L 68 155 Z" fill="#e2e8f0" />
  <path d="M 51 158 C 47 158, 47 165, 51 166" stroke="#e2e8f0" stroke-width="2" fill="none" />
  <!-- Steam left -->
  <path d="M 58 148 Q 56 143, 60 138" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Right Cup -->
  <ellipse cx="180" cy="155" rx="8" ry="4" fill="#cbd5e1" />
  <path d="M 172 155 L 174 170 C 174 172, 186 172, 186 170 L 188 155 Z" fill="#e2e8f0" />
  <path d="M 189 158 C 193 158, 193 165, 189 166" stroke="#e2e8f0" stroke-width="2" fill="none" />
  <!-- Steam right -->
  <path d="M 182 148 Q 184 143, 180 138" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- CENTRAL DYNAMIC INTERACTION (Giao lưu / Trao đổi) -->
  <!-- Energy bridge between speakers -->
  <path d="M 90 130 Q 120 100 150 130" stroke="url(#energy-beam)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glow)" />
  
  <!-- Floating Exchange Icons (Speech bubbles, symbols of culture/ideas) -->
  <!-- Left to Right Idea (Chat bubble 1) -->
  <g transform="translate(95, 95)">
    <rect x="-14" y="-10" width="28" height="20" rx="6" fill="#38bdf8" />
    <path d="M -6 10 L 0 16 L 2 10 Z" fill="#38bdf8" />
    <!-- Mini icons inside bubble: dots representing conversation -->
    <circle cx="-6" cy="0" r="2.5" fill="#ffffff" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    <circle cx="6" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Right to Left Idea (Chat bubble 2 - offset) -->
  <g transform="translate(145, 110)">
    <rect x="-14" y="-10" width="28" height="20" rx="6" fill="#10b981" />
    <path d="M 6 10 L 0 16 L -2 10 Z" fill="#10b981" />
    <!-- Mini exchange arrows inside -->
    <path d="M -5 -2 L 5 -2 L 3 -5 M 5 -2 L 3 1" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Floating Sparkles / Connection sparks -->
  <circle cx="120" cy="110" r="3" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="110" cy="125" r="2" fill="#ec4899" />
  <circle cx="130" cy="125" r="2" fill="#38bdf8" />


  <!-- PERSON 1: Left Character (Active Speaker/Listener) -->
  <g transform="translate(65, 165)">
    <!-- Body / Torso -->
    <path d="M -25 25 C -25 10, -15 5, 0 5 C 15 5, 25 10, 25 25 L 25 35 L -25 35 Z" fill="#f43f5e" />
    <!-- Collar / Shirt detail -->
    <path d="M -8 5 L 0 15 L 8 5 Z" fill="#ffffff" />
    
    <!-- Neck -->
    <rect x="-6" y="-2" width="12" height="10" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="0" cy="-18" r="16" fill="#fbcfe8" />
    <!-- Hair (Stylish dark teal/slate hair) -->
    <path d="M -16 -18 C -16 -30, 16 -30, 16 -18 C 16 -12, 12 -26, 0 -28 C -12 -26, -16 -12, -16 -18 Z" fill="#0f172a" />
    <path d="M -16 -18 C -18 -10, -12 -5, -8 -8 Z" fill="#0f172a" />

    <!-- Friendly facial expression (Looking right, smiling) -->
    <circle cx="4" cy="-20" r="1.5" fill="#0f172a" />
    <path d="M 6 -15 Q 10 -13 12 -16" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" /> <!-- Smile -->
    <circle cx="11" cy="-17" r="3" fill="#fda4af" opacity="0.6" /> <!-- Blush -->

    <!-- Gesturing Arm (Reaching forward to converse) -->
    <path d="M -20 15 C -15 15, -5 5, 10 10 C 15 12, 18 15, 15 18 C 12 20, 5 15, 0 15" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Hand -->
    <circle cx="13" cy="17" r="4" fill="#fbcfe8" />
  </g>


  <!-- PERSON 2: Right Character (Engaged Partner) -->
  <g transform="translate(175, 165)">
    <!-- Body / Torso -->
    <path d="M -25 25 C -25 10, -15 5, 0 5 C 15 5, 25 10, 25 25 L 25 35 L -25 35 Z" fill="#0ea5e9" />
    <!-- Collar / Shirt detail -->
    <path d="M -8 5 L 0 15 L 8 5 Z" fill="#e0f2fe" />

    <!-- Neck -->
    <rect x="-6" y="-2" width="12" height="10" fill="#fde68a" />

    <!-- Head -->
    <circle cx="0" cy="-18" r="16" fill="#fde68a" />
    <!-- Hair (Warm amber brown bob) -->
    <path d="M -17 -18 C -17 -32, 17 -32, 17 -18 C 17 -8, 14 0, 10 5 C 5 2, 2 -5, 0 -5 C -2 -5, -5 2, -10 5 C -14 0, -17 -8, -17 -18 Z" fill="#b45309" />

    <!-- Friendly facial expression (Looking left, nodding/smiling) -->
    <circle cx="-4" cy="-20" r="1.5" fill="#451a03" />
    <path d="M -12 -16 Q -10 -13, -6 -15" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none" /> <!-- Smile -->
    <circle cx="-11" cy="-17" r="3" fill="#fca5a5" opacity="0.6" /> <!-- Blush -->

    <!-- Gesturing Arm (Welcoming/Responding gesture) -->
    <path d="M 20 15 C 10 15, 0 8, -10 12 C -15 14, -18 18, -15 20 C -12 22, -5 18, -2 15" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Hand -->
    <circle cx="-14" cy="20" r="4" fill="#fde68a" />
  </g>

  <!-- Foreground Atmospheric Elements / Depth -->
  <!-- Ambient glowing floating particles for vibrancy -->
  <circle cx="40" cy="110" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="200" cy="90" r="1.5" fill="#fbbf24" opacity="0.7" />
  <circle cx="105" cy="65" r="2.5" fill="#10b981" opacity="0.5" />
</svg>