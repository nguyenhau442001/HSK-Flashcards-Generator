<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Indoor Glow Gradient -->
    <radialGradient id="windowGlow" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Doorway Warmth Gradient -->
    <linearGradient id="doorLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Clock Face Gradient -->
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Window Glow (Representing "Nighttime / 8 PM" from example) -->
  <circle cx="160" cy="90" r="100" fill="url(#windowGlow)"/>

  <!-- SCENE ENVIRONMENT: Cozy Hallway / Entrance -->
  
  <!-- Wooden Floor (Perspective) -->
  <polygon points="0,180 240,180 240,240 0,240" fill="#0f172a"/>
  <polygon points="0,185 240,185 240,240 0,240" fill="#1e293b" opacity="0.5"/>
  
  <!-- Floor planks lines -->
  <line x1="0" y1="200" x2="240" y2="200" stroke="#0b0f19" stroke-width="1.5"/>
  <line x1="0" y1="220" x2="240" y2="220" stroke="#0b0f19" stroke-width="1.5"/>

  <!-- Interior Wall -->
  <rect x="0" y="0" width="240" height="180" fill="#1e293b"/>
  <rect x="0" y="0" width="240" height="180" fill="url(#windowGlow)" opacity="0.4"/>

  <!-- Wallpaper accent pattern (subtle vertical lines) -->
  <line x1="40" y1="0" x2="40" y2="180" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="0" x2="80" y2="180" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="120" y1="0" x2="120" y2="180" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="160" y1="0" x2="160" y2="180" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="0" x2="200" y2="180" stroke="#334155" stroke-width="1" opacity="0.3"/>

  <!-- Baseboard -->
  <rect x="0" y="175" width="240" height="5" fill="#334155"/>

  <!-- FRONT DOORWAY (Open, showing warm light from inside home representing arrival "Khi tôi về đến nhà") -->
  <!-- Door frame shadow -->
  <rect x="25" y="30" width="95" height="150" fill="#0b0f19"/>
  <!-- Open Door panel hanging outward -->
  <path d="M 25,30 L 15,40 L 15,170 L 25,180 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Open door interior light spread -->
  <path d="M 30,35 L 110,35 L 110,175 L 30,175 Z" fill="url(#doorLight)"/>
  <!-- Door Frame -->
  <path d="M 20,25 L 115,25 L 115,180" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  
  <!-- HOME INTERIOR GLIMPSES (Warm props inside) -->
  <rect x="45" y="110" width="40" height="65" fill="#fb923c" opacity="0.2" rx="4"/>
  <!-- Cozy house plant inside silhouette -->
  <path d="M 65,140 Q 60,130 55,145 Q 65,155 75,145 Q 70,130 65,140 Z" fill="#10b981" opacity="0.7"/>

  <!-- FOREGROUND PROPS (Context for arriving home: Shoes, Keys, Bag) -->
  <!-- Shoe rack / mat -->
  <ellipse cx="160" cy="195" rx="35" ry="12" fill="#334155"/>
  <ellipse cx="160" cy="193" rx="32" ry="10" fill="#475569"/>

  <!-- Shoes neatly placed (Arriving home) -->
  <!-- Shoe 1 -->
  <path d="M 140,192 C 140,185 155,185 158,192 C 158,196 140,196 140,192 Z" fill="#38bdf8"/>
  <path d="M 138,192 L 148,189 L 158,192 Z" fill="#0284c7"/>
  <!-- Shoe 2 -->
  <path d="M 165,195 C 165,188 180,188 183,195 C 183,199 165,199 165,195 Z" fill="#ec4899"/>
  <path d="M 163,195 L 173,192 L 183,195 Z" fill="#db2777"/>

  <!-- Dropped Key & Keychain on floor -->
  <circle cx="125" cy="188" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <path d="M 129,188 L 138,192 M 134,189 L 137,188 M 135,191 L 137,192" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="123" cy="192" r="3" fill="#f43f5e"/> <!-- Cute heart keychain -->

  <!-- WALL CLOCK (Showing "8:00 PM" / 八点 - corresponding to example context) -->
  <g transform="translate(180, 70)">
    <!-- Clock Outer Rim -->
    <circle cx="0" cy="0" r="26" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
    <!-- Clock Face -->
    <circle cx="0" cy="0" r="22" fill="url(#clockGrad)"/>
    
    <!-- Hour Markers -->
    <line x1="0" y1="-18" x2="0" y2="-14" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="0" x2="14" y2="0" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="14" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="-18" y1="0" x2="-14" y2="0" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Clock Hands pointing to 8:00 (Hour hand up-left, Minute hand straight up) -->
    <line x1="0" y1="0" x2="-10" y2="-8" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Center pin -->
    <circle cx="0" cy="0" r="2" fill="#f8fafc"/>
  </g>

  <!-- Hanging Coat Rack on Wall -->
  <path d="M 130,55 L 165,55" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Peg 1 -->
  <path d="M 140,55 L 140,62" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Hanging Scarf -->
  <path d="M 137,62 Q 140,85 145,95 Q 148,80 143,62 Z" fill="#10b981"/>
  <!-- Peg 2 -->
  <path d="M 155,55 L 155,62" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Hanging Jacket -->
  <path d="M 150,62 L 165,65 L 160,95 L 150,95 Z" fill="#f59e0b"/>

  <!-- DYNAMIC ACTION EFFECT: "Arriving" motion / breeze lines -->
  <path d="M 115,70 Q 125,75 110,80" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M 105,100 Q 120,105 105,110" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

  <!-- Warm ambient lighting cast on floor from doorway -->
  <path d="M 30,180 L 140,240 L 70,240 Z" fill="#f59e0b" opacity="0.15"/>

  <!-- Vignette / Frame border -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>