  <circle cx="180" cy="60" r="20" fill="#fbbf24"/>
  <path d="M40 160 Q 120 100 200 160 L 200 160 L 40 160 Z" fill="#10b981" opacity="0.6"/>
  
  <!-- Main Subject: A person sitting at a desk with a warm glowing lamp -->
