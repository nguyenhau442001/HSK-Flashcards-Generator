  <!-- Emotional indicator: Floating warm bubbles -->
  <circle cx="100" cy="120" r="8" fill="#ec4899" opacity="0.8"/>
  <circle cx="115" cy="110" r="6" fill="#fbbf24" opacity="0.8"/>
