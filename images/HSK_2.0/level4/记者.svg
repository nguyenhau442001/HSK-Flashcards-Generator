<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#0f172a"/>
  
  <!-- Atmospheric Studio Background Elements -->
  <!-- Back wall grid / lighting panels -->
  <rect x="20" y="25" width="200" height="110" rx="8" fill="#1e293b" opacity="0.6"/>
  <path d="M 35 45 L 80 45" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M 35 60 L 65 60" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Studio lighting gear (Softbox) -->
  <polygon points="195,35 215,25 215,65 195,55" fill="#334155"/>
  <polygon points="205,30 230,20 230,70 205,60" fill="#fbbf24" opacity="0.8"/>
  <polygon points="205,30 230,20 230,70 205,60" fill="url(#lightGlow)" opacity="0.4"/>
  
  <!-- Ambient Gradients -->
  <defs>
    <linearGradient id="lightGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Broadcast Desk -->
  <path d="M 10 185 L 230 185 L 220 220 L 20 220 Z" fill="url(#deskGrad)"/>
  <!-- Desk LED accent stripe -->
  <path d="M 15 190 L 225 190" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
  <path d="M 15 190 L 225 190" stroke="#bae6fd" stroke-width="1"/>

  <!-- Desktop Equipment & Props -->
  <!-- Laptop/Monitor showing live stream -->
  <rect x="145" y="130" width="60" height="40" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="149" y="134" width="52" height="32" rx="1" fill="url(#screenGlow)"/>
  <!-- Live feed silhouette graph inside screen -->
  <path d="M 153 156 L 163 146 L 173 152 L 185 138 L 197 150" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="153" cy="138" r="3" fill="#ef4444"/> <!-- REC dot -->
  <!-- Laptop Stand -->
  <path d="M 160 170 L 200 170 L 205 185 L 155 185 Z" fill="#475569"/>

  <!-- Coffee Mug with Steam -->
  <rect x="30" y="160" width="16" height="22" rx="3" fill="#cbd5e1"/>
  <path d="M 46 166 C 52 166, 52 176, 46 178" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <!-- Steam lines -->
  <path d="M 35 152 C 37 147, 33 143, 35 138" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 41 154 C 43 149, 39 145, 41 140" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Main Character: The Journalist (Nhà báo / Phóng viên) -->
  <!-- Torso & Blazer -->
  <path d="M 75 160 C 75 140, 85 125, 100 120 L 120 120 C 135 125, 145 140, 145 160 L 155 200 L 65 200 Z" fill="#1e40af"/>
  <!-- White Shirt Collar & Tie -->
  <polygon points="100,120 110,140 100,150 90,140" fill="#f8fafc"/>
  <polygon points="98,142 102,142 104,175 100,185 96,175" fill="#ef4444"/>

  <!-- Neck & Head -->
  <rect x="92" y="102" width="16" height="22" rx="6" fill="#fed7aa"/>
  <!-- Head Base -->
  <circle cx="100" cy="92" r="22" fill="#fed7aa"/>

  <!-- Hair (Professional modern cut) -->
  <path d="M 78 92 C 78 72, 122 72, 122 92 C 122 92, 124 82, 115 76 C 105 70, 90 70, 83 76 C 76 82, 78 92, 78 92 Z" fill="#334155"/>

  <!-- Face Features -->
  <!-- Glasses (Smart journalist look) -->
  <rect x="85" y="82" width="13" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
  <rect x="102" y="82" width="13" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="98" y1="86" x2="102" y2="86" stroke="#0f172a" stroke-width="2"/>
  <!-- Eyes & Confident Smile -->
  <circle cx="91" cy="87" r="1.5" fill="#0f172a"/>
  <circle cx="108" cy="87" r="1.5" fill="#0f172a"/>
  <path d="M 95 98 Q 100 103 105 98" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic Arms and Action: Holding Professional Microphone -->
  <!-- Right Arm (reaching forward to hold mic) -->
  <path d="M 135 130 C 145 140, 135 160, 115 165" fill="none" stroke="#1e40af" stroke-width="12" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="110" cy="166" r="6" fill="#fed7aa"/>

  <!-- Left Arm (gesturing / resting on desk) -->
  <path d="M 75 145 C 65 160, 70 175, 85 185" fill="none" stroke="#1e40af" stroke-width="12" stroke-linecap="round"/>
  <circle cx="88" cy="188" r="6" fill="#fed7aa"/>

  <!-- Professional News Microphone (Prominent Object) -->
  <!-- Mic Handle -->
  <rect x="107" y="145" width="6" height="25" rx="3" fill="#64748b" transform="rotate(-15 110 150)"/>
  <rect x="105" y="143" width="10" height="6" rx="2" fill="#334155" transform="rotate(-15 110 150)"/>
  <!-- Mic Head (Cube style reporter mic with flag) -->
  <rect x="99" y="120" width="22" height="25" rx="4" fill="url(#micGrad)" transform="rotate(-15 110 130)"/>
  <!-- Mic Grid details -->
  <line x1="103" y1="125" x2="117" y2="121" stroke="#ea580c" stroke-width="1.5" transform="rotate(-15 110 130)"/>
  <line x1="104" y1="131" x2="118" y2="127" stroke="#ea580c" stroke-width="1.5" transform="rotate(-15 110 130)"/>
  <line x1="105" y1="137" x2="119" y2="133" stroke="#ea580c" stroke-width="1.5" transform="rotate(-15 110 130)"/>
  
  <!-- Floating News/Media Icons (Atmospheric context) -->
  <!-- Soundwave / Broadcast waves around mic -->
  <path d="M 85 115 C 80 120, 80 135, 85 142" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 77 110 C 70 120, 70 138, 77 148" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Press Badge hanging on lanyard (implied professional identity) -->
  <rect x="93" y="152" width="14" height="10" rx="2" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-5 100 155)"/>
  <line x1="96" y1="155" x2="104" y2="155" stroke="#334155" stroke-width="1.5"/>
  <line x1="96" y1="158" x2="101" y2="158" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Sparkles / Live Atmosphere Highlights -->
  <circle cx="50" cy="80" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="190" cy="100" r="2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="210" cy="115" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="30" cy="120" r="2" fill="#ec4899" opacity="0.7"/>

  <!-- Glowing "ON AIR" style framing or top corner accent -->
  <circle cx="220" cy="20" r="6" fill="#ef4444"/>
  <circle cx="220" cy="20" r="10" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>

</svg>