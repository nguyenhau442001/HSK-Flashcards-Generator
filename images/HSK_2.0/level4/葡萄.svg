<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wooden Table Surface Gradient -->
    <linearGradient id="table-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33241c" />
      <stop offset="100%" stop-color="#1c120c" />
    </linearGradient>

    <!-- Warm Amber Glow Gradient -->
    <radialGradient id="amber-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Purple Grape Gradient 1 (Deep Rich) -->
    <radialGradient id="grape-grad-1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </radialGradient>

    <!-- Purple Grape Gradient 2 (Juicy Bright) -->
    <radialGradient id="grape-grad-2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </radialGradient>

    <!-- Ceramic Bowl Gradient -->
    <linearGradient id="bowl-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    
    <linearGradient id="bowl-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Golden Glow (representing "sweetness" / warmth) -->
  <circle cx="120" cy="110" r="100" fill="url(#amber-glow)" />

  <!-- Background Kitchen / Dining Scene Elements -->
  <!-- Window / Light source frame -->
  <path d="M 60 30 L 180 30 L 170 70 L 70 70 Z" fill="#334155" opacity="0.3" />
  <circle cx="120" cy="45" r="15" fill="#f59e0b" opacity="0.15" />

  <!-- Wooden Table Surface -->
  <path d="M 0 170 C 40 165, 200 165, 240 170 L 240 240 L 0 240 Z" fill="url(#table-grad)" />
  <line x1="0" y1="170" x2="240" y2="170" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2" />

  <!-- Secondary Prop: Cutting Board / Platter (behind bowl) -->
  <ellipse cx="120" cy="170" rx="75" ry="18" fill="#78350f" opacity="0.5" />

  <!-- Ceramic Bowl -->
  <!-- Bowl Back Rim & Interior -->
  <ellipse cx="120" cy="140" rx="65" ry="25" fill="url(#bowl-inner)" />
  <!-- Bowl Outer Body -->
  <path d="M 55 140 C 55 185, 185 185, 185 140 C 185 140, 185 155, 120 165 C 55 155, 55 140, 55 140 Z" fill="url(#bowl-grad)" />
  <!-- Bowl Inner Shadow -->
  <ellipse cx="120" cy="144" rx="58" ry="20" fill="#64748b" opacity="0.4" />

  <!-- SCENE SUBJECT: 葡萄 (Grapes in the bowl and spilling out) -->
  <g id="grape-cluster">
    <!-- Vine stem & Leaves -->
    <path d="M 120 115 Q 110 95, 90 90" fill="none" stroke="#166534" stroke-width="4" stroke-linecap="round" />
    <path d="M 120 115 Q 130 90, 150 95" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round" />
    
    <!-- Leaf 1 -->
    <path d="M 85 90 C 70 80, 60 95, 75 110 C 85 105, 90 95, 85 90 Z" fill="#22c55e" />
    <path d="M 75 97 C 78 100, 80 103, 83 107" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" />

    <!-- Leaf 2 -->
    <path d="M 150 95 C 165 85, 175 100, 160 115 C 150 110, 145 100, 150 95 Z" fill="#4ade80" />
    <path d="M 160 102 C 157 105, 155 108, 152 112" fill="none" stroke="#166534" stroke-width="1.5" stroke-linecap="round" />

    <!-- Grapes Layer 1 (Back / Deep inside bowl) -->
    <circle cx="105" cy="135" r="13" fill="url(#grape-grad-1)" />
    <circle cx="135" cy="135" r="14" fill="url(#grape-grad-1)" />
    <circle cx="120" cy="130" r="13" fill="url(#grape-grad-2)" />

    <!-- Grapes Layer 2 (Middle) -->
    <circle cx="95" cy="145" r="14" fill="url(#grape-grad-2)" />
    <circle cx="120" cy="143" r="14" fill="url(#grape-grad-1)" />
    <circle cx="145" cy="143" r="14" fill="url(#grape-grad-2)" />
    <circle cx="108" cy="150" r="13" fill="url(#grape-grad-1)" />
    <circle cx="132" cy="150" r="13" fill="url(#grape-grad-2)" />

    <!-- Grapes Layer 3 (Foreground stacking / spilling over rim) -->
    <circle cx="90" cy="155" r="14" fill="url(#grape-grad-1)" />
    <circle cx="120" cy="158" r="14" fill="url(#grape-grad-2)" />
    <circle cx="150" cy="155" r="14" fill="url(#grape-grad-1)" />
    
    <!-- Spilling out of the bowl onto the table -->
    <circle cx="100" cy="170" r="13" fill="url(#grape-grad-2)" />
    <circle cx="138" cy="168" r="14" fill="url(#grape-grad-1)" />
    <circle cx="118" cy="174" r="13" fill="url(#grape-grad-1)" />

    <!-- Highlights on Grapes (Glossy finish) -->
    <ellipse cx="101" cy="131" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 101 131)" />
    <ellipse cx="131" cy="131" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 131 131)" />
    <ellipse cx="116" cy="126" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 116 126)" />
    
    <ellipse cx="91" cy="141" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 91 141)" />
    <ellipse cx="116" cy="139" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 116 139)" />
    <ellipse cx="141" cy="139" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 141 139)" />

    <ellipse cx="86" cy="151" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 86 151)" />
    <ellipse cx="116" cy="154" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 116 154)" />
    <ellipse cx="146" cy="151" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 146 151)" />

    <ellipse cx="96" cy="166" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 96 166)" />
    <ellipse cx="114" cy="170" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 114 170)" />
    <ellipse cx="134" cy="164" rx="3" ry="1.5" fill="#ffffff" opacity="0.6" transform="rotate(-30 134 164)" />
  </g>

  <!-- Sweetness sparkles / Energy accents representing juicy flavor -->
  <g fill="#f59e0b">
    <path d="M 65 110 Q 70 110, 70 105 Q 70 110, 75 110 Q 70 110, 70 115 Q 70 110, 65 110 Z" opacity="0.8" />
    <path d="M 175 125 Q 179 125, 179 121 Q 179 125, 183 125 Q 179 125, 179 129 Q 179 125, 175 125 Z" opacity="0.9" />
    <path d="M 155 75 Q 158 75, 158 72 Q 158 75, 161 75 Q 158 75, 158 78 Q 158 75, 155 75 Z" opacity="0.7" />
  </g>
  <g fill="#38bdf8">
    <circle cx="80" cy="130" r="2" opacity="0.6" />
    <circle cx="160" cy="140" r="1.5" opacity="0.8" />
  </g>
</svg>