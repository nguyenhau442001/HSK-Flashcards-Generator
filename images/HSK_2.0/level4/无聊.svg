<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#0f172a" opacity="0.5"/>
  
  <!-- Character: Slumped posture -->
  <g transform="translate(120, 140)">
    <!-- Arms -->
    <path d="M-40 20 Q-60 40 -50 60" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M40 20 Q60 40 50 60" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Body -->
    <ellipse cx="0" cy="30" rx="35" ry="40" fill="#38bdf8"/>
    
    <!-- Head -->
    <circle cx="0" cy="-30" r="35" fill="#fbbf24"/>
    
    <!-- Face: Bored expression -->
    <path d="M-15 -35 A 5 5 0 1 0 -14 -34" fill="#0f172a"/>
    <path d="M15 -35 A 5 5 0 1 0 16 -34" fill="#0f172a"/>
    <path d="M-10 -15 Q 0 -20 10 -15" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Hair -->
    <path d="M-30 -50 Q-10 -70 10 -50 Q30 -70 35 -40" stroke="#ec4899" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Props: Unfinished tasks -->
  <rect x="40" y="180" width="40" height="30" rx="2" fill="#fb923c"/>
  <rect x="45" y="185" width="30" height="2" fill="#0f172a" opacity="0.3"/>
  <rect x="45" y="192" width="30" height="2" fill="#0f172a" opacity="0.3"/>
  
  <circle cx="180" cy="190" r="15" fill="#10b981"/>
  <path d="M175 185 L185 195 M175 195 L185 185" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Ambient dust/mood -->
  <circle cx="50" cy="50" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="200" cy="80" r="3" fill="#fbbf24" opacity="0.3"/>
  <circle cx="150" cy="40" r="2" fill="#fbbf24" opacity="0.5"/>
</svg>