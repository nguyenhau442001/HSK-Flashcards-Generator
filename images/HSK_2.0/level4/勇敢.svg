<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Dark stormy clouds background -->
    <path d="M20 20 Q40 0 70 10 T120 20 T160 10" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    
    <!-- The Child -->
    <g transform="translate(60, 60)">
      <!-- Cape -->
      <path d="M-20 10 L-50 60 L10 50 Z" fill="#ec4899"/>
      <!-- Body -->
      <rect x="-15" y="10" width="30" height="50" rx="5" fill="#38bdf8"/>
      <!-- Head -->
      <circle cx="0" cy="-10" r="20" fill="#fde68a"/>
      <!-- Eyes -->
      <circle cx="-7" cy="-12" r="3" fill="#0f172a"/>
      <circle cx="7" cy="-12" r="3" fill="#0f172a"/>
      <!-- Mouth -->
      <path d="M-5 0 Q0 5 5 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    </g>
    
    <!-- The "Monster" (Shadowy, non-threatening but large) -->
    <path d="M110 100 C130 50 170 50 190 100 L170 140 L130 140 Z" fill="#475569"/>
    <circle cx="140" cy="90" r="5" fill="#fb923c"/>
    <circle cx="160" cy="90" r="5" fill="#fb923c"/>
    
    <!-- Floor/Ground -->
    <rect x="-40" y="140" width="240" height="40" fill="#1e293b"/>
    <path d="M-40 140 L200 140" stroke="#334155" stroke-width="2"/>
  </g>
  
  <!-- Star/Action Spark -->
  <path d="M180 40 L185 55 L200 60 L185 65 L180 80 L175 65 L160 60 L175 55 Z" fill="#fbbf24"/>
</svg>