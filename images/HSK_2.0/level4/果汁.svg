<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wooden Countertop Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="15%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Orange Juice Liquid Gradient -->
    <linearGradient id="juiceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <g opacity="0.15">
    <!-- Stylized kitchen tiles / wall pattern -->
    <line x1="0" y1="40" x2="240" y2="40" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="80" x2="240" y2="80" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="120" x2="240" y2="120" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Warm background glow behind the juice station -->
    <circle cx="120" cy="110" r="70" fill="#f59e0b" filter="url(#softGlow)" opacity="0.3"/>
  </g>

  <!-- Wooden Countertop Surface -->
  <path d="M 0 160 L 240 160 L 240 240 L 0 240 Z" fill="url(#counterGrad)"/>
  <!-- Countertop Edge Highlight -->
  <line x1="0" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2"/>
  <line x1="0" y1="162" x2="240" y2="162" stroke="#0f172a" stroke-width="2"/>

  <!-- Secondary Prop: Cutting Board & Extra Oranges (Left) -->
  <g transform="translate(35, 135)" filter="url(#dropShadow)">
    <!-- Wooden Cutting Board -->
    <ellipse cx="0" cy="15" rx="28" ry="12" fill="#b45309"/>
    <ellipse cx="0" cy="13" rx="26" ry="10" fill="#d97706"/>
    <circle cx="-20" cy="13" r="3" fill="#92400e"/>

    <!-- Whole Orange -->
    <circle cx="15" cy="-2" r="14" fill="#ea580c"/>
    <circle cx="15" cy="-2" r="14" fill="url(#juiceGrad)" opacity="0.4"/>
    <path d="M 15 -16 C 13 -14 17 -12 15 -10" stroke="#166534" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="-4" r="3" fill="#f97316" opacity="0.6"/> <!-- texture -->

    <!-- Orange Half (Cross-section) -->
    <g transform="translate(-12, -8) rotate(-25)">
      <!-- Peel Outer -->
      <ellipse cx="0" cy="0" rx="14" ry="12" fill="#c2410c"/>
      <!-- Peel Inner White -->
      <ellipse cx="0" cy="0" rx="12" ry="10" fill="#fef08a"/>
      <!-- Flesh -->
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#f97316"/>
      <!-- Segments -->
      <path d="M 0 0 L 10 0 M 0 0 L -10 0 M 0 0 L 0 8 M 0 0 L 0 -8 M 0 0 L 7 6 M 0 0 L -7 -6 M 0 0 L 7 -6 M 0 0 L -7 6" stroke="#fef08a" stroke-width="1.2" opacity="0.8"/>
      <ellipse cx="0" cy="0" rx="9" ry="7" fill="url(#juiceGrad)" opacity="0.9"/>
    </g>
  </g>

  <!-- Dynamic Splash / Droplets (Action elements) -->
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="75" cy="85" r="4" filter="url(#dropShadow)"/>
    <circle cx="170" cy="75" r="3" filter="url(#dropShadow)"/>
    <path d="M 70 70 Q 75 62 80 70 Q 75 75 70 70 Z" />
    <path d="M 165 95 Q 170 88 175 95 Q 170 100 165 95 Z" />
    <!-- Tiny floating bits of pulp -->
    <circle cx="85" cy="95" r="2" fill="#f97316"/>
    <circle cx="158" cy="85" r="2" fill="#f97316"/>
    <circle cx="165" cy="115" r="1.5" fill="#f97316"/>
  </g>

  <!-- MAIN SUBJECT: The Glass of Orange Juice (Center) -->
  <g filter="url(#dropShadow)">
    <!-- Glass Shadow on Counter -->
    <ellipse cx="120" cy="163" rx="28" ry="7" fill="#020617" opacity="0.6"/>

    <!-- Ice Cubes inside the glass (Back) -->
    <g opacity="0.9">
      <rect x="105" y="80" width="16" height="16" rx="3" transform="rotate(15 113 88)" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
      <rect x="122" y="95" width="14" height="14" rx="3" transform="rotate(-10 129 102)" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    </g>

    <!-- Liquid Contents (Orange Juice) -->
    <path d="M 94 65 
             L 146 65 
             C 146 65, 142 145, 140 150 
             C 139 153, 137 155, 134 155 
             L 106 155 
             C 103 155, 101 153, 100 150 
             C 98 145, 94 65, 94 65 Z" 
          fill="url(#juiceGrad)"/>

    <!-- Juice Surface Waves / Highlights -->
    <ellipse cx="120" cy="65" rx="26" ry="5" fill="#fde047" opacity="0.6"/>
    
    <!-- Bubbles in Juice -->
    <circle cx="112" cy="110" r="2.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="128" cy="130" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="118" cy="140" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="132" cy="100" r="1.5" fill="#ffffff" opacity="0.6"/>

    <!-- Ice Cubes (Front / Submerged partly) -->
    <rect x="100" y="115" width="15" height="15" rx="3" transform="rotate(25 107 122)" fill="#e0f2fe" opacity="0.8"/>

    <!-- Glass Body (Transparent Vector Container) -->
    <!-- Outer contour: Tapered glass -->
    <path d="M 90 55 
             L 150 55 
             C 150 55, 144 150, 142 156 
             C 140 160, 136 162, 130 162 
             L 110 162 
             C 104 162, 100 160, 98 156 
             C 96 150, 90 55, 90 55 Z" 
          fill="url(#glassSheen)" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-opacity="0.8"/>

    <!-- Glass Rim (Top Ellipse) -->
    <ellipse cx="120" cy="55" rx="30" ry="7" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>
    <ellipse cx="120" cy="55" rx="28" ry="5" fill="none" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Glass Base (Bottom Ellipse) -->
    <ellipse cx="120" cy="162" rx="20" ry="5" fill="#94a3b8" opacity="0.4"/>
    <ellipse cx="120" cy="160" rx="18" ry="4" fill="#ffffff" opacity="0.3"/>

    <!-- Strong Vertical Glass Specular Highlight (Glossy feel) -->
    <path d="M 95 62 C 95 62, 97 120, 99 150" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 143 62 C 143 62, 141 120, 139 150" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>

  <!-- Garnish: Orange Slice & Mint on Glass Rim -->
  <g transform="translate(142, 55)" filter="url(#dropShadow)">
    <!-- Mint Leaves -->
    <path d="M -2 -5 C -8 -15, -15 -12, -18 -8 C -15 -2, -8 0, -2 -5 Z" fill="#10b981"/>
    <path d="M -5 -8 C -10 -10, -12 -6, -14 -4" stroke="#047857" stroke-width="1" fill="none"/>
    
    <path d="M -2 -5 C 2 -12, 10 -10, 12 -5 C 8 -1, 2 0, -2 -5 Z" fill="#34d399"/>

    <!-- Orange Wheel Slices over the rim -->
    <g transform="rotate(25)">
      <!-- Outer Peel -->
      <path d="M -16 0 A 16 16 0 0 1 16 0 Z" fill="#ea580c"/>
      <!-- Inner White -->
      <path d="M -14 0 A 14 14 0 0 1 14 0 Z" fill="#fef08a"/>
      <!-- Flesh -->
      <path d="M -12 0 A 12 12 0 0 1 12 0 Z" fill="#f97316"/>
      <!-- Segment Lines -->
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#fef08a" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-10" y2="-6" stroke="#fef08a" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="10" y2="-6" stroke="#fef08a" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-6" y2="-10" stroke="#fef08a" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="6" y2="-10" stroke="#fef08a" stroke-width="1.5"/>
      <!-- Juice Shimmer -->
      <path d="M -12 0 A 12 12 0 0 1 12 0 Z" fill="url(#juiceGrad)" opacity="0.5"/>
      <!-- Slit for rim -->
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#c2410c" stroke-width="2"/>
    </g>
  </g>

  <!-- Striped Drinking Straw (Playful element) -->
  <g filter="url(#dropShadow)">
    <path d="M 132 45 L 145 -10" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M 132 45 L 145 -10" stroke="#ef4444" stroke-width="6" stroke-dasharray="6,6" stroke-linecap="round"/>
  </g>

  <!-- Ambient Foreground Elements / Light effects -->
  <circle cx="195" cy="50" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="45" cy="50" r="1.5" fill="#f43f5e" opacity="0.6"/>
  <circle cx="25" cy="100" r="2" fill="#fbbf24" opacity="0.5"/>
</svg>