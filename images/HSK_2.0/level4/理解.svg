<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Warm Light Beam Gradient -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Bulb Gradient -->
    <radialGradient id="bulb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Shadow Filter for Depth -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-glow)"/>

  <!-- Background Environment / Study Room -->
  <g opacity="0.4">
    <!-- Bookshelf in background -->
    <rect x="25" y="45" width="40" height="90" rx="4" fill="#334155"/>
    <rect x="30" y="60" width="30" height="8" fill="#475569"/>
    <rect x="30" y="85" width="30" height="8" fill="#1e293b"/>
    <rect x="30" y="110" width="30" height="8" fill="#475569"/>
    
    <!-- Plant silhouette -->
    <path d="M195 110 C195 90 210 80 210 70 C210 80 225 90 225 110 Z" fill="#059669"/>
    <path d="M210 70 L210 120" stroke="#047857" stroke-width="3"/>
    <rect x="198" y="120" width="24" height="20" rx="4" fill="#64748b"/>
  </g>

  <!-- Light Beam from Lamp illuminating the scene -->
  <polygon points="120,40 50,195 190,195" fill="url(#light-beam)"/>

  <!-- Desk Surface -->
  <path d="M 0 185 Q 120 175 240 185 L 240 240 L 0 240 Z" fill="url(#desk-grad)"/>
  <rect x="0" y="183" width="240" height="4" fill="#475569" opacity="0.6"/>

  <!-- Objects on Desk: Open Book (representing study/ideas) -->
  <g transform="translate(70, 185)">
    <!-- Book Shadow -->
    <ellipse cx="50" cy="5" rx="52" ry="8" fill="#020617" opacity="0.5"/>
    <!-- Book Cover -->
    <path d="M 0 0 Q 50 -8 100 0 L 96 15 Q 50 7 4 15 Z" fill="#0284c7"/>
    <!-- Pages -->
    <path d="M 4 2 Q 50 -5 96 2 L 92 12 Q 50 4 8 12 Z" fill="#f8fafc"/>
    <!-- Page Lines (Abstract reading) -->
    <line x1="15" y1="5" x2="40" y2="3" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="8" x2="35" y2="6" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="60" y1="3" x2="85" y2="5" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="65" y1="6" x2="85" y2="8" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Desk Lamp -->
  <g transform="translate(180, 140)">
    <ellipse cx="0" cy="45" rx="18" ry="6" fill="#475569"/>
    <path d="M -5 45 L -2 15 L 2 15 L 5 45 Z" fill="#64748b"/>
    <path d="M -2 15 C -2 5 -12 -5 -20 -10" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M -22 -12 L -8 -30 L 12 -20 L 2 -2 Z" fill="#0284c7"/>
  </g>

  <!-- MAIN CHARACTER / FOCUS: Curious Student / Thinker -->
  <g filter="url(#soft-shadow)">
    <!-- Body & Hoodie -->
    <path d="M 85 200 C 85 165 95 150 120 150 C 145 150 155 165 155 200 Z" fill="#38bdf8"/>
    <!-- Hoodie Pocket / Details -->
    <path d="M 105 180 L 135 180 L 130 195 L 110 195 Z" fill="#0ea5e9" opacity="0.6"/>
    <path d="M 120 150 L 110 170 L 130 170 Z" fill="#bae6fd"/> <!-- Collar/Strings -->

    <!-- Neck -->
    <rect x="110" y="130" width="20" height="25" rx="8" fill="#fcd34d"/>

    <!-- Head -->
    <circle cx="120" cy="115" r="28" fill="#fcd34d"/>

    <!-- Hair (Stylized neat cut) -->
    <path d="M 92 110 C 90 90 105 85 120 85 C 135 85 150 90 148 115 C 145 100 135 93 120 93 C 105 93 95 100 92 110 Z" fill="#1e293b"/>
    <path d="M 115 88 C 122 85 130 87 135 90 C 130 88 122 88 115 88 Z" fill="#334155"/>

    <!-- Facial Expression: Focused, "Aha!" moment -->
    <!-- Eyes (happy, looking up towards the lightbulb) -->
    <circle cx="110" cy="113" r="3.5" fill="#0f172a"/>
    <circle cx="130" cy="113" r="3.5" fill="#0f172a"/>
    <!-- Eyebrows raised in realization -->
    <path d="M 106 106 Q 110 103 114 107" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 126 107 Q 130 103 134 106" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Cheeks (Excited blush) -->
    <circle cx="104" cy="120" r="4" fill="#fb7185" opacity="0.6"/>
    <circle cx="136" cy="120" r="4" fill="#fb7185" opacity="0.6"/>
    <!-- Smile (Understanding/Clarity) -->
    <path d="M 113 123 Q 120 130 127 123" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Hands gesturing "Got it!" near chin/face -->
    <circle cx="100" cy="140" r="8" fill="#fcd34d"/>
    <circle cx="140" cy="140" r="8" fill="#fcd34d"/>
  </g>

  <!-- AHA MOMENT: Floating Glowing Lightbulb & Sparkles (Symbolizing 'Understanding/Lí Giải') -->
  <g transform="translate(120, 50)">
    <!-- Outer Glow Rings -->
    <circle cx="0" cy="0" r="28" fill="#fbbf24" opacity="0.2">
      <animate attributeName="r" values="24;32;24" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Lightbulb Shape -->
    <path d="M -10 -2 C -10 -12 -3 -18 0 -18 C 3 -18 10 -12 10 -2 C 10 5 6 9 4 12 L -4 12 C -6 9 -10 5 -10 -2 Z" fill="url(#bulb-glow)" filter="url(#soft-shadow)"/>
    <!-- Bulb Base -->
    <rect x="-4" y="12" width="8" height="4" rx="1" fill="#94a3b8"/>
    <rect x="-3" y="16" width="6" height="3" rx="1" fill="#64748b"/>
    <!-- Filament inside -->
    <path d="M -2 4 L 0 -2 L 2 4" stroke="#fef08a" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Sparkling Ideas / Accents around the bulb -->
    <g fill="#fbbf24">
      <!-- Top Sparkle -->
      <path d="M 0 -28 L 2 -22 L 8 -20 L 2 -18 L 0 -12 L -2 -18 L -8 -20 L -2 -22 Z"/>
      <!-- Right Sparkle -->
      <path d="M 22 -6 L 23.5 -2 L 28 -0.5 L 23.5 1 L 22 5 L 20.5 1 L 16 -0.5 L 20.5 -2 Z" transform="scale(0.8) translate(15, -10)"/>
      <!-- Left Sparkle -->
      <path d="M -22 -6 L -20.5 -2 L -16 -0.5 L -20.5 1 L -22 5 L -23.5 1 L -28 -0.5 L -23.5 -2 Z" transform="scale(0.8) translate(-15, -10)"/>
    </g>

    <!-- Floating Connection Dots / Magic Bubbles -->
    <circle cx="-32" cy="15" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="35" cy="8" r="4" fill="#34d399" opacity="0.8"/>
    <circle cx="-25" cy="-15" r="2" fill="#f43f5e" opacity="0.8"/>
    <circle cx="28" cy="-22" r="3.5" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Dynamic floating abstract concepts (Clarity / Insight waves) -->
  <path d="M 35 110 Q 45 100 55 110" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 185 95 Q 195 85 205 95" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 42 80 Q 48 72 54 80" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>