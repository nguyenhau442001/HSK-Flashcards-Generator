<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="lightBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric background elements (classroom/study vibe) -->
  <g opacity="0.3">
    <!-- Window frame on back wall -->
    <rect x="30" y="30" width="70" height="90" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <line x1="65" y1="30" x2="65" y2="120" stroke="#475569" stroke-width="2"/>
    <line x1="30" y1="75" x2="100" y2="75" stroke="#475569" stroke-width="2"/>
    
    <!-- Shelf with books -->
    <rect x="140" y="45" width="70" height="6" rx="2" fill="#475569"/>
    <path d="M150 45 L150 25 L160 25 L160 45 Z" fill="#ec4899"/>
    <path d="M162 45 L162 20 L174 20 L174 45 Z" fill="#38bdf8"/>
    <path d="M176 45 L176 28 L185 28 L185 45 Z" fill="#10b981"/>
  </g>

  <!-- Light beam shining down -->
  <polygon points="120,0 200,240 40,240" fill="url(#lightBeam)"/>

  <!-- Classroom Desk Surface -->
  <path d="M 0,180 L 240,180 L 240,240 L 0,240 Z" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <rect x="0" y="176" width="240" height="6" rx="3" fill="#64748b"/>

  <!-- Desk Props: Notebook and Pencil -->
  <g transform="translate(140, 190)">
    <!-- Open Notebook -->
    <path d="M -25,15 Q 0,5 25,15 L 20,40 Q 0,30 -20,40 Z" fill="#f8fafc" filter="url(#shadow)"/>
    <path d="M 0,8 L 0,33" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="-18" y1="16" x2="-5" y2="19" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-17" y1="23" x2="-6" y2="26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="19" x2="17" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="26" x2="17" y2="23" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Pencil -->
    <path d="M 35,25 L 55,5 L 58,8 L 38,28 Z" fill="#fbbf24"/>
    <path d="M 55,5 L 59,2 L 57,7 Z" fill="#f43f5e"/>
    <path d="M 35,25 L 38,28 L 36,31 Z" fill="#334155"/>
  </g>

  <!-- Secondary Desk Prop: Small plant -->
  <g transform="translate(45, 185)">
    <path d="M 0,15 L 10,30 L -10,30 Z" fill="#e2e8f0"/>
    <ellipse cx="0" cy="15" rx="10" ry="3" fill="#cbd5e1"/>
    <!-- Leaves -->
    <path d="M 0,15 Q -10,0 -20,5 Q -10,12 0,15 Z" fill="#10b981"/>
    <path d="M 0,15 Q 5,-10 15,-5 Q 10,10 0,15 Z" fill="#34d399"/>
    <path d="M 0,15 Q 0,-5 0,-15 Q -5,0 0,15 Z" fill="#059669"/>
  </g>

  <!-- MAIN CHARACTER / ACTION: Raising Hand ("举") -->
  <!-- Character Body / Torso -->
  <g transform="translate(100, 110)">
    <!-- Shadow under character -->
    <ellipse cx="20" cy="80" rx="35" ry="10" fill="#0f172a" opacity="0.6"/>

    <!-- Shoulders and Back -->
    <path d="M -15,85 C -15,50 15,40 45,45 L 60,85 Z" fill="#0284c7" filter="url(#shadow)"/>
    <path d="M 5,42 Q 20,30 35,38 Q 45,43 55,48 Z" fill="#0ea5e9"/> <!-- Collar / Neck area -->

    <!-- Head -->
    <g transform="translate(20, 15)">
      <!-- Hair back -->
      <circle cx="0" cy="-2" r="19" fill="#1e293b"/>
      <!-- Face -->
      <circle cx="2" cy="0" r="17" fill="#fbcfe8"/>
      <!-- Hair top/bangs -->
      <path d="M -15,-10 Q -5,-20 10,-15 Q 18,-10 16,0 Q 5,-5 -8,-10 Z" fill="#1e293b"/>
      <!-- Cheeks (excited blush) -->
      <circle cx="-5" cy="5" r="4" fill="#f43f5e" opacity="0.4"/>
      <circle cx="10" cy="5" r="4" fill="#f43f5e" opacity="0.4"/>
      <!-- Eye (happy/closed upward curve) -->
      <path d="M 2,1 Q 6,-3 10,1" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Smile -->
      <path d="M 3,7 Q 7,11 11,7" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Lower Arm / Resting Arm -->
    <path d="M -10,65 Q -25,75 -20,85 Q -15,90 -5,80 Z" fill="#handGrad"/>

    <!-- ACTIVE ACTION: RAISED ARM ("举") -->
    <!-- Dynamic raised arm stretching up into the light -->
    <g filter="url(#shadow)">
      <!-- Sleeve up -->
      <path d="M 35,40 L 55,10 L 35,0 L 20,25 Z" fill="url(#sleeveGrad)"/>
      <!-- Arm extending up -->
      <path d="M 45,15 L 65,-45 L 85,-35 L 55,0 Z" fill="url(#armGrad)"/>
      <!-- Hand firmly raised / palm open facing forward -->
      <g transform="translate(68, -48) rotate(25)">
        <rect x="-8" y="-14" width="16" height="18" rx="4" fill="#fb923c"/>
        <!-- Fingers pointing up -->
        <rect x="-7" y="-24" width="3.2" height="12" rx="1.5" fill="#fb923c"/>
        <rect x="-2.5" y="-27" width="3.2" height="15" rx="1.5" fill="#fb923c"/>
        <rect x="2" y="-26" width="3.2" height="14" rx="1.5" fill="#fb923c"/>
        <rect x="6.5" y="-22" width="3.2" height="11" rx="1.5" fill="#fb923c"/>
        <!-- Thumb -->
        <path d="M -7,-5 C -12,-5 -14,-10 -10,-12 C -8,-13 -6,-8 -6,-5 Z" fill="#f97316"/>
      </g>
    </g>
  </g>

  <!-- Energetic Action Sparks & Glowing Highlights near raised hand -->
  <g transform="translate(170, 50)" filter="url(#glow)">
    <!-- Glowing Star 1 -->
    <path d="M 0,-10 C 2,-3 3,-2 10,0 C 3,2 2,3 0,10 C -2,3 -3,2 -10,0 C -3,-2 -2,-3 0,-10 Z" fill="#fbbf24"/>
  </g>
  <g transform="translate(150, 35)">
    <!-- Small floating accent dot -->
    <circle cx="0" cy="0" r="3" fill="#38bdf8" filter="url(#glow)"/>
  </g>
  <g transform="translate(185, 75)">
    <!-- Small floating accent dot -->
    <circle cx="0" cy="0" r="2" fill="#ec4899" filter="url(#glow)"/>
  </g>

  <!-- Action lines emphasizing upward motion -->
  <path d="M 155,75 Q 160,60 155,45" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 172,85 Q 180,70 175,55" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Vignette / Frame border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>