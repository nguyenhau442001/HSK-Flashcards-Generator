<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Bus Window Gradient -->
    <linearGradient id="windowGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Bus Body Gradient -->
    <linearGradient id="busBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Street Light Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Motion lines filter / style -->
    <style>
      .motion-line { stroke: #38bdf8; stroke-width: 2.5; stroke-linecap: round; opacity: 0.7; }
      .speed-line { stroke: #fde047; stroke-width: 2; stroke-linecap: round; opacity: 0.8; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient background elements: City Skyline Silhouette -->
  <path d="M0 160 L20 150 L35 160 L60 140 L80 145 L100 130 L120 160 L150 135 L170 150 L190 125 L210 140 L240 120 L240 240 L0 240 Z" fill="#090d16" opacity="0.6" />

  <!-- Street Details: Sidewalk and Street -->
  <path d="M0 170 L240 170" stroke="#475569" stroke-width="4" />
  <path d="M0 175 L240 175" stroke="#1e293b" stroke-width="6" />
  <!-- Road Surface -->
  <path d="M0 175 L240 175 L240 230 C240 235 235 240 230 240 L10 240 C5 240 0 235 0 230 Z" fill="#0f172a" />
  
  <!-- Bus Stop Pole & Light -->
  <rect x="25" y="90" width="4" height="85" fill="#94a3b8" />
  <circle cx="27" cy="85" r="8" fill="#f59e0b" />
  <circle cx="27" cy="85" r="15" fill="url(#lampGlow)" />
  <rect x="18" y="105" width="18" height="12" rx="2" fill="#334155" />

  <!-- THE BUS (Departing/Just in time) -->
  <g transform="translate(110, 105)">
    <!-- Bus Shadow -->
    <ellipse cx="55" cy="68" rx="50" ry="6" fill="#000000" opacity="0.4" />
    
    <!-- Bus Wheels -->
    <circle cx="25" cy="60" r="11" fill="#0f172a" />
    <circle cx="25" cy="60" r="5" fill="#cbd5e1" />
    <circle cx="85" cy="60" r="11" fill="#0f172a" />
    <circle cx="85" cy="60" r="5" fill="#cbd5e1" />

    <!-- Bus Main Body -->
    <path d="M 5 20 C 5 10, 15 5, 25 5 L 95 5 C 105 5, 110 12, 110 20 L 110 50 C 110 55, 105 60, 100 60 L 15 60 C 10 60, 5 55, 5 50 Z" fill="url(#busBody)" />
    
    <!-- Bus Roof Accent -->
    <path d="M 22 5 L 98 5 C 102 5, 105 8, 105 12 L 105 16 L 15 16 L 15 12 C 15 8, 18 5, 22 5 Z" fill="#f97316" />

    <!-- Windshield -->
    <path d="M 90 12 L 103 12 C 106 12, 108 14, 108 18 L 108 42 L 90 42 Z" fill="url(#windowGlass)" />
    <!-- Side Windows -->
    <rect x="68" y="12" width="18" height="30" rx="3" fill="url(#windowGlass)" />
    <rect x="46" y="12" width="18" height="30" rx="3" fill="url(#windowGlass)" />
    <rect x="24" y="12" width="18" height="30" rx="3" fill="url(#windowGlass)" />

    <!-- Headlight & Glow -->
    <path d="M 108 45 L 112 47 L 108 49 Z" fill="#fef08a" />
    <ellipse cx="114" cy="48" rx="8" ry="4" fill="#fef08a" opacity="0.5" />

    <!-- Exhaust/Speed lines behind bus -->
    <line x1="-5" y1="35" x2="-20" y2="35" class="speed-line" />
    <line x1="-2" y1="45" x2="-15" y2="45" class="speed-line" />
  </g>

  <!-- THE RUNNING CHARACTER (Catching up / 赶) -->
  <g transform="translate(45, 115)">
    <!-- Character Shadow -->
    <ellipse cx="25" cy="59" rx="14" ry="4" fill="#000000" opacity="0.4" />

    <!-- Action Motion Lines behind runner -->
    <line x1="-5" y1="15" x2="10" y2="15" class="motion-line" />
    <line x1="-10" y1="30" x2="5" y2="30" class="motion-line" />
    <line x1="-2" y1="45" x2="12" y2="45" class="motion-line" />

    <!-- Back Leg (Stretching back) -->
    <path d="M 22 38 L 8 52 L 2 50" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Back Shoe -->
    <ellipse cx="0" cy="50" rx="4" ry="2" fill="#ef4444" />

    <!-- Backpack / Bag flying back -->
    <path d="M 14 14 C 8 14, 6 22, 10 28 L 15 26 Z" fill="#6366f1" />

    <!-- Torso (Leaning forward dynamically) -->
    <path d="M 15 12 C 18 12, 28 22, 22 38 C 20 42, 15 40, 15 36 Z" fill="#38bdf8" />

    <!-- Front Leg (Lunging forward) -->
    <path d="M 22 38 L 35 48 L 44 45" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Front Shoe -->
    <ellipse cx="46" cy="44" rx="5" ry="2.5" fill="#ef4444" />

    <!-- Back Arm (Pumping backward) -->
    <path d="M 18 16 L 4 28" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Head & Hair (Wind blown back) -->
    <circle cx="24" cy="8" r="9" fill="#fbcfe8" />
    <!-- Hair blowing back -->
    <path d="M 18 2 C 22 0, 30 2, 32 6 C 30 5, 26 5, 24 6 Z" fill="#1e293b" />
    <!-- Determined Face Expression (Eyebrow slant) -->
    <line x1="26" y1="7" x2="30" y2="8" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Front Arm (Reaching out desperately/urgently toward the bus) -->
    <path d="M 20 18 L 38 22" stroke="#fbcfe8" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Hand open reaching -->
    <circle cx="40" cy="22" r="2.5" fill="#fbcfe8" />
  </g>

  <!-- Atmospheric Foreground Elements (Dust / Speed particles) -->
  <circle cx="95" cy="165" r="2" fill="#94a3b8" opacity="0.6" />
  <circle cx="105" cy="170" r="1.5" fill="#94a3b8" opacity="0.4" />
  <circle cx="80" cy="160" r="1" fill="#94a3b8" opacity="0.5" />
  
  <circle cx="30" cy="140" r="1.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="40" cy="130" r="1" fill="#38bdf8" opacity="0.5" />

</svg>