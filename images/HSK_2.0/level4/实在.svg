<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Surface Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Object Gradient (Magical/Weird Relic) -->
    <linearGradient id="relicGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Mystery Particle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Lens Flare / Sparkle -->
    <g id="sparkle">
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#fbbf24"/>
    </g>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Background Details (Room, Shelf) -->
  <g opacity="0.4">
    <!-- Bookshelf / Back Wall Lines -->
    <rect x="30" y="40" width="180" height="8" rx="4" fill="#334155" />
    <rect x="45" y="25" width="20" height="15" rx="2" fill="#475569" />
    <rect x="70" y="20" width="16" height="20" rx="2" fill="#0ea5e9" />
    <rect x="175" y="22" width="22" height="18" rx="2" fill="#f43f5e" />
    
    <!-- Floating mystical rings in background -->
    <circle cx="120" cy="110" r="75" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>
    <circle cx="120" cy="110" r="90" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="2 12" opacity="0.2"/>
  </g>

  <!-- Ambient Glow behind main subject -->
  <circle cx="120" cy="115" r="45" fill="#8b5cf6" opacity="0.3" filter="url(#glow)" />
  <circle cx="120" cy="115" r="30" fill="#f43f5e" opacity="0.3" filter="url(#glow)" />

  <!-- Table Surface -->
  <path d="M 20,170 L 220,170 L 205,215 L 35,215 Z" fill="url(#tableGrad)" />
  <ellipse cx="120" cy="170" rx="100" ry="8" fill="#475569" opacity="0.6" />

  <!-- MAIN SUBJECT: The Weird Floating Object (Representing "truly bizarre / extremely strange") -->
  <g id="weird-object" transform="translate(0, -5)">
    <!-- Base stand / pedestal -->
    <path d="M 90,170 L 150,170 L 140,155 L 100,155 Z" fill="#64748b" />
    <ellipse cx="120" cy="155" rx="20" ry="5" fill="#94a3b8" />
    <line x1="120" y1="155" x2="120" y2="135" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

    <!-- Anti-gravity floating device / Pyrite Crystal / Strange Artifact -->
    <!-- Floating shadow beneath object -->
    <ellipse cx="120" cy="148" rx="12" ry="3" fill="#0f172a" opacity="0.7" />

    <!-- Main Crystal Body (Faceted, weird geometry) -->
    <g transform="translate(120, 105)">
      <!-- Outer glowing aura -->
      <polygon points="0,-35 28,-10 18,25 -18,25 -28,-10" fill="url(#relicGlow)" opacity="0.8" filter="url(#glow)" />
      
      <!-- Crystal Facets -->
      <polygon points="0,-35 15,-18 0,-5" fill="#f43f5e" />
      <polygon points="0,-35 -15,-18 0,-5" fill="#fb7185" />
      <polygon points="15,-18 28,-10 8,15 0,-5" fill="#a855f7" />
      <polygon points="-15,-18 -28,-10 -8,15 0,-5" fill="#6366f1" />
      <polygon points="0,-5 8,15 0,28 -8,15" fill="#38bdf8" />
      <polygon points="28,-10 18,25 8,15" fill="#c084fc" />
      <polygon points="-28,-10 -18,25 -8,15" fill="#818cf8" />
      
      <!-- Highlight edges -->
      <polyline points="0,-35 0,-5 0,28" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.8" />
      <polyline points="-28,-10 0,-5 28,-10" fill="none" stroke="#fff" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Floating Energy Orbs & Rings around the object -->
    <circle cx="85" cy="95" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="155" cy="120" r="4" fill="#fbbf24" filter="url(#glow)" />
    <circle cx="135" cy="75" r="5" fill="#ec4899" filter="url(#glow)" />
  </g>

  <!-- REACTING CHARACTER (A cute, wide-eyed explorer/observer showing utter astonishment) -->
  <g id="character" transform="translate(0, 5)">
    <!-- Body / Shoulders -->
    <path d="M 35,210 Q 35,175 60,175 L 85,175 Q 110,175 110,210 Z" fill="#0ea5e9" />
    <!-- Collar -->
    <path d="M 60,175 L 72,190 L 85,175 Z" fill="#e2e8f0" />

    <!-- Head & Face -->
    <circle cx="72" cy="140" r="26" fill="#fbcfe8" />
    
    <!-- Hair -->
    <path d="M 46,140 Q 46,110 72,112 Q 98,110 98,140 Q 90,125 72,125 Q 54,125 46,140 Z" fill="#334155" />
    <path d="M 46,135 Q 55,120 70,128 Z" fill="#334155" />

    <!-- Astonished Expression (Eyes wide, mouth wide open in disbelief/amazement) -->
    <!-- Eyebrows raised high -->
    <path d="M 56,128 Q 62,123 68,127" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <path d="M 76,127 Q 82,123 88,128" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Wide Open Eyes -->
    <circle cx="62" cy="138" r="6" fill="#ffffff" />
    <circle cx="63" cy="138" r="3" fill="#0f172a" />
    <circle cx="64" cy="136" r="1" fill="#ffffff" />

    <circle cx="82" cy="138" r="6" fill="#ffffff" />
    <circle cx="81" cy="138" r="3" fill="#0f172a" />
    <circle cx="82" cy="136" r="1" fill="#ffffff" />

    <!-- Surprised O-Mouth -->
    <ellipse cx="72" cy="154" rx="5" ry="7" fill="#0f172a" />
    <path d="M 68,152 Q 72,150 76,152" fill="none" stroke="#f43f5e" stroke-width="1.5" />

    <!-- Blushing Cheeks -->
    <ellipse cx="56" cy="147" rx="4" ry="2" fill="#f43f5e" opacity="0.4" />
    <ellipse cx="88" cy="147" rx="4" ry="2" fill="#f43f5e" opacity="0.4" />

    <!-- Pointing / Reacting Arm & Hand -->
    <path d="M 95,185 Q 110,180 118,165" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" />
    <!-- Hand pointing towards the weird object -->
    <circle cx="120" cy="162" r="5" fill="#fbcfe8" />
  </g>

  <!-- Foreground Props on Table -->
  <g id="table-props">
    <!-- Open notebook/logbook (recording data about the strange event) -->
    <path d="M 160,185 L 205,175 L 215,200 L 170,210 Z" fill="#f8fafc" />
    <path d="M 187,180 L 187,205" stroke="#cbd5e1" stroke-width="1" />
    <!-- Scribble lines in book -->
    <line x1="168" y1="190" x2="180" y2="187" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="166" y1="197" x2="178" y2="194" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="193" y1="185" x2="205" y2="182" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="192" y1="192" x2="203" y2="189" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Coffee Mug -->
    <rect x="25" y="180" width="16" height="20" rx="3" fill="#cbd5e1" />
    <path d="M 41,185 C 46,185 46,195 41,195" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <!-- Steam rising from mug -->
    <path d="M 29,173 Q 31,168 29,163" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 35,175 Q 37,170 35,165" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Sparkles & Action Highlights (Emphasizing "truly / really extraordinary") -->
  <use href="#sparkle" x="145" y="80" transform="scale(1.2)" />
  <use href="#sparkle" x="90" y="115" transform="scale(0.8)" />
  <use href="#sparkle" x="125" y="135" transform="scale(1)" />

  <!-- Dynamic floating magical light dots -->
  <circle cx="100" cy="85" r="2" fill="#38bdf8" />
  <circle cx="140" cy="95" r="2.5" fill="#f43f5e" />
  <circle cx="115" cy="65" r="1.5" fill="#fbbf24" />
</svg>