<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Open Book -->
  <path d="M40 120 L200 120 L220 200 L20 200 Z" fill="#f8fafc"/>
  <path d="M120 120 L120 200" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- The Highlighted Point (The Focus) -->
  <circle cx="160" cy="150" r="12" fill="#f59e0b"/>
  <circle cx="160" cy="150" r="6" fill="#fff"/>
  
  <!-- Magnifying Glass -->
  <path d="M160 150 L190 120" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="190" cy="120" r="15" fill="none" stroke="#fbbf24" stroke-width="6"/>
  <circle cx="190" cy="120" r="8" fill="#fef3c7" fill-opacity="0.3"/>
  
  <!-- Decorative elements -->
  <rect x="50" y="140" width="40" height="6" rx="2" fill="#e2e8f0"/>
  <rect x="50" y="160" width="30" height="6" rx="2" fill="#e2e8f0"/>
  <rect x="50" y="180" width="45" height="6" rx="2" fill="#e2e8f0"/>
  
  <!-- Ambient light/glow -->
  <circle cx="160" cy="150" r="30" fill="#f59e0b" fill-opacity="0.15"/>
  
  <!-- Pen -->
  <path d="M30 100 L40 130" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <path d="M25 95 L35 105" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round"/>
</svg>