<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Kitchen Light Glow -->
    <radialGradient id="kitchenLight" cx="180" cy="40" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Bin Body Gradient -->
    <linearGradient id="binGrad" x1="80" y1="90" x2="160" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Bin Lid Gradient -->
    <linearGradient id="lidGrad" x1="75" y1="70" x2="165" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Floor Shadow -->
    <ellipse cx="120" cy="216" rx="45" ry="8" fill="#090d16" opacity="0.6"/>

    <!-- Apple Red Gradient -->
    <linearGradient id="appleGrad" x1="0" y1="0" x2="10" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>

    <!-- Banana Yellow Gradient -->
    <linearGradient id="bananaGrad" x1="0" y1="0" x2="15" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#kitchenLight)"/>

  <!-- Kitchen Environment & Tangible Context -->
  <!-- Back Wall Tile Lines & Cabinet Base -->
  <path d="M0 130 H240" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
  <path d="M0 70 H240" stroke="#334155" stroke-width="1.5" opacity="0.3"/>
  <rect x="0" y="130" width="240" height="90" fill="#1e293b" opacity="0.5"/>
  
  <!-- Kitchen Counter Edge on the Left -->
  <path d="M0 150 H70 V210 H0 Z" fill="#334155" opacity="0.3"/>
  <path d="M0 150 H70" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Kitchen Utensils/Props hanging or resting in context -->
  <!-- Countertop bottle -->
  <rect x="25" y="125" width="14" height="25" rx="3" fill="#10b981" opacity="0.8"/>
  <path d="M30 125 V121 H34 V125" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Floor Shadow for Thùng Rác -->
  <use href="#floorShadow"/>

  <!-- MAIN SUBJECT: Thùng rác (Trash Bin / Garbage Can) -->
  <g id="lajitong">
    <!-- Pedal Base -->
    <path d="M105 210 L110 205 H130 L135 210 Z" fill="#64748b"/>
    <rect x="110" y="202" width="20" height="4" rx="2" fill="#94a3b8"/>

    <!-- Bin Body -->
    <path d="M82 95 L90 205 H150 L158 95 Z" fill="url(#binGrad)" stroke="#0284c7" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Bin Body Inner/Depth lines for 3D form -->
    <path d="M96 100 L102 200" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Recycling/Eco Symbol embossed on front -->
    <g transform="translate(120, 150) scale(0.65)" opacity="0.35">
      <path d="M 0 -14 L 8 0 L -8 0 Z" fill="#e0f2fe"/>
      <path d="M 10 3 L 16 14 L 2 10 Z" fill="#e0f2fe"/>
      <path d="M -10 3 L -2 10 L -16 14 Z" fill="#e0f2fe"/>
      <circle cx="0" cy="3" r="10" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-dasharray="12 8"/>
    </g>

    <!-- Swing/Step Lid (Partially Open for action/realism) -->
    <!-- Lid Hinge / Top Rim -->
    <rect x="76" y="87" width="88" height="10" rx="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Angled Lid Cover -->
    <g transform="rotate(-25 120 87)">
      <rect x="75" y="74" width="90" height="14" rx="7" fill="url(#lidGrad)" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Lid Handle/Indent -->
      <rect x="105" y="78" width="30" height="3" rx="1.5" fill="#94a3b8"/>
    </g>
  </g>

  <!-- Action Props: Falling/Discarded Trash enhancing the 'Thùng rác' context -->
  <!-- Crumpled Paper Ball -->
  <g transform="translate(135, 65) rotate(15)">
    <circle cx="0" cy="0" r="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M-6 -4 L4 -6 M-3 5 L6 2 M-5 2 L2 7" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Action motion lines for paper falling -->
  <path d="M148 45 C143 52 140 58 138 62" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" fill="none"/>
  <path d="M158 52 C153 58 150 63 148 67" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round" fill="none"/>

  <!-- Banana Peel resting near the base -->
  <g transform="translate(75, 195) rotate(10)">
    <path d="M0 0 C-10 5 -15 15 -8 18 C-3 20 5 15 10 10 Z" fill="url(#bananaGrad)" stroke="#ca8a04" stroke-width="1"/>
    <path d="M0 0 C-5 -5 -12 -2 -15 5 C-17 10 -10 14 -8 18" fill="url(#bananaGrad)" stroke="#ca8a04" stroke-width="1"/>
    <path d="M0 0 C5 -2 12 3 15 10 C18 16 12 20 8 18" fill="url(#bananaGrad)" stroke="#ca8a04" stroke-width="1"/>
  </g>

  <!-- Half-eaten Apple next to bin -->
  <g transform="translate(155, 190)">
    <path d="M0 6 C-8 6 -10 -2 -5 -8 C-2 -12 2 -12 5 -8 C10 -2 8 6 0 6 Z" fill="url(#appleGrad)" stroke="#9f1239" stroke-width="1"/>
    <path d="M0 -8 V-13" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <path d="M-1 -12 C-4 -14 -6 -11 -4 -9" fill="#10b981"/>
  </g>

  <!-- Ambient Lighting / Highlights to make it pop -->
  <!-- Rim light on bin left edge -->
  <path d="M82 95 L90 205" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Sparkles / Atmosphere -->
  <circle cx="190" cy="110" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="50" cy="100" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="65" cy="50" r="2" fill="#38bdf8" opacity="0.4"/>
</svg>