<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Foundation/Beacon -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="pillarBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="pillarTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Gem/Crystal Gradient -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Shadow Gradient -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="120" cy="110" r="90" fill="url(#amberGlow)" />

  <!-- Atmospheric Particles / Blueprint Sparks -->
  <g fill="#38bdf8" opacity="0.4">
    <circle cx="50" cy="70" r="1.5" />
    <circle cx="190" cy="60" r="2" />
    <circle cx="40" cy="150" r="1" />
    <circle cx="200" cy="140" r="1.5" />
    <circle cx="90" cy="40" r="1" />
    <circle cx="150" cy="30" r="2" />
  </g>
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="120" cy="55" r="1.5" />
    <circle cx="75" cy="95" r="2" />
    <circle cx="165" cy="105" r="1.5" />
  </g>

  <!-- Floor Shadow -->
  <ellipse cx="120" cy="200" rx="75" ry="18" fill="url(#floorShadow)" />

  <!-- Blueprint / Architectural Grid lines in background -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.4">
    <line x1="30" y1="180" x2="210" y2="180" />
    <line x1="30" y1="150" x2="210" y2="150" />
    <line x1="30" y1="120" x2="210" y2="120" />
    <line x1="75" y1="50" x2="75" y2="200" />
    <line x1="165" y1="50" x2="165" y2="200" />
  </g>

  <!-- ==================== FOUNDATION STRUCTURE (Cơ sở / Nền tảng) ==================== -->
  
  <!-- Tier 1: The Deep Foundation Slab (Bottom) -->
  <g transform="translate(0, 15)">
    <!-- Front Face -->
    <path d="M 50 170 L 190 170 L 190 185 L 50 185 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <!-- Top Face -->
    <path d="M 50 170 L 190 170 L 210 160 L 30 160 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <!-- Side Accent Detail -->
    <line x1="70" y1="177" x2="90" y2="177" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="150" y1="177" x2="170" y2="177" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Tier 2: Main Strong Foundation Platform (Middle) -->
  <g transform="translate(0, 5)">
    <!-- Front Face -->
    <path d="M 40 145 L 200 145 L 200 165 L 40 165 Z" fill="#334155" />
    <!-- Left/Right Bevels for 3D look -->
    <path d="M 40 145 L 40 165 L 25 155 L 25 135 Z" fill="#1e293b" />
    <path d="M 200 145 L 200 165 L 215 155 L 215 135 Z" fill="#475569" />
    <!-- Top Face -->
    <path d="M 40 145 L 200 145 L 215 135 L 25 135 Z" fill="#475569" />
    
    <!-- Structural Groove Lines -->
    <line x1="70" y1="145" x2="70" y2="165" stroke="#1e293b" stroke-width="2" />
    <line x1="120" y1="145" x2="120" y2="165" stroke="#1e293b" stroke-width="2" />
    <line x1="170" y1="145" x2="170" y2="165" stroke="#1e293b" stroke-width="2" />
    
    <!-- Glowing Circuit Accents on Foundation -->
    <path d="M 50 155 L 90 155 L 100 160" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="100" cy="160" r="2" fill="#10b981" />
    <path d="M 190 155 L 140 155 L 130 160" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="130" cy="160" r="2" fill="#10b981" />
  </g>

  <!-- Tier 3: Upper Pedestal & Supporting Pillars -->
  <g transform="translate(0, 0)">
    <!-- Pillars -->
    <!-- Left Pillar -->
    <path d="M 55 105 L 75 105 L 75 135 L 55 135 Z" fill="url(#pillarBase)" />
    <path d="M 55 105 L 75 105 L 70 100 L 50 100 Z" fill="url(#pillarTop)" />
    
    <!-- Center-Left Pillar -->
    <path d="M 85 105 L 105 105 L 105 135 L 85 135 Z" fill="url(#pillarBase)" />
    <path d="M 85 105 L 105 105 L 100 100 L 80 100 Z" fill="url(#pillarTop)" />

    <!-- Center-Right Pillar -->
    <path d="M 135 105 L 155 105 L 155 135 L 135 135 Z" fill="url(#pillarBase)" />
    <path d="M 135 105 L 155 105 L 150 100 L 130 100 Z" fill="url(#pillarTop)" />

    <!-- Right Pillar -->
    <path d="M 165 105 L 185 105 L 185 135 L 165 135 Z" fill="url(#pillarBase)" />
    <path d="M 165 105 L 185 105 L 180 100 L 160 100 Z" fill="url(#pillarTop)" />

    <!-- Top Platform of Foundation -->
    <path d="M 45 100 L 195 100 L 205 90 L 35 90 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1" />
    <path d="M 35 90 L 205 90 L 205 94 L 35 94 Z" fill="#475569" />
  </g>

  <!-- ==================== SUPERSTRUCTURE / RISING TOWER (The Results of a Good Foundation) ==================== -->
  
  <!-- Glowing Core / The "Nền Tảng" Anchor Crystal -->
  <g transform="translate(120, 75)">
    <!-- Floating Crystal / Gem representing the stable core -->
    <path d="M 0 -22 L 16 -5 L 0 16 L -16 -5 Z" fill="url(#crystalGrad)" stroke="#e0f2fe" stroke-width="1.5" />
    <!-- Crystal Facet Highlight -->
    <path d="M 0 -22 L 16 -5 L 0 16 Z" fill="#ffffff" opacity="0.25" />
    <!-- Inner Core Glow -->
    <circle cx="0" cy="-2" r="6" fill="#fbbf24" />
    <circle cx="0" cy="-2" r="3" fill="#ffffff" />
  </g>

  <!-- Rising Architectural Elements / Pillars reaching up -->
  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="90" x2="60" y2="50" />
    <line x1="180" y1="90" x2="180" y2="50" />
  </g>

  <!-- Floating Construction / Growth Rings (Symbolizing building upward from the base) -->
  <g fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <!-- Center Arch rising -->
    <path d="M 90 90 C 90 60, 150 60, 150 90" />
    <!-- Upper Crown / Pinnacle Structure -->
    <polygon points="120,25 135,45 105,45" fill="#fbbf24" stroke="none" />
    <circle cx="120" cy="20" r="4" fill="#f59e0b" />
  </g>

  <!-- Dynamic Energy Waves radiating from the solid base -->
  <g fill="none" stroke="#10b981" stroke-width="2" opacity="0.7">
    <path d="M 75 120 Q 120 105 165 120" stroke-dasharray="4 4" />
    <path d="M 55 130 Q 120 110 185 130" stroke-dasharray="6 4" />
  </g>

  <!-- Foreground Context Props: Architectural Tools / Blueprint / Compass -->
  <g transform="translate(0, 5)">
    <!-- Drafting Compass resting on base -->
    <g transform="translate(165, 175) rotate(-15)">
      <line x1="0" y1="0" x2="-8" y2="25" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="0" x2="8" y2="25" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="#f59e0b" />
    </g>

    <!-- Small Rolled Blueprint / Tablet on lower left -->
    <g transform="translate(45, 180) rotate(10)">
      <rect x="0" y="-4" width="28" height="8" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
      <rect x="3" y="-2" width="22" height="4" rx="1" fill="#e0f2fe" opacity="0.7" />
    </g>

    <!-- Glowing Checkmark / Success Badge neatly integrated into the foundation -->
    <g transform="translate(120, 155)">
      <circle cx="0" cy="0" r="10" fill="#10b981" stroke="#065f46" stroke-width="1.5" />
      <path d="M -4 -1 L -1 3 L 5 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Interactive Sparkles / Polish -->
  <g fill="#ffffff">
    <path d="M 120 40 L 122 46 L 128 48 L 122 50 L 120 56 L 118 50 L 112 48 L 118 46 Z" opacity="0.9" />
    <path d="M 70 75 L 71 78 L 74 79 L 71 80 L 70 83 L 69 80 L 66 79 L 69 78 Z" opacity="0.6" />
    <path d="M 170 75 L 171 78 L 174 79 L 171 80 L 170 83 L 169 80 L 166 79 L 169 78 Z" opacity="0.6" />
  </g>
</svg>