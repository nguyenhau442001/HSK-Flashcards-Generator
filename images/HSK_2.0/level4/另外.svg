<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Light / Atmosphere -->
  <circle cx="120" cy="110" r="80" fill="url(#accentGlow)" filter="url(#glow)"/>

  <!-- Scene Elements: Workspace / Detective / Organizer Desk representing "In addition / Furthermore / Besides" -->
  <!-- Back Wall details -->
  <path d="M 40 40 L 200 40" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
  
  <!-- Corkboard / Secondary Information Hub (Representing "另外" - the extra items) -->
  <g transform="translate(145, 45)">
    <!-- Board Base -->
    <rect width="65" height="75" rx="4" fill="#475569" opacity="0.6"/>
    <rect x="4" y="4" width="57" height="67" rx="2" fill="#334155"/>
    <!-- Extra pinned notes / photos -->
    <rect x="10" y="10" width="22" height="18" rx="1" fill="#fb923c" transform="rotate(-5 10 10)"/>
    <circle cx="21" cy="9" r="2" fill="#ef4444"/>
    
    <rect x="35" y="15" width="20" height="25" rx="1" fill="#f43f5e" transform="rotate(8 35 15)"/>
    <circle cx="45" cy="14" r="2" fill="#fbbf24"/>

    <rect x="12" y="38" width="40" height="22" rx="1" fill="#38bdf8" transform="rotate(-3 12 38)"/>
    <circle cx="32" cy="37" r="2" fill="#10b981"/>
    <!-- Connecting string (Adding more items theme) -->
    <path d="M 21 28 Q 30 35 32 37" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M 45 40 Q 30 45 12 48" stroke="#ec4899" stroke-width="1.5" fill="none" opacity="0.8"/>
  </g>

  <!-- Main Computer / Main Task Screen -->
  <g transform="translate(30, 60)">
    <!-- Monitor Stand -->
    <path d="M 40 85 L 60 85 L 65 95 L 35 95 Z" fill="#64748b"/>
    <rect x="30" y="95" width="40" height="6" rx="3" fill="#94a3b8"/>
    <!-- Monitor Body -->
    <rect x="0" y="0" width="100" height="85" rx="6" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <!-- Screen Content -->
    <rect x="8" y="8" width="84" height="69" rx="4" fill="url(#screenGrad)"/>
    <!-- UI Elements inside main screen -->
    <rect x="16" y="16" width="35" height="8" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="16" y="30" width="68" height="6" rx="2" fill="#e0f2fe" opacity="0.7"/>
    <rect x="16" y="42" width="50" height="6" rx="2" fill="#e0f2fe" opacity="0.7"/>
    <!-- Glowing checkmark/badge for primary item -->
    <circle cx="70" cy="58" r="10" fill="#10b981"/>
    <path d="M 65 58 L 68 61 L 76 53" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- "另外" (The Extra / In Addition Element): Popping out dynamically into the foreground -->
  <g transform="translate(100, 115)" filter="url(#glow)">
    <!-- Floating Extra Document / Folder -->
    <g transform="translate(0, 0) rotate(12)">
      <!-- Folder back -->
      <rect width="65" height="50" rx="4" fill="#fbbf24"/>
      <!-- Folder tab -->
      <path d="M 6 0 L 26 0 L 32 8 L 6 8 Z" fill="#f59e0b"/>
      <!-- Paper inside -->
      <rect x="8" y="12" width="49" height="34" rx="2" fill="#f8fafc"/>
      <!-- Abstract lines representing extra content -->
      <rect x="14" y="18" width="25" height="4" rx="1" fill="#cbd5e1"/>
      <rect x="14" y="26" width="37" height="3" rx="1" fill="#cbd5e1"/>
      <rect x="14" y="33" width="30" height="3" rx="1" fill="#cbd5e1"/>
      <!-- Star / Highlight accent showing "plus one" -->
      <circle cx="50" cy="35" r="8" fill="#ec4899"/>
      <path d="M 50 30 L 51.5 33.5 L 55 35 L 51.5 36.5 L 50 40 L 48.5 36.5 L 45 35 L 48.5 33.5 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Secondary Floating Plus/Addition Elements (Reinforcing "Ngoài ra") -->
  <g transform="translate(35, 45)">
    <circle cx="0" cy="0" r="12" fill="#38bdf8" opacity="0.2"/>
    <path d="M -4 0 L 4 0 M 0 -4 L 0 4" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(185, 150)">
    <circle cx="0" cy="0" r="16" fill="#10b981" opacity="0.2"/>
    <path d="M -5 0 L 5 0 M 0 -5 L 0 5" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Desk Surface Base -->
  <rect x="0" y="195" width="240" height="45" fill="url(#deskGrad)"/>
  <!-- Desk Edge Highlight -->
  <path d="M 0 195 L 240 195" stroke="#475569" stroke-width="2"/>

  <!-- Foreground Props on Desk -->
  <!-- Coffee Cup (Adding coziness to the real-world environment) -->
  <g transform="translate(25, 175)">
    <path d="M 4 8 L 20 8 L 18 28 L 6 28 Z" fill="#f43f5e"/>
    <ellipse cx="12" cy="8" rx="8" ry="3" fill="#fda4af"/>
    <!-- Handle -->
    <path d="M 18 12 C 24 12 24 22 18 24" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Steam / Action lines -->
    <path d="M 9 2 Q 12 -2 9 -6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 15 3 Q 12 -1 15 -5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Small potted plant or accessory -->
  <g transform="translate(200, 165)">
    <path d="M 5 20 L 15 20 L 18 30 L 2 30 Z" fill="#64748b"/>
    <ellipse cx="10" cy="20" rx="5" ry="2" fill="#94a3b8"/>
    <!-- Leaves -->
    <path d="M 10 20 Q 5 10 0 12 C -2 15 2 18 10 20 Z" fill="#10b981"/>
    <path d="M 10 20 Q 15 5 22 8 C 24 12 18 16 10 20 Z" fill="#34d399"/>
    <path d="M 10 20 Q 10 2 10 0 C 12 4 11 12 10 20 Z" fill="#059669"/>
  </g>

  <!-- Interactive glowing selection / focus frame around the extra item (Visualizing "addition") -->
  <rect x="88" y="105" width="75" height="65" rx="8" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
</svg>