<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Bulb Effect -->
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Clipboard Metal Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Background Elements -->
  <g opacity="0.3">
    <!-- Subtle tech grid/dots -->
    <circle cx="30" cy="40" r="2" fill="#38bdf8" />
    <circle cx="210" cy="50" r="2" fill="#38bdf8" />
    <circle cx="40" cy="200" r="1.5" fill="#f59e0b" />
    <circle cx="200" cy="190" r="2" fill="#10b981" />
  </g>

  <!-- Ambient Light from the "Answer" -->
  <circle cx="120" cy="95" r="75" fill="url(#bulbGlow)" />

  <!-- SCENE: Exam Clipboard / Quiz Paper Background -->
  <g filter="url(#shadow)">
    <!-- Clipboard Base (Dark Slate Wood/Plastic) -->
    <rect x="55" y="55" width="130" height="150" rx="12" fill="#334155" />
    <!-- Paper Sheet -->
    <rect x="63" y="63" width="114" height="136" rx="6" fill="#f8fafc" />
  </g>

  <!-- Quiz Content Lines & Abstract Checkmarks on Paper -->
  <g opacity="0.4">
    <!-- Question 1 -->
    <rect x="75" y="78" width="40" height="6" rx="3" fill="#cbd5e1" />
    <circle cx="160" cy="81" r="5" fill="#ef4444" /> <!-- Wrong mark -->
    
    <!-- Question 2 -->
    <rect x="75" y="98" width="55" height="6" rx="3" fill="#cbd5e1" />
    <circle cx="160" cy="101" r="5" fill="#ef4444" /> <!-- Wrong mark -->
  </g>

  <!-- THE 'ANSWER' HIGHLIGHT ZONE (Glowing Correct Section) -->
  <g>
    <!-- Highlight Box for the Answer -->
    <rect x="68" y="120" width="104" height="65" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    
    <!-- Abstract Answer Lines -->
    <rect x="78" y="132" width="60" height="6" rx="3" fill="#059669" opacity="0.8" />
    <rect x="78" y="148" width="40" height="6" rx="3" fill="#059669" opacity="0.5" />

    <!-- Big Vibrant Checkmark representing the correct answer -->
    <path d="M 135 152 L 145 162 L 165 138" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  </g>

  <!-- Clipboard Metallic Clip at Top -->
  <g filter="url(#shadow)">
    <rect x="95" y="47" width="50" height="18" rx="4" fill="url(#metalGrad)" />
    <rect x="105" y="45" width="30" height="6" rx="2" fill="#475569" />
    <!-- Small clip knob -->
    <circle cx="120" cy="56" r="3" fill="#1e293b" />
  </g>

  <!-- MAIN ACTION PROP: The Magic Lightbulb of "Eureka / Answer Found" hovering above -->
  <g filter="url(#shadow)">
    <!-- Lightbulb Rays/Sparkles -->
    <path d="M 120 12 L 120 2" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M 95 22 L 88 15" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <path d="M 145 22 L 152 15" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

    <!-- Bulb Glass -->
    <path d="M 105 32 C 105 20, 135 20, 135 32 C 135 39, 127 45, 125 50 L 115 50 C 113 45, 105 39, 105 32 Z" fill="#fbbf24" />
    <!-- Bulb Highlight -->
    <path d="M 111 28 C 111 25, 117 25, 118 28" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bulb Screw Base -->
    <rect x="113" y="50" width="14" height="5" rx="1" fill="#64748b" />
    <rect x="114" y="55" width="12" height="4" rx="1" fill="#475569" />
    <path d="M 117 59 L 123 59 L 122 63 L 118 63 Z" fill="#334155" />
  </g>

  <!-- Foreground/Contextual Decor: Pencil sketching the answer -->
  <g transform="translate(170, 140) rotate(25)" filter="url(#shadow)">
    <!-- Pencil Body -->
    <polygon points="0,0 12,-3 12,3" fill="#f59e0b" />
    <polygon points="12,-3 45,-12 45,12 12,3" fill="#38bdf8" />
    <!-- Pencil Tip & Eraser -->
    <polygon points="-8,0 0,-3 0,3" fill="#fed7aa" />
    <polygon points="-2,-1 0,0 -2,1" fill="#334155" />
    <rect x="45" y="-12" width="6" height="24" rx="2" fill="#ec4899" />
    <rect x="44" y="-12" width="2" height="24" fill="#cbd5e1" />
  </g>

  <!-- Floating Sparkles / Joyful Accents -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 35 100 Q 35 110 25 110 Q 35 110 35 120 Q 35 110 45 110 Q 35 110 35 100" />
    <!-- Star 2 -->
    <path d="M 195 90 Q 195 96 189 96 Q 195 96 195 102 Q 195 96 201 96 Q 195 96 195 90" fill="#38bdf8" />
  </g>
</svg>