<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient representing a cold outdoor night/evening -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Soft glow for frosty air -->
    <radialGradient id="frostGlow" x1="50%" y1="30%" x2="50%" y2="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Hat gradient (Warm amber/orange to represent winter warmth) -->
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Scarf gradient -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#frostGlow)"/>

  <!-- Atmospheric frost particles / snow flakes -->
  <circle cx="45" cy="50" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="195" cy="40" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="210" cy="95" r="2.5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="30" cy="130" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="185" cy="170" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="60" cy="190" r="1" fill="#38bdf8" opacity="0.8"/>

  <!-- Wooden Coat Hook / Wall Mount in the background -->
  <path d="M110,68 L130,68 L135,78 L105,78 Z" fill="#334155" />
  <circle cx="120" cy="73" r="4" fill="#475569" />

  <!-- The Winter Hat (Mao / 戴 mũ) hanging and being highlighted -->
  <!-- Pom-pom -->
  <circle cx="120" cy="82" r="14" fill="#ffffff"/>
  <circle cx="116" cy="78" r="4" fill="#e2e8f0"/>

  <!-- Hat Body -->
  <path d="M 96 95 
           Q 120 78 144 95
           Q 150 115 142 135
           Q 120 142 98 135
           Q 90 115 96 95 Z" fill="url(#hatGrad)"/>

  <!-- Hat Texture Lines (Knitted ribbing effect) -->
  <path d="M 100 102 Q 120 90 140 102" stroke="#d97706" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 98 114 Q 120 102 142 114" stroke="#d97706" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 97 126 Q 120 114 143 126" stroke="#d97706" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Hat Rolled Brim / Cuff -->
  <path d="M 96 132 
           Q 120 140 144 132
           L 146 150
           Q 120 158 94 150 Z" fill="#d97706"/>
  <!-- Cuff texture -->
  <path d="M 103 141 L 105 149" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <path d="M 115 142 L 118 151" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <path d="M 127 142 L 130 151" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <path d="M 139 140 L 142 149" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

  <!-- Cozied up Scarf underneath the hat area -->
  <path d="M 85 170 
           Q 120 155 155 170
           Q 170 190 155 205
           Q 120 215 85 205
           Q 70 190 85 170 Z" fill="url(#scarfGrad)"/>
           
  <!-- Scarf fringe details -->
  <path d="M 145 202 L 150 218" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
  <path d="M 152 200 L 159 216" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
  <path d="M 159 197 L 168 212" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>

  <!-- Action / Motion curves indicating "wearing" or "getting ready" (戴) -->
  <path d="M 72 105 Q 85 90 94 98" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" stroke-dasharray="4 4"/>
  <path d="M 168 105 Q 155 90 146 98" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" stroke-dasharray="4 4"/>

  <!-- Warm glowing light highlights (emphasizing coziness against the cold) -->
  <circle cx="130" cy="100" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="108" cy="120" r="2" fill="#ffffff" opacity="0.3"/>

</svg>