<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bed Frame -->
  <rect x="40" y="140" width="160" height="40" rx="8" fill="#334155"/>
  <rect x="50" y="130" width="140" height="15" rx="4" fill="#475569"/>
  
  <!-- Mattress -->
  <rect x="45" y="100" width="150" height="30" rx="10" fill="#cbd5e1"/>
  
  <!-- Pillow -->
  <rect x="55" y="85" width="40" height="25" rx="6" fill="#f1f5f9"/>
  
  <!-- Character Lying Down -->
  <g transform="translate(0, 0)">
    <!-- Body -->
    <rect x="60" y="105" width="100" height="15" rx="5" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="75" cy="95" r="12" fill="#fbbf24"/>
    <!-- Legs -->
    <rect x="160" y="105" width="20" height="10" rx="3" fill="#38bdf8"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="40" r="3" fill="#fb923c"/>
  <circle cx="30" cy="60" r="2" fill="#10b981"/>
  <path d="M180 180 L190 170 L200 180" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Floor Shadow -->
  <ellipse cx="120" cy="190" rx="80" ry="10" fill="#0f172a" opacity="0.5"/>
</svg>