<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="boxInside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements -->
  <g opacity="0.3">
    <!-- Subtle architectural lines / window light -->
    <path d="M40 0 L40 240" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M200 0 L200 240" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="120" cy="80" r="60" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>
  </g>

  <!-- Environment: Desk / Surface -->
  <path d="M0 185 L240 185 L240 240 L0 240 Z" fill="url(#deskGrad)"/>
  <path d="M0 185 L240 185" stroke="#475569" stroke-width="2"/>

  <!-- Completed Projects / Stacked Elements in the Background -->
  <g transform="translate(35, 135)">
    <!-- Folder 1 -->
    <rect x="0" y="20" width="35" height="30" rx="4" fill="#3b82f6" transform="rotate(-10 0 20)"/>
    <rect x="5" y="10" width="20" height="10" rx="2" fill="#60a5fa" transform="rotate(-10 0 20)"/>
    <!-- Folder 2 -->
    <rect x="15" y="15" width="35" height="30" rx="4" fill="#10b981" transform="rotate(5 15 15)"/>
    <rect x="20" y="7" width="20" height="10" rx="2" fill="#34d399" transform="rotate(5 15 15)"/>
  </g>

  <!-- Main Subject: The Open Chest / Hub of "All" Items (Toàn bộ đã hoàn thành) -->
  <g transform="translate(65, 95)">
    <!-- Floating Sparkles / Completion Particles -->
    <g filter="url(#glow)">
      <!-- Star 1 -->
      <path d="M-15 -30 L-12 -20 L-2 -17 L-12 -14 L-15 -4 L-18 -14 L-28 -17 L-18 -20 Z" fill="url(#starGlow)" transform="scale(0.8)"/>
      <!-- Star 2 -->
      <path d="M75 -20 L77 -13 L84 -10 L77 -7 L75 0 L73 -7 L66 -10 L73 -13 Z" fill="#38bdf8" transform="scale(0.9)"/>
      <!-- Star 3 -->
      <path d="M30 -50 L32 -43 L39 -40 L32 -37 L30 -30 L28 -37 L21 -40 L28 -43 Z" fill="#10b981"/>
    </g>

    <!-- Open Box Back / Inside -->
    <rect x="15" y="15" width="80" height="50" fill="url(#boxInside)" rx="4"/>
    
    <!-- Items Overflowing/Filling "All" (Files, Tools, Icons representing completeness) -->
    <!-- Checklist Document -->
    <g transform="translate(32, -5) rotate(-6)">
      <rect x="0" y="0" width="36" height="45" rx="3" fill="#f8fafc"/>
      <line x1="8" y1="10" x2="28" y2="10" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="20" x2="24" y2="20" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="30" x2="20" y2="30" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <!-- Green Checkmarks -->
      <path d="M29 8 L32 11 L38 5" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25 18 L28 21 L34 15" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 28 L24 31 L30 25" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Tablet displaying success graph -->
    <g transform="translate(48, 5) rotate(12)">
      <rect x="0" y="0" width="38" height="48" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <rect x="4" y="6" width="30" height="28" fill="#1e293b" rx="2"/>
      <polyline points="8,26 15,18 22,22 30,12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="12" r="3" fill="#ec4899"/>
    </g>

    <!-- Golden Trophy/Star Object representing ultimate completion -->
    <g transform="translate(38, -25)">
      <circle cx="12" cy="12" r="16" fill="#f59e0b" opacity="0.2" filter="url(#glow)"/>
      <path d="M12 2 L14.5 8.5 L21.5 9 L16 13.5 L18 20.5 L12 17 L6 20.5 L8 13.5 L2.5 9 L9.5 8.5 Z" fill="url(#starGlow)"/>
    </g>

    <!-- Box Front Flaps (Isometric Open Chest) -->
    <!-- Left Flap -->
    <path d="M0 15 L15 25 L15 75 L0 65 Z" fill="#ea580c"/>
    <!-- Right Flap -->
    <path d="M110 15 L95 25 L95 75 L110 65 Z" fill="#c2410c"/>
    <!-- Front Panel -->
    <path d="M15 65 L95 65 L95 90 L15 90 Z" fill="url(#boxGrad)"/>
    <!-- Front Panel Band/Ribbon for "All/Complete" Theme -->
    <path d="M50 65 L60 65 L60 90 L50 90 Z" fill="#facc15"/>
    
    <!-- Lid Open Back -->
    <path d="M15 15 L95 15 L110 -5 L0 -5 Z" fill="#f97316" opacity="0.9"/>
    <path d="M50 -5 L55 15" stroke="#facc15" stroke-width="6"/>
  </g>

  <!-- Foreground Dynamic Elements / Tools of Completion -->
  <!-- Coffee Mug representing finished hard work -->
  <g transform="translate(170, 150)">
    <!-- Steam -->
    <path d="M8 -8 C8 -14 14 -14 14 -20 C14 -26 8 -26 8 -32" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Mug Body -->
    <rect x="0" y="0" width="24" height="28" rx="4" fill="#ec4899"/>
    <path d="M24 6 C28 6 30 9 30 14 C30 19 28 22 24 22" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <rect x="3" y="4" width="18" height="4" fill="#fbcfe8" rx="1"/>
  </g>

  <!-- Pen / Stylus -->
  <g transform="translate(145, 175) rotate(-35)">
    <rect x="0" y="0" width="28" height="6" rx="3" fill="#38bdf8"/>
    <polygon points="28,0 34,3 28,6" fill="#0f172a"/>
  </g>

</svg>