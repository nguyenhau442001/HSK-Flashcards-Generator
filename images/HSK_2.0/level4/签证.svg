<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Slate/Navy Gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="passport-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    
    <linearGradient id="visa-page-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    
    <linearGradient id="stamp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    
    <linearGradient id="boarding-pass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient background glow elements representing travel/airport atmosphere -->
  <circle cx="190" cy="50" r="70" fill="#38bdf8" opacity="0.05" />
  <circle cx="50" cy="190" r="90" fill="#f59e0b" opacity="0.06" />

  <!-- Wooden/Modern Desk Surface -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#090d16" opacity="0.8" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- SCENE GROUP: Passport, Visa, Stamp, Boarding Pass -->
  <g transform="translate(15, 25)">
    
    <!-- Travel Boarding Pass / Itinerary (Background Layer) -->
    <g transform="translate(70, 15) rotate(12)" filter="url(#soft-shadow)">
      <rect width="110" height="135" rx="6" fill="url(#boarding-pass-grad)" />
      <!-- Barcode / Deco -->
      <rect x="15" y="85" width="80" height="25" fill="#e2e8f0" rx="2" />
      <line x1="20" y1="92" x2="25" y2="102" stroke="#475569" stroke-width="2" />
      <line x1="28" y1="92" x2="33" y2="102" stroke="#475569" stroke-width="4" />
      <line x1="38" y1="92" x2="40" y2="102" stroke="#475569" stroke-width="2" />
      <line x1="45" y1="92" x2="52" y2="102" stroke="#475569" stroke-width="3" />
      <line x1="56" y1="92" x2="60" y2="102" stroke="#475569" stroke-width="2" />
      <line x1="65" y1="92" x2="73" y2="102" stroke="#475569" stroke-width="5" />
      <line x1="78" y1="92" x2="80" y2="102" stroke="#475569" stroke-width="2" />
      <line x1="85" y1="92" x2="90" y2="102" stroke="#475569" stroke-width="3" />
      
      <!-- Flight strip accent -->
      <rect x="0" y="0" width="110" height="25" fill="#38bdf8" rx="6" />
      <circle cx="15" cy="12.5" r="4" fill="#ffffff" />
      <circle cx="95" cy="12.5" r="4" fill="#ffffff" />
      <line x1="30" y1="12.5" x2="80" y2="12.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3" />
      
      <!-- Fake Text Lines -->
      <rect x="15" y="40" width="40" height="6" rx="3" fill="#cbd5e1" />
      <rect x="15" y="52" width="65" height="4" rx="2" fill="#e2e8f0" />
      <rect x="15" y="62" width="50" height="4" rx="2" fill="#e2e8f0" />
    </g>

    <!-- Open Passport Book (Main Focus) -->
    <g transform="translate(15, 30)" filter="url(#shadow)">
      
      <!-- Passport Cover Base (Visible slightly underneath) -->
      <rect x="-10" y="-5" width="155" height="135" rx="8" fill="#1e3a8a" />
      
      <!-- Left Passport Page (Inside) -->
      <rect x="0" y="0" width="70" height="125" rx="2" fill="url(#visa-page-grad)" />
      <!-- Watermark / Security pattern on left page -->
      <circle cx="35" cy="62.5" r="22" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
      <path d="M25 62.5 L45 62.5 M35 52.5 L35 72.5" stroke="#cbd5e1" stroke-width="1.5" opacity="0.6"/>
      <!-- ID Photo Placeholder -->
      <rect x="15" y="20" width="40" height="50" rx="3" fill="#e2e8f0" />
      <circle cx="35" cy="40" r="12" fill="#94a3b8" />
      <path d="M20 62 C20 55, 50 55, 50 62" fill="#94a3b8" />
      <!-- Passport lines -->
      <rect x="15" y="78" width="40" height="4" rx="2" fill="#cbd5e1" />
      <rect x="20" y="86" width="30" height="3" rx="1.5" fill="#cbd5e1" />

      <!-- Right Passport Page (THE VISA PAGE) -->
      <rect x="70" y="0" width="70" height="125" rx="2" fill="url(#visa-page-grad)" />
      
      <!-- Center Book Spine Crease -->
      <path d="M70 0 L70 125" stroke="#cbd5e1" stroke-width="2" />
      <path d="M68 0 L72 125" stroke="#000000" stroke-opacity="0.08" stroke-width="1" />

      <!-- VIBRANT VISA STICKER / THỊ THỰC -->
      <g transform="translate(76, 12)">
        <!-- Visa Sticker Background -->
        <rect width="58" height="100" rx="4" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
        <rect width="58" height="18" rx="4" fill="#0284c7" />
        <!-- Micro text lines in header -->
        <circle cx="10" cy="9" r="3" fill="#bae6fd" />
        <rect x="17" y="7" width="28" height="4" rx="2" fill="#e0f2fe" />
        
        <!-- Visa Graphic Details -->
        <rect x="8" y="26" width="22" height="16" rx="2" fill="#f1f5f9" />
        <circle cx="19" cy="34" r="5" fill="#cbd5e1" />
        
        <rect x="34" y="26" width="18" height="4" rx="2" fill="#cbd5e1" />
        <rect x="34" y="34" width="14" height="4" rx="2" fill="#e2e8f0" />
        <rect x="34" y="40" width="16" height="3" rx="1.5" fill="#e2e8f0" />

        <!-- Security Hologram Badge -->
        <circle cx="45" cy="62" r="8" fill="url(#visa-page-grad)" stroke="#f59e0b" stroke-width="1.5" />
        <path d="M42 62 L48 62 M45 59 L45 65" stroke="#f59e0b" stroke-width="1.5" />

        <!-- More mock text & data -->
        <rect x="8" y="54" width="26" height="3" rx="1.5" fill="#94a3b8" />
        <rect x="8" y="60" width="22" height="3" rx="1.5" fill="#cbd5e1" />
        
        <rect x="8" y="72" width="42" height="3" rx="1.5" fill="#e2e8f0" />
        <rect x="8" y="78" width="35" height="3" rx="1.5" fill="#e2e8f0" />

        <!-- Machine Readable Zone (MRZ) at bottom of visa -->
        <rect x="6" y="88" width="46" height="3" rx="1" fill="#334155" />
        <rect x="6" y="93" width="40" height="3" rx="1" fill="#334155" />

        <!-- OFFICIAL ENTRY STAMP OVERLAPPING THE VISA -->
        <g transform="translate(18, 48) rotate(-14)" filter="url(#soft-shadow)">
          <!-- Red Ink Stamp -->
          <circle cx="20" cy="20" r="18" fill="none" stroke="url(#stamp-grad)" stroke-width="2.5" stroke-dasharray="35 3 2 3" />
          <circle cx="20" cy="20" r="13" fill="none" stroke="url(#stamp-grad)" stroke-width="1" />
          <!-- Inner stamp graphics -->
          <rect x="10" y="17" width="20" height="3" rx="1" fill="#dc2626" opacity="0.8" />
          <rect x="12" y="22" width="16" height="2" rx="1" fill="#dc2626" opacity="0.8" />
          <path d="M14 13 L26 13" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
        </g>
      </g>
    </g>
  </g>

  <!-- FOREGROUND PROPS & DYNAMIC ELEMENTS -->
  <!-- Sleek Modern Pen (Ready to sign or fill visa documents) -->
  <g transform="translate(165, 120) rotate(35)" filter="url(#shadow)">
    <!-- Pen Body -->
    <rect x="0" y="0" width="8" height="90" rx="4" fill="#38bdf8" />
    <rect x="0" y="0" width="3" height="90" fill="#bae6fd" opacity="0.6" />
    <!-- Pen Cap & Clip -->
    <rect x="-1" y="0" width="10" height="25" rx="3" fill="#0284c7" />
    <rect x="3" y="-5" width="2" height="20" rx="1" fill="#f59e0b" />
    <!-- Pen Tip -->
    <path d="M0 90 L4 102 L8 90 Z" fill="#64748b" />
    <path d="M3 90 L4 98 L5 90 Z" fill="#cbd5e1" />
  </g>

  <!-- Golden Travel Coin / Compass Accent (Symbolizing global entry/travel) -->
  <g transform="translate(40, 160)" filter="url(#shadow)">
    <circle cx="16" cy="16" r="16" fill="#f59e0b" />
    <circle cx="16" cy="16" r="13" fill="#fbbf24" />
    <!-- Compass Rose -->
    <path d="M16 8 L18 14 L24 16 L18 18 L16 24 L14 18 L8 16 L14 14 Z" fill="#b45309" />
    <circle cx="16" cy="16" r="2" fill="#fffbeb" />
  </g>

  <!-- Floating Sparkles / Action Accents -->
  <g transform="translate(135, 30)">
    <path d="M0 6 L3 3 L6 6 L3 9 Z" fill="#fbbf24" />
    <circle cx="12" cy="2" r="1.5" fill="#38bdf8" />
  </g>
  
  <g transform="translate(25, 75)">
    <path d="M0 6 L3 3 L6 6 L3 9 Z" fill="#38bdf8" />
    <circle cx="-4" cy="12" r="2" fill="#f59e0b" />
  </g>

  <g transform="translate(210, 150)">
    <path d="M0 5 L2.5 2.5 L5 5 L2.5 7.5 Z" fill="#ec4899" />
  </g>

</svg>