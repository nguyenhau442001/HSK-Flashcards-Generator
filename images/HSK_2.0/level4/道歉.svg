<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Light Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Character 1 (Apologizer) Hair/Skin tones -->
    <linearGradient id="shirt-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Character 2 (Friend) Outfit tones -->
    <linearGradient id="shirt-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Container with Rounded Corners -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Lighting Effect -->
  <rect width="240" height="240" rx="24" fill="url(#lamp-glow)" />

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Back Wall Details (Window & Plant) -->
  <g opacity="0.8">
    <!-- Window Frame -->
    <rect x="28" y="36" width="56" height="72" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="34" y="42" width="20" height="28" rx="2" fill="#38bdf8" fill-opacity="0.15" />
    <rect x="58" y="42" width="20" height="28" rx="2" fill="#38bdf8" fill-opacity="0.15" />
    <rect x="34" y="74" width="20" height="28" rx="2" fill="#38bdf8" fill-opacity="0.15" />
    <rect x="58" y="74" width="20" height="28" rx="2" fill="#38bdf8" fill-opacity="0.15" />

    <!-- Bookshelf / Wall Shelf -->
    <rect x="140" y="52" width="70" height="6" rx="3" fill="#334155" />
    <!-- Books on Shelf -->
    <rect x="150" y="36" width="8" height="16" rx="1" fill="#ec4899" />
    <rect x="160" y="34" width="10" height="18" rx="1" fill="#38bdf8" />
    <rect x="172" y="38" width="6" height="14" rx="1" fill="#fbbf24" />
    <path d="M190 52 C190 44 198 44 198 52 Z" fill="#10b981" />
    <path d="M194 52 L194 40" stroke="#10b981" stroke-width="2" />
    <path d="M185 52 Q194 48 203 52" fill="#10b981" opacity="0.5" />
  </g>

  <!-- Floor Plane -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="url(#floor-grad)" />
  <!-- Floor line perspective -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2" />

  <!-- Furniture: Cozy Living Room Chair / Sofa background elements -->
  <path d="M150 110 C150 95 180 95 180 110 L195 175 C195 178 192 180 189 180 L141 180 C138 180 135 178 135 175 Z" fill="#334155" />
  <path d="M142 115 L188 115 L192 170 L138 170 Z" fill="#475569" />

  <!-- Floor Lamp casting warm light -->
  <path d="M210 20 L210 180" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <path d="M195 20 L225 20 L235 45 L185 45 Z" fill="#f59e0b" filter="url(#shadow)" />

  <!-- FOREGROUND / CHARACTERS -->
  <g filter="url(#shadow)">
    <!-- Contact Shadow on Floor -->
    <ellipse cx="95" cy="182" rx="35" ry="8" fill="#090d16" opacity="0.6" />
    <ellipse cx="160" cy="182" rx="25" ry="7" fill="#090d16" opacity="0.6" />

    <!-- CHARACTER 2: THE FRIEND (Listening / Cross-armed or slightly turned away/reluctant) -->
    <g id="friend">
      <!-- Body / Torso -->
      <path d="M145 125 C145 112 165 112 165 125 L172 175 C172 178 169 180 166 180 L144 180 C141 180 138 178 138 175 Z" fill="url(#shirt-orange)" />
      <!-- Head -->
      <circle cx="155" cy="98" r="15" fill="#fbcfe8" />
      <!-- Hair -->
      <path d="M140 98 C140 85 170 85 170 98 C170 98 165 92 155 92 C145 92 140 98 140 98 Z" fill="#334155" />
      <!-- Face profile (facing left towards apologizer) -->
      <!-- Closed/Thoughtful Eye -->
      <path d="M148 97 Q151 100 154 97" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Subtle Frown/Neutral Mouth -->
      <path d="M147 107 Q151 105 153 107" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none" />
      
      <!-- Crossed Arms -->
      <path d="M145 130 Q160 140 170 130" stroke="#ea580c" stroke-width="10" stroke-linecap="round" fill="none" />
      <path d="M142 138 Q157 148 167 138" stroke="#fb923c" stroke-width="8" stroke-linecap="round" fill="none" />
      
      <!-- Legs -->
      <rect x="144" y="175" width="8" height="15" rx="4" fill="#1e293b" />
      <rect x="158" y="175" width="8" height="15" rx="4" fill="#1e293b" />
    </g>

    <!-- CHARACTER 1: THE APOLOGIZER (Bowing deeply, showing sincerity) -->
    <g id="apologizer">
      <!-- Bowing Upper Body & Head Group -->
      <g transform="translate(85, 135) rotate(-45) translate(-85, -135)">
        <!-- Torso -->
        <path d="M70 125 C70 115 100 115 100 125 L105 150 C105 155 95 155 90 155 L75 155 C70 155 70 155 70 150 Z" fill="url(#shirt-blue)" />
        
        <!-- Head -->
        <circle cx="55" cy="120" r="14" fill="#fbcfe8" />
        <!-- Hair -->
        <path d="M42 120 C42 108 68 108 68 120 C68 120 63 112 55 112 C47 112 42 120 42 120 Z" fill="#1e293b" />
        <!-- Sincere closed eyes (happy/apologetic crescent) -->
        <path d="M49 119 Q52 116 55 119" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
        <!-- Slightly open apologetic mouth / grimace -->
        <path d="M51 126 Q54 128 57 126" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none" />
        
        <!-- Extended Arms (bowing forward gesture, palms together or down) -->
        <path d="M60 130 L35 138" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
        <circle cx="33" cy="139" r="4" fill="#fbcfe8" />
      </g>

      <!-- Stationary Lower Body (Kneeling / Bent Legs for Bow) -->
      <!-- Hips / Pants -->
      <path d="M80 145 L105 145 L105 168 L80 168 Z" fill="#334155" />
      <!-- Bent Legs / Knees on Floor -->
      <path d="M85 165 Q70 170 65 180 L95 180 Z" fill="#334155" />
      <path d="M98 165 L110 180 L80 180 Z" fill="#1e293b" />
    </g>
  </g>

  <!-- NARRATIVE PROPS & POLISH -->
  <!-- Dropped / Soft element to add emotional resonance: e.g., a small fallen flower or gift box that caused the mishap -->
  <g transform="translate(115, 172)">
    <!-- Small Gift Box / Token of apology -->
    <rect x="0" y="2" width="14" height="10" rx="2" fill="#ec4899" />
    <rect x="-1" y="0" width="16" height="3" rx="1" fill="#f472b6" />
    <path d="M7 0 L7 12" stroke="#fef08a" stroke-width="2" />
    <path d="M0 6 L14 6" stroke="#fef08a" stroke-width="2" />
    <!-- Ribbon bow loop -->
    <path d="M5 -2 C5 -5 7 -3 7 0 C7 -3 9 -5 9 -2" stroke="#fef08a" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Emotional visual cues (gentle floating sweat drop or sincerity lines, abstract and non-textual) -->
  <g opacity="0.6">
    <path d="M68 85 Q71 88 68 91 Q65 88 68 85 Z" fill="#38bdf8" />
    <path d="M125 75 Q128 78 125 81 Q122 78 125 75 Z" fill="#38bdf8" />
  </g>
</svg>