<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Character 1 Gradients (Left) -->
    <linearGradient id="sweater1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Character 2 Gradients (Right) -->
    <linearGradient id="sweater2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Plant Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Ambient Lighting / Atmosphere -->
  <circle cx="120" cy="80" r="120" fill="url(#lampGlow)"/>

  <!-- BACKGROUND ENVIRONMENT -->
  <!-- Bookshelf Background -->
  <rect x="25" y="45" width="70" height="90" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="75" x2="95" y2="75" stroke="#334155" stroke-width="2"/>
  <line x1="25" y1="105" x2="95" y2="105" stroke="#334155" stroke-width="2"/>
  <!-- Books on shelf -->
  <path d="M35 75 L35 58 L43 58 L43 75 Z" fill="#f59e0b"/>
  <path d="M46 75 L46 62 L53 62 L53 75 Z" fill="#ec4899"/>
  <path d="M65 105 L65 85 L73 85 L73 105 Z" fill="#38bdf8"/>
  <path d="M76 105 L76 90 L83 90 L83 105 Z" fill="#10b981"/>

  <!-- Hanging Pendant Lamp -->
  <path d="M120 0 L120 40" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 40 L140 40 L145 50 L95 50 Z" fill="#fbbf24"/>
  <ellipse cx="120" cy="50" rx="25" ry="8" fill="#f59e0b" opacity="0.3"/>

  <!-- Potted Plant on Floor/Table Edge -->
  <path d="M195 135 L215 135 L210 160 L200 160 Z" fill="#cbd5e1"/>
  <path d="M205 135 C 205 120, 190 115, 195 100 C 205 110, 215 110, 205 135" fill="url(#leafGrad)"/>
  <path d="M205 135 C 215 125, 225 120, 225 105 C 215 115, 205 120, 205 135" fill="url(#leafGrad)"/>
  <path d="M205 135 C 195 125, 185 120, 185 110 C 195 115, 200 120, 205 135" fill="url(#leafGrad)"/>

  <!-- Wooden Table -->
  <path d="M20 165 L220 165 L210 195 L30 195 Z" fill="#334155"/>
  <path d="M30 165 L210 165 L210 170 L30 170 Z" fill="#475569"/>
  <!-- Table Props: Coffee mugs, papers -->
  <rect x="95" y="153" width="16" height="15" rx="3" fill="#f8fafc"/>
  <path d="M111 157 C 116 157, 116 165, 111 165" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <ellipse cx="135" cy="160" rx="12" ry="4" fill="#cbd5e1"/>
  <rect x="130" y="156" width="10" height="2" fill="#94a3b8"/>

  <!-- FOREGROUND / MIDDLEGROUND CHARACTERS -->
  
  <!-- CHARACTER 1 (Left: Expressive talking pose) -->
  <g id="character-left">
    <!-- Body & Torso -->
    <path d="M55 175 C 55 145, 75 145, 80 175 Z" fill="url(#sweater1)"/>
    <!-- Head -->
    <circle cx="68" cy="120" r="18" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M50 120 C 50 100, 86 100, 86 120 C 86 125, 80 115, 68 112 C 56 115, 50 125, 50 120 Z" fill="#334155"/>
    <!-- Facial Features: Open mouth talking, expressive eye -->
    <circle cx="75" cy="120" r="2" fill="#1e293b"/>
    <path d="M73 128 C 76 132, 80 128, 80 126 Z" fill="#e11d48"/> <!-- Open mouth -->
    <path d="M71 116 Q 75 113 79 116" stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Eyebrow raised -->
    <!-- Left Arm gesturing dynamically -->
    <path d="M70 148 C 60 145, 45 130, 40 120" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="38" cy="117" r="4" fill="#ffedd5"/>
  </g>

  <!-- CHARACTER 2 (Right: Listening intently and leaning in) -->
  <g id="character-right">
    <!-- Body & Torso -->
    <path d="M160 175 C 160 145, 185 145, 180 175 Z" fill="url(#sweater2)"/>
    <!-- Head -->
    <circle cx="168" cy="118" r="18" fill="#fde047"/>
    <!-- Hair -->
    <path d="M150 118 C 150 98, 186 98, 186 118 C 180 110, 156 110, 150 118 Z" fill="#78350f"/>
    <!-- Facial Features: Smiling, looking left -->
    <circle cx="161" cy="118" r="2" fill="#1e293b"/>
    <path d="M158 125 Q 163 129 167 125" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Smile -->
    <path d="M157 113 Q 161 110, 165 113" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/> <!-- Eyebrow -->
    <!-- Right Arm resting on table / supporting chin -->
    <path d="M165 150 C 160 140, 160 130, 163 125" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Hand on chin -->
    <circle cx="163" cy="123" r="4" fill="#fde047"/>
  </g>

  <!-- DIALOGUE / CONVERSATION VIBE (Abstract dynamic flow lines, NO TEXT) -->
  <g opacity="0.6">
    <path d="M 88 115 Q 105 100, 120 115 Q 135 130, 150 115" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="4 6"/>
    <circle cx="120" cy="107" r="3" fill="#38bdf8"/>
    <circle cx="105" cy="120" r="2" fill="#f43f5e"/>
    <circle cx="138" cy="122" r="2.5" fill="#10b981"/>
  </g>

</svg>