<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Globe Gradient -->
    <linearGradient id="globe-grad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sun/Warm Glow Gradient -->
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Snow/Cold Gradient -->
    <linearGradient id="snow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric background rings & stars -->
  <g fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4">
    <circle cx="120" cy="120" r="95" stroke-dasharray="4 8" />
    <circle cx="120" cy="120" r="105" />
  </g>
  <g fill="#94a3b8" opacity="0.5">
    <circle cx="45" cy="55" r="1.5" />
    <circle cx="195" cy="45" r="2" />
    <circle cx="205" cy="175" r="1" />
    <circle cx="35" cy="185" r="1.5" />
  </g>

  <!-- MAIN SCENE: The Climate Globe -->
  <g filter="url(#soft-shadow)">
    <!-- Globe Base Shadow -->
    <ellipse cx="120" cy="205" rx="55" ry="12" fill="#020617" opacity="0.6" />
    
    <!-- Globe Stand -->
    <path d="M100 185 L140 185 L132 200 L108 200 Z" fill="#64748b" />
    <ellipse cx="120" cy="202" rx="25" ry="5" fill="#475569" />
    <path d="M120 160 L120 185" stroke="#64748b" stroke-width="6" stroke-linecap="round" />

    <!-- Outer Atmosphere Glow -->
    <circle cx="120" cy="115" r="66" fill="#38bdf8" opacity="0.15" />

    <!-- Globe Sphere -->
    <circle cx="120" cy="115" r="60" fill="url(#globe-grad)" />

    <!-- Continents (Stylized Landmasses) -->
    <g fill="#10b981" opacity="0.85">
      <!-- North/West Land -->
      <path d="M85 85 C95 70, 115 75, 125 90 C135 105, 110 120, 95 110 C85 100, 75 100, 85 85 Z" />
      <!-- South/East Land -->
      <path d="M115 130 C135 125, 145 140, 140 155 C135 170, 110 160, 105 145 C100 135, 105 132, 115 130 Z" />
      <!-- Small Island -->
      <circle cx="150" cy="100" r="5" />
    </g>

    <!-- Globe Glossy Highlight -->
    <path d="M78 95 C85 75, 105 70, 125 73 C105 72, 88 82, 78 95 Z" fill="#ffffff" opacity="0.3" />
  </g>

  <!-- CLIMATE HEMISPHERES & WEATHER PHENOMENA -->
  
  <!-- LEFT SIDE: Warm / Tropical Climate (Sun & Palm-like vibe) -->
  <g transform="translate(-10, -5)">
    <!-- Sun Ray Glow -->
    <circle cx="65" cy="75" r="22" fill="#fb923c" opacity="0.3" />
    <!-- Sun -->
    <circle cx="65" cy="75" r="14" fill="url(#sun-grad)" filter="url(#soft-shadow)" />
    <path d="M65 53 L65 57 M65 93 L65 97 M43 75 L47 75 M83 75 L87 75 M50 60 L53 63 M77 87 L80 90 M50 90 L53 87 M77 63 L80 60" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- RIGHT SIDE: Cold / Snowy Climate (Snowflake & Cloud) -->
  <g transform="translate(15, -5)">
    <!-- Cold Cloud -->
    <path d="M165 75 C165 67, 172 60, 180 60 C186 60, 191 64, 193 70 C198 70, 202 74, 202 80 C202 86, 198 90, 192 90 L168 90 C162 90, 165 82, 165 75 Z" fill="url(#cloud-grad)" filter="url(#soft-shadow)" />
    
    <!-- Snowflakes falling -->
    <g stroke="url(#snow-grad)" stroke-width="2" stroke-linecap="round">
      <!-- Snowflake 1 -->
      <path d="M175 105 L185 115 M185 105 L175 115 M180 100 L180 120 M170 110 L190 110" />
      <!-- Snowflake 2 -->
      <path d="M150 120 L156 126 M156 120 L150 126 M153 117 L153 129 M147 123 L159 123" opacity="0.7" />
    </g>
  </g>

  <!-- FOREGROUND ACCENTS (Rain & Temperature Elements) -->
  
  <!-- Raindrops (Bottom Left) -->
  <g fill="#38bdf8">
    <path d="M75 145 C75 145, 72 152, 72 155 C72 157, 74 159, 76 159 C78 159, 80 157, 80 155 C80 152, 75 145, 75 145 Z" />
    <path d="M60 130 C60 130, 57 137, 57 140 C57 142, 59 144, 61 144 C63 144, 65 142, 65 140 C65 137, 60 130, 60 130 Z" opacity="0.6" />
  </g>

  <!-- Temperature Gauge / Thermometer (Right Foreground) -->
  <g transform="translate(195, 115)" filter="url(#soft-shadow)">
    <!-- Thermometer Body -->
    <rect x="-6" y="-30" width="12" height="55" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Tube Inner -->
    <rect x="-2" y="-24" width="4" height="42" rx="2" fill="#334155" />
    <!-- Mercury Level (Balanced green/orange for climate) -->
    <rect x="-2" y="-5" width="4" height="23" rx="2" fill="#ec4899" />
    <!-- Bulb Base -->
    <circle cx="0" cy="20" r="8" fill="#ec4899" />
    <circle cx="0" cy="20" r="10" fill="none" stroke="#475569" stroke-width="2" />
    <!-- Tick Marks -->
    <path d="M-4 -15 L-1 -15 M-4 -5 L-1 -5 M-4 5 L-1 5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Green Leaf Accent (Representing flourishing environment/seasons) -->
  <g transform="translate(45, 150) rotate(-25)" filter="url(#soft-shadow)">
    <path d="M0 25 C0 10, 15 0, 25 0 C25 15, 10 30, 0 25 Z" fill="#10b981" />
    <path d="M3 20 C10 15, 15 10, 22 3" stroke="#065f46" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Sparkles / Dynamic Nature Elements -->
  <path d="M110 35 L113 42 L120 45 L113 48 L110 55 L107 48 L100 45 L107 42 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M140 180 L142 185 L147 187 L142 189 L140 194 L138 189 L133 187 L138 185 Z" fill="#38bdf8" opacity="0.9" />

</svg>