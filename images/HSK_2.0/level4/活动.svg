<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Banner Gradient -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Stage Gradient -->
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting / Ambient Glow -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="120" cy="80" r="50" fill="#fbbf24" opacity="0.12" filter="url(#glow)"/>

  <!-- Background School/Auditorium Architecture -->
  <!-- Pillars / Side accents -->
  <rect x="20" y="40" width="10" height="150" fill="#1e293b" opacity="0.6"/>
  <rect x="210" y="40" width="10" height="150" fill="#1e293b" opacity="0.6"/>

  <!-- Hanging Festival Lights / Activity Bunting -->
  <path d="M 0 30 Q 60 55 120 30 T 240 30" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Bunting Flags -->
  <polygon points="45,39 55,39 50,52" fill="#ec4899"/>
  <polygon points="95,35 105,35 100,48" fill="#38bdf8"/>
  <polygon points="145,35 155,35 150,48" fill="#10b981"/>
  <polygon points="195,39 205,39 200,52" fill="#fb923c"/>

  <!-- Main Activity Banner (School Event Context) -->
  <path d="M 50 55 L 190 55 L 180 85 L 60 85 Z" fill="url(#bannerGrad)" filter="url(#glow)" opacity="0.2"/>
  <path d="M 45 52 L 195 52 L 185 82 L 55 82 Z" fill="url(#bannerGrad)"/>
  <path d="M 45 52 L 55 82 L 50 82 Z" fill="#d97706"/>
  <path d="M 195 52 L 185 82 L 190 82 Z" fill="#d97706"/>
  <!-- Decorative Ribbons on Banner -->
  <circle cx="58" cy="67" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="182" cy="67" r="4" fill="#ffffff" opacity="0.8"/>

  <!-- Stage Platform -->
  <ellipse cx="120" cy="180" rx="90" ry="25" fill="url(#stageGrad)"/>
  <ellipse cx="120" cy="180" rx="84" ry="21" fill="#1e293b"/>

  <!-- Props & Context: Gift Box / Activity Prize -->
  <g transform="translate(45, 145)">
    <!-- Box Base -->
    <rect x="0" y="10" width="26" height="24" rx="3" fill="#ec4899"/>
    <rect x="-2" y="6" width="30" height="8" rx="2" fill="#f43f5e"/>
    <!-- Ribbon -->
    <rect x="11" y="6" width="4" height="28" fill="#fbbf24"/>
    <rect x="0" y="18" width="26" height="4" fill="#fbbf24"/>
    <!-- Bow -->
    <path d="M 13 6 Q 6 -2 2 4 Q 8 8 13 6 Z" fill="#fbbf24"/>
    <path d="M 13 6 Q 20 -2 24 4 Q 18 8 13 6 Z" fill="#fbbf24"/>
  </g>

  <!-- Props & Context: Trophy / Activity Reward -->
  <g transform="translate(170, 138)">
    <path d="M 7 22 L 17 22 L 15 32 L 9 32 Z" fill="#64748b"/>
    <rect x="5" y="32" width="14" height="5" rx="1" fill="#475569"/>
    <path d="M 4 8 C 4 2 20 2 20 8 C 20 15 15 18 12 22 C 9 18 4 15 4 8 Z" fill="#fbbf24"/>
    <path d="M 4 6 C 1 6 1 12 4 14" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M 20 6 C 23 6 23 12 20 14" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="10" r="3" fill="#fde047" opacity="0.6"/>
  </g>

  <!-- Central Action: Two Energetic Characters Participating in the Activity -->
  
  <!-- Character 1 (Left - Cheering / Active Participant) -->
  <g transform="translate(75, 110)">
    <!-- Body / Torso -->
    <path d="M 10 25 C 10 18 25 18 25 25 L 28 45 L 2 45 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="15" cy="10" r="9" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M 6 8 C 6 3 12 2 16 3 C 22 3 24 8 24 8 C 24 8 20 5 15 5 C 10 5 6 8 6 8 Z" fill="#1e293b"/>
    <!-- Arm Raised in Joy -->
    <path d="M 6 22 L -4 10 L 1 6 L 9 18 Z" fill="#38bdf8"/>
    <circle cx="-5" cy="8" r="3" fill="#fcd34d"/>
    <!-- Arm Lower -->
    <path d="M 24 22 L 32 30 L 28 34 L 22 26 Z" fill="#38bdf8"/>
    <!-- Legs -->
    <rect x="6" y="45" width="5" height="15" fill="#334155"/>
    <rect x="15" y="45" width="5" height="15" fill="#334155"/>
  </g>

  <!-- Character 2 (Right - Presenting / Leading the Activity) -->
  <g transform="translate(135, 100)">
    <!-- Body / Torso -->
    <path d="M 5 25 C 5 18 20 18 20 25 L 24 50 L 2 50 Z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="13" cy="10" r="9" fill="#fcd34d"/>
    <!-- Hair (Ponytail) -->
    <path d="M 5 8 C 5 3 12 2 18 4 C 21 5 23 8 25 12 C 23 11 20 14 17 10 C 13 6 8 6 5 8 Z" fill="#0f172a"/>
    <!-- Arm Gesturing / Pointing to Activity -->
    <path d="M 18 22 L 28 15 L 31 19 L 21 27 Z" fill="#10b981"/>
    <circle cx="29" cy="16" r="3" fill="#fcd34d"/>
    <!-- Other Arm -->
    <path d="M 6 22 L -2 30 L 2 34 L 9 26 Z" fill="#10b981"/>
    <!-- Legs -->
    <rect x="5" y="50" width="5" height="16" fill="#1e293b"/>
    <rect x="14" y="50" width="5" height="16" fill="#1e293b"/>
  </g>

  <!-- Action Sparkles / Dynamic Activity Effects -->
  <g fill="#fbbf24">
    <path d="M 120 70 L 122 75 L 127 77 L 122 79 L 120 84 L 118 79 L 113 77 L 118 75 Z" transform="scale(0.6) translate(50, 40)"/>
    <path d="M 120 70 L 122 75 L 127 77 L 122 79 L 120 84 L 118 79 L 113 77 L 118 75 Z" fill="#38bdf8" transform="scale(0.5) translate(190, 80)"/>
    <path d="M 120 70 L 122 75 L 127 77 L 122 79 L 120 84 L 118 79 L 113 77 L 118 75 Z" fill="#ec4899" transform="scale(0.5) translate(80, 160)"/>
  </g>

  <!-- Foreground Floor Details / Confetti -->
  <circle cx="85" cy="195" r="2.5" fill="#38bdf8"/>
  <rect x="145" y="190" width="4" height="4" transform="rotate(45 147 192)" fill="#fbbf24"/>
  <circle cx="110" cy="205" r="2" fill="#ec4899"/>
  <rect x="65" y="180" width="5" height="3" transform="rotate(15 67 181)" fill="#10b981"/>
  <circle cx="160" cy="198" r="2.5" fill="#fb923c"/>

  <!-- Border Frame / Stroke for polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>