<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Warm festival lantern glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Ribbon Gradient 1 -->
    <linearGradient id="ribbonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Ribbon Gradient 2 -->
    <linearGradient id="ribbonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Ribbon Gradient 3 -->
    <linearGradient id="ribbonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Atmospheric background lights / stars / confetti -->
  <g opacity="0.6">
    <circle cx="40" cy="50" r="1.5" fill="#fbbf24"/>
    <circle cx="80" cy="30" r="1" fill="#38bdf8"/>
    <circle cx="200" cy="60" r="2" fill="#fb7185"/>
    <circle cx="210" cy="110" r="1" fill="#fbbf24"/>
    <circle cx="30" cy="130" r="1.5" fill="#34d399"/>
    <circle cx="120" cy="20" r="1.5" fill="#f43f5e"/>
  </g>

  <!-- Ambient Lantern / Festival Lights -->
  <circle cx="120" cy="40" r="80" fill="url(#lanternGlow)"/>

  <!-- Hanging Festival Lanterns in background -->
  <g opacity="0.8">
    <line x1="50" y1="0" x2="50" y2="25" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="50" cy="30" rx="12" ry="15" fill="#ef4444"/>
    <path d="M42 38 Q50 45 58 38" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <line x1="50" y1="45" x2="50" y2="55" stroke="#f59e0b" stroke-width="1.5"/>

    <line x1="190" y1="0" x2="190" y2="35" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="190" cy="42" rx="15" ry="18" fill="#f97316"/>
    <path d="M180 51 Q190 60 200 51" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <line x1="190" y1="60" x2="190" y2="72" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Floor/Stage curve -->
  <ellipse cx="120" cy="210" rx="100" ry="30" fill="url(#floorGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Festive Drum Base (representing cultural gathering) -->
  <g filter="url(#dropShadow)">
    <ellipse cx="120" cy="180" rx="55" ry="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Drum body -->
    <path d="M 65 150 Q 65 180 120 198 Q 175 180 175 150 Z" fill="#b91c1c"/>
    <path d="M 65 150 Q 120 168 175 150 Q 120 132 65 150 Z" fill="#ef4444" stroke="#f59e0b" stroke-width="2"/>
    <!-- Drum studs -->
    <circle cx="70" cy="153" r="1.5" fill="#fbbf24"/>
    <circle cx="85" cy="158" r="1.5" fill="#fbbf24"/>
    <circle cx="100" cy="161" r="1.5" fill="#fbbf24"/>
    <circle cx="120" cy="162" r="1.5" fill="#fbbf24"/>
    <circle cx="140" cy="161" r="1.5" fill="#fbbf24"/>
    <circle cx="155" cy="158" r="1.5" fill="#fbbf24"/>
    <circle cx="170" cy="153" r="1.5" fill="#fbbf24"/>
  </g>

  <!-- Dynamic Flowing Celebration Ribbons (Symbolizing unity and diversity of 56 ethnic groups) -->
  <g filter="url(#dropShadow)">
    <!-- Ribbon 1 - Pink/Red Curve -->
    <path d="M 30 160 Q 60 70 120 110 T 210 70" fill="none" stroke="url(#ribbonPink)" stroke-width="9" stroke-linecap="round"/>
    <!-- Ribbon 2 - Orange Curve -->
    <path d="M 20 130 Q 70 140 120 80 T 220 120" fill="none" stroke="url(#ribbonOrange)" stroke-width="7" stroke-linecap="round"/>
    <!-- Ribbon 3 - Teal/Green Curve -->
    <path d="M 40 180 Q 90 120 140 140 T 200 150" fill="none" stroke="url(#ribbonTeal)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Central Cultural Artifact: Ornate Ethnic Silver Neck Ring/Ornament Motif -->
  <g filter="url(#dropShadow)" transform="translate(120, 115)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Main Silver Neck Ring (Hmong/Miao style inspiration) -->
    <path d="M -30 10 C -30 -25 30 -25 30 10 Q 35 20 25 25 Q 0 35 -25 25 Q -35 20 -30 10 Z" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Hanging Decorative Bells/Plates -->
    <path d="M -15 28 L -15 38" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="-15" cy="40" r="3" fill="#f59e0b"/>

    <path d="M 0 32 L 0 42" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="0" cy="44" r="3.5" fill="#f59e0b"/>

    <path d="M 15 28 L 15 38" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="15" cy="40" r="3" fill="#f59e0b"/>

    <!-- Geometric Patterns etched onto the ring -->
    <circle cx="0" cy="-8" r="6" fill="#38bdf8" opacity="0.8"/>
    <circle cx="-15" cy="-2" r="4" fill="#fb7185" opacity="0.8"/>
    <circle cx="15" cy="-2" r="4" fill="#34d399" opacity="0.8"/>
  </g>

  <!-- Foreground Dynamic Elements (Sparkles & Festive confetti) -->
  <g>
    <!-- Star Sparkle Left -->
    <path d="M 45 80 L 48 88 L 56 91 L 48 94 L 45 102 L 42 94 L 34 91 L 42 88 Z" fill="#fbbf24"/>
    <!-- Star Sparkle Right -->
    <path d="M 195 100 L 197 105 L 202 107 L 197 109 L 195 114 L 193 109 L 188 107 L 193 105 Z" fill="#38bdf8"/>
    <!-- Small Diamond Confetti -->
    <polygon points="120,55 124,60 120,65 116,60" fill="#f43f5e"/>
    <polygon points="75,120 78,124 75,128 72,124" fill="#34d399"/>
    <polygon points="165,110 169,114 165,118 161,114" fill="#fbbf24"/>
  </g>

</svg>