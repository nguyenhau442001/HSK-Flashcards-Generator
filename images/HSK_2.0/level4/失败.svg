<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    
    <!-- Glow Gradients -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Lab setting) -->
  <g opacity="0.15">
    <!-- Lab shelves and equipment outlines -->
    <rect x="25" y="45" width="70" height="6" rx="3" fill="#94a3b8"/>
    <rect x="145" y="45" width="70" height="6" rx="3" fill="#94a3b8"/>
    <!-- Hanging wires -->
    <path d="M 60 20 L 60 45" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 180 20 L 180 45" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Subtle technical grid dots -->
    <circle cx="40" cy="80" r="1.5" fill="#38bdf8"/>
    <circle cx="200" cy="90" r="1.5" fill="#38bdf8"/>
    <circle cx="30" cy="150" r="1.5" fill="#38bdf8"/>
    <circle cx="210" cy="160" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Workbench Surface -->
  <path d="M 20 185 L 220 185 L 210 215 L 30 215 Z" fill="#0f172a" opacity="0.9"/>
  <path d="M 20 185 L 220 185" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <rect x="20" y="215" width="200" height="25" fill="#090d16"/>
  
  <!-- Floor Shadow Overlay -->
  <rect x="0" y="180" width="240" height="60" fill="url(#floorGrad)" pointer-events="none"/>

  <!-- SCENE OBJECT: The Defeated / Failed Experiment (Smoking, sparks, gears flying) -->
  
  <!-- Explosion / Spark Backlight -->
  <circle cx="120" cy="140" r="45" fill="url(#sparkGlow)" opacity="0.8"/>

  <!-- Scattered Components & Debris (Ground level) -->
  <g filter="url(#shadow)">
    <!-- Gear 1 -->
    <g transform="translate(65, 175) rotate(15)">
      <circle cx="0" cy="0" r="10" fill="#64748b"/>
      <circle cx="0" cy="0" r="4" fill="#1e293b"/>
      <path d="M -3 -12 L 3 -12 L 3 12 L -3 12 Z" fill="#64748b"/>
      <path d="M -12 -3 L 12 -3 L 12 3 L -12 3 Z" fill="#64748b"/>
    </g>

    <!-- Gear 2 (Smaller, broken off) -->
    <g transform="translate(165, 180) rotate(-40)">
      <circle cx="0" cy="0" r="7" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="2.5" fill="#1e293b"/>
      <path d="M -2 -9 L 2 -9 L 2 9 L -2 9 Z" fill="#cbd5e1"/>
      <path d="M -9 -2 L 9 -2 L 9 2 L -9 2 Z" fill="#cbd5e1"/>
    </g>

    <!-- Loose spring -->
    <path d="M 145, 185 Q 150, 175 155, 180 T 165, 182" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Tiny metallic bolt -->
    <rect x="85" y="182" width="6" height="4" rx="1" fill="#94a3b8" transform="rotate(35 88 184)"/>
  </g>

  <!-- Main Subject: The Robot / Mechanism Having Failed -->
  <g filter="url(#shadow)">
    <!-- Robot Base / Lower Chassis (Tilted & Smoking) -->
    <g transform="translate(120, 160) rotate(12)">
      <!-- Track / Wheel Base -->
      <rect x="-32" y="8" width="64" height="12" rx="6" fill="#334155"/>
      <circle cx="-18" cy="14" r="4" fill="#64748b"/>
      <circle cx="0" cy="14" r="4" fill="#64748b"/>
      <circle cx="18" cy="14" r="4" fill="#64748b"/>

      <!-- Main Torso (Slumped) -->
      <rect x="-26" y="-14" width="52" height="26" rx="8" fill="url(#robotBody)"/>
      
      <!-- Panel Detail / Screen (Showing 'Error' X pattern) -->
      <rect x="-16" y="-8" width="32" height="14" rx="3" fill="#0f172a"/>
      <path d="M -10 -4 L -4 2 M -4 -4 L -10 2" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 4 -4 L 10 2 M 10 -4 L 4 2" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Neck -->
      <rect x="-6" y="-22" width="12" height="8" rx="2" fill="#64748b"/>

      <!-- Head (Sagging / Droop-eyed) -->
      <g transform="translate(0, -32)">
        <rect x="-22" y="-12" width="44" height="20" rx="8" fill="url(#robotBody)"/>
        
        <!-- Antenna (Bent / Broken angle) -->
        <path d="M 0 -12 L 8 -24" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
        <circle cx="8" cy="-24" r="4" fill="#ef4444"/>

        <!-- Sad / Defeated Digital Eyes (Downward arcs/dashes) -->
        <!-- Left eye -->
        <path d="M -12 -3 Q -9 -7 -6 -3" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Right eye -->
        <path d="M 6 -3 Q 9 -7 12 -3" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
        
        <!-- Spark/Sweat drop indicating stress -->
        <path d="M 18 -10 C 21 -10 22 -6 20 -4 C 18 -6 18 -10 18 -10 Z" fill="#38bdf8"/>
      </g>

      <!-- Arms (Dangling limply) -->
      <!-- Left Arm -->
      <path d="M -26 -6 C -38 -2 -42 12 -40 16" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-40" cy="16" r="4" fill="#64748b"/>
      
      <!-- Right Arm -->
      <path d="M 26 -6 C 36 0 38 10 35 15" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
      <circle cx="35" cy="15" r="4" fill="#64748b"/>
    </g>
  </g>

  <!-- Dynamic Smoke & Failure FX (Rising from Robot) -->
  <g opacity="0.8" filter="url(#shadow)">
    <!-- Smoke puff 1 -->
    <path d="M 105 105 C 100 95 105 85 115 85 C 120 75 135 75 140 85 C 150 85 155 95 150 105 Z" fill="#64748b" opacity="0.6"/>
    <!-- Smoke puff 2 (higher, fading) -->
    <path d="M 120 75 C 115 65 125 55 135 55 C 145 55 150 65 145 75 Z" fill="#94a3b8" opacity="0.4"/>
  </g>

  <!-- Flying Sparks / Energy Bits -->
  <g>
    <!-- Spark 1 -->
    <path d="M 85 110 L 75 100" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="73" cy="98" r="1.5" fill="#f59e0b"/>

    <!-- Spark 2 -->
    <path d="M 155 115 L 168 105" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="170" cy="103" r="2" fill="#fb923c"/>

    <!-- Spark 3 (Top right burst) -->
    <path d="M 140 60 L 148 48" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 135 65 L 128 55" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="45" r="1.5" fill="#fef08a"/>
    
    <!-- Floating Electric Arc -->
    <path d="M 95 135 Q 90 125 100 120 T 98 110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Lighting / Vignette Polish -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
</svg>