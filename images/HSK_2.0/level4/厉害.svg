<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Arcade Cabinet Body Gradient -->
    <linearGradient id="cab-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Screen Glow Gradient -->
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Energy Aura Gradient -->
    <radialGradient id="energy-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Background Ambient Shapes (Action/Speed Lines) -->
  <g opacity="0.15">
    <path d="M20 20 L80 120" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M220 30 L160 140" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 220 L110 160" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M200 200 L140 130" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Arcade Floor Shadow -->
  <ellipse cx="120" cy="215" rx="70" ry="12" fill="#020617" opacity="0.8"/>

  <!-- Arcade Cabinet (The Environment / Action Object) -->
  <g filter="url(#shadow)">
    <!-- Side Panels Outer Wings -->
    <path d="M60 60 L180 60 L195 195 L170 215 L70 215 L45 195 Z" fill="#1e1b4b"/>
    
    <!-- Main Cabinet Body -->
    <rect x="65" y="55" width="110" height="155" rx="8" fill="url(#cab-grad)"/>
    
    <!-- Cabinet Stripe Accents -->
    <path d="M65 80 L175 80" stroke="#fbbf24" stroke-width="4"/>
    <path d="M65 175 L175 175" stroke="#fbbf24" stroke-width="4"/>
    
    <!-- Marquee (Top Light Box) -->
    <rect x="75" y="65" width="90" height="25" rx="4" fill="#fb923c" filter="url(#glow)"/>
    <path d="M85 75 L155 75" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <path d="M95 82 L145 82" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>

    <!-- Screen Recess -->
    <rect x="75" y="98" width="90" height="55" rx="6" fill="#0f172a"/>
    <!-- Screen Display (Epic boss battle graphic) -->
    <rect x="79" y="102" width="82" height="47" rx="4" fill="url(#screen-glow)"/>
    
    <!-- Screen Content: Epic Boss Silhouette & Energy -->
    <circle cx="120" cy="125" r="16" fill="#fef08a" opacity="0.9" filter="url(#glow)"/>
    <path d="M105 140 C110 125, 130 125, 135 140 Z" fill="#0f172a"/>
    <!-- High Score / Action FX on Screen -->
    <path d="M88 112 L96 112 M144 112 L152 112" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Control Panel Deck -->
    <path d="M65 153 L175 153 L185 175 L55 175 Z" fill="#312e81"/>
    
    <!-- Joystick & Buttons -->
    <!-- Joystick 1 -->
    <circle cx="88" cy="164" r="6" fill="#475569"/>
    <path d="M88 164 L84 154" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="84" cy="152" r="5" fill="#ef4444" filter="url(#glow)"/>

    <!-- Arcade Buttons -->
    <circle cx="138" cy="166" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="152" cy="163" r="4" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="165" cy="167" r="4" fill="#10b981" filter="url(#glow)"/>
    <circle cx="145" cy="172" r="4" fill="#f59e0b" filter="url(#glow)"/>

    <!-- Coin Door / Lower Cabinet Vents -->
    <rect x="95" y="185" width="50" height="20" rx="3" fill="#312e81"/>
    <rect x="105" y="190" width="30" height="4" rx="2" fill="#1e1b4b"/>
    <rect x="105" y="198" width="30" height="4" rx="2" fill="#1e1b4b"/>
  </g>

  <!-- Intense "Lìhai" Energy Aura / Explosion FX surrounding the arcade machine -->
  <circle cx="120" cy="130" r="85" fill="url(#energy-aura)" style="mix-blend-mode: screen;" />

  <!-- Action Sparks / Power Stars -->
  <g filter="url(#glow)">
    <!-- Star 1 Top Right -->
    <path d="M185 85 L188 95 L198 98 L188 101 L185 111 L182 101 L172 98 L182 95 Z" fill="#fbbf24"/>
    <!-- Star 2 Top Left -->
    <path d="M55 95 L57 101 L63 103 L57 105 L55 111 L53 105 L47 103 L53 101 Z" fill="#38bdf8"/>
    <!-- Star 3 Bottom Right -->
    <path d="M175 160 L177 165 L182 167 L177 169 L175 174 L173 169 L168 167 L173 165 Z" fill="#ec4899"/>
    <!-- Star 4 Bottom Left -->
    <path d="M60 145 L62 150 L67 152 L62 154 L60 159 L58 154 L53 152 L58 150 Z" fill="#10b981"/>

    <!-- Dynamic Energy Orbs -->
    <circle cx="145" cy="45" r="5" fill="#f43f5e"/>
    <circle cx="85" cy="40" r="3" fill="#38bdf8"/>
    <circle cx="195" cy="135" r="4" fill="#fbbf24"/>
    <circle cx="45" cy="120" r="4" fill="#a855f7"/>
  </g>

  <!-- Speed / Action Lightning Bolts representing ultimate skill/power -->
  <path d="M110 15 L125 45 L115 48 L135 80" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M180 120 L205 130 L195 135 L215 155" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>