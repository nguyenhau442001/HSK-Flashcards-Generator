<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Desk Surface Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Study Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting -->
  <circle cx="120" cy="80" r="110" fill="url(#lampGlow)" />
  <circle cx="120" cy="140" r="70" fill="url(#screenGlow)" />

  <!-- Window with Night Cityscape (Contextual Depth) -->
  <g opacity="0.6">
    <rect x="25" y="30" width="45" height="65" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- City lights through window -->
    <rect x="32" y="45" width="8" height="12" rx="1" fill="#fbbf24" opacity="0.7" />
    <rect x="44" y="40" width="10" height="18" rx="1" fill="#38bdf8" opacity="0.5" />
    <rect x="58" y="55" width="8" height="25" rx="1" fill="#fbbf24" opacity="0.4" />
    <rect x="35" y="65" width="12" height="15" rx="1" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Hanging Desk Lamp -->
  <path d="M120 0 L120 35" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <path d="M95 35 L145 35 L135 50 L105 50 Z" fill="#475569" filter="url(#shadow)" />
  <ellipse cx="120" cy="50" rx="15" ry="5" fill="#fbbf24" filter="url(#glow)" />

  <!-- Bookshelf / Background Props -->
  <rect x="170" y="25" width="45" height="8" rx="2" fill="#475569" />
  <path d="M178 15 L186 25 L170 25 Z" fill="#ec4899" />
  <rect x="190" y="10" width="12" height="15" rx="2" fill="#10b981" />
  <rect x="204" y="12" width="8" height="13" rx="2" fill="#fb923c" />

  <!-- Wooden Desk Surface -->
  <path d="M0 175 L240 175 L240 240 L0 240 Z" fill="url(#deskGrad)" />
  <!-- Desk Edge Highlight -->
  <rect x="0" y="175" width="240" height="3" fill="#64748b" opacity="0.5" />

  <!-- MAIN SCENE: Multi-Talented Student / Workspace representing addition and multi-tasking ("mà, và") -->

  <!-- Open Laptop (Center Stage) -->
  <g filter="url(#shadow)">
    <!-- Laptop Base -->
    <path d="M75 165 L165 165 L175 178 L65 178 Z" fill="#94a3b8" />
    <rect x="110" y="170" width="20" height="5" rx="1" fill="#64748b" />
    <!-- Laptop Screen Backing -->
    <path d="M78 105 L162 105 L165 165 L75 165 Z" fill="#475569" />
    <!-- Screen Display -->
    <rect x="82" y="110" width="76" height="50" rx="2" fill="#0f172a" />
    <!-- UI Elements on screen (Visualizing dual qualities: Smart & Diligent) -->
    <circle cx="100" cy="125" r="8" fill="#38bdf8" opacity="0.8" />
    <path d="M115 122 L145 122" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M115 130 L135 130" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <!-- Rising Chart / Success (Smart) -->
    <path d="M90 150 L100 142 L110 146 L125 132" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Glowing Accent representing "and / moreover" conjunction -->
    <circle cx="120" cy="135" r="18" fill="url(#screenGlow)" />
  </g>

  <!-- Character (Head & Shoulders behind desk) -->
  <g filter="url(#shadow)">
    <!-- Hoodie/Body -->
    <path d="M90 200 C90 170 150 170 150 200 Z" fill="#38bdf8" />
    <!-- Hoodie Hood/Neck -->
    <path d="M100 175 L120 185 L140 175" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    
    <!-- Neck -->
    <rect x="112" y="150" width="16" height="20" fill="#fed7aa" />

    <!-- Head -->
    <circle cx="120" cy="130" r="24" fill="#fed7aa" />

    <!-- Hair (Smart, neat student style) -->
    <path d="M97 125 C97 110 110 102 120 102 C135 102 143 112 144 125 C144 125 140 115 120 112 C100 110 97 125 97 125 Z" fill="#1e293b" />
    <path d="M115 103 L125 108 L133 103" fill="#1e293b" />

    <!-- Smart Glasses -->
    <rect x="105" y="120" width="13" height="9" rx="2" fill="none" stroke="#1e293b" stroke-width="2" />
    <rect x="122" y="120" width="13" height="9" rx="2" fill="none" stroke="#1e293b" stroke-width="2" />
    <line x1="118" y1="124" x2="122" y2="124" stroke="#1e293b" stroke-width="2" />
    <path d="M100 123 L105 122" stroke="#1e293b" stroke-width="2" />
    <path d="M140 123 L135 122" stroke="#1e293b" stroke-width="2" />

    <!-- Confident, Happy Smile -->
    <path d="M113 139 Q120 145 127 139" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="108" cy="136" r="3" fill="#fb7185" opacity="0.6" />
    <circle cx="132" cy="136" r="3" fill="#fb7185" opacity="0.6" />
  </g>

  <!-- Left Prop: Stack of Books & Glowing Star (Representing Attribute 1: Smart / Trí thông minh) -->
  <g filter="url(#shadow)">
    <rect x="25" y="155" width="38" height="8" rx="2" fill="#ec4899" />
    <rect x="23" y="147" width="42" height="8" rx="2" fill="#8b5cf6" />
    <rect x="27" y="139" width="34" height="8" rx="2" fill="#3b82f6" />
    <!-- Bookmark ribbon -->
    <path d="M32 139 L32 163 L35 159 L38 163 L38 139 Z" fill="#fbbf24" />
    
    <!-- Floating Sparkle/Star for "Smart" -->
    <path d="M44 118 L47 125 L54 128 L47 131 L44 138 L41 131 L34 128 L41 125 Z" fill="#fbbf24" filter="url(#glow)" />
    <path d="M44 118 L47 125 L54 128 L47 131 L44 138 L41 131 L34 128 L41 125 Z" fill="#fef08a" />
  </g>

  <!-- Right Prop: Hot Coffee Mug & Rising Steam + Sparkle (Representing Attribute 2: Hardworking / Chăm chỉ) -->
  <g filter="url(#shadow)">
    <!-- Coffee Mug -->
    <path d="M178 145 L202 145 L199 170 L181 170 Z" fill="#f8fafc" />
    <path d="M202 150 C210 150 210 165 202 165" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <!-- Coffee Liquid -->
    <ellipse cx="190" cy="145" rx="12" ry="3" fill="#78350f" />
    
    <!-- Steam / Energy Waves -->
    <path d="M185 135 C180 128 190 122 185 115" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M195 133 C200 127 192 120 197 112" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Floating Sparkle/Heart for "Hardworking / Passion" -->
    <path d="M190 98 L193 103 L199 105 L193 107 L190 112 L187 107 L181 105 L187 103 Z" fill="#10b981" filter="url(#glow)" />
    <path d="M190 98 L193 103 L199 105 L193 107 L190 112 L187 107 L181 105 L187 103 Z" fill="#6ee7b7" />
  </g>

  <!-- Central Dual-Action Visual Anchor (Connecting Left & Right: "Not only... but also..." / "mà, và") -->
  <g transform="translate(120, 95)" filter="url(#glow)">
    <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.2" />
    <!-- Stylish Double Plus / Addition Connection Icon (Abstractly representing 'and / mà còn') -->
    <path d="M-6 -2 L6 -2 M-6 2 L6 2 M-2 -6 L-2 6 M2 -6 L2 6" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  </g>
  <circle cx="120" cy="95" r="4" fill="#ffffff" />

  <!-- Additional Foreground Desk Items for Richness -->
  <!-- Sticky Note with Idea Sketch -->
  <rect x="70" y="175" width="22" height="18" rx="2" fill="#fef08a" transform="rotate(-8 70 175)" filter="url(#shadow)" />
  <path d="M74 182 L80 188 L88 180" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8 70 175)" />

  <!-- Pen / Stylus -->
  <path d="M145 180 L158 165" stroke="#ec4899" stroke-width="3" stroke-linecap="round" filter="url(#shadow)" />
  <path d="M155 168 L159 164" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

</svg>