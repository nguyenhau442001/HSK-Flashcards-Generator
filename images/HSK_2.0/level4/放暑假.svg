<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Pool Water Gradient -->
    <linearGradient id="poolWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Slide Gradient -->
    <linearGradient id="slideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Beach Ball Gradient 1 -->
    <linearGradient id="ballRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    
    <!-- Beach Ball Gradient 2 -->
    <linearGradient id="ballYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Elements / Sun -->
  <circle cx="190" cy="60" r="45" fill="url(#sunGlow)"/>
  <circle cx="190" cy="60" r="22" fill="#fef08a"/>

  <!-- Palm Tree silhouette / accent left -->
  <path d="M 25 180 Q 28 130 15 90" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 15 90 Q 0 80 -10 90 M 15 90 Q 5 70 -5 65 M 15 90 Q 25 70 35 60 M 15 90 Q 30 85 40 80" stroke="#475569" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Swimming Pool Structure -->
  <!-- Pool Deck -->
  <path d="M 20 140 L 220 140 L 220 210 Q 220 220 210 220 L 30 220 Q 20 220 20 210 Z" fill="#0f172a" opacity="0.4"/>
  <!-- Pool Inner Edge / Border -->
  <rect x="35" y="130" width="170" height="85" rx="16" fill="#f8fafc" filter="url(#softShadow)"/>
  <!-- Pool Water Area -->
  <rect x="45" y="140" width="150" height="65" rx="10" fill="url(#poolWater)"/>

  <!-- Water Ripple Details -->
  <path d="M 60 160 Q 75 155 90 160 T 120 160" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 130 180 Q 145 175 160 180 T 190 180" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 70 190 Q 80 185 90 190" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- ACTION-PACKED MAIN SUBJECT: Water Slide & Character jumping in -->
  <!-- Water Slide Support & Structure -->
  <path d="M 150 70 L 150 145" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M 170 85 L 170 145" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Curved Water Slide -->
  <path d="M 110 65 Q 160 65 170 95 Q 180 135 150 150" stroke="url(#slideGrad)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#softShadow)"/>
  <path d="M 110 65 Q 160 65 170 95 Q 180 135 150 150" stroke="#f472b6" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Action Character flying off slide into pool -->
  <!-- Splash / Motion trail -->
  <path d="M 125 130 Q 110 140 95 150" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round" fill="none"/>
  
  <!-- Character Head & Body (Joyful Summer Vibe) -->
  <g transform="translate(105, 120) rotate(-25)">
    <!-- Swim Trunks -->
    <rect x="-6" y="2" width="16" height="12" rx="4" fill="#10b981"/>
    <!-- Body / Torso -->
    <path d="M -8 -8 C -8 -15 10 -15 10 -8 L 12 4 C 12 8 -8 8 -8 4 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="1" cy="-18" r="8" fill="#fcd34d"/>
    <!-- Hair / Goggles -->
    <path d="M -7 -20 C -2 -24 6 -24 9 -20" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="-3" y="-19" width="8" height="3" rx="1.5" fill="#38bdf8"/>
    <!-- Arms spread out with joy -->
    <path d="M -6 -10 L -16 -18" stroke="#fcd34d" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 6 -10 L 16 -5" stroke="#fcd34d" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M -4 14 L -8 22" stroke="#fcd34d" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 4 14 L 10 24" stroke="#fcd34d" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Water Splash Effect on impact -->
  <path d="M 75 160 Q 80 140 85 155 Q 90 135 95 160" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="70" cy="150" r="2.5" fill="#38bdf8"/>
  <circle cx="95" cy="145" r="3" fill="#38bdf8"/>
  <circle cx="85" cy="138" r="2" fill="#ffffff"/>

  <!-- Summer Props: Floating Beach Ball in Pool -->
  <g transform="translate(60, 175)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="14" fill="url(#ballRed)"/>
    <!-- Ball Segments -->
    <path d="M 0 -14 C 6 -6 6 6 0 14 C -6 6 -6 -6 0 -14" fill="url(#ballYellow)"/>
    <path d="M -14 0 C -6 6 6 6 14 0 C 6 -6 -6 -6 -14 0" fill="#ffffff"/>
  </g>

  <!-- Summer Props: Floating Drink / Flamingo Float ring alternative (Cute Floatie) -->
  <g transform="translate(165, 170)" filter="url(#softShadow)">
    <!-- Inner ring shadow/depth -->
    <ellipse cx="0" cy="4" rx="16" ry="10" fill="#0284c7" opacity="0.3"/>
    <!-- Outer Pink Float -->
    <ellipse cx="0" cy="0" rx="16" ry="10" fill="#f43f5e"/>
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="url(#poolWater)"/>
    <!-- White stripes on float -->
    <path d="M -12 -3 Q -10 3 -8 -2" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 8 -3 Q 10 3 12 -2" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Little duck head on float -->
    <circle cx="-16" cy="-6" r="5" fill="#facc15"/>
    <path d="M -21 -6 L -17 -4 L -17 -8 Z" fill="#fb923c"/>
  </g>

  <!-- Foreground Atmospheric Leaf / Branch Framing Top-Left -->
  <path d="M 0 0 Q 30 10 50 0" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 15 5 Q 25 25 10 35" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 35 3 Q 45 20 35 30" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Bright Star / Sparkles for joyful atmosphere -->
  <path d="M 45 75 L 47 82 L 54 84 L 47 86 L 45 93 L 43 86 L 36 84 L 43 82 Z" fill="#fef08a" opacity="0.8"/>
  <path d="M 115 45 L 116 49 L 120 50 L 116 51 L 115 55 L 114 51 L 110 50 L 114 49 Z" fill="#fef08a" opacity="0.9"/>
  <path d="M 195 125 L 196 128 L 199 129 L 196 130 L 195 133 L 194 130 L 191 129 L 194 128 Z" fill="#fef08a" opacity="0.7"/>

</svg>