<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Rainbow Colors Gradient -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#facc15" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Magic Light Burst Gradient -->
    <radialGradient id="burstGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Frame Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Plant Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Stars & Sparkles -->
  <g fill="#cbd5e1" opacity="0.6">
    <circle cx="35" cy="45" r="1.5" />
    <circle cx="205" cy="35" r="1" />
    <circle cx="215" cy="95" r="1.5" />
    <circle cx="25" cy="115" r="1" />
  </g>

  <!-- Distant Mountains / Hills (Environment Depth) -->
  <path d="M0 170 Q 60 140 120 160 T 240 150 L 240 240 L 0 240 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M0 185 Q 90 160 150 180 T 240 170 L 240 240 L 0 240 Z" fill="#1e293b"/>

  <!-- Magical / Emerging Rainbow (The Core Visual Representation of "Appearing") -->
  <g transform="translate(120, 160)">
    <!-- Outer Glow Burst -->
    <circle cx="0" cy="0" r="90" fill="url(#burstGlow)" />

    <!-- Rainbow Arcs (Appearing dynamically from clouds/sky) -->
    <ellipse cx="0" cy="20" rx="85" ry="55" fill="none" stroke="url(#rainbowGrad)" stroke-width="6" stroke-dasharray="320 120" stroke-dashoffset="40" stroke-linecap="round" />
    <ellipse cx="0" cy="20" rx="73" ry="47" fill="none" stroke="#fbcfe8" stroke-width="3" opacity="0.7" />
  </g>

  <!-- Fluffy Atmospheric Clouds (Framing the Rainbow) -->
  <!-- Left Cloud -->
  <g fill="#334155" opacity="0.9">
    <circle cx="30" cy="155" r="22" />
    <circle cx="50" cy="145" r="28" />
    <circle cx="75" cy="155" r="20" />
    <rect x="30" y="155" width="45" height="25" rx="10" />
  </g>
  <!-- Right Cloud -->
  <g fill="#334155" opacity="0.9">
    <circle cx="185" cy="140" r="25" />
    <circle cx="205" cy="150" r="20" />
    <circle cx="165" cy="150" r="18" />
    <rect x="165" y="150" width="40" height="20" rx="10" />
  </g>

  <!-- Foreground Interior Frame (Window / Balcony Edge giving Tangible Context) -->
  <!-- Window Sill -->
  <path d="M 0 215 L 240 215 L 240 240 L 0 240 Z" fill="#0f172a" />
  <rect x="0" y="210" width="240" height="6" rx="3" fill="#334155" />
  <rect x="0" y="215" width="240" height="3" fill="#020617" />

  <!-- Potted Plant on the Windowsill (Adds realism, life, and scale) -->
  <g transform="translate(195, 175)">
    <!-- Pot -->
    <path d="M 5 25 L 25 25 L 22 42 L 8 42 Z" fill="#f43f5e" />
    <ellipse cx="15" cy="25" rx="10" ry="3" fill="#fb7185" />
    <!-- Stems & Leaves -->
    <path d="M 15 25 Q 10 10 2 12" fill="none" stroke="url(#leafGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 15 25 Q 20 5 28 8" fill="none" stroke="url(#leafGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 15 25 Q 15 2 15 -2" fill="none" stroke="url(#leafGrad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Leaf Blobs -->
    <circle cx="2" cy="12" r="5" fill="#34d399" />
    <circle cx="28" cy="8" r="6" fill="#10b981" />
    <circle cx="15" cy="-2" r="7" fill="#059669" />
  </g>

  <!-- Action Sparkles / Magic Particles around the Rainbow -->
  <g fill="#fbbf24">
    <!-- Star sparkle 1 -->
    <path d="M 75 90 Q 75 98 67 98 Q 75 98 75 106 Q 75 98 83 98 Q 75 98 75 90 Z" />
    <!-- Star sparkle 2 -->
    <path d="M 165 75 Q 165 81 159 81 Q 165 81 165 87 Q 165 81 171 81 Q 165 81 165 75 Z" />
    <!-- Glowing dots -->
    <circle cx="120" cy="105" r="3" fill="#fef08a" />
    <circle cx="95" cy="120" r="2" fill="#fef08a" />
    <circle cx="145" cy="115" r="2.5" fill="#fef08a" />
  </g>

  <!-- Cute little glowing shooting star / magical appearance effect -->
  <g transform="translate(140, 75) rotate(-25)">
    <path d="M 0 0 L 30 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="0" cy="0" r="2.5" fill="#bae6fd" />
  </g>

  <!-- Vignette / Soft Rim Overlay for App UI Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>