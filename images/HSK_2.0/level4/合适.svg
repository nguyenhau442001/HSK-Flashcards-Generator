<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Spotlight Glow -->
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Mirror Gold Frame Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Perfect Jacket Gradient (Emerald/Teal for harmony) -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Too Big Jacket Gradient (Red/Orange - mismatch) -->
    <linearGradient id="bigJacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Boutique Environment & Props -->
  <!-- Wooden Floor -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />

  <!-- Background Clothing Racks & Hangers -->
  <g opacity="0.3" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Left Rack -->
    <path d="M 30 110 L 80 110" />
    <path d="M 55 110 L 55 140" />
    <path d="M 40 125 Q 55 115 70 125" />
    
    <!-- Right Rack -->
    <path d="M 160 110 L 210 110" />
    <path d="M 185 110 L 185 140" />
    <path d="M 170 125 Q 185 115 200 125" />
  </g>

  <!-- Ambient Bokeh / Light Orbs -->
  <circle cx="40" cy="60" r="3" fill="#fbbf24" opacity="0.6" />
  <circle cx="200" cy="50" r="4" fill="#38bdf8" opacity="0.4" />
  <circle cx="215" cy="130" r="2.5" fill="#f43f5e" opacity="0.5" />
  <circle cx="25" cy="150" r="3.5" fill="#34d399" opacity="0.5" />

  <!-- Full-Length Fitting Mirror -->
  <g filter="url(#shadow)">
    <!-- Mirror Outer Stand/Base -->
    <ellipse cx="120" cy="200" rx="45" ry="10" fill="#0f172a" />
    <path d="M 105 195 L 120 185 L 135 195" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mirror Frame (Pill Shape) -->
    <rect x="75" y="25" width="90" height="165" rx="45" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="4" />
    
    <!-- Mirror Glass Surface -->
    <rect x="81" y="31" width="78" height="153" rx="39" fill="#0f172a" />
    <!-- Mirror Reflection Gradient & Sheen -->
    <rect x="81" y="31" width="78" height="153" rx="39" fill="url(#spotlight)" opacity="0.8" />
    <path d="M 95 31 L 115 31 L 95 184 L 85 184 Z" fill="#ffffff" opacity="0.05" />
  </g>

  <!-- CHARACTER & OUTFIT (The Perfect Fit Scene) -->
  <g id="character" filter="url(#shadow)">
    <!-- Character Body / Pose Base (Standing in mirror view) -->
    <!-- Head/Hair -->
    <circle cx="120" cy="72" r="18" fill="#334155" />
    <path d="M 102 72 Q 102 54 120 54 Q 138 54 138 72 Q 135 78 120 76 Q 105 78 102 72 Z" fill="#1e293b" />
    <!-- Face / Skin -->
    <circle cx="120" cy="74" r="13" fill="#fed7aa" />
    <!-- Cheeks (Happy/Satisfied) -->
    <circle cx="113" cy="77" r="2.5" fill="#f43f5e" opacity="0.4" />
    <circle cx="127" cy="77" r="2.5" fill="#f43f5e" opacity="0.4" />
    <!-- Smiling Eyes -->
    <path d="M 114 71 Q 116 69 118 71" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 122 71 Q 124 69 126 71" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="116" y="85" width="8" height="8" fill="#fed7aa" />

    <!-- THE PERFECT JACKET (Fitted & Stylish Emerald Green) -->
    <g id="perfect-jacket">
      <!-- Jacket Base & Torso -->
      <path d="M 98 135 L 104 93 L 136 93 L 142 135 L 130 142 L 120 137 L 110 142 Z" fill="url(#jacketGrad)" />
      
      <!-- Jacket Lapels / Collar -->
      <path d="M 112 93 L 120 115 L 128 93" fill="none" stroke="#065f46" stroke-width="2" stroke-linecap="round" />
      <line x1="120" y1="115" x2="120" y2="137" stroke="#065f46" stroke-width="1.5" />
      
      <!-- Inner Shirt (White) -->
      <path d="M 116 93 L 120 105 L 124 93 Z" fill="#f8fafc" />

      <!-- Left Arm & Sleeve (Naturally posed, perfectly proportioned) -->
      <path d="M 100 96 L 86 122 L 95 126 L 104 105 Z" fill="url(#jacketGrad)" />
      <!-- Left Hand -->
      <circle cx="91" cy="129" r="4" fill="#fed7aa" />

      <!-- Right Arm & Sleeve (Slightly raised in approval thumbs up) -->
      <path d="M 140 96 L 154 116 L 147 123 L 136 104 Z" fill="url(#jacketGrad)" />
      <!-- Right Hand & Thumb Up -->
      <circle cx="157" cy="116" r="4" fill="#fed7aa" />
      <path d="M 157 110 L 159 104 L 163 107 L 160 113" fill="#fed7aa" />
    </g>

    <!-- Pants -->
    <rect x="108" y="137" width="10" height="42" fill="#1e293b" />
    <rect x="122" y="137" width="10" height="42" fill="#1e293b" />
    <!-- Shoes -->
    <ellipse cx="111" cy="180" rx="7" ry="3" fill="#0f172a" />
    <ellipse cx="129" cy="180" rx="7" ry="3" fill="#0f172a" />
  </g>

  <!-- FOREGROUND PROPS / CONTRAST ELEMENTS (Showing "Suitability") -->
  <!-- Mismatched / Too Big Jacket on a Hanger to the side (Visual Context for "Not suitable") -->
  <g transform="translate(25, 100) scale(0.65)" opacity="0.85" filter="url(#shadow)">
    <!-- Hanger -->
    <path d="M 20 20 L 50 10 L 80 20 Z" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 50 10 Q 50 2 45 2" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    
    <!-- Oversized Comically Large Jacket -->
    <path d="M 10 30 L 30 20 L 70 20 L 90 30 L 105 85 L 75 95 L 50 85 L 25 95 L -5 85 Z" fill="url(#bigJacketGrad)" />
    <!-- Oversized Tag -->
    <rect x="42" y="30" width="16" height="12" rx="2" fill="#fef08a" />
    <line x1="46" y1="34" x2="54" y2="34" stroke="#ca8a04" stroke-width="1.5" />
    <line x1="46" y1="38" x2="51" y2="38" stroke="#ca8a04" stroke-width="1.5" />
  </g>

  <!-- ACTION & FEEDBACK ELEMENTS (Sparkles of Perfect Match) -->
  <g filter="url(#glow)">
    <!-- Top-Right Sparkle -->
    <path d="M 175 55 Q 175 65 185 65 Q 175 65 175 75 Q 175 65 165 65 Q 175 65 175 55 Z" fill="#38bdf8" />
    <!-- Mid-Left Sparkle -->
    <path d="M 65 95 Q 65 101 71 101 Q 65 101 65 107 Q 65 101 59 101 Q 65 101 65 95 Z" fill="#fbbf24" />
    <!-- Checkmark Badge floating near mirror (Visual reinforcement of "He Shi / Suitable") -->
    <g transform="translate(148, 45)">
      <circle cx="12" cy="12" r="14" fill="#10b981" />
      <circle cx="12" cy="12" r="14" fill="none" stroke="#ffffff" stroke-width="2" />
      <!-- Checkmark -->
      <path d="M 6 12 L 10 16 L 18 8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Subtle floor reflection of the mirror stand -->
  <ellipse cx="120" cy="202" rx="35" ry="4" fill="#38bdf8" opacity="0.15" />
</svg>