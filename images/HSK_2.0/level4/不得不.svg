<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Warm Amber Glow (Luggage/Travel feel) -->
    <linearGradient id="luggageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Umbrella Gradient -->
    <linearGradient id="umbrellaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment (Travel sign, window/door frame hints) -->
  <g opacity="0.15">
    <!-- Tourism Poster Frame on wall -->
    <rect x="150" y="30" width="60" height="45" rx="4" fill="#38bdf8"/>
    <!-- Palm tree silhouette in poster -->
    <path d="M180 55 L180 65 M180 55 C175 50 170 52 168 50 M180 53 C185 48 190 50 192 48" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Directional Arrow Post -->
    <path d="M35 150 L35 220" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 160 L35 150 L50 160" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Heavy Rain Streaks (Atmospheric Depth) -->
  <g opacity="0.6">
    <line x1="40" y1="10" x2="20" y2="70" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="80" y1="20" x2="60" y2="80" stroke="url(#rainGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="5" x2="100" y2="65" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="160" y1="30" x2="140" y2="90" stroke="url(#rainGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="15" x2="180" y2="75" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>

    <line x1="20" y1="90" x2="0" y2="150" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="60" y1="100" x2="40" y2="160" stroke="url(#rainGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="85" x2="80" y2="145" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="140" y1="110" x2="120" y2="170" stroke="url(#rainGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="180" y1="95" x2="160" y2="155" stroke="url(#rainGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="220" y1="80" x2="200" y2="140" stroke="url(#rainGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ground Surface with Puddles & Reflections -->
  <ellipse cx="120" cy="210" rx="100" ry="20" fill="#090d16" opacity="0.8"/>
  
  <!-- Puddle 1 (Reflecting Amber/Pink) -->
  <ellipse cx="90" cy="215" rx="35" ry="8" fill="#38bdf8" opacity="0.2"/>
  <ellipse cx="160" cy="212" rx="25" ry="6" fill="#fbbf24" opacity="0.15"/>

  <!-- MAIN SUBJECT: Packed Travel Luggage (Forced to stay / Cancelled trip context) -->
  <g filter="url(#shadow)" transform="translate(10, 10)">
    <!-- Suitcase Body -->
    <rect x="75" y="100" width="65" height="85" rx="12" fill="url(#luggageGrad)"/>
    <!-- Suitcase Details / Ribs -->
    <rect x="85" y="110" width="45" height="65" rx="6" fill="none" stroke="#b45309" stroke-width="3" opacity="0.5"/>
    <line x1="75" y1="130" x2="140" y2="130" stroke="#b45309" stroke-width="3" opacity="0.4"/>
    <!-- Handle -->
    <path d="M97 100 L97 90 C97 85 118 85 118 90 L118 100" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <!-- Wheels -->
    <rect x="85" y="185" width="10" height="6" rx="3" fill="#334155"/>
    <rect x="120" y="185" width="10" height="6" rx="3" fill="#334155"/>
    <!-- Travel Stickers (Showing it's ready for a trip) -->
    <rect x="88" y="145" width="18" height="14" rx="2" fill="#10b981" transform="rotate(-10 97 152)"/>
    <circle cx="122" cy="155" r="8" fill="#ef4444"/>
  </g>

  <!-- Secondary Subject: Ticket / Boarding Pass marked with 'X' / Cancelled -->
  <g filter="url(#shadow)" transform="translate(45, 130) rotate(-15)">
    <rect x="0" y="0" width="50" height="30" rx="4" fill="#f8fafc"/>
    <!-- Ticket perforation line -->
    <line x1="38" y1="0" x2="38" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Barcode simulation -->
    <rect x="8" y="18" width="22" height="6" fill="#334155"/>
    <!-- Red cancellation cross overlay -->
    <path d="M12 8 L28 22 M28 8 L12 22" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Open Red Umbrella Shielding the Luggage (Forced to stay indoors/under shelter) -->
  <g filter="url(#shadow)">
    <!-- Umbrella Canopy -->
    <path d="M 40 100 Q 120 40 200 100 Q 160 85 120 100 Q 80 85 40 100 Z" fill="url(#umbrellaGrad)"/>
    <path d="M 120 70 L 120 160" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <!-- Umbrella handle curved tip -->
    <path d="M 120 160 C 120 170 110 170 110 162" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <!-- Umbrella Segments Highlights -->
    <path d="M120 70 Q160 85 200 100" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.6"/>
    <path d="M120 70 Q80 85 40 100" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Foreground Rain Splashes (Adding dynamic action) -->
  <g opacity="0.8">
    <ellipse cx="60" cy="208" rx="6" ry="2" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="170" cy="214" rx="8" ry="2.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="115" cy="218" rx="5" ry="1.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Ambient Glow & Highlights -->
  <circle cx="120" cy="40" r="50" fill="#38bdf8" opacity="0.05" filter="blur(20px)"/>
</svg>