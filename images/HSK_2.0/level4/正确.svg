<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="150" width="200" height="70" rx="10" fill="#334155"/>
  
  <!-- Paper Sheet -->
  <rect x="60" y="70" width="120" height="150" rx="5" fill="#f8fafc"/>
  
  <!-- Lines on paper -->
  <line x1="80" y1="90" x2="160" y2="90" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="110" x2="160" y2="110" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="130" x2="160" y2="130" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The "Correct" Mark (Stylized Checkmark) -->
  <path d="M90 160 L110 180 L150 120" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Pencil -->
  <path d="M170 180 L210 140 L200 130 L160 170 Z" fill="#fbbf24"/>
  <path d="M160 170 L150 180 L160 190 Z" fill="#475569"/>
  <path d="M205 135 L215 145" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="50" r="8" fill="#ec4899" opacity="0.6"/>
  <circle cx="200" cy="40" r="12" fill="#38bdf8" opacity="0.4"/>
  <path d="M30 190 L50 170" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
</svg>