<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Warm Lamp Light Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Cough Wave / Air Swirl Gradients -->
    <linearGradient id="coughWaveGrad1" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="coughWaveGrad2" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Character Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Tea Mug Gradient -->
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Ambient Room Elements / Environment Context -->
  <!-- Cozy wall shelf back-drop -->
  <rect x="25" y="185" width="190" height="6" rx="3" fill="#334155"/>
  
  <!-- Medicine Bottle on shelf -->
  <rect x="38" y="155" width="22" height="30" rx="4" fill="#10b981" filter="url(#shadow)"/>
  <rect x="42" y="150" width="14" height="6" rx="2" fill="#047857"/>
  <rect x="42" y="163" width="14" height="10" rx="2" fill="#ffffff" opacity="0.9"/>
  <!-- Red Cross / medical symbol hint -->
  <path d="M47 167 h4 v-3 h3 v3 h3 v3 h-3 v3 h-3 v-3 h-4 z" fill="#ef4444"/>

  <!-- Hot Tea Mug with steam -->
  <g transform="translate(160, 155)">
    <!-- Mug Body -->
    <path d="M 6 0 L 24 0 C 27 0, 29 2, 29 5 L 27 23 C 27 26, 25 28, 22 28 L 8 28 C 5 28, 3 26, 3 23 L 1 5 C 1 2, 3 0, 6 0 Z" fill="url(#mugGrad)" filter="url(#shadow)"/>
    <!-- Mug Handle -->
    <path d="M 27 6 C 33 6, 35 12, 33 18 C 32 21, 29 23, 27 22" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <!-- Tea liquid viewable top -->
    <ellipse cx="15" cy="2" rx="9" ry="2" fill="#b45309"/>
    <!-- Rising Steam Swirls -->
    <path d="M 10 -4 C 13 -10, 8 -15, 12 -20" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 20 -6 C 17 -12, 22 -17, 18 -22" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Lamp overhead glow -->
  <circle cx="120" cy="-20" r="140" fill="url(#lampGlow)"/>

  <!-- Bed/Pillow prop behind character -->
  <path d="M 60 160 L 180 160 C 190 160, 195 165, 190 175 L 175 205 C 170 215, 160 215, 150 215 L 90 215 C 80 215, 70 215, 65 205 L 50 175 C 45 165, 50 160, 60 160 Z" fill="#334155" opacity="0.6"/>
  <!-- Cozy Pillow -->
  <path d="M 70 145 C 70 130, 90 120, 120 120 C 150 120, 170 130, 170 145 C 170 160, 150 165, 120 165 C 90 165, 70 160, 70 145 Z" fill="#475569" filter="url(#shadow)"/>

  <!-- MAIN SUBJECT: Sick Character coughing -->
  <g id="character-coughing">
    <!-- Cozy Blanket Wrapped Around Shoulders -->
    <path d="M 60 220 C 55 190, 75 160, 100 155 C 120 150, 140 150, 155 155 C 180 160, 190 190, 180 220 Z" fill="#f59e0b" filter="url(#shadow)"/>
    <!-- Blanket fold/collar detail -->
    <path d="M 65 175 C 90 155, 160 155, 180 175 C 175 190, 165 215, 120 215 C 75 215, 65 190, 65 175 Z" fill="#d97706"/>
    <path d="M 85 167 C 105 160, 145 160, 165 167" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

    <!-- Hunched Torso / Hoodie -->
    <path d="M 85 170 C 85 155, 100 145, 120 145 C 140 145, 155 155, 155 170 Z" fill="#0284c7"/>

    <!-- Raised Hand / Arm covering mouth (classic cough posture) -->
    <path d="M 140 170 C 145 150, 135 130, 120 130 C 110 130, 105 138, 105 145" fill="none" stroke="#fdba74" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
    <!-- Sleeve cuff -->
    <path d="M 125 130 C 130 133, 138 142, 140 150" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>

    <!-- Head (Leaned forward into the arm/cough) -->
    <g transform="translate(115, 125) rotate(15)">
      <!-- Hair Base -->
      <circle cx="0" cy="-5" r="28" fill="#1e293b"/>
      
      <!-- Face Skin -->
      <circle cx="5" cy="2" r="24" fill="url(#skinGrad)"/>
      <circle cx="5" cy="2" r="24" fill="#ef4444" opacity="0.15"/> <!-- Feverish flush -->

      <!-- Hair Style / Fringe -->
      <path d="M -18 -12 C -10 -25, 15 -25, 23 -10 C 25 -5, 20 2, 20 2 C 20 2, 10 -8, -5 -8 C -15 -8, -18 -12, -18 -12 Z" fill="#0f172a"/>
      
      <!-- Closed Sick Eyes (Straining/Coughing arc) -->
      <path d="M -2 1 C 2 -2, 8 -2, 12 1" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 16 3 C 20 0, 24 0, 27 3" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/> <!-- Eyebrow lowered in discomfort -->

      <!-- Rosy Sick Cheeks -->
      <ellipse cx="14" cy="10" rx="5" ry="3" fill="#f87171" opacity="0.6"/>

      <!-- Open Coughing Mouth -->
      <path d="M 18 14 C 22 14, 25 17, 22 22 C 19 25, 14 23, 15 19 Z" fill="#7f1d1d"/>
      <!-- Tongue hint -->
      <path d="M 19 20 C 21 20, 22 22, 20 23 C 18 24, 17 22, 19 20 Z" fill="#ef4444"/>
    </g>

    <!-- Head Back Hair Volume -->
    <circle cx="95" cy="115" r="18" fill="#0f172a"/>
  </g>

  <!-- DYNAMIC ACTION PROP: The Cough (Expelled Air, Soundwaves & Microdroplets) -->
  <g id="cough-burst" filter="url(#shadow)">
    <!-- Main expansive explosive cough wave 1 -->
    <path d="M 148 123 C 175 120, 205 130, 225 110 C 235 100, 230 85, 215 80 C 195 73, 175 95, 148 110 Z" fill="url(#coughWaveGrad1)"/>

    <!-- Secondary billowing cough gust -->
    <path d="M 145 135 C 180 145, 200 160, 218 145 C 228 138, 220 120, 200 115 C 175 110, 160 125, 145 135 Z" fill="url(#coughWaveGrad2)"/>

    <!-- Sound/Air Ripple arcs -->
    <path d="M 158 115 C 170 110, 185 112, 195 122" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 170 102 C 190 98, 205 108, 215 120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 185 90 C 205 88, 218 98, 225 110" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

    <!-- Expelled Micro-Droplets (Visualizing the 'ho' action vividly) -->
    <circle cx="165" cy="120" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="182" cy="132" r="3" fill="#38bdf8" opacity="0.7"/>
    <circle cx="198" cy="110" r="5" fill="#38bdf8" opacity="0.6"/>
    <circle cx="212" cy="125" r="2.5" fill="#a78bfa" opacity="0.8"/>
    <circle cx="220" cy="100" r="3.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="175" cy="100" r="2" fill="#a78bfa" opacity="0.9"/>
    <circle cx="190" cy="85" r="4" fill="#38bdf8" opacity="0.5"/>
    <circle cx="205" cy="140" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="228" cy="115" r="1.5" fill="#a78bfa" opacity="0.6"/>
  </g>

  <!-- Atmospheric Lighting Overlay / Vignette Frame -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>