<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Ambient Glow behind Sweater -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Wool Texture Pattern -->
    <pattern id="wool-knit" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M4 0 Q8 4 4 8 Q0 4 4 0 Z" fill="#e2e8f0" opacity="0.15" />
      <path d="M12 8 Q16 12 12 16 Q8 12 12 8 Z" fill="#e2e8f0" opacity="0.15" />
    </pattern>

    <!-- Soft Drop Shadow -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Glow & Table Surface -->
  <circle cx="120" cy="120" r="90" fill="url(#glow)" />
  <ellipse cx="120" cy="195" rx="85" ry="15" fill="#090d16" opacity="0.6" />

  <!-- SCENE ELEMENTS: Knitting Basket & Yarn Props -->
  <!-- Wooden Basket Behind -->
  <g transform="translate(45, 120)">
    <path d="M-15 45 L-25 15 L35 15 L25 45 Z" fill="#b45309" opacity="0.7" />
    <ellipse cx="5" cy="15" rx="30" ry="8" fill="#d97706" opacity="0.7" />
  </g>

  <!-- Ball of Wool (Secondary Prop) -->
  <g transform="translate(170, 155)" filter="url(#drop-shadow)">
    <circle cx="0" cy="0" r="22" fill="#38bdf8" />
    <!-- Yarn wrap lines -->
    <path d="M-18 -5 Q0 -22 18 -5" stroke="#bae6fd" stroke-width="3" fill="none" opacity="0.8" />
    <path d="M-15 8 Q0 -10 15 8" stroke="#bae6fd" stroke-width="3" fill="none" opacity="0.8" />
    <path d="M-18 10 Q0 22 18 10" stroke="#bae6fd" stroke-width="3" fill="none" opacity="0.8" />
    <!-- Loose Thread -->
    <path d="M15 15 Q30 25 10 40 T-40 25" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- MAIN SUBJECT: Cozy Woolen Sweater (Lông cừu) -->
  <g filter="url(#drop-shadow)">
    <!-- Sweater Body -->
    <path d="M 75,70 
             Q 120,55 165,70 
             L 195,95 
             Q 210,110 195,120 
             L 175,110 
             L 175,200 
             Q 175,208 167,208 
             L 73,208 
             Q 65,208 65,200 
             L 65,110 
             L 45,120 
             Q 30,110 45,95 Z" 
          fill="#fbbf24" />

    <!-- Sweater Ribbed Texture overlay / Knit Pattern -->
    <path d="M 75,70 
             Q 120,55 165,70 
             L 195,95 
             Q 210,110 195,120 
             L 175,110 
             L 175,200 
             Q 175,208 167,208 
             L 73,208 
             Q 65,208 65,200 
             L 65,110 
             L 45,120 
             Q 30,110 45,95 Z" 
          fill="url(#wool-knit)" />

    <!-- Collar (Ribbed high neck) -->
    <path d="M 95,67 
             Q 120,82 145,67 
             Q 145,52 120,48 
             Q 95,52 95,67 Z" 
          fill="#f59e0b" />
    <path d="M 98,66 Q 120,78 142,66" stroke="#d97706" stroke-width="3" fill="none" />

    <!-- Decorative Nordic/Warm Pattern on Chest -->
    <g fill="#f43f5e" opacity="0.9">
      <polygon points="120,95 126,105 114,105" />
      <polygon points="100,95 106,105 94,105" />
      <polygon points="140,95 146,105 134,105" />
      <circle cx="120" cy="115" r="4" fill="#38bdf8" />
      <circle cx="95" cy="115" r="4" fill="#38bdf8" />
      <circle cx="145" cy="115" r="4" fill="#38bdf8" />
    </g>

    <!-- Fluffy Wool Tufts / Stray Fibers (Visualizing 'Lông') -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <!-- Left Shoulder tufts -->
      <path d="M 72,72 Q 68,66 65,70" fill="none" />
      <path d="M 85,62 Q 83,55 88,58" fill="none" />
      <!-- Right Shoulder tufts -->
      <path d="M 168,72 Q 172,66 175,70" fill="none" />
      <path d="M 155,62 Q 157,55 152,58" fill="none" />
      <!-- Collar tufts -->
      <path d="M 120,45 Q 123,38 126,44" fill="none" />
      <!-- Body tufts -->
      <path d="M 62,130 Q 56,128 60,135" fill="none" />
      <path d="M 178,140 Q 184,138 180,145" fill="none" />
      <path d="M 100,206 Q 105,214 108,206" fill="none" />
      <path d="M 140,206 Q 135,214 132,206" fill="none" />
    </g>
  </g>

  <!-- Knitting Needles crossing behind/through sweater -->
  <g filter="url(#drop-shadow)">
    <!-- Needle 1 -->
    <line x1="30" y1="40" x2="200" y2="170" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="38" r="5" fill="#ec4899" />
    
    <!-- Needle 2 -->
    <line x1="210" y1="40" x2="40" y2="170" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <circle cx="212" cy="38" r="5" fill="#ec4899" />
  </g>

  <!-- Dynamic Sparkles / Soft Warm Highlights -->
  <g fill="#fef08a">
    <circle cx="45" cy="85" r="2" opacity="0.8" />
    <circle cx="190" cy="85" r="2.5" opacity="0.9" />
    <circle cx="120" cy="35" r="1.5" opacity="0.7" />
    <path d="M 165,115 Q 170,110 175,115 Q 170,120 165,115 Z" opacity="0.6" />
    <path d="M 70,150 Q 74,146 78,150 Q 74,154 70,150 Z" opacity="0.6" />
  </g>
</svg>