<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGradient)" />
  <rect width="240" height="240" rx="24" fill="url(#spotlight)" />

  <!-- Studio Floor / Environment -->
  <ellipse cx="120" cy="195" rx="80" ry="20" fill="#090d16" />
  <ellipse cx="120" cy="192" rx="70" ry="15" fill="#131c31" />

  <!-- Background Workshop Details (Easels, frames hinting at crafting/making) -->
  <path d="M50 140 L70 90 L85 95 L65 145 Z" fill="#334155" opacity="0.4" />
  <path d="M190 135 L170 85 L155 90 L175 140 Z" fill="#334155" opacity="0.4" />

  <!-- MAIN SUBJECT: The Ceramic Pot with a Flaw/Crack -->
  <!-- Pot Shadow -->
  <ellipse cx="120" cy="172" rx="32" ry="8" fill="#020617" opacity="0.6" />

  <!-- Clay Pot Base & Body (Terracotta/Warm Amber Tone) -->
  <g id="clay-pot">
    <!-- Lower body shadow -->
    <path d="M92 140 C92 170 148 170 148 140 Z" fill="#b45309" />
    
    <!-- Main Pot Body -->
    <path d="M88 115 C75 125 75 150 92 168 C105 174 135 174 148 168 C165 150 165 125 152 115 Z" fill="#d97706" />
    
    <!-- Pot Rim/Neck -->
    <path d="M98 102 C98 98 142 98 142 102 L146 115 C146 118 94 118 94 115 Z" fill="#b45309" />
    <ellipse cx="120" cy="102" rx="22" ry="5" fill="#f59e0b" />
    <ellipse cx="120" cy="104" rx="19" ry="3" fill="#78350f" opacity="0.3" />

    <!-- Surface Highlights on Pot -->
    <path d="M96 125 C92 135 95 150 102 160" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4" />
  </g>

  <!-- THE FLAW / IMPERFECTION (Vivid orange/gold crack emitting slight tension/glow) -->
  <g id="crack-and-flaw">
    <!-- Glowing outline behind crack -->
    <path d="M125 125 L132 138 L123 145 L130 160" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" filter="url(#glow)" />
    <!-- Sharp jagged crack line -->
    <path d="M125 125 L132 138 L123 145 L130 160" stroke="#fda4af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Chipped imperfection piece falling / nearby -->
    <path d="M136 135 L142 138 L138 143 Z" fill="#b45309" />
    <path d="M136 135 L142 138 L138 143 Z" fill="#f59e0b" opacity="0.8" />
  </g>

  <!-- INSPECTION TOOLS (Highlighting the focus on the flaw) -->
  <!-- Magnifying Glass hovering over the crack -->
  <g id="magnifying-glass" transform="translate(15, -10)">
    <!-- Glass shadow -->
    <ellipse cx="118" cy="138" rx="22" ry="22" fill="#000000" opacity="0.3" />
    
    <!-- Lens outer rim -->
    <circle cx="115" cy="135" r="22" fill="#334155" />
    <!-- Lens inner glass (subtle blue tint) -->
    <circle cx="115" cy="135" r="18" fill="#38bdf8" opacity="0.25" />
    <!-- Glass reflection -->
    <path d="M102 123 C108 120 122 120 128 126" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
    
    <!-- Magnifying glass handle -->
    <path d="M98 152 L78 172 C74 176 74 182 78 186 C82 190 88 190 92 186 L112 166 Z" fill="#64748b" />
    <path d="M98 152 L78 172 C74 176 74 182 78 186 C82 190 88 190 92 186 L112 166 Z" fill="url(#bgGradient)" opacity="0.2" />
    <!-- Handle grip detail -->
    <line x1="84" y1="174" x2="89" y2="179" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="88" y1="170" x2="93" y2="175" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- WORKBENCH PROPS -->
  <!-- Measuring Caliper / Craft Tool on the table -->
  <g id="craft-tool" transform="translate(-40, 25)">
    <path d="M170 150 L195 175" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <circle cx="170" cy="150" r="4" fill="#cbd5e1" />
    <path d="M165 145 L175 140" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Ambient Sparkles / Craft particles (Adding magic/action vector feel) -->
  <circle cx="75" cy="115" r="2.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="165" cy="105" r="2" fill="#fbbf24" opacity="0.9" />
  <circle cx="145" cy="180" r="1.5" fill="#f43f5e" opacity="0.7" />
  <circle cx="65" cy="165" r="2" fill="#a855f7" opacity="0.8" />

  <!-- Focus Beam / Action Indicator (Curved bracket pointing at the flaw) -->
  <path d="M110 120 C105 130 105 140 112 148" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M152 148 C158 140 158 130 152 122" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round" fill="none" opacity="0.6" />

</svg>