<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Warm Glow for Park Lights / Atmosphere -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Flower Gradient 1 (Pink/Magenta) -->
    <linearGradient id="flowerPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Flower Gradient 2 (Sun Yellow/Amber) -->
    <linearGradient id="flowerYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Flower Gradient 3 (Sky Blue/Cyan) -->
    <linearGradient id="flowerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Grass Mound Gradients -->
    <linearGradient id="hillBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>
  <rect width="240" height="240" rx="24" fill="url(#glow)"/>

  <!-- Background Elements: Stars / Fireflies -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="35" cy="45" r="1.5"/>
    <circle cx="75" cy="25" r="2"/>
    <circle cx="130" cy="35" r="1"/>
    <circle cx="185" cy="50" r="1.5"/>
    <circle cx="215" cy="30" r="2"/>
  </g>
  <g fill="#38bdf8" opacity="0.5">
    <circle cx="55" cy="75" r="1.5"/>
    <circle cx="105" cy="55" r="2"/>
    <circle cx="160" cy="70" r="1.5"/>
  </g>

  <!-- Park Lantern Post (Left Context) -->
  <g transform="translate(18, 90)">
    <rect x="6" y="25" width="4" height="65" fill="#334155" rx="1"/>
    <rect x="2" y="85" width="12" height="6" fill="#1e293b" rx="2"/>
    <!-- Lantern Head -->
    <path d="M2 15 L14 15 L16 25 L0 25 Z" fill="#475569"/>
    <path d="M4 8 L12 8 L14 15 L2 15 Z" fill="#fbbf24"/>
    <path d="M6 3 L10 3 L12 8 L4 8 Z" fill="#334155"/>
    <!-- Glow -->
    <circle cx="8" cy="16" r="12" fill="#fbbf24" opacity="0.3" style="mix-blend-mode: screen;"/>
  </g>

  <!-- Rolling Hills & Flower Beds (Layered for depth - representing "Many") -->
  <!-- Hill Back Layer -->
  <path d="M-20 160 Q 60 110, 140 135 T 260 120 L 260 250 L -20 250 Z" fill="url(#hillBack)"/>
  
  <!-- Back Flowers Clusters -->
  <g fill="#f472b6" opacity="0.8">
    <circle cx="40" cy="125" r="3"/>
    <circle cx="50" cy="122" r="2.5"/>
    <circle cx="65" cy="128" r="3"/>
    <circle cx="110" cy="132" r="3.5"/>
    <circle cx="120" cy="129" r="2.5"/>
    <circle cx="175" cy="115" r="3"/>
    <circle cx="190" cy="118" r="3.5"/>
  </g>
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="30" cy="128" r="2.5"/>
    <circle cx="58" cy="125" r="3"/>
    <circle cx="102" cy="130" r="3"/>
    <circle cx="182" cy="113" r="2.5"/>
  </g>

  <!-- Hill Mid Layer -->
  <path d="M-20 180 Q 80 140, 170 160 T 260 150 L 260 250 L -20 250 Z" fill="url(#hillMid)"/>

  <!-- Midground Dense Flowers -->
  <!-- Blue Flowers Cluster -->
  <g>
    <circle cx="35" cy="155" r="4" fill="url(#flowerBlue)"/>
    <circle cx="45" cy="152" r="3.5" fill="url(#flowerBlue)"/>
    <circle cx="40" cy="162" r="4.5" fill="url(#flowerBlue)"/>
    <circle cx="52" cy="160" r="3.5" fill="url(#flowerBlue)"/>
  </g>
  <!-- Pink Flowers Cluster -->
  <g>
    <circle cx="85" cy="150" r="4" fill="url(#flowerPink)"/>
    <circle cx="95" cy="148" r="5" fill="url(#flowerPink)"/>
    <circle cx="102" cy="155" r="4" fill="url(#flowerPink)"/>
    <circle cx="90" cy="160" r="4.5" fill="url(#flowerPink)"/>
    <circle cx="112" cy="152" r="3.5" fill="url(#flowerPink)"/>
  </g>
  <!-- Yellow Flowers Cluster -->
  <g>
    <circle cx="145" cy="158" r="4" fill="url(#flowerYellow)"/>
    <circle cx="155" cy="155" r="4.5" fill="url(#flowerYellow)"/>
    <circle cx="162" cy="162" r="3.5" fill="url(#flowerYellow)"/>
    <circle cx="150" cy="166" r="4" fill="url(#flowerYellow)"/>
  </g>
  <g>
    <circle cx="195" cy="145" r="4" fill="url(#flowerPink)"/>
    <circle cx="205" cy="142" r="4.5" fill="url(#flowerYellow)"/>
    <circle cx="212" cy="149" r="4" fill="url(#flowerPink)"/>
  </g>

  <!-- Hill Front Layer (Lush Ground) -->
  <path d="M-20 200 Q 70 160, 160 185 T 260 175 L 260 250 L -20 250 Z" fill="url(#hillFront)"/>

  <!-- Foreground: Abundant Flora & Vibrant Detail (Massive quantity representing "许多") -->
  <!-- Individual Detailed Flowers with stems and varied colors in foreground -->
  <g>
    <!-- Flower Stem Group Left -->
    <path d="M20 220 Q 22 205, 25 195" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="25" cy="193" r="6" fill="url(#flowerPink)"/>
    <circle cx="25" cy="193" r="2" fill="#fef08a"/>

    <path d="M35 225 Q 38 208, 42 198" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="42" cy="196" r="7" fill="url(#flowerYellow)"/>
    <circle cx="42" cy="196" r="2.5" fill="#f43f5e"/>

    <path d="M52 220 Q 50 205, 48 190" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="48" cy="188" r="6" fill="url(#flowerBlue)"/>
    <circle cx="48" cy="188" r="2" fill="#fef08a"/>

    <path d="M65 230 Q 63 210, 60 196" stroke="#047857" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="193" r="8" fill="url(#flowerPink)"/>
    <circle cx="60" cy="193" r="3" fill="#fef08a"/>

    <!-- Center-Left Tulips / Blossoms -->
    <path d="M85 225 Q 88 205, 92 192" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="92" cy="189" r="7" fill="url(#flowerYellow)"/>
    <circle cx="92" cy="189" r="2.5" fill="#0284c7"/>

    <path d="M100 235 Q 102 215, 105 200" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="105" cy="197" r="8" fill="url(#flowerBlue)"/>
    <circle cx="105" cy="197" r="3" fill="#fef08a"/>

    <path d="M118 228 Q 115 210, 112 195" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="112" cy="192" r="7" fill="url(#flowerPink)"/>
    <circle cx="112" cy="192" r="2.5" fill="#fef08a"/>

    <!-- Center-Right Cluster -->
    <path d="M135 230 Q 133 212, 130 198" stroke="#047857" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="130" cy="195" r="9" fill="url(#flowerYellow)"/>
    <circle cx="130" cy="195" r="3.5" fill="#db2777"/>

    <path d="M148 225 Q 152 208, 155 194" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="155" cy="191" r="7" fill="url(#flowerPink)"/>
    <circle cx="155" cy="191" r="2.5" fill="#fef08a"/>

    <path d="M165 235 Q 163 215, 160 200" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="160" cy="197" r="8" fill="url(#flowerBlue)"/>
    <circle cx="160" cy="197" r="3" fill="#fef08a"/>

    <!-- Right Edge Cluster -->
    <path d="M185 228 Q 188 210, 192 195" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="192" cy="192" r="8" fill="url(#flowerPink)"/>
    <circle cx="192" cy="192" r="3" fill="#fef08a"/>

    <path d="M205 232 Q 203 215, 200 202" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="200" cy="199" r="7" fill="url(#flowerYellow)"/>
    <circle cx="200" cy="199" r="2.5" fill="#0284c7"/>

    <path d="M220 225 Q 222 208, 225 195" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="225" cy="192" r="7.5" fill="url(#flowerBlue)"/>
    <circle cx="225" cy="192" r="2.5" fill="#fef08a"/>
  </g>

  <!-- Extra overlapping tiny petals and dots for deep lushness ("许多" richness effect) -->
  <g fill="#fde047">
    <circle cx="75" cy="208" r="2"/>
    <circle cx="82" cy="215" r="1.5"/>
    <circle cx="125" cy="210" r="2"/>
    <circle cx="178" cy="212" r="1.5"/>
    <circle cx="185" cy="220" r="2"/>
  </g>
  <g fill="#f472b6">
    <circle cx="28" cy="212" r="2"/>
    <circle cx="140" cy="215" r="2"/>
    <circle cx="148" cy="222" r="1.5"/>
    <circle cx="210" cy="215" r="2"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="60" cy="215" r="1.5"/>
    <circle cx="110" cy="220" r="2"/>
    <circle cx="168" cy="218" r="2"/>
  </g>

  <!-- Friendly Park Bench (Context element on the right) -->
  <g transform="translate(170, 145)">
    <!-- Bench Legs -->
    <rect x="4" y="20" width="3" height="15" fill="#475569" rx="1"/>
    <rect x="27" y="20" width="3" height="15" fill="#475569" rx="1"/>
    <!-- Seat Slats -->
    <rect x="0" y="15" width="34" height="4" fill="#94a3b8" rx="1"/>
    <rect x="0" y="21" width="34" height="4" fill="#64748b" rx="1"/>
    <!-- Backrest -->
    <rect x="0" y="2" width="34" height="4" fill="#94a3b8" rx="1"/>
    <rect x="0" y="8" width="34" height="4" fill="#64748b" rx="1"/>
    <!-- Back Supports -->
    <path d="M6 6 L6 15" stroke="#475569" stroke-width="2"/>
    <path d="M28 6 L28 15" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Playful Butterfly fluttering over the flowers -->
  <g transform="translate(75, 95)">
    <!-- Wings -->
    <path d="M 0 0 Q -10 -10, -15 -2 Q -10 10, 0 5 Z" fill="#f472b6"/>
    <path d="M 0 0 Q 10 -10, 15 -2 Q 10 10, 0 5 Z" fill="#f472b6"/>
    <path d="M 0 5 Q -10 8, -12 15 Q -5 18, 0 12 Z" fill="#fbbf24"/>
    <path d="M 0 5 Q 10 8, 12 15 Q 5 18, 0 12 Z" fill="#fbbf24"/>
    <!-- Body -->
    <ellipse cx="0" cy="5" rx="1.5" ry="8" fill="#1e293b"/>
    <!-- Antennae -->
    <path d="M -1 -3 Q -4 -8, -7 -7" stroke="#1e293b" stroke-width="1" fill="none"/>
    <path d="M 1 -3 Q 4 -8, 7 -7" stroke="#1e293b" stroke-width="1" fill="none"/>
  </g>
</svg>