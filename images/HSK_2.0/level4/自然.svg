<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Distant Mountains -->
  <path d="M0 160 L40 100 L80 140 L120 90 L160 130 L200 80 L240 120 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- River/Water -->
  <path d="M0 180 C60 160, 180 200, 240 170 L240 240 L0 240 Z" fill="#0ea5e9" opacity="0.3"/>
  
  <!-- Main Subject: Tree -->
  <g transform="translate(120, 180)">
    <!-- Trunk -->
    <rect x="-8" y="-60" width="16" height="60" rx="4" fill="#92400e"/>
    <!-- Foliage -->
    <circle cx="0" cy="-70" r="35" fill="#10b981"/>
    <circle cx="-20" cy="-60" r="25" fill="#059669"/>
    <circle cx="20" cy="-60" r="25" fill="#059669"/>
    <circle cx="0" cy="-90" r="25" fill="#059669"/>
  </g>
  
  <!-- Atmospheric Details -->
  <circle cx="180" cy="50" r="20" fill="#fbbf24"/>
  <path d="M40 70 L50 60 L60 70 L50 80 Z" fill="#f59e0b" opacity="0.6"/>
  <path d="M190 130 L195 125 L200 130 L195 135 Z" fill="#ec4899" opacity="0.7"/>
  
  <!-- Ground Detail -->
  <ellipse cx="120" cy="220" rx="100" ry="20" fill="#0f172a" opacity="0.4"/>
</svg>