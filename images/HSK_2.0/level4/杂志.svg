<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Coffee Cup -->
    <path d="M160 120h40a10 10 0 0 0 10-10v-50a10 10 0 0 0-10-10h-40" fill="none" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
    <rect x="160" y="50" width="40" height="70" rx="8" fill="#f59e0b"/>
    <ellipse cx="180" cy="50" rx="20" ry="6" fill="#fbbf24"/>
    
    <!-- Magazine -->
    <rect x="20" y="20" width="120" height="150" rx="4" fill="#38bdf8"/>
    <rect x="25" y="25" width="110" height="40" rx="2" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="25" y="75" width="110" height="10" rx="1" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="25" y="90" width="80" height="10" rx="1" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="25" y="105" width="90" height="10" rx="1" fill="#ffffff" fill-opacity="0.1"/>
    <circle cx="80" cy="140" r="15" fill="#ec4899"/>
    
    <!-- Magazine Page Curl -->
    <path d="M140 20 L140 40 L120 20 Z" fill="#0f172a" fill-opacity="0.2"/>
    
    <!-- Decorative Elements -->
    <circle cx="10" cy="10" r="4" fill="#10b981"/>
    <circle cx="150" cy="160" r="6" fill="#fb923c"/>
  </g>
  
  <!-- Surface -->
