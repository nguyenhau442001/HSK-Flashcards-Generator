<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground/Environment -->
  <path d="M0 180 Q 120 200 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  <circle cx="180" cy="200" r="15" fill="#1e293b" opacity="0.3"/>
  
  <!-- The Subject: Small Bird -->
  <g transform="translate(70, 130)">
    <!-- Wing -->
    <path d="M20 30 Q 40 10 60 30 Q 40 40 20 30" fill="#64748b"/>
    <!-- Body -->
    <ellipse cx="40" cy="40" rx="35" ry="25" fill="#94a3b8"/>
    <!-- Head -->
    <circle cx="70" cy="30" r="18" fill="#94a3b8"/>
    <!-- Eye (Closed) -->
    <path d="M65 25 L 75 25" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Beak -->
    <path d="M85 30 L 95 35 L 85 40 Z" fill="#fbbf24"/>
    <!-- Tail -->
    <path d="M5 40 L -15 50 L -5 30 Z" fill="#64748b"/>
  </g>

  <!-- Contextual Props: Fallen Leaves -->
  <path d="M40 210 Q 50 190 70 200 Q 60 220 40 210" fill="#fb923c"/>
  <path d="M160 220 Q 170 200 190 210 Q 180 230 160 220" fill="#ec4899"/>
  
  <!-- Atmospheric Glow -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.05"/>
  <circle cx="70" cy="160" r="20" fill="#fbbf24" opacity="0.1" filter="blur(8px)"/>
</svg>