<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table surface -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Bowl -->
  <path d="M60 140 Q60 190 120 190 Q180 190 180 140 Z" fill="#334155"/>
  <ellipse cx="120" cy="140" rx="60" ry="15" fill="#475569"/>
  
  <!-- Food inside -->
  <circle cx="100" cy="135" r="20" fill="#fbbf24"/>
  <circle cx="140" cy="130" r="25" fill="#f59e0b"/>
  <circle cx="120" cy="120" r="18" fill="#fb923c"/>
  
  <!-- Steam/Aroma lines -->
  <path d="M100 110 Q90 80 100 60" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M120 100 Q135 70 120 40" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M140 110 Q155 80 145 50" stroke="#fb923c" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="60" r="4" fill="#10b981"/>
  <circle cx="200" cy="100" r="6" fill="#ec4899"/>
  <circle cx="180" cy="200" r="5" fill="#38bdf8"/>
  
  <!-- Chopsticks -->
  <rect x="170" y="100" width="4" height="80" rx="2" fill="#94a3b8" transform="rotate(20 170 100)"/>
  <rect x="185" y="105" width="4" height="80" rx="2" fill="#cbd5e1" transform="rotate(25 185 105)"/>
</svg>