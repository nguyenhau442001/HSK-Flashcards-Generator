<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Amber Glow Gradient -->
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Siren Blue Glow -->
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Siren Red Glow -->
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Car Body Gradient -->
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Windshield Gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Lighting & Environment Elements -->
  <!-- Street Light Glow -->
  <circle cx="40" cy="40" r="90" fill="url(#amberGlow)"/>
  <!-- Animated / Flashing Siren Glows on backdrop -->
  <circle cx="100" cy="60" r="60" fill="url(#redGlow)"/>
  <circle cx="140" cy="60" r="60" fill="url(#blueGlow)"/>

  <!-- Background City Silhouette & Street Details -->
  <g opacity="0.3">
    <!-- Far buildings -->
    <rect x="15" y="90" width="30" height="70" fill="#334155" rx="2"/>
    <rect x="50" y="70" width="45" height="90" fill="#475569" rx="2"/>
    <rect x="150" y="80" width="40" height="80" fill="#334155" rx="2"/>
    <rect x="195" y="100" width="30" height="60" fill="#475569" rx="2"/>
    <!-- Windows in background -->
    <fill color="#94a3b8">
      <rect x="22" y="100" width="6" height="8" fill="#64748b" rx="1"/>
      <rect x="33" y="100" width="6" height="8" fill="#64748b" rx="1"/>
      <rect x="60" y="85" width="8" height="10" fill="#64748b" rx="1"/>
      <rect x="75" y="85" width="8" height="10" fill="#64748b" rx="1"/>
      <rect x="60" y="105" width="8" height="10" fill="#64748b" rx="1"/>
      <rect x="75" y="105" width="8" height="10" fill="#64748b" rx="1"/>
    </fill>
  </g>

  <!-- Ground / Road Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#0f172a"/>
  <!-- Asphalt Texture / Road markings -->
  <path d="M0 160 L240 160" stroke="#334155" stroke-width="4"/>
  <!-- Dashed center lane -->
  <line x1="20" y1="200" x2="60" y2="200" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>
  <line x1="90" y1="200" x2="130" y2="200" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>
  <line x1="160" y1="200" x2="200" y2="200" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- Street Lamp Pole & Fixture -->
  <path d="M25 160 L25 50 Q25 35 40 35 L50 35" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M45 35 L55 35 L50 42 Z" fill="#94a3b8"/>
  <circle cx="50" cy="43" r="4" fill="#fbbf24" filter="url(#softGlow)"/>

  <!-- MAIN SUBJECT: Police Cruiser (Isometric-ish Side/Front View) with Action Details -->
  <g filter="url(#shadow)">
    <!-- Car Drop Shadow on Road -->
    <ellipse cx="120" cy="208" rx="85" ry="12" fill="#000000" opacity="0.6"/>

    <!-- Back Wheels -->
    <circle cx="70" cy="195" r="18" fill="#0f172a"/>
    <circle cx="70" cy="195" r="10" fill="#334155"/>
    <circle cx="70" cy="195" r="4" fill="#94a3b8"/>

    <circle cx="170" cy="195" r="18" fill="#0f172a"/>
    <circle cx="170" cy="195" r="10" fill="#334155"/>
    <circle cx="170" cy="195" r="4" fill="#94a3b8"/>

    <!-- Main Chassis / Body Lower -->
    <path d="M 40 185 
             L 45 165 
             Q 55 150 75 150 
             L 165 150 
             Q 185 150 195 165 
             L 200 185 
             Q 205 195 195 195 
             L 45 195 
             Q 35 195 40 185 Z" 
          fill="url(#carBody)" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- White Door Panel Accent (Classic Police Styling) -->
    <path d="M 90 152 L 150 152 L 155 193 L 95 193 Z" fill="#f8fafc" opacity="0.95"/>
    <path d="M 95 160 L 145 160" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Cabin / Roof / Windows -->
    <path d="M 75 150 
             L 92 120 
             Q 96 115 105 115 
             L 135 115 
             Q 144 115 148 120 
             L 165 150 Z" 
          fill="url(#carBody)" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- Windshields & Side Windows -->
    <!-- Front Windshield -->
    <path d="M 94 122 L 78 148 L 112 148 L 112 122 Z" fill="url(#glassGrad)"/>
    <!-- Rear Windshield -->
    <path d="M 146 122 L 128 148 L 162 148 L 128 122 Z" fill="url(#glassGrad)"/>
    <!-- Side Windows Divider Frame -->
    <line x1="120" y1="117" x2="120" y2="148" stroke="#1d4ed8" stroke-width="3"/>

    <!-- Headlights & Grille (Front is Right side in this vector layout, let's treat Right as Front) -->
    <!-- Front Bumper & Headlights (Right Side) -->
    <path d="M 195 170 Q 202 170 203 178 Q 202 184 195 184 Z" fill="#fbbf24" filter="url(#softGlow)"/>
    <rect x="175" y="168" width="22" height="12" rx="3" fill="#0f172a"/>
    <!-- Radiator Grille -->
    <line x1="185" y1="172" x2="195" y2="172" stroke="#94a3b8" stroke-width="2"/>
    <line x1="185" y1="176" x2="195" y2="176" stroke="#94a3b8" stroke-width="2"/>

    <!-- Taillights (Left Side) -->
    <path d="M 45 170 Q 38 170 37 178 Q 38 184 45 184 Z" fill="#ef4444" filter="url(#softGlow)"/>

    <!-- Police Roof Light Bar Assembly -->
    <!-- Light Bar Mount -->
    <rect x="110" y="108" width="20" height="7" rx="2" fill="#334155"/>
    <!-- Left Red Flasher -->
    <rect x="104" y="103" width="14" height="7" rx="3.5" fill="#ef4444" filter="url(#softGlow)"/>
    <ellipse cx="111" cy="106.5" rx="4" ry="2" fill="#fca5a5"/>
    <!-- Right Blue Flasher -->
    <rect x="122" y="103" width="14" height="7" rx="3.5" fill="#38bdf8" filter="url(#softGlow)"/>
    <ellipse cx="129" cy="106.5" rx="4" ry="2" fill="#bae6fd"/>
    <!-- Center Divider -->
    <rect x="118" y="103" width="4" height="7" fill="#64748b"/>
  </g>

  <!-- Dynamic Action Lines / Speed Lines (Right to Left feeling of arrival) -->
  <g opacity="0.6" stroke-linecap="round">
    <line x1="190" y1="130" x2="220" y2="130" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 5"/>
    <line x1="170" y1="110" x2="200" y2="110" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 8"/>
    <line x1="205" y1="145" x2="235" y2="145" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6"/>
  </g>

  <!-- Floating Glowing Siren Light Beams (Ambient Effect) -->
  <path d="M 120 110 L 70 30 L 100 30 Z" fill="url(#redGlow)" style="mix-blend-mode: screen;" />
  <path d="M 130 110 L 170 30 L 140 30 Z" fill="url(#blueGlow)" style="mix-blend-mode: screen;" />

  <!-- Foreground Atmospheric Particles / Dust / Energy -->
  <circle cx="35" cy="180" r="2" fill="#38bdf8" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="50" cy="190" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="210" cy="175" r="2.5" fill="#ef4444" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="195" cy="190" r="1.5" fill="#38bdf8" opacity="0.7"/>

  <!-- Decorative Border Frame / Vignette -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>