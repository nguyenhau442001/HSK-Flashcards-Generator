<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Soup Bowl -->
  <path d="M60 160 Q60 210 120 210 Q180 210 180 160 Z" fill="#fb923c"/>
  <path d="M60 160 Q120 180 180 160 Z" fill="#f59e0b"/>
  
  <!-- Steam/Atmosphere -->
  <path d="M120 150 Q130 130 120 110" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M140 140 Q150 120 140 100" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Character Head -->
  <circle cx="120" cy="90" r="45" fill="#fde68a"/>
  
  <!-- Distorted Facial Expression (The "Salty" Reaction) -->
  <path d="M100 85 Q105 75 110 85" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M130 85 Q135 75 140 85" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M105 115 Q120 105 135 115" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Hand holding spoon, touching tongue -->
  <path d="M150 120 L170 100 L180 110 L160 130 Z" fill="#fde68a"/>
  <path d="M140 100 L150 90" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Salt Shaker (Context Prop) -->
  <rect x="190" y="140" width="30" height="40" rx="5" fill="#e2e8f0"/>
  <rect x="195" y="135" width="20" height="5" fill="#94a3b8"/>
  <circle cx="200" cy="145" r="2" fill="#334155"/>
  <circle cx="215" cy="145" r="2" fill="#334155"/>
  <circle cx="200" cy="160" r="2" fill="#334155"/>
  <circle cx="215" cy="160" r="2" fill="#334155"/>

  <!-- Dramatic Lighting Accent -->
  <circle cx="120" cy="90" r="45" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.2"/>
</svg>