<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Counter Top Gradient -->
    <linearGradient id="counter-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Card Reader Body Gradient -->
    <linearGradient id="reader-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Credit Card Gradient -->
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Phone Gradient -->
    <linearGradient id="phone-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)"/>

  <!-- Atmospheric Background Elements (Store shelf / ambiance) -->
  <g opacity="0.15">
    <rect x="30" y="30" width="180" height="4" rx="2" fill="#94a3b8"/>
    <rect x="50" y="44" width="140" height="4" rx="2" fill="#94a3b8"/>
    <!-- Ambient light cone -->
    <path d="M 120 0 L 200 160 L 40 160 Z" fill="#38bdf8" opacity="0.05"/>
  </g>

  <!-- Wooden/Modern Counter Top -->
  <path d="M 0 170 L 240 170 L 240 240 L 0 240 Z" fill="url(#counter-grad)"/>
  <rect x="0" y="166" width="240" height="6" rx="2" fill="#475569"/>

  <!-- POS Card Reader Machine (Background Context) -->
  <g transform="translate(145, 95)" filter="url(#soft-shadow)">
    <!-- Stand -->
    <path d="M 20 65 L 30 75 L 10 75 Z" fill="#475569"/>
    <rect x="15" y="45" width="20" height="25" rx="3" fill="#64748b"/>
    <!-- Terminal Body -->
    <rect x="0" y="0" width="50" height="55" rx="8" fill="url(#reader-grad)"/>
    <!-- Screen -->
    <rect x="6" y="8" width="38" height="18" rx="3" fill="#0f172a"/>
    <circle cx="25" cy="17" r="4" fill="#10b981" filter="url(#glow)"/>
    <!-- Keypad -->
    <rect x="8" y="32" width="8" height="4" rx="1" fill="#94a3b8"/>
    <rect x="21" y="32" width="8" height="4" rx="1" fill="#94a3b8"/>
    <rect x="34" y="32" width="8" height="4" rx="1" fill="#94a3b8"/>
    <rect x="8" y="40" width="8" height="4" rx="1" fill="#94a3b8"/>
    <rect x="21" y="40" width="8" height="4" rx="1" fill="#94a3b8"/>
    <rect x="34" y="40" width="8" height="4" rx="1" fill="#94a3b8"/>
  </g>

  <!-- Cash Register / Receipt Printer (Left Context) -->
  <g transform="translate(25, 110)" filter="url(#soft-shadow)">
    <rect x="0" y="10" width="45" height="50" rx="6" fill="#334155"/>
    <rect x="5" y="0" width="35" height="15" rx="3" fill="#475569"/>
    <!-- Receipt Paper sticking out -->
    <path d="M 15 -15 L 30 -15 L 30 2 L 15 2 Z" fill="#f8fafc"/>
    <!-- Display & Buttons -->
    <rect x="8" y="20" width="29" height="12" rx="2" fill="#0f172a"/>
    <circle cx="13" cy="38" r="2" fill="#38bdf8"/>
    <circle cx="22" cy="38" r="2" fill="#38bdf8"/>
    <circle cx="31" cy="38" r="2" fill="#38bdf8"/>
    <rect x="6" y="48" width="33" height="8" rx="2" fill="#1e293b"/>
  </g>

  <!-- MAIN ACTION: Contactless Payment (Hand + Smartphone + Waves) -->
  
  <!-- NFC Waves / Signal Animation -->
  <g transform="translate(100, 75)" opacity="0.9" filter="url(#glow)">
    <path d="M -15 15 A 15 15 0 0 1 -15 -15" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -8 10 A 10 10 0 0 1 -8 -10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -1 5 A 5 5 0 0 1 -1 -5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Smartphone being tapped (Mobile Payment) -->
  <g transform="translate(75, 70) rotate(-15)" filter="url(#soft-shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="46" height="84" rx="8" fill="url(#phone-grad)" stroke="#ffffff" stroke-width="2"/>
    <!-- Phone Screen -->
    <rect x="4" y="6" width="38" height="72" rx="4" fill="#0f172a"/>
    
    <!-- UI Element on Phone (Success Checkmark Icon) -->
    <circle cx="23" cy="35" r="12" fill="#10b981" opacity="0.2"/>
    <circle cx="23" cy="35" r="8" fill="#10b981" filter="url(#glow)"/>
    <path d="M 19 35 L 22 38 L 28 31" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Abstract UI bars -->
    <rect x="10" y="55" width="26" height="4" rx="2" fill="#38bdf8" opacity="0.6"/>
    <rect x="14" y="63" width="18" height="3" rx="1.5" fill="#64748b"/>
  </g>

  <!-- Hand holding the phone -->
  <g transform="translate(45, 115)" filter="url(#soft-shadow)">
    <!-- Palm & Thumb -->
    <path d="M 40 30 C 35 20 20 15 10 25 C 0 35 -10 50 5 65 C 20 80 45 75 55 55 C 60 45 45 40 40 30 Z" fill="#fb923c"/>
    <!-- Fingers wrapping around -->
    <path d="M 35 18 C 45 15 55 20 58 30 C 60 40 50 45 45 40" stroke="#fb923c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 28 12 C 38 8 48 12 52 22" stroke="#fb923c" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- SECONDARY ACTION: Traditional Credit Card Insert / Tap alternative (Foreground) -->
  <g transform="translate(110, 130) rotate(10)" filter="url(#soft-shadow)">
    <!-- Credit Card -->
    <rect x="0" y="0" width="64" height="40" rx="6" fill="url(#card-grad)"/>
    <!-- Chip -->
    <rect x="10" y="14" width="10" height="8" rx="2" fill="#fbbf24"/>
    <!-- Card details lines -->
    <rect x="10" y="28" width="25" height="3" rx="1.5" fill="#f43f5e" opacity="0.7"/>
    <circle cx="50" cy="28" r="6" fill="#f43f5e" opacity="0.8"/>
    <circle cx="54" cy="28" r="6" fill="#fbbf24" opacity="0.8" style="mix-blend-mode: screen;"/>
  </g>

  <!-- Sparkles / Success Highlights -->
  <g fill="#fbbf24" filter="url(#glow)">
    <path d="M 120 50 L 123 58 L 131 61 L 123 64 L 120 72 L 117 64 L 109 61 L 117 58 Z" transform="scale(0.5) translate(120, 20)"/>
    <path d="M 60 40 L 62 45 L 67 47 L 62 49 L 60 54 L 58 49 L 53 47 L 58 45 Z" transform="scale(0.6) translate(20, -10)"/>
    <circle cx="160" cy="80" r="3" fill="#38bdf8"/>
    <circle cx="95" cy="45" r="2" fill="#10b981"/>
  </g>

</svg>