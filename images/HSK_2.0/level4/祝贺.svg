<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.1"/>
  <path d="M30 180 L60 120 L90 180 Z" fill="#38bdf8" opacity="0.15"/>
  
  <!-- Confetti/Celebration Particles -->
  <circle cx="50" cy="80" r="3" fill="#fbbf24"/>
  <circle cx="190" cy="100" r="2" fill="#ec4899"/>
  <circle cx="120" cy="50" r="2.5" fill="#10b981"/>
  <rect x="150" y="140" width="6" height="3" rx="1" fill="#fb923c" transform="rotate(20)"/>
  
  <!-- Character: Person congratulating -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 140 Q40 100 60 100 T80 140" fill="#38bdf8"/>
    <!-- Arms -->
    <path d="M35 110 L10 80" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
    <path d="M85 110 L110 80" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="60" cy="85" r="20" fill="#fcd34d"/>
    <!-- Eyes -->
    <ellipse cx="53" cy="80" rx="2" ry="3" fill="#0f172a"/>
    <ellipse cx="67" cy="80" rx="2" ry="3" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M53 90 Q60 96 67 90" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Character: Person receiving congratulations -->
  <g transform="translate(130, 90)">
    <!-- Body -->
    <path d="M20 130 Q20 90 40 90 T60 130" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="40" cy="75" r="18" fill="#fcd34d"/>
    <!-- Eyes (Closed/Happy) -->
    <path d="M32 72 L36 76 L40 72" stroke="#0f172a" stroke-width="2" fill="none"/>
    <path d="M44 72 L48 76 L52 72" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Smile -->
    <path d="M35 85 Q40 88 45 85" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Foreground Prop: Diploma/Certificate -->
  <rect x="160" y="150" width="40" height="50" rx="4" fill="#f8fafc"/>
  <rect x="165" y="160" width="30" height="4" rx="1" fill="#cbd5e1"/>
  <rect x="165" y="170" width="30" height="4" rx="1" fill="#cbd5e1"/>
  <rect x="165" y="180" width="20" height="4" rx="1" fill="#cbd5e1"/>
  <circle cx="180" cy="190" r="5" fill="#ec4899"/>
</svg>