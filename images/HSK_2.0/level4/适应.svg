<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100% " stop-color="#0f172a" />
    </linearGradient>

    <!-- Window Glow / Daylight Gradient -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Warm Desk Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Plant Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Character Outfit Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- ENVIRONMENT: Apartment Interior -->
  <!-- Floor -->
  <path d="M 0,190 L 240,190 L 240,240 L 0,240 Z" fill="#090d16" />
  <line x1="0" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="2" />
  <!-- Floorboards perspective lines -->
  <line x1="80" y1="190" x2="40" y2="240" stroke="#0f172a" stroke-width="1.5" />
  <line x1="160" y1="190" x2="200" y2="240" stroke="#0f172a" stroke-width="1.5" />

  <!-- Back Wall Wallpaper Pattern (Subtle dots) -->
  <g fill="#334155" opacity="0.3">
    <circle cx="30" cy="40" r="1.5" />
    <circle cx="70" cy="40" r="1.5" />
    <circle cx="110" cy="40" r="1.5" />
    <circle cx="150" cy="40" r="1.5" />
    <circle cx="190" cy="40" r="1.5" />
    <circle cx="30" cy="80" r="1.5" />
    <circle cx="70" cy="80" r="1.5" />
    <circle cx="110" cy="80" r="1.5" />
    <circle cx="150" cy="80" r="1.5" />
    <circle cx="190" cy="80" r="1.5" />
  </g>

  <!-- Window Frame & New City View Outside -->
  <g>
    <!-- Window Outer Frame -->
    <rect x="135" y="30" width="75" height="110" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <!-- Window Glass -->
    <rect x="139" y="34" width="67" height="102" fill="url(#window-glow)" />
    <!-- Window Pane Divider -->
    <line x1="172" y1="34" x2="172" y2="136" stroke="#475569" stroke-width="2" />
    <line x1="139" y1="85" x2="206" y2="85" stroke="#475569" stroke-width="2" />
    <!-- City Silhouette Outside (New Environment/Culture) -->
    <path d="M 145,136 L 145,100 L 153,100 L 153,136 Z" fill="#1e293b" opacity="0.8" />
    <path d="M 158,136 L 158,75 L 170,75 L 170,136 Z" fill="#1e293b" opacity="0.9" />
    <path d="M 178,136 L 178,90 L 188,90 L 188,136 Z" fill="#1e293b" opacity="0.7" />
    <circle cx="195" cy="50" r="6" fill="#fbbf24" opacity="0.8" /> <!-- Sun/Moon -->
  </g>

  <!-- Bookshelf / Home Decor on Wall -->
  <g>
    <rect x="25" y="35" width="80" height="8" rx="2" fill="#475569" />
    <!-- Books -->
    <rect x="35" y="15" width="8" height="20" rx="1" fill="#f43f5e" />
    <rect x="45" y="12" width="10" height="23" rx="1" fill="#3b82f6" />
    <rect x="57" y="18" width="6" height="17" rx="1" fill="#10b981" />
    <rect x="66" y="14" width="12" height="21" rx="1" fill="#f59e0b" />
    <!-- Small potted plant on shelf -->
    <path d="M 88,35 L 98,35 L 95,23 L 91,23 Z" fill="#cbd5e1" />
    <path d="M 94.5,23 C 94,18 90,16 88,14 C 91,19 94,20 94.5,23 Z" fill="#10b981" />
    <path d="M 94.5,23 C 95,17 99,15 102,13 C 99,18 95,20 94.5,23 Z" fill="#34d399" />
  </g>

  <!-- Houseplant (Monstera / Adaptation Symbol of Thriving in New Soil) -->
  <g transform="translate(15, 130)">
    <!-- Pot -->
    <path d="M 12,45 L 28,45 L 32,65 L 8,65 Z" fill="#cbd5e1" />
    <ellipse cx="20" cy="45" rx="8" ry="3" fill="#94a3b8" />
    <!-- Stems & Leaves -->
    <path d="M 20,45 Q 10,25 2,20" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    <path d="M 20,45 Q 25,20 35,10" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <path d="M 20,45 Q 15,10 12,2" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    <!-- Leaf Blobs -->
    <path d="M 2,20 C -4,15 0,5 8,10 C 12,12 8,18 2,20 Z" fill="url(#leaf-grad)" />
    <path d="M 35,10 C 42,5 45,15 38,22 C 34,24 32,16 35,10 Z" fill="#34d399" />
    <path d="M 12,2 C 18,-2 22,8 14,14 C 8,12 8,4 12,2 Z" fill="#059669" />
  </g>

  <!-- DESK & PROPS -->
  <g filter="url(#shadow)">
    <!-- Desk Legs -->
    <rect x="45" y="170" width="8" height="30" fill="#334155" />
    <rect x="135" y="170" width="8" height="30" fill="#334155" />
    <!-- Desk Top -->
    <rect x="30" y="160" width="120" height="12" rx="3" fill="#64748b" />
    <rect x="25" y="156" width="130" height="6" rx="2" fill="#cbd5e1" />
  </g>

  <!-- Desk Props: Laptop, Lamp, Coffee Mug, Notebook -->
  <g>
    <!-- Laptop Base -->
    <polygon points="60,156 95,156 102,160 53,160" fill="#94a3b8" />
    <!-- Laptop Screen (open, showing charts/growth going up - representing adapting & succeeding) -->
    <path d="M 61,156 L 94,156 L 91,126 L 64,126 Z" fill="#334155" />
    <path d="M 64,129 L 91,129 L 88,153 L 67,153 Z" fill="#0f172a" />
    <!-- Chart lines on screen -->
    <polyline points="69,148 74,142 80,145 86,134" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="86" cy="134" r="2" fill="#38bdf8" />

    <!-- Desk Lamp -->
    <circle cx="125" cy="158" r="8" fill="#475569" />
    <path d="M 125,158 Q 120,130 135,115" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <!-- Lamp Shade & Warm Light Cone -->
    <path d="M 127,110 L 143,118 L 138,126 L 122,118 Z" fill="#f59e0b" />
    <ellipse cx="105" cy="175" rx="25" ry="12" fill="url(#lamp-glow)" />

    <!-- Coffee Mug -->
    <rect x="42" y="142" width="10" height="14" rx="2" fill="url(#mug-grad)" />
    <path d="M 52,145 C 55,145 55,151 52,153" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    <!-- Steam from Mug -->
    <path d="M 45,138 Q 47,133 45,128" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />

    <!-- Open Notebook / Planner -->
    <path d="M 98,148 L 120,144 L 123,158 L 101,162 Z" fill="#f8fafc" />
    <line x1="110" y1="146" x2="111" y2="160" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="102" y1="152" x2="108" y2="151" stroke="#94a3b8" stroke-width="1" />
    <line x1="114" y1="149" x2="120" y2="148" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- MAIN CHARACTER: Comfortably Adapted / Thriving in New Life -->
  <g filter="url(#shadow)">
    <!-- Chair Backrest -->
    <rect x="72" y="90" width="32" height="65" rx="8" fill="#334155" />
    <rect x="78" y="98" width="20" height="50" rx="4" fill="#1e293b" />

    <!-- Character Body (Sitting, relaxed, confident posture - embodying "thích ứng") -->
    <!-- Torso -->
    <path d="M 68,115 C 68,105 82,102 96,105 C 105,107 110,118 108,135 L 70,138 Z" fill="url(#shirt-grad)" />
    <!-- Collar -->
    <path d="M 80,103 L 88,112 L 96,104" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Left Arm (Typing / Working comfortably) -->
    <path d="M 72,112 L 58,130 L 72,142" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Hand -->
    <circle cx="74" cy="144" r="5" fill="#fcd34d" />

    <!-- Right Arm (Raised joyfully or stretching in comfortable adaptation) -->
    <path d="M 102,110 C 115,115 120,105 125,95" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <!-- Right Hand (Thumbs Up or relaxed open gesture) -->
    <circle cx="127" cy="91" r="5" fill="#fcd34d" />
    <!-- Thumbs up detail -->
    <path d="M 125,87 L 129,84" stroke="#d97706" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="83" y="95" width="10" height="12" fill="#fcd34d" />

    <!-- Head -->
    <circle cx="88" cy="80" r="18" fill="#fcd34d" />

    <!-- Hair (Stylish, modern cut) -->
    <path d="M 70,80 C 70,65 80,62 90,62 C 102,62 107,70 106,82 C 104,78 102,72 95,71 C 88,70 82,74 74,77 Z" fill="#1e293b" />
    <!-- Hair fringe spike -->
    <path d="M 74,77 Q 79,70 85,73 Z" fill="#1e293b" />

    <!-- Facial Expression: Smiling, eyes closed happily (sign of feeling at home/adapted) -->
    <!-- Smiling Eyes (Happy arcs) -->
    <path d="M 80,78 Q 84,82 88,78" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 94,78 Q 98,82 102,78" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Warm Smile -->
    <path d="M 85,86 Q 89,91 93,86" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <circle cx="78" cy="84" r="3" fill="#f43f5e" opacity="0.4" />
    <circle cx="100" cy="84" r="3" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- FOREGROUND ACCENTS & POLISH -->
  <!-- Ambient floating particles / sparkles representing positive energy and harmony -->
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="125" cy="65" r="2" />
    <circle cx="138" cy="78" r="1.5" />
    <circle cx="112" cy="50" r="2.5" />
  </g>
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="50" cy="95" r="2" />
    <circle cx="62" cy="60" r="1.5" />
  </g>

  <!-- Inner vignette border for polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" />
</svg>