<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(120, 140)">
    <!-- Character Torso -->
    <path d="M-40 80 Q0 60 40 80 L30 20 L-30 20 Z" fill="#38bdf8"/>
    <!-- Character Head -->
    <circle cx="0" cy="-20" r="45" fill="#fde68a"/>
    
    <!-- Pucker Face Expression -->
    <path d="M-15 -30 Q-5 -40 5 -30" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-15 -10 Q0 -25 15 -10" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="-15" cy="-35" r="3" fill="#1e293b"/>
    <circle cx="15" cy="-35" r="3" fill="#1e293b"/>
    <path d="M-5 -15 Q0 -20 5 -15" stroke="#ec4899" stroke-width="2" fill="none"/>
    
    <!-- Hands holding lemon -->
    <path d="M-50 20 L-70 40" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <path d="M50 20 L70 40" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    
    <!-- The Lemon -->
    <ellipse cx="0" cy="50" rx="25" ry="18" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <path d="M-25 50 Q0 35 25 50 Q0 65 -25 50" fill="#f59e0b" opacity="0.3"/>
    <circle cx="0" cy="50" r="5" fill="#fb923c"/>
  </g>

  <!-- Atmospheric accents -->
  <circle cx="40" cy="60" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="200" cy="80" r="6" fill="#fb923c" opacity="0.4"/>
  <path d="M180 180 Q200 160 220 180" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
</svg>