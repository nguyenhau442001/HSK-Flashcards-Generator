<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="bench-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="phone-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="search-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric background details (Park environment at dusk) -->
  <!-- Distant bushes -->
  <circle cx="40" cy="190" r="45" fill="#1e293b" opacity="0.8" />
  <circle cx="80" cy="200" r="50" fill="#0f172a" />
  <circle cx="200" cy="180" r="60" fill="#1e293b" opacity="0.6" />
  <circle cx="220" cy="210" r="45" fill="#0f172a" />

  <!-- Park Bench (Context Surface) -->
  <g filter="url(#shadow)">
    <!-- Bench Backrests -->
    <rect x="40" y="85" width="160" height="8" rx="4" fill="url(#bench-grad)" />
    <rect x="40" y="98" width="160" height="8" rx="4" fill="url(#bench-grad)" />
    <!-- Bench Supports -->
    <path d="M 45 93 L 55 150 L 65 150 L 55 93 Z" fill="#292524" />
    <path d="M 195 93 L 185 150 L 175 150 L 185 93 Z" fill="#292524" />
    <!-- Bench Seat -->
    <rect x="30" y="115" width="180" height="12" rx="4" fill="url(#bench-grad)" />
    <rect x="30" y="130" width="180" height="8" rx="3" fill="#291b0e" />
    <!-- Bench Legs -->
    <rect x="50" y="138" width="10" height="50" rx="3" fill="#1c1917" />
    <rect x="180" y="138" width="10" height="50" rx="3" fill="#1c1917" />
  </g>

  <!-- Fallen Leaves on the Ground -->
  <path d="M 70 185 Q 75 180 82 187 Q 75 192 70 185 Z" fill="#fb923c" transform="rotate(15 75 185)" />
  <path d="M 150 195 Q 158 190 162 198 Q 155 202 150 195 Z" fill="#f59e0b" transform="rotate(-30 156 196)" />
  <path d="M 105 190 Q 110 185 117 192 Q 110 197 105 190 Z" fill="#d97706" transform="rotate(45 111 191)" />

  <!-- THE LOST ITEM: Smartphone lying face down, sliding off/lost under the bench -->
  <g transform="translate(110, 155) rotate(-25)" filter="url(#shadow)">
    <!-- Phone Shadow -->
    <rect x="-2" y="2" width="36" height="64" rx="8" fill="#000000" opacity="0.5" />
    <!-- Phone Body -->
    <rect x="0" y="0" width="36" height="64" rx="8" fill="url(#phone-body)" />
    <!-- Camera module -->
    <rect x="4" y="4" width="12" height="12" rx="3" fill="#0369a1" />
    <circle cx="10" cy="10" r="3" fill="#0f172a" />
    <!-- Screen side down hint / glowing accent indicating "Where is it?" -->
    <rect x="2" y="2" width="32" height="60" rx="6" fill="#0ea5e9" opacity="0.3" />
  </g>

  <!-- Floating Question Marks / Action Indicators (Loss/Confusion theme) -->
  <g fill="#fbbf24" opacity="0.9">
    <path d="M 135 115 C 135 105, 145 100, 150 108 C 154 114, 148 119, 148 124 M 148 131 L 148 135" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="148" cy="133" r="2.5" />
  </g>
  <g fill="#38bdf8" opacity="0.7" transform="scale(0.7) translate(70, 40)">
    <path d="M 135 115 C 135 105, 145 100, 150 108 C 154 114, 148 119, 148 124 M 148 131 L 148 135" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="148" cy="133" r="2.5" />
  </g>

  <!-- Flashlight / Search Beam (Looking for the lost item) -->
  <!-- Beam triangle -->
  <polygon points="220,30 80,155 125,185" fill="url(#search-beam)" />
  
  <!-- Flashlight Source (Top Right Hand / Device) -->
  <g transform="translate(205, 45) rotate(-135)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="16" fill="url(#glow)" />
    <rect x="-8" y="-15" width="16" height="30" rx="5" fill="#cbd5e1" />
    <circle cx="0" cy="-15" r="9" fill="#f59e0b" />
    <circle cx="0" cy="-15" r="5" fill="#fffbeb" />
  </g>

  <!-- Sparkles/Focus on the lost phone -->
  <g transform="translate(100, 130)">
    <path d="M 0 0 L 3 8 L 11 11 L 3 14 L 0 22 L -3 14 L -11 11 L -3 8 Z" fill="#fef08a" opacity="0.9" />
  </g>
  <g transform="translate(145, 160) scale(0.6)">
    <path d="M 0 0 L 3 8 L 11 11 L 3 14 L 0 22 L -3 14 L -11 11 L -3 8 Z" fill="#fef08a" opacity="0.7" />
  </g>

  <!-- Foreground ground gradient overlay for depth -->
  <rect x="0" y="210" width="240" height="30" fill="#0f172a" opacity="0.8" />
</svg>