<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="table-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cookie-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cookie-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="jar-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#f8fafc" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#94a3b8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="milk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric background highlights -->
  <circle cx="120" cy="120" r="90" fill="url(#table-glow)" />

  <!-- Wooden Table Surface -->
  <path d="M 0 170 Q 120 155 240 170 L 240 228 Q 240 240 228 240 L 12 240 Q 0 240 0 228 Z" fill="#090d16" />
  <path d="M 0 170 Q 120 155 240 170 L 240 176 Q 120 161 0 176 Z" fill="#334155" opacity="0.4" />

  <!-- SCENE PROPS: Milk Glass (Left) -->
  <!-- Glass drop shadow -->
  <ellipse cx="60" cy="205" rx="20" ry="6" fill="#020617" opacity="0.6" />
  <!-- Glass body -->
  <path d="M 44 140 L 50 200 C 50 205 70 205 76 200 L 82 140 Z" fill="url(#jar-glass)" filter="url(#soft-shadow)" />
  <!-- Milk inside -->
  <path d="M 47 155 L 51 198 C 51 201 69 201 73 198 L 77 155 Z" fill="url(#milk-grad)" />
  <ellipse cx="62" cy="155" rx="15" ry="4" fill="#ffffff" />
  <!-- Glass rim -->
  <ellipse cx="63" cy="140" rx="19" ry="5" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <!-- Glass shine -->
  <path d="M 50 150 L 53 190" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- MAIN SUBJECT: Cookie Jar (Center-Right) -->
  <!-- Jar shadow -->
  <ellipse cx="165" cy="215" rx="35" ry="8" fill="#020617" opacity="0.6" />
  
  <!-- Cookies inside the jar (peekaboo) -->
  <circle cx="150" cy="170" r="16" fill="#b45309" />
  <circle cx="175" cy="175" r="15" fill="#d97706" />
  <circle cx="165" cy="150" r="15" fill="#f59e0b" />

  <!-- Jar Base/Body -->
  <path d="M 135 125 C 130 140 130 190 135 205 C 145 212 185 212 195 205 C 200 190 200 140 195 125 Z" fill="url(#jar-glass)" stroke="#cbd5e1" stroke-width="2" filter="url(#drop-shadow)" />
  
  <!-- Jar Liquid/Interior shadow -->
  <path d="M 136 130 C 132 145 132 190 136 203 C 145 210 185 210 194 203 C 198 190 198 145 194 130 Z" fill="#1e293b" opacity="0.2" />
  
  <!-- Jar Glass Highlights -->
  <path d="M 143 140 C 141 160 141 180 143 195" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 188 145 C 189 165 189 175 188 190" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Jar Lid -->
  <ellipse cx="165" cy="115" rx="32" ry="8" fill="#fb923c" stroke="#f97316" stroke-width="2" filter="url(#soft-shadow)" />
  <rect x="155" y="102" width="20" height="6" rx="3" fill="#fdba74" stroke="#f97316" stroke-width="1.5" />
  <ellipse cx="165" cy="112" rx="28" ry="4" fill="#f59e0b" opacity="0.5" />

  <!-- FOREGROUND HERO: The Chocolate Chip Cookie (bǐnggān) -->
  <!-- Shadow under cookie -->
  <ellipse cx="105" cy="188" rx="38" ry="12" fill="#020617" opacity="0.7" />

  <!-- Main Cookie Body with organic wavy edge -->
  <g filter="url(#drop-shadow)">
    <path d="M 105 145 
             C 120 142, 135 150, 140 165 
             C 148 175, 142 195, 128 200 
             C 115 208, 95 205, 85 195 
             C 72 190, 68 170, 78 158 
             C 85 146, 95 147, 105 145 Z" 
          fill="url(#cookie-body)" stroke="#b45309" stroke-width="2.5" />
          
    <!-- Cookie Inner Highlight -->
    <path d="M 102 148 
             C 115 146, 128 152, 133 164 
             C 139 173, 134 190, 122 195 
             C 110 201, 93 198, 85 190 
             C 75 185, 72 170, 80 160 
             C 86 150, 95 150, 102 148 Z" 
          fill="url(#cookie-highlight)" />
  </g>

  <!-- Chocolate Chips (Delicious dark brown/black rounded chunks) -->
  <!-- Chip 1 (Top Center) -->
  <path d="M 98 158 C 103 156, 108 160, 106 166 C 104 171, 96 170, 94 165 C 93 160, 95 159, 98 158 Z" fill="#3f2305" />
  <circle cx="97" cy="161" r="1.5" fill="#78350f" opacity="0.6" />

  <!-- Chip 2 (Right) -->
  <path d="M 122 165 C 128 163, 132 168, 129 174 C 126 180, 118 178, 117 172 C 116 167, 118 166, 122 165 Z" fill="#3f2305" />
  <path d="M 120 168 Q 124 167 125 171" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Chip 3 (Bottom Left) -->
  <path d="M 88 178 C 93 176, 98 180, 96 186 C 94 191, 86 190, 84 185 C 83 180, 85 179, 88 178 Z" fill="#3f2305" />

  <!-- Chip 4 (Center) -->
  <path d="M 108 175 C 113 173, 118 177, 116 183 C 114 188, 106 187, 104 182 C 103 177, 105 176, 108 175 Z" fill="#3f2305" />
  <circle cx="107" cy="178" r="1.5" fill="#78350f" opacity="0.6" />

  <!-- Chip 5 (Small Accent Far Left) -->
  <circle cx="82" cy="168" r="3" fill="#3f2305" />

  <!-- Chip 6 (Bottom Right) -->
  <circle cx="118" cy="192" r="3.5" fill="#3f2305" />

  <!-- Crumb details -->
  <circle cx="145" cy="195" r="1.5" fill="#d97706" />
  <circle cx="152" cy="198" r="1" fill="#b45309" />
  <circle cx="70" cy="180" r="1" fill="#d97706" />
  <circle cx="74" cy="185" r="1.5" fill="#b45309" />

  <!-- Action Sparkles / Motion / Appeal effects -->
  <g fill="#fbbf24">
    <path d="M 35 110 Q 40 110 40 105 Q 40 110 45 110 Q 40 110 40 115 Q 40 110 35 110 Z" opacity="0.8" />
    <path d="M 205 90 Q 212 90 212 83 Q 212 90 219 90 Q 212 90 212 97 Q 212 90 205 90 Z" opacity="0.9" />
    <circle cx="195" cy="75" r="2" opacity="0.7" />
    <circle cx="48" cy="130" r="1.5" opacity="0.6" />
  </g>
</svg>