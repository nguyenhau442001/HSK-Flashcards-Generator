<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 60)">
    <!-- Camera Body -->
    <rect x="20" y="40" width="120" height="80" rx="12" fill="#334155" stroke="#475569" stroke-width="4"/>
    <rect x="30" y="30" width="40" height="15" rx="4" fill="#fb923c"/>
    
    <!-- Lens -->
    <circle cx="80" cy="80" r="35" fill="#0f172a" stroke="#fbbf24" stroke-width="6"/>
    <circle cx="80" cy="80" r="25" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="80" cy="80" r="10" fill="#38bdf8" opacity="0.6"/>
    
    <!-- Flash Effect -->
    <path d="M140 80 L200 50 L180 80 L200 110 Z" fill="#f59e0b" opacity="0.8"/>
    <circle cx="190" cy="80" r="15" fill="#fbbf24" opacity="0.4"/>
    
    <!-- Decorative elements -->
    <circle cx="120" cy="55" r="5" fill="#ec4899"/>
    <rect x="100" y="120" width="40" height="5" rx="2" fill="#475569"/>
  </g>

  <!-- Background Ambient Details -->
  <circle cx="200" cy="180" r="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M180 180 Q200 160 220 180" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M185 190 Q200 210 215 190" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>