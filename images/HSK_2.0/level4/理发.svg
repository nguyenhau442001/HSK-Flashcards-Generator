<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="scissorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric Background Elements (Salon Interior) -->
  <path d="M40 200 L200 200 L210 240 L30 240 Z" fill="#0f172a" opacity="0.6"/>
  <!-- Wall striping -->
  <path d="M0 80 L240 80" stroke="#334155" stroke-width="2" opacity="0.4"/>

  <!-- Large Salon Mirror Frame -->
  <rect x="50" y="25" width="140" height="155" rx="70" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="56" y="31" width="128" height="143" rx="64" fill="url(#mirrorGrad)"/>

  <!-- Mirror Reflection: Stylized Client Head & Cape -->
  <g transform="translate(0, 5)">
    <!-- Client Cape -->
    <path d="M80 150 Q120 120 160 150 L185 185 Q120 195 55 185 Z" fill="#ec4899"/>
    <path d="M95 150 Q120 130 145 150 L155 180 Q120 185 85 180 Z" fill="#f43f5e"/>
    <!-- Client Neck & Head -->
    <path d="M108 135 L132 135 L130 115 L110 115 Z" fill="#fed7aa"/>
    <circle cx="120" cy="95" r="22" fill="#fed7aa"/>
    <!-- Client Hair (Messy before cut) -->
    <path d="M98 90 C95 70 110 65 125 70 C140 65 148 80 145 95 C140 85 130 78 120 80 C110 78 102 85 98 90 Z" fill="#334155"/>
  </g>

  <!-- Ambient Golden Glow behind scissors -->
  <circle cx="140" cy="115" r="45" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>

  <!-- Barber Chair Backrest (Foreground framing) -->
  <path d="M85 160 L155 160 L165 210 L75 210 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <path d="M95 170 L145 170 L150 200 L90 200 Z" fill="#334155"/>

  <!-- Floating Action Elements: Hair Strands -->
  <path d="M 130 100 Q 150 105 165 90" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 135 105 Q 160 115 175 105" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M 125 95 Q 145 90 160 75" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Action-Packed Professional Scissors (Main Focus) -->
  <g transform="translate(130, 95) rotate(-25)">
    <!-- Blade 1 -->
    <path d="M-2 -50 L2 -50 L1 -2 L40 45 L36 48 L-2 -3 Z" fill="url(#scissorGrad)"/>
    <!-- Blade 2 -->
    <path d="M2 -50 L-2 -50 L-1 -2 L-40 45 L-36 48 L2 -3 Z" fill="url(#scissorGrad)" opacity="0.9"/>
    
    <!-- Pivot Screw -->
    <circle cx="0" cy="-2" r="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Handle 1 (Right Loop) -->
    <g transform="translate(25, 42)">
      <circle cx="10" cy="10" r="10" fill="none" stroke="url(#scissorGrad)" stroke-width="5"/>
    </g>
    <!-- Handle 2 (Left Loop) -->
    <g transform="translate(-25, 42)">
      <circle cx="-10" cy="10" r="10" fill="none" stroke="url(#scissorGrad)" stroke-width="5"/>
    </g>
  </g>

  <!-- Sparkles / Motion Effects -->
  <path d="M 175 75 L 180 80 L 175 85 L 170 80 Z" fill="#fbbf24"/>
  <path d="M 110 60 L 113 63 L 110 66 L 107 63 Z" fill="#38bdf8"/>
  <circle cx="155" cy="135" r="2.5" fill="#fbbf24"/>
  <circle cx="100" cy="115" r="2" fill="#38bdf8"/>

  <!-- Foreground Salon Counter / Shelf with Tools -->
  <rect x="20" y="210" width="200" height="12" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
  
  <!-- Comb Prop -->
  <rect x="45" y="202" width="24" height="8" rx="2" fill="#f59e0b"/>
  <path d="M 48 202 L 48 198 M 52 202 L 52 198 M 56 202 L 56 198 M 60 202 L 60 198 M 64 202 L 64 198" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Spray Bottle Prop -->
  <path d="M 180 190 L 195 190 L 192 210 L 183 210 Z" fill="#38bdf8"/>
  <path d="M 185 190 L 190 190 L 190 183 L 196 183 L 196 180 L 184 180 Z" fill="#94a3b8"/>
  <path d="M 194 183 L 200 186" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

</svg>