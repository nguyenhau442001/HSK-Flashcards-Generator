<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient Setup -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="schoolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Canvas Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)"/>

  <!-- Atmospheric Stars / Sparkles -->
  <circle cx="40" cy="30" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="90" cy="20" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="160" cy="35" r="1" fill="#94a3b8" opacity="0.5"/>
  <circle cx="210" cy="25" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="120" cy="50" r="1" fill="#38bdf8" opacity="0.6"/>

  <!-- Rolling Hills / Terrain background -->
  <path d="M 0 160 Q 60 130 120 150 T 240 140 L 240 240 L 0 240 Z" fill="#0f766e" opacity="0.4"/>

  <!-- Main Ground -->
  <path d="M 0 165 Q 80 145 240 160 L 240 240 L 0 240 Z" fill="url(#groundGrad)"/>

  <!-- Winding Path representing "Distance" (距离) between House and School -->
  <path d="M 45 195 C 75 195, 90 170, 120 170 C 150 170, 165 195, 195 195" fill="none" stroke="url(#pathGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 45 195 C 75 195, 90 170, 120 170 C 150 170, 165 195, 195 195" fill="none" stroke="#fef3c7" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.8"/>

  <!-- HOUSE (My Home / 家) on the Left -->
  <g transform="translate(20, 130)">
    <!-- House Shadow -->
    <ellipse cx="25" cy="52" rx="22" ry="6" fill="#022c22" opacity="0.4"/>
    <!-- Walls -->
    <rect x="10" y="20" width="32" height="30" rx="2" fill="url(#houseGrad)"/>
    <!-- Roof -->
    <polygon points="5,22 26,5 47,22" fill="#fb923c"/>
    <polygon points="26,5 47,22 43,22 26,8" fill="#ea580c" opacity="0.4"/>
    <!-- Door -->
    <rect x="21" y="32" width="10" height="18" rx="1" fill="#78350f"/>
    <!-- Window -->
    <rect x="14" y="24" width="7" height="7" rx="1" fill="#fde047"/>
    <!-- Cute Bush -->
    <circle cx="5" cy="45" r="6" fill="#10b981"/>
    <circle cx="43" cy="45" r="5" fill="#10b981"/>
  </g>

  <!-- SCHOOL (学校) on the Right -->
  <g transform="translate(170, 115)">
    <!-- School Shadow -->
    <ellipse cx="25" cy="67" rx="25" ry="6" fill="#022c22" opacity="0.4"/>
    <!-- Main Building -->
    <rect x="8" y="25" width="34" height="40" rx="2" fill="url(#schoolGrad)"/>
    <!-- Side Wing Left -->
    <rect x="2" y="37" width="10" height="28" rx="1" fill="#0284c7"/>
    <!-- Side Wing Right -->
    <rect x="38" y="37" width="10" height="28" rx="1" fill="#0284c7"/>
    <!-- Roof Center -->
    <polygon points="25,12 4,27 46,27" fill="#fbbf24"/>
    <polygon points="25,12 46,27 42,27 25,15" fill="#d97706" opacity="0.4"/>
    <!-- Entrance / Double Door -->
    <rect x="18" y="47" width="14" height="18" rx="2" fill="#1e293b"/>
    <!-- Windows -->
    <rect x="12" y="30" width="6" height="8" rx="1" fill="#e0f2fe"/>
    <rect x="32" y="30" width="6" height="8" rx="1" fill="#e0f2fe"/>
    <rect x="12" y="42" width="6" height="8" rx="1" fill="#e0f2fe"/>
    <rect x="32" y="42" width="6" height="8" rx="1" fill="#e0f2fe"/>
    <!-- Clock Tower detail / Flag -->
    <line x1="25" y1="12" x2="25" y2="4" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <polygon points="25,4 33,8 25,10" fill="#f43f5e"/>
  </g>

  <!-- DISTANCE MEASUREMENT VISUALIZATION (Spatial Arc & Markers) -->
  <!-- Glowing dashed measurement arc bridging Home and School -->
  <path d="M 45 135 C 75 90, 165 90, 195 135" fill="none" stroke="url(#beamGrad)" stroke-width="3" stroke-dasharray="6 6" filter="url(#glow)" stroke-linecap="round"/>

  <!-- Measurement Start Pin (Home side) -->
  <g transform="translate(45, 135)">
    <circle cx="0" cy="0" r="8" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <path d="M 0 8 L 0 16" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Measurement End Pin (School side) -->
  <g transform="translate(195, 135)">
    <circle cx="0" cy="0" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <path d="M 0 8 L 0 16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Center Distance Indicator Icon (Compass / Ruler motif floating in mid-air) -->
  <g transform="translate(120, 95)" filter="url(#glow)">
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <!-- Compass Needle -->
    <polygon points="0,-10 3,2 0,6 -3,2" fill="#f43f5e"/>
    <polygon points="0,10 3,-2 0,-6 -3,-2" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="2.5" fill="#fbbf24"/>
  </g>

  <!-- Cute Traveler Character walking along the path (Action/Context Element) -->
  <g transform="translate(100, 162)">
    <!-- Shadow -->
    <ellipse cx="6" cy="18" rx="5" ry="2" fill="#042f2e" opacity="0.6"/>
    <!-- Body & Backpack -->
    <rect x="2" y="6" width="9" height="10" rx="3" fill="#ec4899"/>
    <rect x="-1" y="7" width="4" height="8" rx="2" fill="#8b5cf6"/> <!-- Backpack -->
    <!-- Head -->
    <circle cx="6.5" cy="3" r="4.5" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M 2 2 C 3 0, 8 0, 10 2 C 10 4, 2 4, 2 2 Z" fill="#78350f"/>
    <!-- Legs in motion -->
    <line x1="4" y1="16" x2="2" y2="21" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="16" x2="11" y2="21" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Foliage / Details -->
  <path d="M 0 240 L 0 220 Q 15 210, 30 225 Q 45 210, 60 225 L 60 240 Z" fill="#047857" opacity="0.8"/>
  <path d="M 180 240 L 180 225 Q 195 215, 210 225 Q 225 215, 240 225 L 240 240 Z" fill="#047857" opacity="0.8"/>
  
  <!-- Tiny decorative glowing fireflies/dots representing distance scale -->
  <circle cx="80" cy="125" r="2" fill="#fbbf24" opacity="0.8" filter="url(#glow)"/>
  <circle cx="150" cy="125" r="2" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>
</svg>