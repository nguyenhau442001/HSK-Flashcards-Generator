  <!-- Character Arms Pushing -->
  <g fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round">
    <path d="M40 120 C70 110 100 120 125 130"/>
    <path d="M40 160 C70 150 100 160 125 170"/>
  </g>
  
  <!-- Motion/Action Lines -->
  <path d="M175 120 L195 110" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <path d="M175 150 L195 140" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <path d="M175 180 L195 170" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative Floor Detail -->
  <circle cx="30" cy="210" r="2" fill="#10b981"/>
  <circle cx="210" cy="215" r="3" fill="#ec4899"/>
</svg>