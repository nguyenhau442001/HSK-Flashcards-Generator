<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor/Ground -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Door Frame -->
  <rect x="70" y="30" width="100" height="180" rx="8" fill="#475569" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Pushing Door Panel -->
  <path d="M120 35 L165 45 L165 205 L120 215 Z" fill="#fbbf24"/>
  <path d="M120 35 L165 45 L165 205 L120 215 Z" fill="none" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Door Handle -->
