<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Hospital Nursery Window Backdrop -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Warm Nursery Light Gradient -->
    <radialGradient id="warmGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Crib Blanket Gradient -->
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Mobile Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Glow Filter for Magic/New Life -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGlow)"/>

  <!-- Window Frame & Night Sky Background -->
  <g transform="translate(45, 15)">
    <!-- Window backdrop -->
    <rect x="0" y="0" width="150" height="85" rx="8" fill="url(#nightSky)" stroke="#334155" stroke-width="3"/>
    
    <!-- Moon -->
    <circle cx="120" cy="30" r="14" fill="#fef08a" opacity="0.9"/>
    
    <!-- Stars -->
    <path d="M25,20 L27,25 L32,27 L27,29 L25,34 L23,29 L18,27 L23,25 Z" fill="#ffffff" opacity="0.8" transform="scale(0.6) translate(10, 10)"/>
    <path d="M75,45 L77,50 L82,52 L77,54 L75,59 L73,54 L68,52 L73,50 Z" fill="#ffffff" opacity="0.6" transform="scale(0.4) translate(90, 20)"/>
    <path d="M45,65 L46,68 L49,69 L46,70 L45,73 L44,70 L41,69 L44,68 Z" fill="#ffffff" opacity="0.9" transform="scale(0.5) translate(40, 10)"/>

    <!-- Window Sill / Inner Frame Highlights -->
    <line x1="75" y1="0" x2="75" y2="85" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="42" x2="150" y2="42" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Ambient Nursery Glow from Lamp/Window -->
  <circle cx="120" cy="140" r="80" fill="url(#warmGlow)"/>

  <!-- Crib Hanging Mobile -->
  <g stroke="#64748b" stroke-width="1.5" fill="none">
    <!-- Ceiling mount & stem -->
    <path d="M120,0 L120,25"/>
    <!-- Mobile Crossbar -->
    <path d="M95,25 L145,25"/>
    <path d="M120,22 L120,28"/>
    <!-- Strings to hanging toys -->
    <path d="M100,25 L100,42"/>
    <path d="M140,25 L140,42"/>
  </g>
  <!-- Mobile Hanging Stars/Moon -->
  <g transform="translate(0, 5)">
    <polygon points="100,38 102,43 107,44 103,48 104,53 100,50 96,53 97,48 93,44 98,43" fill="url(#starGrad)"/>
    <circle cx="140" cy="45" r="5" fill="#f43f5e" opacity="0.9"/>
  </g>

  <!-- Background Wall Details (Shelves / Soft decor) -->
  <rect x="25" y="85" width="40" height="4" rx="2" fill="#475569"/>
  <circle cx="45" cy="77" r="7" fill="#10b981"/>
  <path d="M38,85 L38,81 C38,79 40,77 45,77 C50,77 52,79 52,81 L52,85 Z" fill="#f43f5e"/>

  <!-- THE CRIB (Foreground Element) -->
  <g filter="url(#shadow)">
    <!-- Back rails of the crib -->
    <rect x="35" y="115" width="170" height="90" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    
    <!-- Vertical slats background inside crib -->
    <g stroke="#cbd5e1" stroke-width="3" opacity="0.5">
      <line x1="55" y1="120" x2="55" y2="195"/>
      <line x1="75" y1="120" x2="75" y2="195"/>
      <line x1="95" y1="120" x2="95" y2="195"/>
      <line x1="115" y1="120" x2="115" y2="195"/>
      <line x1="135" y1="120" x2="135" y2="195"/>
      <line x1="155" y1="120" x2="155" y2="195"/>
      <line x1="175" y1="120" x2="175" y2="195"/>
      <line x1="195" y1="120" x2="195" y2="195"/>
    </g>

    <!-- Mattress / Inner Cushion -->
    <rect x="45" y="145" width="150" height="55" rx="8" fill="#e2e8f0"/>

    <!-- NEWBORN BABY (Focal Point representing 'sinh ra' - birth/new life) -->
    <g transform="translate(100, 140)">
      <!-- Baby Body wrapped in blanket -->
      <path d="M10,25 C10,15 25,10 40,12 C60,14 75,22 75,35 C75,48 55,55 35,52 C18,50 10,38 10,25 Z" fill="url(#blanketGrad)" filter="url(#shadow)"/>
      
      <!-- Blanket decorative pattern (little stars/dots) -->
      <circle cx="30" cy="30" r="2" fill="#ffffff" opacity="0.6"/>
      <circle cx="45" cy="40" r="2" fill="#ffffff" opacity="0.6"/>
      <circle cx="55" cy="28" r="1.5" fill="#ffffff" opacity="0.6"/>

      <!-- Baby Head & Face -->
      <circle cx="28" cy="22" r="13" fill="#fde68a"/> <!-- Head -->
      <!-- Rosy Cheeks -->
      <circle cx="22" cy="25" r="3" fill="#fda4af" opacity="0.8"/>
      <circle cx="34" cy="25" r="3" fill="#fda4af" opacity="0.8"/>
      <!-- Happy closed eyes (arcs) -->
      <path d="M20,20 Q22,17 24,20" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M32,20 Q34,17 36,20" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- Cute little smile -->
      <path d="M26,24 Q28,26 30,24" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" fill="none"/>

      <!-- Tiny tuft of hair -->
      <path d="M26,10 Q28,6 31,10" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>

      <!-- Sparkles of New Life / Birth Magic -->
      <g filter="url(#glow)">
        <path d="M-5,10 L0,0 L5,10 L15,15 L5,20 L0,30 L-5,20 L-15,15 Z" fill="#fef08a" opacity="0.9" transform="translate(60, -10) scale(0.4)"/>
        <path d="M-5,10 L0,0 L5,10 L15,15 L5,20 L0,30 L-5,20 L-15,15 Z" fill="#38bdf8" opacity="0.8" transform="translate(-15, -5) scale(0.3)"/>
      </g>
    </g>

    <!-- Front Crib Rail (Overlapping baby for 3D depth) -->
    <path d="M30,165 L210,165 C213,165 215,167 215,170 L215,200 C215,206 210,210 204,210 L36,210 C30,210 25,206 25,200 L25,170 C25,167 27,165 30,165 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Vertical Slats on Front Rail -->
    <g stroke="#94a3b8" stroke-width="4">
      <line x1="50" y1="165" x2="50" y2="210"/>
      <line x1="75" y1="165" x2="75" y2="210"/>
      <line x1="100" y1="165" x2="100" y2="210"/>
      <line x1="125" y1="165" x2="125" y2="210"/>
      <line x1="150" y1="165" x2="150" y2="210"/>
      <line x1="175" y1="165" x2="175" y2="210"/>
      <line x1="200" y1="165" x2="200" y2="210"/>
    </g>
    <!-- Front Rail Horizontal Bar Detail -->
    <rect x="25" y="175" width="190" height="6" fill="#94a3b8" opacity="0.6"/>
  </g>

  <!-- Side Nursery Props: Cute Toy / Stuffed Bear sitting near crib -->
  <g transform="translate(15, 170)" filter="url(#shadow)">
    <!-- Bear Body -->
    <circle cx="15" cy="25" r="10" fill="#d97706"/>
    <circle cx="15" cy="13" r="7" fill="#d97706"/>
    <!-- Bear Ears -->
    <circle cx="10" cy="7" r="3" fill="#b45309"/>
    <circle cx="20" cy="7" r="3" fill="#b45309"/>
    <!-- Bear Face details -->
    <circle cx="13" cy="12" r="1" fill="#1e293b"/>
    <circle cx="17" cy="12" r="1" fill="#1e293b"/>
    <ellipse cx="15" cy="15" rx="2" ry="1.5" fill="#fef3c7"/>
  </g>

  <!-- Additional Foreground Floating Sparkles / Joy Particles -->
  <g fill="#fef08a">
    <circle cx="75" cy="115" r="2" opacity="0.8"/>
    <circle cx="165" cy="105" r="3" opacity="0.6"/>
    <circle cx="140" cy="125" r="1.5" opacity="0.9"/>
    <circle cx="90" cy="135" r="2.5" opacity="0.7"/>
  </g>
</svg>