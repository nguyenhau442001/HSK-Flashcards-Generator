<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Container -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Environment & Atmosphere -->
  <g opacity="0.3">
    <!-- Walls/Floor Perspective Grid -->
    <path d="M 20 180 L 120 140 L 220 180" fill="none" stroke="#334155" stroke-width="1.5"/>
    <path d="M 40 195 L 120 160 L 200 195" fill="none" stroke="#334155" stroke-width="1"/>
    <!-- Ambient Light Rays -->
    <polygon points="120,40 50,210 90,210" fill="url(#beamGrad)"/>
    <polygon points="120,40 150,210 190,210" fill="url(#beamGrad)"/>
  </g>

  <!-- Central Display Platform representing "ANY / ANYTHING / ANYONE" (Bất kỳ, mọi) -->
  <ellipse cx="120" cy="180" rx="70" ry="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <ellipse cx="120" cy="180" rx="55" ry="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <ellipse cx="120" cy="180" rx="40" ry="11" fill="url(#portalGlow)"/>

  <!-- Floating Diverse Objects / People silhouettes & colorful items representing "ANYONE / ANYTHING" (Bất kỳ ai, bất kỳ cái gì) -->
  
  <!-- Object 1: Star/Award (Achievement - Anyone can win) -->
  <g transform="translate(65, 110)">
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <path d="M0 -8 L2.5 -2 L9 -2 L3.5 2 L5.5 8 L0 4.5 L-5.5 8 L-3.5 2 L-9 -2 L-2.5 -2 Z" fill="#fbbf24"/>
  </g>

  <!-- Object 2: Key (Access - Anyone can open) -->
  <g transform="translate(175, 115) rotate(25)">
    <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
    <rect x="-2" y="10" width="4" height="18" fill="#38bdf8"/>
    <rect x="2" y="20" width="6" height="3" fill="#38bdf8"/>
    <rect x="2" y="24" width="4" height="3" fill="#38bdf8"/>
  </g>

  <!-- Object 3: Gift Box (Surprise - Anyone can receive) -->
  <g transform="translate(90, 75)">
    <rect x="-14" y="-10" width="28" height="24" rx="3" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/>
    <rect x="-16" y="-14" width="32" height="6" rx="2" fill="#f472b6"/>
    <rect x="-3" y="-14" width="6" height="28" fill="#fbbf24"/>
    <rect x="-14" y="0" width="28" height="4" fill="#fbbf24"/>
  </g>

  <!-- Object 4: Compass/Direction (Any direction, anywhere) -->
  <g transform="translate(150, 75)">
    <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <polygon points="0,-10 4,0 0,8 -4,0" fill="#10b981"/>
    <polygon points="0,10 4,0 0,-8 -4,0" fill="#6ee7b7"/>
  </g>

  <!-- Central Focal Character/Icon representing Universal Choice (Open Hands / Variety) -->
  <!-- Floating energetic core badge -->
  <circle cx="120" cy="115" r="32" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="120" cy="115" r="26" fill="#0f172a"/>

  <!-- Abstract symbol of inclusivity: multiple intersecting orbits / diverse paths -->
  <ellipse cx="120" cy="115" rx="18" ry="8" fill="none" stroke="#38bdf8" stroke-width="2.5" transform="rotate(-30 120 115)"/>
  <ellipse cx="120" cy="115" rx="18" ry="8" fill="none" stroke="#ec4899" stroke-width="2.5" transform="rotate(30 120 115)"/>
  <circle cx="120" cy="115" r="5" fill="#fbbf24"/>

  <!-- Dynamic Sparkles / Action lines -->
  <path d="M 50 55 L 60 65" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 190 55 L 180 65" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M 45 150 L 55 145" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
  <path d="M 195 150 L 185 145" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Foreground Atmospheric Particles (Golden/Blue Dust) -->
  <circle cx="75" cy="45" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="165" cy="40" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="35" cy="100" r="2.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="205" cy="95" r="2" fill="#ec4899" opacity="0.7"/>
  <circle cx="105" cy="205" r="1.5" fill="#10b981" opacity="0.8"/>
  <circle cx="145" cy="200" r="2" fill="#fbbf24" opacity="0.8"/>

  <!-- Ground reflection and bounce lighting -->
  <path d="M 80 180 Q 120 190 160 180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
</svg>