<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Museum Light Beam -->
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <!-- Exhibit Glow -->
    <radialGradient id="exhibit-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </radialGradient>

    <!-- Glass Dome Shading -->
    <linearGradient id="glass-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Visitor Jacket Gradient -->
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Lighting & Interior Architecture -->
  <!-- Ambient museum spotlight from top-right -->
  <polygon points="240,0 120,0 40,240 180,240" fill="url(#light-beam)" />
  
  <!-- Back Wall Art/Frame 1 -->
  <rect x="25" y="45" width="35" height="50" rx="2" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <rect x="29" y="49" width="27" height="36" fill="#1e293b" />
  <circle cx="42" cy="62" r="6" fill="#f59e0b" opacity="0.6" />
  <path d="M34 77 L42 67 L50 77 Z" fill="#10b981" opacity="0.6" />

  <!-- Back Wall Art/Frame 2 -->
  <rect x="70" y="40" width="45" height="60" rx="2" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <rect x="74" y="44" width="37" height="46" fill="#1e293b" />
  <path d="M82 72 Q92 56 102 72 Z" fill="#38bdf8" opacity="0.5" />

  <!-- Floor -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#090d16" />
  <!-- Floor Tile Lines (Perspective) -->
  <path d="M0 200 L40 240 M60 200 L110 240 M120 200 L180 240 M180 200 L230 240" stroke="#1e293b" stroke-width="1.5" opacity="0.7" />
  <line x1="0" y1="215" x2="240" y2="215" stroke="#1e293b" stroke-width="1" opacity="0.5" />

  <!-- Central Exhibit: Ancient Artifact on Pedestal -->
  <!-- Pedestal Base -->
  <polygon points="120,165 155,175 155,205 120,215 85,205 85,175" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <polygon points="120,165 155,175 120,185 85,175" fill="#475569" />
  <polygon points="120,185 155,175 155,205 120,215" fill="#1e293b" opacity="0.5" /> <!-- Shadow side -->
  
  <!-- Exhibit Glow effect -->
  <circle cx="120" cy="140" r="30" fill="url(#exhibit-glow)" />

  <!-- Artifact (Golden Relic / Vase structure) -->
  <path d="M110 165 C105 150 112 135 110 120 L130 120 C128 135 135 150 130 165 Z" fill="#f59e0b" />
  <path d="M106 120 C106 115 134 115 134 120 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
  <circle cx="120" cy="142" r="5" fill="#10b981" />

  <!-- Glass Display Dome -->
  <path d="M98 175 C95 140 105 120 120 120 C135 120 145 140 142 175 Z" fill="url(#glass-sheen)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
  <!-- Glass Reflection highlight -->
  <path d="M104 150 C106 135 112 126 118 123" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Foreground: Curious Visitor (Touring/Tham quan) -->
  <!-- Body/Torso leaning slightly forward -->
  <path d="M22 240 C22 215 35 200 50 190 L62 215 C55 220 48 230 45 240 Z" fill="url(#jacket-grad)" />
  
  <!-- Visitor Backpack -->
  <path d="M15 205 C15 190 25 185 30 195 L32 230 C25 230 15 220 15 205 Z" fill="#38bdf8" />

  <!-- Visitor Neck & Head -->
  <rect x="42" y="178" width="10" height="15" fill="#fcd34d" />
  <circle cx="47" cy="165" r="14" fill="#fcd34d" />
  
  <!-- Hair -->
  <path d="M33 162 C33 150 50 148 60 160 C58 153 45 150 38 158 Z" fill="#334155" />

  <!-- Visitor Arm pointing/holding guide audio device -->
  <path d="M48 195 L72 175 L78 185 L58 208 Z" fill="#ec4899" />
  <!-- Hand pointing towards exhibit -->
  <circle cx="78" cy="183" r="4" fill="#fcd34d" />

  <!-- Tour Guide Lanyard / Audio Guide Device -->
  <path d="M43 185 L52 205" stroke="#38bdf8" stroke-width="2" />
  <rect x="50" y="200" width="8" height="12" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />

  <!-- Atmospheric Museum Details: Ropes & Stanchions -->
  <!-- Stanchion Left -->
  <rect x="75" y="195" width="6" height="45" fill="#cbd5e1" />
  <circle cx="78" cy="193" r="5" fill="#f59e0b" />
  
  <!-- Velvet Rope connecting to exhibition -->
  <path d="M78 198 Q100 215 120 215" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

  <!-- Small info plaque on pedestal -->
  <rect x="135" y="190" width="14" height="10" rx="1" fill="#f8fafc" transform="rotate(15 135 190)" />

  <!-- Floating Sparkles / Museum Atmosphere Particles -->
  <circle cx="100" cy="100" r="1.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="140" cy="90" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="160" cy="130" r="1" fill="#ffffff" opacity="0.9" />
  <circle cx="80" cy="130" r="2" fill="#fbbf24" opacity="0.5" />
  <circle cx="120" cy="80" r="1.5" fill="#38bdf8" opacity="0.7" />

  <!-- Foreground Vignette / Frame Border Overlay -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="3" opacity="0.5" />
</svg>