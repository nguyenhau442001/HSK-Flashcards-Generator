<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients, glows, and clip paths -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="padGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="screenClip">
      <rect x="76" y="44" width="88" height="52" rx="6"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Atmospheric background glowing elements -->
  <circle cx="120" cy="110" r="80" fill="#38bdf8" opacity="0.05" filter="url(#softGlow)"/>
  <circle cx="120" cy="150" r="50" fill="#f59e0b" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Ambient background desk surface line -->
  <path d="M 20 200 L 220 200" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="120" cy="202" rx="90" ry="12" fill="#090d16" opacity="0.6" filter="url(#glow)"/>

  <!-- BACK SHADOW OF THE SAFE / PASSWORD CONSOLE -->
  <rect x="52" y="32" width="136" height="152" rx="16" fill="#090d16" opacity="0.5" filter="url(#glow)"/>

  <!-- MAIN HARDWARE HOUSING (Modern futuristic secure console) -->
  <rect x="48" y="28" width="144" height="160" rx="14" fill="url(#padGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="52" y="32" width="136" height="152" rx="12" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- CONSOLE SCREEN -->
  <rect x="72" y="40" width="96" height="60" rx="8" fill="#334155"/>
  <rect x="74" y="42" width="92" height="56" rx="6" fill="url(#screenGrad)"/>

  <!-- Screen Grid Accent lines -->
  <line x1="74" y1="56" x2="166" y2="56" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="74" y1="78" x2="166" y2="78" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- Password Masking Stars (Mật khẩu dots/asterisks) -->
  <g filter="url(#glow)">
    <circle cx="95" cy="70" r="5" fill="url(#cyanGrad)"/>
    <circle cx="112" cy="70" r="5" fill="url(#cyanGrad)"/>
    <circle cx="129" cy="70" r="5" fill="url(#cyanGrad)"/>
    <circle cx="146" cy="70" r="5" fill="url(#cyanGrad)"/>
  </g>

  <!-- Screen Status Indicator -->
  <circle cx="82" cy="50" r="2.5" fill="#ef4444"/>
  <circle cx="90" cy="50" r="2.5" fill="#f59e0b"/>
  <circle cx="98" cy="50" r="2.5" fill="#10b981"/>

  <!-- KEYPAD BUTTONS GRID -->
  <!-- Row 1: 1, 2, 3 -->
  <rect x="72" y="108" width="26" height="18" rx="4" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <circle cx="85" cy="117" r="3" fill="#cbd5e1"/>

  <rect x="107" y="108" width="26" height="18" rx="4" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <circle cx="120" cy="117" r="3" fill="#cbd5e1"/>

  <rect x="142" y="108" width="26" height="18" rx="4" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <circle cx="155" cy="117" r="3" fill="#cbd5e1"/>

  <!-- Row 2: 4, 5, 6 -->
  <rect x="72" y="130" width="26" height="18" rx="4" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <circle cx="85" cy="139" r="3" fill="#cbd5e1"/>

  <rect x="107" y="130" width="26" height="18" rx="4" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <circle cx="120" cy="139" r="3" fill="#cbd5e1"/>

  <rect x="142" y="130" width="26" height="18" rx="4" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <circle cx="155" cy="139" r="3" fill="#cbd5e1"/>

  <!-- Row 3: 7, 8, 9 -->
  <rect x="72" y="152" width="26" height="18" rx="4" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <circle cx="85" cy="161" r="3" fill="#cbd5e1"/>

  <rect x="107" y="152" width="26" height="18" rx="4" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <circle cx="120" cy="161" r="3" fill="#cbd5e1"/>

  <rect x="142" y="152" width="26" height="18" rx="4" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <circle cx="155" cy="161" r="3" fill="#cbd5e1"/>

  <!-- FINGERPRINT SCANNER / ENTER KEY (Action element) -->
  <g transform="translate(175, 105)">
    <!-- Glowing background accent for scanner -->
    <rect x="-4" y="-4" width="26" height="42" rx="6" fill="#10b981" opacity="0.2" filter="url(#glow)"/>
    <rect x="0" y="0" width="18" height="34" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <!-- Fingerprint glowing icon graphic -->
    <path d="M 9 7 C 7 7 6 9 6 11 C 6 13 8 14 9 16 C 10 14 12 13 12 11 C 12 9 11 7 9 7 Z" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 6 19 C 5 17 4 15 4 11 C 4 7 7 5 9 5 C 11 5 14 7 14 11 C 14 15 13 17 12 19" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- ACTION-PACKED ENVIROMENTAL PROPS & FLOATING ELEMENTS -->
  <!-- Golden Access Key floating on the upper left -->
  <g transform="translate(26, 52) rotate(-25)" filter="url(#glow)">
    <circle cx="12" cy="12" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="12" cy="12" r="3" fill="#fef08a"/>
    <line x1="18" y1="18" x2="32" y2="32" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="26" y1="24" x2="30" y2="20" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="29" y1="27" x2="33" y2="23" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Glowing Security Shield / Checkmark Badge on upper right -->
  <g transform="translate(192, 38)" filter="url(#glow)">
    <path d="M 12 2 L 22 6 L 22 14 C 22 20 17 24 12 26 C 7 24 2 20 2 14 L 2 6 Z" fill="url(#emeraldGrad)" opacity="0.9"/>
    <!-- Checkmark -->
    <path d="M 7 13 L 10 16 L 17 9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Binary/Code Decryption Particles (Action context) -->
  <g opacity="0.8">
    <!-- Emerald glowing dots & dashes representing secure data entry -->
    <rect x="36" y="116" width="10" height="4" rx="2" fill="#34d399" filter="url(#glow)"/>
    <circle cx="30" cy="136" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <rect x="200" y="130" width="12" height="4" rx="2" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="205" cy="155" r="2.5" fill="#34d399" filter="url(#glow)"/>
    
    <!-- Binary floaters -->
    <text x="35" y="95" fill="#38bdf8" font-family="monospace" font-size="10" opacity="0.5">1</text>
    <text x="25" y="105" fill="#34d399" font-family="monospace" font-size="10" opacity="0.4">0</text>
    <text x="205" y="90" fill="#fbbf24" font-family="monospace" font-size="10" opacity="0.5">0</text>
    <text x="215" y="102" fill="#38bdf8" font-family="monospace" font-size="10" opacity="0.4">1</text>
  </g>

  <!-- Dynamic Security Laser / Energy Beam Sweep -->
  <path d="M 48 28 L 192 28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
  <path d="M 60 188 L 180 188" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" opacity="0.6"/>

  <!-- Dynamic Sparkles / Energy Bursts -->
  <g fill="#fbbf24" filter="url(#glow)">
    <path d="M 182 75 L 185 82 L 192 85 L 185 88 L 182 95 L 179 88 L 172 85 L 179 82 Z" transform="scale(0.5) translate(190, 40)"/>
    <path d="M 62 155 L 64 160 L 69 162 L 64 164 L 62 169 L 60 164 L 55 162 L 60 160 Z" transform="scale(0.6) translate(30, 110)"/>
  </g>
</svg>