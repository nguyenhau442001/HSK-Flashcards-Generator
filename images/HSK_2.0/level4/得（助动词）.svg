<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Night Glow from Lamp -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Bed Cover Gradient -->
    <linearGradient id="bedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Clock Glow (Urgent/Action) -->
    <radialGradient id="clockGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light from Lamp -->
  <circle cx="180" cy="90" r="120" fill="url(#lampGlow)" />

  <!-- SCENE LAYER: Bedroom Interior -->
  <!-- Wall Art / Window Frame -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="50" height="60" rx="8" fill="#334155" opacity="0.6" />
    <!-- Moon & Stars outside window -->
    <circle cx="35" cy="20" r="8" fill="#fde047" opacity="0.8" />
    <path d="M12 25 L14 30 L19 31 L15 35 L16 40 L12 37 L8 40 L9 35 L5 31 L10 30 Z" fill="#94a3b8" transform="scale(0.5) translate(15, 10)" opacity="0.6"/>
  </g>

  <!-- Bedside Table -->
  <rect x="145" y="110" width="60" height="65" rx="6" fill="#475569" filter="url(#shadow)" />
  <rect x="155" y="125" width="40" height="15" rx="3" fill="#334155" />
  <circle cx="175" cy="132" r="2" fill="#fbbf24" />

  <!-- Alarm Clock (Must wake up / sleep early context) -->
  <g transform="translate(160, 75)" filter="url(#shadow)">
    <circle cx="15" cy="15" r="18" fill="url(#clockGlow)" />
    <circle cx="15" cy="15" r="14" fill="#f1f5f9" />
    <circle cx="15" cy="15" r="12" fill="#ffffff" />
    <!-- Clock hands -->
    <line x1="15" y1="15" x2="15" y2="8" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="15" x2="21" y2="15" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="15" cy="15" r="1.5" stroke="#1e293b" fill="#ef4444" />
    <!-- Clock feet & bells -->
    <path d="M7 3 L9 6 M23 3 L21 6" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <circle cx="15" cy="2" r="3" fill="#cbd5e1" />
  </g>

  <!-- Bed & Pillow -->
  <g filter="url(#shadow)">
    <!-- Headboard -->
    <rect x="25" y="90" width="130" height="85" rx="12" fill="#334155" />
    <!-- Pillow -->
    <rect x="40" y="105" width="70" height="35" rx="12" fill="#f8fafc" />
    <!-- Duvet / Blanket (Cozy bed scene) -->
    <path d="M30 120 Q85 110 140 125 L140 190 L30 190 Z" fill="url(#bedGrad)" />
    <path d="M30 135 Q85 125 140 140" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- CHARACTER: Sleeping / Resting Character -->
  <g id="character" transform="translate(25, 40)" filter="url(#shadow)">
    <!-- Character Head resting on pillow -->
    <circle cx="65" cy="85" r="22" fill="#fed7aa" />
    <!-- Closed Happy Eyes (Sleeping) -->
    <path d="M57 87 Q61 91 65 87" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M69 87 Q73 91 77 87" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Cute Rosy Cheeks -->
    <circle cx="58" cy="91" r="4" fill="#f43f5e" opacity="0.3" />
    <circle cx="76" cy="91" r="4" fill="#f43f5e" opacity="0.3" />
    <!-- Hair -->
    <path d="M45 85 C45 68 60 65 72 68 C84 71 85 85 85 85 Z" fill="#334155" />
    <path d="M65 67 Q75 62 82 72" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Nightshirt Shoulder -->
    <path d="M45 105 Q65 95 85 105 L90 120 L40 120 Z" fill="#cbd5e1" />
  </g>

  <!-- URGENCY / ACTION PROPS: Glowing "Must do" indicator -->
  <!-- Floating action glow elements reinforcing 'have to / must' (děi) -->
  <g transform="translate(110, 45)">
    <!-- Pulsing action star/sparkles -->
    <path d="M 0 10 Q 10 10 10 0 Q 10 10 20 10 Q 10 10 10 20 Q 10 10 0 10 Z" fill="#fbbf24" filter="url(#shadow)" />
  </g>
  <g transform="translate(45, 30)">
    <path d="M 0 6 Q 6 6 6 0 Q 6 6 12 6 Q 6 6 6 12 Q 6 6 0 6 Z" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Floor line / Room grounding -->
  <rect x="0" y="205" width="240" height="35" fill="#0f172a" />
  <line x1="0" y1="205" x2="240" y2="205" stroke="#334155" stroke-width="2" />

  <!-- Slippers neatly placed on floor (Ready for tomorrow, prompt action context) -->
  <g transform="translate(80, 210)" filter="url(#shadow)">
    <!-- Left Slipper -->
    <path d="M0 6 C0 2 5 0 12 0 C18 0 22 3 22 7 C22 10 18 12 12 12 C4 12 0 10 0 6 Z" fill="#f43f5e" />
    <path d="M4 6 C4 4 8 3 12 3 C16 3 18 4 18 6 C18 8 16 9 12 9 C8 9 4 8 4 6 Z" fill="#fda4af" />
    <!-- Right Slipper -->
    <rect x="28" y="2" width="22" height="10" rx="5" fill="#f43f5e" />
    <rect x="30" y="4" width="18" height="6" rx="3" fill="#fda4af" />
  </g>
</svg>