<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Amber Glow for Baking/Cooking Scene -->
    <radialGradient id="counterGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Flour / Sugar Jar Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Wood Texture / Countertop -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="15%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Egg Gradient -->
    <radialGradient id="eggGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="60%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <!-- Soft Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Lighting Effect -->
  <circle cx="120" cy="140" r="100" fill="url(#counterGlow)" />

  <!-- BACKGROUND KITCHEN PROPS (Shelf & Jars) -->
  <g opacity="0.4">
    <!-- Back Shelf -->
    <rect x="30" y="55" width="180" height="6" rx="3" fill="#475569" />
    <!-- Small spice jar left -->
    <rect x="50" y="30" width="18" height="25" rx="3" fill="#06b6d4" />
    <rect x="47" y="27" width="24" height="5" rx="2" fill="#94a3b8" />
    <!-- Small spice jar right -->
    <rect x="175" y="26" width="22" height="29" rx="3" fill="#ec4899" />
    <rect x="172" y="22" width="28" height="5" rx="2" fill="#94a3b8" />
  </g>

  <!-- COUNTERTOP -->
  <rect x="0" y="175" width="240" height="65" fill="url(#counterGrad)" filter="url(#shadow)" />
  <rect x="0" y="175" width="240" height="5" fill="#64748b" />

  <!-- MAIN SCENE: INGREDIENTS & MATERIALS (材料) -->
  
  <!-- 1. Mixing Bowl (Centerpiece Container) -->
  <g filter="url(#shadow)">
    <!-- Bowl Back Rim -->
    <ellipse cx="120" cy="130" rx="65" ry="16" fill="#cbd5e1" />
    <!-- Bowl Inner Shadow/Depth -->
    <ellipse cx="120" cy="132" rx="57" ry="12" fill="#475569" />
    <!-- Flour inside bowl -->
    <ellipse cx="120" cy="134" rx="52" ry="9" fill="#f8fafc" />
    <!-- Bowl Body -->
    <path d="M 55 130 C 55 175, 65 185, 120 185 C 175 185, 185 175, 185 130 Z" fill="#f1f5f9" />
    <!-- Bowl Highlight Stripe -->
    <path d="M 62 138 C 70 168, 85 177, 115 181" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- 2. Butter Block (Left Raw Material) -->
  <g transform="translate(25, 145)" filter="url(#shadow)">
    <!-- Butter wrapper base -->
    <path d="M 0 15 L 12 0 L 42 5 L 35 25 L 0 15 Z" fill="#fef08a" />
    <!-- Butter front face -->
    <path d="M 0 15 L 35 25 L 35 35 L 0 25 Z" fill="#fde047" />
    <!-- Butter top face -->
    <path d="M 12 0 L 42 5 L 35 25 L 0 15 Z" fill="#fef9c3" />
    <!-- Foil wrap reflection -->
    <path d="M 16 4 L 38 8 L 33 20 L 13 14 Z" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- 3. Eggs (Right Raw Materials) -->
  <g transform="translate(170, 150)" filter="url(#shadow)">
    <!-- Egg 1 (Back) -->
    <ellipse cx="15" cy="10" rx="11" ry="14" fill="url(#eggGrad)" transform="rotate(-15 15 10)" />
    <!-- Egg 2 (Front) -->
    <ellipse cx="28" cy="16" rx="11" ry="14" fill="url(#eggGrad)" transform="rotate(20 28 16)" />
    <!-- Cracked open shell piece with yolk accent -->
    <path d="M 2 20 Q 8 28 16 22" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="5" fill="#f59e0b" />
  </g>

  <!-- 4. Milk Jug / Liquid Ingredient (Left Background) -->
  <g transform="translate(38, 90)" filter="url(#shadow)">
    <!-- Jug Body -->
    <path d="M 10 15 C 5 25, 5 55, 10 70 C 15 80, 35 80, 40 70 C 45 55, 45 25, 40 15 Z" fill="#38bdf8" />
    <!-- Jug Handle -->
    <path d="M 8 25 C -2 30, -2 55, 8 60" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <!-- Jug Lip/Spout -->
    <path d="M 38 15 L 45 10 L 42 20 Z" fill="#38bdf8" />
    <!-- White label/milk content line -->
    <path d="M 12 40 Q 25 35 38 42 L 39 65 C 38 72, 12 72, 11 65 Z" fill="#f0fdf4" opacity="0.9" />
  </g>

  <!-- 5. Glass Jar with Berries/Ingredients (Right Background) -->
  <g transform="translate(155, 75)" filter="url(#shadow)">
    <!-- Jar Lid -->
    <rect x="10" y="0" width="30" height="10" rx="3" fill="#cbd5e1" />
    <rect x="5" y="8" width="40" height="4" rx="1" fill="#94a3b8" />
    <!-- Jar Body -->
    <rect x="8" y="12" width="34" height="55" rx="8" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="1.5" />
    <!-- Berries inside jar (Red accents) -->
    <circle.1></circle.1>
    <circle cx="20" cy="45" r="5" fill="#ef4444" />
    <circle cx="30" cy="50" r="6" fill="#dc2626" />
    <circle cx="25" cy="58" r="5.5" fill="#b91c1c" />
    <circle cx="18" cy="55" r="4" fill="#ef4444" />
    <!-- Glass reflection highlight -->
    <path d="M 12 18 L 12 60" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- 6. Action Elements / Sprinkles / Powder puffs (Dynamic Flour Dust) -->
  <g fill="#f8fafc" opacity="0.8">
    <circle cx="100" cy="110" r="2.5" />
    <circle cx="140" cy="105" r="1.5" />
    <circle cx="125" cy="98" r="3" />
    <circle cx="110" cy="92" r="2" />
  </g>
  
  <!-- Floating Golden Sparkles (Representing rich organic material/quality) -->
  <g fill="#fbbf24">
    <!-- Star sparkle left -->
    <path d="M 75 75 Q 75 82 68 82 Q 75 82 75 89 Q 75 82 82 82 Q 75 82 75 75 Z" />
    <!-- Star sparkle right -->
    <path d="M 160 55 Q 160 60 155 60 Q 160 60 160 65 Q 160 60 165 60 Q 160 60 160 55 Z" transform="scale(0.8) translate(40, 10)" />
  </g>

  <!-- 7. Wooden Spoon / Whisk Resting on Counter -->
  <g transform="translate(90, 145) rotate(-25)" filter="url(#shadow)">
    <!-- Whisk Handle -->
    <rect x="0" y="0" width="45" height="8" rx="4" fill="#d97706" />
    <rect x="0" y="0" width="45" height="3" rx="1.5" fill="#fbbf24" opacity="0.4" />
    <!-- Whisk Loops -->
    <path d="M 45 4 C 65 -5, 75 13, 45 4" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <path d="M 45 4 C 70 2, 70 6, 45 4" fill="none" stroke="#94a3b8" stroke-width="2" />
    <path d="M 45 4 C 60 -2, 65 10, 45 4" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
  </g>

</svg>