<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Podium Gradient -->
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Confetti Gradients -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Spotlight -->
  <rect width="240" height="240" rx="24" fill="url(#spotlight)"/>

  <!-- Background Decor: Celebration Lights/Bunting -->
  <g opacity="0.3">
    <path d="M 0 40 Q 60 70 120 40 T 240 40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 0 20 Q 60 50 120 20 T 240 20" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>

  <!-- Confetti / Floating Elements -->
  <g>
    <!-- Stars & Circles -->
    <path d="M35,60 L38,68 L46,71 L38,74 L35,82 L32,74 L24,71 L32,68 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M205,50 L207,55 L212,57 L207,59 L205,64 L203,59 L198,57 L203,55 Z" fill="#38bdf8" opacity="0.8"/>
    <circle cx="180" cy="90" r="3.5" fill="#ec4899"/>
    <circle cx="55" cy="110" r="2.5" fill="#10b981"/>
    <rect x="210" y="120" width="6" height="6" rx="1" fill="#fbbf24" transform="rotate(25 213 123)" opacity="0.7"/>
    <rect x="25" y="140" width="8" height="5" rx="1" fill="#38bdf8" transform="rotate(-15 29 1425)" opacity="0.7"/>
  </g>

  <!-- Grand Event Stage Backdrop (Arches & Curtains) -->
  <g>
    <!-- Back Curtains -->
    <path d="M 20 180 Q 20 70 70 60 Q 120 70 120 180 Z" fill="#1e293b" opacity="0.5"/>
    <path d="M 120 180 Q 120 70 170 60 Q 220 70 220 180 Z" fill="#1e293b" opacity="0.5"/>
    
    <!-- Arch Structure -->
    <path d="M 40 190 L 40 90 C 40 60, 200 60, 200 90 L 200 190 Z" fill="none" stroke="#334155" stroke-width="4"/>
  </g>

  <!-- Festive Ribbon Banners (Symbolizing a Ceremony/Event) -->
  <g>
    <path d="M 30 100 Q 120 130 210 100" fill="none" stroke="url(#ribbonGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 30 100 Q 120 130 210 100" fill="none" stroke="#fda4af" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Ribbon Tails -->
    <path d="M 35 102 L 20 120 L 30 115 L 40 122 Z" fill="#e11d48"/>
    <path d="M 205 102 L 220 120 L 210 115 L 200 122 Z" fill="#e11d48"/>
  </g>

  <!-- Main Stage Podium & Props -->
  <g>
    <!-- Podium Shadow -->
    <ellipse cx="120" cy="192" rx="65" ry="12" fill="#020617" opacity="0.6"/>

    <!-- Podium Base -->
    <path d="M 80 175 L 160 175 L 170 195 L 70 195 Z" fill="#475569"/>
    <path d="M 75 165 L 165 165 L 160 175 L 80 175 Z" fill="url(#podiumGrad)"/>
    
    <!-- Podium Front Emblem / Gold Trim -->
    <path d="M 110 173 L 130 173 L 125 187 L 115 187 Z" fill="#fbbf24"/>

    <!-- Microphone & Stand (Event/Ceremony element) -->
    <path d="M 120 165 L 120 125" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Mic Head -->
    <path d="M 117 115 C 117 110, 123 110, 123 115 L 123 123 C 123 128, 117 128, 117 123 Z" fill="#fbbf24"/>
    <path d="M 118 116 L 122 116 M 118 119 L 122 119" stroke="#78350f" stroke-width="1"/>
  </g>

  <!-- Central Action Focus: Golden Ceremonial Trophy / Award (Representing "Holding/Organizing an event") -->
  <g>
    <!-- Trophy Glow -->
    <circle cx="120" cy="115" r="30" fill="#fbbf24" opacity="0.15" filter="blur(8px)"/>

    <!-- Trophy Base -->
    <rect x="111" y="148" width="18" height="6" rx="2" fill="#64748b"/>
    <path d="M 114 140 L 126 140 L 128 148 L 112 148 Z" fill="#94a3b8"/>

    <!-- Trophy Cup Body -->
    <path d="M 104 95 C 104 125, 136 125, 136 95 Z" fill="url(#goldGlow)"/>
    <!-- Cup Rim -->
    <ellipse cx="120" cy="95" rx="16" ry="4" fill="#fef08a"/>
    <ellipse cx="120" cy="95" rx="14" ry="2.5" fill="url(#goldGlow)"/>

    <!-- Trophy Handles -->
    <path d="M 105 100 C 95 100, 95 118, 106 120" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 135 100 C 145 100, 145 118, 134 120" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Star on Trophy -->
    <path d="M120,103 L122,108 L127,109 L123,112 L125,117 L120,114 L115,117 L117,112 L113,109 L118,108 Z" fill="#fef08a"/>
  </g>

  <!-- Foreground Atmospheric Elements (Depth of Field) -->
  <g opacity="0.7">
    <!-- Bokeh circles foreground -->
    <circle cx="30" cy="210" r="6" fill="#38bdf8" filter="blur(2px)"/>
    <circle cx="215" cy="190" r="8" fill="#ec4899" filter="blur(3px)"/>
    <circle cx="190" cy="220" r="4" fill="#fbbf24" filter="blur(1px)"/>
  </g>
</svg>