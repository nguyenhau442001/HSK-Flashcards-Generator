<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#331e13"/>
      <stop offset="50%" stop-color="#4a2c17"/>
      <stop offset="100%" stop-color="#331e13"/>
    </linearGradient>

    <!-- Warm Light Beam Gradient -->
    <linearGradient id="lightBeam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)" />

  <!-- Room Interior Structure -->
  <!-- Back wall & Dim Corner -->
  <path d="M 0 0 L 240 0 L 240 180 L 0 180 Z" fill="#111827" />
  
  <!-- Floor Surface -->
  <path d="M 0 180 L 240 180 L 240 240 L 0 240 Z" fill="url(#floorGrad)" />
  <!-- Floor line perspective -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>

  <!-- Wallpaper details / shadows -->
  <rect x="25" y="40" width="45" height="60" rx="4" fill="#1f2937" opacity="0.6"/>
  <rect x="30" y="45" width="35" height="50" fill="#111827" opacity="0.6"/>

  <!-- Bookshelf / Prop in background (Low light) -->
  <rect x="180" y="90" width="40" height="90" fill="#1a2333"/>
  <rect x="185" y="115" width="30" height="6" fill="#293548"/>
  <rect x="185" y="145" width="30" height="6" fill="#293548"/>
  <path d="M 190 115 L 195 100 L 202 115 Z" fill="#ef4444" opacity="0.7"/>
  <path d="M 204 145 L 210 130 L 215 145 Z" fill="#3b82f6" opacity="0.7"/>

  <!-- Desk Surface -->
  <path d="M 20 180 L 220 180 L 235 215 L 5 215 Z" fill="url(#deskGrad)" />
  <path d="M 15 180 L 225 180" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
  <!-- Desk Edge Highlight -->
  <path d="M 5 215 L 235 215" stroke="#1e1007" stroke-width="2"/>

  <!-- Objects on Desk (Low Light Context) -->
  <!-- Mug -->
  <rect x="175" y="165" width="16" height="20" rx="3" fill="#cbd5e1"/>
  <path d="M 191 170 C 197 170 197 180 191 180" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Stack of Books -->
  <rect x="145" y="170" width="26" height="15" rx="2" fill="#475569"/>
  <rect x="142" y="185" width="30" height="15" rx="2" fill="#0284c7"/>

  <!-- THE LIGHT SOURCE: Desk Lamp (Action Subject) -->
  <!-- Lamp Base -->
  <ellipse cx="75" cy="183" rx="18" ry="7" fill="#475569"/>
  <ellipse cx="75" cy="181" rx="14" ry="5" fill="#64748b"/>
  
  <!-- Articulated Lamp Arm -->
  <path d="M 73 181 L 65 130" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <circle cx="65" cy="130" r="4" fill="#334155"/>
  <path d="M 65 130 L 85 95" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <circle cx="85" cy="95" r="4" fill="#334155"/>

  <!-- Lamp Shade (Cone) -->
  <g transform="translate(85, 95) rotate(-25)">
    <path d="M -16 -12 L 16 -12 L 24 10 L -24 10 Z" fill="#38bdf8"/>
    <!-- Lamp Shade Rim -->
    <ellipse cx="0" cy="10" rx="24" ry="5" fill="#0ea5e9"/>
    <!-- Bulb housing inside -->
    <circle cx="0" cy="3" r="6" fill="#fef08a" filter="url(#glow)"/>
  </g>

  <!-- AMBIENT LIGHT & SHADOWS (Visualizing 'Ánh Sáng') -->
  <!-- Volumetric Light Beam/Cone radiating from lamp -->
  <polygon points="90,102 240,135 240,240 60,215" fill="url(#lightBeam)" style="mix-blend-mode: screen;" />

  <!-- Intense Spotlight Floor Splash -->
  <ellipse cx="140" cy="205" rx="75" ry="22" fill="#fef08a" opacity="0.35" filter="url(#softGlow)"/>
  <ellipse cx="135" cy="204" rx="45" ry="12" fill="#fde047" opacity="0.5"/>

  <!-- Centerpiece Object inside the Light (An Open Picture Book / Notebook) -->
  <g transform="translate(115, 185)">
    <!-- Book Shadow -->
    <ellipse cx="0" cy="18" rx="28" ry="6" fill="#000" opacity="0.6" filter="url(#glow)"/>
    
    <!-- Open Book Cover -->
    <path d="M -32 12 L 0 17 L 32 12 L 32 16 L 0 21 L -32 16 Z" fill="#f43f5e"/>
    
    <!-- Open Pages (Left & Right) -->
    <path d="M -30 10 C -15 12 0 8 0 2 L 0 17 C 0 22 -15 20 -30 18 Z" fill="#f8fafc"/>
    <path d="M 30 10 C 15 12 0 8 0 2 L 0 17 C 0 22 15 20 30 18 Z" fill="#f1f5f9"/>

    <!-- Page Content (Abstract illustrations & lines representing study) -->
    <line x1="-22" y1="7" x2="-8" y2="9" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-24" y1="11" x2="-10" y2="13" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-16" cy="4" r="2.5" fill="#38bdf8"/>

    <line x1="8" y1="7" x2="22" y2="9" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="11" x2="24" y2="13" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 12 3 L 15 6 L 19 2" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Dust Motes / Light Particles in the Beam -->
  <circle cx="110" cy="140" r="1.5" fill="#fef08a" opacity="0.8" filter="url(#glow)"/>
  <circle cx="130" cy="160" r="2" fill="#fef08a" opacity="0.9" filter="url(#glow)"/>
  <circle cx="155" cy="135" r="1" fill="#ffffff" opacity="0.9"/>
  <circle cx="175" cy="175" r="1.5" fill="#fde047" opacity="0.7"/>
  <circle cx="100" cy="180" r="2" fill="#fef08a" opacity="0.6"/>
  <circle cx="195" cy="155" r="1" fill="#fef08a" opacity="0.8"/>
  <circle cx="140" cy="120" r="1.5" fill="#ffffff" opacity="0.7"/>

  <!-- Foreground Atmospheric Vignette / Frame Polish -->
  <circle cx="205" cy="55" r="12" fill="#38bdf8" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="205" cy="55" r="4" fill="#38bdf8" opacity="0.4" filter="url(#glow)"/>
</svg>