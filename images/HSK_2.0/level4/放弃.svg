<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Mountain Gradient (Distant) -->
    <linearGradient id="mountain-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Mountain Gradient (Foreground) -->
    <linearGradient id="mountain-fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Sunrise / Glow Gradient -->
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Trail Rope Gradient -->
    <linearGradient id="rope-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Backpack Gradient -->
    <linearGradient id="bag-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Marker/Flag Gradient -->
    <linearGradient id="flag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="240" height="240" rx="24" fill="url(#bg-grad)" />

  <!-- Atmospheric Glow (Sunrise at Summit) -->
  <circle cx="160" cy="110" r="70" fill="url(#sun-glow)" />

  <!-- Background Mountain Range -->
  <polygon points="10,240 100,120 190,240" fill="url(#mountain-bg)" />
  <polygon points="90,240 170,90 240,240" fill="url(#mountain-bg)" opacity="0.7" />

  <!-- Foreground Mountain Peak -->
  <polygon points="30,240 130,70 240,240" fill="url(#mountain-fg)" />
  <!-- Mountain snow cap / highlight -->
  <path d="M 130,70 L 155,115 L 140,120 L 125,105 L 110,118 Z" fill="#f8fafc" opacity="0.9" />

  <!-- Summit Flag Marker (The Goal) -->
  <line x1="130" y1="70" x2="130" y2="45" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="130,45 150,52 130,59" fill="url(#flag-grad)" />

  <!-- Winding Mountain Trail -->
  <path d="M 40,220 Q 90,190 70,160 Q 50,130 100,110 Q 135,95 130,70" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <path d="M 40,220 Q 90,190 70,160 Q 50,130 100,110 Q 135,95 130,70" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" />

  <!-- Dropped/Abandoned Climbing Gear (Visual Metaphor for NOT Giving Up / Overcoming Giving Up) -->
  <!-- A discarded heavy backpack and coiled rope sitting off to the side, while the climber pushes upward -->
  <g transform="translate(62, 145) rotate(-15)">
    <!-- Coiled Rope -->
    <ellipse cx="0" cy="15" rx="14" ry="7" fill="none" stroke="url(#rope-grad)" stroke-width="4" />
    <ellipse cx="0" cy="12" rx="12" ry="6" fill="none" stroke="url(#rope-grad)" stroke-width="4" />
    <ellipse cx="0" cy="9" rx="10" ry="5" fill="none" stroke="url(#rope-grad)" stroke-width="4" />
    
    <!-- Backpack (Left Behind / Temptation to Quit) -->
    <rect x="-10" y="-5" width="20" height="22" rx="6" fill="url(#bag-grad)" />
    <!-- Backpack straps -->
    <path d="M -6,-5 C -10,-12 6,-12 2,-5" fill="none" stroke="#991b1b" stroke-width="3" />
    <rect x="-6" y="2" width="12" height="8" rx="2" fill="#7f1d1d" opacity="0.6" />
    <!-- Sleeping roll on top of pack -->
    <rect x="-14" y="-10" width="28" height="7" rx="3.5" fill="#10b981" />
  </g>

  <!-- Ice Axe Stuck in Rock (Symbol of persistence/climbing on) -->
  <g transform="translate(95, 125) rotate(25)">
    <!-- Axe Handle -->
    <rect x="-2" y="-20" width="4" height="35" rx="2" fill="#38bdf8" />
    <!-- Axe Head -->
    <path d="M -10,-20 L 8,-20 C 10,-20 12,-17 8,-15 L -2,-15 Z" fill="#e2e8f0" />
    <!-- Grip tape -->
    <line x1="-2" y1="-5" x2="2" y2="-5" stroke="#0f172a" stroke-width="1" />
    <line x1="-2" y1="0" x2="2" y2="0" stroke="#0f172a" stroke-width="1" />
    <line x1="-2" y1="5" x2="2" y2="5" stroke="#0f172a" stroke-width="1" />
  </g>

  <!-- Main Active Climber Character (Continuing the Journey, Rejecting "Quitting") -->
  <g transform="translate(115, 95)">
    <!-- Climber Body / Dynamic Lean into the mountain -->
    <!-- Backpack worn by active climber -->
    <path d="M -12,5 L -4,0 L 2,12 L -6,17 Z" fill="#0284c7" />
    
    <!-- Torso (Orange jacket) -->
    <path d="M -8,2 L 6,-4 L 12,12 L -2,18 Z" fill="#fb923c" />

    <!-- Left Arm (Reaching up, gripping) -->
    <path d="M 4,-2 L 15,-15 L 22,-12" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="22" cy="-12" r="3" fill="#fcd34d" /> <!-- Glove -->

    <!-- Right Arm (Planted for balance) -->
    <path d="M -4,10 L 2,22 L -2,26" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-2" cy="26" r="3" fill="#fcd34d" /> <!-- Glove -->

    <!-- Legs (Climbing motion) -->
    <!-- Back Leg -->
    <path d="M -2,16 L -12,28 L -20,26" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Leg -->
    <path d="M 4,14 L 12,25 L 8,33" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Head & Helmet -->
    <circle cx="5" cy="-9" r="6" fill="#fcd34d" />
    <!-- Helmet -->
    <path d="M -1,-13 C 1,-16 11,-16 12,-9 C 12,-7 11,-7 11,-7 L -1,-7 Z" fill="#38bdf8" />
  </g>

  <!-- Sparkles / Determination Effects -->
  <path d="M 145,60 L 148,68 L 156,71 L 148,74 L 145,82 L 142,74 L 134,71 L 142,68 Z" fill="#ffb020" opacity="0.8" />
  <path d="M 115,45 L 117,49 L 121,51 L 117,53 L 115,57 L 113,53 L 109,51 L 113,49 Z" fill="#ffb020" opacity="0.6" transform="scale(0.7) translate(50, 20)" />

  <!-- Foreground Rock Details / Framing Elements -->
  <path d="M 0,240 L 0,220 L 25,230 L 45,240 Z" fill="#0f172a" />
  <path d="M 240,240 L 240,210 L 210,230 L 190,240 Z" fill="#0f172a" />

</svg>