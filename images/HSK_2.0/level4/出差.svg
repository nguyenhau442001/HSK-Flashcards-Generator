<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm ambient light from airport/hotel window -->
    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Suitcase Gradient -->
    <linearGradient id="caseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Suit Gradient -->
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- ENVIRONMENT / BACKGROUND -->
  <!-- Hotel Room / Airport Lounge Architecture -->
  <!-- Large Window with city skyline silhouette -->
  <path d="M 140,20 L 220,20 L 220,160 L 140,160 Z" fill="url(#windowGlow)"/>
  <path d="M 145,25 L 215,25 L 215,155 L 145,155 Z" fill="#0f172a" opacity="0.6"/>
  
  <!-- City Skyline through window -->
  <path d="M 150,155 L 150,110 L 160,110 L 160,155 L 170,155 L 170,90 L 185,90 L 185,155 L 195,155 L 195,70 L 210,70 L 210,155 Z" fill="#38bdf8" opacity="0.15"/>
  <!-- Window Panes Grid -->
  <line x1="180" y1="25" x2="180" y2="155" stroke="#1e293b" stroke-width="3"/>
  <line x1="145" y1="90" x2="215" y2="90" stroke="#1e293b" stroke-width="3"/>

  <!-- Indoor Decor: Warm Wall Lamp -->
  <path d="M 30,50 L 50,50 L 45,75 L 35,75 Z" fill="#f59e0b" opacity="0.8"/>
  <path d="M 40,50 L 40,30" stroke="#64748b" stroke-width="2"/>
  <circle cx="40" cy="30" r="4" fill="#64748b"/>
  <!-- Light cone from lamp -->
  <polygon points="40,75 10,180 80,180" fill="#f59e0b" opacity="0.06"/>

  <!-- Coat Rack in background -->
  <line x1="90" y1="40" x2="90" y2="190" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M 80,60 C 85,55 95,55 100,60" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M 75,75 C 83,70 97,70 105,75" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="90" cy="190" rx="12" ry="4" fill="#334155"/>

  <!-- Floor Plane -->
  <rect x="0" y="180" width="240" height="60" fill="url(#floorGrad)"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="2"/>

  <!-- PROPS: Rolling Suitcase & Briefcase -->
  <!-- Suitcase Shadow -->
  <ellipse cx="190" cy="192" rx="18" ry="6" fill="#000000" opacity="0.5"/>
  
  <!-- Modern Rolling Suitcase (Teal/Blue) -->
  <g filter="url(#shadow)" transform="translate(165, 120)">
    <!-- Telescopic Handle extended -->
    <path d="M 12,-15 L 12,-40 M 24,-15 L 24,-40 M 10,-40 L 26,-40" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Main Body -->
    <rect x="0" y="0" width="36" height="65" rx="8" fill="url(#caseGrad)"/>
    <!-- Horizontal Ribs for texture -->
    <line x1="0" y1="18" x2="36" y2="18" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="40" x2="36" y2="40" stroke="#0284c7" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="8" cy="68" r="4" fill="#0f172a"/>
    <circle cx="28" cy="68" r="4" fill="#0f172a"/>
    <!-- Zipper line -->
    <path d="M 0,10 L 36,10" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Travel Sticker Accent (Abstract shape, no text) -->
    <rect x="8" y="25" width="12" height="10" rx="2" fill="#fbbf24"/>
  </g>

  <!-- Leather Briefcase / Laptop Bag -->
  <g filter="url(#shadow)" transform="translate(130, 155)">
    <rect x="0" y="0" width="28" height="20" rx="4" fill="#b45309"/>
    <path d="M 8,0 L 8,-4 C 8,-6 20,-6 20,-4 L 20,0" fill="none" stroke="#92400e" stroke-width="3"/>
    <rect x="11" y="8" width="6" height="5" rx="1" fill="#fde68a"/>
  </g>

  <!-- MAIN CHARACTER: Dynamic Business Traveler -->
  <!-- Shadow under character -->
  <ellipse cx="90" cy="192" rx="28" ry="8" fill="#000000" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Legs in motion (Walking stride) -->
    <!-- Back Leg -->
    <path d="M 80,135 L 65,165 L 55,185" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Back Shoe -->
    <path d="M 48,185 L 60,189 L 60,183 Z" fill="#0f172a"/>

    <!-- Front Leg -->
    <path d="M 95,135 L 110,165 L 120,182" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Shoe -->
    <path d="M 115,182 L 130,186 L 125,180 Z" fill="#0f172a"/>

    <!-- Torso (Suit Jacket) -->
    <path d="M 70,80 L 105,80 L 112,135 L 68,135 Z" fill="url(#suitGrad)" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Shirt & Tie -->
    <polygon points="87,80 95,80 95,110 87,110" fill="#f8fafc"/>
    <polygon points="90,87 93,87 95,115 90,125 87,115" fill="#ef4444"/>

    <!-- Open Suit Jacket Lapels -->
    <path d="M 87,80 L 78,115 L 87,135" fill="#1e293b"/>
    <path d="M 95,80 L 104,115 L 95,135" fill="#1e293b"/>

    <!-- Back Arm (Holding suitcase handle) -->
    <path d="M 75,85 L 60,105 L 130,120" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand on suitcase -->
    <circle cx="130" cy="120" r="5" fill="#fbcfe8"/>

    <!-- Front Arm (Raised confidently waving or holding boarding pass/phone) -->
    <path d="M 105,85 L 125,70 L 135,55" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="137" cy="52" r="5" fill="#fbcfe8"/>
    <!-- Prop: Small Smartphone / Boarding Pass in hand -->
    <rect x="135" y="40" width="10" height="15" rx="2" ry="2" fill="#38bdf8" transform="rotate(25, 135, 40)"/>

    <!-- Neck -->
    <rect x="85" y="70" width="10" height="15" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <circle cx="90" cy="55" r="18" fill="#fbcfe8"/>

    <!-- Stylish Hair (Dark, modern cut) -->
    <path d="M 72,55 C 72,40 85,35 100,42 C 105,44 108,50 108,55 C 105,52 102,48 95,47 C 85,46 78,50 72,55 Z" fill="#0f172a"/>

    <!-- Facial Expression: Confident & Optimistic Smile -->
    <!-- Eyes (Happy arcs) -->
    <path d="M 82,53 Q 86,50 90,53" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 94,53 Q 98,50 102,53" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Glasses (Smart professional look) -->
    <rect x="79" y="48" width="12" height="9" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="93" y="48" width="12" height="9" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="91" y1="52" x2="93" y2="52" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Smile -->
    <path d="M 87,62 Q 91,66 95,62" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="81" cy="59" r="3" fill="#f43f5e" opacity="0.3"/>
    <circle cx="101" cy="59" r="3" fill="#f43f5e" opacity="0.3"/>
  </g>

  <!-- FOREGROUND / ATMOSPHERE ACCENTS -->
  <!-- Floating travel elements / Motion lines -->
  <path d="M 125,30 Q 135,25 145,35" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 130,20 Q 140,15 150,25" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Subtle floor reflection and sparkle -->
  <circle cx="150" cy="195" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="70" cy="205" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="190" cy="210" r="2" fill="#ffffff" opacity="0.4"/>
</svg>