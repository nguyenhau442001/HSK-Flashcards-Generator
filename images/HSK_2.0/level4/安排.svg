<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Warm Spotlight / Planning Desk Glow -->
    <radialGradient id="deskGlow" cx="50%" cy="60%" r="55%" fx="50%" fy="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Sticky Note Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Sticky Notes & Elements -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed Background Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Atmospheric Lighting Effect -->
  <rect width="240" height="240" rx="24" fill="url(#deskGlow)"/>

  <!-- ENVIRONMENT & PROPS: Background Wall & Window -->
  <!-- Back Wall Shelf with Activity Props -->
  <g id="background-elements">
    <!-- Bookshelf Line -->
    <rect x="25" y="65" width="70" height="4" rx="2" fill="#334155"/>
    <path d="M 35 65 L 35 45 C 35 43 37 41 39 41 L 45 41 C 47 41 49 43 49 45 L 49 65" fill="#f59e0b" opacity="0.8"/>
    <path d="M 55 65 L 55 48 C 55 46 57 44 59 44 L 64 44 C 66 44 68 46 68 48 L 68 65" fill="#10b981" opacity="0.8"/>
    <path d="M 75 65 L 75 42 C 75 40 77 38 79 38 L 84 38 C 86 38 88 40 88 42 L 88 65" fill="#ec4899" opacity="0.8"/>
    
    <!-- Potted Plant on Shelf -->
    <path d="M 175 65 L 175 52 C 175 50 177 48 179 48 L 191 48 C 193 48 195 50 195 52 L 195 65" fill="#334155"/>
    <ellipse cx="185" cy="48" rx="10" ry="3" fill="#475569"/>
    <path d="M 185 48 C 180 35 170 30 165 25 C 175 25 185 32 185 48 Z" fill="#10b981"/>
    <path d="M 185 48 C 190 35 200 30 205 25 C 195 25 185 32 185 48 Z" fill="#34d399"/>

    <!-- Large Corkboard / Planning Board on Wall -->
    <rect x="135" y="30" width="80" height="55" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="142" y="37" width="22" height="18" rx="2" fill="#fbbf24" opacity="0.9"/>
    <circle cx="153" cy="37" r="2.5" fill="#ef4444"/>
    <rect x="170" y="37" width="22" height="18" rx="2" fill="#38bdf8" opacity="0.9"/>
    <circle cx="181" cy="37" r="2.5" fill="#ef4444"/>
    <rect x="142" y="60" width="35" height="18" rx="2" fill="#f472b6" opacity="0.9"/>
    <circle cx="159" cy="60" r="2.5" fill="#ef4444"/>
  </g>

  <!-- MAIN DESK & FOREGROUND PROPS -->
  <g id="desk-and-props">
    <!-- Large Curved Wooden Desk -->
    <path d="M 20 185 C 20 170 35 165 120 165 C 205 165 220 170 220 185 L 230 215 C 230 222 224 228 217 228 L 23 228 C 16 228 10 222 10 215 Z" fill="#334155"/>
    <path d="M 20 185 C 20 172 35 168 120 168 C 205 168 220 172 220 185 L 225 195 C 225 200 220 205 214 205 L 26 205 C 20 205 15 200 15 195 Z" fill="#475569"/>

    <!-- Laptop / Planner Screen -->
    <rect x="75" y="135" width="45" height="35" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <rect x="79" y="139" width="37" height="23" rx="1" fill="#0f172a"/>
    <!-- UI UI interface blocks inside laptop screen representing schedule arrangement -->
    <rect x="83" y="143" width="15" height="4" rx="1" fill="#38bdf8"/>
    <rect x="83" y="150" width="29" height="3" rx="1" fill="#334155"/>
    <rect x="83" y="156" width="20" height="3" rx="1" fill="#10b981"/>
    <!-- Laptop Base -->
    <path d="M 65 170 L 135 170 L 140 174 L 60 174 Z" fill="#94a3b8"/>

    <!-- Coffee Mug -->
    <rect x="175" y="160" width="14" height="18" rx="2" fill="#f8fafc"/>
    <path d="M 189 164 C 193 164 195 166 195 169 C 195 172 193 174 189 174" stroke="#f8fafc" stroke-width="2" fill="none"/>

    <!-- STICKY NOTES BEING ARRANGED (The core visual metaphor for 'sắp xếp' / organizing) -->
    <!-- Floating organized sticky notes with glowing trails indicating active arrangement -->
    <g filter="url(#dropShadow)">
      <!-- Note 1 (Green - Completed/Placed) -->
      <rect x="135" y="145" width="22" height="22" rx="2" fill="#34d399" transform="rotate(8 146 156)"/>
      <line x1="139" y1="151" x2="151" y2="151" stroke="#065f46" stroke-width="2" stroke-linecap="round" transform="rotate(8 146 156)"/>
      <line x1="139" y1="157" x2="147" y2="157" stroke="#065f46" stroke-width="2" stroke-linecap="round" transform="rotate(8 146 156)"/>

      <!-- Note 2 (Orange - Being moved/arranged) -->
      <g filter="url(#softGlow)">
        <rect x="115" y="115" width="24" height="24" rx="2" fill="#fb923c" transform="rotate(-12 127 127)"/>
        <line x1="120" y1="123" x2="134" y2="123" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" transform="rotate(-12 127 127)"/>
        <line x1="120" y1="129" x2="130" y2="129" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" transform="rotate(-12 127 127)"/>
      </g>
      
      <!-- Motion lines showing the arrangement action -->
      <path d="M 110 135 Q 122 145 135 155" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" opacity="0.8"/>
    </g>
  </g>

  <!-- CHARACTER: Teacher / Planner actively arranging -->
  <g id="character">
    <!-- Torso & Shoulders (Professional, friendly attire) -->
    <path d="M 95 195 C 95 175 110 165 130 165 C 150 165 165 175 165 195 L 170 230 L 90 230 Z" fill="#38bdf8"/>
    <!-- Collar/Necktie detail -->
    <polygon points="125,165 135,165 135,185 130,195 125,185" fill="#f8fafc"/>
    <polygon points="130,180 133,185 130,200 127,185" fill="#ef4444"/>

    <!-- Neck & Head -->
    <rect x="122" y="145" width="16" height="24" rx="8" fill="#ffedd5"/>
    <ellipse cx="130" cy="130" rx="22" ry="25" fill="#ffedd5"/>

    <!-- Hair (Stylish, modern layered haircut) -->
    <path d="M 108 125 C 108 108 120 102 132 102 C 148 102 154 112 154 125 C 154 128 152 130 152 130 C 152 130 150 115 135 112 C 120 109 110 120 108 125 Z" fill="#1e293b"/>

    <!-- Facial Expression (Enthusiastic, focused, smiling) -->
    <!-- Glasses (Smart teacher / planner aesthetic) -->
    <circle cx="120" cy="128" r="7" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="140" cy="128" r="7" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="127" y1="128" x2="133" y2="128" stroke="#0f172a" stroke-width="1.5"/>
    
    <!-- Eyes (Happy arcs) -->
    <path d="M 117 126 Q 120 123 123 126" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 137 126 Q 140 123 143 126" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Cheeks (Warm blush) -->
    <circle cx="116" cy="133" r="3" fill="#fca5a5" opacity="0.6"/>
    <circle cx="144" cy="133" r="3" fill="#fca5a5" opacity="0.6"/>

    <!-- Friendly Confident Smile -->
    <path d="M 125 137 Q 130 142 135 137" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms & Active Hands (Crucial for expressing 'sắp xếp' / arranging action) -->
    <!-- Right Arm reaching forward to place/organize note -->
    <path d="M 155 175 C 165 155 145 135 125 125" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
    <!-- Right Hand holding the orange sticky note -->
    <circle cx="120" cy="123" r="7" fill="#ffedd5"/>
    
    <!-- Left Arm gesturing dynamically (organizing motion) -->
    <path d="M 105 175 C 90 155 95 135 105 125" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round"/>
    <circle cx="107" cy="122" r="7" fill="#fdbf9e"/>
  </g>

  <!-- FOREGROUND ACCENTS & DEPTH ELEMENTS -->
  <!-- Floating decorative planning items (sparkles / schedule markers) -->
  <g id="sparkles">
    <path d="M 45 100 L 48 108 L 56 111 L 48 114 L 45 122 L 42 114 L 34 111 L 42 108 Z" fill="#fbbf24" opacity="0.9" filter="url(#softGlow)"/>
    <path d="M 205 90 L 207 95 L 212 97 L 207 99 L 205 104 L 203 99 L 198 97 L 203 95 Z" fill="#38bdf8" opacity="0.8" filter="url(#softGlow)"/>
    <circle cx="185" cy="115" r="3" fill="#f472b6" opacity="0.8"/>
    <circle cx="55" cy="155" r="2" fill="#34d399" opacity="0.8"/>
  </g>

  <!-- Vignette Border / Frame Polish -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>