<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Park Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Calendar Page Curl Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-Bleed Container -->
  <rect width="240" height="240" rx="24" fill="url(#skyGrad)" />

  <!-- Atmospheric Elements: Sun & Rays -->
  <circle cx="185" cy="65" r="45" fill="url(#sunGlow)" />
  <circle cx="185" cy="65" r="18" fill="#fef08a" />

  <!-- Background Park Hill & Trees -->
  <path d="M0 150 Q60 120 120 145 T240 135 L240 180 L0 180 Z" fill="#065f46" opacity="0.7" />
  
  <!-- Tree Left -->
  <path d="M35 140 Q40 110 55 115 Q70 110 75 130 Q90 140 80 160 L30 160 Z" fill="#047857" />
  <rect x="50" y="150" width="8" height="25" fill="#78350f" />

  <!-- Tree Right -->
  <path d="M190 130 Q205 105 215 120 Q230 115 235 135 Q245 155 225 165 L185 165 Z" fill="#059669" />
  <rect x="203" y="150" width="7" height="20" fill="#78350f" />

  <!-- Main Ground (Park Lawn) -->
  <path d="M0 165 Q70 150 140 162 T240 158 L240 240 L0 240 Z" fill="url(#groundGrad)" />
  
  <!-- Pathway curve -->
  <path d="M0 210 Q80 170 120 240 Z" fill="#d97706" opacity="0.3" />

  <!-- CENTRAL SUBJECT: Giant Wall Calendar / Flip Calendar representing Sunday/Weekend Outing -->
  <g filter="url(#softShadow)" transform="translate(65, 55)">
    <!-- Calendar Backplate / Shadow -->
    <rect x="-4" y="-4" width="118" height="118" rx="14" fill="#0f172a" opacity="0.3" />

    <!-- Calendar Base Card -->
    <rect width="110" height="112" rx="12" fill="#ffffff" />
    
    <!-- Red Calendar Header Banner -->
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 98 0 A 12 12 0 0 1 110 12 L 110 32 L 0 32 Z" fill="#ef4444" />
    
    <!-- Header Ring Bindings -->
    <rect x="25" y="-6" width="10" height="12" rx="4" fill="#cbd5e1" />
    <rect x="75" y="-6" width="10" height="12" rx="4" fill="#cbd5e1" />
    <circle cx="30" cy="0" r="3" fill="#64748b" />
    <circle cx="80" cy="0" r="3" fill="#64748b" />

    <!-- Calendar Header Deco (Sun Icon inside calendar top) -->
    <circle cx="55" cy="16" r="8" fill="#fef08a" />
    <path d="M55 5 L55 7 M55 25 L55 27 M44 16 L46 16 M64 16 L66 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Calendar Body / Date Grid Representation -->
    <!-- Day Number (Stylized large friendly digits) -->
    <text x="55" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#1e293b" text-anchor="middle">SUN</text>

    <!-- Mini decorative grid dots (representing days of the month) -->
    <circle cx="28" cy="94" r="3" fill="#cbd5e1" />
    <circle cx="41" cy="94" r="3" fill="#cbd5e1" />
    <circle cx="54" cy="94" r="3" fill="#ef4444" /> <!-- Highlighted Sunday dot -->
    <circle cx="67" cy="94" r="3" fill="#cbd5e1" />
    <circle cx="80" cy="94" r="3" fill="#cbd5e1" />
  </g>

  <!-- FOREGROUND ACTION PROPS: Picnic Basket, Kite, and Leisure Objects -->
  <!-- Picnic Basket on the grass -->
  <g transform="translate(25, 175)">
    <!-- Basket Handle -->
    <path d="M 6 -8 C 6 -20, 30 -20, 30 -8" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round" />
    <!-- Basket Body -->
    <rect x="0" y="-8" width="36" height="24" rx="4" fill="#d97706" />
    <rect x="-2" y="-10" width="40" height="6" rx="2" fill="#b45309" />
    <!-- Weave texture lines -->
    <line x1="6" y1="-8" x2="6" y2="16" stroke="#92400e" stroke-width="1.5" />
    <line x1="18" y1="-8" x2="18" y2="16" stroke="#92400e" stroke-width="1.5" />
    <line x1="30" y1="-8" x2="30" y2="16" stroke="#92400e" stroke-width="1.5" />
    <line x1="0" y1="4" x2="36" y2="4" stroke="#92400e" stroke-width="1.5" />
    <!-- Cloth poking out -->
    <path d="M 2 -10 Q 18 -18 34 -10 Q 38 -4 34 -2 Q 18 -6 2 -2 Q -2 -4 2 -10 Z" fill="#f8fafc" />
  </g>

  <!-- Red Kite Floating near top-left / mid-air -->
  <g transform="translate(185, 130) rotate(-15)">
    <!-- Kite String -->
    <path d="M 0 0 C -40 30, -80 50, -125 70" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" />
    <!-- Kite Body (Diamond) -->
    <polygon points="0,-18 14,0 0,18 -14,0" fill="#ec4899" />
    <polygon points="0,-18 0,18 14,0" fill="#f43f5e" />
    <path d="M-14 0 L14 0 M0 -18 L0 18" stroke="#ffe4e6" stroke-width="1" />
    <!-- Kite Bows -->
    <path d="M -4 10 C -8 14, -8 18, -4 22 C 0 18, 0 14, -4 10 Z" fill="#38bdf8" />
    <path d="M 4 20 C 0 24, 0 28, 4 32 C 8 28, 8 24, 4 20 Z" fill="#38bdf8" />
  </g>

  <!-- Cute Yellow Butterfly flying near the calendar -->
  <g transform="translate(165, 80) scale(0.7)">
    <path d="M 0 0 Q -15 -15 -10 -25 Q 0 -15 0 0 Z" fill="#fbbf24" />
    <path d="M 0 0 Q 15 -15 10 -25 Q 0 -15 0 0 Z" fill="#fbbf24" />
    <path d="M 0 0 Q -12 10 -5 15 Q 0 5 0 0 Z" fill="#f59e0b" />
    <path d="M 0 0 Q 12 10 5 15 Q 0 5 0 0 Z" fill="#f59e0b" />
    <line x1="0" y1="0" x2="0" y2="8" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="0" cy="-2" r="1.5" fill="#1e293b" />
  </g>

  <!-- Sparkling Sunshine / Fun outdoor vibes -->
  <g fill="#fef08a">
    <circle cx="35" cy="50" r="2.5" opacity="0.8" />
    <circle cx="25" cy="85" r="2" opacity="0.6" />
    <circle cx="210" cy="180" r="3" opacity="0.7" />
    <circle cx="160" cy="190" r="2" opacity="0.5" />
    <!-- Star sparkles -->
    <path d="M 195 95 L 197 100 L 202 102 L 197 104 L 195 109 L 193 104 L 188 102 L 193 100 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M 48 35 L 49 38 L 52 39 L 49 40 L 48 43 L 47 40 L 44 39 L 47 38 Z" fill="#fbbf24" opacity="0.6" />
  </g>

</svg>